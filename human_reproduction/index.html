<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人類受精與胚胎發育動態模擬器</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #ec4899;
            --accent-hover: #db2777;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            color: #fce7f3;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .simulator-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            max-width: 1000px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            overflow: hidden;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .canvas-wrapper.is-panning {
            cursor: grabbing;
        }

        .canvas-overlay-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            pointer-events: none;
            z-index: 20;
        }

        .zoom-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 4px 6px;
            pointer-events: auto;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }

        .zoom-toolbar button {
            background: #334155;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
            line-height: 1;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .zoom-toolbar button:hover {
            background: #475569;
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .canvas-hint {
            background: rgba(15, 23, 42, 0.75);
            color: #94a3b8;
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .stage-banner {
            background-color: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stage-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f472b6;
        }

        .stage-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .day-counter {
            background: #334155;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #38bdf8;
            white-space: nowrap;
            margin-left: 15px;
        }

        .controls {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--panel-bg);
        }

        .timeline-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--accent);
            height: 6px;
            background: #334155;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
        }

        .left-btns, .right-btns, .stage-jumps {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background-color: #334155;
            color: var(--text-main);
            border: 1px solid #475569;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button:hover {
            background-color: #475569;
        }

        button.primary {
            background-color: var(--accent);
            border-color: var(--accent);
            font-weight: bold;
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        button.active-toggle {
            background-color: #0284c7;
            border-color: #38bdf8;
        }

        .mode-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .mode-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .mode-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-right: 2px;
        }

        .mode-btn, .placenta-btn {
            font-size: 0.8rem;
            padding: 5px 10px;
            background-color: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
        }

        .mode-btn.active {
            background-color: rgba(236, 72, 153, 0.2);
            border-color: #f472b6;
            color: #fce7f3;
            font-weight: 600;
        }

        .placenta-btn.active {
            background-color: rgba(14, 165, 233, 0.22);
            border-color: #38bdf8;
            color: #e0f2fe;
            font-weight: 600;
        }

        .placenta-badge {
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.14);
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #bae6fd;
        }

        .stage-btn {
            font-size: 0.78rem;
            padding: 5px 8px;
            background-color: #1e293b;
        }

        .stage-btn.current {
            border-color: #f472b6;
            color: #f472b6;
            background-color: rgba(244, 114, 182, 0.1);
        }

        select {
            background-color: #334155;
            color: var(--text-main);
            border: 1px solid #475569;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>人類生殖、受精、胚胎發育與分娩動態模擬器</h1>
    </header>

    <div class="simulator-container">
        <div class="stage-banner">
            <div>
                <div class="stage-title" id="stageTitle">階段 1：排卵 (Ovulation)</div>
                <div class="stage-desc" id="stageDesc">卵巢中的成熟濾泡破裂，釋出次級卵母細胞（卵子），經由輸卵管傘部進入輸卵管。</div>
            </div>
            <div class="day-counter" id="dayCounter">排卵日 (Day 0)</div>
        </div>

        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="simCanvas" width="1000" height="625"></canvas>
            <div class="canvas-overlay-controls">
                <div class="zoom-toolbar">
                    <button id="zoomInBtn" title="放大視角 (滾輪向上 / 快捷鍵 +)">➕ 放大</button>
                    <button id="zoomOutBtn" title="縮小視角 (滾輪向下 / 快捷鍵 -)">➖ 縮小</button>
                    <button id="zoomResetBtn" title="重設縮放與位置 (雙擊畫布 / 快捷鍵 0)">↺ <span id="zoomLevelText">100%</span></button>
                </div>
                <div class="canvas-hint">💡 滑鼠滾輪縮放 • 拖曳平移 • 雙擊重設</div>
            </div>
        </div>

        <div class="controls">
            <div class="mode-bar">
                <div class="mode-group">
                    <span class="mode-label">顯示模式：</span>
                    <button class="mode-btn active" data-mode="singleton">單胞胎</button>
                    <button class="mode-btn" data-mode="identical">同卵雙胞胎 (同卵雙生)</button>
                    <button class="mode-btn" data-mode="fraternal">異卵雙胞胎 (異卵雙生)</button>
                </div>
                <div class="mode-group" id="placentaSelectorGroup">
                    <span class="mode-label">胎盤方式：</span>
                    <span class="placenta-badge" id="placentaFixedBadge">單一胎盤・單一羊膜囊</span>
                    <button class="placenta-btn active" data-placenta="mcda" style="display:none;" title="第4-8天分裂，約佔同卵70%">共用胎盤・獨立羊膜囊 (MCDA)</button>
                    <button class="placenta-btn" data-placenta="mcma" style="display:none;" title="第8-12天分裂，罕見約1-2%">共用胎盤・共用羊膜囊 (MCMA)</button>
                    <button class="placenta-btn" data-placenta="dcda" style="display:none;" title="第1-3天早期分裂，約佔同卵25-30%">獨立胎盤・獨立羊膜囊 (DCDA)</button>
                </div>
            </div>

            <div class="timeline-container">
                <span style="font-size: 0.85rem; color: var(--text-muted);">進度</span>
                <input type="range" id="timeline" min="0" max="1000" value="0">
                <span id="progressText" style="font-size: 0.85rem; width: 45px; text-align: right;">0%</span>
            </div>

            <div class="btn-group">
                <div class="left-btns">
                    <button id="playPauseBtn" class="primary">⏸ 暫停</button>
                    <button id="resetBtn">↺ 重置</button>
                    <select id="speedSelect">
                        <option value="0.5">0.5x 慢速</option>
                        <option value="1" selected>1.0x 正常</option>
                        <option value="2">2.0x 快速</option>
                    </select>
                </div>

                <div class="stage-jumps">
                    <button class="stage-btn current" data-time="0">1.排卵</button>
                    <button class="stage-btn" data-time="100">2.精子游入</button>
                    <button class="stage-btn" data-time="200">3.顯微受精</button>
                    <button class="stage-btn" data-time="340">4.卵裂發育</button>
                    <button class="stage-btn" data-time="490">5.著床</button>
                    <button class="stage-btn" data-time="590">6.胎兒發育</button>
                    <button class="stage-btn" data-time="760">7.分娩</button>
                    <button class="stage-btn" data-time="900">8.排出胎盤</button>
                </div>

                <div class="right-btns">
                    <button id="toggleLabelsBtn" class="active-toggle">🏷️ 標籤: 顯示</button>
                </div>
            </div>
        </div>
    </div>

<script>
/**
 * 模擬器核心邏輯與繪圖引擎
 * 時間軸 t 範圍：0.000 ~ 1.000
 */
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const canvasWrapper = document.getElementById('canvasWrapper');

// 狀態變數
let t = 0; // 0.0 ~ 1.0
let isPlaying = true;
let playbackSpeed = 1.0;
let showLabels = true;
let pregnancyMode = 'singleton'; // 'singleton' | 'identical' | 'fraternal'
let placentaType = 'mcda';       // 'mcda' | 'mcma' | 'dcda' (同卵雙胞胎用)
const baseDuration = 60000;      // 1x 速度下完整播放需 60 秒
let lastTimestamp = 0;

function isTwinMode() {
    return pregnancyMode !== 'singleton';
}

function getEffectivePlacentaType() {
    if (pregnancyMode === 'singleton') return 'single';
    if (pregnancyMode === 'fraternal') return 'dcda';
    return placentaType;
}

// Pan & Zoom (平移與縮放) 狀態
let zoom = 1.0;
let panX = 0;
let panY = 0;
let isPanning = false;
let startX = 0;
let startY = 0;
const minZoom = 0.8;
const maxZoom = 4.5;

// UI 元素
const timeline = document.getElementById('timeline');
const progressText = document.getElementById('progressText');
const playPauseBtn = document.getElementById('playPauseBtn');
const resetBtn = document.getElementById('resetBtn');
const speedSelect = document.getElementById('speedSelect');
const toggleLabelsBtn = document.getElementById('toggleLabelsBtn');
const stageTitle = document.getElementById('stageTitle');
const stageDesc = document.getElementById('stageDesc');
const dayCounter = document.getElementById('dayCounter');
const stageBtns = document.querySelectorAll('.stage-btn');
const modeBtns = document.querySelectorAll('.mode-btn');
const placentaBtns = document.querySelectorAll('.placenta-btn');
const placentaFixedBadge = document.getElementById('placentaFixedBadge');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const zoomResetBtn = document.getElementById('zoomResetBtn');
const zoomLevelText = document.getElementById('zoomLevelText');

// 定義 8 個階段資訊 (支援單胞胎 / 同卵雙生 / 異卵雙生與胎盤方式動態說明)
const stages = [
    {
        start: 0.00, end: 0.10,
        title: (m) => m === 'fraternal' ? "階段 1：雙側排卵 (Dual Ovulation)" : "階段 1：排卵 (Ovulation)",
        desc: (m) => m === 'fraternal'
            ? "左右兩側卵巢同時各有一個成熟濾泡破裂，排出兩顆獨立的卵子，分別由左右輸卵管傘部吸入壺腹部，破裂濾泡轉變為黃體。"
            : "卵巢內的成熟濾泡（格拉夫氏濾泡）破裂，排出單顆卵子。輸卵管傘部擺動將卵子吸入輸卵管壺腹部，破裂濾泡轉變為黃體。",
        day: () => "排卵日 (Day 0)"
    },
    {
        start: 0.10, end: 0.20,
        title: () => "階段 2：精子游入 (Sperm Migration)",
        desc: (m) => m === 'fraternal'
            ? "數以千萬計的精子經陰道與子宮頸游入子宮腔，兵分兩路游向左右兩側輸卵管壺腹部，分別尋找兩顆卵子。"
            : "數以千萬計的精子從陰道經過子宮頸進入子宮腔，少數強壯的精子游向排卵側的輸卵管壺腹部尋找卵子。",
        day: () => "受精前數小時"
    },
    {
        start: 0.20, end: 0.34,
        title: (m) => m === 'fraternal' ? "階段 3：雙卵受精 - 顯微放大 (Dizygotic Fertilization)" : "階段 3：受精過程 - 顯微放大 (Fertilization)",
        desc: (m) => {
            if (m === 'fraternal') return "左右兩顆卵子各自與一隻不同的精子結合，透明帶各自硬化阻止多精受精，形成兩顆基因獨立的受精卵（異卵雙生）。";
            if (m === 'identical') return "單一精子穿透單顆卵子並發生皮質反應，雌雄原核融合形成單一受精卵（即將在早期發育中分裂為基因相同的同卵雙胞胎）。";
            return "精子釋放頂體酶穿過放射冠與透明帶。單一精子進入後，透明帶立即發生「皮質反應」硬化阻止其他精子進入，雌雄原核融合形成合子。";
        },
        day: () => "第 1 天 (受精)"
    },
    {
        start: 0.34, end: 0.49,
        title: (m) => m === 'identical' ? "階段 4：卵裂與同卵分裂 (Cleavage & Splitting)" : "階段 4：卵裂與囊胚形成 (Cleavage & Blastocyst)",
        desc: (m, pt) => {
            if (m === 'fraternal') return "兩顆獨立受精卵分別在左右輸卵管進行卵裂（2→4→8細胞→桑椹胚→囊胚），各自形成獨立的滋養層與內細胞群。";
            if (m === 'identical') {
                if (pt === 'dcda') return "受精卵在極早期（第 1–3 天，卵裂期）完全分裂為兩個獨立胚胎，分別發育為兩顆獨立囊胚，未來各自形成獨立胎盤與羊膜囊（DCDA）。";
                if (pt === 'mcda') return "受精卵先發育為單一囊胚（共用滋養層），於第 4–8 天時「內細胞群」分裂為二，未來將共用同一胎盤但各自擁有獨立羊膜囊（MCDA，最常見）。";
                return "受精卵發育為單一囊胚並共用滋養層與內細胞群，預計於著床後較晚時期（第 8–12 天）才分裂，未來將共用胎盤與單一羊膜囊（MCMA，罕見）。";
            }
            return "受精卵藉輸卵管纖毛擺動移向子宮，同時進行有絲分裂：2細胞 → 4細胞 → 8細胞 → 桑椹胚(16-32細胞) → 形成具空腔的囊胚。";
        },
        day: (p) => `第 ${Math.floor(2 + p * 4)} 天`
    },
    {
        start: 0.49, end: 0.59,
        title: () => "階段 5：著床 (Implantation)",
        desc: (m, pt) => {
            if (m === 'fraternal') return "兩顆獨立囊胚分別進入子宮腔並孵化，各自侵入子宮左右兩側增厚的內膜壁，準備建立兩個完全獨立的胎盤。";
            if (m === 'identical' && pt === 'dcda') return "早期分裂出的兩顆基因相同囊胚進入子宮腔後分開著床於左右兩側內膜，各自發育獨立胎盤（DCDA）。";
            if (m === 'identical' && pt === 'mcda') return "單一囊胚（內含兩組內細胞群）著床於子宮內膜同一位置，共用同一層滋養層發育為單一共用胎盤，並各自形成獨立羊膜囊。";
            if (m === 'identical' && pt === 'mcma') return "單一囊胚著床於子宮內膜，並在單一羊膜腔形成後分裂為兩個胚胎，共同使用同一個胎盤與同一個羊膜囊。";
            return "囊胚抵達子宮腔，透明帶消失（孵化），滋養層細胞分泌酵素並侵入增厚且富含血管的子宮內膜，完成著床。";
        },
        day: (p) => `第 ${Math.floor(6 + p * 4)} 天`
    },
    {
        start: 0.59, end: 0.76,
        title: (m) => m === 'singleton' ? "階段 6：胚胎發育成胎兒 (Embryo to Fetus)" : "階段 6：雙胞胎發育與胎盤使用 (Twin Development)",
        desc: (m, pt) => {
            if (m === 'fraternal') return "異卵雙胞胎（DCDA）：兩胎兒各有獨立胎盤與獨立羊膜囊，兩條臍帶分別連接各自胎盤；基因約 50% 相同（如一般手足）。足月前轉為頭位準備分娩。";
            if (m === 'identical') {
                if (pt === 'dcda') return "同卵雙胞胎（DCDA 獨立胎盤）：兩胎兒基因 100% 相同，各自擁有獨立胎盤、臍帶與羊膜囊，營養供應互不干擾。";
                if (pt === 'mcda') return "同卵雙胞胎（MCDA 共用胎盤・獨立羊膜囊）：兩條臍帶共同連接於同一個大型胎盤以獲取養分，中間由「羊膜隔膜」隔開為兩個獨立羊水空間。";
                return "同卵雙胞胎（MCMA 共用胎盤・共用羊膜囊）：兩胎兒共享同一個胎盤並同處於單一羊膜囊內（無隔膜），兩條臍帶皆接於同一胎盤。";
            }
            return "子宮內膜與滋養層共同形成胎盤，羊膜囊充滿羊水保護胚胎。胎兒器官迅速分化成熟，心臟跳動，足月前逐漸轉為頭朝下姿勢準備分娩。";
        },
        day: (p) => `第 ${Math.floor(2 + p * 36)} 週`
    },
    {
        start: 0.76, end: 0.90,

// 輔助數學函數
function lerp(a, b, u) { return a + (b - a) * u; }
function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
function norm(val, min, max) { return clamp((val - min) / (max - min), 0, 1); }
function smoothstep(u) { const c = clamp(u, 0, 1); return c * c * (3 - 2 * c); }

// 取得子宮隨懷孕與產後復原的縮放比例
function getPregScale(time) {
    const maxScale = isTwinMode() ? 1.24 : 1.18;
    if (time <= 0.59) return 1.0;
    if (time <= 0.76) return lerp(1.0, maxScale, smoothstep(norm(time, 0.59, 0.76)));
    if (time <= 0.90) {
        const laborP = norm(time, 0.76, 0.90);
        const squeeze = Math.pow(Math.sin(laborP * Math.PI * 6), 2) * 0.018;
        return maxScale - squeeze;
    }
    return lerp(maxScale, 1.04, smoothstep(norm(time, 0.90, 1.00)));
}

// 取得子宮頸與陰道在分娩期的擴張程度 (0.0 ~ 1.0)
function getCervixDilate(time) {
    if (time < 0.76) return 0;
    if (time <= 0.80) return smoothstep(norm(time, 0.76, 0.80));
    if (time <= 0.90) return 1.0;
    if (time <= 0.97) return lerp(1.0, 0.65, norm(time, 0.90, 0.97));
    return lerp(0.65, 0.22, norm(time, 0.97, 1.00));
}

// Catmull-Rom 樣條曲線計算函數 (平滑自然通過每個控制點)
function getCatmullRomPoint(p0, p1, p2, p3, u) {
    const u2 = u * u;
    const u3 = u2 * u;
    return {
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * u + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * u2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * u3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * u + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * u2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * u3)
    };
}

function getSplinePoint(pts, progress) {
    const p = clamp(progress, 0, 1) * (pts.length - 1);
    const i = Math.floor(p);
    const frac = p - i;
    if (i >= pts.length - 1) return pts[pts.length - 1];
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[Math.min(pts.length - 1, i + 1)];
    const p3 = pts[Math.min(pts.length - 1, i + 2)];
    return getCatmullRomPoint(p0, p1, p2, p3, frac);
}

    let pt;
    if (time < 0.015) {
        pt = tubeWaypointsRight[0];
    } else if (time <= 0.10) {
        // 階段 1：排卵進入輸卵管壺腹部
        const ease = smoothstep(norm(time, 0.015, 0.10));
        pt = getSplinePoint(tubeWaypointsRight, lerp(0.0, 0.4444, ease));
    } else if (time <= 0.34) {
        // 階段 2 與 3：停留在輸卵管壺腹部等待受精
        pt = getSplinePoint(tubeWaypointsRight, 0.4444);
    } else if (time <= 0.49) {
        // 階段 4：卵裂同時移向子宮腔
        const ease = smoothstep(norm(time, 0.34, 0.49));
        pt = getSplinePoint(tubeWaypointsRight, lerp(0.4444, 0.7777, ease));
    } else if (time <= 0.58) {
        // 階段 5：在子宮腔游走並著床入子宮內膜
        const ease = smoothstep(norm(time, 0.49, 0.58));
        pt = getSplinePoint(tubeWaypointsRight, lerp(0.7777, 1.0, ease));
    } else {
        pt = tubeWaypointsRight[9];
    }
    return side === 'left' ? { x: 1000 - pt.x, y: pt.y } : pt;

// 取得精子游動路徑位置與切線方向
function getSpermPosition(prog, goRight) {
    let pt, tangent;
    if (prog < 0.55) {
        const u = prog / 0.55;
        const lowerPts = goRight ? lowerRouteRight : lowerRouteRight.map(p => ({ x: 1000 - p.x, y: p.y }));
        pt = getSplinePoint(lowerPts, u);
        const ptNext = getSplinePoint(lowerPts, Math.min(1, u + 0.02));
        tangent = { x: ptNext.x - pt.x, y: ptNext.y - pt.y };
    } else {
        const u = (prog - 0.55) / 0.45;
        const splineProg = lerp(0.7777, 0.4444, u);
        const rawPt = getSplinePoint(tubeWaypointsRight, splineProg);
        const rawNext = getSplinePoint(tubeWaypointsRight, Math.max(0, splineProg - 0.015));
        if (goRight) {
            pt = rawPt;
            tangent = { x: rawNext.x - rawPt.x, y: rawNext.y - rawPt.y };
        } else {
            pt = { x: 1000 - rawPt.x, y: rawPt.y };
            tangent = { x: -(rawNext.x - rawPt.x), y: rawNext.y - rawPt.y };
        }
    }
    return { pt, tangent };
}

// 繪製卵巢與濾泡/黃體變化
function drawOvary(cx, cy, isActive, time, side = 'right') {
    ctx.save();
    ctx.fillStyle = '#fde68a';
    ctx.strokeStyle = '#b45309';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 42, 28, side === 'right' ? -0.2 : 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 原始小濾泡點綴
    ctx.fillStyle = '#f59e0b';
    const offsets = [[-20, -8], [-10, 12], [15, 10], [-25, 5]];
    offsets.forEach(([ox, oy]) => {
        ctx.beginPath();
        ctx.arc(cx + ox, cy + oy, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    if (isActive) {
        const fx = side === 'right' ? cx + 8 : cx - 8;
        const fy = cy - 8;
        if (time < 0.035) {
            const swell = norm(time, 0, 0.025);
            ctx.fillStyle = '#fef3c7';
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(fx, fy, 12 + swell * 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#bae6fd';
            ctx.beginPath();
            ctx.arc(fx, fy, 8 + swell * 4, 0, Math.PI * 2);
            ctx.fill();
        } else {
            const clGrowth = norm(time, 0.035, 0.20);
            const clSize = lerp(10, 16, clGrowth);
            ctx.fillStyle = '#eab308';
            ctx.strokeStyle = '#ca8a04';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 2; a += 0.4) {
                const r = clSize + Math.sin(a * 5) * 2.5;
                const px = fx + Math.cos(a) * r;
                const py = cy - 6 + Math.sin(a) * r;
                if (a === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    }
    ctx.restore();
}

// 繪製精子群游動 (支援單側排卵與異卵雙側排卵)
function drawSpermSwarm(time) {
    if (time < 0.09 || time > 0.39) return;

    const fade = time > 0.33 ? 1 - norm(time, 0.33, 0.39) : 1;
    const baseProgress = norm(time, 0.10, 0.21);
    const isFraternal = pregnancyMode === 'fraternal';

    ctx.save();
    sperms.forEach(sp => {
        const goRight = isFraternal ? sp.fraternalGoRight : sp.defaultGoRight;
        const isWinner = (sp.id === 0) || (isFraternal && sp.id === 1);

        let p = baseProgress * sp.speedFactor;
        if (!isWinner && p > 0.98) {
            p = 0.98 + Math.sin(time * 28 + sp.phase) * 0.012;
        }
        if (isWinner && time > 0.27) {
            return;
        }
        p = clamp(p, 0, 1);

        const { pt, tangent } = getSpermPosition(p, goRight);
        let angle = Math.atan2(tangent.y, tangent.x);

        const len = Math.hypot(tangent.x, tangent.y) || 1;
        const nx = -tangent.y / len;
        const ny = tangent.x / len;

        let maxSpread = 4.2;
        if (p < 0.25) maxSpread = 14;
        else if (p < 0.55) maxSpread = lerp(14, 5, (p - 0.25) / 0.30);

        let sx = pt.x + nx * (sp.lateralOffset * maxSpread);
        let sy = pt.y + ny * (sp.lateralOffset * maxSpread);

        const hasEggHere = goRight || isFraternal;
        if (p >= 0.97 && hasEggHere) {
            const eggAmpulla = goRight ? { x: 722, y: 156 } : { x: 278, y: 156 };
            if (isWinner) {
                const winP = norm(time, 0.20, 0.26);
                const approachDist = lerp(18, 0, winP);
                sx = eggAmpulla.x + approachDist * Math.cos(sp.phase * 0.2);
                sy = eggAmpulla.y + approachDist * Math.sin(sp.phase * 0.2);
                angle = Math.atan2(eggAmpulla.y - sy, eggAmpulla.x - sx);
            } else {
                const orbitR = 14 + (sp.id % 4) * 2;
                const orbAng = sp.phase + time * (10 + (sp.id % 5) * 3);
                sx = eggAmpulla.x + Math.cos(orbAng) * orbitR;
                sy = eggAmpulla.y + Math.sin(orbAng) * orbitR;
                angle = orbAng + Math.PI;
            }
        }

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(angle);
        ctx.globalAlpha = fade * 0.92;

        const isLeftWinner = isFraternal && sp.id === 1;
        ctx.strokeStyle = isLeftWinner ? '#6ee7b7' : (isWinner ? '#7dd3fc' : '#e2e8f0');
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-3, 0);
        for (let i = 1; i <= sp.tailLength; i++) {
            const wy = Math.sin(time * sp.wiggleFreq + sp.phase - i * 0.65) * (i * 0.35);
            ctx.lineTo(-3 - i * 1.3, wy);
        }
        ctx.stroke();

        ctx.fillStyle = isLeftWinner ? '#10b981' : (isWinner ? '#38bdf8' : '#ffffff');
        ctx.beginPath();
        ctx.ellipse(0, 0, 3.2, 1.9, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    });
    ctx.restore();
}

// 繪製單顆宏觀卵子/卵裂/囊胚實體
function drawSingleMacroEmbryo(x, y, time, opts = {}) {
    const {
        cellFill = '#f472b6',
        cellStroke = '#be185d',
        icmColor = '#38bdf8',
        maleColor = '#0284c7',
        zygoteColor = '#9333ea',
        dualICM = false,
        implantSide = 'right',
        scale = 1.0
    } = opts;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    if (time < 0.34) {
        // 排卵 ~ 受精階段
        ctx.fillStyle = 'rgba(253, 224, 71, 0.25)';
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();

        const fertilized = time > 0.26;
        ctx.strokeStyle = fertilized ? icmColor : '#fde047';
        ctx.lineWidth = 2.5;
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (time > 0.26 && time < 0.32) {
            const merge = norm(time, 0.26, 0.32);
            ctx.fillStyle = '#ca8a04';
            ctx.beginPath(); ctx.arc(-3 * (1 - merge), 0, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = maleColor;
            ctx.beginPath(); ctx.arc(3 * (1 - merge), 0, 2.5, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = fertilized ? zygoteColor : '#ca8a04';
            ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, Math.PI * 2); ctx.fill();
        }
    } else if (time < 0.46) {
        // 卵裂期
        const cleaveP = norm(time, 0.34, 0.46);
        ctx.strokeStyle = icmColor;
        ctx.lineWidth = 2;
        ctx.fillStyle = 'rgba(30, 41, 59, 0.5)';
        ctx.beginPath();
        ctx.arc(0, 0, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = cellFill;
        ctx.strokeStyle = cellStroke;
        ctx.lineWidth = 1;

        if (cleaveP < 0.25) {
            [-4, 4].forEach(ox => {
                ctx.beginPath(); ctx.arc(ox, 0, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            });
        } else if (cleaveP < 0.50) {
            [[-3.5, -3.5], [3.5, -3.5], [-3.5, 3.5], [3.5, 3.5]].forEach(([ox, oy]) => {
                ctx.beginPath(); ctx.arc(ox, oy, 4.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            });
        } else if (cleaveP < 0.75) {
            for (let i = 0; i < 7; i++) {
                const a = (i / 6) * Math.PI * 2;
                const r = i === 6 ? 0 : 4.8;
                ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 3.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
        } else {
            for (let i = 0; i < 14; i++) {
                const a = i * 2.4;
                const r = Math.sqrt(i) * 2.1;
                ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 2.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
        }
    } else {
        // 囊胚期與著床
        const implantP = norm(time, 0.51, 0.59);
        const radius = lerp(12, 16, implantP);

        if (implantP > 0.1) {
            ctx.strokeStyle = cellFill;
            ctx.lineWidth = 2;
            const baseAngle = implantSide === 'left' ? Math.PI : 0;
            for (let a = -0.9; a <= 0.9; a += 0.3) {
                const ang = baseAngle + a;
                ctx.beginPath();
                ctx.moveTo(Math.cos(ang) * radius * 0.8, Math.sin(ang) * radius * 0.8);
                ctx.lineTo(Math.cos(ang) * (radius + implantP * 9), Math.sin(ang) * (radius + implantP * 9));
                ctx.stroke();
            }
        }

        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = cellFill;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 內細胞群 (Inner Cell Mass)
        ctx.fillStyle = icmColor;
        if (dualICM) {
            // MCDA 同卵雙生：單一囊胚內出現兩個內細胞群！
            [-5, 5].forEach(cyOff => {
                for (let i = 0; i < 4; i++) {
                    const ox = 3 + (i % 2) * 3 - 1.5;
                    const oy = cyOff + (Math.floor(i / 2) - 0.5) * 2.8;
                    ctx.beginPath();
                    ctx.arc(ox, oy, 2.4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        } else {
            const xDir = implantSide === 'left' ? -1 : 1;
            for (let i = 0; i < 7; i++) {
                const ox = xDir * (4 + (i % 3) * 2.5 - 2);
                const oy = (Math.floor(i / 3) - 1) * 3;
                ctx.beginPath();
                ctx.arc(ox, oy, 2.8, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    ctx.restore();
}

// 繪製宏觀視角下的卵子、卵裂胚胎、囊胚 (依模式呈現單胞胎/同卵分裂/異卵雙顆)
function drawMacroEggAndEmbryo(time) {
    if (time > 0.59) return;

    const pType = getEffectivePlacentaType();

    if (pregnancyMode === 'singleton') {
        const pos = getEggPosition(time, 'right');
        drawSingleMacroEmbryo(pos.x, pos.y, time, { implantSide: 'right' });
    } else if (pregnancyMode === 'fraternal') {
        // 異卵雙胞胎：左右輸卵管各一顆，不同基因代表色
        const posR = getEggPosition(time, 'right');
        const posL = getEggPosition(time, 'left');
        drawSingleMacroEmbryo(posR.x, posR.y, time, {
            cellFill: '#f472b6', cellStroke: '#be185d', icmColor: '#38bdf8',
            maleColor: '#0284c7', zygoteColor: '#9333ea', implantSide: 'right'
        });
        drawSingleMacroEmbryo(posL.x, posL.y, time, {
            cellFill: '#fbbf24', cellStroke: '#b45309', icmColor: '#34d399',
            maleColor: '#10b981', zygoteColor: '#059669', implantSide: 'left'
        });
    } else {
        // 同卵雙胞胎
        const posR = getEggPosition(time, 'right');
        if (pType === 'dcda' && time >= 0.37) {
            // 早期分裂 (Day 1-3)：分裂為兩個獨立胚胎，進入子宮腔後分別著床於左右兩側
            if (time < 0.49) {
                const splitP = smoothstep(norm(time, 0.37, 0.43));
                const sep = splitP * 9;
                drawSingleMacroEmbryo(posR.x - sep, posR.y - sep * 0.4, time, { scale: 0.85, implantSide: 'left' });
                drawSingleMacroEmbryo(posR.x + sep, posR.y + sep * 0.4, time, { scale: 0.85, implantSide: 'right' });
            } else {
                // 進入子宮腔後，一個往右側著床，一個橫越子宮腔往左側著床
                const impU = smoothstep(norm(time, 0.49, 0.58));
                const leftTarget = { x: 450, y: 265 };
                const startEntry = { x: 530, y: 210 };
                const lx = lerp(startEntry.x, leftTarget.x, impU);
                const ly = lerp(startEntry.y, leftTarget.y, impU);
                drawSingleMacroEmbryo(lx, ly, time, { scale: 0.9, implantSide: 'left' });
                drawSingleMacroEmbryo(posR.x, posR.y, time, { scale: 0.9, implantSide: 'right' });
            }
        } else {
            // MCDA (單一囊胚雙內細胞群) 或 MCMA (單一囊胚著床後分裂)
            drawSingleMacroEmbryo(posR.x, posR.y, time, {
                dualICM: pType === 'mcda' && time >= 0.46,
                implantSide: 'right'
            });
        }
    }
}

// 繪製階段 3 與階段 4 的顯微放大視窗 (PIP)
function drawMicroscopeZoom(time, currentZoom, currentPanX, currentPanY) {
    if (time < 0.18 || time > 0.50) return;

    const alpha = time < 0.20 ? norm(time, 0.18, 0.20) : (time > 0.48 ? 1 - norm(time, 0.48, 0.50) : 1);
    const eggPos = getEggPosition(time, 'right');

    const zoomX = 185;
    const zoomY = 460;
    const zoomR = 120;

    const eggScreenX = eggPos.x * currentZoom + currentPanX;
    const eggScreenY = eggPos.y * currentZoom + currentPanY;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 投影指引線
    if (eggScreenX > -80 && eggScreenX < canvas.width + 80 && eggScreenY > -80 && eggScreenY < canvas.height + 80) {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(eggScreenX, eggScreenY);
        ctx.lineTo(zoomX + zoomR * 0.6, zoomY - zoomR * 0.8);
        ctx.moveTo(eggScreenX, eggScreenY);
        ctx.lineTo(zoomX + zoomR * 0.9, zoomY + zoomR * 0.2);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // 圓形視窗裁切
    ctx.save();
    ctx.beginPath();
    ctx.arc(zoomX, zoomY, zoomR, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = '#090d16';
    ctx.fillRect(zoomX - zoomR, zoomY - zoomR, zoomR * 2, zoomR * 2);

    ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
    ctx.lineWidth = 1;
    for (let g = -zoomR; g <= zoomR; g += 25) {
        ctx.beginPath(); ctx.moveTo(zoomX + g, zoomY - zoomR); ctx.lineTo(zoomX + g, zoomY + zoomR); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(zoomX - zoomR, zoomY + g); ctx.lineTo(zoomX + zoomR, zoomY + g); ctx.stroke();
    }

    const pType = getEffectivePlacentaType();

    if (time <= 0.34) {
        // ====== 顯微受精細節 ======
        const fertP = norm(time, 0.20, 0.33);
        const corticalReaction = norm(fertP, 0.35, 0.55);

        if (pregnancyMode === 'fraternal') {
            // 異卵雙生：雙顆獨立卵子各自受精
            drawMicroFertilizationEgg(zoomX - 50, zoomY - 4, 0.54, fertP, corticalReaction, time, '#38bdf8', '#9333ea', '卵子 A');
            drawMicroFertilizationEgg(zoomX + 50, zoomY - 4, 0.54, fertP, corticalReaction, time, '#34d399', '#059669', '卵子 B');

            if (showLabels) {
                ctx.font = 'bold 11px sans-serif';
                ctx.fillStyle = '#34d399';
                ctx.textAlign = 'center';
                let statusStr = "兩顆卵子各自被不同精子穿透";
                if (fertP >= 0.35 && fertP < 0.55) statusStr = "雙卵各自發生皮質反應硬化";
                else if (fertP >= 0.55 && fertP < 0.88) statusStr = "各自進行雌雄原核融合";
                else if (fertP >= 0.88) statusStr = "形成兩顆基因獨立的合子 (異卵)";
                ctx.fillText(statusStr, zoomX, zoomY + 96);
            }
        } else {
            drawMicroFertilizationEgg(zoomX, zoomY, 1.0, fertP, corticalReaction, time, '#38bdf8', '#9333ea', '');

            if (showLabels) {
                ctx.font = 'bold 11px sans-serif';
                ctx.fillStyle = '#38bdf8';
                ctx.textAlign = 'center';
                let statusStr = "精子釋放頂體酶穿透透明帶";
                if (fertP >= 0.35 && fertP < 0.55) statusStr = "皮質反應：透明帶硬化阻止多精受精";
                else if (fertP >= 0.55 && fertP < 0.88) statusStr = "雌原核 (n) 與 雄原核 (n) 融合";
                else if (fertP >= 0.88) statusStr = pregnancyMode === 'identical'
                    ? "形成單一合子 (即將分裂為同卵雙生)"
                    : "受精完成：形成二倍體合子 (2n)";
                ctx.fillText(statusStr, zoomX, zoomY + 98);

                ctx.font = '10px sans-serif';
                ctx.fillStyle = '#fde047';
                ctx.fillText("透明帶", zoomX - 50, zoomY - 46);
                ctx.fillText("放射冠", zoomX - 74, zoomY - 65);
            }
        }
    } else {
        // ====== 顯微卵裂與雙胞胎分裂細節 (t = 0.34 ~ 0.50) ======
        const cleaveP = norm(time, 0.34, 0.49);
        let stageLabel = "";

        if (pregnancyMode === 'fraternal') {
            // 異卵雙胞胎：兩個獨立卵裂胚胎
            drawMicroCleavageCluster(zoomX - 48, zoomY - 4, 0.54, cleaveP, '#f472b6', '#38bdf8', false);
            drawMicroCleavageCluster(zoomX + 48, zoomY - 4, 0.54, cleaveP, '#fbbf24', '#34d399', false);
            stageLabel = cleaveP < 0.78 ? "兩顆受精卵各自獨立卵裂" : "兩個獨立囊胚 → 各自獨立胎盤";
        } else if (pregnancyMode === 'identical' && pType === 'dcda') {
            // 同卵 DCDA：早期分裂為兩個獨立胚胎與囊胚
            const splitU = smoothstep(norm(cleaveP, 0.22, 0.50));
            if (cleaveP < 0.22) {
                drawMicroCleavageCluster(zoomX, zoomY, 0.9, cleaveP, '#f472b6', '#38bdf8', false);
                stageLabel = "2-細胞期：即將完全分裂為二";
            } else {
                const offset = lerp(16, 48, splitU);
                const sc = lerp(0.75, 0.54, splitU);
                drawMicroCleavageCluster(zoomX - offset, zoomY - 4, sc, cleaveP, '#f472b6', '#38bdf8', false);
                drawMicroCleavageCluster(zoomX + offset, zoomY - 4, sc, cleaveP, '#f472b6', '#38bdf8', false);
                stageLabel = cleaveP < 0.78 ? "早期分裂 (Day 1–3)：一分為二" : "兩個同卵獨立囊胚 → 各自獨立胎盤";
            }
        } else if (pregnancyMode === 'identical' && pType === 'mcda') {
            // 同卵 MCDA：單一囊胚，內細胞群分裂為二
            drawMicroCleavageCluster(zoomX, zoomY, 1.0, cleaveP, '#f472b6', '#38bdf8', true);
            if (cleaveP < 0.22) stageLabel = "2-細胞期 (2-Cell Stage)";
            else if (cleaveP < 0.45) stageLabel = "4-細胞期 (4-Cell Stage)";
            else if (cleaveP < 0.68) stageLabel = "8-細胞期 (8-Cell Stage)";
            else if (cleaveP < 0.80) stageLabel = "桑椹胚 (Morula)";
            else stageLabel = "內細胞群分裂為二 → 共用胎盤・獨立羊膜";
        } else if (pregnancyMode === 'identical' && pType === 'mcma') {
            // 同卵 MCMA：單一囊胚，晚期分裂
            drawMicroCleavageCluster(zoomX, zoomY, 1.0, cleaveP, '#f472b6', '#38bdf8', false);
            if (cleaveP < 0.22) stageLabel = "2-細胞期 (2-Cell Stage)";
            else if (cleaveP < 0.45) stageLabel = "4-細胞期 (4-Cell Stage)";
            else if (cleaveP < 0.68) stageLabel = "8-細胞期 (8-Cell Stage)";
            else if (cleaveP < 0.82) stageLabel = "桑椹胚 (Morula)";
            else stageLabel = "單一囊胚 (著床後晚期分裂 → 共用胎盤羊膜)";
        } else {
            // 單胞胎
            drawMicroCleavageCluster(zoomX, zoomY, 1.0, cleaveP, '#f472b6', '#38bdf8', false);
            if (cleaveP < 0.22) stageLabel = "2-細胞期 (2-Cell Stage)";
            else if (cleaveP < 0.45) stageLabel = "4-細胞期 (4-Cell Stage)";
            else if (cleaveP < 0.68) stageLabel = "8-細胞期 (8-Cell Stage)";
            else if (cleaveP < 0.84) stageLabel = "桑椹胚 (Morula, 16-32細胞)";
            else stageLabel = "囊胚 (Blastocyst：具囊胚腔與內細胞群)";
        }

        if (showLabels) {
            ctx.font = 'bold 10.5px sans-serif';
            ctx.fillStyle = '#f472b6';
            ctx.textAlign = 'center';
            ctx.fillText(stageLabel, zoomX, zoomY + 100);
        }
    }

    ctx.restore(); // 結束圓形裁切

    // 顯微鏡外框與標題
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(zoomX, zoomY, zoomR, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#0284c7';
    ctx.beginPath();
    ctx.roundRect(zoomX - 88, zoomY - zoomR - 14, 176, 25, 12);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11.5px sans-serif';
    ctx.textAlign = 'center';
    let hudTitle = time <= 0.34 ? "🔬 顯微放大：受精過程" : "🔬 顯微放大：卵裂發育";
    if (pregnancyMode === 'fraternal') hudTitle = time <= 0.34 ? "🔬 顯微放大：異卵雙受精" : "🔬 顯微放大：異卵雙胚卵裂";
    else if (pregnancyMode === 'identical' && time > 0.34) hudTitle = "🔬 顯微放大：同卵分裂過程";
    ctx.fillText(hudTitle, zoomX, zoomY - zoomR + 3);

    ctx.restore();
}

// 顯微受精單顆卵子繪製輔助
function drawMicroFertilizationEgg(cx, cy, scale, fertP, corticalReaction, time, maleColor, zygoteColor, caption) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    // 放射冠細胞
    for (let i = 0; i < 20; i++) {
        const a = (i / 20) * Math.PI * 2;
        const cr = 82 + Math.sin(i * 3 + time * 10) * 2;
        ctx.fillStyle = 'rgba(253, 224, 71, 0.35)';
        ctx.strokeStyle = 'rgba(234, 179, 8, 0.6)';
        ctx.beginPath();
        ctx.arc(Math.cos(a) * cr, Math.sin(a) * cr, 8.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    // 透明帶
    ctx.lineWidth = 13;
    ctx.strokeStyle = corticalReaction > 0
        ? `rgba(56, 189, 248, ${0.35 + corticalReaction * 0.45})`
        : 'rgba(254, 240, 138, 0.35)';
    ctx.beginPath();
    ctx.arc(0, 0, 66, 0, Math.PI * 2);
    ctx.stroke();

    if (corticalReaction > 0 && corticalReaction < 1) {
        ctx.strokeStyle = `rgba(125, 211, 252, ${1 - corticalReaction})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, 58 + corticalReaction * 18, 0, Math.PI * 2);
        ctx.stroke();
    }

    // 卵細胞質
    ctx.fillStyle = '#fef08a';
    ctx.strokeStyle = '#eab308';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 56, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 極體
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(10, -54, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (fertP > 0.4) {
        ctx.beginPath(); ctx.arc(22, -52, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    // 競爭失敗精子
    const loserAngles = [2.2, 2.9, -2.4, -1.6, 0.9];
    loserAngles.forEach((ang, idx) => {
        const approach = clamp(fertP * 2.2 - idx * 0.12, 0, 1);
        const dist = lerp(120, 75, approach) + (corticalReaction > 0 ? corticalReaction * 6 : 0);
        drawMicroSperm(Math.cos(ang) * dist, Math.sin(ang) * dist, ang + Math.PI, time, false, maleColor);
    });

    // 冠軍精子穿透
    if (fertP < 0.45) {
        const winApproach = norm(fertP, 0, 0.40);
        const dist = lerp(110, 50, winApproach);
        if (winApproach > 0.2 && winApproach < 0.9) {
            ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
            ctx.beginPath();
            ctx.arc(dist - 8, 0, 7 + Math.sin(time * 80) * 2, 0, Math.PI * 2);
            ctx.fill();
        }
        drawMicroSperm(dist, 0, Math.PI, time, true, maleColor);
    }

    // 原核融合
    const mergeP = norm(fertP, 0.45, 0.88);
    if (mergeP < 1) {
        const femX = lerp(-22, 0, mergeP);
        ctx.fillStyle = 'rgba(236, 72, 153, 0.85)';
        ctx.beginPath(); ctx.arc(femX, 0, 12, 0, Math.PI * 2); ctx.fill();

        if (fertP > 0.38) {
            const maleX = lerp(40, 0, mergeP);
            ctx.fillStyle = maleColor;
            ctx.beginPath(); ctx.arc(maleX, 0, 12, 0, Math.PI * 2); ctx.fill();
        }
    } else {
        const glow = Math.sin(time * 25) * 3;
        ctx.fillStyle = zygoteColor;
        ctx.strokeStyle = '#e879f9';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, 17 + glow * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    if (caption && showLabels) {
        ctx.font = 'bold 18px sans-serif';
        ctx.fillStyle = '#e2e8f0';
        ctx.textAlign = 'center';
        ctx.fillText(caption, 0, -96);
    }

    ctx.restore();
}

// 顯微卵裂繪製輔助
function drawMicroCleavageCluster(cx, cy, scale, cleaveP, cellColor, icmColor, splitICM) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    ctx.strokeStyle = 'rgba(56, 189, 248, 0.7)';
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.arc(0, 0, 70, 0, Math.PI * 2);
    ctx.stroke();

    if (cleaveP < 0.22) {
        drawBlastomere(-26, 0, 32, cellColor);
        drawBlastomere(26, 0, 32, cellColor);
    } else if (cleaveP < 0.45) {
        drawBlastomere(-22, -22, 25, cellColor);
        drawBlastomere(22, -22, 25, cellColor);
        drawBlastomere(-22, 22, 25, cellColor);
        drawBlastomere(22, 22, 25, cellColor);
    } else if (cleaveP < 0.68) {
        for (let i = 0; i < 7; i++) {
            const a = (i / 6) * Math.PI * 2;
            const r = i === 6 ? 0 : 32;
            drawBlastomere(Math.cos(a) * r, Math.sin(a) * r, 19, cellColor);
        }
    } else if (cleaveP < 0.82) {
        for (let i = 0; i < 19; i++) {
            const a = i * 2.4;
            const r = Math.sqrt(i) * 12;
            drawBlastomere(Math.cos(a) * r, Math.sin(a) * r, 13, cellColor);
        }
    } else {
        // 囊胚滋養層細胞環
        for (let i = 0; i < 20; i++) {
            const a = (i / 20) * Math.PI * 2;
            drawBlastomere(Math.cos(a) * 58, Math.sin(a) * 58, 9.5, cellColor);
        }
        // 內細胞群
        if (splitICM) {
            // MCDA：兩組獨立的內細胞群
            [-22, 22].forEach(yOff => {
                for (let i = 0; i < 6; i++) {
                    const a = i * 2.1;
                    const r = Math.sqrt(i) * 6.5;
                    drawBlastomere(22 + Math.cos(a) * r, yOff + Math.sin(a) * r, 8.5, icmColor);
                }
            });
        } else {
            for (let i = 0; i < 10; i++) {
                const a = i * 2.1;
                const r = Math.sqrt(i) * 7.5;
                drawBlastomere(24 + Math.cos(a) * r, Math.sin(a) * r, 9.5, icmColor);
            }
        }
    }

    ctx.restore();
}

// 繪製顯微視角下的單隻精子
function drawMicroSperm(x, y, angle, time, isWinner, winColor = '#38bdf8') {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.strokeStyle = isWinner ? winColor : '#cbd5e1';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, 0);
    for (let i = 1; i <= 12; i++) {
        ctx.lineTo(-8 - i * 3, Math.sin(time * 85 - i * 0.6) * (i * 0.55));
    }
    ctx.stroke();

    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-3, 0);
    ctx.lineTo(-8, 0);
    ctx.stroke();

    ctx.fillStyle = isWinner ? winColor : '#f8fafc';
    ctx.beginPath();
    ctx.ellipse(2, 0, 6, 3.8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// 繪製分裂球細胞 (Blastomere)
function drawBlastomere(x, y, r, color = '#f472b6') {
    ctx.fillStyle = color;
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.38, 0, Math.PI * 2);
    ctx.fill();
}

// 繪製單一胎兒輔助函數
function drawSingleFetus(x, y, scale, rotation, devP, time, opts = {}) {
    const {
        flipX = false,
        skinColor = '#fecdd3',
        strokeColor = '#f43f5e',
        limbColor = '#fda4af',
        badge = ''
    } = opts;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    if (flipX) ctx.scale(-1, 1);
    ctx.scale(scale, scale);

    ctx.fillStyle = skinColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 2;

    if (devP < 0.28) {
        ctx.beginPath();
        ctx.arc(0, -14, 15, 0, Math.PI * 2);
        ctx.arc(-8, 10, 14, 0, Math.PI * 2);
        ctx.fill();
    } else {
        const limbGrowth = norm(devP, 0.28, 0.85);

        // 捲曲軀幹與臀部
        ctx.beginPath();
        ctx.ellipse(-6, 16, 17, 24, -0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 胎兒頭部
        ctx.beginPath();
        ctx.arc(2, -18, 21, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 閉眼弧線
        if (devP > 0.42) {
            ctx.strokeStyle = '#881337';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.arc(10, -20, 4, 0.2, Math.PI - 0.2);
            ctx.stroke();
        }

        // 手臂
        ctx.fillStyle = limbColor;
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(6, 6, 5 + limbGrowth * 7, 5, 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 腿部
        ctx.beginPath();
        ctx.ellipse(5, 32, 6 + limbGrowth * 9, 6, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    // 跳動心臟
    if (devP > 0.14) {
        const beat = 1 + Math.sin(time * 160) * 0.28;
        ctx.fillStyle = '#e11d48';
        ctx.beginPath();
        ctx.arc(-2, 6, 4.5 * beat, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();

    // 雙胞胎編號小徽章 (A / B)
    if (badge && showLabels && devP > 0.35) {
        ctx.save();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, y - 34 * scale, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(badge, x, y - 34 * scale);
        ctx.restore();
    }
}

// 繪製胎盤 (附著於子宮壁或剝離排出中)
function drawPlacentaShape(x, y, rx, ry, angle, isShared = false, detaching = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // 剝離時的出血微血管斷裂提示
    if (detaching > 0.05 && detaching < 0.95) {
        ctx.strokeStyle = `rgba(225, 29, 72, ${0.7 * (1 - detaching)})`;
        ctx.lineWidth = 1.6;
        for (let i = -3; i <= 3; i++) {
            ctx.beginPath();
            ctx.moveTo(rx * 0.6, i * ry * 0.24);
            ctx.lineTo(rx * 0.6 + 8 + detaching * 10, i * ry * 0.24);
            ctx.stroke();
        }
    }

    ctx.fillStyle = '#be123c';
    ctx.strokeStyle = '#fb7185';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 胎盤絨毛葉與血管分支紋理
    ctx.strokeStyle = 'rgba(253, 164, 175, 0.55)';
    ctx.lineWidth = 1.3;
    for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(-rx * 0.45, i * ry * 0.3);
        ctx.quadraticCurveTo(0, i * ry * 0.22, rx * 0.5, i * ry * 0.35);
        ctx.stroke();
    }

    // 共用胎盤特別標示兩個臍帶附著點
    if (isShared) {
        ctx.fillStyle = '#fda4af';
        ctx.beginPath();
        ctx.arc(-rx * 0.35, -ry * 0.28, 3.8, 0, Math.PI * 2);
        ctx.arc(-rx * 0.35, ry * 0.28, 3.8, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

// 繪製臍帶 (含靜脈/動脈雙色紋理，娩出後可繪製臍帶夾)
function drawUmbilicalCord(x1, y1, cx1, cy1, cx2, cy2, x2, y2, width, clamped = false) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#fda4af';
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(cx1, cy1, cx2, cy2, x2, y2);
    ctx.stroke();

    // 臍帶血管紋理 (細藍虛線)
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
    ctx.lineWidth = Math.max(1, width * 0.32);
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(cx1, cy1, cx2, cy2, x2, y2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 臍帶夾 (已夾斷標記)
    if (clamped) {
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(x2 - 6, y2 - 3, 12, 6, 2);
        ctx.fill();
        ctx.stroke();
    }
    ctx.restore();
}

// 繪製破水時流出的羊水水滴動畫
function drawWaterBreak(ruptureP, time) {
    if (ruptureP <= 0 || ruptureP >= 1) return;
    ctx.save();
    const alpha = Math.sin(ruptureP * Math.PI);
    ctx.fillStyle = `rgba(125, 211, 252, ${alpha * 0.8})`;
    for (let i = 0; i < 9; i++) {
        const dropP = (ruptureP * 1.8 + i * 0.11) % 1;
        const dx = 500 + Math.sin(i * 2.7 + time * 15) * (10 + dropP * 16);
        const dy = lerp(385, 585, dropP);
        const r = lerp(3.5, 5.5, 1 - dropP);
        ctx.beginPath();
        ctx.ellipse(dx, dy, r * 0.7, r * 1.3, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

// 繪製階段 6 (胎兒發育與胎盤)、階段 7 (分娩) 與階段 8 (排出胎盤)
function drawFetalLaborAndPlacenta(time) {
    if (time <= 0.59) return;

    const pType = getEffectivePlacentaType();
    const isFraternal = pregnancyMode === 'fraternal';
    const pregScale = getPregScale(time);

    // 階段進度
    const devP = norm(time, 0.59, 0.76);       // 0 -> 1 (胎兒成長)
    const laborP = norm(time, 0.76, 0.90);     // 0 -> 1 (分娩)
    const expP = norm(time, 0.90, 1.00);       // 0 -> 1 (排出胎盤)

    // 依當前子宮縮放計算子宮壁參考點
    const rightWallX = 500 + (558 - 500) * pregScale;
    const leftWallX = 500 - (558 - 500) * pregScale;

    ctx.save();

    if (pType === 'single') {
        // ==================== 單胞胎 ====================
        const placAttachX = lerp(554, rightWallX - 6, devP);
        const placAttachY = 268;
        const placRx = lerp(7, 15, devP);
        const placRy = lerp(18, 48, devP);

        // 胎盤位置 (階段 8 剝離並沿產道排出)
        let placX = placAttachX;
        let placY = placAttachY;
        let placAngle = 0.12;
        let detachP = 0;

        if (time > 0.90) {
            detachP = norm(expP, 0, 0.30);
            const slideP = smoothstep(norm(expP, 0.22, 0.96));
            placX = lerp(placAttachX, 500, smoothstep(norm(expP, 0.10, 0.45)));
            placY = lerp(placAttachY, 578, slideP);
            placAngle = lerp(0.12, Math.PI * 0.5, slideP);
        }

        // 羊膜囊 (階段 6 成長，階段 7 破水後漸消)
        const sacCx = lerp(550, 500, clamp(devP * 1.4, 0, 1));
        const sacCy = lerp(265, 286, clamp(devP * 1.4, 0, 1));
        const sacR = lerp(16, 72, devP);
        const sacAlpha = time < 0.76 ? 1 : (1 - norm(laborP, 0.05, 0.30));

        if (sacAlpha > 0.02) {
            ctx.save();
            ctx.globalAlpha = sacAlpha;
            const grad = ctx.createRadialGradient(sacCx - sacR * 0.2, sacCy - sacR * 0.2, 5, sacCx, sacCy, sacR);
            grad.addColorStop(0, 'rgba(56, 189, 248, 0.32)');
            grad.addColorStop(1, 'rgba(14, 116, 144, 0.62)');
            ctx.fillStyle = grad;
            ctx.strokeStyle = 'rgba(186, 230, 253, 0.85)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(sacCx, sacCy, sacR * 0.9, sacR, 0.04, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        // 破水動畫
        if (time >= 0.76 && time <= 0.83) {
            drawWaterBreak(norm(time, 0.76, 0.83), time);
        }

        // 胎盤繪製
        drawPlacentaShape(placX, placY, placRx, placRy, placAngle, false, detachP);

        // 胎兒位置與旋轉 (階段 6 末期轉為頭朝下，階段 7 經產道娩出)
        let fx = sacCx - sacR * 0.06;
        let fy = sacCy;
        let fRot = Math.sin(time * 22) * 0.05;
        let fScale = lerp(0.22, 0.95, devP);

        // 階段 6 最後 25% 逐漸轉為頭朝下 (Math.PI)
        const turnU = smoothstep(norm(devP, 0.72, 1.0));
        fRot = lerp(fRot, Math.PI, turnU);

        let cordClamped = false;
        if (time >= 0.76 && time <= 0.90) {
            const descU = smoothstep(norm(laborP, 0.16, 0.88));
            fx = lerp(sacCx, 500, smoothstep(norm(laborP, 0, 0.25)));
            fy = lerp(sacCy, 582, descU);
            fRot = Math.PI + Math.sin(laborP * 14) * 0.04;
            fScale = lerp(0.95, 0.88, descU);
            cordClamped = laborP > 0.84;
        }

        // 臍帶繪製
        if (devP > 0.12) {
            if (time <= 0.90) {
                const cordEndX = cordClamped ? 500 : fx + 4;
                const cordEndY = cordClamped ? 535 : fy - (turnU > 0.5 ? 10 : -8);
                drawUmbilicalCord(
                    placX - 8, placY,
                    lerp(placX - 28, 515, laborP), lerp(placY + 10, 390, laborP),
                    lerp(fx + 28, 504, laborP), lerp(fy + 16, 460, laborP),
                    cordEndX, cordEndY,
                    lerp(2, 5.2, devP),
                    cordClamped
                );
            } else {
                // 階段 8：夾斷的臍帶隨胎盤一起排出
                const tailEndY = Math.min(615, placY + 38);
                drawUmbilicalCord(
                    placX, placY + 10,
                    placX + 12, placY + 20,
                    placX - 10, placY + 30,
                    placX + 2, tailEndY,
                    4.6,
                    true
                );
            }
        }

        // 繪製胎兒 (階段 8 胎兒已抱離產道，專注呈現胎盤排出)
        if (time <= 0.90) {
            drawSingleFetus(fx, fy, fScale, fRot, devP, time);
        }

    } else {
        // ==================== 雙胞胎 (DCDA / MCDA / MCMA) ====================
        const isSharedPlacenta = (pType === 'mcda' || pType === 'mcma');
        const isSharedSac = (pType === 'mcma');

        const twinAOpts = {
            skinColor: '#fecdd3', strokeColor: '#f43f5e', limbColor: '#fda4af', badge: 'A'
        };
        const twinBOpts = isFraternal
            ? { skinColor: '#fef3c7', strokeColor: '#d97706', limbColor: '#fcd34d', badge: 'B', flipX: true }
            : { skinColor: '#fecdd3', strokeColor: '#f43f5e', limbColor: '#fda4af', badge: 'B', flipX: true };

        // 1. 胎盤幾何計算
        let placRX, placRY, placRAngle, placLX, placLY, placLAngle;
        let detachP = 0;

        if (isSharedPlacenta) {
            // 共用單一大型胎盤 (附著於右上方子宮壁)
            const attachX = lerp(552, rightWallX - 8, devP);
            const attachY = 256;
            placRX = attachX; placRY = attachY; placRAngle = 0.14;
            if (time > 0.90) {
                detachP = norm(expP, 0, 0.30);
                const slideP = smoothstep(norm(expP, 0.22, 0.96));
                placRX = lerp(attachX, 500, smoothstep(norm(expP, 0.10, 0.45)));
                placRY = lerp(attachY, 576, slideP);
                placRAngle = lerp(0.14, Math.PI * 0.5, slideP);
            }
        } else {
            // DCDA：兩個各自獨立胎盤 (左側壁 + 右側壁)
            const attachRX = lerp(552, rightWallX - 6, devP);
            const attachLX = lerp(448, leftWallX + 6, devP);
            placRX = attachRX; placRY = 272; placRAngle = 0.12;
            placLX = attachLX; placLY = 272; placLAngle = -0.12;
            if (time > 0.90) {
                detachP = norm(expP, 0, 0.28);
                const slideR = smoothstep(norm(expP, 0.18, 0.85));
                const slideL = smoothstep(norm(expP, 0.32, 0.98));
                placRX = lerp(attachRX, 504, smoothstep(norm(expP, 0.08, 0.40)));
                placRY = lerp(272, 588, slideR);
                placRAngle = lerp(0.12, Math.PI * 0.5, slideR);

                placLX = lerp(attachLX, 496, smoothstep(norm(expP, 0.22, 0.55)));
                placLY = lerp(272, 548, slideL);
                placLAngle = lerp(-0.12, -Math.PI * 0.5, slideL);
            }
        }

        // 2. 羊膜囊繪製 (階段 6 成長，階段 7 依序破水)
        const sacAlphaA = time < 0.76 ? 1 : (1 - norm(laborP, 0.02, 0.22));
        const sacAlphaB = time < 0.76 ? 1 : (isSharedSac ? sacAlphaA : (1 - norm(laborP, 0.48, 0.65)));

        const sacAx = lerp(548, 534, clamp(devP * 1.3, 0, 1));
        const sacAy = lerp(266, 290, clamp(devP * 1.3, 0, 1));
        const sacBx = isSharedPlacenta
            ? lerp(542, 466, clamp(devP * 1.3, 0, 1))
            : lerp(452, 466, clamp(devP * 1.3, 0, 1));
        const sacBy = lerp(266, 286, clamp(devP * 1.3, 0, 1));

        if (isSharedSac) {
            // MCMA：單一大型共用羊膜囊 (無隔膜！)
            if (sacAlphaA > 0.02) {
                ctx.save();
                ctx.globalAlpha = sacAlphaA;
                const bigR = lerp(18, 82, devP);
                const grad = ctx.createRadialGradient(500, 272, 8, 500, 286, bigR);
                grad.addColorStop(0, 'rgba(56, 189, 248, 0.30)');
                grad.addColorStop(1, 'rgba(14, 116, 144, 0.60)');
                ctx.fillStyle = grad;
                ctx.strokeStyle = 'rgba(186, 230, 253, 0.9)';
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.ellipse(lerp(546, 500, clamp(devP * 1.4, 0, 1)), 286, bigR * 1.02, bigR * 0.95, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        } else {
            // DCDA 或 MCDA：兩個獨立羊膜囊
            const rEach = lerp(14, 52, devP);
            if (sacAlphaB > 0.02) {
                ctx.save();
                ctx.globalAlpha = sacAlphaB;
                const gB = ctx.createRadialGradient(sacBx, sacBy - 10, 4, sacBx, sacBy, rEach);
                gB.addColorStop(0, isFraternal ? 'rgba(52, 211, 153, 0.30)' : 'rgba(56, 189, 248, 0.32)');
                gB.addColorStop(1, isFraternal ? 'rgba(6, 95, 70, 0.58)' : 'rgba(14, 116, 144, 0.58)');
                ctx.fillStyle = gB;
                ctx.strokeStyle = isFraternal ? 'rgba(167, 243, 208, 0.85)' : 'rgba(186, 230, 253, 0.85)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(sacBx, sacBy, rEach * 0.78, rEach * 1.25, -0.05, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
            if (sacAlphaA > 0.02) {
                ctx.save();
                ctx.globalAlpha = sacAlphaA;
                const gA = ctx.createRadialGradient(sacAx, sacAy - 10, 4, sacAx, sacAy, rEach);
                gA.addColorStop(0, 'rgba(56, 189, 248, 0.32)');
                gA.addColorStop(1, 'rgba(14, 116, 144, 0.58)');
                ctx.fillStyle = gA;
                ctx.strokeStyle = 'rgba(186, 230, 253, 0.85)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(sacAx, sacAy, rEach * 0.78, rEach * 1.25, 0.05, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
            // MCDA 特別強調中央「羊膜隔膜」
            if (pType === 'mcda' && devP > 0.35 && sacAlphaA > 0.15) {
                ctx.save();
                ctx.globalAlpha = sacAlphaA;
                ctx.strokeStyle = '#e0f2fe';
                ctx.lineWidth = 2.6;
                ctx.setLineDash([5, 3]);
                ctx.beginPath();
                ctx.moveTo(500, sacAy - rEach * 1.12);
                ctx.lineTo(500, sacAy + rEach * 1.12);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }
        }

        // 破水動畫
        if (time >= 0.76 && time <= 0.81) drawWaterBreak(norm(time, 0.76, 0.81), time);
        if (!isSharedSac && time >= 0.83 && time <= 0.87) drawWaterBreak(norm(time, 0.83, 0.87), time);

        // 3. 繪製胎盤
        if (isSharedPlacenta) {
            drawPlacentaShape(placRX, placRY, lerp(8, 17, devP), lerp(20, 56, devP), placRAngle, true, detachP);
        } else {
            drawPlacentaShape(placRX, placRY, lerp(6, 13, devP), lerp(16, 42, devP), placRAngle, false, detachP);
            drawPlacentaShape(placLX, placLY, lerp(6, 13, devP), lerp(16, 42, devP), placLAngle, false, detachP);
        }

        // 4. 計算胎兒 A & B 位置、旋轉與分娩順序
        const turnU = smoothstep(norm(devP, 0.72, 1.0));
        let fAx = sacAx - 2, fAy = sacAy + 2;
        let fBx = sacBx + 2, fBy = sacBy - 2;
        let fARot = lerp(Math.sin(time * 20) * 0.05, Math.PI, turnU);
        let fBRot = lerp(-Math.sin(time * 20 + 1) * 0.05, Math.PI, turnU);
        let fScale = lerp(0.18, 0.68, devP);

        let clampA = false, clampB = false;

        if (time >= 0.76 && time <= 0.90) {
            // 胎兒 A 先娩出 (laborP 0.00 -> 0.50)
            const descA = smoothstep(norm(laborP, 0.08, 0.48));
            fAx = lerp(sacAx, 500, smoothstep(norm(laborP, 0.0, 0.18)));
            fAy = lerp(sacAy, 582, descA);
            if (laborP > 0.48) {
                // 娩出後微移往右下側讓出產道給胎兒 B
                const asideA = smoothstep(norm(laborP, 0.48, 0.62));
                fAx = lerp(500, 568, asideA);
                fAy = 582;
            }
            clampA = laborP > 0.46;

            // 胎兒 B 接著娩出 (laborP 0.50 -> 0.96)
            const shiftB = smoothstep(norm(laborP, 0.42, 0.60));
            const descB = smoothstep(norm(laborP, 0.54, 0.95));
            fBx = lerp(sacBx, 500, shiftB);
            fBy = lerp(sacBy, 582, descB);
            clampB = laborP > 0.92;
        }

        // 5. 繪製兩條臍帶
        if (devP > 0.14) {
            const cordW = lerp(1.8, 4.2, devP);
            if (time <= 0.90) {
                if (isSharedPlacenta) {
                    // 共用胎盤：兩條臍帶皆連向同一個胎盤 (上/下兩個附著點)
                    const insAX = placRX - 8, insAY = placRY + 14;
                    const insBX = placRX - 8, insBY = placRY - 14;
                    const endAX = clampA ? 520 : fAx;
                    const endAY = clampA ? 530 : fAy - 6;
                    const endBX = clampB ? 495 : fBx;
                    const endBY = clampB ? 535 : fBy - 6;

                    drawUmbilicalCord(insAX, insAY, insAX - 18, insAY + 25, endAX + 12, (insAY + endAY) * 0.5, endAX, endAY, cordW, clampA);
                    drawUmbilicalCord(insBX, insBY, insBX - 36, insBY - 12, endBX + 20, (insBY + endBY) * 0.5 - 10, endBX, endBY, cordW, clampB);
                } else {
                    // 獨立胎盤：A 接右胎盤，B 接左胎盤
                    const endAX = clampA ? 516 : fAx + 4;
                    const endAY = clampA ? 530 : fAy - 6;
                    const endBX = clampB ? 488 : fBx - 4;
                    const endBY = clampB ? 534 : fBy - 6;

                    drawUmbilicalCord(placRX - 6, placRY, placRX - 24, placRY + 20, endAX + 12, (placRY + endAY) * 0.5, endAX, endAY, cordW, clampA);
                    drawUmbilicalCord(placLX + 6, placLY, placLX + 24, placLY + 20, endBX - 12, (placLY + endBY) * 0.5, endBX, endBY, cordW, clampB);
                }
            } else {
                // 階段 8：胎盤與已夾斷的兩條臍帶一併排出
                if (isSharedPlacenta) {
                    drawUmbilicalCord(placRX - 10, placRY + 10, placRX - 16, placRY + 26, placRX - 8, placRY + 36, placRX - 12, Math.min(616, placRY + 44), 4.0, true);
                    drawUmbilicalCord(placRX + 10, placRY + 10, placRX + 18, placRY + 26, placRX + 8, placRY + 36, placRX + 12, Math.min(616, placRY + 44), 4.0, true);
                } else {
                    drawUmbilicalCord(placRX, placRY + 8, placRX + 10, placRY + 20, placRX + 4, placRY + 28, placRX + 6, Math.min(616, placRY + 34), 3.8, true);
                    drawUmbilicalCord(placLX, placLY + 8, placLX - 10, placLY + 20, placLX - 4, placLY + 28, placLX - 6, Math.min(616, placLY + 34), 3.8, true);
                }
            }
        }

        // 6. 繪製兩名胎兒 (階段 8 專注呈現胎盤排出)
        if (time <= 0.90) {
            drawSingleFetus(fBx, fBy, fScale, fBRot, devP, time, twinBOpts);
            drawSingleFetus(fAx, fAy, fScale, fARot, devP, time, twinAOpts);
        }
    }

    ctx.restore();
}

// 限制 Pan 範圍，防止內容平移出螢幕太遠
function clampPan() {
    const maxX = canvas.width * Math.max(0, zoom - 0.7);
    const minX = -canvas.width * Math.max(0, zoom - 0.7);
    const maxY = canvas.height * Math.max(0, zoom - 0.7);
    const minY = -canvas.height * Math.max(0, zoom - 0.7);
    panX = clamp(panX, minX, maxX);
    panY = clamp(panY, minY, maxY);
}

// 更新縮放數值 UI
function updateZoomUI() {
    if (zoomLevelText) {
        zoomLevelText.textContent = `${Math.round(zoom * 100)}%`;
    }
}

// 重設 Pan 與 Zoom
function resetZoomPan() {
    zoom = 1.0;
    panX = 0;
    panY = 0;
    updateZoomUI();
}

// 以指定客戶端像素坐標為中心進行縮放
function zoomAt(clientX, clientY, factor) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const cx = (clientX - rect.left) * scaleX;
    const cy = (clientY - rect.top) * scaleY;

    const newZoom = clamp(zoom * factor, minZoom, maxZoom);
    if (Math.abs(newZoom - zoom) < 0.001) return;

    panX = cx - (cx - panX) * (newZoom / zoom);
    panY = cy - (cy - panY) * (newZoom / zoom);
    zoom = newZoom;

    clampPan();
    updateZoomUI();
}

// 更新上方資訊列與按鈕高亮狀態
function updateUI() {
    timeline.value = Math.round(t * 1000);
    progressText.textContent = `${Math.round(t * 100)}%`;

    let currentStageIdx = 0;
    for (let i = 0; i < stages.length; i++) {
        if (t >= stages[i].start && t <= stages[i].end) {
            currentStageIdx = i;
            break;
        }
    }
    const st = stages[currentStageIdx];
    const localP = norm(t, st.start, st.end);
    const pType = getEffectivePlacentaType();

    stageTitle.textContent = typeof st.title === 'function' ? st.title(pregnancyMode, pType) : st.title;
    stageDesc.textContent = typeof st.desc === 'function' ? st.desc(pregnancyMode, pType) : st.desc;
    dayCounter.textContent = st.day(localP);

    stageBtns.forEach((btn, idx) => {
        btn.classList.toggle('current', idx === currentStageIdx);
    });
}

// 主動畫迴圈
function animate(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = timestamp - lastTimestamp;
    lastTimestamp = timestamp;

    if (isPlaying) {
        t += (dt / baseDuration) * playbackSpeed;
        if (t >= 1.0) {
            t = 1.0;
            isPlaying = false;
            playPauseBtn.textContent = "▶ 重新播放";
        }
        updateUI();
    }

    // 清除畫布
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 世界坐標系 (套用平移與縮放)
    ctx.save();
    ctx.translate(panX, panY);
    ctx.scale(zoom, zoom);

    // 依圖層順序繪製解剖實體與動態物件
    drawAnatomy(t);
    drawSpermSwarm(t);
    drawMacroEggAndEmbryo(t);
    drawFetalLaborAndPlacenta(t);
    drawLabels(t);

    ctx.restore();

    // 2. 螢幕坐標系 (固定 HUD：左上角雙胞胎/胎盤資訊卡、顯微受精/卵裂視窗)
    drawTwinInfoHUD();
    drawMicroscopeZoom(t, zoom, panX, panY);

    requestAnimationFrame(animate);
}

// --- Pan & Zoom 事件綁定 (滑鼠拖曳、滾輪縮放、雙擊重設、雙指縮放) ---
canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    isPanning = true;
    startX = e.clientX;
    startY = e.clientY;
    if (canvasWrapper) canvasWrapper.classList.add('is-panning');
});

window.addEventListener('mousemove', (e) => {
    if (!isPanning) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const dx = (e.clientX - startX) * scaleX;
    const dy = (e.clientY - startY) * scaleY;
    startX = e.clientX;
    startY = e.clientY;

    panX += dx;
    panY += dy;
    clampPan();
});

window.addEventListener('mouseup', () => {
    if (isPanning) {
        isPanning = false;
        if (canvasWrapper) canvasWrapper.classList.remove('is-panning');
    }
});

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.14 : 0.88;
    zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

canvas.addEventListener('dblclick', () => {
    resetZoomPan();
});

// 觸控手勢支援 (單指平移、雙指捏合縮放)
let touchStartDist = 0;
let lastTouch = null;

canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches.length === 2) {
        touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        lastTouch = {
            x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
            y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
    }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    if (e.touches.length === 1 && lastTouch) {
        const dx = (e.touches[0].clientX - lastTouch.x) * scaleX;
        const dy = (e.touches[0].clientY - lastTouch.y) * scaleY;
        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        panX += dx;
        panY += dy;
        clampPan();
    } else if (e.touches.length === 2 && lastTouch) {
        const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        const center = {
            x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
            y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
        if (touchStartDist > 0 && dist > 0) {
            const factor = dist / touchStartDist;
            zoomAt(center.x, center.y, factor);
            touchStartDist = dist;
        }
        const dx = (center.x - lastTouch.x) * scaleX;
        const dy = (center.y - lastTouch.y) * scaleY;
        lastTouch = center;
        panX += dx;
        panY += dy;
        clampPan();
    }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) touchStartDist = 0;
    if (e.touches.length === 1) {
        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else {
        lastTouch = null;
    }
});

// 縮放工具列按鈕點擊
if (zoomInBtn) {
    zoomInBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = canvas.getBoundingClientRect();
        zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.25);
    });
}

if (zoomOutBtn) {
    zoomOutBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = canvas.getBoundingClientRect();
        zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 0.8);
    });
}

if (zoomResetBtn) {
    zoomResetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        resetZoomPan();
    });
}

// 快捷鍵支援 (+ / - 縮放, 0 / R 重設, 空白鍵播放/暫停)
window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const rect = canvas.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    if (e.key === '+' || e.key === '=') {
        zoomAt(cx, cy, 1.2);
    } else if (e.key === '-' || e.key === '_') {
        zoomAt(cx, cy, 0.83);
    } else if (e.key === '0' || e.key === 'r' || e.key === 'R') {
        resetZoomPan();
    } else if (e.code === 'Space') {
        e.preventDefault();
        playPauseBtn.click();
    }
});

// 啟動模擬器
updateUI();
updateZoomUI();
requestAnimationFrame(animate);
</script>
</body>
</html>
