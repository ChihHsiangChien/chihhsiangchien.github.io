<!DOCTYPE html>
<html lang="zh-TW">

    <style>

            --bg-color: #0f172a;
            --panel-bg: #1e293b;

            --text-muted: #94a3b8;

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;

            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;

            max-width: 1000px;
            width: 100%;

            overflow: hidden;
            cursor: grab;

            align-items: flex-end;

<body>

    <header>
        <h1>人類生殖、受精與胚胎發育動態模擬器</h1>
    </header>

    <div class="simulator-container">
        <div class="stage-banner">
            <div>
                <div class="stage-title" id="stageTitle">階段 1：排卵期 (Ovulation)</div>
                <div class="stage-desc" id="stageDesc">卵巢中的成熟濾泡破裂，釋出次級卵母細胞（卵子），經由輸卵管傘部進入輸卵管。</div>

            <div class="canvas-overlay-controls">

                    <button id="zoomOutBtn" title="縮小視角 (滾輪向下 / 快捷鍵 -)">➖ 縮小</button>
                    <button id="zoomResetBtn" title="重設縮放與位置 (雙擊畫布 / 快捷鍵 0)">↺ <span id="zoomLevelText">100%</span></button>
                </div>

        <div class="controls">

                        <option value="0.5">0.5x 慢速</option>

<script>
/**
 * 模擬器核心邏輯與繪圖引擎
 * 時間軸 t 範圍：0.000 ~ 1.000
 */
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const canvasWrapper = document.getElementById('canvasWrapper');

// 狀態變數
let t = 0; // 0.0 ~ 1.0
let isPlaying = true;
let playbackSpeed = 1.0;
let showLabels = true;
const baseDuration = 45000; // 1x 速度下完整播放需 45 秒
let lastTimestamp = 0;

// Pan & Zoom (平移與縮放) 狀態
let zoom = 1.0;
let panX = 0;
let panY = 0;
let isPanning = false;
let startX = 0;
let startY = 0;
const minZoom = 0.8;
const maxZoom = 4.5;

// UI 元素
const timeline = document.getElementById('timeline');
const progressText = document.getElementById('progressText');
const playPauseBtn = document.getElementById('playPauseBtn');
const resetBtn = document.getElementById('resetBtn');
const speedSelect = document.getElementById('speedSelect');
const toggleLabelsBtn = document.getElementById('toggleLabelsBtn');
const stageTitle = document.getElementById('stageTitle');
const stageDesc = document.getElementById('stageDesc');
const dayCounter = document.getElementById('dayCounter');
const stageBtns = document.querySelectorAll('.stage-btn');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const zoomResetBtn = document.getElementById('zoomResetBtn');
const zoomLevelText = document.getElementById('zoomLevelText');

// 定義階段資訊
const stages = [
    { start: 0.00, end: 0.14, title: "階段 1：排卵 (Ovulation)", desc: "卵巢內的成熟濾泡（格拉夫氏濾泡）破裂，排出卵子。輸卵管傘部擺動將卵子吸入輸卵管壺腹部，破裂濾泡轉變為黃體。", day: () => "排卵日 (Day 0)" },
    { start: 0.14, end: 0.28, title: "階段 2：精子游入 (Sperm Migration)", desc: "數以千萬計的精子從陰道經過子宮頸進入子宮腔，少數強壯的精子游向排卵側的輸卵管壺腹部尋找卵子。", day: () => "受精前數小時" },
    { start: 0.28, end: 0.46, title: "階段 3：受精過程 - 顯微放大 (Fertilization)", desc: "精子釋放頂體酶穿過放射冠與透明帶。一旦單一精子進入卵細胞質，透明帶立即發生「皮質反應」硬化，阻止其他精子進入，隨後雌雄原核融合。", day: () => "第 1 天 (受精)" },
    { start: 0.46, end: 0.66, title: "階段 4：卵裂與囊胚形成 (Cleavage & Blastocyst)", desc: "受精卵藉輸卵管纖毛擺動移向子宮，同時進行有絲分裂：2細胞 → 4細胞 → 8細胞 → 桑椹胚(16-32細胞) → 形成具空腔的囊胚。", day: (p) => `第 ${Math.floor(2 + p * 4)} 天` },
    { start: 0.66, end: 0.78, title: "階段 5：著床 (Implantation)", desc: "囊胚抵達子宮腔，透明帶消失（孵化），滋養層細胞分泌酵素並侵入增厚且富含血管的子宮內膜，完成著床。", day: (p) => `第 ${Math.floor(6 + p * 4)} 天` },
    { start: 0.78, end: 1.00, title: "階段 6：胚胎發育成胎兒 (Embryo to Fetus)", desc: "子宮內膜與滋養層共同形成胎盤，羊膜囊充滿羊水保護胚胎。器官迅速分化，心臟開始跳動，逐漸發育出頭、四肢與人形的胎兒。", day: (p) => `第 ${Math.floor(2 + p * 10)} 週` }
];

// 輔助數學函數
function lerp(a, b, u) { return a + (b - a) * u; }
function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
function norm(val, min, max) { return clamp((val - min) / (max - min), 0, 1); }

// Catmull-Rom 樣條曲線計算函數 (平滑自然通過每個控制點)
function getCatmullRomPoint(p0, p1, p2, p3, t) {
    const t2 = t * t;
    const t3 = t2 * t;
    return {
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
    };
}

function getSplinePoint(pts, progress) {
    const p = clamp(progress, 0, 1) * (pts.length - 1);
    const i = Math.floor(p);
    const frac = p - i;
    if (i >= pts.length - 1) return pts[pts.length - 1];
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[Math.min(pts.length - 1, i + 1)];
    const p3 = pts[Math.min(pts.length - 1, i + 2)];
    return getCatmullRomPoint(p0, p1, p2, p3, frac);
}

/**
 * 輸卵管與生殖道標準中心線定義
 * 輸卵管繪製、卵子路徑、精子游動全數依據此中心樣條曲線計算，徹底解決路徑不同步問題！
 */
const tubeWaypointsRight = [
    { x: 762, y: 312 }, // 0: 卵巢內成熟濾泡破裂處
    { x: 778, y: 282 }, // 1: 剛排出，輸卵管傘部捕獲處
    { x: 796, y: 235 }, // 2: 輸卵管漏斗部彎曲處
    { x: 775, y: 180 }, // 3: 進入壺腹部轉角
    { x: 722, y: 156 }, // 4: 輸卵管壺腹部 (受精發生點！)
    { x: 645, y: 156 }, // 5: 壺腹部中段 (卵裂期 2-cell / 4-cell)
    { x: 585, y: 178 }, // 6: 輸卵管峽部 (卵裂期 8-cell / 桑椹胚)
    { x: 538, y: 205 }, // 7: 輸卵管子宮口進入子宮腔 (早期囊胚)
    { x: 528, y: 238 }, // 8: 子宮腔內游走 (晚期囊胚孵化)
    { x: 550, y: 265 }  // 9: 右側子宮內膜壁 (著床點！)
];

// 精子從陰道到輸卵管口的下段路徑
const lowerRouteRight = [
    { x: 500, y: 555 }, // 0: 陰道底
    { x: 500, y: 440 }, // 1: 陰道中段
    { x: 500, y: 415 }, // 2: 子宮頸外口
    { x: 504, y: 330 }, // 3: 子宮腔中段
    { x: 520, y: 250 }, // 4: 子宮腔右上部
    { x: 538, y: 205 }  // 5: 右輸卵管子宮口
];

// 取得卵子/胚胎當前精確座標
function getEggPosition(time) {
    if (time < 0.02) {
        return tubeWaypointsRight[0];
    } else if (time <= 0.14) {
        // 階段 1：排卵排出並藉由傘部進入輸卵管壺腹部 (樣條進度 0.0 -> 4/9 ≈ 0.4444)
        const u = norm(time, 0.02, 0.14);
        const ease = u * u * (3 - 2 * u);
        return getSplinePoint(tubeWaypointsRight, lerp(0.0, 0.4444, ease));
    } else if (time <= 0.46) {
        // 階段 2 與 3：停留在輸卵管壺腹部等待受精 (index = 4)
        return getSplinePoint(tubeWaypointsRight, 0.4444);
    } else if (time <= 0.66) {
        // 階段 4：卵裂同時移向子宮腔 (樣條進度 0.4444 -> 7/9 ≈ 0.7777)
        const u = norm(time, 0.46, 0.66);
        const ease = u * u * (3 - 2 * u);
        return getSplinePoint(tubeWaypointsRight, lerp(0.4444, 0.7777, ease));
    } else if (time <= 0.76) {
        // 階段 5：在子宮腔游走並著床入子宮內膜 (樣條進度 0.7777 -> 1.0)
        const u = norm(time, 0.66, 0.76);
        const ease = u * u * (3 - 2 * u);
        return getSplinePoint(tubeWaypointsRight, lerp(0.7777, 1.0, ease));
    } else {
        // 階段 6：著床點固定發育為胎兒
        return tubeWaypointsRight[9];
    }
}

// 取得精子游動路徑位置與切線方向
function getSpermPosition(prog, goRight) {
    let pt, tangent;
    if (prog < 0.55) {
        // 陰道 -> 子宮頸 -> 子宮腔 -> 輸卵管口
        const u = prog / 0.55;
        const lowerPts = goRight ? lowerRouteRight : lowerRouteRight.map(p => ({ x: 1000 - p.x, y: p.y }));
        pt = getSplinePoint(lowerPts, u);
        const ptNext = getSplinePoint(lowerPts, Math.min(1, u + 0.02));
        tangent = { x: ptNext.x - pt.x, y: ptNext.y - pt.y };
    } else {
        // 進入輸卵管內部，沿著輸卵管樣條中心線逆流而上游向壺腹部卵子
        const u = (prog - 0.55) / 0.45; // 0.0: 子宮口 -> 1.0: 壺腹部受精點
        const splineProg = lerp(0.7777, 0.4444, u);
        const rawPt = getSplinePoint(tubeWaypointsRight, splineProg);
        const rawNext = getSplinePoint(tubeWaypointsRight, Math.max(0, splineProg - 0.015));
        if (goRight) {
            pt = rawPt;
            tangent = { x: rawNext.x - rawPt.x, y: rawNext.y - rawPt.y };
        } else {
            pt = { x: 1000 - rawPt.x, y: rawPt.y };
            tangent = { x: -(rawNext.x - rawPt.x), y: rawNext.y - rawPt.y };
        }
    }
    return { pt, tangent };
}

// 產生精子群體資料
const numSperm = 50;
const sperms = [];
for (let i = 0; i < numSperm; i++) {
    const isWinner = i === 0;
    const goRight = i < 38; // 大部分游向有卵子的右側，少部分游向左側迷路
    sperms.push({
        id: i,
        isWinner: isWinner,
        goRight: goRight,
        lateralOffset: isWinner ? 0 : (Math.random() - 0.5) * 1.8, // 橫向隨機偏移比例
        speedFactor: isWinner ? 1.05 : 0.70 + Math.random() * 0.35,
        phase: Math.random() * Math.PI * 2,
        tailLength: 8 + Math.floor(Math.random() * 4),
        wiggleFreq: 18 + Math.random() * 10
    });
}

// 繪製解剖背景（子宮、輸卵管、卵巢、子宮內膜、動態管壁纖毛）
function drawAnatomy(time) {
    ctx.save();

    // 計算子宮隨懷孕稍微脹大的比例
    const pregScale = time > 0.78 ? 1 + norm(time, 0.78, 1.0) * 0.16 : 1;
    ctx.translate(500, 300);
    ctx.scale(pregScale, pregScale);
    ctx.translate(-500, -300);

    // 1. 卵巢韌帶 (Ovarian Ligaments)
    ctx.strokeStyle = '#9d5c63';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(425, 240); ctx.lineTo(265, 315);
    ctx.moveTo(575, 240); ctx.lineTo(735, 315);
    ctx.stroke();

    // 2. 卵巢 (Ovaries) - 左右兩側
    drawOvary(245, 320, false, time); // 左側靜態濾泡
    drawOvary(755, 320, true, time);  // 右側動態排卵與黃體

    // 3. 子宮外肌層與輸卵管外輪廓 (配合中心線調整壁厚與弧度)
    ctx.fillStyle = '#be5a6b';
    ctx.strokeStyle = '#883444';
    ctx.lineWidth = 3;

    ctx.beginPath();
    // 子宮頂部 (Fundus)
    ctx.moveTo(430, 175);
    ctx.quadraticCurveTo(500, 150, 570, 175);

    // 右側輸卵管上緣 -> 壺腹部 -> 傘部外緣
    ctx.bezierCurveTo(625, 136, 735, 130, 792, 180);
    ctx.bezierCurveTo(820, 212, 818, 265, 796, 285);

    // 右側傘部爪狀 (Fimbriae) - 朝向卵巢開展的指狀突起
    const fimbriaWave = Math.sin(time * 60) * (time < 0.18 ? 4 : 1);
    ctx.lineTo(782, 302 + fimbriaWave);
    ctx.lineTo(788, 278);
    ctx.lineTo(770, 294 - fimbriaWave);
    ctx.lineTo(778, 272);
    ctx.lineTo(760, 282 + fimbriaWave);

    // 右側輸卵管下緣 (內側壁)
    ctx.bezierCurveTo(778, 248, 778, 212, 762, 192);
    ctx.bezierCurveTo(726, 170, 630, 172, 576, 206);

    // 右側子宮體外緣 -> 子宮頸 -> 陰道右壁
    ctx.bezierCurveTo(585, 280, 550, 355, 532, 415);
    ctx.lineTo(538, 560);
    ctx.lineTo(462, 560);
    ctx.lineTo(468, 415);

    // 左側子宮體外緣
    ctx.bezierCurveTo(450, 355, 415, 280, 424, 206);

    // 左側輸卵管下緣 -> 傘部 -> 上緣 (對稱鏡像)
    ctx.bezierCurveTo(370, 172, 274, 170, 238, 192);
    ctx.bezierCurveTo(222, 212, 222, 248, 240, 282);
    ctx.lineTo(222, 272);
    ctx.lineTo(230, 294);
    ctx.lineTo(212, 278);
    ctx.lineTo(218, 302);
    ctx.lineTo(204, 285);
    ctx.bezierCurveTo(182, 265, 180, 212, 208, 180);
    ctx.bezierCurveTo(265, 130, 375, 136, 430, 175);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 4. 輸卵管內部通道 (Lumen) - 依據中心樣條精準繪製
    // 右側管腔通道
    ctx.strokeStyle = '#380c16';
    ctx.lineWidth = 19;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let s = 0.08; s <= 0.77; s += 0.02) {
        const pt = getSplinePoint(tubeWaypointsRight, s);
        if (s === 0.08) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();

    // 內壁黏膜襯層高光 (增加立體管道層次)
    ctx.strokeStyle = '#5c1d28';
    ctx.lineWidth = 13;
    ctx.beginPath();
    for (let s = 0.08; s <= 0.77; s += 0.02) {
        const pt = getSplinePoint(tubeWaypointsRight, s);
        if (s === 0.08) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();

    // 左側管腔通道 (鏡像)
    ctx.strokeStyle = '#380c16';
    ctx.lineWidth = 19;
    ctx.beginPath();
    for (let s = 0.08; s <= 0.77; s += 0.02) {
        const pt = getSplinePoint(tubeWaypointsRight, s);
        const lx = 1000 - pt.x;
        if (s === 0.08) ctx.moveTo(lx, pt.y);
        else ctx.lineTo(lx, pt.y);
    }
    ctx.stroke();

    ctx.strokeStyle = '#5c1d28';
    ctx.lineWidth = 13;
    ctx.beginPath();
    for (let s = 0.08; s <= 0.77; s += 0.02) {
        const pt = getSplinePoint(tubeWaypointsRight, s);
        const lx = 1000 - pt.x;
        if (s === 0.08) ctx.moveTo(lx, pt.y);
        else ctx.lineTo(lx, pt.y);
    }
    ctx.stroke();

    // 動態輸卵管纖毛 (Cilia) - 沿著管壁朝子宮方向波動擺動，真實呈現卵子運輸機制
    ctx.strokeStyle = 'rgba(244, 114, 182, 0.45)';
    ctx.lineWidth = 1.3;
    ctx.lineCap = 'round';
    for (let s = 0.12; s <= 0.74; s += 0.038) {
        const pt = getSplinePoint(tubeWaypointsRight, s);
        const nextPt = getSplinePoint(tubeWaypointsRight, Math.min(1, s + 0.015));
        const dx = nextPt.x - pt.x;
        const dy = nextPt.y - pt.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        const cWave = Math.sin(time * 50 + s * 35) * 2.2;
        const flowX = (nextPt.x - pt.x) / len * 3.5;
        const flowY = (nextPt.y - pt.y) / len * 3.5;

        // 上壁纖毛
        ctx.beginPath();
        ctx.moveTo(pt.x + nx * 8.5, pt.y + ny * 8.5);
        ctx.lineTo(pt.x + nx * 4.5 + flowX + cWave * ny, pt.y + ny * 4.5 + flowY - cWave * nx);
        ctx.stroke();

        // 下壁纖毛
        ctx.beginPath();
        ctx.moveTo(pt.x - nx * 8.5, pt.y - ny * 8.5);
        ctx.lineTo(pt.x - nx * 4.5 + flowX - cWave * ny, pt.y - ny * 4.5 + flowY + cWave * nx);
        ctx.stroke();
    }

    // 5. 子宮內膜 (Endometrium) - 隨排卵後黃體素分泌而增厚充血
    const endoThick = lerp(10, 24, norm(time, 0.0, 0.65));
    ctx.fillStyle = '#9f1239'; // 深紅充血內膜
    ctx.beginPath();
    ctx.moveTo(440, 195);
    ctx.quadraticCurveTo(500, 182, 560, 195);
    ctx.quadraticCurveTo(555, 300, 515, 405);
    ctx.lineTo(485, 405);
    ctx.quadraticCurveTo(445, 300, 440, 195);
    ctx.fill();

    // 6. 子宮腔 (Uterine Cavity) & 陰道腔 (Vagina)
    ctx.fillStyle = '#3b0a18';
    ctx.beginPath();
    ctx.moveTo(440 + endoThick * 0.6, 202);
    ctx.quadraticCurveTo(500, 195 + endoThick * 0.2, 560 - endoThick * 0.6, 202);
    ctx.quadraticCurveTo(545 - endoThick * 0.7, 295, 508, 405);
    // 子宮頸管 (Cervical canal)
    ctx.lineTo(506, 435);
    // 陰道腔
    ctx.lineTo(522, 560);
    ctx.lineTo(478, 560);
    ctx.lineTo(494, 435);
    ctx.lineTo(492, 405);
    ctx.quadraticCurveTo(455 + endoThick * 0.7, 295, 440 + endoThick * 0.6, 202);
    ctx.fill();

    // 繪製內膜微血管紋理 (增加真實感)
    if (endoThick > 14) {
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.35)';
        ctx.lineWidth = 1.5;
        for (let y = 220; y < 350; y += 18) {
            ctx.beginPath();
            ctx.moveTo(552, y);
            ctx.quadraticCurveTo(542, y + 4, 558 - endoThick * 0.65, y + 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(448, y);
            ctx.quadraticCurveTo(458, y + 4, 442 + endoThick * 0.65, y + 2);
            ctx.stroke();
        }
    }

    ctx.restore();
}

// 繪製卵巢與濾泡/黃體變化
function drawOvary(cx, cy, isActive, time) {
    ctx.save();
    // 卵巢本體
    ctx.fillStyle = '#fde68a';
    ctx.strokeStyle = '#b45309';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 42, 28, isActive ? -0.2 : 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 原始小濾泡點綴
    ctx.fillStyle = '#f59e0b';
    const offsets = [[-20, -8], [-10, 12], [15, 10], [-25, 5]];
    offsets.forEach(([ox, oy]) => {
        ctx.beginPath();
        ctx.arc(cx + ox, cy + oy, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    if (isActive) {
        if (time < 0.05) {
            // 成熟格拉夫氏濾泡腫脹並破裂
            const swell = norm(time, 0, 0.03);
            ctx.fillStyle = '#fef3c7';
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx + 8, cy - 8, 12 + swell * 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // 濾泡液腔
            ctx.fillStyle = '#bae6fd';
            ctx.beginPath();
            ctx.arc(cx + 8, cy - 8, 8 + swell * 4, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 排卵後轉變為黃體 (Corpus Luteum) - 分泌黃體素維持內膜
            const clGrowth = norm(time, 0.05, 0.25);
            const clSize = lerp(10, 16, clGrowth);
            ctx.fillStyle = '#eab308';
            ctx.strokeStyle = '#ca8a04';
            ctx.lineWidth = 3;
            ctx.beginPath();
            // 皺褶狀黃體
            for (let a = 0; a < Math.PI * 2; a += 0.4) {
                const r = clSize + Math.sin(a * 5) * 2.5;
                const px = cx + 8 + Math.cos(a) * r;
                const py = cy - 6 + Math.sin(a) * r;
                if (a === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    }
    ctx.restore();
}

// 繪製精子群游動 (嚴格沿著輸卵管中心線樣條前進)
function drawSpermSwarm(time) {
    if (time < 0.12 || time > 0.52) return;

    const fade = time > 0.45 ? 1 - norm(time, 0.45, 0.52) : 1;
    // 0=陰道底, 1=抵達壺腹部卵子處
    const baseProgress = norm(time, 0.13, 0.28);

    ctx.save();
    sperms.forEach(sp => {
        let p = baseProgress * sp.speedFactor;
        if (!sp.isWinner && p > 0.98) {
            // 非贏家精子被擋在透明帶外圍打轉爭奪
            p = 0.98 + Math.sin(time * 25 + sp.phase) * 0.012;
        }
        if (sp.isWinner && time > 0.36) {
            // 贏家已經鑽入卵子內融合，宏觀視角由卵細胞核呈現
            return;
        }
        p = clamp(p, 0, 1);

        const { pt, tangent } = getSpermPosition(p, sp.goRight);
        let angle = Math.atan2(tangent.y, tangent.x);

        // 橫向散開偏移：在陰道與子宮腔較寬，在輸卵管內嚴格限制在管腔直徑內
        const len = Math.hypot(tangent.x, tangent.y) || 1;
        const nx = -tangent.y / len;
        const ny = tangent.x / len;

        let maxSpread = 4.2; // 輸卵管內管徑半徑約 9px，散開半徑 4.2px 確保完全在管內
        if (p < 0.25) {
            maxSpread = 14; // 陰道腔寬度較寬
        } else if (p < 0.55) {
            maxSpread = lerp(14, 5, (p - 0.25) / 0.30); // 子宮腔往輸卵管口收斂
        }

        let sx = pt.x + nx * (sp.lateralOffset * maxSpread);
        let sy = pt.y + ny * (sp.lateralOffset * maxSpread);

        // 抵達壺腹部卵子周圍時聚集環繞
        if (p >= 0.97 && sp.goRight) {
            const eggAmpulla = { x: 722, y: 156 };
            if (sp.isWinner) {
                // 贏家直接游向卵子中心並穿入
                const winP = norm(time, 0.27, 0.35);
                const approachDist = lerp(18, 0, winP);
                sx = eggAmpulla.x + approachDist * Math.cos(sp.phase * 0.2);
                sy = eggAmpulla.y + approachDist * Math.sin(sp.phase * 0.2);
                angle = Math.atan2(eggAmpulla.y - sy, eggAmpulla.x - sx);
            } else {
                // 其他精子在透明帶外圍打轉爭先恐後
                const orbitR = 14 + (sp.id % 4) * 2;
                const orbAng = sp.phase + time * (10 + (sp.id % 5) * 3);
                sx = eggAmpulla.x + Math.cos(orbAng) * orbitR;
                sy = eggAmpulla.y + Math.sin(orbAng) * orbitR;
                angle = orbAng + Math.PI; // 面向卵子
            }
        }

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(angle);
        ctx.globalAlpha = fade * 0.92;

        // 精子尾巴擺動
        ctx.strokeStyle = sp.isWinner ? '#7dd3fc' : '#e2e8f0';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-3, 0);
        for (let i = 1; i <= sp.tailLength; i++) {
            const wy = Math.sin(time * sp.wiggleFreq + sp.phase - i * 0.65) * (i * 0.35);
            ctx.lineTo(-3 - i * 1.3, wy);
        }
        ctx.stroke();

        // 精子頭部
        ctx.fillStyle = sp.isWinner ? '#38bdf8' : '#ffffff';
        ctx.beginPath();
        ctx.ellipse(0, 0, 3.2, 1.9, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    });
    ctx.restore();
}

// 繪製宏觀視角下的卵子、卵裂胚胎、囊胚
function drawMacroEggAndEmbryo(time) {
    if (time > 0.78) return; // 0.78之後交給胎兒發育繪圖函數

    const pos = getEggPosition(time);
    ctx.save();
    ctx.translate(pos.x, pos.y);

    if (time < 0.46) {
        // 排卵 ~ 受精階段的卵子
        // 放射冠光暈
        ctx.fillStyle = 'rgba(253, 224, 71, 0.25)';
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();

        // 透明帶 (受精後變亮藍表示皮質反應硬化)
        const fertilized = time > 0.35;
        ctx.strokeStyle = fertilized ? '#38bdf8' : '#fde047';
        ctx.lineWidth = 2.5;
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 細胞核 / 原核
        ctx.fillStyle = '#ca8a04';
        if (time > 0.35 && time < 0.43) {
            // 雙原核接近
            const merge = norm(time, 0.35, 0.43);
            ctx.beginPath(); ctx.arc(-3 * (1 - merge), 0, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#0284c7';
            ctx.beginPath(); ctx.arc(3 * (1 - merge), 0, 2.5, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = fertilized ? '#9333ea' : '#ca8a04';
            ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, Math.PI * 2); ctx.fill();
        }
    } else if (time < 0.62) {
        // 階段 4：卵裂期 (2 -> 4 -> 8 -> 桑椹胚)
        const cleaveP = norm(time, 0.46, 0.62);
        // 透明帶依然包裹
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.fillStyle = 'rgba(30, 41, 59, 0.5)';
        ctx.beginPath();
        ctx.arc(0, 0, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#f472b6';
        ctx.strokeStyle = '#be185d';
        ctx.lineWidth = 1;

        if (cleaveP < 0.25) {
            // 2-細胞期
            [-4, 4].forEach(ox => {
                ctx.beginPath(); ctx.arc(ox, 0, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            });
        } else if (cleaveP < 0.50) {
            // 4-細胞期
            [[-3.5, -3.5], [3.5, -3.5], [-3.5, 3.5], [3.5, 3.5]].forEach(([ox, oy]) => {
                ctx.beginPath(); ctx.arc(ox, oy, 4.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            });
        } else if (cleaveP < 0.75) {
            // 8-細胞期
            for (let i = 0; i < 7; i++) {
                const a = (i / 6) * Math.PI * 2;
                const r = i === 6 ? 0 : 4.8;
                ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 3.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
        } else {
            // 桑椹胚 (Morula, 16~32細胞緊密排列)
            for (let i = 0; i < 14; i++) {
                const a = i * 2.4;
                const r = Math.sqrt(i) * 2.1;
                ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 2.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
        }
    } else {
        // 囊胚期 (Blastocyst) 與 著床 (Implantation)
        const implantP = norm(time, 0.68, 0.78);
        const radius = lerp(12, 16, implantP);

        // 著床時滋養層侵入子宮內膜的根狀突起
        if (implantP > 0.1) {
            ctx.strokeStyle = '#f472b6';
            ctx.lineWidth = 2;
            for (let a = -0.9; a <= 0.9; a += 0.3) {
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * radius * 0.8, Math.sin(a) * radius * 0.8);
                ctx.lineTo(Math.cos(a) * (radius + implantP * 9), Math.sin(a) * (radius + implantP * 9));
                ctx.stroke();
            }
        }

        // 囊胚腔
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 內細胞群 (Inner Cell Mass - 將發育為胎兒本體)
        ctx.fillStyle = '#38bdf8';
        for (let i = 0; i < 7; i++) {
            const ox = 4 + (i % 3) * 2.5 - 2;
            const oy = (Math.floor(i / 3) - 1) * 3;
            ctx.beginPath();
            ctx.arc(ox, oy, 2.8, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    ctx.restore();
}

// 繪製階段 3 的「顯微放大受精過程視窗 (PIP)」與階段 4 的「卵裂放大視窗」
// 作為固定 HUD 繪製於螢幕空間，投影指引線自動貼合當前縮放平移後的卵子螢幕坐標
function drawMicroscopeZoom(time, currentZoom, currentPanX, currentPanY) {
    if (time < 0.26 || time > 0.65) return;

    const alpha = time < 0.28 ? norm(time, 0.26, 0.28) : (time > 0.63 ? 1 - norm(time, 0.63, 0.65) : 1);
    const eggPos = getEggPosition(time);

    // 固定 HUD 視窗坐標
    const zoomX = 185;
    const zoomY = 460;
    const zoomR = 120;

    // 計算宏觀卵子在畫布螢幕上的實際坐標
    const eggScreenX = eggPos.x * currentZoom + currentPanX;
    const eggScreenY = eggPos.y * currentZoom + currentPanY;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 繪製從宏觀卵子連接到顯微視窗的引導投影線 (若卵子在視野附近則繪製)
    if (eggScreenX > -80 && eggScreenX < canvas.width + 80 && eggScreenY > -80 && eggScreenY < canvas.height + 80) {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(eggScreenX, eggScreenY);
        ctx.lineTo(zoomX + zoomR * 0.6, zoomY - zoomR * 0.8);
        ctx.moveTo(eggScreenX, eggScreenY);
        ctx.lineTo(zoomX + zoomR * 0.9, zoomY + zoomR * 0.2);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // 顯微圓形視窗背景與裁切
    ctx.save();
    ctx.beginPath();
    ctx.arc(zoomX, zoomY, zoomR, 0, Math.PI * 2);
    ctx.clip();

    // 顯微鏡深色背景與格線
    ctx.fillStyle = '#090d16';
    ctx.fillRect(zoomX - zoomR, zoomY - zoomR, zoomR * 2, zoomR * 2);

    ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
    ctx.lineWidth = 1;
    for (let g = -zoomR; g <= zoomR; g += 25) {
        ctx.beginPath(); ctx.moveTo(zoomX + g, zoomY - zoomR); ctx.lineTo(zoomX + g, zoomY + zoomR); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(zoomX - zoomR, zoomY + g); ctx.lineTo(zoomX + zoomR, zoomY + g); ctx.stroke();
    }

    if (time <= 0.46) {
        // ====== 顯微受精細節 ======
        const fertP = norm(time, 0.28, 0.45);
        const corticalReaction = norm(fertP, 0.35, 0.55);

        // 1. 放射冠細胞 (Corona Radiata)
        for (let i = 0; i < 24; i++) {
            const a = (i / 24) * Math.PI * 2;
            const cr = 82 + Math.sin(i * 3 + time * 10) * 2;
            ctx.fillStyle = 'rgba(253, 224, 71, 0.35)';
            ctx.strokeStyle = 'rgba(234, 179, 8, 0.6)';
            ctx.beginPath();
            ctx.arc(zoomX + Math.cos(a) * cr, zoomY + Math.sin(a) * cr, 8.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }

        // 2. 透明帶 (Zona Pellucida) - 皮質反應後由淡黃變為亮青色防護罩
        ctx.lineWidth = 13;
        ctx.strokeStyle = corticalReaction > 0
            ? `rgba(56, 189, 248, ${0.35 + corticalReaction * 0.45})`
            : 'rgba(254, 240, 138, 0.35)';
        ctx.beginPath();
        ctx.arc(zoomX, zoomY, 66, 0, Math.PI * 2);
        ctx.stroke();

        // 皮質反應震波特效
        if (corticalReaction > 0 && corticalReaction < 1) {
            ctx.strokeStyle = `rgba(125, 211, 252, ${1 - corticalReaction})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(zoomX, zoomY, 58 + corticalReaction * 18, 0, Math.PI * 2);
            ctx.stroke();
        }

        // 3. 卵細胞質 (Ooplasm) & 第一極體
        ctx.fillStyle = '#fef08a';
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(zoomX, zoomY, 56, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 極體 (Polar body)
        ctx.fillStyle = '#fde047';
        ctx.beginPath(); ctx.arc(zoomX + 10, zoomY - 54, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        if (fertP > 0.4) {
            ctx.beginPath(); ctx.arc(zoomX + 22, zoomY - 52, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }

        // 4. 競爭失敗的其他精子 (被透明帶擋在外面)
        const loserAngles = [2.2, 2.9, -2.4, -1.6, 0.9];
        loserAngles.forEach((ang, idx) => {
            const approach = clamp(fertP * 2.2 - idx * 0.12, 0, 1);
            const dist = lerp(120, 75, approach) + (corticalReaction > 0 ? corticalReaction * 6 : 0);
            const lx = zoomX + Math.cos(ang) * dist;
            const ly = zoomY + Math.sin(ang) * dist;
            drawMicroSperm(lx, ly, ang + Math.PI, time, false);
        });

        // 5. 冠軍精子穿透與原核融合
        if (fertP < 0.45) {
            const winApproach = norm(fertP, 0, 0.40);
            const dist = lerp(110, 50, winApproach);
            const wx = zoomX + dist;
            const wy = zoomY;
            if (winApproach > 0.2 && winApproach < 0.9) {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
                ctx.beginPath();
                ctx.arc(wx - 8, wy, 7 + Math.sin(time * 80) * 2, 0, Math.PI * 2);
                ctx.fill();
            }
            drawMicroSperm(wx, wy, Math.PI, time, true);
        }

        // 6. 雌原核與雄原核融合
        const mergeP = norm(fertP, 0.45, 0.88);
        if (mergeP < 1) {
            // 雌原核
            const femX = lerp(zoomX - 22, zoomX, mergeP);
            ctx.fillStyle = 'rgba(236, 72, 153, 0.85)';
            ctx.beginPath();
            ctx.arc(femX, zoomY, 12, 0, Math.PI * 2);
            ctx.fill();

            // 雄原核
            if (fertP > 0.38) {
                const maleX = lerp(zoomX + 40, zoomX, mergeP);
                ctx.fillStyle = 'rgba(14, 165, 233, 0.85)';
                ctx.beginPath();
                ctx.arc(maleX, zoomY, 12, 0, Math.PI * 2);
                ctx.fill();
            }
        } else {
            // 融合完成：單一二倍體合子核 (2n)
            const glow = Math.sin(time * 25) * 3;
            ctx.fillStyle = '#9333ea';
            ctx.strokeStyle = '#e879f9';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(zoomX, zoomY, 17 + glow * 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }

        // 顯微視窗內部說明標籤
        if (showLabels) {
            ctx.font = 'bold 11px sans-serif';
            ctx.fillStyle = '#38bdf8';
            ctx.textAlign = 'center';
            let statusStr = "精子釋放頂體酶穿透透明帶";
            if (fertP >= 0.35 && fertP < 0.55) statusStr = "皮質反應：透明帶硬化阻止多精受精";
            else if (fertP >= 0.55 && fertP < 0.88) statusStr = "雌原核 (n) 與 雄原核 (n) 融合";
            else if (fertP >= 0.88) statusStr = "受精完成：形成二倍體合子 (2n)";
            ctx.fillText(statusStr, zoomX, zoomY + 98);

            ctx.font = '10px sans-serif';
            ctx.fillStyle = '#fde047';
            ctx.fillText("透明帶", zoomX - 50, zoomY - 46);
            ctx.fillText("放射冠", zoomX - 74, zoomY - 65);
        }

    } else {
        // ====== 顯微卵裂細節 (t = 0.46 ~ 0.65) ======
        const cleaveP = norm(time, 0.46, 0.65);

        // 透明帶外圈
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.7)';
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.arc(zoomX, zoomY, 70, 0, Math.PI * 2);
        ctx.stroke();

        let stageLabel = "";
        if (cleaveP < 0.22) {
            stageLabel = "2-細胞期 (2-Cell Stage)";
            drawBlastomere(zoomX - 26, zoomY, 32);
            drawBlastomere(zoomX + 26, zoomY, 32);
        } else if (cleaveP < 0.45) {
            stageLabel = "4-細胞期 (4-Cell Stage)";
            drawBlastomere(zoomX - 22, zoomY - 22, 25);
            drawBlastomere(zoomX + 22, zoomY - 22, 25);
            drawBlastomere(zoomX - 22, zoomY + 22, 25);
            drawBlastomere(zoomX + 22, zoomY + 22, 25);
        } else if (cleaveP < 0.68) {
            stageLabel = "8-細胞期 (8-Cell Stage)";
            for (let i = 0; i < 7; i++) {
                const a = (i / 6) * Math.PI * 2;
                const r = i === 6 ? 0 : 32;
                drawBlastomere(zoomX + Math.cos(a) * r, zoomY + Math.sin(a) * r, 19);
            }
        } else if (cleaveP < 0.86) {
            stageLabel = "桑椹胚 (Morula, 16-32細胞)";
            for (let i = 0; i < 19; i++) {
                const a = i * 2.4;
                const r = Math.sqrt(i) * 12;
                drawBlastomere(zoomX + Math.cos(a) * r, zoomY + Math.sin(a) * r, 13);
            }
        } else {
            stageLabel = "囊胚 (Blastocyst：具囊胚腔與內細胞群)";
            // 滋養層細胞環 (Trophoblast)
            for (let i = 0; i < 20; i++) {
                const a = (i / 20) * Math.PI * 2;
                drawBlastomere(zoomX + Math.cos(a) * 58, zoomY + Math.sin(a) * 58, 9.5, '#ec4899');
            }
            // 內細胞群 (Inner Cell Mass)
            for (let i = 0; i < 10; i++) {
                const a = i * 2.1;
                const r = Math.sqrt(i) * 7.5;
                drawBlastomere(zoomX + 24 + Math.cos(a) * r, zoomY + Math.sin(a) * r, 9.5, '#38bdf8');
            }
        }

        if (showLabels) {
            ctx.font = 'bold 11px sans-serif';
            ctx.fillStyle = '#f472b6';
            ctx.textAlign = 'center';
            ctx.fillText(stageLabel, zoomX, zoomY + 100);
        }
    }

    ctx.restore(); // 結束圓形裁切

    // 顯微鏡外框與標題
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(zoomX, zoomY, zoomR, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#0284c7';
    ctx.beginPath();
    ctx.roundRect(zoomX - 75, zoomY - zoomR - 14, 150, 25, 12);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(time <= 0.46 ? "🔬 顯微放大：受精過程" : "🔬 顯微放大：卵裂發育", zoomX, zoomY - zoomR + 3);

    ctx.restore();
}

// 繪製顯微視角下的單隻精子
function drawMicroSperm(x, y, angle, time, isWinner) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // 尾巴
    ctx.strokeStyle = isWinner ? '#7dd3fc' : '#cbd5e1';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, 0);
    for (let i = 1; i <= 12; i++) {
        ctx.lineTo(-8 - i * 3, Math.sin(time * 85 - i * 0.6) * (i * 0.55));
    }
    ctx.stroke();

    // 中段 (粒線體鞘)
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-3, 0);
    ctx.lineTo(-8, 0);
    ctx.stroke();

    // 頭部與頂體
    ctx.fillStyle = isWinner ? '#38bdf8' : '#f8fafc';
    ctx.beginPath();
    ctx.ellipse(2, 0, 6, 3.8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// 繪製分裂球細胞 (Blastomere)
function drawBlastomere(x, y, r, color = '#f472b6') {
    ctx.fillStyle = color;
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 細胞核
    ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.38, 0, Math.PI * 2);
    ctx.fill();
}

// 繪製階段 6：胚胎發育成胎兒
function drawFetalDevelopment(time) {
    if (time <= 0.78) return;

    const p = norm(time, 0.78, 1.0);

    // 著床中心隨成長逐漸往子宮腔中央擴展
    const cx = lerp(550, 502, clamp(p * 1.4, 0, 1));
    const cy = lerp(265, 282, clamp(p * 1.4, 0, 1));
    const sacR = lerp(16, 68, p);

    ctx.save();

    // 1. 胎盤 (Placenta) - 附著在右側子宮內膜壁上
    ctx.fillStyle = '#be123c';
    ctx.strokeStyle = '#fb7185';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const placX = lerp(556, 562, p);
    const placY = 268;
    ctx.ellipse(placX, placY, lerp(6, 16, p), lerp(18, 52, p), 0.12, -Math.PI * 0.5, Math.PI * 0.5);
    ctx.quadraticCurveTo(placX - lerp(8, 22, p), placY, placX, placY - lerp(18, 52, p));
    ctx.fill();
    ctx.stroke();

    // 2. 羊膜囊與羊水 (Amniotic Sac & Fluid)
    const grad = ctx.createRadialGradient(cx - sacR * 0.2, cy - sacR * 0.2, 5, cx, cy, sacR);
    grad.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
    grad.addColorStop(1, 'rgba(14, 116, 144, 0.65)');
    ctx.fillStyle = grad;
    ctx.strokeStyle = 'rgba(186, 230, 253, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, sacR * 0.88, sacR, 0.05, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 3. 臍帶 (Umbilical Cord) - 連接胎兒腹部與胎盤
    if (p > 0.12) {
        ctx.strokeStyle = '#fda4af';
        ctx.lineWidth = lerp(2, 5.5, p);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx + 4, cy + sacR * 0.12);
        ctx.bezierCurveTo(cx + sacR * 0.5, cy + sacR * 0.35, placX - 25, placY - 15, placX - 8, placY);
        ctx.stroke();
    }

    // 4. 胚胎 -> 胎兒形態動態演化
    ctx.save();
    ctx.translate(cx - sacR * 0.08, cy);
    ctx.rotate(Math.sin(time * 25) * 0.05);

    const fScale = lerp(0.22, 1.0, p);
    ctx.scale(fScale, fScale);

    ctx.fillStyle = '#fecdd3';
    ctx.strokeStyle = '#f43f5e';
    ctx.lineWidth = 2;

    if (p < 0.3) {
        ctx.beginPath();
        ctx.arc(0, -14, 15, 0, Math.PI * 2);
        ctx.arc(-8, 10, 14, 0, Math.PI * 2);
        ctx.fill();
    } else {
        const limbGrowth = norm(p, 0.3, 0.85);

        // 捲曲軀幹與臀部
        ctx.beginPath();
        ctx.ellipse(-6, 16, 17, 24, -0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 胎兒頭部
        ctx.beginPath();
        ctx.arc(2, -18, 21, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 閉眼弧線
        if (p > 0.45) {
            ctx.strokeStyle = '#881337';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.arc(10, -20, 4, 0.2, Math.PI - 0.2);
            ctx.stroke();
        }

        // 手臂
        ctx.fillStyle = '#fda4af';
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(6, 6, 5 + limbGrowth * 7, 5, 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 腿部
        ctx.beginPath();
        ctx.ellipse(5, 32, 6 + limbGrowth * 9, 6, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    // 5. 跳動的胚胎心臟
    if (p > 0.15) {
        const beat = 1 + Math.sin(time * 160) * 0.28;
        ctx.fillStyle = '#e11d48';
        ctx.beginPath();
        ctx.arc(-2, 6, 4.5 * beat, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
    ctx.restore();
}

// 繪製解剖與動態過程文字標籤
function drawLabels(time) {
    if (!showLabels) return;

    ctx.save();

    function label(text, targetX, targetY, labelX, labelY, color = '#f8fafc', borderColor = '#64748b') {
        ctx.font = 'bold 13px "Segoe UI", sans-serif';

        const padX = 10;
        const boxW = metrics.width + padX * 2;
        const boxH = 26;

        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 1.5;

        ctx.moveTo(targetX, targetY);
        ctx.lineTo(labelX, labelY);
        ctx.stroke();

        ctx.fillStyle = borderColor;
        ctx.beginPath();
        ctx.arc(targetX, targetY, 3.5, 0, Math.PI * 2);

        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(labelX - boxW / 2, labelY - boxH / 2, boxW, boxH, 6);

    // --- 隨時間變化的動態主角標籤 ---
    if (time < 0.78) {
        const eggPos = getEggPosition(time);

        else if (time >= 0.46 && time < 0.54) dynamicText = "卵裂：2~4 細胞期";
        else if (time >= 0.54 && time < 0.62) dynamicText = "桑椹胚 (Morula)";
        else if (time >= 0.62 && time < 0.68) dynamicText = "囊胚 (Blastocyst)";
        else if (time >= 0.68) dynamicText = "囊胚著床 (埋入子宮內膜)";

        const offsetY = eggPos.y < 200 ? -52 : -45;
        const offsetX = eggPos.x > 660 ? 30 : (eggPos.x > 530 ? 110 : 0);
        label(dynamicText, eggPos.x, eggPos.y, eggPos.x + offsetX, eggPos.y + offsetY, '#38bdf8', '#0284c7');
    } else {

        if (p > 0.25) {

        label("精子群游入尋找卵子", spPt.x, spPt.y, 355, 430, '#e2e8f0', '#94a3b8');
    }

    ctx.restore();
}

// 限制 Pan 範圍，防止內容平移出螢幕太遠
function clampPan() {
    const maxX = canvas.width * Math.max(0, zoom - 0.7);
    const minX = -canvas.width * Math.max(0, zoom - 0.7);
    const maxY = canvas.height * Math.max(0, zoom - 0.7);
    const minY = -canvas.height * Math.max(0, zoom - 0.7);
    panX = clamp(panX, minX, maxX);
    panY = clamp(panY, minY, maxY);
}

// 更新縮放數值 UI
function updateZoomUI() {
    if (zoomLevelText) {
        zoomLevelText.textContent = `${Math.round(zoom * 100)}%`;
    }
}

// 重設 Pan 與 Zoom
function resetZoomPan() {
    zoom = 1.0;
    panX = 0;
    panY = 0;
    updateZoomUI();
}

// 以指定客戶端像素坐標為中心進行縮放
function zoomAt(clientX, clientY, factor) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const cx = (clientX - rect.left) * scaleX;
    const cy = (clientY - rect.top) * scaleY;

    const newZoom = clamp(zoom * factor, minZoom, maxZoom);
    if (Math.abs(newZoom - zoom) < 0.001) return;

    panX = cx - (cx - panX) * (newZoom / zoom);
    panY = cy - (cy - panY) * (newZoom / zoom);
    zoom = newZoom;

    clampPan();
    updateZoomUI();
}

// 更新上方資訊列與按鈕高亮狀態
function updateUI() {
    timeline.value = Math.round(t * 1000);
    progressText.textContent = `${Math.round(t * 100)}%`;

    let currentStageIdx = 0;
    for (let i = 0; i < stages.length; i++) {
        if (t >= stages[i].start && t <= stages[i].end) {
            currentStageIdx = i;
            break;
        }
    }
    const st = stages[currentStageIdx];
    const localP = norm(t, st.start, st.end);

    stageTitle.textContent = st.title;
    stageDesc.textContent = st.desc;
    dayCounter.textContent = st.day(localP);

    stageBtns.forEach((btn, idx) => {
        btn.classList.toggle('current', idx === currentStageIdx);
    });
}

// 主動畫迴圈
function animate(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = timestamp - lastTimestamp;
    lastTimestamp = timestamp;

    if (isPlaying) {
        t += (dt / baseDuration) * playbackSpeed;
        if (t >= 1.0) {
            t = 1.0;
            isPlaying = false;
            playPauseBtn.textContent = "▶ 重新播放";
        }
        updateUI();
    }

    // 清除畫布
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 世界坐標系 (套用平移與縮放)
    ctx.save();
    ctx.translate(panX, panY);
    ctx.scale(zoom, zoom);

    // 依圖層順序繪製解剖實體與動態物件
    drawAnatomy(t);
    drawSpermSwarm(t);
    drawMacroEggAndEmbryo(t);
    drawFetalDevelopment(t);
    drawLabels(t);

    ctx.restore();

    // 2. 螢幕坐標系 (固定 HUD 顯微受精/卵裂視窗)
    drawMicroscopeZoom(t, zoom, panX, panY);

    requestAnimationFrame(animate);
}

    }

});

// --- Pan & Zoom 事件綁定 (滑鼠拖曳、滾輪縮放、雙擊重設、雙指縮放) ---
canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    isPanning = true;
    startX = e.clientX;
    startY = e.clientY;
    if (canvasWrapper) canvasWrapper.classList.add('is-panning');
});

window.addEventListener('mousemove', (e) => {
    if (!isPanning) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const dx = (e.clientX - startX) * scaleX;
    const dy = (e.clientY - startY) * scaleY;
    startX = e.clientX;
    startY = e.clientY;

    panX += dx;
    panY += dy;
    clampPan();
});

window.addEventListener('mouseup', () => {
    if (isPanning) {
        isPanning = false;
        if (canvasWrapper) canvasWrapper.classList.remove('is-panning');
    }
});

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.14 : 0.88;
    zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

canvas.addEventListener('dblclick', () => {
    resetZoomPan();
});

// 觸控手勢支援 (單指平移、雙指捏合縮放)
let touchStartDist = 0;
let lastTouch = null;

canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches.length === 2) {
        touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        lastTouch = {
            x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
            y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
    }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    if (e.touches.length === 1 && lastTouch) {
        const dx = (e.touches[0].clientX - lastTouch.x) * scaleX;
        const dy = (e.touches[0].clientY - lastTouch.y) * scaleY;
        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        panX += dx;
        panY += dy;
        clampPan();
    } else if (e.touches.length === 2 && lastTouch) {
        const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        const center = {
            x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
            y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
        if (touchStartDist > 0 && dist > 0) {
            const factor = dist / touchStartDist;
            zoomAt(center.x, center.y, factor);
            touchStartDist = dist;
        }
        const dx = (center.x - lastTouch.x) * scaleX;
        const dy = (center.y - lastTouch.y) * scaleY;
        lastTouch = center;
        panX += dx;
        panY += dy;
        clampPan();
    }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) touchStartDist = 0;
    if (e.touches.length === 1) {
        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else {
        lastTouch = null;
    }
});

// 縮放工具列按鈕點擊
if (zoomInBtn) {
    zoomInBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = canvas.getBoundingClientRect();
        zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.25);
    });
}

if (zoomOutBtn) {
    zoomOutBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = canvas.getBoundingClientRect();
        zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 0.8);
    });
}

if (zoomResetBtn) {
    zoomResetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        resetZoomPan();
    });
}

// 快捷鍵支援 (+ / - 縮放, 0 / R 重設, 空白鍵播放/暫停)
window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const rect = canvas.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    if (e.key === '+' || e.key === '=') {
        zoomAt(cx, cy, 1.2);
    } else if (e.key === '-' || e.key === '_') {
        zoomAt(cx, cy, 0.83);
    } else if (e.key === '0' || e.key === 'r' || e.key === 'R') {
        resetZoomPan();
    } else if (e.code === 'Space') {
        e.preventDefault();
        playPauseBtn.click();
    }
});

// 啟動模擬器
updateUI();
updateZoomUI();
requestAnimationFrame(animate);
</script>
</body>
</html>
