<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Magic Number 7 ± 2 | 短期記憶挑戰</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <div class="title-wrap">
        <h1>Magic Number <span class="highlight">7 ± 2</span></h1>
        <p class="subtitle">短期記憶極限挑戰</p>
      </div>
      <div class="top-actions">
        <span class="best-pill">最高：<strong id="best-level">5</strong> 位</span>
        <button id="sound-btn" class="icon-btn" aria-label="切換音效">🔊</button>
      </div>
    </header>

    <main>
      <!-- Start Screen -->
      <section id="start-screen" class="screen active">
        <div class="card intro-card">
          <div class="icon-box">🧠</div>
          <h2>準備好了嗎？</h2>
          <ul class="rules-list">
            <li>螢幕將短暫顯示一組數字，請記住它們</li>
            <li>數字消失後，依序點擊數字鍵或使用鍵盤輸入</li>
            <li>從 <strong>5</strong> 位數開始，每過一關增加 1 位</li>
          </ul>
          <button id="start-btn" class="btn primary-btn">開始挑戰</button>
        </div>
      </section>

      <!-- Game Screen -->
      <section id="game-screen" class="screen">
        <div class="status-bar">
          <span class="level-indicator">Level <strong id="current-level">5</strong></span>
          <span class="digits-indicator"><strong id="digit-count">5</strong> 位數</span>
        </div>

        <div class="stage-col">
          <div class="display-area">
            <div id="number-display" class="number-container">...</div>
            <div class="mem-bar-track"><div id="mem-bar-fill" class="mem-bar-fill"></div></div>
            <div id="message-display" class="message hidden">請依序輸入剛才的數字</div>
          </div>

          <div id="input-display" class="input-feedback" aria-live="polite"></div>
        </div>

        <div class="keypad" role="group" aria-label="數字鍵盤">
          <button type="button" class="key" data-num="1">1</button>
          <button type="button" class="key" data-num="2">2</button>
          <button type="button" class="key" data-num="3">3</button>
          <button type="button" class="key" data-num="4">4</button>
          <button type="button" class="key" data-num="5">5</button>
          <button type="button" class="key" data-num="6">6</button>
          <button type="button" class="key" data-num="7">7</button>
          <button type="button" class="key" data-num="8">8</button>
          <button type="button" class="key" data-num="9">9</button>
          <button type="button" class="key action" id="clear-btn">C</button>
          <button type="button" class="key" data-num="0">0</button>
          <button type="button" class="key action" id="backspace-btn">⌫</button>
        </div>
      </section>

      <!-- Result Screen -->
      <section id="result-screen" class="screen">
        <div class="card result-card">
          <div class="result-icon" id="result-icon">🎉</div>
          <h2 id="result-title">挑戰結束</h2>
          <div class="score-box">
            <p class="score-label">最高完成位數</p>
            <p class="score-value" id="final-score">5</p>
          </div>
          <p id="result-message" class="result-message">你的記憶力不錯！</p>
          <button id="restart-btn" class="btn primary-btn">再試一次</button>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
