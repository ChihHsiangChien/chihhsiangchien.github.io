<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>經典俄羅斯方塊 | Tetris</title>
  <style>
    :root {
      --primary: #ec4899;
      --accent: #06b6d4;
      --bg: #090d16;
      --panel: rgba(17, 24, 39, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #090d16 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      touch-action: none;
    }

    .app-shell {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
      gap: 10px;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      max-width: 640px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .top-bar h1 {
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #ec4899);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      min-width: 42px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Main Play Area */
    .play-area {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 640px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #game-container {
      position: relative;
      height: 100%;
      max-height: 560px;
      aspect-ratio: 12 / 20;
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #050811;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
      touch-action: none;
    }

    #tetris {
      display: block;
      width: 100%;
      height: 100%;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 132px;
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .stat-card span {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .stat-card strong {
      font-size: 1.15rem;
      font-variant-numeric: tabular-nums;
    }

    #next-canvas {
      display: block;
      margin: 4px auto 0;
      width: 84px;
      height: 84px;
    }

    .controls-hint {
      font-size: 0.72rem;
      line-height: 1.5;
      color: var(--muted);
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
    }

    kbd {
      background: #334155;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: monospace;
      color: #fff;
    }

    /* Overlay */
    .ui-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      background: rgba(9, 13, 22, 0.86);
      backdrop-filter: blur(8px);
      z-index: 10;
      padding: 16px;
      text-align: center;
      transition: opacity 0.22s ease;
    }

    .ui-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .ui-overlay h2 {
      font-size: 1.5rem;
    }

    .ui-overlay p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .primary-btn {
      min-height: 46px;
      padding: 10px 28px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(236, 72, 153, 0.35);
    }

    /* Touch Controls */
    #touch-controls {
      display: none;
      width: 100%;
      max-width: 440px;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      touch-action: none;
    }

    @media (pointer: coarse), (hover: none) {
      #touch-controls {
        display: grid;
      }
      .controls-hint {
        display: none;
      }
    }

    .touch-btn {
      min-height: 54px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
    }

    .touch-btn:active {
      background: rgba(255, 255, 255, 0.24);
      transform: scale(0.94);
    }

    .touch-btn.rotate { background: rgba(56, 189, 248, 0.22); border-color: rgba(56, 189, 248, 0.45); }
    .touch-btn.hard { background: rgba(236, 72, 153, 0.24); border-color: rgba(236, 72, 153, 0.45); }

    @media (max-width: 520px) {
      .side-panel {
        width: 96px;
        gap: 6px;
      }
      .stat-card {
        padding: 6px;
      }
      #next-canvas {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <h1>🧱 經典俄羅斯方塊</h1>
      <div class="top-actions">
        <button id="pause-btn" class="icon-btn" disabled>⏸ 暫停</button>
        <button id="sound-btn" class="icon-btn" aria-label="切換音效">🔊</button>
      </div>
    </header>

    <main class="play-area">
      <div id="game-container">
        <canvas id="tetris" width="300" height="500"></canvas>
        <div id="overlay" class="ui-overlay">
          <h2 id="overlay-title">準備就緒</h2>
          <p id="overlay-desc">支援鍵盤、觸控按鈕，點擊棋盤可直接落下</p>
          <button id="start-btn" class="primary-btn">開始遊戲</button>
        </div>
      </div>

      <aside class="side-panel">
        <div class="stat-card">
          <span>下一個</span>
          <canvas id="next-canvas" width="96" height="96"></canvas>
        </div>
        <div class="stat-card">
          <span>分數</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat-card">
          <span>最高分</span>
          <strong id="best">0</strong>
        </div>
        <div class="stat-card">
          <span>等級 / 消行</span>
          <strong id="level">1 / 0</strong>
        </div>
        <div class="controls-hint">
          <kbd>←</kbd><kbd>→</kbd> 移動<br />
          <kbd>↑</kbd> 旋轉<br />
          <kbd>↓</kbd> 加速<br />
          <kbd>Space</kbd> 直落<br />
          <kbd>P</kbd> 暫停
        </div>
      </aside>
    </main>

    <footer id="touch-controls" aria-label="觸控方向鍵">
      <button id="btn-left" class="touch-btn" aria-label="左移">←</button>
      <button id="btn-down" class="touch-btn" aria-label="加速下落">↓</button>
      <button id="btn-up" class="touch-btn rotate" aria-label="旋轉">↻</button>
      <button id="btn-hard" class="touch-btn hard" aria-label="直接落地">⏬</button>
      <button id="btn-right" class="touch-btn" aria-label="右移">→</button>
    </footer>
  </div>

  <script>
    (() => {
      'use strict';

      const COLS = 12;
      const ROWS = 20;
      const CELL = 25; // 12*25 = 300, 20*25 = 500

      const canvas = document.getElementById('tetris');
      const ctx = canvas.getContext('2d');
      ctx.scale(CELL, CELL);

      const nextCanvas = document.getElementById('next-canvas');
      const nextCtx = nextCanvas.getContext('2d');
      nextCtx.scale(24, 24);

      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const levelEl = document.getElementById('level');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const startBtn = document.getElementById('start-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const soundBtn = document.getElementById('sound-btn');

      const COLORS = {
        0: '#000000',
        1: '#06b6d4', // I - Cyan
        2: '#f97316', // L - Orange
        3: '#3b82f6', // J - Blue
        4: '#eab308', // O - Yellow
        5: '#ef4444', // Z - Red
        6: '#22c55e', // S - Green
        7: '#a855f7'  // T - Purple
      };

      const SHAPES = {
        I: [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]],
        L: [[0,2,0],[0,2,0],[0,2,2]],
        J: [[0,3,0],[0,3,0],[3,3,0]],
        O: [[4,4],[4,4]],
        Z: [[5,5,0],[0,5,5],[0,0,0]],
        S: [[0,6,6],[6,6,0],[0,0,0]],
        T: [[0,7,0],[7,7,7],[0,0,0]]
      };

      // --- Web Audio Synthesizer ---
      const sound = {
        ctx: null,
        enabled: true,
        unlock() {
          if (!this.ctx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) this.ctx = new Ctx();
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        },
        tone(f1, f2, dur = 0.07, type = 'triangle', vol = 0.12) {
          if (!this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f1, now);
          osc.frequency.exponentialRampToValueAtTime(f2, now + dur);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur + 0.02);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.03);
        },
        move() { this.tone(260, 290, 0.03, 'sine', 0.06); },
        rotate() { this.tone(400, 560, 0.05, 'triangle', 0.1); },
        lock() { this.tone(150, 80, 0.07, 'triangle', 0.14); },
        clear(lines) {
          const base = 440 + lines * 80;
          this.tone(base, base * 1.4, 0.16, 'triangle', 0.18);
        },
        over() { this.tone(240, 85, 0.35, 'sawtooth', 0.14); }
      };

      // --- State ---
      const arena = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
      const player = { pos: { x: 0, y: 0 }, matrix: null, next: null, score: 0, level: 1, lines: 0 };
      let bestScore = Number(localStorage.getItem('tetris_best') || 0);
      let bag = [];
      let dropCounter = 0;
      let dropInterval = 900;
      let lastTime = 0;
      let isGameOver = false;
      let isPaused = true;
      let rafId = null;
      const activeRepeatTimers = new Set();

      function clearRepeatTimers() {
        for (const id of activeRepeatTimers) clearInterval(id);
        activeRepeatTimers.clear();
      }

      function nextPieceFromBag() {
        if (bag.length === 0) {
          bag = ['I', 'L', 'J', 'O', 'Z', 'S', 'T'];
          for (let i = bag.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [bag[i], bag[j]] = [bag[j], bag[i]];
          }
        }
        return SHAPES[bag.pop()].map((row) => row.slice());
      }

      function collide(grid, p, offsetY = 0) {
        const m = p.matrix;
        const ox = p.pos.x;
        const oy = p.pos.y + offsetY;
        for (let y = 0; y < m.length; y++) {
          for (let x = 0; x < m[y].length; x++) {
            if (m[y][x] !== 0) {
              if (!grid[y + oy] || grid[y + oy][x + ox] !== 0) return true;
            }
          }
        }
        return false;
      }

      function merge(grid, p) {
        p.matrix.forEach((row, y) => {
          row.forEach((val, x) => {
            if (val !== 0 && grid[y + p.pos.y]) {
              grid[y + p.pos.y][x + p.pos.x] = val;
            }
          });
        });
      }

      function rotateMatrix(matrix, dir) {
        for (let y = 0; y < matrix.length; y++) {
          for (let x = 0; x < y; x++) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
          }
        }
        if (dir > 0) matrix.forEach((r) => r.reverse());
        else matrix.reverse();
      }

      function playerRotate(dir) {
        const origX = player.pos.x;
        let offset = 1;
        rotateMatrix(player.matrix, dir);
        while (collide(arena, player)) {
          player.pos.x += offset;
          offset = -(offset + (offset > 0 ? 1 : -1));
          if (Math.abs(offset) > player.matrix[0].length) {
            rotateMatrix(player.matrix, -dir);
            player.pos.x = origX;
            return;
          }
        }
        sound.rotate();
      }

      function arenaSweep() {
        let cleared = 0;
        for (let y = arena.length - 1; y >= 0; y--) {
          if (arena[y].every((v) => v !== 0)) {
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            y++;
            cleared++;
          }
        }
        if (cleared > 0) {
          const lineScores = [0, 100, 300, 500, 800];
          player.score += (lineScores[cleared] || cleared * 200) * player.level;
          player.lines += cleared;
          player.level = Math.floor(player.lines / 10) + 1;
          dropInterval = Math.max(120, 900 - (player.level - 1) * 75);
          sound.clear(cleared);
          updateScoreUI();
        }
      }

      function spawnPiece() {
        player.matrix = player.next || nextPieceFromBag();
        player.next = nextPieceFromBag();
        player.pos.y = 0;
        player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);
        drawNext();
        if (collide(arena, player)) {
          triggerGameOver();
        }
      }

      function lockAndAdvance() {
        merge(arena, player);
        sound.lock();
        arenaSweep();
        spawnPiece();
        dropCounter = 0;
      }

      function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
          player.pos.y--;
          lockAndAdvance();
        }
        dropCounter = 0;
      }

      function hardDrop() {
        let dist = 0;
        while (!collide(arena, player, 1)) {
          player.pos.y++;
          dist++;
        }
        player.score += dist * 2;
        updateScoreUI();
        lockAndAdvance();
      }

      function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
          player.pos.x -= dir;
        } else {
          sound.move();
        }
      }

      function updateScoreUI() {
        if (player.score > bestScore) {
          bestScore = player.score;
          localStorage.setItem('tetris_best', String(bestScore));
        }
        scoreEl.textContent = String(player.score);
        bestEl.textContent = String(bestScore);
        levelEl.textContent = `${player.level} / ${player.lines}`;
      }

      // --- Drawing ---
      function drawBlock(targetCtx, x, y, val, alpha = 1) {
        targetCtx.save();
        targetCtx.globalAlpha = alpha;
        targetCtx.fillStyle = COLORS[val];
        targetCtx.fillRect(x + 0.04, y + 0.04, 0.92, 0.92);
        targetCtx.fillStyle = 'rgba(255,255,255,0.22)';
        targetCtx.fillRect(x + 0.08, y + 0.08, 0.84, 0.16);
        targetCtx.restore();
      }

      function drawNext() {
        nextCtx.fillStyle = '#070b14';
        nextCtx.fillRect(0, 0, 4, 4);
        if (!player.next) return;
        const m = player.next;
        const ox = (4 - m[0].length) / 2;
        const oy = (4 - m.length) / 2;
        m.forEach((row, y) => {
          row.forEach((val, x) => {
            if (val !== 0) drawBlock(nextCtx, x + ox, y + oy, val);
          });
        });
      }

      function draw() {
        ctx.fillStyle = '#050811';
        ctx.fillRect(0, 0, COLS, ROWS);

        // Subtle grid
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.lineWidth = 0.03;
        for (let x = 1; x < COLS; x++) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ROWS); ctx.stroke();
        }
        for (let y = 1; y < ROWS; y++) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(COLS, y); ctx.stroke();
        }

        // Combine settled + active blocks in painter's order (top-to-bottom, left-to-right)
        // so pseudo-3D faces stack naturally without overlapping artifacts
        const activeOverlay = [];
        if (player.matrix && !isGameOver) {
          player.matrix.forEach((row, py) => {
            row.forEach((val, px) => {
              if (val !== 0) {
                activeOverlay.push({ x: px + player.pos.x, y: py + player.pos.y, val });
              }
            });
          });
        }

        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const settledVal = arena[y][x];
            if (settledVal !== 0) {
              drawBlock(ctx, x, y, settledVal, 1);
            } else {
              const act = activeOverlay.find((b) => b.x === x && b.y === y);
              if (act) drawBlock(ctx, x, y, act.val, 1);
            }
          }
        }
      }

      // --- Game Loop & Lifecycle ---
      function loop(time = 0) {
        if (isPaused || isGameOver) {
          rafId = null;
          return;
        }
        if (!lastTime) lastTime = time;
        const dt = Math.min(100, time - lastTime);
        lastTime = time;
        dropCounter += dt;
        if (dropCounter > dropInterval) {
          playerDrop();
        }
        draw();
        rafId = requestAnimationFrame(loop);
      }

      function startLoop() {
        if (rafId) cancelAnimationFrame(rafId);
        lastTime = 0;
        rafId = requestAnimationFrame(loop);
      }

      function syncPauseBtn() {
        pauseBtn.disabled = isGameOver || (!isPaused && !player.matrix) || (!overlay.classList.contains('hidden') && !isPaused);
        pauseBtn.textContent = isPaused ? '▶ 繼續' : '⏸ 暫停';
      }

      function togglePause() {
        if (isGameOver || !player.matrix) return;
        isPaused = !isPaused;
        clearRepeatTimers();
        if (isPaused) {
          overlayTitle.textContent = '已暫停';
          overlayDesc.textContent = '點擊繼續回到遊戲';
          startBtn.textContent = '繼續遊戲';
          overlay.classList.remove('hidden');
        } else {
          overlay.classList.add('hidden');
          startLoop();
        }
        syncPauseBtn();
      }

      function triggerGameOver() {
        isGameOver = true;
        isPaused = true;
        clearRepeatTimers();
        sound.over();
        overlayTitle.textContent = '遊戲結束';
        overlayDesc.textContent = `最終分數：${player.score}（最高：${bestScore}）`;
        startBtn.textContent = '再玩一局';
        overlay.classList.remove('hidden');
        syncPauseBtn();
      }

      function resetGame() {
        clearRepeatTimers();
        arena.forEach((r) => r.fill(0));
        bag = [];
        player.score = 0;
        player.level = 1;
        player.lines = 0;
        player.next = null;
        dropInterval = 900;
        dropCounter = 0;
        isGameOver = false;
        isPaused = false;
        updateScoreUI();
        spawnPiece();
        overlay.classList.add('hidden');
        pauseBtn.disabled = false;
        syncPauseBtn();
        draw();
        startLoop();
      }

      // --- Inputs ---
      document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
      const unlockOnce = () => sound.unlock();
      document.addEventListener('pointerdown', unlockOnce, { passive: true });
      document.addEventListener('touchstart', unlockOnce, { passive: true });
      document.addEventListener('keydown', unlockOnce, { passive: true });

      startBtn.addEventListener('click', () => {
        sound.unlock();
        if (isPaused && !isGameOver && player.matrix) {
          togglePause();
        } else {
          resetGame();
        }
      });

      pauseBtn.addEventListener('click', () => {
        sound.unlock();
        togglePause();
      });

      // Tap directly on the game board to drop immediately
      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sound.unlock();
        if (isPaused || isGameOver) return;
        hardDrop();
        draw();
      });

      soundBtn.addEventListener('click', () => {
        sound.unlock();
        sound.enabled = !sound.enabled;
        soundBtn.textContent = sound.enabled ? '🔊' : '🔇';
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P') {
          togglePause();
          return;
        }
        if (isPaused || isGameOver) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); playerMove(-1); draw(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); playerMove(1); draw(); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); playerDrop(); draw(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); playerRotate(1); draw(); }
        else if (e.key === ' ') { e.preventDefault(); hardDrop(); draw(); }
      });

      const setupPointerBtn = (id, action, repeatable = true) => {
        const btn = document.getElementById(id);
        let intervalId = null;
        let activeId = null;

        const stop = (e) => {
          if (e && activeId !== null && e.pointerId !== activeId) return;
          if (intervalId) {
            clearInterval(intervalId);
            activeRepeatTimers.delete(intervalId);
            intervalId = null;
          }
          activeId = null;
        };

        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          sound.unlock();
          if (isPaused || isGameOver) return;
          activeId = e.pointerId;
          btn.setPointerCapture(e.pointerId);
          action();
          draw();
          if (repeatable) {
            stop();
            activeId = e.pointerId;
            intervalId = setInterval(() => {
              if (isPaused || isGameOver) { stop(); return; }
              action();
              draw();
            }, 135);
            activeRepeatTimers.add(intervalId);
          }
        });

        btn.addEventListener('pointerup', stop);
        btn.addEventListener('pointercancel', stop);
        btn.addEventListener('lostpointercapture', stop);
      };

      setupPointerBtn('btn-left', () => playerMove(-1), true);
      setupPointerBtn('btn-right', () => playerMove(1), true);
      setupPointerBtn('btn-down', () => playerDrop(), true);
      setupPointerBtn('btn-up', () => playerRotate(1), false);
      setupPointerBtn('btn-hard', () => hardDrop(), false);

      updateScoreUI();
      drawNext();
      draw();
    })();
  </script>
</body>
</html>
