<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>數感挑戰 | Number Sense</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container" class="app-shell">
    <!-- Setup Panel -->
    <section id="ui-panel" class="card setup-card">
      <div class="brand">
        <span class="badge">ANS TEST</span>
        <h1>數感直覺挑戰</h1>
      </div>
      <p class="subtitle">兩側畫面將短暫閃現方塊，請在消失後快速選出<strong>數量較多</strong>的一側！</p>

      <div class="preset-row" role="group" aria-label="難度預設">
        <button type="button" class="preset-btn" data-a="6" data-b="10" data-t="1200">🌱 簡單 (6:10)</button>
        <button type="button" class="preset-btn active" data-a="9" data-b="10" data-t="1000">⚡ 標準 (9:10)</button>
        <button type="button" class="preset-btn" data-a="14" data-b="15" data-t="750">🔥 困難 (14:15)</button>
      </div>

      <div class="form-grid">
        <div class="input-group">
          <label for="numA">數字 A</label>
          <input type="number" id="numA" value="9" min="1" max="50" />
        </div>
        <div class="input-group">
          <label for="numB">數字 B</label>
          <input type="number" id="numB" value="10" min="1" max="50" />
        </div>
        <div class="input-group">
          <label for="rounds">回合數</label>
          <input type="number" id="rounds" value="10" min="1" max="50" />
        </div>
        <div class="input-group">
          <label for="showTime">顯示時間 (ms)</label>
          <input type="number" id="showTime" value="1000" step="100" min="150" max="5000" />
        </div>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="feedbackToggle" checked />
        <span>顯示每題對錯與音效回饋</span>
      </label>

      <p id="setup-error" class="error-msg hidden"></p>
      <button id="startBtn" class="primary-btn">開始挑戰</button>
    </section>

    <!-- Play Area -->
    <section id="play-area" class="play-area hidden">
      <header class="play-hud">
        <div class="hud-left">
          <span id="round-progress" class="hud-pill">第 1 / 10 題</span>
          <span id="prompt-pill" class="hud-pill prompt">👀 請記住兩側數量…</span>
        </div>
        <div class="hud-right">
          <button id="soundBtn" class="mini-btn" aria-label="切換音效">🔊</button>
          <button id="quitBtn" class="mini-btn">✕ 結束</button>
        </div>
      </header>

      <div class="split-wrap">
        <div class="split-screen left" id="areaLeft" role="button" tabindex="0" aria-label="選擇左側"></div>
        <div class="split-screen right" id="areaRight" role="button" tabindex="0" aria-label="選擇右側"></div>
      </div>
    </section>

    <!-- Result Overlay -->
    <section id="result-overlay" class="overlay hidden">
      <div class="card result-card">
        <div class="result-emoji" id="result-emoji">🎯</div>
        <h2>挑戰完成！</h2>
        <div class="result-stats">
          <div class="r-stat"><span>正確率</span><strong id="accuracy-text">0%</strong></div>
          <div class="r-stat"><span>答對題數</span><strong id="score-text">0 / 10</strong></div>
          <div class="r-stat"><span>平均反應</span><strong id="rt-text">—</strong></div>
        </div>
        <button id="restartBtn" class="primary-btn">再玩一次</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
