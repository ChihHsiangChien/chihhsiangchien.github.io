        ctx.strokeStyle = PALETTE.lunarOrb;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-275, (-275 - nodeX) * slope);
        ctx.lineTo(275, (275 - nodeX) * slope);
        ctx.stroke();

        // 中心目標：朔月看「太陽圓盤」，望月看「地球本影圓盤」
        if (!isFullHalf) {
          const g = ctx.createRadialGradient(0, 0, 10, 0, 0, 56);
          g.addColorStop(0, '#FFFBEB');
          g.addColorStop(0.55, PALETTE.sun);
          g.addColorStop(1, 'rgba(251,191,36,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(0, 0, 56, 0, TAU); ctx.fill();
          ctx.fillStyle = PALETTE.sun;
          ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill();
          drawPill2D(ctx, '太陽視圓盤 (黃道上)', 0, 52, PALETTE.sun);
        } else {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.strokeStyle = PALETTE.node;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, 44, 0, TAU); ctx.fill(); ctx.stroke();
          drawPill2D(ctx, '地球本影區 (黃道中心)', 0, 62, PALETTE.node);
        }

        // 繪製交點標記 (若在視野內)
        if (Math.abs(nodeX) < 265) {
          ctx.fillStyle = PALETTE.node;
          ctx.beginPath(); ctx.arc(nodeX, 0, 7, 0, TAU); ctx.fill();
          drawPill2D(ctx, '黃白交點 (Node)', nodeX, -24, PALETTE.node);
        }

        // 計算月球當前相對於目標的東西向與南北向位置
        let dPhase = isFullHalf ? (p.moonPhaseDeg - 180) : (p.moonPhaseDeg > 180 ? p.moonPhaseDeg - 360 : p.moonPhaseDeg);
        const mx = clamp(dPhase * 3.2, -260, 260);
        const my = (mx - nodeX) * slope;

        // 月球圓盤
        const hitDist = Math.hypot(mx, my);
        const isEclipse = (!isFullHalf && hitDist < 54) || (isFullHalf && hitDist < 68);
        ctx.fillStyle = isFullHalf ? (hitDist < 42 ? '#B91C1C' : PALETTE.moon) : '#0F172A';
        ctx.strokeStyle = PALETTE.lunarOrb;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(mx, my, 29, 0, TAU); ctx.fill(); ctx.stroke();

        // 南北偏移指示雙箭頭 (當朔或望接近中心時強調為何錯過!)
        if (Math.abs(mx) < 40 && Math.abs(my) > 25) {
          ctx.strokeStyle = '#F87171';
          ctx.setLineDash([4, 3]);
          ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, my); ctx.stroke();
          ctx.setLineDash([]);
        }

        const betaDeg = Math.abs(Math.sin(nodeOffset * DEG) * tiltDeg);
        const statusTxt = isEclipse
          ? (isFullHalf ? '⚡ 位於食季交點附近：發生月食！' : '⚡ 位於食季交點附近：發生日食！')
          : `白道緯度偏移 ${betaDeg.toFixed(1)}°：月球南北掠過，不發生食相`;
        drawPill2D(ctx, statusTxt, 0, -158, isEclipse ? PALETTE.node : PALETTE.earth);
        drawPill2D(ctx, '黃道 Ecliptic', -215, 18, PALETTE.sun);
        drawPill2D(ctx, `白道 Lunar Path (${tiltDeg}°)`, 190, (190 - nodeX) * slope - 20, PALETTE.lunarOrb);
        break;
      }

      /* ---------------- 02 日食本影與半影：天空日冕與地表全食帶 ---------------- */
      case 1: {
        // 左側：觀測者仰望天空太陽視窗；右側：地表本影全食帶與半影俯視圖
        const isAnnular = p.moonDistMode === 1;
        const sunR = 72;
        const moonR = isAnnular ? 64 : 75;
        const skyCx = -135, skyCy = -10;

        // 計算月球相對太陽偏移
        const dx = p.eclipseProg * 145;
        const dy = -(p.obsOffsetKm / 2500) * 88;
        const sep = Math.hypot(dx, dy);
        const isTotality = !isAnnular && sep <= (moonR - sunR + 2.5);
        const isRing = isAnnular && sep <= (sunR - moonR + 2.5);

        // 天空背景隨遮蔽率變暗
        const cover = clamp(1 - sep / (sunR + moonR), 0, 1);
        ctx.fillStyle = isTotality ? '#030612' : `rgb(${Math.round(lerp(18, 6, cover))}, ${Math.round(lerp(52, 12, cover))}, ${Math.round(lerp(96, 28, cover))})`;
        ctx.beginPath(); ctx.roundRect(-285, -175, 295, 345, 12); ctx.fill();
        ctx.strokeStyle = PALETTE.grid; ctx.stroke();

        // 全食時綻放壯麗日冕與鑽石環!
        if (isTotality) {
          const cor = ctx.createRadialGradient(skyCx, skyCy, sunR * 0.9, skyCx, skyCy, sunR * 2.2);
          cor.addColorStop(0, 'rgba(255,255,255,0.95)');
          cor.addColorStop(0.3, 'rgba(186,230,253,0.45)');
          cor.addColorStop(1, 'rgba(56,189,248,0)');
          ctx.fillStyle = cor;
          ctx.beginPath(); ctx.arc(skyCx, skyCy, sunR * 2.2, 0, TAU); ctx.fill();
        }

        // 太陽圓盤
        ctx.fillStyle = PALETTE.sun;
        ctx.beginPath(); ctx.arc(skyCx, skyCy, sunR, 0, TAU); ctx.fill();

        // 月球黑圓盤遮擋
        ctx.fillStyle = '#050814';
        ctx.beginPath(); ctx.arc(skyCx + dx, skyCy + dy, moonR, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(148,163,184,0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();

        const skyState = isTotality ? '🌑 日全食 (Total Eclipse - 日冕現身!)'
          : isRing ? '💍 日環食 (Annular - 偽本影金環!)'
          : sep < sunR + moonR ? '🌗 日偏食 (Partial Eclipse - 半影區)' : '☀️ 日食未開始 / 已復圓';
        drawPill2D(ctx, skyState, skyCx, -148, isTotality || isRing ? PALETTE.node : PALETTE.sun);
        drawPill2D(ctx, '觀測者仰望天空視角', skyCx, 145, PALETTE.land);

        // 右側：地表投影俯視地圖
        const mapCx = 155, mapCy = -10;
        ctx.fillStyle = '#0B2540';
        ctx.beginPath(); ctx.roundRect(25, -175, 260, 345, 12); ctx.fill();
        ctx.strokeStyle = PALETTE.grid; ctx.stroke();

        // 全食帶狹長紅金軌跡帶
        ctx.fillStyle = 'rgba(244, 63, 94, 0.25)';
        ctx.fillRect(35, mapCy - 11, 240, 22);
        ctx.strokeStyle = PALETTE.node;
        ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(35, mapCy); ctx.lineTo(275, mapCy); ctx.stroke();
        ctx.setLineDash([]);

        // 半影大圓 (~3500km 半徑) 與 本影小黑點 (~180km 直徑)
        const shadowX = mapCx + p.eclipseProg * 95;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.58)';
        ctx.strokeStyle = PALETTE.lunarOrb;
        ctx.beginPath(); ctx.arc(shadowX, mapCy, 86, 0, TAU); ctx.fill(); ctx.stroke();

        if (!isAnnular) {
          ctx.fillStyle = '#000000';
          ctx.beginPath(); ctx.arc(shadowX, mapCy, 10, 0, TAU); ctx.fill();
        } else {
          ctx.strokeStyle = PALETTE.sun;
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(shadowX, mapCy, 10, 0, TAU); ctx.stroke();
        }

        // 觀測者綠點
        const obsMapY = mapCy - (p.obsOffsetKm / 2500) * 88;
        ctx.fillStyle = PALETTE.land;
        ctx.beginPath(); ctx.arc(mapCx, obsMapY, 6.5, 0, TAU); ctx.fill();

        drawPill2D(ctx, '地表投影：狹長全食帶 vs 廣大半影', mapCx, -148, PALETTE.earth);
        drawPill2D(ctx, isAnnular ? '偽本影環食帶' : '本影全食帶 (~200km寬)', mapCx, mapCy + 28, PALETTE.node);
        drawPill2D(ctx, '半影偏食區 (~6000km)', shadowX, mapCy - 72, PALETTE.lunarOrb);
        drawPill2D(ctx, '觀測者位置', mapCx + 48, obsMapY, PALETTE.land);
        break;
      }

      /* ---------------- 03 瑞利散射與紅月亮光學剖面 ---------------- */
      case 2: {
        // 上半部：大氣瑞利散射與紅光折射幾何光路；下半部：地面望遠鏡血月視場
        ctx.strokeStyle = PALETTE.grid;
        ctx.beginPath(); ctx.moveTo(-285, 10); ctx.lineTo(285, 10); ctx.stroke();

        // 光學圖：太陽白光 -> 地球大氣層 -> 藍光散射 / 紅光折射入本影
        const ex = -120, ey = -85, er = 44;
        // 地球本影暗錐
        ctx.fillStyle = 'rgba(220, 38, 38, 0.16)';
        ctx.beginPath();
        ctx.moveTo(ex, ey - er); ctx.lineTo(250, ey - 14); ctx.lineTo(250, ey + 14); ctx.lineTo(ex, ey + er);
        ctx.closePath(); ctx.fill();

        // 入射白光
        [-1, 1].forEach(s => {
          const y0 = ey + s * (er + 4);
          ctx.strokeStyle = '#FEF08A'; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(-275, y0); ctx.lineTo(ex, y0); ctx.stroke();
          // 藍短波散射箭頭
          ctx.strokeStyle = PALETTE.earth; ctx.lineWidth = 1.8;
          for (let a = 0; a < 3; a++) {
            const ang = s * (0.5 + a * 0.45);
            ctx.beginPath(); ctx.moveTo(ex, y0);
            ctx.lineTo(ex + Math.cos(ang) * 34, y0 + Math.sin(ang) * 34);
            ctx.stroke();
          }
          // 紅長波向內折射
          ctx.strokeStyle = PALETTE.node; ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.moveTo(ex, y0); ctx.lineTo(185, ey - s * 10); ctx.stroke();
        });

        // 地球與藍色大氣環
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.75)';
        ctx.lineWidth = 7;
        ctx.beginPath(); ctx.arc(ex, ey, er + 3, 0, TAU); ctx.stroke();
        ctx.fillStyle = '#0C4A6E';
        ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU); ctx.fill();

        drawPill2D(ctx, '① 太陽白光', -220, ey - 22, PALETTE.sun);
        drawPill2D(ctx, '② 藍綠短波：瑞利散射濾除', ex + 10, ey - 76, PALETTE.earth);
        drawPill2D(ctx, '③ 紅橙長波：折射匯聚本影', 95, ey - 45, PALETTE.node);

        // 下半部：地面望遠鏡視場 (地球圓弧本影 vs 月球移動)
        const ty = 102;
        ctx.fillStyle = 'rgba(220, 38, 38, 0.18)';
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.55)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, ty, 66, 0, TAU); ctx.fill(); ctx.stroke();

        const mx = p.lunarProg * 155;
        const inUmb = clamp(1 - (Math.abs(mx) - 34) / 48, 0, 1);
        const dust = 1 - p.dustLevel * 0.68;
        const mr = Math.round(lerp(232, 205 * dust, inUmb));
        const mg = Math.round(lerp(236, 48 * dust, inUmb));
        const mb = Math.round(lerp(242, 32 * dust, inUmb));
        ctx.fillStyle = `rgb(${mr},${mg},${mb})`;
        ctx.beginPath(); ctx.arc(mx, ty, 28, 0, TAU); ctx.fill();

        drawPill2D(ctx, '望遠鏡視角：地球本影截面與血月色澤變化', 0, 182, PALETTE.moon);
        break;
      }

      /* ---------------- 04 引潮力與潮汐：海岸潮位站與曲線 ---------------- */
      case 3: {
        // 左側：海岸燈塔標尺即時水位；右側：24h 半日潮曲線 & 朔望大小潮比較
        const mRad = p.moonSynodic * DEG;
        const rotRad = (p.earthHour / 24) * TAU;
        const calcHeight = (hHr, synDeg) => {
          const r = (hHr / 24) * TAU;
          const m = synDeg * DEG;
          // 海岸站角度 r 與月球方向 m 的夾角為 (r - m)，太陽固定在 0
          return Math.cos(2 * (r - m)) * 1.0 + Math.cos(2 * r) * 0.46; // 範圍 [-1.46, +1.46] 公尺
        };
        const curH = calcHeight(p.earthHour, p.moonSynodic);

        // 左側海岸站水箱
        ctx.fillStyle = '#0F172A';
        ctx.beginPath(); ctx.roundRect(-280, -165, 195, 330, 10); ctx.fill();
        ctx.strokeStyle = PALETTE.grid; ctx.stroke();

        const waterTopY = 15 - curH * 58;
        const wGrad = ctx.createLinearGradient(0, waterTopY, 0, 165);
        wGrad.addColorStop(0, 'rgba(6, 182, 212, 0.85)');
        wGrad.addColorStop(1, 'rgba(8, 51, 68, 0.95)');
        ctx.fillStyle = wGrad;
        ctx.beginPath();
        ctx.moveTo(-279, 164);
        ctx.lineTo(-279, waterTopY);
        for (let wx = -279; wx <= -86; wx += 16) {
          ctx.lineTo(wx, waterTopY + Math.sin(wx * 0.08 + p.earthHour * 3) * 3);
        }
        ctx.lineTo(-86, 164);
        ctx.closePath();
        ctx.fill();

        // 岩岸碼頭與水位標尺
        ctx.fillStyle = '#334155';
        ctx.fillRect(-279, -45, 48, 209);
        ctx.strokeStyle = '#CBD5E1';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-115, -105); ctx.lineTo(-115, 125); ctx.stroke();
        [-1.5, -1, 0, 1, 1.5].forEach(lv => {
          const ly = 15 - lv * 58;
          ctx.beginPath(); ctx.moveTo(-122, ly); ctx.lineTo(-108, ly); ctx.stroke();
        });

        drawPill2D(ctx, `即時潮位: ${curH >= 0 ? '+' : ''}${curH.toFixed(2)} m`, -182, -142, PALETTE.tide);
        drawPill2D(ctx, '海岸潮位觀測站', -182, 145, PALETTE.land);

        // 右側：24 小時潮汐曲線 (對比大潮極限虛線)
        const gx0 = -45, gx1 = 270, gyMid = 15;
        ctx.fillStyle = '#0F172A';
        ctx.beginPath(); ctx.roundRect(-65, -165, 350, 330, 10); ctx.fill();
        ctx.strokeStyle = PALETTE.grid; ctx.stroke();

        // 平均海平面 0m 線
        ctx.strokeStyle = 'rgba(148,163,184,0.35)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(gx0, gyMid); ctx.lineTo(gx1, gyMid); ctx.stroke();
        ctx.setLineDash([]);

        // 朔望大潮參考淡曲線
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.28)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let hr = 0; hr <= 24; hr += 0.25) {
          const x = lerp(gx0, gx1, hr / 24);
          const y = gyMid - calcHeight(hr, 0) * 58;
          hr === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();

        // 當前月相 24 小時潮汐實線
        ctx.strokeStyle = PALETTE.tide;
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let hr = 0; hr <= 24; hr += 0.2) {
          const x = lerp(gx0, gx1, hr / 24);
          const y = gyMid - calcHeight(hr, p.moonSynodic) * 58;
          hr === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();

        // 當前時刻紅點
        const curX = lerp(gx0, gx1, p.earthHour / 24);
        ctx.fillStyle = PALETTE.land;
        ctx.beginPath(); ctx.arc(curX, waterTopY, 6.5, 0, TAU); ctx.fill();

        const amp = Math.hypot(1 + 0.46 * Math.cos(2 * mRad), 0.46 * Math.sin(2 * mRad));
        const tideType = amp > 1.25 ? '🌊 大潮期 (Spring Tide - 日月疊加)' : amp < 0.72 ? '💧 小潮期 (Neap Tide - 直角抵銷)' : '🌊 中潮過渡期';
        drawPill2D(ctx, tideType, 110, -142, amp > 1.25 ? PALETTE.sun : PALETTE.lunarOrb);
        drawPill2D(ctx, '00:00      每日兩次滿潮與乾潮 (24h)      24:00', 110, 145, PALETTE.muted);
        break;
      }

      /* ---------------- 05 超級月亮：視直徑同框比對與潮汐連動 ---------------- */
      case 4: {
        const nu = p.anomalyDeg * DEG;
        // 真實視直徑比：近地點 33.5' vs 遠地點 29.4' (相差約 14%)；誇大模式更鮮明
        const realE = 0.055;
        const visE = p.eccMode ? 0.20 : 0.07;
        const rFactor = (1 - visE * visE) / (1 + visE * Math.cos(nu));
        const curR = 76 / rFactor;
        const superR = 76 / (1 - visE);
        const microR = 76 / (1 + visE);

        // 左半圓 vs 右半圓經典天文對比圖 (近地超級月亮 vs 遠地最小滿月)
        const cmpCx = -115, cmpCy = -5;
        ctx.save();
        ctx.beginPath(); ctx.rect(cmpCx - 150, cmpCy - 150, 150, 300); ctx.clip();
        ctx.fillStyle = '#F8FAFC';
        ctx.beginPath(); ctx.arc(cmpCx, cmpCy, superR, 0, TAU); ctx.fill();
        ctx.fillStyle = '#94A3B8';
        ctx.beginPath(); ctx.arc(cmpCx - superR * 0.35, cmpCy - superR * 0.2, superR * 0.22, 0, TAU); ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath(); ctx.rect(cmpCx, cmpCy - 150, 150, 300); ctx.clip();
        ctx.fillStyle = '#CBD5E1';
        ctx.beginPath(); ctx.arc(cmpCx, cmpCy, microR, 0, TAU); ctx.fill();
        ctx.fillStyle = '#64748B';
        ctx.beginPath(); ctx.arc(cmpCx + microR * 0.3, cmpCy + microR * 0.15, microR * 0.2, 0, TAU); ctx.fill();
        ctx.restore();

        ctx.strokeStyle = PALETTE.node;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cmpCx, cmpCy - 125); ctx.lineTo(cmpCx, cmpCy + 125); ctx.stroke();

        drawPill2D(ctx, '近地點超級月亮 (+14%直徑 / +30%亮度)', cmpCx - 15, -148, PALETTE.node);
        drawPill2D(ctx, '左: 33.5′ 最大滿月 ｜ 右: 29.4′ 最小滿月', cmpCx, 148, PALETTE.moon);

        // 右側：即時觀測月球視大小與近地引潮力增幅計量條
        const liveCx = 148, liveCy = -22;
        ctx.strokeStyle = 'rgba(244,63,94,0.35)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.arc(liveCx, liveCy, superR, 0, TAU); ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#E2E8F0';
        ctx.beginPath(); ctx.arc(liveCx, liveCy, curR, 0, TAU); ctx.fill();

        const realArcmin = 31.1 * (1 + realE * Math.cos(nu)) / (1 - realE * realE);
        const tidalRel = Math.pow((1 + realE * Math.cos(nu)) / (1 - realE), 3); // 相對於遠地點最高可達 1.48x!
        drawPill2D(ctx, `即時視直徑: ${realArcmin.toFixed(1)} 角分`, liveCx, -148, PALETTE.lunarOrb);

        // 引潮力強度橫條
        ctx.fillStyle = '#1E293B';
        ctx.beginPath(); ctx.roundRect(45, 108, 210, 22, 6); ctx.fill();
        ctx.fillStyle = PALETTE.tide;
        ctx.beginPath(); ctx.roundRect(45, 108, clamp((tidalRel - 0.8) / 0.72, 0.15, 1) * 210, 22, 6); ctx.fill();
        drawPill2D(ctx, `月球引潮力 (∝1/r³): 遠地點的 ${(tidalRel).toFixed(2)} 倍`, liveCx, 148, PALETTE.tide);
        break;
      }

      /* ---------------- 06 緯度效應：立體天球地平穹頂與極晝極夜 ---------------- */
      case 5: {
        const phi = p.lat * DEG;
        const delta = Math.asin(Math.sin(23.44 * DEG) * Math.sin(p.seasonDeg * DEG));
        const H = (p.localHour - 12) * 15 * DEG;

        // 計算當前太陽仰角與晝長
        const sinAltNow = Math.sin(phi) * Math.sin(delta) + Math.cos(phi) * Math.cos(delta) * Math.cos(H);
        const altNowDeg = Math.asin(clamp(sinAltNow, -1, 1)) * RAD;

        const cosH0 = -Math.tan(phi) * Math.tan(delta);
        let dayHours = 12, statusTag = '';
        if (cosH0 <= -1 || (Math.abs(p.lat) > 89.5 && p.lat * delta > 0)) {
          dayHours = 24; statusTag = '☀️ 永晝現象 (24h 午夜太陽不落!)';
        } else if (cosH0 >= 1 || (Math.abs(p.lat) > 89.5 && p.lat * delta < 0)) {
          dayHours = 0; statusTag = '🌌 永夜現象 (24h 太陽不升起)';
        } else {
          dayHours = (2 * Math.acos(clamp(cosH0, -1, 1)) * RAD) / 15;
          statusTag = `晝長 ${dayHours.toFixed(1)}h ｜ 夜長 ${(24 - dayHours).toFixed(1)}h`;
        }

        // 斜視 3D 天球穹頂投影函式 (北在左後、南在右前、東在遠側、西在近側)
        const domeR = 152, domeCy = 52;
        const projDome = (altR, azFromNorthEastPos) => {
          // az: 0=北(左), 90°=東(裡), 180°=南(右), 270°=西(外)
          const rHoriz = Math.cos(altR) * domeR;
          const x = -Math.cos(azFromNorthEastPos) * rHoriz;
          const z = Math.sin(azFromNorthEastPos) * rHoriz;
          const y = domeCy - Math.sin(altR) * domeR + z * 0.32;
          return { x, y, z };
        };

        // 天空穹頂半圓光暈 (依當前太陽仰角明暗變化)
        const skyBright = clamp((altNowDeg + 8) / 35, 0, 1);
        const domeGrad = ctx.createRadialGradient(0, domeCy - 60, 10, 0, domeCy, domeR * 1.15);
        domeGrad.addColorStop(0, `rgba(56, 189, 248, ${0.06 + 0.28 * skyBright})`);
        domeGrad.addColorStop(1, 'rgba(15, 23, 42, 0.1)');
        ctx.fillStyle = domeGrad;
        ctx.beginPath(); ctx.arc(0, domeCy, domeR, Math.PI, 0); ctx.ellipse(0, domeCy, domeR, domeR * 0.32, 0, 0, TAU); ctx.fill();

        // 地平圈草地橢圓盤與東南西北十字
        ctx.fillStyle = 'rgba(16, 185, 129, 0.14)';
        ctx.strokeStyle = PALETTE.land;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(0, domeCy, domeR, domeR * 0.32, 0, 0, TAU); ctx.fill(); ctx.stroke();

        ctx.strokeStyle = 'rgba(148,163,184,0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, domeCy, domeR, Math.PI, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-domeR, domeCy); ctx.lineTo(domeR, domeCy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, domeCy - domeR * 0.32); ctx.lineTo(0, domeCy + domeR * 0.32); ctx.stroke();

        // 繪製 24 小時太陽周日視運動軌跡 (地平線上金色實線、地平線下灰色虛線)
        for (let pass = 0; pass < 2; pass++) {
          ctx.beginPath();
          ctx.strokeStyle = pass === 1 ? PALETTE.sun : 'rgba(148, 163, 184, 0.32)';
          ctx.lineWidth = pass === 1 ? 3 : 1.5;
          if (pass === 0) ctx.setLineDash([4, 4]); else ctx.setLineDash([]);
          let started = false;
          for (let i = 0; i <= 144; i++) {
            const hrA = ((i / 144) * 24 - 12) * 15 * DEG;
            const sAlt = clamp(Math.sin(phi) * Math.sin(delta) + Math.cos(phi) * Math.cos(delta) * Math.cos(hrA), -1, 1);
            const alt = Math.asin(sAlt);
            const cAz = (Math.sin(delta) - Math.sin(phi) * sAlt) / Math.max(0.0001, Math.cos(phi) * Math.cos(alt));
            let az = Math.acos(clamp(cAz, -1, 1));
            if (Math.sin(hrA) > 0) az = TAU - az; // 下午在西側
            const above = alt >= -0.005;
            if ((pass === 1 && above) || (pass === 0 && !above)) {
              const pt = projDome(alt, az);
              if (!started) { ctx.moveTo(pt.x, pt.y); started = true; } else ctx.lineTo(pt.x, pt.y);
            } else {
              started = false;
            }
          }
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // 當前太陽位置圓球
        const cAzNow = (Math.sin(delta) - Math.sin(phi) * sinAltNow) / Math.max(0.0001, Math.cos(phi) * Math.cos(altNowDeg * DEG));
        let azNow = Math.acos(clamp(cAzNow, -1, 1));
        if (Math.sin(H) > 0) azNow = TAU - azNow;
        const sunPt = projDome(altNowDeg * DEG, azNow);

        ctx.fillStyle = altNowDeg >= 0 ? PALETTE.sun : '#64748B';
        ctx.beginPath(); ctx.arc(sunPt.x, sunPt.y, 11, 0, TAU); ctx.fill();

        // 中心觀測者小人
        ctx.fillStyle = PALETTE.land;
        ctx.beginPath(); ctx.arc(0, domeCy - 12, 5, 0, TAU); ctx.fill();
        ctx.strokeStyle = PALETTE.land; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(0, domeCy - 7); ctx.lineTo(0, domeCy + 4); ctx.stroke();

        // 方位標籤與晝夜長短進度條
        drawPill2D(ctx, '北 N', -domeR - 26, domeCy, PALETTE.earth);
        drawPill2D(ctx, '南 S', domeR + 26, domeCy, PALETTE.earth);
        drawPill2D(ctx, '東 E', 0, domeCy - domeR * 0.32 - 14, PALETTE.muted);
        drawPill2D(ctx, '西 W', 0, domeCy + domeR * 0.32 + 16, PALETTE.muted);
        drawPill2D(ctx, statusTag, 0, -155, dayHours === 24 ? PALETTE.sun : dayHours === 0 ? PALETTE.lunarOrb : PALETTE.earth);
        drawPill2D(ctx, `地方時 ${Math.floor(p.localHour).toString().padStart(2,'0')}:${Math.round((p.localHour%1)*60).toString().padStart(2,'0')} ｜ 太陽仰角 ${altNowDeg.toFixed(1)}°`, 0, 152, PALETTE.sun);
        break;
      }

      /* ---------------- 07 正午仰角與受熱影長實驗室 ---------------- */
      case 6: {
        const zenithDist = p.lat - p.decl; // >0 太陽在南天, <0 太陽在北天
        const noonAlt = Math.max(0, 90 - Math.abs(zenithDist));
        const altRad = noonAlt * DEG;
        const fluxPct = Math.sin(altRad) * 100;

        // 左側：垂直標竿 (Gnomon) 正午影長與量角器
        const groundY = 95, poleX = -135, poleH = 115;
        ctx.strokeStyle = '#64748B'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-280, groundY); ctx.lineTo(15, groundY); ctx.stroke();

        // 影子
        const shadowDir = zenithDist >= 0 ? -1 : 1; // 太陽在南(右)則影子朝北(左)
        const shadowLen = noonAlt > 3 ? clamp(poleH / Math.tan(altRad), 0, 145) : 145;
        if (noonAlt > 0) {
          ctx.strokeStyle = '#F43F5E'; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(poleX, groundY); ctx.lineTo(poleX + shadowDir * shadowLen, groundY); ctx.stroke();

          // 陽光斜射線通過竿頂至影端
          ctx.strokeStyle = PALETTE.sun; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
          const rayDx = -shadowDir * Math.cos(altRad) * 190;
          const rayDy = -Math.sin(altRad) * 190;
          ctx.beginPath();
          ctx.moveTo(poleX + rayDx, groundY - poleH + rayDy);
          ctx.lineTo(poleX + shadowDir * shadowLen, groundY);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // 垂直綠竿
        ctx.strokeStyle = PALETTE.land; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(poleX, groundY); ctx.lineTo(poleX, groundY - poleH); ctx.stroke();

        const ratioStr = noonAlt > 1 ? `${(1 / Math.tan(altRad)).toFixed(2)} 倍竿高` : '極長/永夜';
        drawPill2D(ctx, `正午太陽仰角: ${noonAlt.toFixed(1)}°`, -135, -152, PALETTE.sun);
        drawPill2D(ctx, `正午竿影長: ${ratioStr}`, -135, 138, PALETTE.node);
        drawPill2D(ctx, '北 N', -260, groundY - 16, PALETTE.muted);
        drawPill2D(ctx, '南 S', -5, groundY - 16, PALETTE.muted);

        // 右側：等寬太陽光束投射面積與能量密度熱網格 (W/m²)
        const bx = 155, by = 25;
        const beamW = 54;
        const spreadW = noonAlt > 8 ? clamp(beamW / Math.sin(altRad), beamW, 210) : 210;

        // 平行光束帶
        ctx.fillStyle = 'rgba(251, 191, 36, 0.22)';
        const incAng = Math.max(8 * DEG, altRad);
        const dxTop = Math.cos(incAng) * 135;
        const dyTop = -Math.sin(incAng) * 135;
        ctx.beginPath();
        ctx.moveTo(bx - spreadW * 0.5 + dxTop, by + dyTop);
        ctx.lineTo(bx + spreadW * 0.5 + dxTop, by + dyTop);
        ctx.lineTo(bx + spreadW * 0.5, by);
        ctx.lineTo(bx - spreadW * 0.5, by);
        ctx.closePath();
        ctx.fill();

        // 地表受熱能量網格俯視圖 (位於下方 by+35..by+105)
        const gridY = 65;
        const heatR = Math.round(lerp(56, 251, fluxPct / 100));
        const heatG = Math.round(lerp(130, 146, fluxPct / 100));
        const heatB = Math.round(lerp(246, 36, fluxPct / 100));
        ctx.fillStyle = `rgba(${heatR},${heatG},${heatB},0.45)`;
        ctx.strokeStyle = `rgb(${heatR},${heatG},${heatB})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.rect(bx - spreadW * 0.5, gridY - 26, spreadW, 52); ctx.fill(); ctx.stroke();

        // 單位面積格線 (每 18px 一單位面積)
        ctx.strokeStyle = 'rgba(255,255,255,0.38)';
        ctx.lineWidth = 1;
        for (let gx = bx - spreadW * 0.5 + 18; gx < bx + spreadW * 0.5; gx += 18) {
          ctx.beginPath(); ctx.moveTo(gx, gridY - 26); ctx.lineTo(gx, gridY + 26); ctx.stroke();
        }
        ctx.beginPath(); ctx.moveTo(bx - spreadW * 0.5, gridY); ctx.lineTo(bx + spreadW * 0.5, gridY); ctx.stroke();

        drawPill2D(ctx, `單位面積能量密度: ${fluxPct.toFixed(0)}%`, bx, -152, PALETTE.sun);
        drawPill2D(ctx, `同束陽光攤平面積: ${(1 / Math.max(0.12, Math.sin(altRad))).toFixed(2)}x`, bx, 138, PALETTE.earth);
        break;
      }

      /* ---------------- 08 8字形太陽軌跡 (Analemma) 與均時差 ---------------- */
      case 7: {
        // 精準天文公式計算全年 365 天正午太陽赤緯與均時差 (可獨立開關傾角與離心率!)
        const calcAnalemma = (day, tiltOn, eccOn) => {
          const eps = tiltOn ? 23.44 * DEG : 0;
          const e = eccOn ? 0.01671 : 0;
          const M = TAU * (day - 3) / 365.25; // 1月3日近日點
          const nu = M + 2 * e * Math.sin(M) + 1.25 * e * e * Math.sin(2 * M);
          const periLon = 282.9 * DEG;
          const meanLon = normDeg((M + periLon) * RAD) * DEG;
          const trueLon = normDeg((nu + periLon) * RAD) * DEG;
          const ra = Math.atan2(Math.cos(eps) * Math.sin(trueLon), Math.cos(trueLon));
          let dLon = meanLon - ra;
          while (dLon > Math.PI) dLon -= TAU;
          while (dLon < -Math.PI) dLon += TAU;
          const eotMin = dLon * RAD * 4; // 每度 = 4 分鐘!
          const decl = Math.asin(Math.sin(eps) * Math.sin(trueLon)) * RAD;
          return { eotMin, decl };
        };

        // 左側：南天正午 12:00 天空 8 字形軌跡視窗
        const skyCx = -130, skyCy = 5;
        ctx.fillStyle = '#0B192C';
        ctx.beginPath(); ctx.roundRect(-280, -170, 295, 340, 12); ctx.fill();
        ctx.strokeStyle = PALETTE.grid; ctx.stroke();

        // 正南子午線與天球赤道高度十字線
        ctx.strokeStyle = 'rgba(148,163,184,0.28)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(skyCx, -155); ctx.lineTo(skyCx, 155); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-265, skyCy); ctx.lineTo(0, skyCy); ctx.stroke();
        ctx.setLineDash([]);

        // 繪製全年 365 點 8 字形 Analemma
        ctx.strokeStyle = PALETTE.sun;
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        for (let d = 1; d <= 365; d += 2) {
          const r = calcAnalemma(d, p.tiltOn, p.eccOn);
          const x = skyCx - r.eotMin * 5.2; // 太陽快(eot>0)偏西(右)，太陽慢偏東(左)：面向南方時東在左、西在右 -> +eot 偏右!
          const rx = skyCx + r.eotMin * 5.2;
          const ry = skyCy - r.decl * 4.8;
          d === 1 ? ctx.moveTo(rx, ry) : ctx.lineTo(rx, ry);
        }
        ctx.closePath();
        ctx.stroke();

        // 當前日期的太陽亮點
        const cur = calcAnalemma(p.dayOfYear, p.tiltOn, p.eccOn);
        const curSkyX = skyCx + cur.eotMin * 5.2;
        const curSkyY = skyCy - cur.decl * 4.8;
        ctx.fillStyle = PALETTE.node;
        ctx.beginPath(); ctx.arc(curSkyX, curSkyY, 7.5, 0, TAU); ctx.fill();

        drawPill2D(ctx, '每天中午 12:00 天空太陽軌跡 (面向南方)', skyCx, -148, PALETTE.sun);
        drawPill2D(ctx, '東 E (偏慢)  ← 子午線 →  西 W (偏快)', skyCx, 148, PALETTE.muted);

        // 右側：全年均時差曲線圖 (Equation of Time: -16m ~ +17m)
        const gx0 = 42, gx1 = 272, gy0 = 5;
        ctx.fillStyle = '#0F172A';
        ctx.beginPath(); ctx.roundRect(25, -170, 262, 340, 12); ctx.fill();
        ctx.strokeStyle = PALETTE.grid; ctx.stroke();

        ctx.strokeStyle = 'rgba(148,163,184,0.35)';
        ctx.beginPath(); ctx.moveTo(gx0, gy0); ctx.lineTo(gx1, gy0); ctx.stroke();

        ctx.strokeStyle = PALETTE.earth;
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        for (let d = 1; d <= 365; d += 2) {
          const r = calcAnalemma(d, p.tiltOn, p.eccOn);
          const x = lerp(gx0, gx1, (d - 1) / 364);
          const y = gy0 - r.eotMin * 6.2;
          d === 1 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();

        const cxGraph = lerp(gx0, gx1, (p.dayOfYear - 1) / 364);
        const cyGraph = gy0 - cur.eotMin * 6.2;
        ctx.fillStyle = PALETTE.node;
        ctx.beginPath(); ctx.arc(cxGraph, cyGraph, 6.5, 0, TAU); ctx.fill();

        drawPill2D(ctx, `均時差: ${cur.eotMin >= 0 ? '+' : ''}${cur.eotMin.toFixed(1)} 分鐘`, 156, -148, PALETTE.earth);
        drawPill2D(ctx, `太陽赤緯: ${cur.decl >= 0 ? '+' : ''}${cur.decl.toFixed(1)}°`, 156, 148, PALETTE.node);
        break;
      }

      /* ---------------- 09 恆星日與太陽日：上中天子午線通過視窗 ---------------- */
      case 8: {
        const siderealH = 23.9344696;
        // 計算地球真正自轉度數：在 siderealH 恰好 360.0°，在 24.0h 為 360.986°
        const spinDeg = (p.rotHours / siderealH) * 360.0;
        const sunNeedDeg = 360.0 + (p.rotHours / 24.0) * 0.9856;

        // 上方：觀測者仰望「正南上中天子午線」放大望遠鏡視窗
        ctx.fillStyle = '#091426';
        ctx.beginPath(); ctx.roundRect(-275, -168, 550, 220, 12); ctx.fill();
        ctx.strokeStyle = PALETTE.grid; ctx.stroke();

        // 綠色中央上中天子午線
        ctx.strokeStyle = PALETTE.land;
        ctx.lineWidth = 2.5;
        ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.moveTo(0, -165); ctx.lineTo(0, 50); ctx.stroke();
        ctx.setLineDash([]);

        // 將最後 1.5° 或最初 1.5° 放大顯示在視野中 (其餘時間顯示環繞進度)
        const wrapDiff = (cur, target) => {
          let d = (target - cur) % 360;
          if (d > 180) d -= 360;
          if (d < -180) d += 360;
          return d;
        };
        const starDeltaDeg = wrapDiff(spinDeg % 360, 0);
        const sunDeltaDeg = wrapDiff(spinDeg, sunNeedDeg);

        // 放大倍率：1° = 95 px，讓 0.986° 的差距一目了然!
        const starX = clamp(-starDeltaDeg * 95, -245, 245);
        const sunX = clamp(-sunDeltaDeg * 95, -245, 245);

        // 繪製遠方參考恆星 (青色十字星芒)
        ctx.strokeStyle = PALETTE.tide; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(starX - 14, -95); ctx.lineTo(starX + 14, -95); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(starX, -95 - 14); ctx.lineTo(starX, -95 + 14); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(starX, -95, 4.5, 0, TAU); ctx.fill();

        // 繪製太陽圓盤 (位於下方軌道 y = -20)
        ctx.fillStyle = PALETTE.sun;
        ctx.beginPath(); ctx.arc(sunX, -20, 22, 0, TAU); ctx.fill();

        // 當接近 23h56m 時標出 0.986° (約 4 分鐘) 差距雙箭頭!
        if (p.rotHours > 22.5) {
          ctx.strokeStyle = PALETTE.node; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(starX, -58); ctx.lineTo(sunX, -58); ctx.stroke();
          drawPill2D(ctx, '相差約 0.986° (需多轉 3分56秒!)', (starX + sunX) * 0.5, -58, PALETTE.node);
        }

        drawPill2D(ctx, '正南上中天子午線 (Meridian)', 0, -148, PALETTE.land);
        drawPill2D(ctx, '遠方恆星', starX, -124, PALETTE.tide);
        drawPill2D(ctx, '太陽', sunX, 18, PALETTE.sun);

        // 下方：雙計時面板對照卡 (地球空間真實自轉角 vs 太陽時)
        ctx.fillStyle = '#0F172A';
        ctx.beginPath(); ctx.roundRect(-275, 68, 265, 98, 10); ctx.fill();
        ctx.strokeStyle = PALETTE.tide; ctx.stroke();
        drawPill2D(ctx, `空間真實自轉角: ${spinDeg.toFixed(2)}°`, -142, 96, PALETTE.tide);
        drawPill2D(ctx, spinDeg >= 359.95 && spinDeg <= 360.08 ? '✅ 滿 360° 恆星日達成 (23h 56m 04s)' : '恆星日週期 = 23h 56m 04s', -142, 136, PALETTE.tide);

        ctx.fillStyle = '#0F172A';
        ctx.beginPath(); ctx.roundRect(10, 68, 265, 98, 10); ctx.fill();
        ctx.strokeStyle = PALETTE.sun; ctx.stroke();
        drawPill2D(ctx, `太陽時鐘: ${fmtSiderealClock(p.rotHours)}`, 142, 96, PALETTE.sun);
        drawPill2D(ctx, p.rotHours >= 23.99 ? '✅ 360.99° 太陽日正午達成 (24h 00m)' : '太陽日週期 = 24h 00m 00s', 142, 136, PALETTE.sun);
        break;
      }

      /* ---------------- 10 內行星(金星)逆行軌跡與伽利略望遠鏡盈虧 ---------------- */
      case 9: {
        // 計算完整會合週期天球背景視座標 (經度偏移 lon, 緯度偏移 lat) 與行星相位 k、距離 d
        const getPlanetSky = (prog, mode) => {
          const t = prog - 0.5;
          let ex, ez, px, py, pz;
          if (mode === 0) {
            const eA = -Math.PI / 2 + t * 2.1;
            const vA = -Math.PI / 2 + t * 5.52;
            ex = Math.cos(eA) * 1.0; ez = Math.sin(eA) * 1.0;
            px = Math.cos(vA) * 0.723; py = Math.sin(vA) * 0.085; pz = Math.sin(vA) * 0.723;
          } else {
            const eA = -Math.PI / 2 + t * 4.2;
            const mA = -Math.PI / 2 + t * 2.23;
            ex = Math.cos(eA) * 1.0; ez = Math.sin(eA) * 1.0;
            px = Math.cos(mA) * 1.524; py = Math.sin(mA) * 0.095; pz = Math.sin(mA) * 1.524;
          }
          const dx = px - ex, dy = py, dz = pz - ez;
          const dist = Math.hypot(dx, dy, dz);
          // 背景恆星黃經 (面向 -Z 為基準 0，西在右、東在左：順行向東即向左或設定標準星圖東在左!)
          const lon = Math.atan2(dx, -dz) * RAD;
          const lat = Math.asin(clamp(dy / dist, -1, 1)) * RAD;

          // 相位照明率 k = (1 + cos(太陽-行星-地球夾角)) / 2
          // 向量 行星->太陽 = (-px, -py, -pz), 行星->地球 = (-dx, -dy, -dz)
          const rSun = Math.hypot(px, py, pz);
          const cosPhase = (px * dx + py * dy + pz * dz) / (rSun * dist);
          const k = 0.5 * (1 + clamp(cosPhase, -1, 1));
          const sunRightSide = (px * dz - pz * dx) > 0 ? 1 : -1;
          return { lon, lat, dist, k, sunRightSide };
        };

        // 上半部：背景恆星座標系視運動軌跡圖 (標示順行:綠 / 留:金 / 逆行:紅!)
        ctx.fillStyle = '#070E1E';
        ctx.beginPath(); ctx.roundRect(-280, -172, 560, 198, 12); ctx.fill();
        ctx.strokeStyle = PALETTE.grid; ctx.stroke();

        // 固定背景星座星點
        ctx.fillStyle = 'rgba(226, 232, 240, 0.55)';
        for (let i = 0; i < 28; i++) {
          const sx = -255 + ((i * 79) % 510);
          const sy = -155 + ((i * 47) % 165);
          ctx.beginPath(); ctx.arc(sx, sy, (i % 3 === 0) ? 2.1 : 1.2, 0, TAU); ctx.fill();
        }

        const mapPt = (s) => ({ x: -s.lon * 4.1, y: -72 - s.lat * 11.5 });

        // 繪製完整軌跡並自動著色「順行(綠)」與「逆行(紅)」段
        for (let q = 0.16; q < 0.84; q += 0.006) {
          const s1 = getPlanetSky(q, p.planetMode);
          const s2 = getPlanetSky(q + 0.006, p.planetMode);
          const dLon = s2.lon - s1.lon;
          const isRetro = dLon < 0; // 黃經減少 = 逆行!
          const p1 = mapPt(s1), p2 = mapPt(s2);
          if (Math.abs(p1.x) < 268 && Math.abs(p2.x) < 268) {
            ctx.strokeStyle = isRetro ? PALETTE.node : PALETTE.land;
            ctx.lineWidth = isRetro ? 3.6 : 2.2;
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
          }
        }

        const cur = getPlanetSky(p.synodicProg, p.planetMode);
        const nxt = getPlanetSky(clamp(p.synodicProg + 0.004, 0, 1), p.planetMode);
        const vel = (nxt.lon - cur.lon) / 0.004;
        const motionState = Math.abs(vel) < 12 ? '⏸ 留 (Stationary - 視覺停滯轉折點)'
          : vel < 0 ? '◀ 逆行中 (Retrograde - 內圈超車倒退!)'
          : '▶ 順行中 (Prograde - 正常向東移動)';

        const cPt = mapPt(cur);
        if (Math.abs(cPt.x) < 270) {
          ctx.fillStyle = p.planetMode === 0 ? PALETTE.venus : PALETTE.node;
          ctx.beginPath(); ctx.arc(cPt.x, cPt.y, 7.5, 0, TAU); ctx.fill();
        }

        drawPill2D(ctx, motionState, 0, -150, vel < 0 ? PALETTE.node : Math.abs(vel) < 12 ? PALETTE.sun : PALETTE.land);
        drawPill2D(ctx, '東 East (順行方向 ←)                 背景恆星座標系                 (→ 逆行方向) 西 West', 0, 10, PALETTE.muted);

        // 下半部：伽利略高倍率望遠鏡視窗 (呈現盈虧相位與 6 倍視直徑劇烈變化!)
        ctx.fillStyle = '#0B1324';
        ctx.beginPath(); ctx.roundRect(-280, 38, 560, 134, 12); ctx.fill();
        ctx.strokeStyle = PALETTE.venus; ctx.stroke();

        const teleCx = -115, teleCy = 105;
        ctx.fillStyle = '#020617';
        ctx.beginPath(); ctx.arc(teleCx, teleCy, 56, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(253, 224, 71, 0.45)'; ctx.lineWidth = 2; ctx.stroke();

        // 計算視半徑：金星最近 0.277 AU (R=45px) vs 最遠 1.723 AU (R=7.5px) -> 超過 6 倍視直徑差異!
        const appR = p.planetMode === 0 ? clamp(12.5 / cur.dist, 7.5, 45) : clamp(22 / cur.dist, 9, 38);

        // 精準繪製行星明暗盈虧圓盤
        ctx.save();
        ctx.translate(teleCx, teleCy);
        // 暗面底盤
        ctx.fillStyle = '#1E293B';
        ctx.beginPath(); ctx.arc(0, 0, appR, 0, TAU); ctx.fill();

        // 亮面相位幾何 (使用半圓 + 晨昏橢圓合成任意相位 k ∈ [0, 1])
        const litColor = p.planetMode === 0 ? '#FEF08A' : '#FB7185';
        const side = cur.sunRightSide;
        ctx.fillStyle = litColor;
        ctx.beginPath();
        if (side > 0) {
          ctx.arc(0, 0, appR, -Math.PI / 2, Math.PI / 2, false);
        } else {
          ctx.arc(0, 0, appR, Math.PI / 2, -Math.PI / 2, false);
        }
        ctx.fill();

        const ellW = Math.abs(2 * cur.k - 1) * appR;
        ctx.fillStyle = cur.k >= 0.5 ? litColor : '#1E293B';
        ctx.beginPath();
        ctx.ellipse(0, 0, ellW, appR, 0, 0, TAU);
        ctx.fill();
        ctx.restore();

        const arcsec = p.planetMode === 0 ? (16.8 / cur.dist) : (9.4 / cur.dist);
        drawPill2D(ctx, `望遠鏡相位: 照明率 ${(cur.k * 100).toFixed(0)}%`, 105, 76, PALETTE.venus);
        drawPill2D(ctx, `地球距離: ${cur.dist.toFixed(2)} AU ｜ 視直徑: ${arcsec.toFixed(1)}″`, 105, 112, PALETTE.earth);
        drawPill2D(ctx, p.planetMode === 0 ? '哥白尼鐵證：下合逆行時呈巨大眉月、上合呈小滿月' : '外行星火星：衝日逆行時最亮最大且永遠接近滿相', 105, 148, PALETTE.sun);
        break;
      }
    }

    ctx.restore();
  }

  /* =========================================================
   * 11. UI 控制列、Step-by-Step 導覽與分頁切換綁定
   * ========================================================= */
  const tabsStrip = document.getElementById('tabs-strip');
  const ctrlContainer = document.getElementById('ctrl-container');
  const stepDotsEl = document.getElementById('step-dots');
  const stepTitleEl = document.getElementById('step-title');
  const stepDescEl = document.getElementById('step-desc');
  const macroTitleEl = document.getElementById('macro-title');
  const groundTitleEl = document.getElementById('ground-title');
  const btnPlay = document.getElementById('btn-play');

  // 建立 10 個分頁按鈕
  MODULES.forEach((m, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.innerHTML = `<span class="num">${m.num}</span><span>${m.short}</span>`;
    btn.addEventListener('click', () => switchTab(idx));
    tabsStrip.appendChild(btn);
  });

  document.getElementById('tab-left').addEventListener('click', () => { tabsStrip.scrollBy({ left: -220, behavior: 'smooth' }); });
  document.getElementById('tab-right').addEventListener('click', () => { tabsStrip.scrollBy({ left: 220, behavior: 'smooth' }); });

  // 建立動態參數控制器並維持即時數值同步
  let uiValueUpdaters = [];
  function buildControlsUI(tabIdx) {
    ctrlContainer.innerHTML = '';
    uiValueUpdaters = [];
    const mod = MODULES[tabIdx];
    const p = state.params[tabIdx];

    mod.controls.forEach(c => {
      const wrap = document.createElement('div');
      wrap.className = 'ctrl-item';

      if (c.type === 'chips' || c.type === 'presets') {
        const lbl = document.createElement('div');
        lbl.className = 'ctrl-label-row';
        lbl.innerHTML = `<span>${c.label}</span>`;
        const row = document.createElement('div');
        row.className = 'preset-row';
        const chips = [];
        c.options.forEach(opt => {
          const ch = document.createElement('button');
          ch.className = 'preset-chip';
          ch.textContent = opt.label;
          ch.addEventListener('click', () => {
            state.tween = null;
            p[c.key] = opt.val;
            syncControlsReadout();
          });
          row.appendChild(ch);
          chips.push({ el: ch, val: opt.val });
        });
        wrap.appendChild(lbl);
        wrap.appendChild(row);
        uiValueUpdaters.push(() => {
          chips.forEach(ch => ch.el.classList.toggle('active', Math.abs(p[c.key] - ch.val) < 0.05));
        });
      } else {
        const lbl = document.createElement('div');
        lbl.className = 'ctrl-label-row';
        const nameSpan = document.createElement('span');
        nameSpan.textContent = c.label;
        const valSpan = document.createElement('span');
        valSpan.className = 'ctrl-val';
        lbl.append(nameSpan, valSpan);

        const input = document.createElement('input');
        input.type = 'range';
        input.min = c.min;
        input.max = c.max;
        input.step = c.step;
        input.value = p[c.key];
        input.addEventListener('input', () => {
          state.tween = null;
          p[c.key] = parseFloat(input.value);
          valSpan.textContent = c.fmt ? c.fmt(p[c.key]) : p[c.key];
        });

        wrap.append(lbl, input);
        uiValueUpdaters.push(() => {
          if (document.activeElement !== input) input.value = p[c.key];
          valSpan.textContent = c.fmt ? c.fmt(p[c.key]) : p[c.key];
        });
      }

      ctrlContainer.appendChild(wrap);
    });
    syncControlsReadout();
  }

  function syncControlsReadout() {
    for (const fn of uiValueUpdaters) fn();
  }

  function updatePlayButtonUI() {
    btnPlay.classList.toggle('play-on', state.playing);
    btnPlay.textContent = state.playing ? '⏸ 暫停' : '▶ 播放';
  }

  // Step-by-Step 流程導覽切換 (自動平滑補間參數與 3D 相機視角)
  function applyStep(stepIdx, animate = true) {
    const mod = MODULES[state.tabIdx];
    state.stepIdx = clamp(stepIdx, 0, mod.steps.length - 1);
    const st = mod.steps[state.stepIdx];

    stepTitleEl.textContent = st.title;
    stepDescEl.textContent = st.desc;
    state.playing = !!st.play;
    updatePlayButtonUI();

    // 更新步驟圓點高亮
    Array.from(stepDotsEl.children).forEach((d, i) => d.classList.toggle('active', i === state.stepIdx));

    const p = state.params[state.tabIdx];
    if (!animate) {
      Object.assign(p, st.params);
      if (st.cam) camRig.reset(st.cam);
      state.tween = null;
      syncControlsReadout();
    } else {
      state.tween = {
        startParams: { ...p },
        targetParams: { ...st.params },
        startCam: { theta: camRig.theta, phi: camRig.phi, radius: camRig.radius, tx: camRig.target.x, ty: camRig.target.y, tz: camRig.target.z },
        targetCam: st.cam || mod.cam,
        elapsed: 0,
        duration: 0.62
      };
    }
  }

  function buildStepsUI(tabIdx) {
    const mod = MODULES[tabIdx];
    stepDotsEl.innerHTML = '';
    mod.steps.forEach((_, idx) => {
      const b = document.createElement('button');
      b.className = 'step-dot' + (idx === 0 ? ' active' : '');
      b.textContent = `S${idx + 1}`;
      b.title = `跳至步驟 ${idx + 1}`;
      b.addEventListener('click', () => applyStep(idx, true));
      stepDotsEl.appendChild(b);
    });
  }

  function switchTab(idx) {
    state.tabIdx = idx;
    state.tween = null;
    const mod = MODULES[idx];

    Array.from(tabsStrip.children).forEach((b, i) => {
      const active = i === idx;
      b.classList.toggle('active', active);
      if (active) b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });

    macroTitleEl.textContent = mod.macroTitle;
    groundTitleEl.textContent = mod.groundTitle;
    groundCam.reset();
    camRig.reset(mod.cam);

    buildMacroScene(idx);
    buildControlsUI(idx);
    buildStepsUI(idx);
    applyStep(0, false);
  }

  // 全域按鈕事件
  btnPlay.addEventListener('click', () => {
    state.playing = !state.playing;
    updatePlayButtonUI();
  });

  document.getElementById('btn-prev-step').addEventListener('click', () => {
    const len = MODULES[state.tabIdx].steps.length;
    applyStep((state.stepIdx - 1 + len) % len, true);
  });

  document.getElementById('btn-next-step').addEventListener('click', () => {
    const len = MODULES[state.tabIdx].steps.length;
    applyStep((state.stepIdx + 1) % len, true);
  });

  // 文字標籤顯示/隱藏開關
  const btnLabels = document.getElementById('btn-labels');
  function toggleLabels() {
    state.showLabels = !state.showLabels;
    btnLabels.classList.toggle('label-on', state.showLabels);
    btnLabels.textContent = state.showLabels ? '🏷️ 標籤: 開' : '🏷️ 標籤: 關';
  }
  btnLabels.addEventListener('click', toggleLabels);
  window.addEventListener('keydown', e => {
    if (e.key === 'l' || e.key === 'L') toggleLabels();
  });

  // 視角模式切換 (雙視角 / 僅太空 / 僅地表)
  const stageEl = document.getElementById('stage');
  const viewBtns = {
    dual: document.getElementById('view-dual'),
    macro: document.getElementById('view-macro'),
    ground: document.getElementById('view-ground')
  };
  function setViewMode(mode) {
    state.viewMode = mode;
    stageEl.className = mode === 'dual' ? '' : `mode-${mode}`;
    Object.keys(viewBtns).forEach(k => viewBtns[k].classList.toggle('active', k === mode));
    handleResize();
  }
  viewBtns.dual.addEventListener('click', () => setViewMode('dual'));
  viewBtns.macro.addEventListener('click', () => setViewMode('macro'));
  viewBtns.ground.addEventListener('click', () => setViewMode('ground'));

  // 底部面板收合/展開 (行動裝置小螢幕友善)
  const dockEl = document.getElementById('dock');
  const btnDockCollapse = document.getElementById('btn-dock-collapse');
  btnDockCollapse.addEventListener('click', () => {
    const collapsed = dockEl.classList.toggle('collapsed');
    btnDockCollapse.textContent = collapsed ? '展開控制面板 ▲' : '收合面板 ▼';
    setTimeout(handleResize, 50);
  });

  // 視角右上角 Zoom / Pan 輔助按鈕
  const macroPanBtn = document.getElementById('macro-pan-toggle');
  macroPanBtn.addEventListener('click', () => {
    state.macroPanMode = !state.macroPanMode;
    macroPanBtn.classList.toggle('active', state.macroPanMode);
  });
  document.getElementById('macro-zoom-in').addEventListener('click', () => { camRig.radius *= 0.84; });
  document.getElementById('macro-zoom-out').addEventListener('click', () => { camRig.radius *= 1.18; });
  document.getElementById('macro-reset').addEventListener('click', () => { camRig.reset(MODULES[state.tabIdx].cam); });

  document.getElementById('ground-zoom-in').addEventListener('click', () => { groundCam.zoom = clamp(groundCam.zoom * 1.2, 0.55, 3.8); });
  document.getElementById('ground-zoom-out').addEventListener('click', () => { groundCam.zoom = clamp(groundCam.zoom / 1.2, 0.55, 3.8); });
  document.getElementById('ground-reset').addEventListener('click', () => { groundCam.reset(); });

  /* =========================================================
   * 12. 視窗自適應縮放與 60fps 主模擬迴圈
   * ========================================================= */
  function handleResize() {
    if (state.viewMode !== 'ground') {
      const mw = macroPane.clientWidth;
      const mh = macroPane.clientHeight;
      if (mw > 2 && mh > 2) {
        camera.aspect = mw / mh;
        camera.updateProjectionMatrix();
        renderer.setSize(mw, mh, false);
      }
    }
  }
  window.addEventListener('resize', handleResize);
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(handleResize);
    ro.observe(stageEl);
  }

  let lastTime = performance.now();
  function animateLoop(now) {
    requestAnimationFrame(animateLoop);
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    const p = state.params[state.tabIdx];

    // 處理 Step-by-Step 平滑補間動畫
    if (state.tween) {
      const tw = state.tween;
      tw.elapsed += dt;
      const rawT = clamp(tw.elapsed / tw.duration, 0, 1);
      const ease = 1 - Math.pow(1 - rawT, 3); // Cubic Ease-Out

      for (const k of Object.keys(tw.targetParams)) {
        if (typeof tw.startParams[k] === 'number') {
          p[k] = lerp(tw.startParams[k], tw.targetParams[k], ease);
        } else {
          p[k] = tw.targetParams[k];
        }
      }
      camRig.theta = lerp(tw.startCam.theta, tw.targetCam.theta, ease);
      camRig.phi = lerp(tw.startCam.phi, tw.targetCam.phi, ease);
      camRig.radius = lerp(tw.startCam.radius, tw.targetCam.radius, ease);
      camRig.target.set(
        lerp(tw.startCam.tx, 0, ease),
        lerp(tw.startCam.ty, 0, ease),
        lerp(tw.startCam.tz, 0, ease)
      );
      if (rawT >= 1) state.tween = null;
    }

    if (activeMacroUpdater) activeMacroUpdater(p, dt);
    syncControlsReadout();

    if (state.viewMode !== 'ground') {
      camRig.updateCamera();
      renderer.render(scene, camera);
      syncLabels3D();
    } else {
      macroLabelLayer.style.display = 'none';
    }

    renderGroundView(state.tabIdx, p);
  }

  // 初始化啟動第 01 分頁
  switchTab(0);
  handleResize();
  requestAnimationFrame(animateLoop);
})();
</script>
</body>
</html>
