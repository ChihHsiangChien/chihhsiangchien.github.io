<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>互動天體運動與觀測雙視角模擬器 | AstroLab Dual-View</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-deep: #060913;
      --bg-panel: rgba(15, 23, 42, 0.92);
      --bg-card: rgba(30, 41, 59, 0.72);
      --border-subtle: rgba(148, 163, 184, 0.18);
      --border-active: rgba(56, 189, 248, 0.65);
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;

      /* 跨分頁統一科學視覺色票 */
      --c-sun: #FBBF24;
      /* 太陽 / 黃道面 / 太陽光束 */
      --c-earth: #38BDF8;
      /* 地球 / 天球地平 / 海洋 */
      --c-land: #10B981;
      /* 地表觀測者 / 順行 / 陸地 */
      --c-moon: #E2E8F0;
      /* 月球本體 */
      --c-lunar-orb: #A78BFA;
      /* 白道面 / 月球引力向量 */
      --c-node: #F43F5E;
      /* 交點線 / 食季 / 紅光折射 / 逆行 */
      --c-tide: #06B6D4;
      /* 潮汐海水 / 遠方恆星 */
      --c-venus: #FDE047;
      /* 金星 / 行星視運動 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 14px;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
    }

    /* 頂部導覽列與分頁器 */
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(12px);
      z-index: 30;
      flex-shrink: 0;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      gap: 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--c-sun);
      box-shadow: 0 0 10px var(--c-sun);
    }

    .global-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-pill:hover {
      border-color: rgba(148, 163, 184, 0.45);
      background: rgba(51, 65, 85, 0.85);
    }

    .btn-pill.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--c-earth);
      color: #7DD3FC;
    }

    .btn-pill.label-on {
      background: rgba(251, 191, 36, 0.16);
      border-color: var(--c-sun);
      color: #FDE68A;
    }

    .view-seg {
      display: flex;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
    }

    .view-seg button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 0 9px;
      height: 30px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }

    .view-seg button.active {
      background: rgba(56, 189, 248, 0.22);
      color: #fff;
    }

    /* 分頁捲動列 */
    .tabs-bar-wrap {
      display: flex;
      align-items: center;
      position: relative;
      padding: 4px 6px;
      gap: 4px;
    }

    .tab-scroll-btn {
      width: 28px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: rgba(30, 41, 59, 0.9);
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .tabs-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      flex: 1;
      padding: 2px 2px;
    }

    .tabs-strip::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: rgba(30, 41, 59, 0.55);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn .num {
      font-size: 10.5px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(148, 163, 184, 0.15);
      color: #CBD5E1;
      font-variant-numeric: tabular-nums;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.24), rgba(167, 139, 250, 0.22));
      border-color: var(--c-earth);
      color: #FFFFFF;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .tab-btn.active .num {
      background: var(--c-earth);
      color: #060913;
      font-weight: 800;
    }

    /* 雙視角主舞台 */
    #stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
      min-height: 0;
      position: relative;
      background: var(--bg-deep);
    }

    #stage.mode-macro {
      grid-template-columns: 1fr;
    }

    #stage.mode-macro #ground-pane {
      display: none;
    }

    #stage.mode-ground {
      grid-template-columns: 1fr;
    }

    #stage.mode-ground #macro-pane {
      display: none;
    }

    .viewport-pane {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      touch-action: none;
    }

    #macro-pane {
      border-right: 1px solid var(--border-subtle);
      background: radial-gradient(circle at 50% 50%, #0D162C 0%, #050811 100%);
    }

    #ground-pane {
      background: #070C18;
    }

    .viewport-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* 視角左上角標題徽章 */
    .pane-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(6px);
      pointer-events: none;
      max-width: calc(100% - 140px);
    }

    .pane-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pane-badge-text {
      font-size: 12px;
      font-weight: 700;
      color: #E2E8F0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 視角右上角 Zoom & Pan 觸控輔助工具列 */
    .cam-tools {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 14;
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--border-subtle);
      padding: 3px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
    }

    .cam-btn {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 6px;
      background: rgba(30, 41, 59, 0.85);
      color: #E2E8F0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
    }

    .cam-btn:hover {
      background: rgba(51, 65, 85, 0.95);
    }

    .cam-btn.active {
      background: rgba(56, 189, 248, 0.28);
      color: #7DD3FC;
      box-shadow: inset 0 0 0 1px var(--c-earth);
    }

    /* 3D 浮動標籤層 */
    #macro-labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .label-3d {
      position: absolute;
      transform: translate(-50%, -100%);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 700;
      background: rgba(9, 14, 28, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #F8FAFC;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
      transition: opacity 0.15s;
    }

    /* 底部互動控制塢 (Step-by-Step + 參數控制 + 統一色票圖例) */
    #dock {
      background: var(--bg-panel);
      border-top: 1px solid var(--border-subtle);
      backdrop-filter: blur(14px);
      z-index: 25;
      flex-shrink: 0;
      transition: max-height 0.25s ease;
    }

    .dock-header-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 12px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      gap: 8px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .legend-row::-webkit-scrollbar {
      display: none;
    }

    .leg-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .leg-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .dock-toggle-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--border-subtle);
      color: #CBD5E1;
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .dock-body {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 10px;
      padding: 8px 12px 10px;
      max-height: 235px;
      overflow-y: auto;
    }

    #dock.collapsed .dock-body {
      display: none;
    }

    /* Step-by-Step 教學卡片 */
    .step-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .step-nav-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .step-btn {
      height: 30px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.85);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .step-btn:hover {
      background: rgba(51, 65, 85, 0.9);
    }

    .step-btn.play-on {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--c-land);
      color: #6EE7B7;
    }

    .step-dots {
      display: flex;
      gap: 4px;
    }

    .step-dot {
      height: 28px;
      min-width: 30px;
      padding: 0 7px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.65);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    .step-dot.active {
      background: var(--c-earth);
      border-color: var(--c-earth);
      color: #060913;
    }

    .step-info-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .step-title {
      font-size: 13px;
      font-weight: 700;
      color: #FDE68A;
    }

    .step-desc {
      font-size: 12px;
      line-height: 1.45;
      color: #CBD5E1;
      user-select: text;
    }

    /* 參數控制區 */
    .params-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      justify-content: center;
    }

    .ctrl-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 8px 12px;
      align-items: center;
    }

    .ctrl-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ctrl-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: #CBD5E1;
      font-weight: 600;
    }

    .ctrl-val {
      color: #7DD3FC;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 4px;
      background: rgba(148, 163, 184, 0.25);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--c-earth);
      border: 2px solid #fff;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
    }

    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .preset-chip {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.8);
      color: #CBD5E1;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .preset-chip.active,
    .preset-chip:hover {
      border-color: var(--c-earth);
      background: rgba(56, 189, 248, 0.22);
      color: #fff;
    }

    /* 平板與手機響應式調整 */
    @media (max-width: 900px) {
      #stage {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      #stage.mode-macro,
      #stage.mode-ground {
        grid-template-rows: 1fr;
      }

      #macro-pane {
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
      }

      .dock-body {
        grid-template-columns: 1fr;
        max-height: 220px;
      }

      .brand span.sub {
        display: none;
      }
    }

    @media (max-width: 520px) {
      .top-row {
        padding: 5px 8px;
      }

      .brand {
        font-size: 13.5px;
      }

      .btn-pill {
        padding: 0 8px;
        font-size: 11.5px;
        height: 29px;
      }

      .view-seg button {
        padding: 0 7px;
        font-size: 11.5px;
        height: 28px;
      }

      .tab-scroll-btn {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- 頂部導覽與分頁切換器 -->
    <header>
      <div class="top-row">
        <div class="brand">
          <span class="brand-dot"></span>
          <span>天體運動雙視角模擬器</span>
          <span class="sub" style="color:var(--text-muted);font-weight:500;font-size:12px;">Macro 3D × Ground Sky</span>
        </div>
        <div class="global-actions">
          <div class="view-seg" role="group" aria-label="視角模式">
            <button id="view-dual" class="active" title="雙視角同步並排">雙視角</button>
            <button id="view-macro" title="僅顯示太空3D上帝視角">太空</button>
            <button id="view-ground" title="僅顯示地表/光學微觀視角">地表</button>
          </div>
          <button id="btn-labels" class="btn-pill label-on" title="切換文字標籤顯示/隱藏 (快捷鍵 L)">
            🏷️ 標籤: 開
          </button>
        </div>
      </div>
      <div class="tabs-bar-wrap">
        <button class="tab-scroll-btn" id="tab-left" aria-label="向左捲動分頁">◀</button>
        <div class="tabs-strip" id="tabs-strip"></div>
        <button class="tab-scroll-btn" id="tab-right" aria-label="向右捲動分頁">▶</button>
      </div>
    </header>

    <!-- 雙視角互動主舞台 -->
    <main id="stage">
      <!-- 左/上：太空上帝視角 (Three.js 3D) -->
      <section id="macro-pane" class="viewport-pane">
        <div class="pane-badge">
          <span class="dot" style="background:var(--c-sun)"></span>
          <span class="pane-badge-text" id="macro-title">太空上帝視角 (Macro 3D)</span>
        </div>
        <div class="cam-tools">
          <button class="cam-btn" id="macro-pan-toggle" title="切換單指拖曳模式：旋轉視角 / 平移畫面">✢</button>
          <button class="cam-btn" id="macro-zoom-in" title="放大太空視角">＋</button>
          <button class="cam-btn" id="macro-zoom-out" title="縮小太空視角">－</button>
          <button class="cam-btn" id="macro-reset" title="重置太空視角">↺</button>
        </div>
        <canvas id="macro-canvas" class="viewport-canvas"></canvas>
        <div id="macro-labels"></div>
      </section>

      <!-- 右/下：地表沈浸與光學微觀視角 (2D Zoom/Pan Canvas) -->
      <section id="ground-pane" class="viewport-pane">
        <div class="pane-badge">
          <span class="dot" style="background:var(--c-land)"></span>
          <span class="pane-badge-text" id="ground-title">地表沈浸視角 (Ground View)</span>
        </div>
        <div class="cam-tools">
          <button class="cam-btn" id="ground-zoom-in" title="放大地表視角">＋</button>
          <button class="cam-btn" id="ground-zoom-out" title="縮小地表視角">－</button>
          <button class="cam-btn" id="ground-reset" title="重置地表視角">↺</button>
        </div>
        <canvas id="ground-canvas" class="viewport-canvas"></canvas>
      </section>
    </main>

    <!-- 底部控制塢：統一色票圖例 + Step-by-Step 流程控制 + 互動參數 -->
    <footer id="dock">
      <div class="dock-header-strip">
        <div class="legend-row">
          <span class="leg-item"><i class="leg-swatch" style="background:var(--c-sun)"></i>太陽 / 黃道</span>
          <span class="leg-item"><i class="leg-swatch" style="background:var(--c-earth)"></i>地球 / 天球</span>
          <span class="leg-item"><i class="leg-swatch" style="background:var(--c-lunar-orb)"></i>月球白道 / 引潮</span>
          <span class="leg-item"><i class="leg-swatch" style="background:var(--c-node)"></i>交點 / 紅光 / 逆行</span>
          <span class="leg-item"><i class="leg-swatch" style="background:var(--c-land)"></i>地表觀測者 / 順行</span>
          <span class="leg-item"><i class="leg-swatch" style="background:var(--c-tide)"></i>海洋潮位 / 遠方恆星</span>
        </div>
        <button class="dock-toggle-btn" id="btn-dock-collapse">收合面板 ▼</button>
      </div>
      <div class="dock-body">
        <!-- Step-by-Step 導覽區 -->
        <div class="step-panel">
          <div class="step-controls-row">
            <div class="step-nav-group">
              <button class="step-btn play-on" id="btn-play">⏸ 暫停</button>
              <button class="step-btn" id="btn-prev-step">◀ 上一步</button>
              <button class="step-btn" id="btn-next-step">下一步 ▶</button>
            </div>
            <div class="step-dots" id="step-dots"></div>
          </div>
          <div class="step-info-box">
            <div class="step-title" id="step-title">步驟載入中...</div>
            <div class="step-desc" id="step-desc"></div>
          </div>
        </div>

        <!-- 動態參數控制區 -->

      // 分頁10：內/外行星逆行幾何 (真實會合週期比例，prog=0.5 為下合/衝，此時行星地心黃經=90°)
      const RETRO_CFG = [
        { name: '金星', a: 0.7233, dE: 575.5, dP: 935.5, eLon: 270, inc: 3.39, synodic: 583.9 },
        { name: '火星', a: 1.5237, dE: 768.7, dP: 408.7, eLon: 90, inc: 1.85, synodic: 779.9 }
      ];
      function retroState(prog, mode) {
        const c = RETRO_CFG[mode];
        const t = prog - 0.5;
        const eL = (c.eLon + t * c.dE) * DEG;
        const pL = (c.eLon + t * c.dP) * DEG;
        const node = (c.eLon - 65) * DEG; // 升交點：讓逆行時行星位於黃道北側，畫出「逆行迴圈」
        const E = [Math.cos(eL), Math.sin(eL), 0];
        const P = [c.a * Math.cos(pL), c.a * Math.sin(pL), c.a * Math.sin(c.inc * DEG) * Math.sin(pL - node)];
        const D = [P[0] - E[0], P[1] - E[1], P[2] - E[2]];
        const dist = Math.hypot(D[0], D[1], D[2]);
        const lon = normDeg(Math.atan2(D[1], D[0]) * RAD);
        const lat = Math.asin(clamp(D[2] / dist, -1, 1)) * RAD;
        const sunLon = normDeg(Math.atan2(-E[1], -E[0]) * RAD);
        const rSun = Math.hypot(P[0], P[1], P[2]);
        // 相位角：行星->太陽 與 行星->地球 的夾角
        const cosPh = ((-P[0]) * (-D[0]) + (-P[1]) * (-D[1]) + (-P[2]) * (-D[2])) / (rSun * dist);
        const k = 0.5 * (1 + clamp(cosPh, -1, 1));
        const elong = wrap180(sunLon - lon); // >0 代表太陽在行星東側
        return { E, P, lon, lat, dist, k, sunLon, elong, litEast: elong > 0 };
      }
      function retroVelDegPerDay(prog, mode) {
        const dq = 0.0015;
        const a = retroState(prog - dq, mode), b = retroState(prog + dq, mode);
        return wrap180(b.lon - a.lon) / (2 * dq * RETRO_CFG[mode].synodic);

      const EPOCH_DAYS_FROM_J2000 = 9496.5;
      const PLANETS = {
        venus: { name: '金星', a: 0.7233, P: 224.701, L0: 181.98, inc: 3.39, node: 76.68, color: '#FDE047', hex: 0xFDE047, size: 0.36 },

        const p = PLANETS[key];

      }

        const E = planetHelio('earth', d);
        const P = planetHelio(key, d);
        const D = [P[0] - E[0], P[1] - E[1], P[2] - E[2]];

        return { lon: normDeg(Math.atan2(D[1], D[0]) * RAD), lat: Math.asin(clamp(D[2] / r, -1, 1)) * RAD, dist: r, D, E, P };

      function sunGeoLon(d) {

      function fmtDayOfYear(day) {
        const months = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        let d = Math.round(clamp(day, 1, 365));
        let m = 0;
        while (m < 11 && d > months[m]) { d -= months[m]; m++; }
        return `${m + 1}月${d}日 (第${Math.round(day)}天)`;
      }

      function fmtSiderealClock(h) {
        const totalSec = Math.round(h * 3600);
        const hh = Math.floor(totalSec / 3600);
        const mm = Math.floor((totalSec % 3600) / 60);
        const ss = totalSec % 60;
        return `${String(hh).padStart(2, '0')}h ${String(mm).padStart(2, '0')}m ${String(ss).padStart(2, '0')}s`;
      }
      // 【新增輔助函式】農曆日期與月相名稱格式化 (可放在 fmtSiderealClock 下方)
      function getLunarInfo(day) {
        const cnNums = [
          '初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
          '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
          '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'
        ];
        const idx = clamp(Math.floor(day - 0.001), 0, 29);
        const dateStr = `農曆${cnNums[idx]}`;
        const synodic = 29.53;
        const psi = (((day - 1) / synodic) * 360 % 360 + 360) % 360; // 日月距角 0°~360°
        let phaseName = '';
        if (psi < 14 || psi >= 346) phaseName = '朔 (新月)';
        else if (psi < 76) phaseName = '眉月 (娥眉月)';
        else if (psi < 104) phaseName = '上弦月';
        else if (psi < 166) phaseName = '盈凸月';
        else if (psi < 194) phaseName = '望 (滿月)';
        else if (psi < 256) phaseName = '虧凸月';
        else if (psi < 284) phaseName = '下弦月';
        else phaseName = '殘月 (晦日前)';
        return { dateStr, phaseName, psi };
      }
      /* =========================================================
       * 3. 全域應用程式狀態與平滑補間系統
       * ========================================================= */
      const state = {
        tabIdx: 0,
        stepIdx: 0,

        showLabels: true,
        viewMode: 'dual', // 'dual' | 'macro' | 'ground'

        tween: null // { startParams, targetParams, startCam, targetCam, t, dur }
      };

      /* =========================================================
       * 4. 程序化高質感星球材質產生器 (零外部圖片依賴)
       * ========================================================= */
      function createEarthTexture() {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 256;
        const ctx = c.getContext('2d');
        // 海洋底色
        const grad = ctx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, '#0F3A5D');
        grad.addColorStop(0.5, '#094E82');
        grad.addColorStop(1, '#0F3A5D');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);

        // 簡化大陸輪廓色塊 (有助觀察自轉與全食帶位置)
        ctx.fillStyle = '#15803D';
        const blobs = [
          // 歐亞非
          [270, 58, 95, 42], [355, 72, 65, 45], [272, 118, 48, 58],
          // 台灣與東亞島弧亮點
          [392, 92, 6, 10], [405, 76, 10, 14],
          // 澳洲
          [398, 168, 38, 26],
          // 北美與南美
          [105, 65, 65, 42], [148, 145, 36, 58]
        ];
        blobs.forEach(([x, y, rx, ry]) => {
          ctx.beginPath();
          ctx.ellipse(x, y, rx, ry, 0.2, 0, TAU);
          ctx.fill();
        });
        // 台灣高亮綠點
        ctx.fillStyle = '#34D399';
        ctx.beginPath();
        ctx.ellipse(428, 95, 4, 7, 0.2, 0, TAU);
        ctx.fill();

        // 南北極冰冠
        ctx.fillStyle = 'rgba(241, 245, 249, 0.85)';
        ctx.fillRect(0, 0, 512, 14);
        ctx.fillRect(0, 242, 512, 14);

        // 經緯度輔助淡格線 + 赤道/回歸線
        ctx.strokeStyle = 'rgba(186, 230, 253, 0.18)';
        ctx.lineWidth = 1;
        for (let x = 0; x < 512; x += 512 / 12) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
        }
        for (let y = 32; y < 256; y += 32) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
        }
        // 赤道線
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, 128); ctx.lineTo(512, 128); ctx.stroke();

        const tex = new THREE.CanvasTexture(c);
        tex.needsUpdate = true;
        return tex;
      }

      function createMoonTexture() {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 128;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#CBD5E1';
        ctx.fillRect(0, 0, 256, 128);
        // 月海暗斑
        const maria = [[70, 52, 24], [98, 46, 18], [125, 64, 22], [165, 55, 16], [60, 78, 15], [195, 72, 19]];
        ctx.fillStyle = '#94A3B8';
        maria.forEach(([x, y, r]) => {
          ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
        });
        // 隕石坑
        for (let i = 0; i < 45; i++) {
          const x = (i * 53) % 256;
          const y = 12 + ((i * 37) % 104);
          const r = 2 + (i % 5);
          ctx.fillStyle = i % 2 ? '#E2E8F0' : '#64748B';
          ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
        }
        return new THREE.CanvasTexture(c);
      }

      function createGlowTexture(innerCol, outerCol) {
        const c = document.createElement('canvas');
        c.width = 128; c.height = 128;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
        g.addColorStop(0, innerCol);
        g.addColorStop(0.35, outerCol);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(c);
      }

      /* =========================================================
       * 5. Three.js 太空視角引擎 + 觸控友善 Zoom/Pan/Orbit 控制器
       * ========================================================= */
      const macroCanvas = document.getElementById('macro-canvas');
      const macroPane = document.getElementById('macro-pane');
      const macroLabelLayer = document.getElementById('macro-labels');

      const renderer = new THREE.WebGLRenderer({ canvas: macroCanvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 500);

      const sharedTextures = {
        earth: createEarthTexture(),
        moon: createMoonTexture(),
        sunGlow: createGlowTexture('rgba(255,251,210,1)', 'rgba(251,191,36,0.38)'),
        blueAtm: createGlowTexture('rgba(56,189,248,0.65)', 'rgba(14,165,233,0.12)')
      };

      // 背景星空粒子
      (function addStarfield() {
        const geo = new THREE.BufferGeometry();
        const count = 900;
        const pos = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          const r = 130 + Math.random() * 90;
          const u = Math.random() * 2 - 1;
          const a = Math.random() * TAU;
          const s = Math.sqrt(1 - u * u);
          pos[i * 3] = r * s * Math.cos(a);
          pos[i * 3 + 1] = r * u;
          pos[i * 3 + 2] = r * s * Math.sin(a);
        }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({ color: 0xCBD5E1, size: 0.55, transparent: true, opacity: 0.65 });
        scene.add(new THREE.Points(geo, mat));
      })();

      // 相機軌道與平移 Rig
      const camRig = {
        theta: 0.5,
        phi: 1.0,
        radius: 22,
        target: new THREE.Vector3(0, 0, 0),
        updateCamera() {
          this.phi = clamp(this.phi, 0.12, Math.PI - 0.12);
          this.radius = clamp(this.radius, 5.5, 68);
          const sinP = Math.sin(this.phi);
          camera.position.set(
            this.target.x + this.radius * sinP * Math.sin(this.theta),
            this.target.y + this.radius * Math.cos(this.phi),
            this.target.z + this.radius * sinP * Math.cos(this.theta)
          );
          camera.lookAt(this.target);
        },
        panByScreenDelta(dx, dy) {
          const scale = this.radius * 0.0017;
          const forward = new THREE.Vector3().subVectors(this.target, camera.position).normalize();
          const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
          const up = new THREE.Vector3().crossVectors(right, forward).normalize();
          this.target.addScaledVector(right, -dx * scale);
          this.target.addScaledVector(up, dy * scale);
        },
        reset(spec) {
          this.theta = spec.theta;
          this.phi = spec.phi;
          this.radius = spec.radius;
          this.target.set(0, 0, 0);
        }
      };

      // 滑鼠與多點觸控手勢綁定 (Macro 3D)
      (function bindMacroInput() {
        let dragging = false;
        let isPanDrag = false;
        let lastX = 0, lastY = 0;
        let pinchDist = 0;
        let pinchMidX = 0, pinchMidY = 0;

        macroCanvas.addEventListener('contextmenu', e => e.preventDefault());
        macroCanvas.addEventListener('mousedown', e => {
          dragging = true;
          isPanDrag = state.macroPanMode || e.button === 2 || e.button === 1 || e.shiftKey;
          lastX = e.clientX; lastY = e.clientY;
        });
        window.addEventListener('mousemove', e => {
          if (!dragging) return;
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          lastX = e.clientX; lastY = e.clientY;
          state.tween = null;
          if (isPanDrag) {
            camRig.panByScreenDelta(dx, dy);
          } else {
            camRig.theta -= dx * 0.0065;
            camRig.phi -= dy * 0.0065;
          }
        });
        window.addEventListener('mouseup', () => { dragging = false; });

        macroCanvas.addEventListener('wheel', e => {
          e.preventDefault();
          state.tween = null;
          camRig.radius *= (1 + clamp(e.deltaY, -120, 120) * 0.0012);
        }, { passive: false });

        macroCanvas.addEventListener('touchstart', e => {
          state.tween = null;
          if (e.touches.length === 1) {
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
          } else if (e.touches.length >= 2) {
            const dx = e.touches[1].clientX - e.touches[0].clientX;
            const dy = e.touches[1].clientY - e.touches[0].clientY;
            pinchDist = Math.hypot(dx, dy);
            pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
            pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
          }
        }, { passive: false });

        macroCanvas.addEventListener('touchmove', e => {
          e.preventDefault();
          if (e.touches.length === 1) {
            const dx = e.touches[0].clientX - lastX;
            const dy = e.touches[0].clientY - lastY;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            if (state.macroPanMode) {
              camRig.panByScreenDelta(dx, dy);
            } else {
              camRig.theta -= dx * 0.007;
              camRig.phi -= dy * 0.007;
            }
          } else if (e.touches.length >= 2) {
            const dx = e.touches[1].clientX - e.touches[0].clientX;
            const dy = e.touches[1].clientY - e.touches[0].clientY;
            const dist = Math.hypot(dx, dy);
            const midX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
            const midY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
            if (pinchDist > 8) {
              camRig.radius *= (pinchDist / dist);
            }
            camRig.panByScreenDelta(midX - pinchMidX, midY - pinchMidY);
            pinchDist = dist;
            pinchMidX = midX;
            pinchMidY = midY;
          }
        }, { passive: false });
      })();

      /* =========================================================
       * 6. 3D 浮動標籤投影系統 (支援一鍵顯示/隱藏)
       * ========================================================= */
      const activeLabels3D = [];
      function clearLabels3D() {
        activeLabels3D.length = 0;
        macroLabelLayer.innerHTML = '';
      }

      function addLabel3D(text, colorHexStr, offsetY = 0) {
        const el = document.createElement('div');
        el.className = 'label-3d';
        el.textContent = text;
        el.style.borderColor = colorHexStr || 'rgba(255,255,255,0.28)';
        el.style.color = colorHexStr || '#F8FAFC';
        macroLabelLayer.appendChild(el);
        const item = { el, worldPos: new THREE.Vector3(), offsetY, visible: true };
        activeLabels3D.push(item);
        return item;
      }

      const _projVec = new THREE.Vector3();
      function syncLabels3D() {
        if (!state.showLabels || state.viewMode === 'ground') {
          macroLabelLayer.style.display = 'none';
          return;
        }
        macroLabelLayer.style.display = 'block';
        const w = macroCanvas.clientWidth;
        const h = macroCanvas.clientHeight;
        for (const lb of activeLabels3D) {
          if (!lb.visible) { lb.el.style.display = 'none'; continue; }
          _projVec.copy(lb.worldPos);
          _projVec.y += lb.offsetY;
          _projVec.project(camera);
          if (_projVec.z > 1 || _projVec.z < -1) {
            lb.el.style.display = 'none';
            continue;
          }
          const x = (_projVec.x * 0.5 + 0.5) * w;
          const y = (-_projVec.y * 0.5 + 0.5) * h;
          lb.el.style.display = 'block';
          lb.el.style.left = `${x}px`;
          lb.el.style.top = `${y}px`;
        }
      }

      /* =========================================================
       * 7. 3D 幾何輔助建構函式
       * ========================================================= */
      function makeOrbitRing(rx, rz, colorHex, dashed = false, segments = 128) {
        const pts = [];
        for (let i = 0; i <= segments; i++) {
          const a = (i / segments) * TAU;
          pts.push(new THREE.Vector3(Math.cos(a) * rx, 0, Math.sin(a) * rz));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        if (dashed) {
          const mat = new THREE.LineDashedMaterial({ color: colorHex, dashSize: 0.4, gapSize: 0.25, transparent: true, opacity: 0.8 });
          const line = new THREE.Line(geo, mat);
          line.computeLineDistances();
          return line;
        }
        return new THREE.Line(geo, new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.85 }));
      }

      function makeSunMesh(radius = 1.6) {
        const g = new THREE.Group();
        const core = new THREE.Mesh(
          new THREE.SphereGeometry(radius, 32, 24),
          new THREE.MeshBasicMaterial({ color: PALETTE.sunHex })
        );
        const sprite = new THREE.Sprite(
          new THREE.SpriteMaterial({ map: sharedTextures.sunGlow, color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        sprite.scale.set(radius * 4.6, radius * 4.6, 1);
        g.add(core, sprite);
        return g;
      }

        );
      }

      /* =========================================================
       * 8. 各分頁專屬 Three.js 3D 場景建構與更新器
       * ========================================================= */
      const moduleRoot = new THREE.Group();
      scene.add(moduleRoot);
      let activeMacroUpdater = null;

      function disposeGroup(grp) {
        while (grp.children.length > 0) {
          const ch = grp.children[0];
          grp.remove(ch);
          if (ch.children && ch.children.length) disposeGroup(ch);
          if (ch.geometry) ch.geometry.dispose();
          if (ch.material) {
            if (Array.isArray(ch.material)) ch.material.forEach(m => m.dispose());
            else ch.material.dispose();
          }
        }
      }

      function buildMacroScene(tabIdx) {
        disposeGroup(moduleRoot);
        clearLabels3D();
        const ambient = new THREE.AmbientLight(0xffffff, 0.22);
        moduleRoot.add(ambient);

        switch (tabIdx) {
          /* ---------------- 01 黃白交角與交點 ---------------- */
          case 0: {
            const sunLight = new THREE.PointLight(0xffffff, 1.8, 100);
            moduleRoot.add(sunLight);
            const sun = makeSunMesh(1.55);
            moduleRoot.add(sun);

            // 黃道面圓盤與軌道環
            const eclipticDisc = new THREE.Mesh(
              new THREE.CircleGeometry(8.5, 72),
              new THREE.MeshBasicMaterial({ color: PALETTE.sunHex, transparent: true, opacity: 0.08, side: THREE.DoubleSide, depthWrite: false })
            );
            eclipticDisc.rotation.x = -Math.PI / 2;
            const eclipticRing = makeOrbitRing(8.5, 8.5, PALETTE.sunHex);
            moduleRoot.add(eclipticDisc, eclipticRing);

            // 食季扇形提示區 (X軸兩端 ±17°)
            const seasonMat = new THREE.MeshBasicMaterial({ color: PALETTE.nodeHex, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false });
            const s1 = new THREE.Mesh(new THREE.RingGeometry(2.2, 8.9, 24, 1, -0.3, 0.6), seasonMat);
            const s2 = new THREE.Mesh(new THREE.RingGeometry(2.2, 8.9, 24, 1, Math.PI - 0.3, 0.6), seasonMat);
            s1.rotation.x = -Math.PI / 2;
            s2.rotation.x = -Math.PI / 2;
            moduleRoot.add(s1, s2);

            // 地月系統樞紐
            const earthSystem = new THREE.Group();
            moduleRoot.add(earthSystem);

            const earth = makeEarthMesh(0.95);
            earthSystem.add(earth);

            // 地球背日陰影錐
            const earthShadow = new THREE.Mesh(
              new THREE.ConeGeometry(0.92, 5.2, 24, 1, true),
              new THREE.MeshBasicMaterial({ color: 0x050814, transparent: true, opacity: 0.58, side: THREE.DoubleSide, depthWrite: false })
            );
            earthSystem.add(earthShadow);

            // 白道面群組 (固定空間指向，交點線沿 X 軸)
            const lunarPlaneGrp = new THREE.Group();
            earthSystem.add(lunarPlaneGrp);

            const lunarDisc = new THREE.Mesh(
              new THREE.CircleGeometry(3.2, 48),
              new THREE.MeshBasicMaterial({ color: PALETTE.lunarOrbHex, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false })
            );
            lunarDisc.rotation.x = -Math.PI / 2;
            const lunarRing = makeOrbitRing(3.2, 3.2, PALETTE.lunarOrbHex);
            lunarPlaneGrp.add(lunarDisc, lunarRing);

            // 紅色交點線 (Line of Nodes) 與升降交點球
            const nodeLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-3.8, 0, 0), new THREE.Vector3(3.8, 0, 0)]);
            const nodeLine = new THREE.Line(nodeLineGeo, new THREE.LineBasicMaterial({ color: PALETTE.nodeHex }));
            const nodeSphereGeo = new THREE.SphereGeometry(0.16, 16, 12);
            const nodeMat = new THREE.MeshBasicMaterial({ color: PALETTE.nodeHex });
            const ascNode = new THREE.Mesh(nodeSphereGeo, nodeMat);
            const descNode = new THREE.Mesh(nodeSphereGeo, nodeMat);
            ascNode.position.set(3.2, 0, 0);
            descNode.position.set(-3.2, 0, 0);
            earthSystem.add(nodeLine, ascNode, descNode);

            const moon = makeMoonMesh(0.35);
            lunarPlaneGrp.add(moon);

            // 月球背日影錐
            const moonShadow = new THREE.Mesh(
              new THREE.ConeGeometry(0.34, 3.3, 18, 1, true),
              new THREE.MeshBasicMaterial({ color: 0x020617, transparent: true, opacity: 0.68, side: THREE.DoubleSide, depthWrite: false })
            );
            earthSystem.add(moonShadow);

            const lbSun = addLabel3D('太陽 Sun', PALETTE.sun, 1.9);
            const lbEcl = addLabel3D('黃道面 (Ecliptic)', PALETTE.sun, 0.3);
            const lbEarth = addLabel3D('地球', PALETTE.earth, 1.25);
            const lbLunar = addLabel3D('白道面 (傾角 5°)', PALETTE.lunarOrb, 0.4);
            const lbNodes = addLabel3D('交點線 (Line of Nodes)', PALETTE.node, 0.45);
            const lbSeason = addLabel3D('食季區 (Eclipse Season)', PALETTE.node, 0.25);

            activeMacroUpdater = (p, dt) => {
              if (state.playing && !state.tween) {
                p.moonPhaseDeg = normDeg(p.moonPhaseDeg + dt * 42);
                p.earthDeg = normDeg(p.earthDeg + dt * 3.4);
              }
              const eRad = p.earthDeg * DEG;
              const ex = Math.cos(eRad) * 8.5;
              const ez = Math.sin(eRad) * 8.5;
              earthSystem.position.set(ex, 0, ez);
              earth.rotation.y += dt * 0.9;

              const tiltRad = (p.exaggerateTilt ? 15.0 : 5.14) * DEG;
              lunarPlaneGrp.rotation.set(tiltRad, 0, 0); // 繞 X 軸傾斜 -> 交點線永遠沿 X 軸!

              // 月球世界角度 = 太陽方向(eRad + PI) + 月相角(moonPhaseDeg)
              // 如此一來 moonPhaseDeg = 0 永遠是朔(新月在日地間)，180 永遠是望(滿月在背日側)!
              const mWorldLon = eRad + Math.PI + p.moonPhaseDeg * DEG;
              const mx = Math.cos(mWorldLon) * 3.2;
              const mz = Math.sin(mWorldLon) * 3.2;
              moon.position.set(mx, 0, mz);

              // 背日方向向量
              const awayDir = new THREE.Vector3(ex, 0, ez).normalize();
              const qCone = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, -1, 0), awayDir);
              earthShadow.quaternion.copy(qCone);
              earthShadow.position.copy(awayDir).multiplyScalar(2.6);

              const moonWorld = new THREE.Vector3();
              moon.getWorldPosition(moonWorld);
              const moonLocal = moonWorld.clone().sub(earthSystem.position);
              moonShadow.quaternion.copy(qCone);
              moonShadow.position.copy(moonLocal).addScaledVector(awayDir, 1.65);

              lbSun.worldPos.set(0, 0, 0);
              lbEcl.worldPos.set(0, 0, 8.5);
              lbEarth.worldPos.copy(earthSystem.position);
              lbLunar.textContent = p.exaggerateTilt ? '白道面 (教學放大15°)' : '白道面 (真實5.1°)';
              lbLunar.el.textContent = lbLunar.textContent;
              lbLunar.worldPos.set(ex, Math.sin(tiltRad) * 3.2, ez + 3.0);
              lbNodes.worldPos.set(ex + 3.4, 0, ez);
              lbSeason.worldPos.set(6.4, 0, 0.8);
            };
            break;
          }

          /* ---------------- 02 日食本影與半影地表投影 ---------------- */
          case 1: {
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
            dirLight.position.set(0, 0, 30);
            moduleRoot.add(dirLight);

            // 遠處太陽光束方向示意
            const sunIndicator = makeSunMesh(1.1);
            sunIndicator.position.set(0, 0, 15.5);
            moduleRoot.add(sunIndicator);

            const earth = makeEarthMesh(3.2);
            earth.rotation.y = -2.1; // 面向東亞與太平洋
            moduleRoot.add(earth);

            const moon = makeMoonMesh(0.82);
            moduleRoot.add(moon);

            // 本影錐 (Umbra) 與 半影錐 (Penumbra)
            const umbraMat = new THREE.MeshBasicMaterial({ color: 0x02040A, transparent: true, opacity: 0.78, side: THREE.DoubleSide, depthWrite: false });
            const penumbraMat = new THREE.MeshBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.26, side: THREE.DoubleSide, depthWrite: false });
            const umbraCone = new THREE.Mesh(new THREE.ConeGeometry(0.82, 6.2, 32, 1, true), umbraMat);
            const penumbraCone = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 2.25, 6.2, 32, 1, true), penumbraMat);
            moduleRoot.add(umbraCone, penumbraCone);

            // 地表本影黑點與半影環
            const umbraSpot = new THREE.Mesh(
              new THREE.CircleGeometry(0.22, 24),
              new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })
            );
            const penumbraSpot = new THREE.Mesh(
              new THREE.CircleGeometry(1.55, 36),
              new THREE.MeshBasicMaterial({ color: 0x0F172A, transparent: true, opacity: 0.48, side: THREE.DoubleSide, depthWrite: false })
            );
            const antumbraRing = new THREE.Mesh(
              new THREE.RingGeometry(0.18, 0.28, 24),
              new THREE.MeshBasicMaterial({ color: PALETTE.sunHex, side: THREE.DoubleSide })
            );
            moduleRoot.add(penumbraSpot, umbraSpot, antumbraRing);

            // 地表狹長全食帶軌跡線
            const trackPts = [];
            for (let i = 0; i <= 60; i++) trackPts.push(new THREE.Vector3());
            const trackGeo = new THREE.BufferGeometry().setFromPoints(trackPts);
            const trackLine = new THREE.Line(trackGeo, new THREE.LineBasicMaterial({ color: PALETTE.nodeHex }));
            moduleRoot.add(trackLine);

            // 觀測者定位針
            const obsPin = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.landHex }));
            moduleRoot.add(obsPin);

            const lbMoon = addLabel3D('月球 Moon', PALETTE.moon, 1.0);
            const lbUmbra = addLabel3D('本影錐 (Umbra)', PALETTE.node, 0.4);
            const lbPen = addLabel3D('半影區 (Penumbra)', PALETTE.lunarOrb, 1.5);
            const lbTrack = addLabel3D('地表狹長全食帶', PALETTE.sun, 0.35);
            const lbObs = addLabel3D('地表觀測者', PALETTE.land, 0.32);

            function shadowHitEarth(prog) {
              const x = prog * 2.55;
              const y = 0.55 + prog * 0.42;
              const r2 = 3.2 * 3.2 - x * x - y * y;
              if (r2 <= 0.05) return null;
              return new THREE.Vector3(x, y, Math.sqrt(r2));
            }

            // 預先繪製完整全食帶弧線
            const fullTrack = [];
            for (let i = 0; i <= 60; i++) {
              const t = -0.92 + (i / 60) * 1.84;
              const pt = shadowHitEarth(t);
              if (pt) fullTrack.push(pt.multiplyScalar(1.012));
            }
            trackLine.geometry.setFromPoints(fullTrack);

            activeMacroUpdater = (p, dt) => {
              if (state.playing && !state.tween) {
                p.eclipseProg += dt * 0.22;
                if (p.eclipseProg > 1) p.eclipseProg = -1;
              }
              const isAnnular = p.moonDistMode === 1;
              const moonZ = isAnnular ? 9.9 : 8.5;
              const mx = p.eclipseProg * 2.55;
              const my = 0.55 + p.eclipseProg * 0.42;
              moon.position.set(mx, my, moonZ);
              earth.rotation.y = -2.1 + p.eclipseProg * 0.25;

              const coneLen = isAnnular ? 5.6 : 6.2;
              umbraCone.scale.set(1, coneLen / 6.2, 1);
              umbraCone.rotation.x = -Math.PI / 2;
              umbraCone.position.set(mx, my, moonZ - coneLen * 0.5);

              const penLen = moonZ - 2.6;
              penumbraCone.scale.set(1, penLen / 6.2, 1);
              penumbraCone.rotation.x = Math.PI / 2;
              penumbraCone.position.set(mx, my, moonZ - penLen * 0.5);

              const hit = shadowHitEarth(p.eclipseProg);
              if (hit) {
                const norm = hit.clone().normalize();
                const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), norm);
                umbraSpot.visible = !isAnnular;
                antumbraRing.visible = isAnnular;
                penumbraSpot.visible = true;
                umbraSpot.position.copy(hit).multiplyScalar(1.015);
                umbraSpot.quaternion.copy(q);
                antumbraRing.position.copy(hit).multiplyScalar(1.016);
                antumbraRing.quaternion.copy(q);
                penumbraSpot.position.copy(hit).multiplyScalar(1.008);
                penumbraSpot.quaternion.copy(q);
                lbTrack.visible = true;
                lbTrack.worldPos.copy(hit).multiplyScalar(1.04);
              } else {
                umbraSpot.visible = false;
                antumbraRing.visible = false;
                penumbraSpot.visible = false;
                lbTrack.visible = false;
              }

              // 觀測者位置 (位於 prog=0 附近，可南北偏移)
              const obsY = 0.55 + (p.obsOffsetKm / 2500) * 1.45;
              const obsZ = Math.sqrt(Math.max(0.2, 3.2 * 3.2 - obsY * obsY));
              obsPin.position.set(0, obsY, obsZ * 1.02);

              lbMoon.worldPos.copy(moon.position);
              lbUmbra.el.textContent = isAnnular ? '本影錐頂點未觸地(偽本影)' : '本影錐 (Umbra 全食錐)';
              lbUmbra.worldPos.set(mx, my, moonZ - 3.1);
              lbPen.worldPos.set(mx + 1.3, my + 0.8, moonZ - 3.6);
              lbObs.worldPos.copy(obsPin.position);
            };
            break;
          }

          /* ---------------- 03 地球大氣散射與月食紅月亮 ---------------- */
          case 2: {
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
            sunLight.position.set(-20, 0, 0);
            moduleRoot.add(sunLight);

            const sun = makeSunMesh(1.5);
            sun.position.set(-12.5, 0, 0);
            moduleRoot.add(sun);

            const earth = makeEarthMesh(2.0);
            earth.position.set(-2.5, 0, 0);
            moduleRoot.add(earth);

            // 地球藍色瑞利散射大氣光暈環
            const atmSprite = new THREE.Sprite(
              new THREE.SpriteMaterial({ map: sharedTextures.blueAtm, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            atmSprite.scale.set(5.4, 5.4, 1);
            atmSprite.position.copy(earth.position);
            moduleRoot.add(atmSprite);

            // 地球暗本影錐 + 大氣折射紅光錐
            const redConeMat = new THREE.MeshBasicMaterial({ color: 0xDC2626, transparent: true, opacity: 0.28, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
            const redCone = new THREE.Mesh(new THREE.ConeGeometry(2.02, 13.5, 36, 1, true), redConeMat);
            redCone.rotation.z = Math.PI / 2;
            redCone.position.set(4.25, 0, 0);
            moduleRoot.add(redCone);

            // 太陽光線段 -> 大氣邊緣 -> 藍光向外散射 + 紅光向內折射
            const rayGroup = new THREE.Group();
            [-1, 1].forEach(sign => {
              const yEdge = sign * 2.02;
              // 入射白光
              const wGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-11.2, yEdge, 0), new THREE.Vector3(-2.5, yEdge, 0)]);
              rayGroup.add(new THREE.Line(wGeo, new THREE.LineBasicMaterial({ color: 0xFEF08A })));
              // 散射藍光短線
              for (let k = 0; k < 3; k++) {
                const ang = sign * (0.45 + k * 0.38);
                const bGeo = new THREE.BufferGeometry().setFromPoints([
                  new THREE.Vector3(-2.5, yEdge, 0),
                  new THREE.Vector3(-2.5 + Math.cos(ang) * 2.3, yEdge + Math.sin(ang) * 2.3, (k - 1) * 0.7)
                ]);
                rayGroup.add(new THREE.Line(bGeo, new THREE.LineBasicMaterial({ color: 0x38BDF8 })));
              }
              // 折射紅光匯聚至月球軌道
              const rGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-2.5, yEdge, 0),
                new THREE.Vector3(7.5, -sign * 0.35, 0)
              ]);
              rayGroup.add(new THREE.Line(rGeo, new THREE.LineBasicMaterial({ color: 0xF43F5E })));
            });
            moduleRoot.add(rayGroup);

            const moonMat = new THREE.MeshBasicMaterial({ map: sharedTextures.moon, color: 0xffffff });
            const moon = new THREE.Mesh(new THREE.SphereGeometry(0.68, 28, 20), moonMat);
            moduleRoot.add(moon);

            const lbSun = addLabel3D('太陽白光入射', PALETTE.sun, 1.8);
            const lbBlue = addLabel3D('短波藍光：瑞利散射濾除', PALETTE.earth, 0.5);
            const lbRed = addLabel3D('長波紅光：大氣折射入本影', PALETTE.node, 0.35);
            const lbMoon = addLabel3D('月全食「紅月亮」', PALETTE.node, 0.95);

            activeMacroUpdater = (p, dt) => {
              if (state.playing && !state.tween) {
                p.lunarProg += dt * 0.16;
                if (p.lunarProg > 1) p.lunarProg = -1;
              }
              earth.rotation.y += dt * 0.4;
              const mz = p.lunarProg * 3.8;
              moon.position.set(6.2, 0.15 * p.lunarProg, mz);

              // 根據與本影中心距離 + 大氣塵埃濃度計算月面血紅色澤
              const distFromAxis = Math.hypot(moon.position.y, moon.position.z);
              const inUmbra = clamp(1 - (distFromAxis - 0.85) / 1.1, 0, 1);
              const dustFactor = 1 - p.dustLevel * 0.68;
              const r = lerp(0.95, 0.88 * dustFactor, inUmbra);
              const g = lerp(0.95, 0.22 * dustFactor, inUmbra);
              const b = lerp(0.95, 0.12 * dustFactor, inUmbra);
              moonMat.color.setRGB(r, g, b);
              redConeMat.opacity = 0.14 + 0.22 * dustFactor;

              lbSun.worldPos.copy(sun.position);
              lbBlue.worldPos.set(-1.6, 3.1, 0);
              lbRed.worldPos.set(2.5, 1.15, 0);
              lbMoon.el.textContent = inUmbra > 0.65 ? '月全食「紅月亮 (Blood Moon)」' : '月球穿過地影';
              lbMoon.worldPos.copy(moon.position);
            };
            break;
          }

          /* ---------------- 04 日地月引力與潮汐現象 ---------------- */
          case 3: {
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
            sunLight.position.set(20, 2, 0);
            moduleRoot.add(sunLight);

            // 右側太陽方向指示
            const sun = makeSunMesh(1.35);
            sun.position.set(12.2, 0, 0);
            moduleRoot.add(sun);

            const earth = makeEarthMesh(1.85);
            moduleRoot.add(earth);

            // 海岸觀測站標記點 (隨地球自轉)
            const stationPin = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.landHex }));
            moduleRoot.add(stationPin);

            // 可即時四極變形的 3D 海洋潮汐橢球殼
            const waterGeo = new THREE.SphereGeometry(2.05, 48, 32);
            const basePos = Float32Array.from(waterGeo.attributes.position.array);
            const waterMat = new THREE.MeshPhongMaterial({
              color: PALETTE.tideHex,
              emissive: 0x083344,
              transparent: true,
              opacity: 0.46,
              shininess: 90
            });
            const waterShell = new THREE.Mesh(waterGeo, waterMat);
            moduleRoot.add(waterShell);

            const moonRing = makeOrbitRing(7.2, 7.2, PALETTE.lunarOrbHex, true);
            moduleRoot.add(moonRing);
            const moon = makeMoonMesh(0.6);
            moduleRoot.add(moon);

            // 赤道周圍 12 支引潮力差動向量箭頭
            const arrows = [];
            for (let i = 0; i < 12; i++) {
              const arr = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, PALETTE.lunarOrbHex, 0.28, 0.18);
              moduleRoot.add(arr);
              arrows.push(arr);
            }

            const lbSun = addLabel3D('太陽引力方向', PALETTE.sun, 1.6);
            const lbMoon = addLabel3D('月球 (主導引潮力)', PALETTE.lunarOrb, 0.85);
            const lbTide = addLabel3D('大潮雙隆起', PALETTE.tide, 2.55);
            const lbStation = addLabel3D('海岸潮位觀測站', PALETTE.land, 0.35);

            activeMacroUpdater = (p, dt) => {
              if (state.playing && !state.tween) {
                p.earthHour = (p.earthHour + dt * 2.6) % 24;
                p.moonSynodic = normDeg(p.moonSynodic + dt * 3.2);
              }
              // 太陽固定在 +X 方向 (角=0)，月球角度 = moonSynodic (0°朔在+X，180°望在-X)
              const mRad = p.moonSynodic * DEG;
              const mDir = new THREE.Vector3(Math.cos(mRad), 0, Math.sin(mRad));
              const sDir = new THREE.Vector3(1, 0, 0);
              moon.position.copy(mDir).multiplyScalar(7.2);

              // 地球自轉與觀測站位置
              const rotRad = (p.earthHour / 24) * TAU;
              earth.rotation.y = rotRad;
              stationPin.position.set(Math.cos(rotRad) * 1.92, 0.15, -Math.sin(rotRad) * 1.92);

              // 即時變形 3D 海水殼 (勒壤得多項式 P2(cosψ) = 0.5*(3cos²ψ - 1))
              const posAttr = waterGeo.attributes.position;
              const v = new THREE.Vector3();
              for (let i = 0; i < posAttr.count; i++) {
                v.set(basePos[i * 3], basePos[i * 3 + 1], basePos[i * 3 + 2]);
                const n = v.clone().normalize();
                const cosM = n.dot(mDir);
                const cosS = n.dot(sDir);
                const tideM = 0.5 * (3 * cosM * cosM - 1) * 0.52;
                const tideS = 0.5 * (3 * cosS * cosS - 1) * 0.24; // 太陽引潮力約月球 46%
                const rScale = 1 + (tideM + tideS) * 0.42;
                posAttr.setXYZ(i, basePos[i * 3] * rScale, basePos[i * 3 + 1] * rScale, basePos[i * 3 + 2] * rScale);
              }
              posAttr.needsUpdate = true;
              waterGeo.computeVertexNormals();

              // 更新差動引潮力向量箭頭
              arrows.forEach((arr, i) => {
                arr.visible = p.showVectors === 1;
                if (!arr.visible) return;
                const a = (i / 12) * TAU;
                const u = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
                // 潮汐力向量 F_tidal ∝ 3(u·d)d - u
                const fM = mDir.clone().multiplyScalar(3 * u.dot(mDir)).sub(u).multiplyScalar(0.45);
                const fS = sDir.clone().multiplyScalar(3 * u.dot(sDir)).sub(u).multiplyScalar(0.21);
                const fTot = fM.add(fS);
                const len = clamp(fTot.length(), 0.2, 1.55);

            SKY_STARS.forEach(st => {
              if (Math.abs(st.lat) > 12) return;
              starPos.push(Math.cos(st.lon * DEG) * RING_R, Math.tan(st.lat * DEG) * RING_R, -Math.sin(st.lon * DEG) * RING_R);
            });
            const starGeo = new THREE.BufferGeometry();
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            moduleRoot.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xE2E8F0, size: 0.22, transparent: true, opacity: 0.85 })));
            // 投影區附近的星座名稱
            ZODIAC.filter(z => Math.abs(wrap180(z.lon - 90)) < 50).forEach(z => {
              const lb = addLabel3D(z.name, '#94A3B8', -1.4);
              lb.worldPos.set(Math.cos(z.lon * DEG) * RING_R, 0, -Math.sin(z.lon * DEG) * RING_R);
            });

            // 視線投影線 (地球 -> 行星 -> 天球幕投影點)
            const sightGeo = new THREE.BufferGeometry();
            const sightLine = new THREE.Line(sightGeo, new THREE.LineDashedMaterial({ color: PALETTE.venusHex, dashSize: 0.35, gapSize: 0.2 }));
            const projDot = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.venusHex }));
            moduleRoot.add(sightLine, projDot);

            // 天球幕上的視運動軌跡線 (綠=順行 / 紅=逆行)
            const skyTrailGeo = new THREE.BufferGeometry();
            const skyTrailLine = new THREE.Line(skyTrailGeo, new THREE.LineBasicMaterial({ vertexColors: true }));
            moduleRoot.add(skyTrailLine);

            const lbSun = addLabel3D('太陽', PALETTE.sun, 1.6);
            const lbEarth = addLabel3D('地球觀測者', PALETTE.earth, 0.9);
            const lbPlanet = addLabel3D('金星 Venus', PALETTE.venus, 0.85);
            const lbProj = addLabel3D('投影在背景恆星上的位置', PALETTE.node, 0.7);

            const toWorld = (v, s) => new THREE.Vector3(v[0] * s, v[2] * s * Y_EXAG, -v[1] * s);
            const scaleOf = (mode) => mode === 0 ? 6.2 : 4.6;
            function inclinedRing(mode, colorHex) {
              const c = RETRO_CFG[mode];
              const s = scaleOf(mode);
              const node = (c.eLon - 65) * DEG;
              const pts = [];
              for (let i = 0; i <= 128; i++) {
                const L = (i / 128) * TAU;
                pts.push(toWorld([c.a * Math.cos(L), c.a * Math.sin(L), c.a * Math.sin(c.inc * DEG) * Math.sin(L - node)], s));
              }
              return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.85 }));
            }
            function projectToRing(ePos, pPos) {
              const dir = new THREE.Vector3().subVectors(pPos, ePos).normalize();
              const A = dir.x * dir.x + dir.z * dir.z;
              const B = 2 * (ePos.x * dir.x + ePos.z * dir.z);
              const C = ePos.x * ePos.x + ePos.z * ePos.z - RING_R * RING_R;
              const sHit = (-B + Math.sqrt(Math.max(0, B * B - 4 * A * C))) / (2 * A);
              return ePos.clone().addScaledVector(dir, sHit);
            }

            let lastMode = -1;
            const colGreen = new THREE.Color(PALETTE.landHex), colRed = new THREE.Color(PALETTE.nodeHex);
            activeMacroUpdater = (p, dt) => {
              if (state.playing && !state.tween) {
                // 逆行附近放慢速度，方便觀察「留 → 逆行 → 留」
                const nearConj = Math.abs(p.synodicProg - 0.5) < 0.09;
                p.synodicProg += dt * (nearConj ? 0.018 : 0.05);
                if (p.synodicProg > 1) p.synodicProg = 0;
              }
              const mode = p.planetMode;
              const s = scaleOf(mode);
              if (mode !== lastMode) {
                lastMode = mode;
                disposeGroup(targetRingGrp);
                disposeGroup(earthRingGrp);
                earthRingGrp.add(makeOrbitRing(s, s, PALETTE.earthHex));
                const col = mode === 0 ? PALETTE.venusHex : 0xFB7185;
                targetRingGrp.add(inclinedRing(mode, col));
                targetPlanet.material.color.setHex(col);
                sightLine.material.color.setHex(col);
                projDot.material.color.setHex(col);
                lbPlanet.el.textContent = mode === 0 ? '內行星：金星 Venus' : '外行星：火星 Mars';
              }

              const st = retroState(p.synodicProg, mode);
              const ePos = toWorld(st.E, s);
              const pPos = toWorld(st.P, s);
              earth.position.copy(ePos);
              targetPlanet.position.copy(pPos);

              const hit = projectToRing(ePos, pPos);
              projDot.position.copy(hit);
              sightGeo.setFromPoints([ePos, hit]);
              sightLine.computeLineDistances();

              // 天球環上的視軌跡 (從逆行前 0.25 週期到目前進度)
              const tPts = [], cols = [];
              const q0 = 0.25;
              if (p.synodicProg > q0) {
                let prevLon = null;
                for (let q = q0; q <= Math.min(p.synodicProg, 0.75); q += 0.003) {
                  const s2 = retroState(q, mode);
                  const h = projectToRing(toWorld(s2.E, s), toWorld(s2.P, s));
                  tPts.push(h);
                  const retro = prevLon !== null && wrap180(s2.lon - prevLon) < 0;
                  const c = retro ? colRed : colGreen;
                  cols.push(c.r, c.g, c.b);
                  prevLon = s2.lon;
                }
              }
              skyTrailGeo.setFromPoints(tPts);
              skyTrailGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));

              lbSun.worldPos.set(0, 0, 0);
              lbEarth.worldPos.copy(ePos);
              lbPlanet.worldPos.copy(pPos);
              lbProj.worldPos.copy(hit);
            };
            break;
          }

          /* ---------------- 11 二分二至與四季 ---------------- */
          case 10: {
            const sunLight = new THREE.PointLight(0xffffff, 2.2, 140);
            moduleRoot.add(sunLight);
            const sun = makeSunMesh(1.5);
            moduleRoot.add(sun);
            const ORB_R = 9.5;
            const EPS = 23.44 * DEG;
            moduleRoot.add(makeOrbitRing(ORB_R, ORB_R, PALETTE.sunHex, true));

            // 由太陽黃經求地球位置：地球日心黃經 = 太陽地心黃經 + 180°
            const earthPosOf = (lonDeg) => {
              const L = (lonDeg + 180) * DEG;
              return new THREE.Vector3(Math.cos(L) * ORB_R, 0, -Math.sin(L) * ORB_R);
            };

            // 地球 (地軸向黃經 90° 方向傾斜 23.44°，方向固定指向北極星)
            const tiltGroup = new THREE.Group();
            tiltGroup.rotation.x = -EPS;
            moduleRoot.add(tiltGroup);
            const earthR = 1.25;
            const earth = makeEarthMesh(earthR);
            tiltGroup.add(earth);
            const axisLine = new THREE.Line(
              new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -2.3, 0), new THREE.Vector3(0, 2.6, 0)]),
              new THREE.LineBasicMaterial({ color: PALETTE.lunarOrbHex })
            );
            tiltGroup.add(axisLine);
            // 緯線：赤道、南北回歸線、南北極圈
            const latCircle = (latDeg, colorHex, dashed) => {
              const r = Math.cos(latDeg * DEG) * (earthR + 0.02);
              const ring = makeOrbitRing(r, r, colorHex, dashed, 72);
              ring.position.y = Math.sin(latDeg * DEG) * (earthR + 0.02);
              return ring;
            };
            tiltGroup.add(latCircle(0, 0xF8FAFC, false));
            tiltGroup.add(latCircle(23.44, PALETTE.sunHex, true));
            tiltGroup.add(latCircle(-23.44, PALETTE.sunHex, true));
            tiltGroup.add(latCircle(66.56, PALETTE.lunarOrbHex, true));
            tiltGroup.add(latCircle(-66.56, PALETTE.lunarOrbHex, true));
            // 觀測地緯線 (綠)
            const obsRingGeo = new THREE.BufferGeometry();
            const obsRing = new THREE.Line(obsRingGeo, new THREE.LineBasicMaterial({ color: PALETTE.landHex }));
            tiltGroup.add(obsRing);

            // 太陽直射點與陽光指示線
            const subsolar = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), new THREE.MeshBasicMaterial({ color: PALETTE.nodeHex }));
            moduleRoot.add(subsolar);
            const rayGeo = new THREE.BufferGeometry();
            moduleRoot.add(new THREE.Line(rayGeo, new THREE.LineBasicMaterial({ color: PALETTE.sunHex, transparent: true, opacity: 0.55 })));

            // 四個節氣位置的地球殘影 (含固定方向的地軸)
            SEASON_KEYS.forEach(k => {
              const pos = earthPosOf(k.lon);
              const g = new THREE.Group();
              g.position.copy(pos);
              g.rotation.x = -EPS;
              const ghost = new THREE.Mesh(
                new THREE.SphereGeometry(0.6, 20, 14),
                new THREE.MeshBasicMaterial({ color: PALETTE.earthHex, wireframe: true, transparent: true, opacity: 0.28 })
              );
              const ax = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -1.1, 0), new THREE.Vector3(0, 1.3, 0)]),
                new THREE.LineBasicMaterial({ color: PALETTE.lunarOrbHex, transparent: true, opacity: 0.55 })
              );
              g.add(ghost, ax);
              moduleRoot.add(g);
              const lb = addLabel3D(`${k.name} ${k.date}`, k.lon === 90 ? '#FB923C' : k.lon === 270 ? '#60A5FA' : '#F8FAFC', -1.25);
              lb.worldPos.copy(pos);
            });

            const lbSun = addLabel3D('太陽', PALETTE.sun, 1.9);
            const lbAxis = addLabel3D('地軸永遠指向北極星 ↑', PALETTE.lunarOrb, 0.25);
            const lbEarth = addLabel3D('地球', PALETTE.earth, 1.7);
            const lbSub = addLabel3D('太陽直射點', PALETTE.node, 0.3);

            activeMacroUpdater = (p, dt) => {
              if (state.playing && !state.tween) {
                p.dayOfYear += dt * 22;
                if (p.dayOfYear > 365) p.dayOfYear -= 365;
              }
              const lam = dayToSolarLon(p.dayOfYear);
              const ePos = earthPosOf(lam);
              tiltGroup.position.copy(ePos);
              earth.rotation.y += dt * 1.6;

              // 觀測地緯線
              const lr = Math.cos(p.lat * DEG) * (earthR + 0.03);
              const ly = Math.sin(p.lat * DEG) * (earthR + 0.03);
              const pts = [];
              for (let i = 0; i <= 72; i++) {
                const a = (i / 72) * TAU;
                pts.push(new THREE.Vector3(Math.cos(a) * lr, ly, Math.sin(a) * lr));
              }
              obsRingGeo.setFromPoints(pts);

              // 直射點：地心指向太陽方向與地表交點
              const toSun = ePos.clone().negate().normalize();
              subsolar.position.copy(ePos).addScaledVector(toSun, earthR + 0.05);
              rayGeo.setFromPoints([new THREE.Vector3(0, 0, 0), subsolar.position.clone()]);

              lbSun.worldPos.set(0, 0, 0);
              lbEarth.worldPos.copy(ePos);
              const axisTop = new THREE.Vector3(0, 2.6, 0).applyEuler(tiltGroup.rotation).add(ePos);
              lbAxis.worldPos.copy(axisTop);
              lbSub.worldPos.copy(subsolar.position);
              const dec = solarDecl(lam) * RAD;
              lbSub.el.textContent = `直射 ${Math.abs(dec).toFixed(1)}°${dec >= 0 ? 'N' : 'S'}`;
            };
            break;
          }

          /* ---------------- 12 行星：天空中的漫遊者 ---------------- */
          case 11: {
            const sunLight = new THREE.PointLight(0xffffff, 2.2, 200);
            moduleRoot.add(sunLight);
            const sun = makeSunMesh(0.85);
            moduleRoot.add(sun);
            const K = 2.0;       // 1 AU = 2 單位 (線性比例，方向完全正確)
            const RING_R = 24;   // 黃道星座環
            const toWorld = (v) => new THREE.Vector3(v[0] * K, v[2] * K, -v[1] * K);

            // 黃道星座環與背景恆星
            const ringPts = [];
            for (let i = 0; i <= 240; i++) {
              const a = (i / 240) * TAU;
              ringPts.push(new THREE.Vector3(Math.cos(a) * RING_R, 0, -Math.sin(a) * RING_R));
            }
            moduleRoot.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ringPts), new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: 0.7 })));
            const starPos = [];
            SKY_STARS.forEach(st => {
              starPos.push(Math.cos(st.lon * DEG) * RING_R, Math.tan(st.lat * DEG) * RING_R, -Math.sin(st.lon * DEG) * RING_R);
            });
            const starGeo = new THREE.BufferGeometry();
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            moduleRoot.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xE2E8F0, size: 0.28, transparent: true, opacity: 0.85 })));
            ZODIAC.forEach(z => {
              const lb = addLabel3D(z.name, '#94A3B8', 0);
              lb.worldPos.set(Math.cos(z.lon * DEG) * (RING_R + 1.6), 0, -Math.sin(z.lon * DEG) * (RING_R + 1.6));
            });

            // 行星與軌道
            const bodies = {};
            ['earth', ...PLANET_KEYS].forEach(key => {
              const pl = PLANETS[key];
              moduleRoot.add(makeOrbitRing(pl.a * K, pl.a * K, pl.hex, key !== 'earth', 160));
              const mesh = key === 'earth' ? makeEarthMesh(pl.size) : new THREE.Mesh(
                new THREE.SphereGeometry(pl.size, 24, 16),
                new THREE.MeshStandardMaterial({ color: pl.hex, roughness: 0.6 })
              );
              if (key === 'saturn') {
                const ring = new THREE.Mesh(
                  new THREE.RingGeometry(pl.size * 1.35, pl.size * 2.1, 40),
                  new THREE.MeshBasicMaterial({ color: 0xE7D7A3, side: THREE.DoubleSide, transparent: true, opacity: 0.7 })
                );
                ring.rotation.x = -Math.PI / 2 + 0.45;
                mesh.add(ring);
              }
              moduleRoot.add(mesh);
              const lb = addLabel3D(pl.name, pl.color, pl.size + 0.55);
              let line = null, dot = null;
              if (key !== 'earth') {
                line = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: pl.hex, transparent: true, opacity: 0.4 }));
                dot = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10), new THREE.MeshBasicMaterial({ color: pl.hex }));
                moduleRoot.add(line, dot);
              }
              bodies[key] = { mesh, lb, line, dot };
            });

            // 追蹤行星在星座環上的足跡 (綠=順行 / 紅=逆行)
            const trailGeo = new THREE.BufferGeometry();
            const trailPts = new THREE.Points(trailGeo, new THREE.PointsMaterial({ size: 0.42, vertexColors: true }));
            moduleRoot.add(trailPts);
            const colGreen = new THREE.Color(PALETTE.landHex), colRed = new THREE.Color(PALETTE.nodeHex);
            const ringPoint = (lonDeg, latDeg, r) => new THREE.Vector3(Math.cos(lonDeg * DEG) * r, Math.tan(latDeg * DEG) * r, -Math.sin(lonDeg * DEG) * r);

            activeMacroUpdater = (p, dt) => {
              if (state.playing && !state.tween) {
                p.days += dt * (p.target >= 2 ? 40 : 12);
                if (p.days > 2920) p.days = 0;
              }
              const ePos = toWorld(planetHelio('earth', p.days));
              bodies.earth.mesh.position.copy(ePos);
              bodies.earth.lb.worldPos.copy(ePos);
              const targetKey = PLANET_KEYS[p.target];
              PLANET_KEYS.forEach(key => {
                const b = bodies[key];
                const g = planetGeo(key, p.days);
                const pPos = toWorld(g.P);
                b.mesh.position.copy(pPos);
                b.lb.worldPos.copy(pPos);
                const hit = ringPoint(g.lon, g.lat, RING_R - 0.4);
                b.dot.position.copy(hit);
                b.line.geometry.setFromPoints([ePos, hit]);
                const isT = key === targetKey;
                b.line.material.opacity = isT ? 0.95 : 0.22;
                b.dot.scale.setScalar(isT ? 1.3 : 0.8);
              });

              const tp = [], tc = [];
              const span = Math.min(p.trailDays, p.days);
              const stepD = Math.max(4, Math.round(span / 120));
              let prevLon = null;
              for (let d = p.days - span; d <= p.days; d += stepD) {
                const g = planetGeo(targetKey, d);
                tp.push(ringPoint(g.lon, g.lat, RING_R - 0.4));
                const retro = prevLon !== null && wrap180(g.lon - prevLon) < 0;
                const c = retro ? colRed : colGreen;
                tc.push(c.r, c.g, c.b);
                prevLon = g.lon;
              }
              trailGeo.setFromPoints(tp);
              trailGeo.setAttribute('color', new THREE.Float32BufferAttribute(tc, 3));
            };
            break;
          }

          /* ---------------- 13 地球自轉、歲差進動與米蘭科維奇循環 ---------------- */
          case 12: {
            const sunLight = new THREE.PointLight(0xffffff, 2.0, 140);
            sunLight.position.set(-8.5, 0, 0);
            moduleRoot.add(sunLight);

            // 左側：太陽與可變離心率地球公轉橢圓軌道縮圖 (展現米蘭科維奇離心率 e 與近日點歲差)
            const sun = makeSunMesh(1.15);
            sun.position.set(-8.5, 0, 0);
            moduleRoot.add(sun);

            const helioOrbitGeo = new THREE.BufferGeometry();
            const helioOrbitLine = new THREE.Line(helioOrbitGeo, new THREE.LineDashedMaterial({ color: PALETTE.sunHex, dashSize: 0.35, gapSize: 0.2 }));
            moduleRoot.add(helioOrbitLine);

            // 右側主視覺：放大地球、黃道北極軸、歲差圓錐、進動地軸與歷代北極星環
            const earthCenter = new THREE.Vector3(2.2, 0, 0);
            const sysGroup = new THREE.Group();
            sysGroup.position.copy(earthCenter);
            moduleRoot.add(sysGroup);

            // 黃道面基準圓環與黃道北極垂直虛線
            sysGroup.add(makeOrbitRing(4.2, 4.2, PALETTE.sunHex, true));
            const eclPoleLine = new THREE.Line(
              new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -4.2, 0), new THREE.Vector3(0, 7.2, 0)]),
              new THREE.LineDashedMaterial({ color: PALETTE.sunHex, dashSize: 0.25, gapSize: 0.2 })
            );
            eclPoleLine.computeLineDistances();
            sysGroup.add(eclPoleLine);

            // 歲差圓錐 (Precession Cone) 與頂部 26,000 年北天極軌跡環
            const coneGeo = new THREE.BufferGeometry();
            const coneMat = new THREE.MeshBasicMaterial({ color: PALETTE.lunarOrbHex, transparent: true, opacity: 0.14, side: THREE.DoubleSide, depthWrite: false });
            const precCone = new THREE.Mesh(coneGeo, coneMat);
            sysGroup.add(precCone);

            const precRingGeo = new THREE.BufferGeometry();
            const precRing = new THREE.Line(precRingGeo, new THREE.LineBasicMaterial({ color: PALETTE.lunarOrbHex }));
            sysGroup.add(precRing);

            // 歲差環上的四顆代表性北極星標記點 (勾陳一、天鉤五、織女星、右樞)
            const poleStarDefs = [
              { name: '勾陳一 Polaris (現代)', ang: 0, col: PALETTE.earthHex, str: PALETTE.earth },
              { name: '天鉤五 Alderamin (+6千年)', ang: 85 * DEG, col: 0x94A3B8, str: '#94A3B8' },
              { name: '織女星 Vega (+1.2萬年)', ang: 170 * DEG, col: PALETTE.venusHex, str: PALETTE.venus },
              { name: '右樞 Thuban (+2.1萬年)', ang: 290 * DEG, col: PALETTE.tideHex, str: PALETTE.tide }
            ];
            const poleStarMeshes = poleStarDefs.map(st => {
              const m = new THREE.Mesh(new THREE.SphereGeometry(0.18, 14, 10), new THREE.MeshBasicMaterial({ color: st.col }));
              sysGroup.add(m);
              const lb = addLabel3D(st.name, st.str, 0.35);
              return { ...st, mesh: m, lb };
            });

            // 進動方向組 -> 傾角組 -> 自轉地球與赤道環
            const precYawGroup = new THREE.Group();
            sysGroup.add(precYawGroup);

            const obliqTiltGroup = new THREE.Group();
            precYawGroup.add(obliqTiltGroup);

            const earth = makeEarthMesh(2.35);
            obliqTiltGroup.add(earth);

            // 赤道隆起環 (Equatorial Bulge - 歲差力矩受力的關鍵)
            const eqRing = makeOrbitRing(2.55, 2.55, PALETTE.earthHex, false);
            obliqTiltGroup.add(eqRing);

            // 地軸與北天極指向箭頭
            const axisArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -3.5, 0), 10.7, PALETTE.nodeHex, 0.55, 0.32);
            obliqTiltGroup.add(axisArrow);

            const lbSun = addLabel3D('太陽 (引力力矩源)', PALETTE.sun, 1.5);
            const lbEclPole = addLabel3D('黃道北極 (歲差圓錐中心)', PALETTE.sun, 0.45);
            const lbAxisTip = addLabel3D('當前北天極指向', PALETTE.node, 0.55);
            const lbBulge = addLabel3D('地球赤道隆起 + 每日自轉', PALETTE.earth, -2.6);

            let spinAngle = 0;
            activeMacroUpdater = (p, dt) => {
              if (state.playing && !state.tween) {
                if (p.timeScale === 1) {
                  spinAngle = (spinAngle + dt * 2.8) % TAU;
                } else {
                  spinAngle = (spinAngle + dt * 5.0) % TAU;
                  p.precKy = (p.precKy + dt * 1.45) % 25.8;
                  // 同步緩慢演示傾角 (41kyr) 與離心率 (100kyr) 的自然耦合波動
                  p.obliqDeg = 23.3 + 1.15 * Math.sin((p.precKy / 41.0) * TAU + 0.3);
                  p.eccVal = 0.028 + 0.024 * Math.sin((p.precKy / 100.0) * TAU + 0.6);
                }
              } else {
                spinAngle = (spinAngle + dt * 1.2) % TAU;
              }

              earth.rotation.y = spinAngle;

              // 1. 更新地軸傾角 (Obliquity: 22.1°~24.5°，視覺放大 1.35 倍以利觀察圓錐張角變化)
              const visObliqRad = (p.obliqDeg * 1.35) * DEG;
              const coneH = 6.4;
              const coneR = Math.tan(visObliqRad) * coneH;
              obliqTiltGroup.rotation.z = -visObliqRad;
