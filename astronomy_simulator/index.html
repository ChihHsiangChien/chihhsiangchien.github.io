            // 歷代北極星候選星定位與名稱
            const poleStars = [
              { name: '勾陳一 Polaris', sub: '現代 AD 2026', kyr: 0, rOff: 0, col: PALETTE.earth, sz: 4.5 },
              { name: '天鉤五', sub: '+6千年', kyr: 6.0, rOff: -3, col: '#CBD5E1', sz: 3.4 },
              { name: '天津四 Deneb', sub: '+8千年', kyr: 8.2, rOff: 8, col: '#E2E8F0', sz: 4.0 },
              { name: '織女星 Vega', sub: '+1.2萬年 (0等最亮!)', kyr: 12.0, rOff: 4, col: PALETTE.venus, sz: 5.8 },
              { name: '右樞 Thuban', sub: '+2.1萬年 (古埃及)', kyr: 21.0, rOff: -2, col: PALETTE.tide, sz: 3.8 }
            ];
            poleStars.forEach(st => {
              const a = -Math.PI / 2 - (st.kyr / 25.77) * TAU;
              const sx = cx + Math.cos(a) * (ringR + st.rOff);
              const sy = cy + Math.sin(a) * (ringR + st.rOff);
              const distToPole = Math.hypot(sx - ncpX, sy - ncpY);
              const isCurrentPole = distToPole < 26;
              if (isCurrentPole) {
                const g = ctx.createRadialGradient(sx, sy, 2, sx, sy, 18);
                g.addColorStop(0, 'rgba(253, 224, 71, 0.9)');
                g.addColorStop(1, 'rgba(253, 224, 71, 0)');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(sx, sy, 18, 0, TAU); ctx.fill();
              }
              ctx.fillStyle = st.col;
              ctx.beginPath(); ctx.arc(sx, sy, st.sz, 0, TAU); ctx.fill();
              if (state.showLabels) {
                ctx.font = '700 10.5px -apple-system, "Noto Sans TC", sans-serif';
                ctx.fillStyle = st.col;
                const ly = sy + (Math.sin(a) > 0 ? 15 : -13);
                ctx.fillText(st.name, sx, ly);
              }
            });

            // 當前北天極紅十字準星
            ctx.strokeStyle = PALETTE.node; ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.arc(ncpX, ncpY, 7, 0, TAU); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(ncpX - 12, ncpY); ctx.lineTo(ncpX + 12, ncpY); ctx.moveTo(ncpX, ncpY - 12); ctx.lineTo(ncpX, ncpY + 12); ctx.stroke();

            drawPill2D(ctx, '北天極 25,770 年歲差軌跡 ＆ 24h 周日旋轉星跡', cx, -158, PALETTE.lunarOrb);
            drawPill2D(ctx, `當前北天極 (+${p.precKy.toFixed(1)} 千年) ｜ 圓環半徑 = 傾角 ${p.obliqDeg.toFixed(2)}°`, cx, 156, PALETTE.node);

            // ===== 右半部：米蘭科維奇三大循環與 65°N 夏季日照量 (冰河期驅動器) =====
            ctx.fillStyle = '#070E1E';
            ctx.beginPath(); ctx.roundRect(6, -178, 296, 356, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.stroke();

            // 計算給定參數下的 65°N 夏至日照量 Q (W/m², 現代約 480 W/m²)
            // 物理關係：1. 傾角越大，極區夏季日照越強 (+1.4%/度)；2. 歲差決定夏至在近日點或遠日點，日照 ∝ 1/(1 + e·cos(prec))²
            const calcInsol65N = (kyr, obliq, ecc) => {
              const precPhase = (kyr / 25.77) * TAU; // kyr=0 時北半球夏至在遠日點 (cos=1, 距離最遠 1+e)；kyr=12.9 時夏至在近日點 (距離最近 1-e)
              const rSummer = (1 - ecc * ecc) / (1 - ecc * Math.cos(precPhase));
              const distFactor = 1 / (rSummer * rSummer);
              const obliqFactor = 1 + 0.032 * (obliq - 23.44);
              return 492 * distFactor * obliqFactor;
            };

            // 上半：過去至未來 10 萬年三曲線合成圖 (-50 kyr ~ +50 kyr)
            const gx0 = 24, gx1 = 286, gyTop = -132, gyBot = 28;
            const gX = (k) => lerp(gx0, gx1, k / 100);

            // 繪製三條週期拆解小曲線與總日照量主曲線
            const rows = [
              { label: '① 離心率 Eccentricity (10萬年)', yMid: -112, amp: 14, col: PALETTE.earth, fn: k => Math.sin((k / 100) * TAU + 0.6) },
              { label: '② 地軸傾角 Obliquity (4.1萬年)', yMid: -64, amp: 14, col: PALETTE.lunarOrb, fn: k => Math.sin((k / 41) * TAU + 0.3) },
              { label: '③ 歲差進動 Precession (2.6萬年)', yMid: -16, amp: 14, col: PALETTE.node, fn: k => -Math.cos((k / 25.77) * TAU) }
            ];
            ctx.font = '600 9.5px -apple-system, "Noto Sans TC", sans-serif';
            rows.forEach(r => {
              ctx.strokeStyle = 'rgba(148,163,184,0.18)'; ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(gx0, r.yMid); ctx.lineTo(gx1, r.yMid); ctx.stroke();
              ctx.strokeStyle = r.col; ctx.lineWidth = 2;
              ctx.beginPath();
              for (let k = 0; k <= 100; k += 1) {
                const x = gX(k), y = r.yMid - r.fn(k) * r.amp;
                k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
              }
              ctx.stroke();
              if (state.showLabels) {
                ctx.fillStyle = r.col; ctx.textAlign = 'left';
                ctx.fillText(r.label, gx0, r.yMid - r.amp - 5);
              }
            });

            // 當前歲差時刻垂直掃描線
            const curScanX = gX(clamp(p.precKy * 2.5, 0, 100));
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.55)'; ctx.setLineDash([3, 3]);
            ctx.beginPath(); ctx.moveTo(curScanX, -130); ctx.lineTo(curScanX, 12); ctx.stroke();
            ctx.setLineDash([]);

            // 下半：即時 65°N 夏季日照通量 W/m² 與冰期/間冰期判讀儀表
            const curQ = calcInsol65N(p.precKy, p.obliqDeg, p.eccVal);
            // Q 範圍約 440 (深冰期) ~ 545 (強間冰期) W/m²
            const qNorm = clamp((curQ - 440) / 105, 0, 1);

            ctx.fillStyle = '#0F172A';
            ctx.beginPath(); ctx.roundRect(22, 32, 264, 96, 10); ctx.fill();

            barGrad.addColorStop(0, '#38BDF8');
            barGrad.addColorStop(0.45, '#10B981');
            barGrad.addColorStop(1, '#F97316');

            ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 6); ctx.fill();

            const ptrX = barX + qNorm * barW;
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath(); ctx.moveTo(ptrX, barY - 4); ctx.lineTo(ptrX - 6, barY - 13); ctx.lineTo(ptrX + 6, barY - 13); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(ptrX, barY); ctx.lineTo(ptrX, barY + barH); ctx.stroke();

            ctx.font = '700 10.5px -apple-system, "Noto Sans TC", sans-serif';
            ctx.fillStyle = '#E2E8F0'; ctx.textAlign = 'center';
            ctx.fillText(`北緯 65° 夏至日照量：${Math.round(curQ)} W/m²`, 154, 50);
            ctx.font = '600 9.5px -apple-system, "Noto Sans TC", sans-serif';
            ctx.fillStyle = '#7DD3FC'; ctx.textAlign = 'left'; ctx.fillText('❄️ 冰河期擴張 (<468)', barX, barY + 32);
            ctx.fillStyle = '#FDBA74'; ctx.textAlign = 'right'; ctx.fillText('🔥 間冰期退冰 (>505)', barX + barW, barY + 32);

            const climateState = curQ < 470
              ? '❄️ 冰期啟動條件：夏涼冬雪不融，大陸冰蓋向南擴張！'
              : curQ > 505
                ? '☀️ 強間冰期條件：北半球夏至恰逢近日點＋大傾角，夏季酷熱融冰！'

            drawPill2D(ctx, '米蘭科維奇三大天文週期 (10萬 / 4.1萬 / 2.6萬年)', 154, -158, PALETTE.sun);
            drawPill2D(ctx, climateState, 154, 156, curQ < 470 ? PALETTE.earth : curQ > 505 ? PALETTE.node : PALETTE.land);
            break;
          }
          /* ---------------- 13 月相變化過程：地面觀測天空拱門與農曆月相盤 ---------------- */
          case 13: {
            const info = getLunarInfo(p.lunarDay);
            const psi = info.psi;
            const psiRad = psi * DEG;
            const illum = 0.5 * (1 - Math.cos(psiRad)); // 照明率 0 ~ 1

            // 計算月出、上中天、月落地方時
            const transitHr = (12 + psi / 15) % 24;
            const riseHr = (transitHr + 18) % 24; // transit - 6h
            const setHr = (transitHr + 6) % 24;
            const fmtHm = h => {
              const mins = Math.round(((h % 24 + 24) % 24) * 60) % 1440;

            // 繪製月相圓盤共用函式 (北半球面向南方：朔→望右西側亮，望→朔左東側亮)
            const drawLunarDisc = (cx, cy, r, showDetail) => {

              ctx.translate(cx, cy);

              ctx.fillStyle = '#162033';
              ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();

              // 計算明暗半圓與晨昏橢圓
              const isWaxing = psi <= 180; // 盈月右半亮，虧月左半亮
              const litCol = '#F8FAFC';

              ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();

                ctx.fillStyle = 'rgba(100, 116, 139, 0.24)';
                [[-0.28, -0.22, 0.24], [0.12, -0.28, 0.19], [0.28, -0.05, 0.21], [-0.18, 0.18, 0.17], [0.15, 0.26, 0.14]].forEach(([mx, my, mr]) => {
                  ctx.beginPath(); ctx.arc(mx * r, my * r, mr * r, 0, TAU); ctx.fill();
                });
              }
              ctx.restore();

              ctx.strokeStyle = 'rgba(226, 232, 240, 0.35)';
              ctx.lineWidth = 1.4;
              ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
              ctx.restore();
            };

            /* --- 左區：地面面向南方天空實景視窗 (東 E -> 南 S -> 西 W) --- */
            const skyX = -286, skyY = -172, skyW = 356, skyH = 278;
            const skyCx = skyX + skyW * 0.5;
            const horizonY = skyY + skyH - 36;
            const arcRx = 148, arcRy = 165;

            // 太陽與月球時角 H (-180° ~ +180°：-90°東升, 0°正南中天, +90°西落)
            const wrap180 = d => ((d + 540) % 360) - 180;
            const sunH = wrap180((p.obsHour - 12) * 15);
            const moonH = wrap180(sunH - psi);

            // 依太陽時角動態渲染白晝、晨昏霞光與夜空色溫
            const sunElev = Math.cos(sunH * DEG); // >0 白晝, 0 晨昏, <0 黑夜
            const dayMix = clamp((sunElev + 0.22) / 0.55, 0, 1);
            const twilight = clamp(1 - Math.abs(sunElev) / 0.28, 0, 1);
            const skyGrad = ctx.createLinearGradient(0, skyY, 0, horizonY);
            const topR = Math.round(lerp(7, 28, dayMix) + twilight * 24);
            const topG = Math.round(lerp(13, 98, dayMix));
            const topB = Math.round(lerp(32, 185, dayMix));
            const botR = Math.round(lerp(15, 96, dayMix) + twilight * 135);
            const botG = Math.round(lerp(25, 168, dayMix) + twilight * 32);
            const botB = Math.round(lerp(52, 230, dayMix) - twilight * 40);
            skyGrad.addColorStop(0, `rgb(${topR},${topG},${topB})`);
            skyGrad.addColorStop(1, `rgb(${botR},${botG},${botB})`);

            ctx.save();
            ctx.beginPath(); ctx.roundRect(skyX, skyY, skyW, skyH, 12); ctx.clip();
            ctx.fillStyle = skyGrad;
            ctx.fillRect(skyX, skyY, skyW, skyH);

            // 夜晚星點
            if (dayMix < 0.55) {
              ctx.fillStyle = `rgba(241, 245, 249, ${(1 - dayMix) * 0.65})`;
              for (let i = 0; i < 22; i++) {
                const sx = skyX + 18 + ((i * 67) % (skyW - 36));
                const sy = skyY + 16 + ((i * 43) % (skyH - 72));
                ctx.beginPath(); ctx.arc(sx, sy, i % 3 === 0 ? 1.6 : 1.0, 0, TAU); ctx.fill();
              }
            }

            // 天球周日運動虛線拱弧
            ctx.strokeStyle = 'rgba(226, 232, 240, 0.22)';
            ctx.lineWidth = 1.3;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.ellipse(skyCx, horizonY, arcRx, arcRy, 0, Math.PI, 0, false);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(skyCx, skyY + 26); ctx.lineTo(skyCx, horizonY);
            ctx.stroke();
            ctx.setLineDash([]);

            // 繪製太陽在天空中的即時位置 (若在地平線上或剛沒入)
            if (Math.abs(sunH) <= 102) {
              const sRad = sunH * DEG;
              const sx = skyCx + Math.sin(sRad) * arcRx;
              const sy = horizonY - Math.cos(sRad) * arcRy;
              const sg = ctx.createRadialGradient(sx, sy, 3, sx, sy, 26);
              sg.addColorStop(0, '#FFFBEB');
              sg.addColorStop(0.45, PALETTE.sun);
              sg.addColorStop(1, 'rgba(251,191,36,0)');
              ctx.fillStyle = sg;
              ctx.beginPath(); ctx.arc(sx, sy, 26, 0, TAU); ctx.fill();
              ctx.fillStyle = PALETTE.sun;
              ctx.beginPath(); ctx.arc(sx, sy, 10, 0, TAU); ctx.fill();
            }

            // 繪製月球在天空中的即時位置與正確亮面朝向
            const mVisible = Math.abs(moonH) <= 95;
            if (mVisible) {
              const mRad = moonH * DEG;
              const mx = skyCx + Math.sin(mRad) * arcRx;
              const my = horizonY - Math.cos(mRad) * arcRy;
              drawLunarDisc(mx, my, 15, false);
              drawPill2D(ctx, info.phaseName.split(' ')[0], mx, my - 26, PALETTE.lunarOrb);
            }

            // 地平線草地遮罩與方位座標 (面向南：左東 E、中南 S、右西 W)
            ctx.fillStyle = '#0B221E';
            ctx.fillRect(skyX, horizonY, skyW, skyY + skyH - horizonY);
            ctx.strokeStyle = PALETTE.land;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(skyX, horizonY); ctx.lineTo(skyX + skyW, horizonY); ctx.stroke();

            ctx.restore();
            ctx.strokeStyle = PALETTE.grid;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.roundRect(skyX, skyY, skyW, skyH, 12); ctx.stroke();

            drawPill2D(ctx, '地面面向南方天空 (左東升 → 正南中天 → 右西落)', skyCx, skyY + 18, PALETTE.earth);
            drawPill2D(ctx, '東 E', skyX + 34, horizonY + 18, PALETTE.tide);
            drawPill2D(ctx, '正南 S', skyCx, horizonY + 18, PALETTE.land);
            drawPill2D(ctx, '西 W', skyX + skyW - 34, horizonY + 18, PALETTE.sun);
            if (!mVisible) {
              drawPill2D(ctx, `此刻月球在地平線下 (月出 ${fmtHm(riseHr)} ～ 月落 ${fmtHm(setHr)})`, skyCx, horizonY - 78, PALETTE.muted);
            }

            /* --- 右區：地面放大月相特寫盤與農曆時刻資訊卡 --- */
            const cardX = 82, cardY = -172, cardW = 204, cardH = 278;
            const cardCx = cardX + cardW * 0.5;
            ctx.fillStyle = '#0B1324';
            ctx.beginPath(); ctx.roundRect(cardX, cardY, cardW, cardH, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.lunarOrb;
            ctx.stroke();

            drawPill2D(ctx, `${info.dateStr}｜${info.phaseName}`, cardCx, cardY + 20, PALETTE.lunarOrb);

            // 特寫大月相圓盤
            drawLunarDisc(cardCx, cardY + 104, 54, true);

            // 東側/西側亮面方位提示
            const sideHint = (psi < 10 || psi > 350) ? '暗面朝地 (不可見)'
              : (psi > 170 && psi < 190) ? '整面受光 (滿月)'
                : psi < 180 ? '西側亮 (右半亮)' : '東側亮 (左半亮)';
            drawPill2D(ctx, `${sideHint}｜照明 ${(illum * 100).toFixed(0)}%`, cardCx, cardY + 182, PALETTE.moon);
            drawPill2D(ctx, `月出 ${fmtHm(riseHr)}｜中天 ${fmtHm(transitHr)}`, cardCx, cardY + 218, PALETTE.earth);
            drawPill2D(ctx, `月落 ${fmtHm(setHr)} (每日晚~50分)`, cardCx, cardY + 252, PALETTE.tide);

            /* --- 底部橫列：農曆初一 ～ 三十 (8 大月相連續演變圖尺) --- */
            const stripX = -286, stripY = 116, stripW = 572, stripH = 62;
            ctx.fillStyle = '#0B1324';
            ctx.beginPath(); ctx.roundRect(stripX, stripY, stripW, stripH, 10); ctx.fill();
            ctx.strokeStyle = PALETTE.grid;
            ctx.stroke();

            const milestones = [
              { d: 1, lbl: '初一朔' },
              { d: 4.5, lbl: '初四眉' },
              { d: 8.3, lbl: '初八上弦' },
              { d: 12.0, lbl: '十二盈凸' },
              { d: 15.6, lbl: '十五望' },
              { d: 19.3, lbl: '十九虧凸' },
              { d: 23.1, lbl: '廿三下弦' },
              { d: 27.0, lbl: '廿七殘' }
            ];

            milestones.forEach((m, idx) => {
              const mx = stripX + 38 + idx * 71;
              const my = stripY + 23;
              const mPsi = ((m.d - 1) / 29.53) * TAU;
              const mIllum = 0.5 * (1 - Math.cos(mPsi));
              const mWax = mPsi <= Math.PI;

              // 高亮目前農曆所在區間
              const isCur = Math.abs(p.lunarDay - m.d) < 2.0 || (idx === 0 && p.lunarDay > 28.8);
              if (isCur) {
                ctx.strokeStyle = PALETTE.sun;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(mx, my, 15.5, 0, TAU); ctx.stroke();
              }

              // 微縮月相圖示
              ctx.save();
              ctx.translate(mx, my);
              ctx.fillStyle = '#1E293B';
              ctx.beginPath(); ctx.arc(0, 0, 11.5, 0, TAU); ctx.fill();
              ctx.beginPath(); ctx.arc(0, 0, 11.5, 0, TAU); ctx.clip();
              ctx.fillStyle = '#F8FAFC';
              ctx.beginPath();
              ctx.arc(0, 0, 11.5, mWax ? -Math.PI / 2 : Math.PI / 2, mWax ? Math.PI / 2 : -Math.PI / 2, false);
              ctx.fill();
              ctx.fillStyle = mIllum >= 0.5 ? '#F8FAFC' : '#1E293B';
              ctx.beginPath(); ctx.ellipse(0, 0, Math.abs(Math.cos(mPsi)) * 11.5, 11.5, 0, 0, TAU); ctx.fill();
              ctx.restore();

              if (state.showLabels) {
                ctx.fillStyle = isCur ? PALETTE.sun : PALETTE.muted;
                ctx.font = '700 10.5px -apple-system, "Noto Sans TC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(m.lbl, mx, stripY + 51);
              }
            });
            break;
          }
        }

        ctx.restore();
      }

      /* =========================================================
       * 11. UI 控制列、Step-by-Step 導覽與分頁切換綁定
       * ========================================================= */
      const tabsStrip = document.getElementById('tabs-strip');
      const ctrlContainer = document.getElementById('ctrl-container');
      const stepDotsEl = document.getElementById('step-dots');
      const stepTitleEl = document.getElementById('step-title');
      const stepDescEl = document.getElementById('step-desc');
      const macroTitleEl = document.getElementById('macro-title');
      const groundTitleEl = document.getElementById('ground-title');
      const btnPlay = document.getElementById('btn-play');

      // 建立 10 個分頁按鈕
      MODULES.forEach((m, idx) => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
        btn.innerHTML = `<span class="num">${m.num}</span><span>${m.short}</span>`;
        btn.addEventListener('click', () => switchTab(idx));
        tabsStrip.appendChild(btn);
      });

      document.getElementById('tab-left').addEventListener('click', () => { tabsStrip.scrollBy({ left: -220, behavior: 'smooth' }); });
      document.getElementById('tab-right').addEventListener('click', () => { tabsStrip.scrollBy({ left: 220, behavior: 'smooth' }); });

      // 建立動態參數控制器並維持即時數值同步
      let uiValueUpdaters = [];
      function buildControlsUI(tabIdx) {
        ctrlContainer.innerHTML = '';
        uiValueUpdaters = [];
        const mod = MODULES[tabIdx];
        const p = state.params[tabIdx];

        mod.controls.forEach(c => {
          const wrap = document.createElement('div');
          wrap.className = 'ctrl-item';

          if (c.type === 'chips' || c.type === 'presets') {
            const lbl = document.createElement('div');
            lbl.className = 'ctrl-label-row';
            lbl.innerHTML = `<span>${c.label}</span>`;
            const row = document.createElement('div');
            row.className = 'preset-row';
            const chips = [];
            c.options.forEach(opt => {
              const ch = document.createElement('button');
              ch.className = 'preset-chip';
              ch.textContent = opt.label;
              ch.addEventListener('click', () => {
                state.tween = null;
                p[c.key] = opt.val;
                syncControlsReadout();
              });
              row.appendChild(ch);
              chips.push({ el: ch, val: opt.val });
            });
            wrap.appendChild(lbl);
            wrap.appendChild(row);
            uiValueUpdaters.push(() => {
              chips.forEach(ch => ch.el.classList.toggle('active', Math.abs(p[c.key] - ch.val) < 0.05));
            });
          } else {
            const lbl = document.createElement('div');
            lbl.className = 'ctrl-label-row';
            const nameSpan = document.createElement('span');
            nameSpan.textContent = c.label;
            const valSpan = document.createElement('span');
            valSpan.className = 'ctrl-val';
            lbl.append(nameSpan, valSpan);

            const input = document.createElement('input');
            input.type = 'range';
            input.min = c.min;
            input.max = c.max;
            input.step = c.step;
            input.value = p[c.key];
            input.addEventListener('input', () => {
              state.tween = null;
              p[c.key] = parseFloat(input.value);
              valSpan.textContent = c.fmt ? c.fmt(p[c.key]) : p[c.key];
            });

            wrap.append(lbl, input);
            uiValueUpdaters.push(() => {
              if (document.activeElement !== input) input.value = p[c.key];
              valSpan.textContent = c.fmt ? c.fmt(p[c.key]) : p[c.key];
            });
          }

          ctrlContainer.appendChild(wrap);
        });
        syncControlsReadout();
      }

      function syncControlsReadout() {
        for (const fn of uiValueUpdaters) fn();
      }

      function updatePlayButtonUI() {
        btnPlay.classList.toggle('play-on', state.playing);
        btnPlay.textContent = state.playing ? '⏸ 暫停' : '▶ 播放';
      }

      // Step-by-Step 流程導覽切換 (自動平滑補間參數與 3D 相機視角)
      function applyStep(stepIdx, animate = true) {
        const mod = MODULES[state.tabIdx];
        state.stepIdx = clamp(stepIdx, 0, mod.steps.length - 1);
        const st = mod.steps[state.stepIdx];

        stepTitleEl.textContent = st.title;
        stepDescEl.textContent = st.desc;
        state.playing = !!st.play;
        updatePlayButtonUI();

        // 更新步驟圓點高亮
        Array.from(stepDotsEl.children).forEach((d, i) => d.classList.toggle('active', i === state.stepIdx));

        const p = state.params[state.tabIdx];
        if (!animate) {
          Object.assign(p, st.params);
          if (st.cam) camRig.reset(st.cam);
          state.tween = null;
          syncControlsReadout();
        } else {
          state.tween = {
            startParams: { ...p },
            targetParams: { ...st.params },
            startCam: { theta: camRig.theta, phi: camRig.phi, radius: camRig.radius, tx: camRig.target.x, ty: camRig.target.y, tz: camRig.target.z },
            targetCam: st.cam || mod.cam,
            elapsed: 0,
            duration: 0.62
          };
        }
      }

      function buildStepsUI(tabIdx) {
        const mod = MODULES[tabIdx];
        stepDotsEl.innerHTML = '';
        mod.steps.forEach((_, idx) => {
          const b = document.createElement('button');
          b.className = 'step-dot' + (idx === 0 ? ' active' : '');
          b.textContent = `S${idx + 1}`;
          b.title = `跳至步驟 ${idx + 1}`;
          b.addEventListener('click', () => applyStep(idx, true));
          stepDotsEl.appendChild(b);
        });
      }

      function switchTab(idx) {
        state.tabIdx = idx;
        state.tween = null;
        const mod = MODULES[idx];

        Array.from(tabsStrip.children).forEach((b, i) => {
          const active = i === idx;
          b.classList.toggle('active', active);
          if (active) b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        });

        macroTitleEl.textContent = mod.macroTitle;
        groundTitleEl.textContent = mod.groundTitle;
        groundCam.reset();
        camRig.reset(mod.cam);

        buildMacroScene(idx);
        buildControlsUI(idx);
        buildStepsUI(idx);
        applyStep(0, false);
      }

      // 全域按鈕事件
      btnPlay.addEventListener('click', () => {
        state.playing = !state.playing;
        updatePlayButtonUI();
      });

      document.getElementById('btn-prev-step').addEventListener('click', () => {
        const len = MODULES[state.tabIdx].steps.length;
        applyStep((state.stepIdx - 1 + len) % len, true);
      });

      document.getElementById('btn-next-step').addEventListener('click', () => {
        const len = MODULES[state.tabIdx].steps.length;
        applyStep((state.stepIdx + 1) % len, true);
      });

      // 文字標籤顯示/隱藏開關
      const btnLabels = document.getElementById('btn-labels');
      function toggleLabels() {
        state.showLabels = !state.showLabels;
        btnLabels.classList.toggle('label-on', state.showLabels);
        btnLabels.textContent = state.showLabels ? '🏷️ 標籤: 開' : '🏷️ 標籤: 關';
      }
      btnLabels.addEventListener('click', toggleLabels);
      window.addEventListener('keydown', e => {
        if (e.key === 'l' || e.key === 'L') toggleLabels();
      });

      // 視角模式切換 (雙視角 / 僅太空 / 僅地表)
      const stageEl = document.getElementById('stage');
      const viewBtns = {
        dual: document.getElementById('view-dual'),
        macro: document.getElementById('view-macro'),
        ground: document.getElementById('view-ground')
      };
      function setViewMode(mode) {
        state.viewMode = mode;
        stageEl.className = mode === 'dual' ? '' : `mode-${mode}`;
        Object.keys(viewBtns).forEach(k => viewBtns[k].classList.toggle('active', k === mode));
        handleResize();
      }
      viewBtns.dual.addEventListener('click', () => setViewMode('dual'));
      viewBtns.macro.addEventListener('click', () => setViewMode('macro'));
      viewBtns.ground.addEventListener('click', () => setViewMode('ground'));

      // 底部面板收合/展開 (行動裝置小螢幕友善)
      const dockEl = document.getElementById('dock');
      const btnDockCollapse = document.getElementById('btn-dock-collapse');
      btnDockCollapse.addEventListener('click', () => {
        const collapsed = dockEl.classList.toggle('collapsed');
        btnDockCollapse.textContent = collapsed ? '展開控制面板 ▲' : '收合面板 ▼';
        setTimeout(handleResize, 50);
      });

      // 視角右上角 Zoom / Pan 輔助按鈕
      const macroPanBtn = document.getElementById('macro-pan-toggle');
      macroPanBtn.addEventListener('click', () => {
        state.macroPanMode = !state.macroPanMode;
        macroPanBtn.classList.toggle('active', state.macroPanMode);
      });
      document.getElementById('macro-zoom-in').addEventListener('click', () => { camRig.radius *= 0.84; });
      document.getElementById('macro-zoom-out').addEventListener('click', () => { camRig.radius *= 1.18; });
      document.getElementById('macro-reset').addEventListener('click', () => { camRig.reset(MODULES[state.tabIdx].cam); });

      document.getElementById('ground-zoom-in').addEventListener('click', () => { groundCam.zoom = clamp(groundCam.zoom * 1.2, 0.55, 3.8); });
      document.getElementById('ground-zoom-out').addEventListener('click', () => { groundCam.zoom = clamp(groundCam.zoom / 1.2, 0.55, 3.8); });
      document.getElementById('ground-reset').addEventListener('click', () => { groundCam.reset(); });

      /* =========================================================
       * 12. 視窗自適應縮放與 60fps 主模擬迴圈
       * ========================================================= */
      function handleResize() {
        if (state.viewMode !== 'ground') {
          const mw = macroPane.clientWidth;
          const mh = macroPane.clientHeight;
          if (mw > 2 && mh > 2) {
            camera.aspect = mw / mh;
            camera.updateProjectionMatrix();
            renderer.setSize(mw, mh, false);
          }
        }
      }
      window.addEventListener('resize', handleResize);
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(handleResize);
        ro.observe(stageEl);
      }

      let lastTime = performance.now();
      function animateLoop(now) {
        requestAnimationFrame(animateLoop);
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        const p = state.params[state.tabIdx];

        // 處理 Step-by-Step 平滑補間動畫
        if (state.tween) {
          const tw = state.tween;
          tw.elapsed += dt;
          const rawT = clamp(tw.elapsed / tw.duration, 0, 1);
          const ease = 1 - Math.pow(1 - rawT, 3); // Cubic Ease-Out

          for (const k of Object.keys(tw.targetParams)) {
            if (typeof tw.startParams[k] === 'number') {
              p[k] = lerp(tw.startParams[k], tw.targetParams[k], ease);
            } else {
              p[k] = tw.targetParams[k];
            }
          }
          camRig.theta = lerp(tw.startCam.theta, tw.targetCam.theta, ease);
          camRig.phi = lerp(tw.startCam.phi, tw.targetCam.phi, ease);
          camRig.radius = lerp(tw.startCam.radius, tw.targetCam.radius, ease);
          camRig.target.set(
            lerp(tw.startCam.tx, 0, ease),
            lerp(tw.startCam.ty, 0, ease),
            lerp(tw.startCam.tz, 0, ease)
          );
          if (rawT >= 1) state.tween = null;
        }

        if (activeMacroUpdater) activeMacroUpdater(p, dt);
        syncControlsReadout();

        if (state.viewMode !== 'ground') {
          camRig.updateCamera();
          renderer.render(scene, camera);
          syncLabels3D();
        } else {
          macroLabelLayer.style.display = 'none';
        }

        renderGroundView(state.tabIdx, p);
      }

      // 初始化啟動第 01 分頁
      switchTab(0);
      handleResize();
      requestAnimationFrame(animateLoop);
    })();
  </script>
</body>
