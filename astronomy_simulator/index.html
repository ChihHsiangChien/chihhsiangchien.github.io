              // 2. 更新歲差進動方位角 (25.77 kyr 一圈)
              const precRad = (p.precKy / 25.77) * TAU;
              precYawGroup.rotation.y = -precRad;

              // 更新歲差圓錐與頂部圓環幾何
              const ringPts = [];
              const coneVerts = [];
              const segs = 64;
              for (let i = 0; i <= segs; i++) {
                const a = (i / segs) * TAU;
                const x = Math.cos(a) * coneR;
                const z = Math.sin(a) * coneR;
                ringPts.push(new THREE.Vector3(x, coneH, z));
                if (i < segs) {
                  const a2 = ((i + 1) / segs) * TAU;
                  coneVerts.push(0, 0, 0, x, coneH, z, Math.cos(a2) * coneR, coneH, Math.sin(a2) * coneR);
                }
              }
              precRingGeo.setFromPoints(ringPts);
              coneGeo.setAttribute('position', new THREE.Float32BufferAttribute(coneVerts, 3));

              // 更新四顆歷代北極星位置
              poleStarMeshes.forEach(st => {
                const sx = Math.cos(st.ang) * coneR;
                const sz = Math.sin(st.ang) * coneR;
                st.mesh.position.set(sx, coneH, sz);
                st.lb.worldPos.set(earthCenter.x + sx, coneH, earthCenter.z + sz);
              });

              // 3. 更新左側太陽旁的可變離心率橢圓軌道環 (視覺放大離心率 6 倍以突顯 e=0.003 vs 0.058 差異)
              const visE = clamp(p.eccVal * 6.0, 0.01, 0.38);
              const orbA = 10.6;
              const orbPts = [];
              for (let i = 0; i <= 96; i++) {
                const nu = (i / 96) * TAU;
                const r = (orbA * (1 - visE * visE)) / (1 + visE * Math.cos(nu));
                orbPts.push(new THREE.Vector3(-8.5 + Math.cos(nu) * r, -1.8, Math.sin(nu) * r));
              }
              helioOrbitGeo.setFromPoints(orbPts);
              helioOrbitLine.computeLineDistances();

              lbSun.worldPos.copy(sun.position);
              lbEclPole.worldPos.set(earthCenter.x, 7.4, earthCenter.z);
              const tipLocal = new THREE.Vector3(0, 7.2, 0).applyEuler(obliqTiltGroup.rotation).applyEuler(precYawGroup.rotation);
              lbAxisTip.worldPos.copy(tipLocal).add(earthCenter);
              lbAxisTip.el.textContent = `北天極 (+${p.precKy.toFixed(1)}千年｜傾角 ${p.obliqDeg.toFixed(1)}°)`;
              lbBulge.worldPos.copy(earthCenter);
            };
            break;
          }

          /* ---------------- 13 月相變化過程與農曆地面觀測 ---------------- */
          case 13: {
            // 平行太陽光固定由右側 (+X) 射入，確保地球與月球永遠右半邊受光
            const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
            sunLight.position.set(35, 2, 0);
            moduleRoot.add(sunLight);

            const sunIndicator = makeSunMesh(1.3);
            sunIndicator.position.set(13.2, 0, 0);
            moduleRoot.add(sunIndicator);

            // 平行太陽光束輔助線
            for (let i = -2; i <= 2; i++) {
              if (i === 0) continue;
              const rayGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(11.4, 0, i * 2.5),
                new THREE.Vector3(8.6, 0, i * 2.5)
              ]);
              moduleRoot.add(new THREE.Line(rayGeo, new THREE.LineBasicMaterial({ color: PALETTE.sunHex, transparent: true, opacity: 0.45 })));
            }

            // 中心地球與晨昏分界環 (06:00 晨 / 12:00 午 / 18:00 昏 / 00:00 夜)
            const earth = makeEarthMesh(1.85);
            moduleRoot.add(earth);

            const termRing = makeOrbitRing(1.9, 1.9, PALETTE.nodeHex);
            termRing.rotation.z = Math.PI / 2;
            moduleRoot.add(termRing);

            // 地面觀測者定位針與地平切面
            const obsGroup = new THREE.Group();
            const obsPin = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.landHex }));
            const horizonDisc = new THREE.Mesh(
              new THREE.CircleGeometry(0.68, 24),
              new THREE.MeshBasicMaterial({ color: PALETTE.landHex, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
            );
            horizonDisc.rotation.y = Math.PI / 2;
            horizonDisc.position.x = 0.02;
            obsGroup.add(obsPin, horizonDisc);
            moduleRoot.add(obsGroup);

            // 白道軌道環 + 8 個經典農曆月相參考微縮點
            const orbitR = 7.4;
            const lunarOrbit = makeOrbitRing(orbitR, orbitR, PALETTE.lunarOrbHex);
            moduleRoot.add(lunarOrbit);

            for (let k = 0; k < 8; k++) {
              const ang = (k / 8) * TAU;
              const dot = new THREE.Mesh(
                new THREE.SphereGeometry(0.11, 12, 10),
                new THREE.MeshBasicMaterial({ color: 0x64748B, transparent: true, opacity: 0.55 })
              );
              dot.position.set(Math.cos(ang) * orbitR, 0, -Math.sin(ang) * orbitR);
              moduleRoot.add(dot);
            }

            // 主月球模型 + 月球視覺相位切割環(垂直於地球-月球視線，標出「地球可見半球」!)
            const moon = makeMoonMesh(0.75);
            moduleRoot.add(moon);

            const visPlaneRing = makeOrbitRing(0.95, 0.95, PALETTE.earthHex, true, 48);
            visPlaneRing.rotation.z = Math.PI / 2;
            moduleRoot.add(visPlaneRing);

            // 地球觀測者 -> 月球視線
            const sightGeo = new THREE.BufferGeometry();
            const sightLine = new THREE.Line(sightGeo, new THREE.LineDashedMaterial({ color: PALETTE.earthHex, dashSize: 0.35, gapSize: 0.22 }));
            moduleRoot.add(sightLine);

            const lbSun = addLabel3D('平行太陽光 ☀️', PALETTE.sun, 1.7);
            const lbNoon = addLabel3D('12:00 正午', PALETTE.sun, 0.25);
            const lbDusk = addLabel3D('18:00 黃昏(昏線)', PALETTE.node, 0.25);
            const lbMid = addLabel3D('00:00 子夜', PALETTE.muted, 0.25);
            const lbDawn = addLabel3D('06:00 清晨(晨線)', PALETTE.tide, 0.25);
            const lbObs = addLabel3D('地面觀測者', PALETTE.land, 0.45);
            const lbMoon = addLabel3D('月球', PALETTE.lunarOrb, 1.15);

            activeMacroUpdater = (p, dt) => {
              if (p.lockMode === 1) p.obsHour = 18.0;
              else if (p.lockMode === 2) p.obsHour = 6.0;

              if (state.playing && !state.tween) {
                if (p.lockMode === 0) {
                  // 自然模式：時間推進，農曆天數同步前進
                  const dHours = dt * 3.2;
                  p.obsHour = (p.obsHour + dHours) % 24;
                  p.lunarDay += dHours / 24;
                } else {
                  // 定格時刻模式：直接連續推進農曆各天，觀察月球逐日東移與盈虧
                  p.lunarDay += dt * 1.65;
                }
                if (p.lunarDay >= 30.53) p.lunarDay -= 29.53;
              }

              const info = getLunarInfo(p.lunarDay);
              const psiRad = info.psi * DEG;

              // 俯視逆時針公轉：0°(朔)在 +X，90°(上弦)在 -Z，180°(望)在 -X，270°(下弦)在 +Z
              const mx = Math.cos(psiRad) * orbitR;
              const mz = -Math.sin(psiRad) * orbitR;
              moon.position.set(mx, 0, mz);
              moon.rotation.y = psiRad + Math.PI; // 潮汐鎖定：同一面永遠朝向地球

              // 地球可見半球切割環垂直於地月連線
              visPlaneRing.position.copy(moon.position);
              visPlaneRing.rotation.y = psiRad;

              // 地球逆時針自轉：12:00 在 +X，18:00 在 -Z，00:00 在 -X，06:00 在 +Z
              const obsAng = ((p.obsHour - 12) / 24) * TAU;
              earth.rotation.y = obsAng;
              const ox = Math.cos(obsAng) * 1.92;
              const oz = -Math.sin(obsAng) * 1.92;
              obsGroup.position.set(ox, 0.35, oz);
              obsGroup.rotation.y = obsAng;

              sightGeo.setFromPoints([obsGroup.position.clone(), moon.position.clone()]);
              sightLine.computeLineDistances();

              lbSun.worldPos.copy(sunIndicator.position);
              lbNoon.worldPos.set(2.35, -0.2, 0);
              lbDusk.worldPos.set(0, -0.2, -2.35);
              lbMid.worldPos.set(-2.35, -0.2, 0);
              lbDawn.worldPos.set(0, -0.2, 2.35);
              lbObs.worldPos.copy(obsGroup.position);
              lbMoon.el.textContent = `${info.dateStr}｜${info.phaseName}`;
              lbMoon.worldPos.copy(moon.position);
            };
            break;
          }
        }
      }

      /* =========================================================
       * 9. 2D 地表沈浸與光學視角引擎 (支援觸控 Pinch-Zoom & Pan)
       * ========================================================= */
      const groundCanvas = document.getElementById('ground-canvas');
      const gCtx = groundCanvas.getContext('2d');

      const groundCam = {
        zoom: 1.0,
        panX: 0,
        panY: 0,
        reset() { this.zoom = 1.0; this.panX = 0; this.panY = 0; }
      };

      (function bindGroundInput() {
        let dragging = false;
        let lx = 0, ly = 0;
        let pDist = 0, pMidX = 0, pMidY = 0;

        groundCanvas.addEventListener('mousedown', e => {
          dragging = true; lx = e.clientX; ly = e.clientY;
        });
        window.addEventListener('mousemove', e => {
          if (!dragging) return;
          groundCam.panX += e.clientX - lx;
          groundCam.panY += e.clientY - ly;
          lx = e.clientX; ly = e.clientY;
        });
        window.addEventListener('mouseup', () => { dragging = false; });

        groundCanvas.addEventListener('wheel', e => {
          e.preventDefault();
          const rect = groundCanvas.getBoundingClientRect();
          const cx = e.clientX - rect.left - rect.width * 0.5;
          const cy = e.clientY - rect.top - rect.height * 0.5;
          const factor = e.deltaY < 0 ? 1.1 : 0.91;
          const nextZ = clamp(groundCam.zoom * factor, 0.55, 3.8);
          const ratio = nextZ / groundCam.zoom;
          groundCam.panX = cx - (cx - groundCam.panX) * ratio;
          groundCam.panY = cy - (cy - groundCam.panY) * ratio;
          groundCam.zoom = nextZ;
        }, { passive: false });

        groundCanvas.addEventListener('touchstart', e => {
          if (e.touches.length === 1) {
            lx = e.touches[0].clientX; ly = e.touches[0].clientY;
          } else if (e.touches.length >= 2) {
            pDist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
            pMidX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
            pMidY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
          }
        }, { passive: false });

        groundCanvas.addEventListener('touchmove', e => {
          e.preventDefault();
          if (e.touches.length === 1) {
            groundCam.panX += e.touches[0].clientX - lx;
            groundCam.panY += e.touches[0].clientY - ly;
            lx = e.touches[0].clientX; ly = e.touches[0].clientY;
          } else if (e.touches.length >= 2) {
            const d = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
            const mx = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
            const my = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
            if (pDist > 8) {
              groundCam.zoom = clamp(groundCam.zoom * (d / pDist), 0.55, 3.8);
            }
            groundCam.panX += mx - pMidX;
            groundCam.panY += my - pMidY;
            pDist = d; pMidX = mx; pMidY = my;
          }
        }, { passive: false });
      })();

      // 2D 標籤繪製輔助 (受全域 state.showLabels 開關控制)
      function drawPill2D(ctx, text, x, y, color = '#F8FAFC', align = 'center') {
        if (!state.showLabels) return;
        ctx.save();
        ctx.font = '700 12px -apple-system, "Noto Sans TC", sans-serif';
        const padX = 8;
        const tw = ctx.measureText(text).width + padX * 2;
        const th = 22;
        let bx = x - tw * 0.5;
        if (align === 'left') bx = x;
        if (align === 'right') bx = x - tw;
        const by = y - th * 0.5;

        ctx.fillStyle = 'rgba(9, 14, 28, 0.86)';
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(bx, by, tw, th, 5);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, bx + tw * 0.5, by + th * 0.5 + 0.5);
        ctx.restore();
      }

      // 斜視 3D 天球穹頂：北在左、南在右、東在遠側(上)、西在近側(下)
      function drawSkyDome(ctx, { cx, cy, R, skyBright = 0.5, flat = 0.32 }) {
        const proj = (altR, az, rScale = 1) => {
          const rH = Math.cos(altR) * R * rScale;
          const x = cx - Math.cos(az) * rH;
          const z = Math.sin(az) * rH; // 東 (az=90°) 為 +z → 遠側
          const y = cy - Math.sin(altR) * R - z * flat;
          return { x, y };
        };
        const domeGrad = ctx.createRadialGradient(cx, cy - R * 0.4, 10, cx, cy, R * 1.15);
        domeGrad.addColorStop(0, `rgba(56, 189, 248, ${0.06 + 0.28 * skyBright})`);
        domeGrad.addColorStop(1, 'rgba(15, 23, 42, 0.1)');
        ctx.fillStyle = domeGrad;
        ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, 0); ctx.ellipse(cx, cy, R, R * flat, 0, 0, Math.PI); ctx.fill();

        ctx.fillStyle = 'rgba(16, 185, 129, 0.14)';
        ctx.strokeStyle = PALETTE.land;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(cx, cy, R, R * flat, 0, 0, TAU); ctx.fill(); ctx.stroke();

        ctx.strokeStyle = 'rgba(148,163,184,0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy - R * flat); ctx.lineTo(cx, cy + R * flat); ctx.stroke();
        return { proj, cx, cy, R, flat };
      }

      function drawDomeCompass(ctx, dome) {
        const { cx, cy, R, flat } = dome;
        drawPill2D(ctx, '北 N', cx - R - 24, cy, PALETTE.earth);
        drawPill2D(ctx, '南 S', cx + R + 24, cy, PALETTE.earth);
        drawPill2D(ctx, '東 E', cx, cy - R * flat - 13, PALETTE.muted);
        drawPill2D(ctx, '西 W', cx, cy + R * flat + 15, PALETTE.muted);
      }

      function drawDomeObserver(ctx, dome) {
        const { cx, cy } = dome;
        ctx.fillStyle = PALETTE.land;
        ctx.beginPath(); ctx.arc(cx, cy - 12, 5, 0, TAU); ctx.fill();
        ctx.strokeStyle = PALETTE.land; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(cx, cy - 7); ctx.lineTo(cx, cy + 4); ctx.stroke();
      }

      // 太陽周日軌跡：地平線上實線、地平線下虛線；可選每小時刻度
      function drawSunPath(ctx, dome, phi, delta, { color, width = 2.5, hourTicks = false, below = true }) {
        for (let pass = 0; pass < 2; pass++) {
          if (pass === 0 && !below) continue;
          ctx.beginPath();
          ctx.strokeStyle = pass === 1 ? color : 'rgba(148, 163, 184, 0.3)';
          ctx.lineWidth = pass === 1 ? width : 1.3;
          ctx.setLineDash(pass === 0 ? [4, 4] : []);
          let started = false;
          for (let i = 0; i <= 192; i++) {
            const Hh = ((i / 192) * 24 - 12) * 15 * DEG;
            const s = sunAltAz(phi, delta, Hh);
            const above = s.alt >= -0.004;
            if ((pass === 1 && above) || (pass === 0 && !above)) {
              const pt = dome.proj(s.alt, s.az);
              if (!started) { ctx.moveTo(pt.x, pt.y); started = true; } else ctx.lineTo(pt.x, pt.y);
            } else started = false;
          }
          ctx.stroke();
          ctx.setLineDash([]);
        }
        if (hourTicks) {
          ctx.font = '600 10px -apple-system, "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          for (let h = 0; h < 24; h++) {
            const s = sunAltAz(phi, delta, (h - 12) * 15 * DEG);
            if (s.alt < 0) continue;
            const pt = dome.proj(s.alt, s.az);
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, TAU); ctx.fill();
            if (state.showLabels && h % 3 === 0) {
              ctx.fillStyle = 'rgba(254, 243, 199, 0.85)';
              ctx.fillText(`${h}時`, pt.x, pt.y - 11);
            }
          }
        }
      }

      /* =========================================================
       * 10. 各分頁專屬 2D 地表/光學微觀渲染器 (與 3D 即時同步)
       * ========================================================= */
      const wanderView = { c: null, h: 30, target: -1, lastDays: 0 };
      const ZODIAC_BOUNDS = [
        [28.7, '雙魚座'], [53.4, '白羊座'], [90.1, '金牛座'], [118.0, '雙子座'], [138.0, '巨蟹座'],
        [173.9, '獅子座'], [217.8, '室女座'], [241.0, '天秤座'], [247.7, '天蠍座'], [266.3, '蛇夫座'],
        [299.7, '人馬座'], [327.6, '摩羯座'], [351.6, '寶瓶座'], [360.1, '雙魚座']
      ];
      function zodiacOf(lon) {
        const L = normDeg(lon);
        for (const [b, n] of ZODIAC_BOUNDS) if (L < b) return n;
        return '雙魚座';
      }

      function renderGroundView(tabIdx, p) {
        if (state.viewMode === 'macro') return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = groundCanvas.clientWidth;
        const h = groundCanvas.clientHeight;
        if (w < 4 || h < 4) return;
        if (groundCanvas.width !== Math.round(w * dpr) || groundCanvas.height !== Math.round(h * dpr)) {
          groundCanvas.width = Math.round(w * dpr);
          groundCanvas.height = Math.round(h * dpr);
        }

        const ctx = gCtx;
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.fillStyle = PALETTE.bgDark;
        ctx.fillRect(0, 0, w, h);

        // 套用使用者 Pan & Zoom 座標變換 (以畫布中心為基準 640x440 邏輯空間自動縮放)
        const baseScale = Math.min(w / 620, h / 430);
        ctx.translate(w * 0.5 + groundCam.panX, h * 0.5 + groundCam.panY);
        ctx.scale(baseScale * groundCam.zoom, baseScale * groundCam.zoom);

        switch (tabIdx) {
          /* ---------------- 01 黃白交角：天球交點與朔望偏移 ---------------- */
          case 0: {
            // 繪製天球局部視窗 (-290..290, -185..185)
            ctx.strokeStyle = PALETTE.grid;
            ctx.lineWidth = 1;
            for (let gx = -240; gx <= 240; gx += 60) {
              ctx.beginPath(); ctx.moveTo(gx, -165); ctx.lineTo(gx, 165); ctx.stroke();
            }
            for (let gy = -150; gy <= 150; gy += 50) {
              ctx.beginPath(); ctx.moveTo(-275, gy); ctx.lineTo(275, gy); ctx.stroke();
            }

            // 黃道線 (水平金色)
            ctx.strokeStyle = PALETTE.sun;
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(-275, 0); ctx.lineTo(275, 0); ctx.stroke();

            const isFullHalf = p.moonPhaseDeg > 90 && p.moonPhaseDeg < 270;
            const tiltDeg = p.exaggerateTilt ? 15 : 5.14;
            // 交點相對於當前中心的黃經偏移
            const targetLon = isFullHalf ? normDeg(p.earthDeg) : normDeg(p.earthDeg + 180);
            // 距離最近交點 (0° 或 180°) 的有號角距離 (-90..+90)
            let nodeOffset = ((targetLon + 90) % 180) - 90;
            const nodeX = -nodeOffset * 2.8;

            // 白道傾斜線 (紫色通過交點 nodeX)
            const slope = Math.tan((p.exaggerateTilt ? 22 : 9) * DEG);
            ctx.strokeStyle = PALETTE.lunarOrb;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-275, (-275 - nodeX) * slope);
            ctx.lineTo(275, (275 - nodeX) * slope);
            ctx.stroke();

            // 中心目標：朔月看「太陽圓盤」，望月看「地球本影圓盤」
            if (!isFullHalf) {
              const g = ctx.createRadialGradient(0, 0, 10, 0, 0, 56);
              g.addColorStop(0, '#FFFBEB');
              g.addColorStop(0.55, PALETTE.sun);
              g.addColorStop(1, 'rgba(251,191,36,0)');
              ctx.fillStyle = g;
              ctx.beginPath(); ctx.arc(0, 0, 56, 0, TAU); ctx.fill();
              ctx.fillStyle = PALETTE.sun;
              ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill();
              drawPill2D(ctx, '太陽視圓盤 (黃道上)', 0, 52, PALETTE.sun);
            } else {
              ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
              ctx.strokeStyle = PALETTE.node;
              ctx.lineWidth = 2;
              ctx.beginPath(); ctx.arc(0, 0, 44, 0, TAU); ctx.fill(); ctx.stroke();
              drawPill2D(ctx, '地球本影區 (黃道中心)', 0, 62, PALETTE.node);
            }

            // 繪製交點標記 (若在視野內)
            if (Math.abs(nodeX) < 265) {
              ctx.fillStyle = PALETTE.node;
              ctx.beginPath(); ctx.arc(nodeX, 0, 7, 0, TAU); ctx.fill();
              drawPill2D(ctx, '黃白交點 (Node)', nodeX, -24, PALETTE.node);
            }

            // 計算月球當前相對於目標的東西向與南北向位置
            let dPhase = isFullHalf ? (p.moonPhaseDeg - 180) : (p.moonPhaseDeg > 180 ? p.moonPhaseDeg - 360 : p.moonPhaseDeg);
            const mx = clamp(dPhase * 3.2, -260, 260);
            const my = (mx - nodeX) * slope;

            // 月球圓盤
            const hitDist = Math.hypot(mx, my);
            const isEclipse = (!isFullHalf && hitDist < 54) || (isFullHalf && hitDist < 68);
            ctx.fillStyle = isFullHalf ? (hitDist < 42 ? '#B91C1C' : PALETTE.moon) : '#0F172A';
            ctx.strokeStyle = PALETTE.lunarOrb;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(mx, my, 29, 0, TAU); ctx.fill(); ctx.stroke();

            // 南北偏移指示雙箭頭 (當朔或望接近中心時強調為何錯過!)
            if (Math.abs(mx) < 40 && Math.abs(my) > 25) {
              ctx.strokeStyle = '#F87171';
              ctx.setLineDash([4, 3]);
              ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, my); ctx.stroke();
              ctx.setLineDash([]);
            }

            const betaDeg = Math.abs(Math.sin(nodeOffset * DEG) * tiltDeg);
            const statusTxt = isEclipse
              ? (isFullHalf ? '⚡ 位於食季交點附近：發生月食！' : '⚡ 位於食季交點附近：發生日食！')
              : `白道緯度偏移 ${betaDeg.toFixed(1)}°：月球南北掠過，不發生食相`;
            drawPill2D(ctx, statusTxt, 0, -158, isEclipse ? PALETTE.node : PALETTE.earth);
            drawPill2D(ctx, '黃道 Ecliptic', -215, 18, PALETTE.sun);
            drawPill2D(ctx, `白道 Lunar Path (${tiltDeg}°)`, 190, (190 - nodeX) * slope - 20, PALETTE.lunarOrb);
            break;
          }

          /* ---------------- 02 日食本影與半影：天空日冕與地表全食帶 ---------------- */
          case 1: {
            // 左側：觀測者仰望天空太陽視窗；右側：地表本影全食帶與半影俯視圖
            const isAnnular = p.moonDistMode === 1;
            const sunR = 72;
            const moonR = isAnnular ? 64 : 75;
            const skyCx = -135, skyCy = -10;

            // 計算月球相對太陽偏移
            const dx = p.eclipseProg * 145;
            const dy = -(p.obsOffsetKm / 2500) * 88;
            const sep = Math.hypot(dx, dy);
            const isTotality = !isAnnular && sep <= (moonR - sunR + 2.5);
            const isRing = isAnnular && sep <= (sunR - moonR + 2.5);

            // 天空背景隨遮蔽率變暗
            const cover = clamp(1 - sep / (sunR + moonR), 0, 1);
            ctx.fillStyle = isTotality ? '#030612' : `rgb(${Math.round(lerp(18, 6, cover))}, ${Math.round(lerp(52, 12, cover))}, ${Math.round(lerp(96, 28, cover))})`;
            ctx.beginPath(); ctx.roundRect(-285, -175, 295, 345, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.stroke();

            // 全食時綻放壯麗日冕與鑽石環!
            if (isTotality) {
              const cor = ctx.createRadialGradient(skyCx, skyCy, sunR * 0.9, skyCx, skyCy, sunR * 2.2);
              cor.addColorStop(0, 'rgba(255,255,255,0.95)');
              cor.addColorStop(0.3, 'rgba(186,230,253,0.45)');
              cor.addColorStop(1, 'rgba(56,189,248,0)');
              ctx.fillStyle = cor;
              ctx.beginPath(); ctx.arc(skyCx, skyCy, sunR * 2.2, 0, TAU); ctx.fill();
            }

            // 太陽圓盤
            ctx.fillStyle = PALETTE.sun;
            ctx.beginPath(); ctx.arc(skyCx, skyCy, sunR, 0, TAU); ctx.fill();

            // 月球黑圓盤遮擋
            ctx.fillStyle = '#050814';
            ctx.beginPath(); ctx.arc(skyCx + dx, skyCy + dy, moonR, 0, TAU); ctx.fill();
            ctx.strokeStyle = 'rgba(148,163,184,0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();

            const skyState = isTotality ? '🌑 日全食 (Total Eclipse - 日冕現身!)'
              : isRing ? '💍 日環食 (Annular - 偽本影金環!)'
                : sep < sunR + moonR ? '🌗 日偏食 (Partial Eclipse - 半影區)' : '☀️ 日食未開始 / 已復圓';
            drawPill2D(ctx, skyState, skyCx, -148, isTotality || isRing ? PALETTE.node : PALETTE.sun);
            drawPill2D(ctx, '觀測者仰望天空視角', skyCx, 145, PALETTE.land);

            // 右側：地表投影俯視地圖
            const mapCx = 155, mapCy = -10;
            ctx.fillStyle = '#0B2540';
            ctx.beginPath(); ctx.roundRect(25, -175, 260, 345, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.stroke();

            // 全食帶狹長紅金軌跡帶
            ctx.fillStyle = 'rgba(244, 63, 94, 0.25)';
            ctx.fillRect(35, mapCy - 11, 240, 22);
            ctx.strokeStyle = PALETTE.node;
            ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.moveTo(35, mapCy); ctx.lineTo(275, mapCy); ctx.stroke();
            ctx.setLineDash([]);

            // 半影大圓 (~3500km 半徑) 與 本影小黑點 (~180km 直徑)
            const shadowX = mapCx + p.eclipseProg * 95;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.58)';
            ctx.strokeStyle = PALETTE.lunarOrb;
            ctx.beginPath(); ctx.arc(shadowX, mapCy, 86, 0, TAU); ctx.fill(); ctx.stroke();

            if (!isAnnular) {
              ctx.fillStyle = '#000000';
              ctx.beginPath(); ctx.arc(shadowX, mapCy, 10, 0, TAU); ctx.fill();
            } else {
              ctx.strokeStyle = PALETTE.sun;
              ctx.lineWidth = 2.5;
              ctx.beginPath(); ctx.arc(shadowX, mapCy, 10, 0, TAU); ctx.stroke();
            }

            // 觀測者綠點
            const obsMapY = mapCy - (p.obsOffsetKm / 2500) * 88;
            ctx.fillStyle = PALETTE.land;
            ctx.beginPath(); ctx.arc(mapCx, obsMapY, 6.5, 0, TAU); ctx.fill();

            drawPill2D(ctx, '地表投影：狹長全食帶 vs 廣大半影', mapCx, -148, PALETTE.earth);
            drawPill2D(ctx, isAnnular ? '偽本影環食帶' : '本影全食帶 (~200km寬)', mapCx, mapCy + 28, PALETTE.node);
            drawPill2D(ctx, '半影偏食區 (~6000km)', shadowX, mapCy - 72, PALETTE.lunarOrb);
            drawPill2D(ctx, '觀測者位置', mapCx + 48, obsMapY, PALETTE.land);
            break;
          }

          /* ---------------- 03 瑞利散射與紅月亮光學剖面 ---------------- */
          case 2: {
            // 上半部：大氣瑞利散射與紅光折射幾何光路；下半部：地面望遠鏡血月視場
            ctx.strokeStyle = PALETTE.grid;
            ctx.beginPath(); ctx.moveTo(-285, 10); ctx.lineTo(285, 10); ctx.stroke();

            // 光學圖：太陽白光 -> 地球大氣層 -> 藍光散射 / 紅光折射入本影
            const ex = -120, ey = -85, er = 44;
            // 地球本影暗錐
            ctx.fillStyle = 'rgba(220, 38, 38, 0.16)';
            ctx.beginPath();
            ctx.moveTo(ex, ey - er); ctx.lineTo(250, ey - 14); ctx.lineTo(250, ey + 14); ctx.lineTo(ex, ey + er);
            ctx.closePath(); ctx.fill();

            // 入射白光
            [-1, 1].forEach(s => {
              const y0 = ey + s * (er + 4);
              ctx.strokeStyle = '#FEF08A'; ctx.lineWidth = 2.5;
              ctx.beginPath(); ctx.moveTo(-275, y0); ctx.lineTo(ex, y0); ctx.stroke();
              // 藍短波散射箭頭
              ctx.strokeStyle = PALETTE.earth; ctx.lineWidth = 1.8;
              for (let a = 0; a < 3; a++) {
                const ang = s * (0.5 + a * 0.45);
                ctx.beginPath(); ctx.moveTo(ex, y0);
                ctx.lineTo(ex + Math.cos(ang) * 34, y0 + Math.sin(ang) * 34);
                ctx.stroke();
              }
              // 紅長波向內折射
              ctx.strokeStyle = PALETTE.node; ctx.lineWidth = 2.4;
              ctx.beginPath(); ctx.moveTo(ex, y0); ctx.lineTo(185, ey - s * 10); ctx.stroke();
            });

            // 地球與藍色大氣環
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.75)';
            ctx.lineWidth = 7;
            ctx.beginPath(); ctx.arc(ex, ey, er + 3, 0, TAU); ctx.stroke();
            ctx.fillStyle = '#0C4A6E';
            ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU); ctx.fill();

            drawPill2D(ctx, '① 太陽白光', -220, ey - 22, PALETTE.sun);
            drawPill2D(ctx, '② 藍綠短波：瑞利散射濾除', ex + 10, ey - 76, PALETTE.earth);
            drawPill2D(ctx, '③ 紅橙長波：折射匯聚本影', 95, ey - 45, PALETTE.node);

            // 下半部：地面望遠鏡視場 (地球圓弧本影 vs 月球移動)
            const ty = 102;
            ctx.fillStyle = 'rgba(220, 38, 38, 0.18)';
            ctx.strokeStyle = 'rgba(244, 63, 94, 0.55)';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(0, ty, 66, 0, TAU); ctx.fill(); ctx.stroke();

            const mx = p.lunarProg * 155;
            const inUmb = clamp(1 - (Math.abs(mx) - 34) / 48, 0, 1);
            const dust = 1 - p.dustLevel * 0.68;
            const mr = Math.round(lerp(232, 205 * dust, inUmb));
            const mg = Math.round(lerp(236, 48 * dust, inUmb));
            const mb = Math.round(lerp(242, 32 * dust, inUmb));
            ctx.fillStyle = `rgb(${mr},${mg},${mb})`;
            ctx.beginPath(); ctx.arc(mx, ty, 28, 0, TAU); ctx.fill();

            drawPill2D(ctx, '望遠鏡視角：地球本影截面與血月色澤變化', 0, 182, PALETTE.moon);
            break;
          }

          /* ---------------- 04 引潮力與潮汐：海岸潮位站與曲線 ---------------- */
          case 3: {
            // 左側：海岸燈塔標尺即時水位；右側：24h 半日潮曲線 & 朔望大小潮比較
            const mRad = p.moonSynodic * DEG;
            const rotRad = (p.earthHour / 24) * TAU;
            const calcHeight = (hHr, synDeg) => {
              const r = (hHr / 24) * TAU;
              const m = synDeg * DEG;
              // 海岸站角度 r 與月球方向 m 的夾角為 (r - m)，太陽固定在 0
              return Math.cos(2 * (r - m)) * 1.0 + Math.cos(2 * r) * 0.46; // 範圍 [-1.46, +1.46] 公尺
            };
            const curH = calcHeight(p.earthHour, p.moonSynodic);

            // 左側海岸站水箱
            ctx.fillStyle = '#0F172A';
            ctx.beginPath(); ctx.roundRect(-280, -165, 195, 330, 10); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.stroke();

            const waterTopY = 15 - curH * 58;
            const wGrad = ctx.createLinearGradient(0, waterTopY, 0, 165);
            wGrad.addColorStop(0, 'rgba(6, 182, 212, 0.85)');
            wGrad.addColorStop(1, 'rgba(8, 51, 68, 0.95)');
            ctx.fillStyle = wGrad;
            ctx.beginPath();
            ctx.moveTo(-279, 164);
            ctx.lineTo(-279, waterTopY);
            for (let wx = -279; wx <= -86; wx += 16) {
              ctx.lineTo(wx, waterTopY + Math.sin(wx * 0.08 + p.earthHour * 3) * 3);
            }
            ctx.lineTo(-86, 164);
            ctx.closePath();
            ctx.fill();

            // 岩岸碼頭與水位標尺
            ctx.fillStyle = '#334155';
            ctx.fillRect(-279, -45, 48, 209);
            ctx.strokeStyle = '#CBD5E1';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-115, -105); ctx.lineTo(-115, 125); ctx.stroke();
            [-1.5, -1, 0, 1, 1.5].forEach(lv => {
              const ly = 15 - lv * 58;
              ctx.beginPath(); ctx.moveTo(-122, ly); ctx.lineTo(-108, ly); ctx.stroke();
            });

            drawPill2D(ctx, `即時潮位: ${curH >= 0 ? '+' : ''}${curH.toFixed(2)} m`, -182, -142, PALETTE.tide);
            drawPill2D(ctx, '海岸潮位觀測站', -182, 145, PALETTE.land);

            // 右側：24 小時潮汐曲線 (對比大潮極限虛線)
            const gx0 = -45, gx1 = 270, gyMid = 15;
            ctx.fillStyle = '#0F172A';
            ctx.beginPath(); ctx.roundRect(-65, -165, 350, 330, 10); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.stroke();

            // 平均海平面 0m 線
            ctx.strokeStyle = 'rgba(148,163,184,0.35)';
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(gx0, gyMid); ctx.lineTo(gx1, gyMid); ctx.stroke();
            ctx.setLineDash([]);

            // 朔望大潮參考淡曲線
            ctx.strokeStyle = 'rgba(251, 191, 36, 0.28)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let hr = 0; hr <= 24; hr += 0.25) {
              const x = lerp(gx0, gx1, hr / 24);
              const y = gyMid - calcHeight(hr, 0) * 58;
              hr === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 當前月相 24 小時潮汐實線
            ctx.strokeStyle = PALETTE.tide;
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let hr = 0; hr <= 24; hr += 0.2) {
              const x = lerp(gx0, gx1, hr / 24);
              const y = gyMid - calcHeight(hr, p.moonSynodic) * 58;
              hr === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 當前時刻紅點
            const curX = lerp(gx0, gx1, p.earthHour / 24);
            ctx.fillStyle = PALETTE.land;
            ctx.beginPath(); ctx.arc(curX, waterTopY, 6.5, 0, TAU); ctx.fill();

            const amp = Math.hypot(1 + 0.46 * Math.cos(2 * mRad), 0.46 * Math.sin(2 * mRad));
            const tideType = amp > 1.25 ? '🌊 大潮期 (Spring Tide - 日月疊加)' : amp < 0.72 ? '💧 小潮期 (Neap Tide - 直角抵銷)' : '🌊 中潮過渡期';
            drawPill2D(ctx, tideType, 110, -142, amp > 1.25 ? PALETTE.sun : PALETTE.lunarOrb);
            drawPill2D(ctx, '00:00      每日兩次滿潮與乾潮 (24h)      24:00', 110, 145, PALETTE.muted);
            break;
          }

          /* ---------------- 05 超級月亮：視直徑同框比對與潮汐連動 ---------------- */
          case 4: {
            const nu = p.anomalyDeg * DEG;
            // 真實視直徑比：近地點 33.5' vs 遠地點 29.4' (相差約 14%)；誇大模式更鮮明
            const realE = 0.055;
            const visE = p.eccMode ? 0.20 : 0.07;
            const rFactor = (1 - visE * visE) / (1 + visE * Math.cos(nu));
            const curR = 76 / rFactor;
            const superR = 76 / (1 - visE);
            const microR = 76 / (1 + visE);

            // 左半圓 vs 右半圓經典天文對比圖 (近地超級月亮 vs 遠地最小滿月)
            const cmpCx = -115, cmpCy = -5;
            ctx.save();
            ctx.beginPath(); ctx.rect(cmpCx - 150, cmpCy - 150, 150, 300); ctx.clip();
            ctx.fillStyle = '#F8FAFC';
            ctx.beginPath(); ctx.arc(cmpCx, cmpCy, superR, 0, TAU); ctx.fill();
            ctx.fillStyle = '#94A3B8';
            ctx.beginPath(); ctx.arc(cmpCx - superR * 0.35, cmpCy - superR * 0.2, superR * 0.22, 0, TAU); ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.beginPath(); ctx.rect(cmpCx, cmpCy - 150, 150, 300); ctx.clip();
            ctx.fillStyle = '#CBD5E1';
            ctx.beginPath(); ctx.arc(cmpCx, cmpCy, microR, 0, TAU); ctx.fill();
            ctx.fillStyle = '#64748B';
            ctx.beginPath(); ctx.arc(cmpCx + microR * 0.3, cmpCy + microR * 0.15, microR * 0.2, 0, TAU); ctx.fill();
            ctx.restore();

            ctx.strokeStyle = PALETTE.node;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(cmpCx, cmpCy - 125); ctx.lineTo(cmpCx, cmpCy + 125); ctx.stroke();

            drawPill2D(ctx, '近地點超級月亮 (+14%直徑 / +30%亮度)', cmpCx - 15, -148, PALETTE.node);
            drawPill2D(ctx, '左: 33.5′ 最大滿月 ｜ 右: 29.4′ 最小滿月', cmpCx, 148, PALETTE.moon);

            // 右側：即時觀測月球視大小與近地引潮力增幅計量條
            const liveCx = 148, liveCy = -22;
            ctx.strokeStyle = 'rgba(244,63,94,0.35)';
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.arc(liveCx, liveCy, superR, 0, TAU); ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#E2E8F0';
            ctx.beginPath(); ctx.arc(liveCx, liveCy, curR, 0, TAU); ctx.fill();

            const realArcmin = 31.1 * (1 + realE * Math.cos(nu)) / (1 - realE * realE);
            const tidalRel = Math.pow((1 + realE * Math.cos(nu)) / (1 - realE), 3); // 相對於遠地點最高可達 1.48x!
            drawPill2D(ctx, `即時視直徑: ${realArcmin.toFixed(1)} 角分`, liveCx, -148, PALETTE.lunarOrb);

            // 引潮力強度橫條
            ctx.fillStyle = '#1E293B';
            ctx.beginPath(); ctx.roundRect(45, 108, 210, 22, 6); ctx.fill();
            ctx.fillStyle = PALETTE.tide;
            ctx.beginPath(); ctx.roundRect(45, 108, clamp((tidalRel - 0.8) / 0.72, 0.15, 1) * 210, 22, 6); ctx.fill();
            drawPill2D(ctx, `月球引潮力 (∝1/r³): 遠地點的 ${(tidalRel).toFixed(2)} 倍`, liveCx, 148, PALETTE.tide);
            break;
          }

          /* ---------------- 06 緯度效應：立體天球地平穹頂與極晝極夜 ---------------- */
          case 5: {
            const phi = p.lat * DEG;
            const delta = solarDecl(p.seasonDeg);
            const hourNow = normDeg(p.localHour * 15) / 15;
            const H = (hourNow - 12) * 15 * DEG;
            const sunNow = sunAltAz(phi, delta, H);
            const altNowDeg = sunNow.alt * RAD;

            const dayHours = dayLengthHours(phi, delta);
            let statusTag;
            if (dayHours >= 24) statusTag = '☀️ 永晝現象 (24h 午夜太陽不落!)';
            else if (dayHours <= 0) statusTag = '🌌 永夜現象 (24h 太陽不升起)';
            else statusTag = `晝長 ${dayHours.toFixed(1)}h ｜ 夜長 ${(24 - dayHours).toFixed(1)}h ｜ 日出 ${fmtHM(12 - dayHours / 2)} 日落 ${fmtHM(12 + dayHours / 2)}`;

            const dome = drawSkyDome(ctx, { cx: 0, cy: 52, R: 152, skyBright: clamp((altNowDeg + 8) / 35, 0, 1) });
            // 全天 24h 太陽軌跡 + 每小時刻度點
            drawSunPath(ctx, dome, phi, delta, { color: PALETTE.sun, width: 3, hourTicks: true });

            // 觀測者影子 (指向太陽反方向，長度 ∝ cot(仰角))
            if (altNowDeg > 0.5) {
              const shadowLen = clamp(1 / Math.tan(sunNow.alt), 0, 4.5) * 0.17;
              const tip = dome.proj(0, sunNow.az + Math.PI, shadowLen);
              ctx.strokeStyle = 'rgba(244, 63, 94, 0.9)';
              ctx.lineWidth = 4;
              ctx.lineCap = 'round';
              ctx.beginPath(); ctx.moveTo(dome.cx, dome.cy + 4); ctx.lineTo(tip.x, tip.y); ctx.stroke();
              ctx.lineCap = 'butt';
            }

            // 太陽至觀測者的光線 + 當前太陽
            const sunPt = dome.proj(sunNow.alt, sunNow.az);
            if (altNowDeg >= 0) {
              ctx.strokeStyle = 'rgba(251, 191, 36, 0.35)';
              ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
              ctx.beginPath(); ctx.moveTo(sunPt.x, sunPt.y); ctx.lineTo(dome.cx, dome.cy - 8); ctx.stroke();
              ctx.setLineDash([]);
              const glow = ctx.createRadialGradient(sunPt.x, sunPt.y, 4, sunPt.x, sunPt.y, 26);
              glow.addColorStop(0, 'rgba(255, 251, 235, 0.9)');
              glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
              ctx.fillStyle = glow;
              ctx.beginPath(); ctx.arc(sunPt.x, sunPt.y, 26, 0, TAU); ctx.fill();
            }
            ctx.fillStyle = altNowDeg >= 0 ? PALETTE.sun : '#64748B';
            ctx.beginPath(); ctx.arc(sunPt.x, sunPt.y, 11, 0, TAU); ctx.fill();

            drawDomeObserver(ctx, dome);
            drawDomeCompass(ctx, dome);
            drawPill2D(ctx, statusTag, 0, -160, dayHours >= 24 ? PALETTE.sun : dayHours <= 0 ? PALETTE.lunarOrb : PALETTE.earth);
            drawPill2D(ctx, `地方時 ${fmtHM(hourNow)} ｜ 太陽仰角 ${altNowDeg.toFixed(1)}° ｜ 方位 ${azName(sunNow.az)}`, 0, 158, altNowDeg >= 0 ? PALETTE.sun : PALETTE.muted);
            if (altNowDeg < 0) drawPill2D(ctx, '太陽在地平線下 (夜晚)', sunPt.x, sunPt.y + 24, PALETTE.muted);
            break;
          }

          /* ---------------- 07 正午仰角與受熱影長實驗室 ---------------- */
          case 6: {
            const zenithDist = p.lat - p.decl; // >0 太陽在南天, <0 太陽在北天
            const noonAlt = Math.max(0, 90 - Math.abs(zenithDist));
            const altRad = noonAlt * DEG;
            const fluxPct = Math.sin(altRad) * 100;

            // 左側：垂直標竿 (Gnomon) 正午影長與量角器
            const groundY = 95, poleX = -135, poleH = 115;
            ctx.strokeStyle = '#64748B'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(-280, groundY); ctx.lineTo(15, groundY); ctx.stroke();

            // 影子
            const shadowDir = zenithDist >= 0 ? -1 : 1; // 太陽在南(右)則影子朝北(左)
            const shadowLen = noonAlt > 3 ? clamp(poleH / Math.tan(altRad), 0, 145) : 145;
            if (noonAlt > 0) {
              ctx.strokeStyle = '#F43F5E'; ctx.lineWidth = 6;
              ctx.beginPath(); ctx.moveTo(poleX, groundY); ctx.lineTo(poleX + shadowDir * shadowLen, groundY); ctx.stroke();

              // 陽光斜射線通過竿頂至影端
              ctx.strokeStyle = PALETTE.sun; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
              const rayDx = -shadowDir * Math.cos(altRad) * 190;
              const rayDy = -Math.sin(altRad) * 190;
              ctx.beginPath();
              ctx.moveTo(poleX + rayDx, groundY - poleH + rayDy);
              ctx.lineTo(poleX + shadowDir * shadowLen, groundY);
              ctx.stroke();
              ctx.setLineDash([]);
            }

            // 垂直綠竿
            ctx.strokeStyle = PALETTE.land; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.moveTo(poleX, groundY); ctx.lineTo(poleX, groundY - poleH); ctx.stroke();

            const ratioStr = noonAlt > 1 ? `${(1 / Math.tan(altRad)).toFixed(2)} 倍竿高` : '極長/永夜';
            drawPill2D(ctx, `正午太陽仰角: ${noonAlt.toFixed(1)}°`, -135, -152, PALETTE.sun);
            drawPill2D(ctx, `正午竿影長: ${ratioStr}`, -135, 138, PALETTE.node);
            drawPill2D(ctx, '北 N', -260, groundY - 16, PALETTE.muted);
            drawPill2D(ctx, '南 S', -5, groundY - 16, PALETTE.muted);

            // 右側：等寬太陽光束投射面積與能量密度熱網格 (W/m²)
            const bx = 155, by = 25;
            const beamW = 54;
            const spreadW = noonAlt > 8 ? clamp(beamW / Math.sin(altRad), beamW, 210) : 210;

            // 平行光束帶
            ctx.fillStyle = 'rgba(251, 191, 36, 0.22)';
            const incAng = Math.max(8 * DEG, altRad);
            const dxTop = Math.cos(incAng) * 135;
            const dyTop = -Math.sin(incAng) * 135;
            ctx.beginPath();
            ctx.moveTo(bx - spreadW * 0.5 + dxTop, by + dyTop);
            ctx.lineTo(bx + spreadW * 0.5 + dxTop, by + dyTop);
            ctx.lineTo(bx + spreadW * 0.5, by);
            ctx.lineTo(bx - spreadW * 0.5, by);
            ctx.closePath();
            ctx.fill();

            // 地表受熱能量網格俯視圖 (位於下方 by+35..by+105)
            const gridY = 65;
            const heatR = Math.round(lerp(56, 251, fluxPct / 100));
            const heatG = Math.round(lerp(130, 146, fluxPct / 100));
            const heatB = Math.round(lerp(246, 36, fluxPct / 100));
            ctx.fillStyle = `rgba(${heatR},${heatG},${heatB},0.45)`;
            ctx.strokeStyle = `rgb(${heatR},${heatG},${heatB})`;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.rect(bx - spreadW * 0.5, gridY - 26, spreadW, 52); ctx.fill(); ctx.stroke();

            // 單位面積格線 (每 18px 一單位面積)
            ctx.strokeStyle = 'rgba(255,255,255,0.38)';
            ctx.lineWidth = 1;
            for (let gx = bx - spreadW * 0.5 + 18; gx < bx + spreadW * 0.5; gx += 18) {
              ctx.beginPath(); ctx.moveTo(gx, gridY - 26); ctx.lineTo(gx, gridY + 26); ctx.stroke();
            }
            ctx.beginPath(); ctx.moveTo(bx - spreadW * 0.5, gridY); ctx.lineTo(bx + spreadW * 0.5, gridY); ctx.stroke();

            drawPill2D(ctx, `單位面積能量密度: ${fluxPct.toFixed(0)}%`, bx, -152, PALETTE.sun);
            drawPill2D(ctx, `同束陽光攤平面積: ${(1 / Math.max(0.12, Math.sin(altRad))).toFixed(2)}x`, bx, 138, PALETTE.earth);
            break;
          }

          /* ---------------- 08 8字形太陽軌跡 (Analemma) 與均時差 ---------------- */
          case 7: {
            // 精準天文公式計算全年 365 天正午太陽赤緯與均時差 (可獨立開關傾角與離心率!)
            const calcAnalemma = (day, tiltOn, eccOn) => {
              const eps = tiltOn ? 23.44 * DEG : 0;
              const e = eccOn ? 0.01671 : 0;
              const M = TAU * (day - 3) / 365.25; // 1月3日近日點
              const nu = M + 2 * e * Math.sin(M) + 1.25 * e * e * Math.sin(2 * M);
              const periLon = 282.9 * DEG;
              const meanLon = normDeg((M + periLon) * RAD) * DEG;
              const trueLon = normDeg((nu + periLon) * RAD) * DEG;
              const ra = Math.atan2(Math.cos(eps) * Math.sin(trueLon), Math.cos(trueLon));
              let dLon = meanLon - ra;
              while (dLon > Math.PI) dLon -= TAU;
              while (dLon < -Math.PI) dLon += TAU;
              const eotMin = dLon * RAD * 4; // 每度 = 4 分鐘!
              const decl = Math.asin(Math.sin(eps) * Math.sin(trueLon)) * RAD;
              return { eotMin, decl };
            };

            // 左側：南天正午 12:00 天空 8 字形軌跡視窗
            const skyCx = -130, skyCy = 5;
            ctx.fillStyle = '#0B192C';
            ctx.beginPath(); ctx.roundRect(-280, -170, 295, 340, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.stroke();

            // 正南子午線與天球赤道高度十字線
            ctx.strokeStyle = 'rgba(148,163,184,0.28)';
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(skyCx, -155); ctx.lineTo(skyCx, 155); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-265, skyCy); ctx.lineTo(0, skyCy); ctx.stroke();
            ctx.setLineDash([]);

            // 繪製全年 365 點 8 字形 Analemma
            ctx.strokeStyle = PALETTE.sun;
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            for (let d = 1; d <= 365; d += 2) {
              const r = calcAnalemma(d, p.tiltOn, p.eccOn);
              const x = skyCx - r.eotMin * 5.2; // 太陽快(eot>0)偏西(右)，太陽慢偏東(左)：面向南方時東在左、西在右 -> +eot 偏右!
              const rx = skyCx + r.eotMin * 5.2;
              const ry = skyCy - r.decl * 4.8;
              d === 1 ? ctx.moveTo(rx, ry) : ctx.lineTo(rx, ry);
            }
            ctx.closePath();
            ctx.stroke();

            // 當前日期的太陽亮點
            const cur = calcAnalemma(p.dayOfYear, p.tiltOn, p.eccOn);
            const curSkyX = skyCx + cur.eotMin * 5.2;
            const curSkyY = skyCy - cur.decl * 4.8;
            ctx.fillStyle = PALETTE.node;
            ctx.beginPath(); ctx.arc(curSkyX, curSkyY, 7.5, 0, TAU); ctx.fill();

            drawPill2D(ctx, '每天中午 12:00 天空太陽軌跡 (面向南方)', skyCx, -148, PALETTE.sun);
            drawPill2D(ctx, '東 E (偏慢)  ← 子午線 →  西 W (偏快)', skyCx, 148, PALETTE.muted);

            // 右側：全年均時差曲線圖 (Equation of Time: -16m ~ +17m)
            const gx0 = 42, gx1 = 272, gy0 = 5;
            ctx.fillStyle = '#0F172A';
            ctx.beginPath(); ctx.roundRect(25, -170, 262, 340, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.stroke();

            ctx.strokeStyle = 'rgba(148,163,184,0.35)';
            ctx.beginPath(); ctx.moveTo(gx0, gy0); ctx.lineTo(gx1, gy0); ctx.stroke();

            ctx.strokeStyle = PALETTE.earth;
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            for (let d = 1; d <= 365; d += 2) {
              const r = calcAnalemma(d, p.tiltOn, p.eccOn);
              const x = lerp(gx0, gx1, (d - 1) / 364);
              const y = gy0 - r.eotMin * 6.2;
              d === 1 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();

            const cxGraph = lerp(gx0, gx1, (p.dayOfYear - 1) / 364);
            const cyGraph = gy0 - cur.eotMin * 6.2;
            ctx.fillStyle = PALETTE.node;
            ctx.beginPath(); ctx.arc(cxGraph, cyGraph, 6.5, 0, TAU); ctx.fill();

            drawPill2D(ctx, `均時差: ${cur.eotMin >= 0 ? '+' : ''}${cur.eotMin.toFixed(1)} 分鐘`, 156, -148, PALETTE.earth);
            drawPill2D(ctx, `太陽赤緯: ${cur.decl >= 0 ? '+' : ''}${cur.decl.toFixed(1)}°`, 156, 148, PALETTE.node);
            break;
          }

          /* ---------------- 09 恆星日與太陽日：上中天子午線通過視窗 ---------------- */
          case 8: {
            const siderealH = 23.9344696;
            // 計算地球真正自轉度數：在 siderealH 恰好 360.0°，在 24.0h 為 360.986°
            const spinDeg = (p.rotHours / siderealH) * 360.0;
            const sunNeedDeg = 360.0 + (p.rotHours / 24.0) * 0.9856;

            // 上方：觀測者仰望「正南上中天子午線」放大望遠鏡視窗
            ctx.fillStyle = '#091426';
            ctx.beginPath(); ctx.roundRect(-275, -168, 550, 220, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.stroke();

            // 綠色中央上中天子午線
            ctx.strokeStyle = PALETTE.land;
            ctx.lineWidth = 2.5;
            ctx.setLineDash([6, 4]);
            ctx.beginPath(); ctx.moveTo(0, -165); ctx.lineTo(0, 50); ctx.stroke();
            ctx.setLineDash([]);

            // 將最後 1.5° 或最初 1.5° 放大顯示在視野中 (其餘時間顯示環繞進度)
            const wrapDiff = (cur, target) => {
              let d = (target - cur) % 360;
              if (d > 180) d -= 360;
              if (d < -180) d += 360;
              return d;
            };
            const starDeltaDeg = wrapDiff(spinDeg % 360, 0);
            const sunDeltaDeg = wrapDiff(spinDeg, sunNeedDeg);

            // 放大倍率：1° = 95 px，讓 0.986° 的差距一目了然!
            const starX = clamp(-starDeltaDeg * 95, -245, 245);
            const sunX = clamp(-sunDeltaDeg * 95, -245, 245);

            // 繪製遠方參考恆星 (青色十字星芒)
            ctx.strokeStyle = PALETTE.tide; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(starX - 14, -95); ctx.lineTo(starX + 14, -95); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(starX, -95 - 14); ctx.lineTo(starX, -95 + 14); ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(starX, -95, 4.5, 0, TAU); ctx.fill();

            // 繪製太陽圓盤 (位於下方軌道 y = -20)
            ctx.fillStyle = PALETTE.sun;
            ctx.beginPath(); ctx.arc(sunX, -20, 22, 0, TAU); ctx.fill();

            // 當接近 23h56m 時標出 0.986° (約 4 分鐘) 差距雙箭頭!
            if (p.rotHours > 22.5) {
              ctx.strokeStyle = PALETTE.node; ctx.lineWidth = 2;
              ctx.beginPath(); ctx.moveTo(starX, -58); ctx.lineTo(sunX, -58); ctx.stroke();
              drawPill2D(ctx, '相差約 0.986° (需多轉 3分56秒!)', (starX + sunX) * 0.5, -58, PALETTE.node);
            }

            drawPill2D(ctx, '正南上中天子午線 (Meridian)', 0, -148, PALETTE.land);
            drawPill2D(ctx, '遠方恆星', starX, -124, PALETTE.tide);
            drawPill2D(ctx, '太陽', sunX, 18, PALETTE.sun);

            // 下方：雙計時面板對照卡 (地球空間真實自轉角 vs 太陽時)
            ctx.fillStyle = '#0F172A';
            ctx.beginPath(); ctx.roundRect(-275, 68, 265, 98, 10); ctx.fill();
            ctx.strokeStyle = PALETTE.tide; ctx.stroke();
            drawPill2D(ctx, `空間真實自轉角: ${spinDeg.toFixed(2)}°`, -142, 96, PALETTE.tide);
            drawPill2D(ctx, spinDeg >= 359.95 && spinDeg <= 360.08 ? '✅ 滿 360° 恆星日達成 (23h 56m 04s)' : '恆星日週期 = 23h 56m 04s', -142, 136, PALETTE.tide);

            ctx.fillStyle = '#0F172A';
            ctx.beginPath(); ctx.roundRect(10, 68, 265, 98, 10); ctx.fill();
            ctx.strokeStyle = PALETTE.sun; ctx.stroke();
            drawPill2D(ctx, `太陽時鐘: ${fmtSiderealClock(p.rotHours)}`, 142, 96, PALETTE.sun);
            drawPill2D(ctx, p.rotHours >= 23.99 ? '✅ 360.99° 太陽日正午達成 (24h 00m)' : '太陽日週期 = 24h 00m 00s', 142, 136, PALETTE.sun);
            break;
          }

          /* ---------------- 10 內行星(金星)逆行軌跡與伽利略望遠鏡盈虧 ---------------- */
          case 9: {
            const mode = p.planetMode;
            const cfg = RETRO_CFG[mode];
            const cur = retroState(p.synodicProg, mode);
            const lonHalf = mode === 0 ? 34 : 26;
            const latC = mode === 0 ? 3 : 2;
            const hs = 262 / lonHalf;
            // 視窗黃經中心：逆行區間 (|lon-90°|<=22°) 固定鎖定在 90° 使背景恆星不動以清楚看見逆行倒退；
            // 遠離逆行區時平滑跟隨行星，確保整個會合週期 (0%~100%) 金星與火星永遠在畫面內可見！
            const dLonFrom90 = wrap180(cur.lon - 90);
            const panOffset = Math.abs(dLonFrom90) <= 18 ? 0 : (dLonFrom90 - Math.sign(dLonFrom90) * 18);
            const LON0 = normDeg(90 + panOffset);
            const mapPt = (lon, lat) => ({ x: -wrap180(lon - LON0) * hs, y: -72 - (lat - latC) * hs });
            const inView = (lon) => Math.abs(wrap180(lon - LON0)) < lonHalf + 1.5;
            const planetCol = mode === 0 ? PALETTE.venus : '#FB7185';

            // 上半部：背景恆星座標系 (黃道座標，面向南方：東在左、西在右)
            ctx.fillStyle = '#070E1E';
            ctx.beginPath(); ctx.roundRect(-285, -172, 570, 198, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.lineWidth = 1; ctx.stroke();
            ctx.save();
            ctx.beginPath(); ctx.rect(-283, -170, 566, 194); ctx.clip();

            // 黃經格線
            ctx.font = '600 9.5px -apple-system, "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const baseL = Math.floor((LON0 - lonHalf) / 5) * 5;
            for (let L = baseL; L <= LON0 + lonHalf + 5; L += 5) {
              if (!inView(L)) continue;
              const x = mapPt(L, 0).x;
              ctx.strokeStyle = L % 10 === 0 ? 'rgba(148,163,184,0.16)' : 'rgba(148,163,184,0.07)';
              ctx.beginPath(); ctx.moveTo(x, -170); ctx.lineTo(x, 24); ctx.stroke();
              if (L % 10 === 0) { ctx.fillStyle = 'rgba(148,163,184,0.6)'; ctx.fillText(`${normDeg(L)}°`, x, -4); }
            }
            // 黃道線
            const eclY = mapPt(LON0, 0).y;
            ctx.strokeStyle = 'rgba(251, 191, 36, 0.45)'; ctx.setLineDash([6, 5]);
            ctx.beginPath(); ctx.moveTo(-283, eclY); ctx.lineTo(283, eclY); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(251, 191, 36, 0.75)'; ctx.textAlign = 'left';
            ctx.fillText('黃道 (太陽的路徑)', -276, eclY + 9);
            ctx.textAlign = 'center';

            // 背景恆星與星座名 (位置永遠固定)
            SKY_STARS.forEach(st => {
              if (!inView(st.lon)) return;
              const s = mapPt(st.lon, st.lat);
              ctx.fillStyle = `rgba(226, 232, 240, ${clamp(1.15 - st.mag * 0.15, 0.25, 0.9)})`;
              ctx.beginPath(); ctx.arc(s.x, s.y, clamp(2.4 - st.mag * 0.33, 0.6, 2.0), 0, TAU); ctx.fill();
            });
            BRIGHT_STARS.forEach(st => {
              if (!inView(st.lon)) return;
              const s = mapPt(st.lon, st.lat);
              ctx.fillStyle = '#F1F5F9';
              ctx.beginPath(); ctx.arc(s.x, s.y, 3.2, 0, TAU); ctx.fill();
              ctx.fillStyle = 'rgba(203, 213, 225, 0.8)'; ctx.fillText(st.name, s.x, s.y + 11);
            });
            ctx.font = '700 11px -apple-system, "Noto Sans TC", sans-serif';
            ZODIAC.forEach(z => {
              if (!inView(z.lon)) return;
              const s = mapPt(z.lon, latC - 10.5 * (22 / lonHalf) * (mode === 0 ? 0.85 : 1));
              ctx.fillStyle = 'rgba(148, 163, 184, 0.55)'; ctx.fillText(z.name, s.x, Math.min(s.y, 14));
            });

            // 太陽在星圖上的位置 (金星永遠在太陽附近)
            if (inView(cur.sunLon)) {
              const sp = mapPt(cur.sunLon, 0);
              const sg = ctx.createRadialGradient(sp.x, sp.y, 3, sp.x, sp.y, 30);
              sg.addColorStop(0, 'rgba(255, 251, 235, 0.95)');
              sg.addColorStop(0.4, 'rgba(251, 191, 36, 0.55)');
              sg.addColorStop(1, 'rgba(251, 191, 36, 0)');
              ctx.fillStyle = sg;
              ctx.beginPath(); ctx.arc(sp.x, sp.y, 30, 0, TAU); ctx.fill();
              drawPill2D(ctx, '太陽', sp.x, sp.y + 26, PALETTE.sun);
            }

            // 完整視軌跡：已走過(亮)/未來(淡)，綠=順行、紅=逆行；小點間隔約 1/100 會合週期
            const dq = 0.002;
            let prev = retroState(0, mode);
            for (let q = dq; q <= 1.0001; q += dq) {
              const s2 = retroState(q, mode);
              if (inView(prev.lon) && inView(s2.lon)) {
                const isRetro = wrap180(s2.lon - prev.lon) < 0;
                const p1 = mapPt(prev.lon, prev.lat), p2 = mapPt(s2.lon, s2.lat);
                ctx.globalAlpha = q <= p.synodicProg ? 1 : 0.25;
                ctx.strokeStyle = isRetro ? PALETTE.node : PALETTE.land;
                ctx.lineWidth = isRetro ? 3.4 : 2.2;
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                if (Math.round(q / dq) % 5 === 0 && q <= p.synodicProg) {
                  ctx.fillStyle = isRetro ? PALETTE.node : PALETTE.land;
                  ctx.beginPath(); ctx.arc(p2.x, p2.y, 2.6, 0, TAU); ctx.fill();
                }
              }
              prev = s2;
            }
            ctx.globalAlpha = 1;
            // 「留」的位置標記
            [-1, 1].forEach(sgn => {
              let lastV = retroVelDegPerDay(0.5, mode);
              for (let q = 0.5; Math.abs(q - 0.5) < 0.2; q += sgn * 0.002) {
                const v = retroVelDegPerDay(q, mode);
                if (Math.sign(v) !== Math.sign(lastV)) {
                  const s = retroState(q, mode);
                  if (inView(s.lon)) {
                    const sp = mapPt(s.lon, s.lat);
                    ctx.strokeStyle = PALETTE.sun; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(sp.x, sp.y, 7, 0, TAU); ctx.stroke();
                    ctx.fillStyle = PALETTE.sun; ctx.font = '700 11px -apple-system, "Noto Sans TC", sans-serif';
                    ctx.fillText('留', sp.x, sp.y - 15);
                  }
                  break;
                }
                lastV = v;
              }
            });

            // 行星目前位置 (超出視野時顯示邊緣箭頭)
            const vel = retroVelDegPerDay(p.synodicProg, mode);
            if (inView(cur.lon)) {
              const cPt = mapPt(cur.lon, cur.lat);
              ctx.fillStyle = planetCol;
              ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2;
              ctx.beginPath(); ctx.arc(cPt.x, cPt.y, 7.5, 0, TAU); ctx.fill(); ctx.stroke();
              drawPill2D(ctx, cfg.name, cPt.x, cPt.y - 22, planetCol);
            } else {
              const side = wrap180(cur.lon - LON0) > 0 ? -1 : 1; // 黃經較大 → 東 → 左
              const ax = side * 262, ay = clamp(mapPt(cur.lon, cur.lat).y, -130, 0);
              ctx.fillStyle = planetCol;
              ctx.beginPath(); ctx.moveTo(ax + side * 14, ay); ctx.lineTo(ax, ay - 9); ctx.lineTo(ax, ay + 9); ctx.closePath(); ctx.fill();
              drawPill2D(ctx, `${cfg.name}在視野外 (${side < 0 ? '東' : '西'}方)`, ax - side * 70, ay, planetCol);
            }
            ctx.restore();

            const motionState = Math.abs(vel) < 0.06 ? `⏸ 留 (Stationary)：每天移動僅 ${vel.toFixed(2)}°`
              : vel < 0 ? `◀ 逆行中 (Retrograde)：每天向西 ${Math.abs(vel).toFixed(2)}°`
                : `▶ 順行中 (Prograde)：每天向東 ${vel.toFixed(2)}°`;
            drawPill2D(ctx, motionState, 0, -154, vel < 0 && Math.abs(vel) >= 0.06 ? PALETTE.node : Math.abs(vel) < 0.06 ? PALETTE.sun : PALETTE.land);
            drawPill2D(ctx, '← 東 East（順行方向）　　背景恆星座標系（黃道座標，面向南方）　　西 West（逆行方向）→', 0, 13, PALETTE.muted);

            // 下半部：伽利略高倍率望遠鏡視窗 (呈現盈虧相位與視直徑劇烈變化!)
            ctx.fillStyle = '#0B1324';
            ctx.beginPath(); ctx.roundRect(-285, 36, 570, 138, 12); ctx.fill();
            ctx.strokeStyle = planetCol; ctx.lineWidth = 1; ctx.stroke();

            const teleCx = -170, teleCy = 105;
            ctx.fillStyle = '#020617';
            ctx.beginPath(); ctx.arc(teleCx, teleCy, 58, 0, TAU); ctx.fill();
            ctx.strokeStyle = 'rgba(253, 224, 71, 0.45)'; ctx.lineWidth = 2; ctx.stroke();

            const appR = mode === 0 ? clamp(12.5 / cur.dist, 7, 46) : clamp(22 / cur.dist, 8, 42);
            ctx.save();
            ctx.translate(teleCx, teleCy);
            ctx.fillStyle = '#1E293B';
            ctx.beginPath(); ctx.arc(0, 0, appR, 0, TAU); ctx.fill();
            const litColor = mode === 0 ? '#FEF08A' : '#FB7185';
            ctx.fillStyle = litColor;
            ctx.beginPath();
            if (!cur.litEast) ctx.arc(0, 0, appR, -Math.PI / 2, Math.PI / 2, false); // 亮面朝西(右)
            else ctx.arc(0, 0, appR, Math.PI / 2, -Math.PI / 2, false);             // 亮面朝東(左)
            ctx.fill();
            const ellW = Math.abs(2 * cur.k - 1) * appR;
            ctx.fillStyle = cur.k >= 0.5 ? litColor : '#1E293B';
            ctx.beginPath(); ctx.ellipse(0, 0, ellW, appR, 0, 0, TAU); ctx.fill();
            ctx.restore();
            if (state.showLabels) {
              ctx.font = '600 10px -apple-system, "Noto Sans TC", sans-serif';
              ctx.fillStyle = 'rgba(148,163,184,0.8)'; ctx.textAlign = 'center';
              ctx.fillText('東', teleCx - 70, teleCy); ctx.fillText('西', teleCx + 70, teleCy);
            }

            const absE = Math.abs(cur.elong);
            let elongTxt;
            if (mode === 0) {
              elongTxt = absE < 8 ? `與太陽距角 ${absE.toFixed(0)}°：太靠近太陽，淹沒在陽光中`
                : `與太陽距角 ${absE.toFixed(0)}° → ${cur.elong < 0 ? '昏星 (黃昏見於西方天空)' : '晨星 (黎明見於東方天空)'}`;
            } else {
              elongTxt = absE > 168 ? `與太陽距角 ${absE.toFixed(0)}°：衝！整夜可見、最亮最大`
                : absE < 15 ? `與太陽距角 ${absE.toFixed(0)}°：合，隱沒在陽光中`
                  : `與太陽距角 ${absE.toFixed(0)}° → ${cur.elong < 0 ? '入夜後見於東/南方天空' : '後半夜至黎明可見'}`;
            }
            const arcsec = mode === 0 ? (16.8 / cur.dist) : (9.4 / cur.dist);
            const days = Math.round((p.synodicProg - 0.5) * cfg.synodic);
            drawPill2D(ctx, `望遠鏡相位: 照明率 ${(cur.k * 100).toFixed(0)}% ｜ 距${mode === 0 ? '下合' : '衝'} ${days >= 0 ? '+' : ''}${days} 天`, 75, 60, planetCol);
            drawPill2D(ctx, `地球距離: ${cur.dist.toFixed(2)} AU ｜ 視直徑: ${arcsec.toFixed(1)}″`, 75, 88, PALETTE.earth);
            drawPill2D(ctx, elongTxt, 75, 116, PALETTE.sun);
            drawPill2D(ctx, mode === 0 ? '哥白尼鐵證：下合逆行時呈巨大眉月、上合呈小滿月' : '外行星火星：衝日逆行時最亮最大且永遠接近滿相', 75, 148, PALETTE.lunarOrb);
            break;
          }

          /* ---------------- 11 二分二至與四季 ---------------- */
          case 10: {
            const phi = p.lat * DEG;
            const day = Math.round(clamp(p.dayOfYear, 1, 365));
            const lam = dayToSolarLon(p.dayOfYear);
            const delta = solarDecl(lam);
            const decDeg = delta * RAD;
            const EPS = 23.44 * DEG;
            const pathDefs = [
              { d: EPS, color: '#FB923C', name: '夏至' },
              { d: 0, color: '#F8FAFC', name: '春秋分' },
              { d: -EPS, color: '#60A5FA', name: '冬至' }
            ];

            // ===== 左：天球穹頂上的四個節氣太陽軌跡 =====
            ctx.fillStyle = '#0A1426';
            ctx.beginPath(); ctx.roundRect(-302, -178, 296, 356, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.lineWidth = 1; ctx.stroke();
            const noonAltNow = sunAltAz(phi, delta, 0).alt;
            const dome = drawSkyDome(ctx, { cx: -154, cy: 58, R: 124, skyBright: 0.55, flat: 0.3 });
            pathDefs.forEach(pd => {
              drawSunPath(ctx, dome, phi, pd.d, { color: pd.color, width: 1.8, below: false });
              const n = sunAltAz(phi, pd.d, 0);
              if (n.alt > 0 && state.showLabels) {
                const np = dome.proj(n.alt, n.az);
                ctx.font = '700 10.5px -apple-system, "Noto Sans TC", sans-serif';
                ctx.fillStyle = pd.color; ctx.textAlign = 'center';
                ctx.fillText(pd.name, np.x + (p.lat >= 0 ? 22 : -22), np.y - 2);
              }
            });
            drawSunPath(ctx, dome, phi, delta, { color: PALETTE.sun, width: 3.4, hourTicks: false });
            // 今日正午太陽與日出點
            const dl = dayLengthHours(phi, delta);
            if (dl > 0 && dl < 24) {
              const H0 = (dl / 2) * 15 * DEG;
              const rise = sunAltAz(phi, delta, -H0), set = sunAltAz(phi, delta, H0);
              [rise, set].forEach((r, i) => {
                const rp = dome.proj(0, r.az);
                ctx.fillStyle = i === 0 ? '#FB923C' : '#A78BFA';
                ctx.beginPath(); ctx.arc(rp.x, rp.y, 4.5, 0, TAU); ctx.fill();
              });
            }
            if (noonAltNow > 0) {
              const nn = sunAltAz(phi, delta, 0);
              const np = dome.proj(nn.alt, nn.az);
              ctx.fillStyle = PALETTE.sun;
              ctx.beginPath(); ctx.arc(np.x, np.y, 9, 0, TAU); ctx.fill();
            }
            drawDomeObserver(ctx, dome);
            drawDomeCompass(ctx, dome);
            const latTxt = p.lat === 0 ? '赤道 0°' : `${Math.abs(p.lat).toFixed(1)}°${p.lat > 0 ? 'N' : 'S'}`;
            drawPill2D(ctx, `觀測地 ${latTxt}：四個節氣的太陽軌跡`, -154, -160, PALETTE.land);
            const sName = seasonNameOfDay(day);
            drawPill2D(ctx, `${fmtDayOfYear(day).replace(/ \(.*\)/, '')}${sName ? ' ★' + sName : ''} ｜ 太陽直射 ${Math.abs(decDeg).toFixed(1)}°${decDeg >= 0 ? 'N' : 'S'}`, -154, 132, PALETTE.sun);
            let riseTxt = '無日出 (永夜)';
            if (dl >= 24) riseTxt = '太陽不落 (永晝)';
            else if (dl > 0) riseTxt = `日出${azName(sunAltAz(phi, delta, -(dl / 2) * 15 * DEG).az)}`;
            drawPill2D(ctx, `正午仰角 ${Math.max(0, noonAltNow * RAD).toFixed(1)}° ｜ 晝長 ${dl.toFixed(1)}h ｜ ${riseTxt}`, -154, 160, PALETTE.earth);

            // ===== 右上：世界地圖上的太陽直射點與晝夜分布 =====
            ctx.fillStyle = '#0A1426';
            ctx.beginPath(); ctx.roundRect(4, -178, 298, 172, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.stroke();
            const mx0 = 18, mx1 = 288, myC = -84, myH = 64;
            const mX = (lon) => lerp(mx0, mx1, (lon + 180) / 360);
            const mY = (lat) => myC - (lat / 90) * myH;
            ctx.fillStyle = '#0C3A5E';
            ctx.fillRect(mx0, myC - myH, mx1 - mx0, myH * 2);
            // 夜半球陰影
            const dEff = Math.abs(delta) < 0.003 ? 0.003 * (delta >= 0 ? 1 : -1) : delta;
            ctx.fillStyle = 'rgba(2, 6, 23, 0.68)';
            ctx.beginPath();
            for (let lon = -180; lon <= 180; lon += 3) {
              const latT = Math.atan(-Math.cos(lon * DEG) / Math.tan(dEff)) * RAD;
              lon === -180 ? ctx.moveTo(mX(lon), mY(latT)) : ctx.lineTo(mX(lon), mY(latT));
            }
            const edgeY = dEff > 0 ? mY(-90) : mY(90);
            ctx.lineTo(mx1, edgeY); ctx.lineTo(mx0, edgeY); ctx.closePath(); ctx.fill();
            // 緯線
            const latLine = (lat, color, dash, label) => {
              ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.setLineDash(dash);
              ctx.beginPath(); ctx.moveTo(mx0, mY(lat)); ctx.lineTo(mx1, mY(lat)); ctx.stroke(); ctx.setLineDash([]);
              if (label && state.showLabels) {
                ctx.font = '600 9.5px -apple-system, "Noto Sans TC", sans-serif';
                ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(label, mx0 + 3, mY(lat) - 5);
              }
            };
            latLine(66.56, 'rgba(167, 139, 250, 0.8)', [3, 3], '北極圈');
            latLine(23.44, 'rgba(251, 191, 36, 0.85)', [4, 3], '北回歸線 23.5°N');
            latLine(0, 'rgba(248, 250, 252, 0.7)', [], '赤道');
            latLine(-23.44, 'rgba(251, 191, 36, 0.85)', [4, 3], '南回歸線 23.5°S');
            latLine(-66.56, 'rgba(167, 139, 250, 0.8)', [3, 3], '南極圈');
            ctx.strokeStyle = PALETTE.land; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(mx0, mY(p.lat)); ctx.lineTo(mx1, mY(p.lat)); ctx.stroke();
            // 直射點
            const ssx = mX(0), ssy = mY(decDeg);
            const sg = ctx.createRadialGradient(ssx, ssy, 2, ssx, ssy, 18);
            sg.addColorStop(0, 'rgba(255, 251, 235, 1)'); sg.addColorStop(1, 'rgba(251, 191, 36, 0)');
            ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(ssx, ssy, 18, 0, TAU); ctx.fill();
            ctx.fillStyle = PALETTE.node; ctx.beginPath(); ctx.arc(ssx, ssy, 4.5, 0, TAU); ctx.fill();
            ctx.textAlign = 'center';
            drawPill2D(ctx, '世界地圖：太陽直射點 ● 與晝夜半球', 153, -162, PALETTE.sun);
            drawPill2D(ctx, `直射 ${Math.abs(decDeg).toFixed(1)}°${decDeg >= 0 ? 'N' : 'S'}`, ssx + 52, ssy, PALETTE.node);

            // ===== 右下：全年晝長與正午太陽仰角曲線 =====
            ctx.fillStyle = '#0A1426';
            ctx.beginPath(); ctx.roundRect(4, 2, 298, 176, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.stroke();
            const gx0 = 22, gx1 = 286, gy0 = 140, gy1 = 36;
            const gX = (d) => lerp(gx0, gx1, (d - 1) / 364);
            const gY = (v) => lerp(gy0, gy1, v);
            ctx.strokeStyle = 'rgba(148,163,184,0.2)'; ctx.lineWidth = 1;
            [0, 0.5, 1].forEach(v => { ctx.beginPath(); ctx.moveTo(gx0, gY(v)); ctx.lineTo(gx1, gY(v)); ctx.stroke(); });
            ctx.font = '600 9.5px -apple-system, "Noto Sans TC", sans-serif'; ctx.textAlign = 'center';
            SEASON_KEYS.forEach(k => {
              const x = gX(k.day);
              ctx.strokeStyle = 'rgba(148,163,184,0.35)'; ctx.setLineDash([3, 3]);
              ctx.beginPath(); ctx.moveTo(x, gy1 - 4); ctx.lineTo(x, gy0); ctx.stroke(); ctx.setLineDash([]);
              ctx.fillStyle = k.lon === 90 ? '#FB923C' : k.lon === 270 ? '#60A5FA' : '#E2E8F0';
              ctx.fillText(k.name, x, gy1 - 13);
            });
            ctx.fillStyle = 'rgba(148,163,184,0.7)';
            for (let m = 1; m <= 12; m++) ctx.fillText(`${m}`, gX(1 + (m - 1) * 30.4 + 15), gy0 + 11);
            const curve = (fn, color) => {
              ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.beginPath();
              for (let d = 1; d <= 365; d += 2) {
                const v = fn(solarDecl(dayToSolarLon(d)));
                d === 1 ? ctx.moveTo(gX(d), gY(v)) : ctx.lineTo(gX(d), gY(v));
              }
              ctx.stroke();
            };
            const fDay = (dd) => dayLengthHours(phi, dd) / 24;
            const fAlt = (dd) => Math.max(0, sunAltAz(phi, dd, 0).alt * RAD) / 90;
            curve(fDay, PALETTE.earth);
            curve(fAlt, PALETTE.sun);
            const cx = gX(day);
            ctx.strokeStyle = PALETTE.land; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(cx, gy1 - 4); ctx.lineTo(cx, gy0); ctx.stroke();
            ctx.fillStyle = PALETTE.earth; ctx.beginPath(); ctx.arc(cx, gY(fDay(delta)), 5, 0, TAU); ctx.fill();
            ctx.fillStyle = PALETTE.sun; ctx.beginPath(); ctx.arc(cx, gY(fAlt(delta)), 5, 0, TAU); ctx.fill();
            drawPill2D(ctx, `晝長 ${dl.toFixed(1)} h (0~24h)`, 78, 165, PALETTE.earth);
            drawPill2D(ctx, `正午仰角 ${Math.max(0, noonAltNow * RAD).toFixed(0)}° (0~90°)`, 222, 165, PALETTE.sun);
            break;
          }

          /* ---------------- 12 行星：天空中的漫遊者 ---------------- */
          case 11: {
            const targetKey = PLANET_KEYS[p.target];
            const tpl = PLANETS[targetKey];
            const days = p.days;
            const sunLon = sunGeoLon(days);
            const geoNow = {};
            PLANET_KEYS.forEach(k => { geoNow[k] = planetGeo(k, days); });
            const span = Math.min(p.trailDays, days);
            const stepD = Math.max(4, Math.round(span / 110));
            const trail = [];
            for (let d = days - span; d <= days + 0.01; d += stepD) {
              const g = planetGeo(targetKey, d);
              trail.push({ d, lon: g.lon, lat: g.lat });
            }
            for (let i = 0; i < trail.length; i++) {
              const a = trail[Math.max(0, i - 1)], b = trail[Math.min(trail.length - 1, i + 1)];
              trail[i].retro = wrap180(b.lon - a.lon) < 0;
            }
            const sF = ctx.font;

            // ===== 上：黃道帶 360° 全景 =====
            ctx.fillStyle = '#070E1E';
            ctx.beginPath(); ctx.roundRect(-302, -180, 604, 122, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.lineWidth = 1; ctx.stroke();
            const sX = (lon) => 288 - normDeg(lon) * (576 / 360);
            const sY = (lat) => -112 - lat * 2.4;
            // 縮放視窗範圍提示 (稍後計算後再畫，先決定視窗)
            const tl = geoNow[targetKey].lon;
            let lo = 0, hi = 0;
            trail.forEach(t => { const r = wrap180(t.lon - tl); lo = Math.min(lo, r); hi = Math.max(hi, r); });
            const needHalf = clamp((hi - lo) / 2 + 10, 22, 180);
            const needC = normDeg(tl + (lo + hi) / 2);
            if (wanderView.c === null || wanderView.target !== p.target || Math.abs(days - wanderView.lastDays) > 200) {
              wanderView.c = needC; wanderView.h = needHalf;
            } else {
              if (needHalf > wanderView.h || needHalf < wanderView.h * 0.55) wanderView.h += (needHalf - wanderView.h) * 0.12;
              const outside = Math.abs(wrap180(tl + lo - wanderView.c)) > wanderView.h * 0.85 || Math.abs(wrap180(tl + hi - wanderView.c)) > wanderView.h * 0.85;
              if (outside) wanderView.c = normDeg(wanderView.c + wrap180(needC - wanderView.c) * 0.1);
            }
            wanderView.target = p.target; wanderView.lastDays = days;
            const vC = wanderView.c, vH = wanderView.h;

            ctx.save();
            ctx.beginPath(); ctx.rect(-300, -178, 600, 118); ctx.clip();
            // 視窗範圍
            ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
            if (vH >= 179) ctx.fillRect(-288, -174, 576, 110);
            else {
              const xa = sX(vC + vH), xb = sX(vC - vH);
              if (xa < xb) ctx.fillRect(xa, -174, xb - xa, 110);
              else { ctx.fillRect(-288, -174, xb + 288, 110); ctx.fillRect(xa, -174, 288 - xa, 110); }
            }
            SKY_STARS.forEach(st => {
              if (Math.abs(st.lat) > 15) return;
              ctx.fillStyle = `rgba(226, 232, 240, ${clamp(1.1 - st.mag * 0.16, 0.2, 0.8)})`;
              ctx.fillRect(sX(st.lon), sY(st.lat), 1.4, 1.4);
            });
            ctx.strokeStyle = 'rgba(251, 191, 36, 0.35)'; ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.moveTo(-288, sY(0)); ctx.lineTo(288, sY(0)); ctx.stroke(); ctx.setLineDash([]);
            ctx.font = '600 9.5px -apple-system, "Noto Sans TC", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ZODIAC.forEach(z => { ctx.fillStyle = 'rgba(148, 163, 184, 0.75)'; ctx.fillText(z.name.replace('座', ''), sX(z.lon), sY(-15.5)); });
            trail.forEach(t => {
              ctx.fillStyle = t.retro ? PALETTE.node : PALETTE.land;
              ctx.fillRect(sX(t.lon) - 1, sY(t.lat) - 1, 2.4, 2.4);
            });
            // 太陽
            ctx.fillStyle = PALETTE.sun;
            ctx.beginPath(); ctx.arc(sX(sunLon), sY(0), 6, 0, TAU); ctx.fill();
            ctx.fillText('太陽', sX(sunLon), sY(0) - 13);
            PLANET_KEYS.forEach(k => {
              const g = geoNow[k], pl = PLANETS[k];
              ctx.fillStyle = pl.color;
              ctx.beginPath(); ctx.arc(sX(g.lon), sY(g.lat), k === targetKey ? 5 : 3.6, 0, TAU); ctx.fill();
              ctx.fillText(pl.name, sX(g.lon), sY(g.lat) + (k === targetKey ? 13 : 11));
            });
            ctx.restore();
            drawPill2D(ctx, '黃道帶 360° 全景（東 ← → 西）　藍框 = 下方放大區', 0, -166, PALETTE.muted);

            // ===== 下：放大星空 (同一時間每晚拍照疊圖) =====
            ctx.fillStyle = '#050B18';
            ctx.beginPath(); ctx.roundRect(-302, -50, 604, 194, 12); ctx.fill();
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)'; ctx.stroke();
            const zhs = 290 / vH;
            const zvs = Math.min(zhs, 7.2);
            const zX = (lon) => -wrap180(lon - vC) * zhs;
            const zY = (lat) => 47 - lat * zvs;
            const zIn = (lon) => Math.abs(wrap180(lon - vC)) <= vH + 2;
            ctx.save();
            ctx.beginPath(); ctx.rect(-300, -48, 600, 190); ctx.clip();
            const gridStep = vH > 90 ? 30 : vH > 45 ? 10 : 5;
            ctx.font = '600 9.5px -apple-system, "Noto Sans TC", sans-serif';
            for (let L = Math.ceil((vC - vH) / gridStep) * gridStep; L <= vC + vH; L += gridStep) {
              const x = zX(L);
              ctx.strokeStyle = 'rgba(148,163,184,0.09)';
              ctx.beginPath(); ctx.moveTo(x, -48); ctx.lineTo(x, 142); ctx.stroke();
              if (L % (gridStep * 2) === 0) { ctx.fillStyle = 'rgba(148,163,184,0.5)'; ctx.fillText(`${normDeg(L)}°`, x, 134); }
            }
            ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)'; ctx.setLineDash([6, 5]);
            ctx.beginPath(); ctx.moveTo(-300, zY(0)); ctx.lineTo(300, zY(0)); ctx.stroke(); ctx.setLineDash([]);
            SKY_STARS.forEach(st => {
              if (!zIn(st.lon)) return;
              ctx.fillStyle = `rgba(226, 232, 240, ${clamp(1.15 - st.mag * 0.15, 0.25, 0.9)})`;
              ctx.beginPath(); ctx.arc(zX(st.lon), zY(st.lat), clamp(2.5 - st.mag * 0.33, 0.6, 2.1), 0, TAU); ctx.fill();
            });
            BRIGHT_STARS.forEach(st => {
              if (!zIn(st.lon)) return;
              const x = zX(st.lon), y = zY(st.lat);
              ctx.fillStyle = '#F8FAFC';
              ctx.beginPath(); ctx.arc(x, y, 3.4, 0, TAU); ctx.fill();
              ctx.strokeStyle = 'rgba(248,250,252,0.6)'; ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y); ctx.moveTo(x, y - 7); ctx.lineTo(x, y + 7); ctx.stroke();
              ctx.fillStyle = 'rgba(203, 213, 225, 0.85)'; ctx.fillText(st.name, x, y + 13);
            });
            ctx.font = '700 12px -apple-system, "Noto Sans TC", sans-serif';
            ZODIAC.forEach(z => { if (zIn(z.lon)) { ctx.fillStyle = 'rgba(148, 163, 184, 0.5)'; ctx.fillText(z.name, zX(z.lon), zY(-10.5)); } });
            if (zIn(sunLon)) {
              const x = zX(sunLon), y = zY(0);
              const g2 = ctx.createRadialGradient(x, y, 3, x, y, 26);
              g2.addColorStop(0, 'rgba(255, 251, 235, 0.95)'); g2.addColorStop(1, 'rgba(251, 191, 36, 0)');
              ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(x, y, 26, 0, TAU); ctx.fill();
              ctx.fillStyle = PALETTE.sun; ctx.fillText('太陽', x, y + 26);
            }
            // 疊圖足跡：越舊越淡
            trail.forEach((t, i) => {
              if (!zIn(t.lon)) return;
              ctx.globalAlpha = 0.35 + 0.65 * (i / Math.max(1, trail.length - 1));
              ctx.fillStyle = t.retro ? PALETTE.node : PALETTE.land;
              ctx.beginPath(); ctx.arc(zX(t.lon), zY(t.lat), 3, 0, TAU); ctx.fill();
            });
            ctx.globalAlpha = 1;
            PLANET_KEYS.forEach(k => {
              const g = geoNow[k], pl = PLANETS[k];
              if (!zIn(g.lon)) return;
              const isT = k === targetKey;
              ctx.fillStyle = pl.color; ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2;
              ctx.beginPath(); ctx.arc(zX(g.lon), zY(g.lat), isT ? 8 : 5.5, 0, TAU); ctx.fill(); ctx.stroke();
              if (!isT) { ctx.font = '700 11px -apple-system, "Noto Sans TC", sans-serif'; ctx.fillStyle = pl.color; ctx.fillText(pl.name, zX(g.lon), zY(g.lat) - 13); }
            });
            ctx.restore();
            ctx.font = sF;
            const gT = geoNow[targetKey];
            if (zIn(gT.lon)) drawPill2D(ctx, `${tpl.name}`, zX(gT.lon), zY(gT.lat) - 22, tpl.color);
            const g1 = planetGeo(targetKey, days - 1), g2 = planetGeo(targetKey, days + 1);
            const vel = wrap180(g2.lon - g1.lon) / 2;
            const motion = Math.abs(vel) < 0.02 ? '⏸ 留' : vel < 0 ? '◀ 逆行 (向西)' : '▶ 順行 (向東)';
            drawPill2D(ctx, `${fmtDateFromDays(days)} ｜ ${tpl.name}位於 ${zodiacOf(gT.lon)} ｜ ${motion} ${Math.abs(vel).toFixed(2)}°/天`, 0, -34, Math.abs(vel) < 0.02 ? PALETTE.sun : vel < 0 ? PALETTE.node : PALETTE.land);

          /* ---------------- 13 地球自轉、歲差進動與米蘭科維奇循環 ---------------- */
          case 12: {
            // ===== 左半部：北天極 25,770 年歲差圓環與周日曝光星跡 =====
            ctx.fillStyle = '#070E1E';
            ctx.beginPath(); ctx.roundRect(-302, -178, 294, 356, 12); ctx.fill();
            ctx.strokeStyle = PALETTE.grid; ctx.lineWidth = 1; ctx.stroke();

            const cx = -155, cy = -4;
            // 歲差圓環半徑對應地軸傾角 (22.1°~24.5° 映射至 82~102 px)

            ctx.strokeStyle = 'rgba(251, 191, 36, 0.55)'; ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy); ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8); ctx.stroke();
            ctx.font = '600 9.5px -apple-system, "Noto Sans TC", sans-serif';
            ctx.fillStyle = 'rgba(251, 191, 36, 0.85)'; ctx.textAlign = 'center';
            ctx.fillText('黃道北極 (天龍座)', cx, cy + 16);

            // 25,770 年歲差圓環 (紫色虛線)
            ctx.strokeStyle = PALETTE.lunarOrb; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, TAU); ctx.stroke();
            ctx.setLineDash([]);

            // 計算當前北天極在圓環上的位置 (0 kyr 在正上方 -90°，逆時針繞行)
            const precAng = -Math.PI / 2 - (p.precKy / 25.77) * TAU;

            // 繪製繞「當前北天極 (ncpX, ncpY)」旋轉的 24 小時周日同心圓星跡！
            ctx.save();
            ctx.beginPath(); ctx.rect(-300, -176, 290, 352); ctx.clip();
            const trailRot = (performance.now() * 0.0008) % TAU;
            for (let r = 14; r <= 165; r += 19) {
              ctx.strokeStyle = r < 40 ? 'rgba(56, 189, 248, 0.38)' : 'rgba(148, 163, 184, 0.16)';

              ctx.beginPath(); ctx.arc(ncpX, ncpY, r, a0 + Math.PI, a0 + Math.PI + 1.6); ctx.stroke();
            }
