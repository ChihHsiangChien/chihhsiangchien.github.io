<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>互動天體運動與觀測雙視角模擬器 | AstroLab Dual-View</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --bg-deep: #060913;
    --bg-panel: rgba(15, 23, 42, 0.92);
    --bg-card: rgba(30, 41, 59, 0.72);
    --border-subtle: rgba(148, 163, 184, 0.18);
    --border-active: rgba(56, 189, 248, 0.65);
    --text-main: #F1F5F9;
    --text-muted: #94A3B8;

    /* 跨分頁統一科學視覺色票 */
    --c-sun: #FBBF24;       /* 太陽 / 黃道面 / 太陽光束 */
    --c-earth: #38BDF8;     /* 地球 / 天球地平 / 海洋 */
    --c-land: #10B981;      /* 地表觀測者 / 順行 / 陸地 */
    --c-moon: #E2E8F0;      /* 月球本體 */
    --c-lunar-orb: #A78BFA; /* 白道面 / 月球引力向量 */
    --c-node: #F43F5E;      /* 交點線 / 食季 / 紅光折射 / 逆行 */
    --c-tide: #06B6D4;      /* 潮汐海水 / 遠方恆星 */
    --c-venus: #FDE047;     /* 金星 / 行星視運動 */
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 14px;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
  }

  /* 頂部導覽列與分頁器 */
  header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    z-index: 30;
    flex-shrink: 0;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    gap: 8px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.1);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--c-sun);
    box-shadow: 0 0 10px var(--c-sun);
  }

  .global-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
  }

  .btn-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 32px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: rgba(30, 41, 59, 0.8);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .btn-pill:hover {
    border-color: rgba(148, 163, 184, 0.45);
    background: rgba(51, 65, 85, 0.85);
  }

  .btn-pill.active {
    background: rgba(56, 189, 248, 0.18);
    border-color: var(--c-earth);
    color: #7DD3FC;
  }

  .btn-pill.label-on {
    background: rgba(251, 191, 36, 0.16);
    border-color: var(--c-sun);
    color: #FDE68A;
  }

  .view-seg {
    display: flex;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    overflow: hidden;
  }

  .view-seg button {
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 0 9px;
    height: 30px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
    white-space: nowrap;
  }

  .view-seg button.active {
    background: rgba(56, 189, 248, 0.22);
    color: #fff;
  }

  /* 分頁捲動列 */
  .tabs-bar-wrap {
    display: flex;
    align-items: center;
    position: relative;
    padding: 4px 6px;
    gap: 4px;
  }

  .tab-scroll-btn {
    width: 28px;
    height: 32px;
    border-radius: 6px;
    border: 1px solid var(--border-subtle);
    background: rgba(30, 41, 59, 0.9);
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .tabs-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    flex: 1;
    padding: 2px 2px;
  }
  .tabs-strip::-webkit-scrollbar { display: none; }

  .tab-btn {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: rgba(30, 41, 59, 0.55);
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab-btn .num {
    font-size: 10.5px;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(148, 163, 184, 0.15);
    color: #CBD5E1;
    font-variant-numeric: tabular-nums;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.24), rgba(167, 139, 250, 0.22));
    border-color: var(--c-earth);
    color: #FFFFFF;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
  }

  .tab-btn.active .num {
    background: var(--c-earth);
    color: #060913;
    font-weight: 800;
  }

  /* 雙視角主舞台 */
  #stage {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
    min-height: 0;
    position: relative;
    background: var(--bg-deep);
  }

  #stage.mode-macro { grid-template-columns: 1fr; }
  #stage.mode-macro #ground-pane { display: none; }
  #stage.mode-ground { grid-template-columns: 1fr; }
  #stage.mode-ground #macro-pane { display: none; }

  .viewport-pane {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    touch-action: none;
  }

  #macro-pane {
    border-right: 1px solid var(--border-subtle);
    background: radial-gradient(circle at 50% 50%, #0D162C 0%, #050811 100%);
  }

  #ground-pane {
    background: #070C18;
  }

  .viewport-canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* 視角左上角標題徽章 */
  .pane-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 12;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 8px;
    background: rgba(15, 23, 42, 0.82);
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(6px);
    pointer-events: none;
    max-width: calc(100% - 140px);
  }

  .pane-badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .pane-badge-text {
    font-size: 12px;
    font-weight: 700;
    color: #E2E8F0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 視角右上角 Zoom & Pan 觸控輔助工具列 */
  .cam-tools {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 14;
    display: flex;
    gap: 4px;
    background: rgba(15, 23, 42, 0.82);
    border: 1px solid var(--border-subtle);
    padding: 3px;
    border-radius: 8px;
    backdrop-filter: blur(6px);
  }

  .cam-btn {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 6px;
    background: rgba(30, 41, 59, 0.85);
    color: #E2E8F0;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
  }

  .cam-btn:hover { background: rgba(51, 65, 85, 0.95); }
  .cam-btn.active {
    background: rgba(56, 189, 248, 0.28);
    color: #7DD3FC;
    box-shadow: inset 0 0 0 1px var(--c-earth);
  }

  /* 3D 浮動標籤層 */
  #macro-labels {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
  }

  .label-3d {
    position: absolute;
    transform: translate(-50%, -100%);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 700;
    background: rgba(9, 14, 28, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #F8FAFC;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.55);
    transition: opacity 0.15s;
  }

  /* 底部互動控制塢 (Step-by-Step + 參數控制 + 統一色票圖例) */
  #dock {
    background: var(--bg-panel);
    border-top: 1px solid var(--border-subtle);
    backdrop-filter: blur(14px);
    z-index: 25;
    flex-shrink: 0;
    transition: max-height 0.25s ease;
  }

  .dock-header-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 12px;
    background: rgba(15, 23, 42, 0.95);
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    gap: 8px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow-x: auto;
    scrollbar-width: none;
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .legend-row::-webkit-scrollbar { display: none; }

  .leg-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  .leg-swatch {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }

  .dock-toggle-btn {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid var(--border-subtle);
    color: #CBD5E1;
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }

  .dock-body {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 10px;
    padding: 8px 12px 10px;
    max-height: 235px;
    overflow-y: auto;
  }

  #dock.collapsed .dock-body {
    display: none;
  }

  /* Step-by-Step 教學卡片 */
  .step-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .step-controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
  }

  .step-nav-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .step-btn {
    height: 30px;
    padding: 0 9px;
    border-radius: 7px;
    border: 1px solid var(--border-subtle);
    background: rgba(15, 23, 42, 0.85);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .step-btn:hover { background: rgba(51, 65, 85, 0.9); }
  .step-btn.play-on {
    background: rgba(16, 185, 129, 0.2);
    border-color: var(--c-land);
    color: #6EE7B7;
  }

  .step-dots {
    display: flex;
    gap: 4px;
  }

  .step-dot {
    height: 28px;
    min-width: 30px;
    padding: 0 7px;
    border-radius: 6px;
    border: 1px solid var(--border-subtle);
    background: rgba(15, 23, 42, 0.65);
    color: var(--text-muted);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
  }

  .step-dot.active {
    background: var(--c-earth);
    border-color: var(--c-earth);
    color: #060913;
  }

  .step-info-box {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .step-title {
    font-size: 13px;
    font-weight: 700;
    color: #FDE68A;
  }

  .step-desc {
    font-size: 12px;
    line-height: 1.45;
    color: #CBD5E1;
    user-select: text;
  }

  /* 參數控制區 */
  .params-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    justify-content: center;
  }

  .ctrl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 8px 12px;
    align-items: center;
  }

  .ctrl-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .ctrl-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: #CBD5E1;
    font-weight: 600;
  }

  .ctrl-val {
    color: #7DD3FC;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 4px;
    background: rgba(148, 163, 184, 0.25);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--c-earth);
    border: 2px solid #fff;
    cursor: pointer;
    box-shadow: 0 1px 5px rgba(0,0,0,0.5);
  }

  .preset-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .preset-chip {
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-subtle);
    background: rgba(15, 23, 42, 0.8);
    color: #CBD5E1;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }

  .preset-chip.active, .preset-chip:hover {
    border-color: var(--c-earth);
    background: rgba(56, 189, 248, 0.22);
    color: #fff;
  }

  /* 平板與手機響應式調整 */
  @media (max-width: 900px) {
    #stage {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }
    #stage.mode-macro, #stage.mode-ground {
      grid-template-rows: 1fr;
    }
    #macro-pane {
      border-right: none;
      border-bottom: 1px solid var(--border-subtle);
    }
    .dock-body {
      grid-template-columns: 1fr;
      max-height: 220px;
    }
    .brand span.sub { display: none; }
  }

  @media (max-width: 520px) {
    .top-row { padding: 5px 8px; }
    .brand { font-size: 13.5px; }
    .btn-pill { padding: 0 8px; font-size: 11.5px; height: 29px; }
    .view-seg button { padding: 0 7px; font-size: 11.5px; height: 28px; }
    .tab-scroll-btn { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- 頂部導覽與 10 分頁切換器 -->
  <header>
    <div class="top-row">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>天體運動雙視角模擬器</span>
        <span class="sub" style="color:var(--text-muted);font-weight:500;font-size:12px;">Macro 3D × Ground Sky</span>
      </div>
      <div class="global-actions">
        <div class="view-seg" role="group" aria-label="視角模式">
          <button id="view-dual" class="active" title="雙視角同步並排">雙視角</button>
          <button id="view-macro" title="僅顯示太空3D上帝視角">太空</button>
          <button id="view-ground" title="僅顯示地表/光學微觀視角">地表</button>
        </div>
        <button id="btn-labels" class="btn-pill label-on" title="切換文字標籤顯示/隱藏 (快捷鍵 L)">
          🏷️ 標籤: 開
        </button>
      </div>
    </div>
    <div class="tabs-bar-wrap">
      <button class="tab-scroll-btn" id="tab-left" aria-label="向左捲動分頁">◀</button>
      <div class="tabs-strip" id="tabs-strip"></div>
      <button class="tab-scroll-btn" id="tab-right" aria-label="向右捲動分頁">▶</button>
    </div>
  </header>

  <!-- 雙視角互動主舞台 -->
  <main id="stage">
    <!-- 左/上：太空上帝視角 (Three.js 3D) -->
    <section id="macro-pane" class="viewport-pane">
      <div class="pane-badge">
        <span class="dot" style="background:var(--c-sun)"></span>
        <span class="pane-badge-text" id="macro-title">太空上帝視角 (Macro 3D)</span>
      </div>
      <div class="cam-tools">
        <button class="cam-btn" id="macro-pan-toggle" title="切換單指拖曳模式：旋轉視角 / 平移畫面">✢</button>
        <button class="cam-btn" id="macro-zoom-in" title="放大太空視角">＋</button>
        <button class="cam-btn" id="macro-zoom-out" title="縮小太空視角">－</button>
        <button class="cam-btn" id="macro-reset" title="重置太空視角">↺</button>
      </div>
      <canvas id="macro-canvas" class="viewport-canvas"></canvas>
      <div id="macro-labels"></div>
    </section>

    <!-- 右/下：地表沈浸與光學微觀視角 (2D Zoom/Pan Canvas) -->
    <section id="ground-pane" class="viewport-pane">
      <div class="pane-badge">
        <span class="dot" style="background:var(--c-land)"></span>
        <span class="pane-badge-text" id="ground-title">地表沈浸視角 (Ground View)</span>
      </div>
      <div class="cam-tools">
        <button class="cam-btn" id="ground-zoom-in" title="放大地表視角">＋</button>
        <button class="cam-btn" id="ground-zoom-out" title="縮小地表視角">－</button>
        <button class="cam-btn" id="ground-reset" title="重置地表視角">↺</button>
      </div>
      <canvas id="ground-canvas" class="viewport-canvas"></canvas>
    </section>
  </main>

  <!-- 底部控制塢：統一色票圖例 + Step-by-Step 流程控制 + 互動參數 -->
  <footer id="dock">
    <div class="dock-header-strip">
      <div class="legend-row">
        <span class="leg-item"><i class="leg-swatch" style="background:var(--c-sun)"></i>太陽 / 黃道</span>
        <span class="leg-item"><i class="leg-swatch" style="background:var(--c-earth)"></i>地球 / 天球</span>
        <span class="leg-item"><i class="leg-swatch" style="background:var(--c-lunar-orb)"></i>月球白道 / 引潮</span>
        <span class="leg-item"><i class="leg-swatch" style="background:var(--c-node)"></i>交點 / 紅光 / 逆行</span>
        <span class="leg-item"><i class="leg-swatch" style="background:var(--c-land)"></i>地表觀測者 / 順行</span>
        <span class="leg-item"><i class="leg-swatch" style="background:var(--c-tide)"></i>海洋潮位 / 遠方恆星</span>
      </div>
      <button class="dock-toggle-btn" id="btn-dock-collapse">收合面板 ▼</button>
    </div>
    <div class="dock-body">
      <!-- Step-by-Step 導覽區 -->
      <div class="step-panel">
        <div class="step-controls-row">
          <div class="step-nav-group">
            <button class="step-btn play-on" id="btn-play">⏸ 暫停</button>
            <button class="step-btn" id="btn-prev-step">◀ 上一步</button>
            <button class="step-btn" id="btn-next-step">下一步 ▶</button>
          </div>
          <div class="step-dots" id="step-dots"></div>
        </div>
        <div class="step-info-box">
          <div class="step-title" id="step-title">步驟載入中...</div>
          <div class="step-desc" id="step-desc"></div>
        </div>
      </div>

      <!-- 動態參數控制區 -->
      <div class="params-panel">
        <div class="ctrl-grid" id="ctrl-container"></div>
      </div>
    </div>
  </footer>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================
   * 1. 跨分頁統一色票與數學常數
   * ========================================================= */
  const PALETTE = {
    sun: '#FBBF24',

  function fmtDayOfYear(day) {
    const months = [31,28,31,30,31,30,31,31,30,31,30,31];
    let d = Math.round(clamp(day, 1, 365));
    let m = 0;
    while (m < 11 && d > months[m]) { d -= months[m]; m++; }
    return `${m + 1}月${d}日 (第${Math.round(day)}天)`;
  }

  function fmtSiderealClock(h) {
    const totalSec = Math.round(h * 3600);
    const hh = Math.floor(totalSec / 3600);
    const mm = Math.floor((totalSec % 3600) / 60);
    const ss = totalSec % 60;
    return `${String(hh).padStart(2,'0')}h ${String(mm).padStart(2,'0')}m ${String(ss).padStart(2,'0')}s`;
  }

  /* =========================================================
   * 4. 程序化高質感星球材質產生器 (零外部圖片依賴)
   * ========================================================= */
  function createEarthTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 256;
    const ctx = c.getContext('2d');
    // 海洋底色
    const grad = ctx.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#0F3A5D');
    grad.addColorStop(0.5, '#094E82');
    grad.addColorStop(1, '#0F3A5D');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 256);

    // 簡化大陸輪廓色塊 (有助觀察自轉與全食帶位置)
    ctx.fillStyle = '#15803D';
    const blobs = [
      // 歐亞非
      [270, 58, 95, 42], [355, 72, 65, 45], [272, 118, 48, 58],
      // 台灣與東亞島弧亮點
      [392, 92, 6, 10], [405, 76, 10, 14],
      // 澳洲
      [398, 168, 38, 26],
      // 北美與南美
      [105, 65, 65, 42], [148, 145, 36, 58]
    ];
    blobs.forEach(([x, y, rx, ry]) => {
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0.2, 0, TAU);
      ctx.fill();
    });
    // 台灣高亮綠點
    ctx.fillStyle = '#34D399';
    ctx.beginPath();
    ctx.ellipse(428, 95, 4, 7, 0.2, 0, TAU);
    ctx.fill();

    // 南北極冰冠
    ctx.fillStyle = 'rgba(241, 245, 249, 0.85)';
    ctx.fillRect(0, 0, 512, 14);
    ctx.fillRect(0, 242, 512, 14);

    // 經緯度輔助淡格線 + 赤道/回歸線
    ctx.strokeStyle = 'rgba(186, 230, 253, 0.18)';
    ctx.lineWidth = 1;
    for (let x = 0; x < 512; x += 512 / 12) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
    }
    for (let y = 32; y < 256; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
    }
    // 赤道線
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, 128); ctx.lineTo(512, 128); ctx.stroke();

    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  function createMoonTexture() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#CBD5E1';
    ctx.fillRect(0, 0, 256, 128);
    // 月海暗斑
    const maria = [[70,52,24],[98,46,18],[125,64,22],[165,55,16],[60,78,15],[195,72,19]];
    ctx.fillStyle = '#94A3B8';
    maria.forEach(([x,y,r]) => {
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    });
    // 隕石坑
    for (let i = 0; i < 45; i++) {
      const x = (i * 53) % 256;
      const y = 12 + ((i * 37) % 104);
      const r = 2 + (i % 5);
      ctx.fillStyle = i % 2 ? '#E2E8F0' : '#64748B';
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    return new THREE.CanvasTexture(c);
  }

  function createGlowTexture(innerCol, outerCol) {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
    g.addColorStop(0, innerCol);
    g.addColorStop(0.35, outerCol);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }

  // 背景星空粒子
  (function addStarfield() {
    const geo = new THREE.BufferGeometry();
    const count = 900;
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = 130 + Math.random() * 90;
      const u = Math.random() * 2 - 1;
      const a = Math.random() * TAU;
      const s = Math.sqrt(1 - u * u);
      pos[i * 3] = r * s * Math.cos(a);
      pos[i * 3 + 1] = r * u;
      pos[i * 3 + 2] = r * s * Math.sin(a);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xCBD5E1, size: 0.55, transparent: true, opacity: 0.65 });
    scene.add(new THREE.Points(geo, mat));
  })();

    target: new THREE.Vector3(0, 0, 0),
    updateCamera() {
      this.phi = clamp(this.phi, 0.12, Math.PI - 0.12);
      this.radius = clamp(this.radius, 5.5, 68);
      const sinP = Math.sin(this.phi);
      camera.position.set(
        this.target.x + this.radius * sinP * Math.sin(this.theta),
        this.target.y + this.radius * Math.cos(this.phi),
        this.target.z + this.radius * sinP * Math.cos(this.theta)
      );
      camera.lookAt(this.target);
    },
    panByScreenDelta(dx, dy) {
      const scale = this.radius * 0.0017;
      const forward = new THREE.Vector3().subVectors(this.target, camera.position).normalize();
      const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
      const up = new THREE.Vector3().crossVectors(right, forward).normalize();
      this.target.addScaledVector(right, -dx * scale);
      this.target.addScaledVector(up, dy * scale);
    },
    reset(spec) {
      this.theta = spec.theta;
      this.phi = spec.phi;
      this.radius = spec.radius;
      this.target.set(0, 0, 0);
    }
  };

  // 滑鼠與多點觸控手勢綁定 (Macro 3D)
  (function bindMacroInput() {
    let dragging = false;
    let isPanDrag = false;
    let lastX = 0, lastY = 0;
    let pinchDist = 0;
    let pinchMidX = 0, pinchMidY = 0;

    macroCanvas.addEventListener('contextmenu', e => e.preventDefault());
    macroCanvas.addEventListener('mousedown', e => {
      dragging = true;
      isPanDrag = state.macroPanMode || e.button === 2 || e.button === 1 || e.shiftKey;
      lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      state.tween = null;
      if (isPanDrag) {
        camRig.panByScreenDelta(dx, dy);
      } else {
        camRig.theta -= dx * 0.0065;
        camRig.phi -= dy * 0.0065;
      }
    });
    window.addEventListener('mouseup', () => { dragging = false; });

    macroCanvas.addEventListener('wheel', e => {
      e.preventDefault();
      state.tween = null;
      camRig.radius *= (1 + clamp(e.deltaY, -120, 120) * 0.0012);
    }, { passive: false });

    macroCanvas.addEventListener('touchstart', e => {
      state.tween = null;
      if (e.touches.length === 1) {
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      } else if (e.touches.length >= 2) {
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        pinchDist = Math.hypot(dx, dy);
        pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
        pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
      }
    }, { passive: false });

    macroCanvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - lastX;
        const dy = e.touches[0].clientY - lastY;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        if (state.macroPanMode) {
          camRig.panByScreenDelta(dx, dy);
        } else {
          camRig.theta -= dx * 0.007;
          camRig.phi -= dy * 0.007;
        }
      } else if (e.touches.length >= 2) {
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        const dist = Math.hypot(dx, dy);
        const midX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
        if (pinchDist > 8) {
          camRig.radius *= (pinchDist / dist);
        }
        camRig.panByScreenDelta(midX - pinchMidX, midY - pinchMidY);
        pinchDist = dist;
        pinchMidX = midX;
        pinchMidY = midY;
      }
    }, { passive: false });
  })();

  /* =========================================================
   * 6. 3D 浮動標籤投影系統 (支援一鍵顯示/隱藏)
   * ========================================================= */
  const activeLabels3D = [];
  function clearLabels3D() {
    activeLabels3D.length = 0;
    macroLabelLayer.innerHTML = '';
  }

  function addLabel3D(text, colorHexStr, offsetY = 0) {
    const el = document.createElement('div');
    el.className = 'label-3d';
    el.textContent = text;
    el.style.borderColor = colorHexStr || 'rgba(255,255,255,0.28)';
    el.style.color = colorHexStr || '#F8FAFC';
    macroLabelLayer.appendChild(el);
    const item = { el, worldPos: new THREE.Vector3(), offsetY, visible: true };
    activeLabels3D.push(item);
    return item;
  }

  const _projVec = new THREE.Vector3();
  function syncLabels3D() {
    if (!state.showLabels || state.viewMode === 'ground') {
      macroLabelLayer.style.display = 'none';
      return;
    }
    macroLabelLayer.style.display = 'block';
    const w = macroCanvas.clientWidth;
    const h = macroCanvas.clientHeight;
    for (const lb of activeLabels3D) {
      if (!lb.visible) { lb.el.style.display = 'none'; continue; }
      _projVec.copy(lb.worldPos);
      _projVec.y += lb.offsetY;
      _projVec.project(camera);
      if (_projVec.z > 1 || _projVec.z < -1) {
        lb.el.style.display = 'none';
        continue;
      }
      const x = (_projVec.x * 0.5 + 0.5) * w;
      const y = (-_projVec.y * 0.5 + 0.5) * h;
      lb.el.style.display = 'block';
      lb.el.style.left = `${x}px`;
      lb.el.style.top = `${y}px`;
    }
  }

  /* =========================================================
   * 7. 3D 幾何輔助建構函式
   * ========================================================= */
  function makeOrbitRing(rx, rz, colorHex, dashed = false, segments = 128) {
    const pts = [];
    for (let i = 0; i <= segments; i++) {
      const a = (i / segments) * TAU;
      pts.push(new THREE.Vector3(Math.cos(a) * rx, 0, Math.sin(a) * rz));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    if (dashed) {
      const mat = new THREE.LineDashedMaterial({ color: colorHex, dashSize: 0.4, gapSize: 0.25, transparent: true, opacity: 0.8 });
      const line = new THREE.Line(geo, mat);
      line.computeLineDistances();
      return line;
    }
    return new THREE.Line(geo, new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.85 }));
  }

  function makeSunMesh(radius = 1.6) {
    const g = new THREE.Group();
    const core = new THREE.Mesh(
      new THREE.SphereGeometry(radius, 32, 24),
      new THREE.MeshBasicMaterial({ color: PALETTE.sunHex })
    );
    const sprite = new THREE.Sprite(
      new THREE.SpriteMaterial({ map: sharedTextures.sunGlow, color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    sprite.scale.set(radius * 4.6, radius * 4.6, 1);
    g.add(core, sprite);
    return g;
  }

  function makeEarthMesh(radius = 1.35) {
    return new THREE.Mesh(
      new THREE.SphereGeometry(radius, 40, 28),
      new THREE.MeshStandardMaterial({ map: sharedTextures.earth, roughness: 0.72, metalness: 0.05 })
    );
  }

  function makeMoonMesh(radius = 0.42) {
    return new THREE.Mesh(
      new THREE.SphereGeometry(radius, 28, 20),
      new THREE.MeshStandardMaterial({ map: sharedTextures.moon, roughness: 0.9, metalness: 0.0 })
    );
  }

  /* =========================================================
   * 8. 各分頁專屬 Three.js 3D 場景建構與更新器
   * ========================================================= */
  const moduleRoot = new THREE.Group();
  scene.add(moduleRoot);
  let activeMacroUpdater = null;

  function disposeGroup(grp) {
    while (grp.children.length > 0) {
      const ch = grp.children[0];
      grp.remove(ch);
      if (ch.children && ch.children.length) disposeGroup(ch);
      if (ch.geometry) ch.geometry.dispose();
      if (ch.material) {
        if (Array.isArray(ch.material)) ch.material.forEach(m => m.dispose());
        else ch.material.dispose();
      }
    }
  }

  function buildMacroScene(tabIdx) {
    disposeGroup(moduleRoot);
    clearLabels3D();
    const ambient = new THREE.AmbientLight(0xffffff, 0.22);
    moduleRoot.add(ambient);

    switch (tabIdx) {
      /* ---------------- 01 黃白交角與交點 ---------------- */
      case 0: {
        const sunLight = new THREE.PointLight(0xffffff, 1.8, 100);
        moduleRoot.add(sunLight);
        const sun = makeSunMesh(1.55);
        moduleRoot.add(sun);

        // 黃道面圓盤與軌道環
        const eclipticDisc = new THREE.Mesh(
          new THREE.CircleGeometry(8.5, 72),
          new THREE.MeshBasicMaterial({ color: PALETTE.sunHex, transparent: true, opacity: 0.08, side: THREE.DoubleSide, depthWrite: false })
        );
        eclipticDisc.rotation.x = -Math.PI / 2;
        const eclipticRing = makeOrbitRing(8.5, 8.5, PALETTE.sunHex);
        moduleRoot.add(eclipticDisc, eclipticRing);

        // 食季扇形提示區 (X軸兩端 ±17°)
        const seasonMat = new THREE.MeshBasicMaterial({ color: PALETTE.nodeHex, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false });
        const s1 = new THREE.Mesh(new THREE.RingGeometry(2.2, 8.9, 24, 1, -0.3, 0.6), seasonMat);
        const s2 = new THREE.Mesh(new THREE.RingGeometry(2.2, 8.9, 24, 1, Math.PI - 0.3, 0.6), seasonMat);
        s1.rotation.x = -Math.PI / 2;
        s2.rotation.x = -Math.PI / 2;
        moduleRoot.add(s1, s2);

        // 地月系統樞紐
        const earthSystem = new THREE.Group();
        moduleRoot.add(earthSystem);

        const earth = makeEarthMesh(0.95);
        earthSystem.add(earth);

        // 地球背日陰影錐
        const earthShadow = new THREE.Mesh(
          new THREE.ConeGeometry(0.92, 5.2, 24, 1, true),
          new THREE.MeshBasicMaterial({ color: 0x050814, transparent: true, opacity: 0.58, side: THREE.DoubleSide, depthWrite: false })
        );
        earthSystem.add(earthShadow);

        // 白道面群組 (固定空間指向，交點線沿 X 軸)
        const lunarPlaneGrp = new THREE.Group();
        earthSystem.add(lunarPlaneGrp);

        const lunarDisc = new THREE.Mesh(
          new THREE.CircleGeometry(3.2, 48),
          new THREE.MeshBasicMaterial({ color: PALETTE.lunarOrbHex, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false })
        );
        lunarDisc.rotation.x = -Math.PI / 2;
        const lunarRing = makeOrbitRing(3.2, 3.2, PALETTE.lunarOrbHex);
        lunarPlaneGrp.add(lunarDisc, lunarRing);

        // 紅色交點線 (Line of Nodes) 與升降交點球
        const nodeLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-3.8, 0, 0), new THREE.Vector3(3.8, 0, 0)]);
        const nodeLine = new THREE.Line(nodeLineGeo, new THREE.LineBasicMaterial({ color: PALETTE.nodeHex }));
        const nodeSphereGeo = new THREE.SphereGeometry(0.16, 16, 12);
        const nodeMat = new THREE.MeshBasicMaterial({ color: PALETTE.nodeHex });
        const ascNode = new THREE.Mesh(nodeSphereGeo, nodeMat);
        const descNode = new THREE.Mesh(nodeSphereGeo, nodeMat);
        ascNode.position.set(3.2, 0, 0);
        descNode.position.set(-3.2, 0, 0);
        earthSystem.add(nodeLine, ascNode, descNode);

        const moon = makeMoonMesh(0.35);
        lunarPlaneGrp.add(moon);

        // 月球背日影錐
        const moonShadow = new THREE.Mesh(
          new THREE.ConeGeometry(0.34, 3.3, 18, 1, true),
          new THREE.MeshBasicMaterial({ color: 0x020617, transparent: true, opacity: 0.68, side: THREE.DoubleSide, depthWrite: false })
        );
        earthSystem.add(moonShadow);

        const lbSun = addLabel3D('太陽 Sun', PALETTE.sun, 1.9);
        const lbEcl = addLabel3D('黃道面 (Ecliptic)', PALETTE.sun, 0.3);
        const lbEarth = addLabel3D('地球', PALETTE.earth, 1.25);
        const lbLunar = addLabel3D('白道面 (傾角 5°)', PALETTE.lunarOrb, 0.4);
        const lbNodes = addLabel3D('交點線 (Line of Nodes)', PALETTE.node, 0.45);
        const lbSeason = addLabel3D('食季區 (Eclipse Season)', PALETTE.node, 0.25);

        activeMacroUpdater = (p, dt) => {
          if (state.playing && !state.tween) {
            p.moonPhaseDeg = normDeg(p.moonPhaseDeg + dt * 42);
            p.earthDeg = normDeg(p.earthDeg + dt * 3.4);
          }
          const eRad = p.earthDeg * DEG;
          const ex = Math.cos(eRad) * 8.5;
          const ez = Math.sin(eRad) * 8.5;
          earthSystem.position.set(ex, 0, ez);
          earth.rotation.y += dt * 0.9;

          const tiltRad = (p.exaggerateTilt ? 15.0 : 5.14) * DEG;
          lunarPlaneGrp.rotation.set(tiltRad, 0, 0); // 繞 X 軸傾斜 -> 交點線永遠沿 X 軸!

          // 月球世界角度 = 太陽方向(eRad + PI) + 月相角(moonPhaseDeg)
          // 如此一來 moonPhaseDeg = 0 永遠是朔(新月在日地間)，180 永遠是望(滿月在背日側)!
          const mWorldLon = eRad + Math.PI + p.moonPhaseDeg * DEG;
          const mx = Math.cos(mWorldLon) * 3.2;
          const mz = Math.sin(mWorldLon) * 3.2;
          moon.position.set(mx, 0, mz);

          // 背日方向向量
          const awayDir = new THREE.Vector3(ex, 0, ez).normalize();
          const qCone = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, -1, 0), awayDir);
          earthShadow.quaternion.copy(qCone);
          earthShadow.position.copy(awayDir).multiplyScalar(2.6);

          const moonWorld = new THREE.Vector3();
          moon.getWorldPosition(moonWorld);
          const moonLocal = moonWorld.clone().sub(earthSystem.position);
          moonShadow.quaternion.copy(qCone);
          moonShadow.position.copy(moonLocal).addScaledVector(awayDir, 1.65);

          lbSun.worldPos.set(0, 0, 0);
          lbEcl.worldPos.set(0, 0, 8.5);
          lbEarth.worldPos.copy(earthSystem.position);
          lbLunar.textContent = p.exaggerateTilt ? '白道面 (教學放大15°)' : '白道面 (真實5.1°)';
          lbLunar.el.textContent = lbLunar.textContent;
          lbLunar.worldPos.set(ex, Math.sin(tiltRad) * 3.2, ez + 3.0);
          lbNodes.worldPos.set(ex + 3.4, 0, ez);
          lbSeason.worldPos.set(6.4, 0, 0.8);
        };
        break;
      }

      /* ---------------- 02 日食本影與半影地表投影 ---------------- */
      case 1: {
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
        dirLight.position.set(0, 0, 30);
        moduleRoot.add(dirLight);

        // 遠處太陽光束方向示意
        const sunIndicator = makeSunMesh(1.1);
        sunIndicator.position.set(0, 0, 15.5);
        moduleRoot.add(sunIndicator);

        const earth = makeEarthMesh(3.2);
        earth.rotation.y = -2.1; // 面向東亞與太平洋
        moduleRoot.add(earth);

        const moon = makeMoonMesh(0.82);
        moduleRoot.add(moon);

        // 本影錐 (Umbra) 與 半影錐 (Penumbra)
        const umbraMat = new THREE.MeshBasicMaterial({ color: 0x02040A, transparent: true, opacity: 0.78, side: THREE.DoubleSide, depthWrite: false });
        const penumbraMat = new THREE.MeshBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.26, side: THREE.DoubleSide, depthWrite: false });
        const umbraCone = new THREE.Mesh(new THREE.ConeGeometry(0.82, 6.2, 32, 1, true), umbraMat);
        const penumbraCone = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 2.25, 6.2, 32, 1, true), penumbraMat);
        moduleRoot.add(umbraCone, penumbraCone);

        // 地表本影黑點與半影環
        const umbraSpot = new THREE.Mesh(
          new THREE.CircleGeometry(0.22, 24),
          new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })
        );
        const penumbraSpot = new THREE.Mesh(
          new THREE.CircleGeometry(1.55, 36),
          new THREE.MeshBasicMaterial({ color: 0x0F172A, transparent: true, opacity: 0.48, side: THREE.DoubleSide, depthWrite: false })
        );
        const antumbraRing = new THREE.Mesh(
          new THREE.RingGeometry(0.18, 0.28, 24),
          new THREE.MeshBasicMaterial({ color: PALETTE.sunHex, side: THREE.DoubleSide })
        );
        moduleRoot.add(penumbraSpot, umbraSpot, antumbraRing);

        // 地表狹長全食帶軌跡線
        const trackPts = [];
        for (let i = 0; i <= 60; i++) trackPts.push(new THREE.Vector3());
        const trackGeo = new THREE.BufferGeometry().setFromPoints(trackPts);
        const trackLine = new THREE.Line(trackGeo, new THREE.LineBasicMaterial({ color: PALETTE.nodeHex }));
        moduleRoot.add(trackLine);

        // 觀測者定位針
        const obsPin = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.landHex }));
        moduleRoot.add(obsPin);

        const lbMoon = addLabel3D('月球 Moon', PALETTE.moon, 1.0);
        const lbUmbra = addLabel3D('本影錐 (Umbra)', PALETTE.node, 0.4);
        const lbPen = addLabel3D('半影區 (Penumbra)', PALETTE.lunarOrb, 1.5);
        const lbTrack = addLabel3D('地表狹長全食帶', PALETTE.sun, 0.35);
        const lbObs = addLabel3D('地表觀測者', PALETTE.land, 0.32);

        function shadowHitEarth(prog) {
          const x = prog * 2.55;
          const y = 0.55 + prog * 0.42;
          const r2 = 3.2 * 3.2 - x * x - y * y;
          if (r2 <= 0.05) return null;
          return new THREE.Vector3(x, y, Math.sqrt(r2));
        }

        // 預先繪製完整全食帶弧線
        const fullTrack = [];
        for (let i = 0; i <= 60; i++) {
          const t = -0.92 + (i / 60) * 1.84;
          const pt = shadowHitEarth(t);
          if (pt) fullTrack.push(pt.multiplyScalar(1.012));
        }
        trackLine.geometry.setFromPoints(fullTrack);

        activeMacroUpdater = (p, dt) => {
          if (state.playing && !state.tween) {
            p.eclipseProg += dt * 0.22;
            if (p.eclipseProg > 1) p.eclipseProg = -1;
          }
          const isAnnular = p.moonDistMode === 1;
          const moonZ = isAnnular ? 9.9 : 8.5;
          const mx = p.eclipseProg * 2.55;
          const my = 0.55 + p.eclipseProg * 0.42;
          moon.position.set(mx, my, moonZ);
          earth.rotation.y = -2.1 + p.eclipseProg * 0.25;

          const coneLen = isAnnular ? 5.6 : 6.2;
          umbraCone.scale.set(1, coneLen / 6.2, 1);
          umbraCone.rotation.x = -Math.PI / 2;
          umbraCone.position.set(mx, my, moonZ - coneLen * 0.5);

          const penLen = moonZ - 2.6;
          penumbraCone.scale.set(1, penLen / 6.2, 1);
          penumbraCone.rotation.x = Math.PI / 2;
          penumbraCone.position.set(mx, my, moonZ - penLen * 0.5);

          const hit = shadowHitEarth(p.eclipseProg);
          if (hit) {
            const norm = hit.clone().normalize();
            const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), norm);
            umbraSpot.visible = !isAnnular;
            antumbraRing.visible = isAnnular;
            penumbraSpot.visible = true;
            umbraSpot.position.copy(hit).multiplyScalar(1.015);
            umbraSpot.quaternion.copy(q);
            antumbraRing.position.copy(hit).multiplyScalar(1.016);
            antumbraRing.quaternion.copy(q);
            penumbraSpot.position.copy(hit).multiplyScalar(1.008);
            penumbraSpot.quaternion.copy(q);
            lbTrack.visible = true;
            lbTrack.worldPos.copy(hit).multiplyScalar(1.04);
          } else {
            umbraSpot.visible = false;
            antumbraRing.visible = false;
            penumbraSpot.visible = false;
            lbTrack.visible = false;
          }

          // 觀測者位置 (位於 prog=0 附近，可南北偏移)
          const obsY = 0.55 + (p.obsOffsetKm / 2500) * 1.45;
          const obsZ = Math.sqrt(Math.max(0.2, 3.2 * 3.2 - obsY * obsY));
          obsPin.position.set(0, obsY, obsZ * 1.02);

          lbMoon.worldPos.copy(moon.position);
          lbUmbra.el.textContent = isAnnular ? '本影錐頂點未觸地(偽本影)' : '本影錐 (Umbra 全食錐)';
          lbUmbra.worldPos.set(mx, my, moonZ - 3.1);
          lbPen.worldPos.set(mx + 1.3, my + 0.8, moonZ - 3.6);
          lbObs.worldPos.copy(obsPin.position);
        };
        break;
      }

      /* ---------------- 03 地球大氣散射與月食紅月亮 ---------------- */
      case 2: {
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(-20, 0, 0);
        moduleRoot.add(sunLight);

        const sun = makeSunMesh(1.5);
        sun.position.set(-12.5, 0, 0);
        moduleRoot.add(sun);

        const earth = makeEarthMesh(2.0);
        earth.position.set(-2.5, 0, 0);
        moduleRoot.add(earth);

        // 地球藍色瑞利散射大氣光暈環
        const atmSprite = new THREE.Sprite(
          new THREE.SpriteMaterial({ map: sharedTextures.blueAtm, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        atmSprite.scale.set(5.4, 5.4, 1);
        atmSprite.position.copy(earth.position);
        moduleRoot.add(atmSprite);

        // 地球暗本影錐 + 大氣折射紅光錐
        const redConeMat = new THREE.MeshBasicMaterial({ color: 0xDC2626, transparent: true, opacity: 0.28, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
        const redCone = new THREE.Mesh(new THREE.ConeGeometry(2.02, 13.5, 36, 1, true), redConeMat);
        redCone.rotation.z = Math.PI / 2;
        redCone.position.set(4.25, 0, 0);
        moduleRoot.add(redCone);

        // 太陽光線段 -> 大氣邊緣 -> 藍光向外散射 + 紅光向內折射
        const rayGroup = new THREE.Group();
        [-1, 1].forEach(sign => {
          const yEdge = sign * 2.02;
          // 入射白光
          const wGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-11.2, yEdge, 0), new THREE.Vector3(-2.5, yEdge, 0)]);
          rayGroup.add(new THREE.Line(wGeo, new THREE.LineBasicMaterial({ color: 0xFEF08A })));
          // 散射藍光短線
          for (let k = 0; k < 3; k++) {
            const ang = sign * (0.45 + k * 0.38);
            const bGeo = new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(-2.5, yEdge, 0),
              new THREE.Vector3(-2.5 + Math.cos(ang) * 2.3, yEdge + Math.sin(ang) * 2.3, (k - 1) * 0.7)
            ]);
            rayGroup.add(new THREE.Line(bGeo, new THREE.LineBasicMaterial({ color: 0x38BDF8 })));
          }
          // 折射紅光匯聚至月球軌道
          const rGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-2.5, yEdge, 0),
            new THREE.Vector3(7.5, -sign * 0.35, 0)
          ]);
          rayGroup.add(new THREE.Line(rGeo, new THREE.LineBasicMaterial({ color: 0xF43F5E })));
        });
        moduleRoot.add(rayGroup);

        const moonMat = new THREE.MeshBasicMaterial({ map: sharedTextures.moon, color: 0xffffff });
        const moon = new THREE.Mesh(new THREE.SphereGeometry(0.68, 28, 20), moonMat);
        moduleRoot.add(moon);

        const lbSun = addLabel3D('太陽白光入射', PALETTE.sun, 1.8);
        const lbBlue = addLabel3D('短波藍光：瑞利散射濾除', PALETTE.earth, 0.5);
        const lbRed = addLabel3D('長波紅光：大氣折射入本影', PALETTE.node, 0.35);
        const lbMoon = addLabel3D('月全食「紅月亮」', PALETTE.node, 0.95);

        activeMacroUpdater = (p, dt) => {
          if (state.playing && !state.tween) {
            p.lunarProg += dt * 0.16;
            if (p.lunarProg > 1) p.lunarProg = -1;
          }
          earth.rotation.y += dt * 0.4;
          const mz = p.lunarProg * 3.8;
          moon.position.set(6.2, 0.15 * p.lunarProg, mz);

          // 根據與本影中心距離 + 大氣塵埃濃度計算月面血紅色澤
          const distFromAxis = Math.hypot(moon.position.y, moon.position.z);
          const inUmbra = clamp(1 - (distFromAxis - 0.85) / 1.1, 0, 1);
          const dustFactor = 1 - p.dustLevel * 0.68;
          const r = lerp(0.95, 0.88 * dustFactor, inUmbra);
          const g = lerp(0.95, 0.22 * dustFactor, inUmbra);
          const b = lerp(0.95, 0.12 * dustFactor, inUmbra);
          moonMat.color.setRGB(r, g, b);
          redConeMat.opacity = 0.14 + 0.22 * dustFactor;

          lbSun.worldPos.copy(sun.position);
          lbBlue.worldPos.set(-1.6, 3.1, 0);
          lbRed.worldPos.set(2.5, 1.15, 0);
          lbMoon.el.textContent = inUmbra > 0.65 ? '月全食「紅月亮 (Blood Moon)」' : '月球穿過地影';
          lbMoon.worldPos.copy(moon.position);
        };
        break;
      }

      /* ---------------- 04 日地月引力與潮汐現象 ---------------- */
      case 3: {
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(20, 2, 0);
        moduleRoot.add(sunLight);

        // 右側太陽方向指示
        const sun = makeSunMesh(1.35);
        sun.position.set(12.2, 0, 0);
        moduleRoot.add(sun);

        const earth = makeEarthMesh(1.85);
        moduleRoot.add(earth);

        // 海岸觀測站標記點 (隨地球自轉)
        const stationPin = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.landHex }));
        moduleRoot.add(stationPin);

        // 可即時四極變形的 3D 海洋潮汐橢球殼
        const waterGeo = new THREE.SphereGeometry(2.05, 48, 32);
        const basePos = Float32Array.from(waterGeo.attributes.position.array);
        const waterMat = new THREE.MeshPhongMaterial({
          color: PALETTE.tideHex,
          emissive: 0x083344,
          transparent: true,
          opacity: 0.46,
          shininess: 90
        });
        const waterShell = new THREE.Mesh(waterGeo, waterMat);
        moduleRoot.add(waterShell);

        const moonRing = makeOrbitRing(7.2, 7.2, PALETTE.lunarOrbHex, true);
        moduleRoot.add(moonRing);
        const moon = makeMoonMesh(0.6);
        moduleRoot.add(moon);

        // 赤道周圍 12 支引潮力差動向量箭頭
        const arrows = [];
        for (let i = 0; i < 12; i++) {
          const arr = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, PALETTE.lunarOrbHex, 0.28, 0.18);
          moduleRoot.add(arr);
          arrows.push(arr);
        }

        const lbSun = addLabel3D('太陽引力方向', PALETTE.sun, 1.6);
        const lbMoon = addLabel3D('月球 (主導引潮力)', PALETTE.lunarOrb, 0.85);
        const lbTide = addLabel3D('大潮雙隆起', PALETTE.tide, 2.55);
        const lbStation = addLabel3D('海岸潮位觀測站', PALETTE.land, 0.35);

        activeMacroUpdater = (p, dt) => {
          if (state.playing && !state.tween) {
            p.earthHour = (p.earthHour + dt * 2.6) % 24;
            p.moonSynodic = normDeg(p.moonSynodic + dt * 3.2);
          }
          // 太陽固定在 +X 方向 (角=0)，月球角度 = moonSynodic (0°朔在+X，180°望在-X)
          const mRad = p.moonSynodic * DEG;
          const mDir = new THREE.Vector3(Math.cos(mRad), 0, Math.sin(mRad));
          const sDir = new THREE.Vector3(1, 0, 0);
          moon.position.copy(mDir).multiplyScalar(7.2);

          // 地球自轉與觀測站位置
          const rotRad = (p.earthHour / 24) * TAU;
          earth.rotation.y = rotRad;
          stationPin.position.set(Math.cos(rotRad) * 1.92, 0.15, -Math.sin(rotRad) * 1.92);

          // 即時變形 3D 海水殼 (勒壤得多項式 P2(cosψ) = 0.5*(3cos²ψ - 1))
          const posAttr = waterGeo.attributes.position;
          const v = new THREE.Vector3();
          for (let i = 0; i < posAttr.count; i++) {
            v.set(basePos[i * 3], basePos[i * 3 + 1], basePos[i * 3 + 2]);
            const n = v.clone().normalize();
            const cosM = n.dot(mDir);
            const cosS = n.dot(sDir);
            const tideM = 0.5 * (3 * cosM * cosM - 1) * 0.52;
            const tideS = 0.5 * (3 * cosS * cosS - 1) * 0.24; // 太陽引潮力約月球 46%
            const rScale = 1 + (tideM + tideS) * 0.42;
            posAttr.setXYZ(i, basePos[i * 3] * rScale, basePos[i * 3 + 1] * rScale, basePos[i * 3 + 2] * rScale);
          }
          posAttr.needsUpdate = true;
          waterGeo.computeVertexNormals();

          // 更新差動引潮力向量箭頭
          arrows.forEach((arr, i) => {
            arr.visible = p.showVectors === 1;
            if (!arr.visible) return;
            const a = (i / 12) * TAU;
            const u = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
            // 潮汐力向量 F_tidal ∝ 3(u·d)d - u
            const fM = mDir.clone().multiplyScalar(3 * u.dot(mDir)).sub(u).multiplyScalar(0.45);
            const fS = sDir.clone().multiplyScalar(3 * u.dot(sDir)).sub(u).multiplyScalar(0.21);
            const fTot = fM.add(fS);
            const len = clamp(fTot.length(), 0.2, 1.55);
            arr.position.copy(u).multiplyScalar(2.35);
            arr.setDirection(fTot.normalize());
            arr.setLength(len, 0.26, 0.16);
          });

          const isSpring = Math.abs(Math.cos(mRad)) > 0.78;
          const isNeap = Math.abs(Math.cos(mRad)) < 0.35;
          lbTide.el.textContent = isSpring ? '朔望「大潮 (Spring Tide)」引力疊加' : isNeap ? '弦月「小潮 (Neap Tide)」直角抵銷' : '潮汐橢球過渡態';
          lbSun.worldPos.copy(sun.position);
          lbMoon.worldPos.copy(moon.position);
          lbTide.worldPos.set(0, 0, 0);
          lbStation.worldPos.copy(stationPin.position);
        };
        break;
      }

      /* ---------------- 05 超級月亮與橢圓軌道離心率 ---------------- */
      case 4: {
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.6);
        moduleRoot.add(sunLight);

        const earth = makeEarthMesh(1.45);
        moduleRoot.add(earth);

        // 海水潮位反應環
        const tideRing = new THREE.Mesh(
          new THREE.SphereGeometry(1.62, 32, 20),
          new THREE.MeshBasicMaterial({ color: PALETTE.tideHex, transparent: true, opacity: 0.32 })
        );
        moduleRoot.add(tideRing);

        // 動態橢圓軌道線 + 近地點/遠地點標記
        const orbitGeo = new THREE.BufferGeometry();
        const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: PALETTE.lunarOrbHex }));
        moduleRoot.add(orbitLine);

        const periDot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.nodeHex }));
        const apoDot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.earthHex }));
        moduleRoot.add(periDot, apoDot);

        const distLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(5, 0, 0)]);
        const distLine = new THREE.Line(distLineGeo, new THREE.LineDashedMaterial({ color: 0x94A3B8, dashSize: 0.3, gapSize: 0.2 }));
        moduleRoot.add(distLine);

        const moon = makeMoonMesh(0.58);
        moduleRoot.add(moon);

        const lbEarth = addLabel3D('地球 (位於橢圓焦點)', PALETTE.earth, 1.8);
        const lbPeri = addLabel3D('近地點 Perigee (35.6萬km)', PALETTE.node, 0.45);
        const lbApo = addLabel3D('遠地點 Apogee (40.7萬km)', PALETTE.earth, 0.45);
        const lbMoon = addLabel3D('月球', PALETTE.moon, 0.85);

        let lastEcc = -1;
        activeMacroUpdater = (p, dt) => {
          const e = p.eccMode === 1 ? 0.28 : 0.055;
          const a = 7.8;
          // 克卜勒第二定律：近地點角速度較快 (dν/dt ∝ (1 + e cosν)²)
          if (state.playing && !state.tween) {
            const nu = p.anomalyDeg * DEG;
            const speedFactor = Math.pow(1 + e * Math.cos(nu), 2);
            p.anomalyDeg = normDeg(p.anomalyDeg + dt * 28 * speedFactor);
          }

          if (e !== lastEcc) {
            lastEcc = e;
            const pts = [];
            for (let i = 0; i <= 128; i++) {
              const ang = (i / 128) * TAU;
              const r = (a * (1 - e * e)) / (1 + e * Math.cos(ang));
              pts.push(new THREE.Vector3(Math.cos(ang) * r, 0, Math.sin(ang) * r));
            }
            orbitGeo.setFromPoints(pts);
            periDot.position.set(a * (1 - e), 0, 0);
            apoDot.position.set(-a * (1 + e), 0, 0);
          }

          const sRad = p.sunDirDeg * DEG;
          sunLight.position.set(Math.cos(sRad) * 25, 3, Math.sin(sRad) * 25);

          const nu = p.anomalyDeg * DEG;
          const rOrb = (a * (1 - e * e)) / (1 + e * Math.cos(nu));
          moon.position.set(Math.cos(nu) * rOrb, 0, Math.sin(nu) * rOrb);
          earth.rotation.y += dt * 0.7;

          distLine.geometry.setFromPoints([new THREE.Vector3(0, 0, 0), moon.position.clone()]);
          distLine.computeLineDistances();

          // 近地引潮力 ∝ 1/r³ 視覺連動
          const tideBoost = Math.pow(a / rOrb, 3);
          tideRing.rotation.y = -nu;
          tideRing.scale.set(1 + 0.16 * tideBoost, 0.96, 1 - 0.05 * tideBoost);

          const realKm = Math.round(384400 * (1 - 0.055 * 0.055) / (1 + 0.055 * Math.cos(nu)));
          lbMoon.el.textContent = `月球 (距離 ${(realKm / 10000).toFixed(1)} 萬km)`;
          lbEarth.worldPos.set(0, 0, 0);
          lbPeri.worldPos.copy(periDot.position);
          lbApo.worldPos.copy(apoDot.position);
          lbMoon.worldPos.copy(moon.position);
        };
        break;
      }

      /* ---------------- 06 緯度效應與晝夜長短、極晝極夜 ---------------- */
      case 5: {
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.75);
        moduleRoot.add(sunLight);

        // 太陽光方向指示球
        const sun = makeSunMesh(1.1);
        moduleRoot.add(sun);

        // 地軸傾斜群組 (固定向北極星傾斜 23.44°)
        const tiltGroup = new THREE.Group();
        tiltGroup.rotation.z = -23.44 * DEG;
        moduleRoot.add(tiltGroup);

        // 自轉軸線 (北極N - 南極S)
        const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -4.6, 0), new THREE.Vector3(0, 4.6, 0)]);
        tiltGroup.add(new THREE.Line(axisGeo, new THREE.LineBasicMaterial({ color: PALETTE.lunarOrbHex })));

        const earth = makeEarthMesh(3.2);
        tiltGroup.add(earth);

        // 動態緯度平行圈 (顯示該緯度跨越向光側與背光側的比例!)
        const latRingGeo = new THREE.BufferGeometry();
        const latRing = new THREE.Line(latRingGeo, new THREE.LineBasicMaterial({ color: PALETTE.sunHex }));
        tiltGroup.add(latRing);

        // 觀測者定位點與切平面小圓盤
        const obsGroup = new THREE.Group();
        const obsDot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.landHex }));
        const horizonDisc = new THREE.Mesh(
          new THREE.CircleGeometry(0.65, 24),
          new THREE.MeshBasicMaterial({ color: PALETTE.landHex, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
        );
        obsGroup.add(obsDot, horizonDisc);
        tiltGroup.add(obsGroup);

        // 晨昏圈環 (永遠垂直於太陽光方向!)
        const termRing = makeOrbitRing(3.26, 3.26, PALETTE.nodeHex);
        moduleRoot.add(termRing);

        const lbAxis = addLabel3D('北極 N (地軸傾角 23.5°)', PALETTE.lunarOrb, 0.3);
        const lbTerm = addLabel3D('晨昏圈 (Terminator)', PALETTE.node, 0.35);
        const lbLat = addLabel3D('觀測緯度圈', PALETTE.sun, 0.25);
        const lbObs = addLabel3D('地表觀測者', PALETTE.land, 0.35);

        activeMacroUpdater = (p, dt) => {
          if (state.playing && !state.tween) {
            p.localHour = (p.localHour + dt * 2.2) % 24;
          }
          // 季節決定太陽相對於地軸傾斜方向的角度：seasonDeg=90(夏至)時太陽在 +X 側照亮北極!
          const sLon = (p.seasonDeg - 90) * DEG;
          const sunDir = new THREE.Vector3(Math.cos(sLon), 0, Math.sin(sLon));
          sunLight.position.copy(sunDir).multiplyScalar(25);
          sun.position.copy(sunDir).multiplyScalar(10.5);

          // 晨昏圈垂直於 sunDir
          const qTerm = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), sunDir);
          termRing.quaternion.copy(qTerm);

          // 更新緯度圈
          const latRad = p.lat * DEG;
          const rLat = Math.cos(latRad) * 3.24;
          const yLat = Math.sin(latRad) * 3.24;
          const pts = [];
          for (let i = 0; i <= 72; i++) {
            const a = (i / 72) * TAU;
            pts.push(new THREE.Vector3(Math.cos(a) * rLat, yLat, Math.sin(a) * rLat));
          }
          latRingGeo.setFromPoints(pts);

          // 地球自轉與觀測者地方時位置 (localHour=12 對準太陽方位)
          const hAngle = (p.localHour - 12) * 15 * DEG - sLon;
          earth.rotation.y = -hAngle;
          const ox = Math.cos(hAngle) * Math.cos(latRad) * 3.24;
          const oy = Math.sin(latRad) * 3.24;
          const oz = Math.sin(hAngle) * Math.cos(latRad) * 3.24;
          obsGroup.position.set(ox, oy, oz);
          const upNormal = obsGroup.position.clone().normalize();
          horizonDisc.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), upNormal);

          const northWorld = new THREE.Vector3(0, 4.6, 0).applyEuler(tiltGroup.rotation);
          lbAxis.worldPos.copy(northWorld);
          lbTerm.worldPos.set(0, 3.35, 0);
          const latLabelWorld = new THREE.Vector3(-rLat, yLat, 0).applyEuler(tiltGroup.rotation);
          lbLat.el.textContent = `緯度圈 ${Math.abs(p.lat).toFixed(1)}°${p.lat >= 0 ? 'N' : 'S'}`;
          lbLat.worldPos.copy(latLabelWorld);
          const obsWorld = new THREE.Vector3();
          obsDot.getWorldPosition(obsWorld);
          lbObs.worldPos.copy(obsWorld);
        };
        break;
      }

      /* ---------------- 07 正午太陽仰角與單位面積受熱量 ---------------- */
      case 6: {
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.75);
        sunLight.position.set(22, 0, 0);
        moduleRoot.add(sunLight);

        const earthGroup = new THREE.Group();
        moduleRoot.add(earthGroup);
        const earth = makeEarthMesh(3.3);
        earthGroup.add(earth);

        // 平行太陽光束組 (由右向左平行入射地球不同緯度)
        const beamGroup = new THREE.Group();
        for (let i = -3; i <= 3; i++) {
          const y = i * 0.85;
          const xHit = Math.sqrt(Math.max(0, 3.3 * 3.3 - y * y));
          const geo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(11.5, y, 0),
            new THREE.Vector3(xHit, y, 0)
          ]);
          beamGroup.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: PALETTE.sunHex, transparent: true, opacity: 0.72 })));
        }
        moduleRoot.add(beamGroup);

        // 直射點標記與觀測者正午立竿標記
        const subsolarDot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.sunHex }));
        subsolarDot.position.set(3.34, 0, 0);
        moduleRoot.add(subsolarDot);

        const gnomonGroup = new THREE.Group();
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.75, 12), new THREE.MeshBasicMaterial({ color: PALETTE.landHex }));
        pole.position.y = 0.375;
        gnomonGroup.add(pole);
        earthGroup.add(gnomonGroup);

        const lbSub = addLabel3D('太陽直射點 (仰角 90°)', PALETTE.sun, 0.35);
        const lbObs = addLabel3D('觀測地正午立竿', PALETTE.land, 0.55);
        const lbDist = addLabel3D('日地距離提示', PALETTE.earth, 0.2);

        activeMacroUpdater = (p, dt) => {
          // 旋轉地球使太陽赤緯 decl 正對 +X 方向陽光
          const declRad = p.decl * DEG;
          earthGroup.rotation.z = -declRad;
          earth.rotation.y = -0.35;

          // 觀測者在正午子午線上 (X-Y 平面向陽側)
          const latRad = p.lat * DEG;
          const gx = Math.cos(latRad) * 3.3;
          const gy = Math.sin(latRad) * 3.3;
          gnomonGroup.position.set(gx, gy, 0);
          gnomonGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(Math.cos(latRad), Math.sin(latRad), 0));

          const distAU = 1 - 0.0167 * Math.cos((p.decl + 23.44) / 46.88 * Math.PI);
          lbDist.el.textContent = p.decl > 10 ? `北半球夏季：遠日點附近 (${distAU.toFixed(3)} AU)` : p.decl < -10 ? `北半球冬季：近日點附近 (${distAU.toFixed(3)} AU)` : `春秋分距離 (${distAU.toFixed(3)} AU)`;
          lbDist.worldPos.set(7.2, -3.3, 0);
          lbSub.worldPos.set(3.45, 0, 0);
          const obsWorld = new THREE.Vector3();
          pole.getWorldPosition(obsWorld);
          lbObs.worldPos.copy(obsWorld);
        };
        break;
      }

      /* ---------------- 08 8字形太陽軌跡 (Analemma) 與均時差 ---------------- */
      case 7: {
        const sunLight = new THREE.PointLight(0xffffff, 1.9, 100);
        moduleRoot.add(sunLight);
        const sun = makeSunMesh(1.65);
        moduleRoot.add(sun);

        const orbitGeo = new THREE.BufferGeometry();
        const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: PALETTE.sunHex }));
        moduleRoot.add(orbitLine);

        const earthHolder = new THREE.Group();
        moduleRoot.add(earthHolder);
        const tiltHolder = new THREE.Group();
        earthHolder.add(tiltHolder);
        const earth = makeEarthMesh(1.05);
        tiltHolder.add(earth);

        const axisLine = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -1.8, 0), new THREE.Vector3(0, 1.8, 0)]),
          new THREE.LineBasicMaterial({ color: PALETTE.lunarOrbHex })
        );
        tiltHolder.add(axisLine);

        const periMarker = new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 10), new THREE.MeshBasicMaterial({ color: PALETTE.nodeHex }));
        const apheMarker = new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 10), new THREE.MeshBasicMaterial({ color: PALETTE.earthHex }));
        moduleRoot.add(periMarker, apheMarker);

        const lbSun = addLabel3D('太陽 (位於焦點)', PALETTE.sun, 1.95);
        const lbPeri = addLabel3D('1月初 近日點 (公轉最快)', PALETTE.node, 0.45);
        const lbAphe = addLabel3D('7月初 遠日點 (公轉最慢)', PALETTE.earth, 0.45);
        const lbEarth = addLabel3D('地球 (每日12:00快門)', PALETTE.land, 1.95);

        let cachedEcc = -1;
        activeMacroUpdater = (p, dt) => {
          if (state.playing && !state.tween) {
            p.dayOfYear = ((p.dayOfYear - 1 + dt * 36) % 365) + 1;
          }
          // 太空視覺適度放大橢圓度至 0.18 以便清楚看見焦點偏移與變速
          const visE = p.eccOn ? 0.18 : 0.0;
          const a = 8.6;
          if (visE !== cachedEcc) {
            cachedEcc = visE;
            const pts = [];
            for (let i = 0; i <= 128; i++) {
              const nu = (i / 128) * TAU;
              const r = (a * (1 - visE * visE)) / (1 + visE * Math.cos(nu));
              pts.push(new THREE.Vector3(Math.cos(nu) * r, 0, Math.sin(nu) * r));
            }
            orbitGeo.setFromPoints(pts);
            periMarker.position.set(a * (1 - visE), 0, 0);
            apheMarker.position.set(-a * (1 + visE), 0, 0);
          }
          periMarker.visible = p.eccOn === 1;
          apheMarker.visible = p.eccOn === 1;
          lbPeri.visible = p.eccOn === 1;
          lbAphe.visible = p.eccOn === 1;

          const M = ((p.dayOfYear - 3) / 365) * TAU;
          const nu = M + 2 * visE * Math.sin(M);
          const r = (a * (1 - visE * visE)) / (1 + visE * Math.cos(nu));
          earthHolder.position.set(Math.cos(nu) * r, 0, Math.sin(nu) * r);
          tiltHolder.rotation.z = p.tiltOn ? -23.44 * DEG : 0;

          lbSun.worldPos.set(0, 0, 0);
          lbPeri.worldPos.copy(periMarker.position);
          lbAphe.worldPos.copy(apheMarker.position);
          lbEarth.worldPos.copy(earthHolder.position);
        };
        break;
      }

      /* ---------------- 09 恆星日與太陽日的 4 分鐘差異 ---------------- */
      case 8: {
        const sunLight = new THREE.PointLight(0xffffff, 1.8, 100);
        moduleRoot.add(sunLight);

        const sun = makeSunMesh(1.65);
        sun.position.set(-6.5, 0, 0);
        sunLight.position.copy(sun.position);
        moduleRoot.add(sun);

        // 地球公轉圓弧軌道 (以太陽為圓心，半徑 11)
        const orbPts = [];
        for (let i = -35; i <= 35; i++) {
          const ang = (i * DEG);
          orbPts.push(new THREE.Vector3(-6.5 + Math.cos(ang) * 11, 0, -Math.sin(ang) * 11));
        }
        moduleRoot.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(orbPts), new THREE.LineDashedMaterial({ color: PALETTE.sunHex, dashSize: 0.4, gapSize: 0.25 })));

        // 起點地球殘影 (Day 0 位置: x = +4.5, z = 0)
        const ghostEarth = new THREE.Mesh(
          new THREE.SphereGeometry(1.15, 24, 16),
          new THREE.MeshBasicMaterial({ color: PALETTE.earthHex, wireframe: true, transparent: true, opacity: 0.22 })
        );
        ghostEarth.position.set(4.5, 0, 0);
        moduleRoot.add(ghostEarth);

        // 動態地球與觀測者子午線箭頭
        const earthGroup = new THREE.Group();
        moduleRoot.add(earthGroup);
        const earth = makeEarthMesh(1.2);
        earthGroup.add(earth);

        const meridianArrow = new THREE.ArrowHelper(new THREE.Vector3(-1, 0, 0), new THREE.Vector3(0, 0, 0), 3.6, PALETTE.landHex, 0.48, 0.3);
        earthGroup.add(meridianArrow);

        // 遠方參考恆星平行光參考線 (永遠朝 -X 方向!)
        const starLineGeo = new THREE.BufferGeometry();
        const starLine = new THREE.Line(starLineGeo, new THREE.LineDashedMaterial({ color: PALETTE.tideHex, dashSize: 0.35, gapSize: 0.2 }));
        moduleRoot.add(starLine);

        // 太陽連線 (地球 -> 太陽)
        const sunLineGeo = new THREE.BufferGeometry();
        const sunLine = new THREE.Line(sunLineGeo, new THREE.LineBasicMaterial({ color: PALETTE.sunHex, transparent: true, opacity: 0.75 }));
        moduleRoot.add(sunLine);

        const lbSun = addLabel3D('太陽 Sun', PALETTE.sun, 1.95);
        const lbStar = addLabel3D('← 遠方恆星方向 (平行視線 ∞)', PALETTE.tide, 0.35);
        const lbGhost = addLabel3D('起點位置 (00:00)', PALETTE.muted, 1.45);
        const lbEarth = addLabel3D('地球與子午線箭頭', PALETTE.land, 1.55);

        activeMacroUpdater = (p, dt) => {
          if (state.playing && !state.tween) {
            p.rotHours += dt * 3.2;
            if (p.rotHours > 24) p.rotHours = 0;
          }
          // 恆星日 = 23.9344696 小時 (自轉整整 360°)
          const siderealHours = 23.9344696;
          const orbDegPerSolarDay = p.exagOrbit ? 16.0 : 0.9856;
          const fracSolar = p.rotHours / 24.0;
          const orbRad = fracSolar * orbDegPerSolarDay * DEG;

          // 地球逆時針繞太陽公轉 (俯視由 +Y 看下去逆時針 => z 變負)
          const ex = -6.5 + Math.cos(orbRad) * 11;
          const ez = -Math.sin(orbRad) * 11;
          earthGroup.position.set(ex, 0, ez);

          // 自轉角度：在 t = siderealHours 時自轉恰好 2π (重新指向 -X 遠方恆星)；在 t = 24h 時自轉 2π + orbRad (重新指向太陽!)
          const spinRad = (p.rotHours / siderealHours) * TAU * (1 + (orbDegPerSolarDay * DEG) / TAU) / (24.0 / siderealHours);
          // 精確映射：讓 rotHours = siderealHours 時 spin = TAU，rotHours = 24.0 時 spin = TAU + orbRad!
          let exactSpin;
          if (p.rotHours <= siderealHours) {
            exactSpin = (p.rotHours / siderealHours) * TAU;
          } else {
            exactSpin = TAU + ((p.rotHours - siderealHours) / (24.0 - siderealHours)) * orbRad;
          }
          earth.rotation.y = exactSpin;
          const dirVec = new THREE.Vector3(-Math.cos(exactSpin), 0, Math.sin(exactSpin));
          meridianArrow.setDirection(dirVec);

          starLineGeo.setFromPoints([new THREE.Vector3(ex, 0, ez), new THREE.Vector3(ex - 11.5, 0, ez)]);
          starLine.computeLineDistances();
          sunLineGeo.setFromPoints([new THREE.Vector3(ex, 0, ez), sun.position.clone()]);

          lbSun.worldPos.copy(sun.position);
          lbStar.worldPos.set(ex - 7.8, 0, ez);
          lbGhost.worldPos.set(4.5, 0, 0);
          lbEarth.worldPos.set(ex, 0, ez);
        };
        break;
      }

      /* ---------------- 10 內行星(金星)逆行與相位變化 ---------------- */
      case 9: {
        const sunLight = new THREE.PointLight(0xffffff, 2.0, 120);
        moduleRoot.add(sunLight);
        const sun = makeSunMesh(1.3);
        moduleRoot.add(sun);

        const earthRing = makeOrbitRing(6.2, 6.2, PALETTE.earthHex);
        const targetRing = new THREE.Group();
        moduleRoot.add(earthRing, targetRing);

        const earth = makeEarthMesh(0.65);
        const targetPlanet = new THREE.Mesh(
          new THREE.SphereGeometry(0.55, 28, 20),
          new THREE.MeshStandardMaterial({ color: PALETTE.venusHex, roughness: 0.45 })
        );
        moduleRoot.add(earth, targetPlanet);

        // 背景黃道恆星圓弧天球幕 (位於 -Z 側 R=16.5)
        const screenGroup = new THREE.Group();
        const arcPts = [];
        for (let i = -70; i <= 70; i += 2) {
          const a = (i - 90) * DEG;
          arcPts.push(new THREE.Vector3(Math.cos(a) * 16.5, 0, Math.sin(a) * 16.5));
        }
        screenGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(arcPts), new THREE.LineBasicMaterial({ color: 0x334155 })));
        moduleRoot.add(screenGroup);

        // 視線投影線 (地球 -> 金星 -> 天球幕投影點)
        const sightGeo = new THREE.BufferGeometry();
        const sightLine = new THREE.Line(sightGeo, new THREE.LineDashedMaterial({ color: PALETTE.venusHex, dashSize: 0.35, gapSize: 0.2 }));
        const projDot = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.nodeHex }));
        moduleRoot.add(sightLine, projDot);

        // 天球幕上的視運動軌跡線
        const skyTrailGeo = new THREE.BufferGeometry();
        const skyTrailLine = new THREE.Line(skyTrailGeo, new THREE.LineBasicMaterial({ color: PALETTE.nodeHex }));
        moduleRoot.add(skyTrailLine);

        const lbSun = addLabel3D('太陽', PALETTE.sun, 1.6);
        const lbEarth = addLabel3D('地球觀測者', PALETTE.earth, 0.9);
        const lbPlanet = addLabel3D('金星 Venus', PALETTE.venus, 0.85);
        const lbProj = addLabel3D('背景恆星天球投影軌跡', PALETTE.node, 0.6);

        let lastMode = -1;
        function computePositions(prog, mode) {
          // 讓 prog = 0.5 時恰好在 -Z 方向發生內合(金星)或衝(火星)，使視線完美投射在 R=16.5 的天球幕!
          const t = prog - 0.5;
          if (mode === 0) {
            // 金星內行星: rV=4.48, rE=6.2
            const eAng = -Math.PI / 2 + t * 2.1;
            const vAng = -Math.PI / 2 + t * 5.52;
            const ePos = new THREE.Vector3(Math.cos(eAng) * 6.2, 0, Math.sin(eAng) * 6.2);
            const vPos = new THREE.Vector3(Math.cos(vAng) * 4.48, Math.sin(vAng) * 0.48, Math.sin(vAng) * 4.48);
            return { ePos, pPos: vPos };
          } else {
            // 火星外行星對比: rE=4.6, rM=7.2
            const eAng = -Math.PI / 2 + t * 4.2;
            const mAng = -Math.PI / 2 + t * 2.23;
            const ePos = new THREE.Vector3(Math.cos(eAng) * 4.6, 0, Math.sin(eAng) * 4.6);
            const mPos = new THREE.Vector3(Math.cos(mAng) * 7.2, Math.sin(mAng) * 0.55, Math.sin(mAng) * 7.2);
            return { ePos, pPos: mPos };
          }
        }

        function projectToScreen(ePos, pPos) {
          const dir = new THREE.Vector3().subVectors(pPos, ePos).normalize();
          // 求射線 ePos + s*dir 與 x² + z² = 16.5² 的交點 (s > 0)
          const A = dir.x * dir.x + dir.z * dir.z;
          const B = 2 * (ePos.x * dir.x + ePos.z * dir.z);
          const C = ePos.x * ePos.x + ePos.z * ePos.z - 16.5 * 16.5;
          const disc = Math.max(0, B * B - 4 * A * C);
          const s = (-B + Math.sqrt(disc)) / (2 * A);
          return ePos.clone().addScaledVector(dir, s);
        }

        activeMacroUpdater = (p, dt) => {
          if (state.playing && !state.tween) {
            p.synodicProg += dt * 0.065;
            if (p.synodicProg > 1) p.synodicProg = 0;
          }
          if (p.planetMode !== lastMode) {
            lastMode = p.planetMode;
            disposeGroup(targetRing);
            if (p.planetMode === 0) {
              earthRing.scale.set(1, 1, 1);
              targetRing.add(makeOrbitRing(4.48, 4.48, PALETTE.venusHex));
              targetPlanet.material.color.setHex(PALETTE.venusHex);
              lbPlanet.el.textContent = '內行星：金星 Venus';
            } else {
              earthRing.scale.set(4.6 / 6.2, 1, 4.6 / 6.2);
              targetRing.add(makeOrbitRing(7.2, 7.2, PALETTE.nodeHex));
              targetPlanet.material.color.setHex(0xFB7185);
              lbPlanet.el.textContent = '外行星：火星 Mars';
            }
          }

          const { ePos, pPos } = computePositions(p.synodicProg, p.planetMode);
          earth.position.copy(ePos);
          targetPlanet.position.copy(pPos);

          const hit = projectToScreen(ePos, pPos);
          projDot.position.copy(hit);
          sightGeo.setFromPoints([ePos, hit]);
          sightLine.computeLineDistances();

          // 繪製從 0.22 到目前進度 (或逆行區間) 的天球視軌跡
          const tPts = [];
          const maxT = Math.max(0.24, Math.min(0.78, p.synodicProg));
          for (let q = 0.22; q <= maxT; q += 0.008) {
            const st = computePositions(q, p.planetMode);
            if (st.pPos.z < st.ePos.z + 2.5) tPts.push(projectToScreen(st.ePos, st.pPos));
          }
          skyTrailGeo.setFromPoints(tPts);

          lbSun.worldPos.set(0, 0, 0);
          lbEarth.worldPos.copy(ePos);
          lbPlanet.worldPos.copy(pPos);
          lbProj.worldPos.copy(hit);
        };
        break;
      }
    }
  }

  /* =========================================================
   * 9. 2D 地表沈浸與光學視角引擎 (支援觸控 Pinch-Zoom & Pan)
   * ========================================================= */
  const groundCanvas = document.getElementById('ground-canvas');
  const gCtx = groundCanvas.getContext('2d');

  const groundCam = {
    zoom: 1.0,
    panX: 0,
    panY: 0,
    reset() { this.zoom = 1.0; this.panX = 0; this.panY = 0; }
  };

  (function bindGroundInput() {
    let dragging = false;
    let lx = 0, ly = 0;
    let pDist = 0, pMidX = 0, pMidY = 0;

    groundCanvas.addEventListener('mousedown', e => {
      dragging = true; lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      groundCam.panX += e.clientX - lx;
      groundCam.panY += e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener('mouseup', () => { dragging = false; });

    groundCanvas.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = groundCanvas.getBoundingClientRect();
      const cx = e.clientX - rect.left - rect.width * 0.5;
      const cy = e.clientY - rect.top - rect.height * 0.5;
      const factor = e.deltaY < 0 ? 1.1 : 0.91;
      const nextZ = clamp(groundCam.zoom * factor, 0.55, 3.8);
      const ratio = nextZ / groundCam.zoom;
      groundCam.panX = cx - (cx - groundCam.panX) * ratio;
      groundCam.panY = cy - (cy - groundCam.panY) * ratio;
      groundCam.zoom = nextZ;
    }, { passive: false });

    groundCanvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        lx = e.touches[0].clientX; ly = e.touches[0].clientY;
      } else if (e.touches.length >= 2) {
        pDist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
        pMidX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
        pMidY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
      }
    }, { passive: false });

    groundCanvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length === 1) {
        groundCam.panX += e.touches[0].clientX - lx;
        groundCam.panY += e.touches[0].clientY - ly;
        lx = e.touches[0].clientX; ly = e.touches[0].clientY;
      } else if (e.touches.length >= 2) {
        const d = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
        const mx = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
        const my = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
        if (pDist > 8) {
          groundCam.zoom = clamp(groundCam.zoom * (d / pDist), 0.55, 3.8);
        }
        groundCam.panX += mx - pMidX;
        groundCam.panY += my - pMidY;
        pDist = d; pMidX = mx; pMidY = my;
      }
    }, { passive: false });
  })();

  // 2D 標籤繪製輔助 (受全域 state.showLabels 開關控制)
  function drawPill2D(ctx, text, x, y, color = '#F8FAFC', align = 'center') {
    if (!state.showLabels) return;
    ctx.save();
    ctx.font = '700 12px -apple-system, "Noto Sans TC", sans-serif';
    const padX = 8;
    const tw = ctx.measureText(text).width + padX * 2;
    const th = 22;
    let bx = x - tw * 0.5;
    if (align === 'left') bx = x;
    if (align === 'right') bx = x - tw;
    const by = y - th * 0.5;

    ctx.fillStyle = 'rgba(9, 14, 28, 0.86)';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.roundRect(bx, by, tw, th, 5);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, bx + tw * 0.5, by + th * 0.5 + 0.5);
    ctx.restore();
  }

  /* =========================================================
   * 10. 各分頁專屬 2D 地表/光學微觀渲染器 (與 3D 即時同步)
   * ========================================================= */
  function renderGroundView(tabIdx, p) {
    if (state.viewMode === 'macro') return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = groundCanvas.clientWidth;
    const h = groundCanvas.clientHeight;
    if (w < 4 || h < 4) return;
    if (groundCanvas.width !== Math.round(w * dpr) || groundCanvas.height !== Math.round(h * dpr)) {
      groundCanvas.width = Math.round(w * dpr);
      groundCanvas.height = Math.round(h * dpr);
    }

    const ctx = gCtx;
    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.fillStyle = PALETTE.bgDark;
    ctx.fillRect(0, 0, w, h);

    // 套用使用者 Pan & Zoom 座標變換 (以畫布中心為基準 640x440 邏輯空間自動縮放)
    const baseScale = Math.min(w / 620, h / 430);
    ctx.translate(w * 0.5 + groundCam.panX, h * 0.5 + groundCam.panY);
    ctx.scale(baseScale * groundCam.zoom, baseScale * groundCam.zoom);

    switch (tabIdx) {
      /* ---------------- 01 黃白交角：天球交點與朔望偏移 ---------------- */
      case 0: {
        // 繪製天球局部視窗 (-290..290, -185..185)
        ctx.strokeStyle = PALETTE.grid;
        ctx.lineWidth = 1;
        for (let gx = -240; gx <= 240; gx += 60) {
          ctx.beginPath(); ctx.moveTo(gx, -165); ctx.lineTo(gx, 165); ctx.stroke();
        }
        for (let gy = -150; gy <= 150; gy += 50) {
          ctx.beginPath(); ctx.moveTo(-275, gy); ctx.lineTo(275, gy); ctx.stroke();
        }

        // 黃道線 (水平金色)
        ctx.strokeStyle = PALETTE.sun;
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(-275, 0); ctx.lineTo(275, 0); ctx.stroke();

        const isFullHalf = p.moonPhaseDeg > 90 && p.moonPhaseDeg < 270;
        const tiltDeg = p.exaggerateTilt ? 15 : 5.14;
        // 交點相對於當前中心的黃經偏移
        const targetLon = isFullHalf ? normDeg(p.earthDeg) : normDeg(p.earthDeg + 180);
        // 距離最近交點 (0° 或 180°) 的有號角距離 (-90..+90)
        let nodeOffset = ((targetLon + 90) % 180) - 90;
        const nodeX = -nodeOffset * 2.8;

        // 白道傾斜線 (紫色通過交點 nodeX)
        const slope = Math.tan((p.exaggerateTilt ? 22 : 9) * DEG);
