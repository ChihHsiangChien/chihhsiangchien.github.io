<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>複數函數 3D 視覺化 | Complex Wave Packet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand">
        <span class="badge">3D MATH</span>
        <h1>複數波包 3D 視覺化</h1>
      </div>

      <div class="equation-pill" title="複數高斯波包函數">
        <span>f(t) = e<sup>−γ(t−t₀)²</sup> (cos(ωt) + i·sin(ωt))</span>
      </div>

      <div class="top-actions">
        <button id="startBtn" class="primary-btn">▶ 開始</button>
        <button id="resetBtn" class="secondary-btn">🔄 重置</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace-grid">
      <!-- Left: 3D Main Viewport + Live Readout -->
      <section class="main-stage card">
        <div class="stage-header">
          <span class="stage-title">3D 複數空間 (Re, Im, t) · 可直接拖曳旋轉視角</span>
          <div class="live-readout">
            <span>t = <strong id="val-t">0.00</strong></span>
            <span>Re = <strong id="val-re">0.00</strong></span>
            <span>Im = <strong id="val-im">0.00</strong></span>
            <span>|f| = <strong id="val-mag">0.00</strong></span>
          </div>
        </div>
        <div class="main-canvas-wrap">
          <canvas id="mainCanvas"></canvas>
        </div>
      </section>

      <!-- Right: 3 Orthogonal Projections -->
      <aside class="projections-col">
        <div class="proj-card card">
          <div class="proj-label xy">XY 投影 · 實部-虛部 (Re / Im)</div>
          <div class="proj-canvas-wrap"><canvas id="projectionXY"></canvas></div>
        </div>
        <div class="proj-card card">
          <div class="proj-label yz">YZ 投影 · 虛部-時間 (t / Im)</div>
          <div class="proj-canvas-wrap"><canvas id="projectionYZ"></canvas></div>
        </div>
        <div class="proj-card card">
          <div class="proj-label xz">XZ 投影 · 實部-時間 (Re / t)</div>
          <div class="proj-canvas-wrap"><canvas id="projectionXZ"></canvas></div>
        </div>
      </aside>
    </main>

    <!-- Bottom Interactive Controls -->
    <footer class="controls-dock">
      <div class="slider-item">
        <label for="timeSlider">時間 t: <strong id="lbl-time">0.00</strong></label>
        <input type="range" id="timeSlider" min="0" max="400" value="0" />
      </div>

      <div class="slider-item">
        <label for="rotationSlider">水平視角: <strong id="lbl-rot">35°</strong></label>
        <input type="range" id="rotationSlider" min="0" max="360" value="35" />
      </div>

      <div class="slider-item">
        <label for="omegaSlider">角頻率 ω: <strong id="lbl-omega">2.0π</strong></label>
        <input type="range" id="omegaSlider" min="1" max="6" step="0.25" value="2" />
      </div>

      <div class="slider-item">
        <label for="gammaSlider">衰減 γ: <strong id="lbl-gamma">0.50</strong></label>
        <input type="range" id="gammaSlider" min="0.1" max="2.0" step="0.05" value="0.5" />
      </div>

      <div class="slider-item">
        <label for="t0Slider">波峰 t₀: <strong id="lbl-t0">1.50</strong></label>
        <input type="range" id="t0Slider" min="0.5" max="3.0" step="0.05" value="1.5" />
      </div>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
