<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Organelle 3D Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="position:fixed;top:10px;right:16px;z-index:9999;background:rgba(15,23,42,0.92);border:1px solid rgba(56,189,248,0.5);border-radius:20px;padding:6px 14px;font-family:sans-serif;font-size:12px;color:#f8fafc;box-shadow:0 6px 18px rgba(0,0,0,0.4);"><a href="../cell-3d/index.html" style="color:#38bdf8;text-decoration:none;font-weight:600;">✨ 全新「3D細胞與胞器旗艦整合版」→</a></div>

            <button id="mitoBtn">Mitochondrion</button>
