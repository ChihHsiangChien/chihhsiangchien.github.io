<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D動態瓣膜血流模擬</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>
    <div id="info" class="text-sm">
        <h1 class="text-xl font-bold mb-2">3D動態瓣膜血流模擬</h1>
        <p class="mb-2">使用滑鼠/觸控操作視角。點擊下方按鈕控制模擬。</p>
        <p>
            前瓣膜狀態: <span id="front-valve-status" class="status-badge status-off">關閉</span>
        </p>
        <p class="mt-1">
            後瓣膜狀態: <span id="back-valve-status" class="status-badge status-off">關閉</span>
        </p>
    </div>
    <div class="ui-container">
        <button id="toggle-compress" class="btn btn-blue">壓縮血管</button>
        <button id="add-front-valve" class="btn btn-green">新增前瓣膜</button>
        <button id="remove-front-valve" class="btn btn-red hidden">移除前瓣膜</button>
        <button id="add-back-valve" class="btn btn-green">新增後瓣膜</button>
        <button id="remove-back-valve" class="btn btn-red hidden">移除後瓣膜</button>
        <button id="reset-view" class="btn btn-neutral">重置視角</button>
        <div class="quality-control-container">
            <span class="quality-label">粒子數量:</span>
            <input type="range" id="particle-slider" class="particle-slider" min="50" max="400" step="10" value="200" title="調整粒子數量" />
            <span id="particle-count-display" class="particle-count-display">200 顆</span>
            <div class="quality-buttons-group">
                <button type="button" id="quality-low-btn" class="quality-btn" data-count="80" title="低畫質 (80 顆，手機/低階裝置)">低 80</button>
                <button type="button" id="quality-med-btn" class="quality-btn active" data-count="200" title="中畫質 (200 顆，標準)">中 200</button>
                <button type="button" id="quality-high-btn" class="quality-btn" data-count="400" title="高畫質 (400 顆，高效能)">高 400</button>
            </div>
        </div>
    </div>
    <script src="main.js"></script> 
</body>
</html>
