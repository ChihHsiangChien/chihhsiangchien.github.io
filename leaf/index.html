<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>葉片橫切面模型</title>
  <meta name="description" content="互動式 3D 葉片橫切面顯微模型，呈現葉肉細胞（柵狀與海綿組織）、表皮細胞、保衛細胞、氣孔開合控制、角質層、維管束（木質部與韌皮部）及葉綠體構造。">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app-container">
    <!-- 頂部標題與快捷導覽列 -->
    <header id="main-header">
      <div class="brand">
        <button id="btn-toggle-sidebar" class="icon-action-btn" title="切換控制面板 (顯示/隱藏)">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="brand-text">
          <h1>植物葉片橫切面模型</h1>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-toggle-perf" class="icon-action-btn" title="切換極速效能模式 (老舊電腦推薦)">
          <i class="fa-solid fa-bolt"></i>
        </button>
        <button id="btn-reset-view" class="icon-action-btn" title="重置鏡頭角度">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button id="btn-toggle-autorotate" class="icon-action-btn" title="自動旋轉展示">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
    </header>

    <!-- 面板收合時之浮動快速展開按鈕 -->
    <button id="btn-floating-sidebar" class="floating-sidebar-btn hidden" title="展開組織構造控制面板">
      <i class="fa-solid fa-layer-group"></i> <span>控制面板</span>
    </button>

    <!-- 3D 渲染畫布容器 -->
    <div id="canvas-wrapper">
      <canvas id="webgl-canvas"></canvas>

      <!-- 畫面中央懸停提示 -->
      <div id="hover-tooltip" class="hover-tooltip hidden">
        <span class="tooltip-title">組織名稱</span>
      </div>

      <!-- 快速視角提示與圖例浮動欄 -->
      <div class="viewport-hints">
        <div class="hint-item"><i class="fa-solid fa-hand-pointer"></i> 左鍵旋轉</div>
        <div class="hint-item"><i class="fa-solid fa-arrows-up-down-left-right"></i> 右鍵平移</div>
        <div class="hint-item"><i class="fa-solid fa-magnifying-glass"></i> 滾輪縮放</div>
      </div>


    </div>

    <!-- 左側：構造控制與過濾面板 -->
    <aside id="sidebar-controls" class="glass-panel">
      <div class="panel-header">
        <h2><i class="fa-solid fa-layer-group"></i> 組織構造控制</h2>
        <div class="panel-header-actions">
          <button id="btn-reset-filters" class="mini-btn" title="全部重置為顯示">重置全顯</button>
          <button id="btn-close-sidebar" class="icon-mini-btn" title="收合面板"><i class="fa-solid fa-chevron-left"></i></button>
        </div>
      </div>

      <!-- 氣孔核心控制區塊 (使用者重點需求) -->
      <div class="control-section highlight-box">
        <div class="section-title-row">
          <span class="section-title"><i class="fa-solid fa-lungs"></i> 氣孔開閉調節 (Stoma Control)</span>
          <span id="stoma-pct-label" class="badge">70%</span>
        </div>
        <p class="section-desc">調控下表皮保衛細胞膨壓，控制氣孔孔隙開合與氣體交換蒸散作用：</p>

        <div class="slider-wrapper">
          <input type="range" id="stoma-slider" min="0" max="100" value="70" step="1">
          <div class="slider-ticks">
            <span>完全緊閉 (0%)</span>
            <span>半開 (50%)</span>
            <span>完全開啟 (100%)</span>
          </div>
        </div>

        <div class="quick-toggle-group">
          <button id="btn-stoma-close" class="quick-toggle-btn"><i class="fa-solid fa-circle-xmark"></i> 關閉氣孔</button>
          <button id="btn-stoma-half" class="quick-toggle-btn"><i class="fa-solid fa-circle-half-stroke"></i> 50%
            舒張</button>
          <button id="btn-stoma-open" class="quick-toggle-btn active"><i class="fa-solid fa-circle-check"></i>
            充分開展</button>
        </div>
      </div>

      <!-- 爆炸分解視圖滑桿 -->
      <div class="control-section">
        <div class="section-title-row">
          <span class="section-title"><i class="fa-solid fa-arrows-split-up-and-left"></i> 層狀分解視圖 (Exploded View)</span>
          <span id="explode-pct-label" class="badge">0%</span>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="explode-slider" min="0" max="100" value="0" step="1">
          <div class="slider-ticks">
            <span>緊密橫切</span>
            <span>垂直層次分離檢視</span>
          </div>
        </div>
      </div>

      <!-- 葉綠體與透視模式切換 -->
      <div class="control-section">
        <div class="section-title-row">
          <span class="section-title"><i class="fa-solid fa-sliders"></i> 顯示模式與特效</span>
        </div>
        <div class="toggle-grid">
          <label class="switch-card" title="透視細胞內部構造與葉綠體">
            <input type="checkbox" id="toggle-xray">
            <span class="switch-indicator"></span>
            <span class="switch-label"><i class="fa-solid fa-eye-low-vision"></i> 細胞半透視</span>
          </label>

          <label class="switch-card" title="強化葉綠體自體螢光發光">
            <input type="checkbox" id="toggle-chloroplast-glow" checked>
            <span class="switch-indicator"></span>
            <span class="switch-label"><i class="fa-solid fa-wand-magic-sparkles"></i> 葉綠體螢光</span>
          </label>

          <label class="switch-card" title="顯示 CO2、O2 與水蒸氣分子運動">
            <input type="checkbox" id="toggle-particles" checked>
            <span class="switch-indicator"></span>
            <span class="switch-label"><i class="fa-solid fa-wind"></i> 氣體粒子流</span>
          </label>

          <label class="switch-card" title="高亮標註維管束水/糖流向">
            <input type="checkbox" id="toggle-vein-flow" checked>
            <span class="switch-indicator"></span>
            <span class="switch-label"><i class="fa-solid fa-arrows-up-down"></i> 維管輸送流</span>
          </label>

          <label class="switch-card" title="極速效能模式：關閉陰影貼圖與粒子動畫，使老舊電腦能以 60 FPS 極速順暢運作">
            <input type="checkbox" id="toggle-perf-mode">
            <span class="switch-indicator"></span>
            <span class="switch-label"><i class="fa-solid fa-bolt"></i> 極速效能模式</span>
          </label>
        </div>
      </div>

      <!-- 組織構造集中面板：整合視角跳轉、顏色圖例、顯示/隱藏與聚焦隔離 -->
      <div class="control-section structures-list-section">
        <div class="section-title-row">
          <span class="section-title"><i class="fa-solid fa-compass"></i> 構造導覽與圖例控制</span>
          <span class="badge secondary">點名稱跳視角</span>
        </div>
        <p class="section-desc">點選構造名稱直接跳轉鏡頭特寫；右側按鈕可聚焦隔離或切換顯示隱藏：</p>

        <div class="structures-tree" id="structures-tree-list">
          <!-- 由 JS 動態生成並綁定操作按鈕 -->
        </div>
      </div>
    </aside>
  </div>

  <!-- Three.js & Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <!-- Biological Data & Models -->
  <script src="leaf_data.js"></script>
  <script src="leaf_model.js"></script>
  <script src="app.js"></script>
</body>

</html>
