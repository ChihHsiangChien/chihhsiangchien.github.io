<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>黃金比例的方塊與螺線 | Fibonacci Spiral</title>
  <style>
    :root {
      --bg: #080d18;
      --panel: rgba(17, 24, 39, 0.9);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 30% 15%, #1e1b4b 0%, #080d18 75%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      touch-action: manipulation;
    }

    .app-shell {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
      gap: 10px;
    }

    .top-bar {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: linear-gradient(135deg, #f59e0b, #38bdf8);
      color: #fff;
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .readout-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .chip strong {
      color: #fde68a;
      font-variant-numeric: tabular-nums;
    }

    .canvas-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls-dock {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 190px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .ctrl-group strong {
      color: var(--text);
      min-width: 34px;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fbbf24;
      border: 2px solid #0f172a;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill-btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .pill-btn.primary {
      border: none;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
    }

    .pill-btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <span class="badge">φ ≈ 1.618</span>
        <h1>黃金比例方塊與螺線</h1>
      </div>
      <div class="readout-row">
        <div class="chip">當前費氏數：<strong id="val-fib">1</strong></div>
        <div class="chip">相鄰比值：<strong id="val-ratio">—</strong></div>
      </div>
    </header>

    <main class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </main>

    <footer class="controls-dock">
      <div class="ctrl-group">
        <label for="slider">進度：</label>
        <input type="range" id="slider" min="0" max="1000" value="1000" />
        <strong id="val-pct">100%</strong>
      </div>

      <div class="ctrl-group">
        <label for="count-slider">階數：</label>
        <input type="range" id="count-slider" min="4" max="13" value="10" />
        <strong id="val-count">10</strong>
      </div>

      <div class="btn-group">
        <button id="btn-play" class="pill-btn primary">▶ 演示</button>
        <button id="btn-nums" class="pill-btn active">🔢 數字</button>
        <button id="btn-spiral" class="pill-btn active">🌀 螺線</button>
      </div>
    </footer>
  </div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const slider = document.getElementById('slider');
      const countSlider = document.getElementById('count-slider');
      const valPct = document.getElementById('val-pct');
      const valCount = document.getElementById('val-count');
      const valFib = document.getElementById('val-fib');
      const valRatio = document.getElementById('val-ratio');
      const btnPlay = document.getElementById('btn-play');
      const btnNums = document.getElementById('btn-nums');
      const btnSpiral = document.getElementById('btn-spiral');

      let width = 800;
      let height = 500;
      let progress = 1; // 0..1
      let count = 10;
      let showNumbers = true;
      let showSpiral = true;
      let animRaf = null;

      function fibonacci(n) {
        const seq = [1, 1];
        for (let i = 2; i < n; i++) {
          seq.push(seq[i - 1] + seq[i - 2]);
        }
        return seq.slice(0, n);
      }

      // Compute unit-scale rectangles and auto-fit to canvas bounds
      function generateRects(n) {
        const fib = fibonacci(n);
        const posSeq = [0, 0].concat(fib);
        const raw = [];
        let arcX = 0;
        let arcY = 0;

        for (let i = 0; i < n; i++) {
          let startAngle, endAngle, rectX, rectY;
          const s = fib[i];
          switch (i % 4) {
            case 0:
              startAngle = Math.PI;
              endAngle = Math.PI * 1.5;
              arcX += posSeq[i];
              rectX = arcX - s;
              rectY = arcY - s;
              break;
            case 1:
              startAngle = Math.PI * 1.5;
              endAngle = Math.PI * 2;
              arcY += posSeq[i];
              rectX = arcX;
              rectY = arcY - s;
              break;
            case 2:
              startAngle = 0;
              endAngle = Math.PI * 0.5;
              arcX -= posSeq[i];
              rectX = arcX;
              rectY = arcY;
              break;
            case 3:
              startAngle = Math.PI * 0.5;
              endAngle = Math.PI;
              arcY -= posSeq[i];
              rectX = arcX - s;
              rectY = arcY;
              break;
          }
          raw.push({ fib: s, arcX, arcY, size: s, startAngle, endAngle, rectX, rectY });
        }

        // Compute bounding box to center and scale cleanly on any screen
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const r of raw) {
          minX = Math.min(minX, r.rectX);
          minY = Math.min(minY, r.rectY);
          maxX = Math.max(maxX, r.rectX + r.size);
          maxY = Math.max(maxY, r.rectY + r.size);
        }

        const boxW = maxX - minX || 1;
        const boxH = maxY - minY || 1;
        const pad = 28;
        const scale = Math.min((width - pad * 2) / boxW, (height - pad * 2) / boxH);
        const offsetX = (width - boxW * scale) / 2 - minX * scale;
        const offsetY = (height - boxH * scale) / 2 - minY * scale;

        return raw.map((r) => ({
          fib: r.fib,
          arcX: r.arcX * scale + offsetX,
          arcY: r.arcY * scale + offsetY,
          size: r.size * scale,
          startAngle: r.startAngle,
          endAngle: r.endAngle,
          rectX: r.rectX * scale + offsetX,
          rectY: r.rectY * scale + offsetY
        }));
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        const rects = generateRects(count);
        const exactCount = progress * rects.length;
        const fullCount = Math.floor(exactCount);
        const frac = exactCount - fullCount;

        let lastFib = 1;
        let prevFib = 1;

        rects.forEach((r, idx) => {
          if (idx > fullCount || (idx === fullCount && frac <= 0.001)) return;

          const isCurrent = idx === fullCount;
          const alpha = isCurrent ? Math.min(1, frac * 1.4) : 1;
          const hue = (idx * 28) % 360;

          ctx.save();
          ctx.globalAlpha = alpha;

          // Square fill & border
          ctx.fillStyle = `hsla(${hue}, 70%, 55%, 0.16)`;
          ctx.fillRect(r.rectX, r.rectY, r.size, r.size);
          ctx.strokeStyle = `hsla(${hue}, 75%, 65%, 0.7)`;
          ctx.lineWidth = 1.6;
          ctx.strokeRect(r.rectX, r.rectY, r.size, r.size);

          // Fibonacci number label if square is large enough
          if (showNumbers && r.size >= 18) {
            ctx.fillStyle = '#e2e8f0';
            const fontSize = Math.max(10, Math.min(26, r.size * 0.28));
            ctx.font = `700 ${Math.round(fontSize)}px -apple-system, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(r.fib), r.rectX + r.size / 2, r.rectY + r.size / 2);
          }

          // Smooth continuous spiral arc
          if (showSpiral) {
            const arcFrac = isCurrent ? frac : 1;
            const span = Math.PI * 0.5 * arcFrac;
            ctx.beginPath();
            ctx.strokeStyle = '#fbbf24';
            ctx.shadowColor = 'rgba(251, 191, 36, 0.55)';
            ctx.shadowBlur = 8;
            ctx.lineWidth = 3;
            ctx.arc(r.arcX, r.arcY, r.size, r.startAngle, r.startAngle + span);
            ctx.stroke();
          }

          ctx.restore();

          prevFib = lastFib;
          lastFib = r.fib;
        });

        valPct.textContent = `${Math.round(progress * 100)}%`;
        valFib.textContent = exactCount < 0.05 ? '—' : String(lastFib);
        valRatio.textContent = fullCount >= 1 ? (lastFib / prevFib).toFixed(4) : '—';
      }

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(240, rect.width);
        height = Math.max(240, rect.height);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function stopAnim() {
        if (animRaf) {
          cancelAnimationFrame(animRaf);
          animRaf = null;
          btnPlay.textContent = '▶ 演示';
        }
      }

      // --- Events ---
      document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
      window.addEventListener('resize', resizeCanvas);

      slider.addEventListener('input', (e) => {
        stopAnim();
        progress = Number(e.target.value) / 1000;
        draw();
      });

      countSlider.addEventListener('input', (e) => {
        count = Number(e.target.value);
        valCount.textContent = String(count);
        draw();
      });

      btnNums.addEventListener('click', () => {
        showNumbers = !showNumbers;
        btnNums.classList.toggle('active', showNumbers);
        draw();
      });

      btnSpiral.addEventListener('click', () => {
        showSpiral = !showSpiral;
        btnSpiral.classList.toggle('active', showSpiral);
        draw();
      });

      btnPlay.addEventListener('click', () => {
        if (animRaf) {
          stopAnim();
          return;
        }
        if (progress >= 0.99) progress = 0;
        btnPlay.textContent = '⏸ 暫停';
        let lastTs = 0;
        const step = (ts) => {
          if (!lastTs) lastTs = ts;
          const dt = Math.min(0.05, (ts - lastTs) / 1000);
          lastTs = ts;
          progress = Math.min(1, progress + dt * 0.22);
          slider.value = String(Math.round(progress * 1000));
          draw();
          if (progress < 1) {
            animRaf = requestAnimationFrame(step);
          } else {
            stopAnim();
          }
        };
        animRaf = requestAnimationFrame(step);
      });

      resizeCanvas();
    })();
  </script>
</body>
</html>
