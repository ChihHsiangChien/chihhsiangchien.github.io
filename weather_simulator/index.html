<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>3D 大氣動力與天氣系統互動模擬器</title>
    <style>
        :root {
            --bg-deep: #070d19;
            --panel-bg: rgba(15, 23, 42, 0.82);
            --panel-border: rgba(148, 163, 184, 0.22);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --cold: #38bdf8;
            --cold-dark: #0284c7;
            --warm: #fb7185;
            --warm-hot: #f97316;
            --occluded: #c084fc;
            --jet: #facc15;
            --accent: #38bdf8;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 35%, #132038 0%, #070d19 75%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
            color: var(--text-main);
            touch-action: none;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        /* 3D 浮動標籤層 */
        #labels-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
            transition: opacity 0.25s ease;
        }

        #labels-container.hidden {
            opacity: 0;
        }

        .label-3d {
            position: absolute;
            transform: translate(-50%, -100%);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
            white-space: nowrap;
            background: rgba(10, 18, 34, 0.86);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .label-3d::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -5px;
            transform: translateX(-50%);
            border-width: 5px 5px 0 5px;
            border-style: solid;
            border-color: rgba(10, 18, 34, 0.86) transparent transparent transparent;
        }

        .label-3d .sub {
            display: block;
            font-size: 10px;
            font-weight: 400;
            color: #cbd5e1;
            margin-top: 1px;
        }

        .label-3d.cold {
            border-left: 3px solid var(--cold);
        }

        .label-3d.warm {
            border-left: 3px solid var(--warm);
        }

        .label-3d.occluded {
            border-left: 3px solid var(--occluded);
        }

        .label-3d.jet {
            border-left: 3px solid var(--jet);
        }

        .label-3d.cloud {
            border-left: 3px solid #e2e8f0;
        }

        /* 頂部導覽列 */
        #top-bar {
            position: fixed;
            top: 10px;
            left: 12px;
            right: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .glass-bar {
            pointer-events: auto;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
        }

        /* 主分頁 Tabs */
        .cat-tabs {
            display: flex;
            padding: 4px;
            gap: 4px;
            overflow-x: auto;
            max-width: 100%;
            scrollbar-width: none;
        }

        .cat-tabs::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .cat-btn:hover {
            color: var(--text-main);
        }

        .cat-btn.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(99, 102, 241, 0.25));
            color: #fff;
            border: 1px solid rgba(56, 189, 248, 0.45);
        }

        /* 工具按鈕組 */
        .tool-actions {
            display: flex;
            gap: 6px;
            padding: 4px;
        }

        .icon-btn {
            border: 1px solid transparent;
            background: rgba(30, 41, 59, 0.65);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: all 0.18s ease;
        }

        .icon-btn:hover {
            background: rgba(51, 65, 85, 0.85);
        }

        .icon-btn.active {
            background: rgba(56, 189, 248, 0.22);
            border-color: rgba(56, 189, 248, 0.55);
            color: #7dd3fc;
        }

        /* 子主題選擇列 */
        .sub-tabs {
            display: flex;
            gap: 6px;
            padding: 5px 6px;
            overflow-x: auto;
            max-width: fit-content;
            scrollbar-width: none;
        }

        .sub-tabs::-webkit-scrollbar {
            display: none;
        }

        .sub-btn {
            border: 1px solid transparent;
            background: rgba(30, 41, 59, 0.5);
            color: #cbd5e1;
            padding: 7px 13px;
            border-radius: 9px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .sub-btn:hover {
            background: rgba(51, 65, 85, 0.7);
        }

        .sub-btn.active {
            background: #0284c7;
            color: #fff;
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.45);
        }

        /* 右側觸控視角控制列 (Zoom / Pan / Rotate) */
        #cam-dock {
            position: fixed;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 6px;
        }

        .cam-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(15, 23, 42, 0.8);
            color: #f8fafc;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .cam-btn:active {
            transform: scale(0.93);
        }

        .cam-btn.mode-pan {
            background: rgba(249, 115, 22, 0.25);
            border-color: rgba(249, 115, 22, 0.65);
            color: #fdba74;
        }

        .cam-hint {
            font-size: 10px;
            text-align: center;
            color: var(--text-muted);
            line-height: 1.1;
            padding: 2px 0;
        }

        /* 圖例浮窗 */
        #legend-card {
            position: fixed;
            top: 112px;
            right: 12px;
            z-index: 11;
            padding: 12px 14px;
            width: 220px;
            font-size: 12px;
            display: none;
            flex-direction: column;
            gap: 7px;
        }

        #legend-card.open {
            display: flex;
        }

        .legend-title {
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
        }

        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* 底部 Step-by-Step 控制面板 */
        #bottom-dock {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: min(780px, calc(100% - 24px));
            z-index: 10;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .scene-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(56, 189, 248, 0.2);
            color: #7dd3fc;
            margin-right: 6px;
        }

        .step-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .step-desc {
            font-size: 13px;
            line-height: 1.5;
            color: #cbd5e1;
            margin-top: 4px;
        }

        #bottom-dock.collapsed .step-desc {
            display: none;
        }

        /* 階段圓點按鈕條 */
        .stepper-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .step-pill {
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(30, 41, 59, 0.55);
            color: #94a3b8;
            padding: 7px 6px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: all 0.18s ease;
        }

        .step-pill:hover {
            background: rgba(51, 65, 85, 0.75);
            color: #e2e8f0;
        }

        .step-pill.active {
            background: rgba(56, 189, 248, 0.22);
            border-color: #38bdf8;
            color: #fff;
            box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.18);
        }

        /* 播放與進度軸控制列 */
        .playback-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn {
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(30, 41, 59, 0.8);
            color: #f8fafc;
            padding: 8px 12px;
            border-radius: 9px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .ctrl-btn.primary {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border-color: #38bdf8;
        }

        .timeline-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #38bdf8;
            height: 6px;
            cursor: pointer;
        }

        .pct-label {
            font-size: 11px;
            color: var(--text-muted);
            width: 34px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 680px) {
            #cam-dock {
                top: auto;
                bottom: 225px;
                transform: none;
                right: 8px;
                padding: 4px;
            }

            .cam-btn {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }

            #bottom-dock {
                padding: 10px 12px;
                gap: 8px;
                bottom: 8px;
                width: calc(100% - 16px);
            }

            .step-title {
                font-size: 14px;
            }

            .step-desc {
                font-size: 12px;
            }

            .step-pill {
                font-size: 11px;
                padding: 6px 4px;
            }

            .ctrl-btn {
                padding: 7px 9px;
                font-size: 12px;
            }
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>

    <!-- 3D 畫布與浮動標籤層 -->
    <div id="canvas-container"></div>
    <div id="labels-container"></div>

    <!-- 頂部多層分頁與全域工具 -->
    <header id="top-bar">
        <div class="top-row">
            <nav class="cat-tabs glass-bar" id="cat-tabs"></nav>
            <div class="tool-actions glass-bar">
                <button class="icon-btn active" id="btn-toggle-labels" title="顯示或隱藏3D空間標籤">🏷️ 標籤: 開</button>
                <button class="icon-btn" id="btn-toggle-legend" title="查看統一視覺色彩圖例">🎨 圖例</button>
            </div>
        </div>
        <div class="sub-tabs glass-bar" id="sub-tabs"></div>
    </header>

    <!-- 統一視覺色彩圖例 -->
    <aside id="legend-card" class="glass-bar">
        <div class="legend-title">
            <span>跨分頁統一視覺圖例</span>
            <span style="cursor:pointer;color:#94a3b8" id="btn-close-legend">✕</span>
        </div>
        <div class="legend-item"><span class="swatch" style="background:#38bdf8"></span>冷氣團 / 冷鋒 / 下沉冷流</div>
        <div class="legend-item"><span class="swatch" style="background:#fb7185"></span>暖氣團 / 暖鋒 / 上升暖流</div>
        <div class="legend-item"><span class="swatch" style="background:#f97316"></span>乾絕熱增溫 (焚風) / 強熱對流</div>
        <div class="legend-item"><span class="swatch" style="background:#c084fc"></span>閉塞鋒 (囚錮鋒) 混合區</div>
        <div class="legend-item"><span class="swatch" style="background:#facc15"></span>高空噴射氣流 / 雷電閃光</div>
        <div class="legend-item"><span class="swatch" style="background:#e2e8f0"></span>雲系發展與降水雨帶</div>
    </aside>

    <!-- 右側觸控友善 Zoom / Pan / Rotate 工具列 -->
    <aside id="cam-dock" class="glass-bar">
        <button class="cam-btn" id="btn-zoom-in" title="放大視角">＋</button>
        <button class="cam-btn" id="btn-zoom-out" title="縮小視角">－</button>
        <button class="cam-btn" id="btn-pan-mode" title="切換單指旋轉或平移">🔄</button>
        <div class="cam-hint" id="pan-mode-label">旋轉</div>
        <button class="cam-btn" id="btn-reset-cam" title="重置預設視角">🎯</button>
    </aside>

    <!-- 底部 Step-by-Step 流程控制面板 -->
    <section id="bottom-dock" class="glass-bar">
        <div class="info-header">
            <div>
                <span class="scene-badge" id="ui-scene-name">冷鋒</span>
                <span class="step-title" id="ui-step-title">階段 1</span>
                <p class="step-desc" id="ui-step-desc">說明載入中...</p>
            </div>
            <button class="icon-btn" id="btn-collapse-desc" title="收合或展開文字說明">▾</button>
        </div>

        <div class="stepper-row" id="stepper-row"></div>

        <div class="playback-row">
            <button class="ctrl-btn" id="btn-prev">⏮ 上一步</button>
            <button class="ctrl-btn primary" id="btn-play">▶ 自動演進</button>
            <button class="ctrl-btn" id="btn-next">下一步 ⏭</button>
            <div class="timeline-wrap">
                <input type="range" id="progress-slider" min="0" max="1000" value="150" />
                <span class="pct-label" id="pct-label">15%</span>
            </div>
        </div>
    </section>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================================
        // 1. 跨分頁統一色彩規範 (Visual Consistency Palette)
        // =========================================================================
        const PALETTE = {
            cold: 0x38bdf8,
            coldDeep: 0x0284c7,
            warm: 0xfb7185,
            warmHot: 0xf97316,
            occluded: 0xc084fc,
            jet: 0xfacc15,
            rain: 0x7dd3fc,
            lightning: 0xfef08a,
            groundPlain: 0x1e293b,
            groundLand: 0x2d4a3e,
            groundSea: 0x0c3b5e
        };

        // =========================================================================
        // 2. 課程與 10 大氣象模擬場景資料庫 (含 4 階段 Step-by-Step 流程)
        // =========================================================================
        const CATEGORIES = [
            {
                id: 'fronts',
                name: '1. 鋒面系統',
                scenes: [
                    {
                        id: 'cold_front',
                        name: '冷鋒',
                        camPos: [0, 9.5, 22],
                        steps: [
                            { p: 0.08, short: '1. 冷氣團逼近', title: '階段 1：冷氣團快速南下逼近', desc: '密度較大的冷空氣團在地面後方集結推進，前方則為溫暖潮濕的暖空氣團。' },
                            { p: 0.38, short: '2. 楔形強迫抬升', title: '階段 2：冷空氣如楔子切入暖空氣下方', desc: '冷空氣重且移速快，形成陡峭鋒面坡度（約 1:50~1:100），迫使前方暖濕空氣劇烈垂直上升。' },
                            { p: 0.70, short: '3. 積雨雲與雷雨', title: '階段 3：狹窄對流帶、積雨雲與強雷陣雨', desc: '猛烈上升氣流凝結成高聳入對流層頂的積雨雲（Cb），伴隨閃電、強陣風與狹窄但猛烈的暴雨帶。' },
                            { p: 0.98, short: '4. 過境劇烈降溫', title: '階段 4：冷鋒過境，氣溫驟降轉乾冷', desc: '鋒面通過後，地面完全由乾冷氣團控制，氣壓上升、氣溫明顯驟降，對流雲帶隨鋒線東移。' }
                        ]
                    },
                    {
                        id: 'warm_front',
                        name: '暖鋒',
                        camPos: [0, 9.5, 22],
                        steps: [
                            { p: 0.08, short: '1. 暖氣團推進', title: '階段 1：暖濕氣團主動向冷區推進', desc: '暖空氣密度小，面對前方緩慢撤退的冷空氣楔，開始在交界面接觸。' },
                            { p: 0.38, short: '2. 緩坡滑升', title: '階段 2：沿平緩冷空氣斜坡徐徐爬升', desc: '暖空氣沿著極平緩的斜坡（約 1:200）滑升，抬升速度溫和但涵蓋水平範圍極廣。' },
                            { p: 0.70, short: '3. 梯次層狀雲系', title: '階段 3：高空至低空依序出現梯次雲層', desc: '鋒線前方數百公里依序可見：高空卷雲（Ci）➔ 中空高層雲（As）➔ 低空厚實雨層雲（Ns）。' },
                            { p: 0.98, short: '4. 連續降雨回暖', title: '階段 4：寬廣連續性降雨與過境回暖', desc: '雨層雲帶來鋒前大範圍、長時間的綿綿細雨；待地面暖鋒線通過後，天氣轉暖且雨勢趨緩。' }
                        ]
                    },
                    {
                        id: 'stationary_front',
                        name: '滯留鋒',
                        camPos: [1, 11.5, 21],
                        steps: [
                            { p: 0.10, short: '1. 冷暖勢均力敵', title: '階段 1：南北冷暖氣團勢力相當', desc: '北方大陸冷氣團與南方海洋暖濕氣團交會，雙方推力相當，地面鋒線幾乎停滯不前。' },
                            { p: 0.40, short: '2. 平行鋒線滑動', title: '階段 2：氣流平行於鋒線反向滑動', desc: '冷空氣偏東風、暖空氣偏西南風，氣流大致平行鋒面切變，暖濕空氣持續沿鋒面斜坡爬升。' },
                            { p: 0.72, short: '3. 廣闊雲帶滯留', title: '階段 3：大範圍層狀與對流混合雲帶盤踞', desc: '水氣源源不絕供應，在鋒面帶上方形成東西向綿延的厚重雲雨帶（如東亞春夏之交的梅雨鋒面）。' },
                            { p: 0.98, short: '4. 連日陰雨綿綿', title: '階段 4：長時間持續性降水與局部豪雨', desc: '由於鋒面南北微幅擺動滯留數日甚至數週，造成長時間陰雨綿綿與充沛累積雨量。' }
                        ]
                    },
                    {
                        id: 'occluded_front',
                        name: '閉塞鋒',
                        camPos: [0, 10, 22.5],
                        steps: [

        // =========================================================================
        // 3. Three.js 核心渲染器與場景初始化
        // =========================================================================
        const container = document.getElementById('canvas-container');
        const labelsContainer = document.getElementById('labels-container');

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 150);
        camera.position.set(0, 9.5, 22);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.07;
        controls.enablePan = true;
        controls.enableZoom = true;
        controls.minDistance = 9;
        controls.maxDistance = 42;
        controls.maxPolarAngle = Math.PI * 0.49;
        controls.target.set(0, 3.2, 0);

        // 燈光系統（在海陸風日夜循環時可微調）
        const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.35);
        dirLight.position.set(12, 22, 14);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(1024, 1024);
        dirLight.shadow.camera.left = -16;
        dirLight.shadow.camera.right = 16;
        dirLight.shadow.camera.top = 16;
        dirLight.shadow.camera.bottom = -16;
        scene.add(dirLight);

        const hemiLight = new THREE.HemisphereLight(0x93c5fd, 0x1e293b, 0.45);
        scene.add(hemiLight);

        // =========================================================================
        // 4. 統一 3D 大氣剖面觀測台底座 (Diorama Base)
        // =========================================================================
        const baseGroup = new THREE.Group();
        scene.add(baseGroup);

        const SLAB_W = 24;
        const SLAB_D = 14;

        // 底座地殼塊
        const slabGeo = new THREE.BoxGeometry(SLAB_W, 1.1, SLAB_D);
        const slabMat = new THREE.MeshStandardMaterial({ color: PALETTE.groundPlain, roughness: 0.85, metalness: 0.1 });
        const slabMesh = new THREE.Mesh(slabGeo, slabMat);
        slabMesh.position.y = -0.55;
        slabMesh.receiveShadow = true;
        baseGroup.add(slabMesh);

        // 底座邊框線與參考格線
        const gridHelper = new THREE.GridHelper(SLAB_W, 12, 0x475569, 0x334155);
        gridHelper.scale.z = SLAB_D / SLAB_W;
        gridHelper.position.y = 0.01;
        baseGroup.add(gridHelper);

        // 對流層高度標尺框 (左後方柱 0km ~ 12km)
        const rulerMat = new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.55 });
        const rulerPts = [
            new THREE.Vector3(-12, 0, -7), new THREE.Vector3(-12, 10, -7),
            new THREE.Vector3(-12, 10, -7), new THREE.Vector3(12, 10, -7),
            new THREE.Vector3(-12, 3.33, -7), new THREE.Vector3(-11.4, 3.33, -7),
            new THREE.Vector3(-12, 6.66, -7), new THREE.Vector3(-11.4, 6.66, -7)
        ];
        const rulerGeo = new THREE.BufferGeometry().setFromPoints(rulerPts);
        baseGroup.add(new THREE.LineSegments(rulerGeo, rulerMat));

        // 方位小標記 (N 北方在 -Z)
        const northArrow = new THREE.Mesh(
            new THREE.ConeGeometry(0.32, 0.9, 4),
            new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
        );
        northArrow.rotation.x = -Math.PI / 2;
        northArrow.position.set(11.1, 0.12, -6.1);
        baseGroup.add(northArrow);

        // 動態模擬群組（切換分頁時自動回收並重建）
        const simGroup = new THREE.Group();
        scene.add(simGroup);

        // 固定高度尺標籤
        const staticLabels = [];
        function createLabelElement(title, sub = '', type = 'cloud', isStatic = false) {
            const el = document.createElement('div');
            el.className = `label-3d ${type}`;
            el.innerHTML = `${title}${sub ? `<span class="sub">${sub}</span>` : ''}`;
            if (isStatic) {
                el.style.fontSize = '10px';
                el.style.padding = '2px 6px';
                el.style.opacity = '0.75';
            }
            labelsContainer.appendChild(el);
            return el;
        }

        staticLabels.push(
            { pos: new THREE.Vector3(-12, 10.2, -7), el: createLabelElement('12 km 對流層頂', '', 'cloud', true) },
            { pos: new THREE.Vector3(-12, 5.0, -7), el: createLabelElement('6 km 中層', '', 'cloud', true) },
            { pos: new THREE.Vector3(11.1, 0.4, -6.5), el: createLabelElement('N 北', '', 'cold', true) }
        );

        // =========================================================================
        // 5. 可重用 3D 氣象視覺元件庫 (Air Wedge, FlowStream, Clouds, Rain, FrontLine)
        // =========================================================================
        let activeLabels = [];
        let disposables = [];

        function trackDispose(obj) {
            disposables.push(obj);
            return obj;
        }

        function addSimLabel(title, sub, type, x, y, z) {
            const el = createLabelElement(title, sub, type, false);
            const item = { pos: new THREE.Vector3(x, y, z), el, visible: true };
            activeLabels.push(item);
            return item;
        }

        // (A) 3D 動態氣團剖面體積塊 (可即時更新頂面與底面曲面方程式)
        class AirVolume {
            constructor(color, opacity = 0.28, segX = 32, segZ = 14) {
                const geo = trackDispose(new THREE.BoxGeometry(1, 1, 1, segX, 1, segZ));
                const pos = geo.attributes.position;
                this.meta = [];
                for (let i = 0; i < pos.count; i++) {
                    this.meta.push({
                        u: pos.getX(i) + 0.5,       // 0..1
                        top: pos.getY(i) > 0,       // true = 頂面, false = 底面
                        v: pos.getZ(i) + 0.5        // 0..1
                    });
                }
                const mat = trackDispose(new THREE.MeshPhysicalMaterial({
                    color,
                    transparent: true,
                    opacity,
                    roughness: 0.25,
                    metalness: 0.05,
                    side: THREE.DoubleSide,
                    depthWrite: false
                }));
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.renderOrder = 2;
                simGroup.add(this.mesh);
            }

            update(xMin, xMax, zMin, zMax, fnBottom, fnTop) {
                if (xMax - xMin < 0.05 || zMax - zMin < 0.05) {
                    this.mesh.visible = false;
                    return;
                }
                this.mesh.visible = true;
                const pos = this.mesh.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const m = this.meta[i];
                    const x = THREE.MathUtils.lerp(xMin, xMax, m.u);
                    const z = THREE.MathUtils.lerp(zMin, zMax, m.v);
                    const yBot = fnBottom(x, z);
                    const yTop = Math.max(yBot + 0.02, fnTop(x, z));
                    pos.setXYZ(i, x, m.top ? yTop : yBot, z);
                }
                pos.needsUpdate = true;
                this.mesh.geometry.computeVertexNormals();
            }
        }

        // (B) 3D 氣流流線與動態箭頭粒子系統
        class FlowStream {
            constructor({ pointsFn, color = PALETTE.cold, colorEnd = null, count = 5, speed = 0.35, size = 0.24, showLine = true }) {
                this.pointsFn = typeof pointsFn === 'function' ? pointsFn : () => pointsFn;
                this.baseColor = new THREE.Color(color);
                this.endColor = colorEnd ? new THREE.Color(colorEnd) : null;
                this.speed = speed;
                this.opacityScale = 1;
                this.group = new THREE.Group();
                simGroup.add(this.group);

                this.curve = new THREE.CatmullRomCurve3(this.pointsFn(0));

                if (showLine) {
                    const lineGeo = trackDispose(new THREE.BufferGeometry().setFromPoints(this.curve.getPoints(40)));
                    this.lineMat = trackDispose(new THREE.LineBasicMaterial({
                        color,
                        transparent: true,
                        opacity: 0.42
                    }));
                    this.line = new THREE.Line(lineGeo, this.lineMat);
                    this.group.add(this.line);
                }

                const coneGeo = trackDispose(new THREE.ConeGeometry(size, size * 2.5, 10));
                coneGeo.rotateX(Math.PI / 2);
                this.arrows = [];
                for (let i = 0; i < count; i++) {
                    const mat = trackDispose(new THREE.MeshStandardMaterial({
                        color,
                        emissive: color,
                        emissiveIntensity: 0.35,
                        transparent: true,
                        opacity: 0.9
                    }));
                    const mesh = new THREE.Mesh(coneGeo, mat);
                    this.group.add(mesh);
                    this.arrows.push({ mesh, mat, offset: i / count });
                }
            }

            update(elapsed, p) {
                if (this.opacityScale <= 0.02) {
                    this.group.visible = false;
                    return;
                }
                this.group.visible = true;
                const pts = this.pointsFn(p);
                this.curve = new THREE.CatmullRomCurve3(pts);

                if (this.line) {
                    this.line.geometry.setFromPoints(this.curve.getPoints(36));
                    this.lineMat.opacity = 0.42 * this.opacityScale;
                }

                const up = new THREE.Vector3(0, 1, 0);
                for (const a of this.arrows) {
                    const t = (elapsed * this.speed + a.offset) % 1;
                    const pos = this.curve.getPointAt(t);
                    const tan = this.curve.getTangentAt(t).normalize();
                    a.mesh.position.copy(pos);
                    const target = pos.clone().add(tan);
                    a.mesh.up.copy(up);
                    a.mesh.lookAt(target);

                    const edgeFade = Math.min(t * 6, (1 - t) * 6, 1);
                    a.mat.opacity = edgeFade * 0.95 * this.opacityScale;

                    if (this.endColor) {
                        const c = this.baseColor.clone().lerp(this.endColor, t);
                        a.mat.color.copy(c);
                        a.mat.emissive.copy(c);
                    }
                }
            }
        }

        // (C) 3D 立體雲團組件
        class CloudCluster {
            constructor({ x = 0, y = 5, z = 0, sx = 3, sy = 1.6, sz = 3, puffs = 14, darkness = 0.08 }) {
                this.group = new THREE.Group();
                this.group.position.set(x, y, z);
                simGroup.add(this.group);

                const baseBright = 1 - darkness;
                const topColor = new THREE.Color(0.96, 0.98, 1.0);
                const botColor = new THREE.Color(0.55 * baseBright, 0.62 * baseBright, 0.72 * baseBright);

                const puffGeo = trackDispose(new THREE.IcosahedronGeometry(1, 2));
                this.materials = [];
                this.puffMeshes = [];

                // 使用固定偽隨機確保切換一致美觀
                for (let i = 0; i < puffs; i++) {
                    const seed = (i * 9301 + 49297) % 233280 / 233280;
                    const seed2 = ((i + 7) * 4321 + 12345) % 233280 / 233280;
                    const seed3 = ((i + 13) * 7717 + 54321) % 233280 / 233280;

                    const angle = seed * Math.PI * 2;
                    const rad = Math.sqrt(seed2) * 0.5;
                    const px = Math.cos(angle) * rad * sx;
                    const pz = Math.sin(angle) * rad * sz;
                    const py = (seed3 - 0.45) * sy;

                    const c = botColor.clone().lerp(topColor, THREE.MathUtils.clamp((py / sy) + 0.55, 0, 1));
                    const mat = trackDispose(new THREE.MeshStandardMaterial({
                        color: c,
                        roughness: 0.9,
                        transparent: true,
                        opacity: 0.92
                    }));
                    this.materials.push(mat);

                    const m = new THREE.Mesh(puffGeo, mat);
                    const rScale = (0.45 + (1 - rad) * 0.55) * Math.min(sx, sz) * 0.45 + 0.35;
                    m.position.set(px, py, pz);
                    m.scale.set(rScale * 1.15, rScale * (0.72 + sy * 0.12), rScale);
                    m.castShadow = true;
                    this.group.add(m);
                    this.puffMeshes.push({ m, baseScale: m.scale.clone(), phase: i * 0.8 });
                }
            }

            setState({ x, y, z, scale = 1, scaleY = null, opacity = 0.92, elapsed = 0 }) {
                if (x !== undefined) this.group.position.x = x;
                if (y !== undefined) this.group.position.y = y;
                if (z !== undefined) this.group.position.z = z;
                const s = Math.max(0.001, scale);
                this.group.scale.set(s, scaleY !== null ? Math.max(0.001, scaleY) : s, s);
                this.group.visible = opacity > 0.02 && s > 0.03;
                for (const mat of this.materials) mat.opacity = opacity;
                for (const pm of this.puffMeshes) {
                    const breathe = 1 + Math.sin(elapsed * 1.6 + pm.phase) * 0.035;
                    pm.m.scale.copy(pm.baseScale).multiplyScalar(breathe);
                }
            }
        }

        // (D) 3D 降雨與閃電粒子系統
        class RainSystem {
            constructor({ count = 220, width = 4, height = 5, depth = 8, slantX = 0.25 }) {
                this.count = count;
                this.width = width;
                this.height = height;
                this.depth = depth;
                this.slantX = slantX;
                this.intensity = 1;

                this.drops = [];
                const positions = new Float32Array(count * 6);
                for (let i = 0; i < count; i++) {
                    this.drops.push({
                        u: Math.random() - 0.5,
                        y: Math.random(),
                        v: Math.random() - 0.5,
                        speed: 1.4 + Math.random() * 0.9
                    });
                }
                const geo = trackDispose(new THREE.BufferGeometry());
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                this.mat = trackDispose(new THREE.LineBasicMaterial({
                    color: PALETTE.rain,
                    transparent: true,
                    opacity: 0.65
                }));
                this.lines = new THREE.LineSegments(geo, this.mat);
                simGroup.add(this.lines);
            }

            update(dt, cx, topY, cz, intensity = 1) {
                this.intensity = intensity;
                if (intensity <= 0.03) {
                    this.lines.visible = false;
                    return;
                }
                this.lines.visible = true;
                this.mat.opacity = 0.7 * intensity;

                const arr = this.lines.geometry.attributes.position.array;
                const activeCount = Math.floor(this.count * Math.min(1, intensity));

                for (let i = 0; i < this.count; i++) {
                    const d = this.drops[i];
                    d.y -= dt * d.speed;
                    if (d.y < 0) d.y += 1;

                    const idx = i * 6;
                    if (i > activeCount) {
                        arr[idx] = arr[idx + 3] = 0;
                        arr[idx + 1] = arr[idx + 4] = -10;
                        arr[idx + 2] = arr[idx + 5] = 0;
                        continue;
                    }
                    const x = cx + d.u * this.width + (1 - d.y) * this.slantX;
                    const y = Math.max(0.05, d.y * topY);
                    const z = cz + d.v * this.depth;

                    arr[idx] = x;
                    arr[idx + 1] = y;
                    arr[idx + 2] = z;
                    arr[idx + 3] = x + this.slantX * 0.12;
                    arr[idx + 4] = Math.max(0.02, y - 0.55);
                    arr[idx + 5] = z;
                }
                this.lines.geometry.attributes.position.needsUpdate = true;
            }
        }

        class LightningFlash {
            constructor() {
                const geo = trackDispose(new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 6, 0), new THREE.Vector3(0, 0, 0)
                ]));
                this.mat = trackDispose(new THREE.LineBasicMaterial({ color: PALETTE.lightning, transparent: true, opacity: 0 }));
                this.bolt = new THREE.Line(geo, this.mat);
                simGroup.add(this.bolt);

                this.light = new THREE.PointLight(PALETTE.lightning, 0, 14);
                simGroup.add(this.light);
                this.timer = 0;
            }

            update(dt, cx, topY, cz, active = false) {
                if (!active) {
                    this.mat.opacity = 0;
                    this.light.intensity = 0;
                    return;
                }
                this.timer -= dt;
                if (this.timer <= 0) {
                    this.timer = 0.55 + Math.random() * 1.1;
                    const pts = [];
                    const segs = 7;
                    const ox = cx + (Math.random() - 0.5) * 1.6;
                    const oz = cz + (Math.random() - 0.5) * 3.5;
                    for (let i = 0; i <= segs; i++) {
                        const r = i / segs;
                        pts.push(new THREE.Vector3(
                            ox + (i === 0 || i === segs ? 0 : (Math.random() - 0.5) * 1.1),
                            topY * (1 - r),
                            oz + (i === 0 || i === segs ? 0 : (Math.random() - 0.5) * 1.1)
                        ));
                    }
                    this.bolt.geometry.setFromPoints(pts);
                    this.mat.opacity = 1.0;
                    this.light.position.set(ox, topY * 0.55, oz);
                    this.light.intensity = 5.5;
                } else {
                    this.mat.opacity = Math.max(0, this.mat.opacity - dt * 6.5);
                    this.light.intensity = Math.max(0, this.light.intensity - dt * 32);
                }
            }
        }

        // (E) 地面氣象鋒面符號線 (冷鋒三角、暖鋒半圓、滯留鋒交替、閉塞鋒同側)
        class SurfaceFrontLine {
            constructor(type = 'cold', count = 8) {
                this.type = type;
                this.group = new THREE.Group();
                simGroup.add(this.group);

                const baseColor =
                    type === 'cold' ? PALETTE.cold :
                        type === 'warm' ? PALETTE.warm :
                            type === 'occluded' ? PALETTE.occluded : 0xe2e8f0;

                this.lineGeo = trackDispose(new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0.06, -6), new THREE.Vector3(0, 0.06, 6)
                ]));
                this.lineMat = trackDispose(new THREE.LineBasicMaterial({ color: baseColor }));
                this.line = new THREE.Line(this.lineGeo, this.lineMat);
                this.group.add(this.line);

                const triGeo = trackDispose(new THREE.ConeGeometry(0.32, 0.65, 3));
                triGeo.rotateX(Math.PI / 2); // 預設指向 +Z

                const semiGeo = trackDispose(new THREE.CylinderGeometry(0.32, 0.32, 0.1, 16, 1, false, 0, Math.PI));

                this.markers = [];
                for (let i = 0; i < count; i++) {
                    let isTri = true;
                    let mColor = baseColor;
                    let flipSide = 1;

                    if (type === 'warm') {
                        isTri = false;
                    } else if (type === 'stationary') {
                        isTri = i % 2 === 0;
                        mColor = isTri ? PALETTE.cold : PALETTE.warm;
                        flipSide = isTri ? 1 : -1;
                    } else if (type === 'occluded') {
                        isTri = i % 2 === 0;
                        mColor = PALETTE.occluded;
                    }

                    const mat = trackDispose(new THREE.MeshBasicMaterial({ color: mColor }));
                    const mesh = new THREE.Mesh(isTri ? triGeo : semiGeo, mat);
                    this.group.add(mesh);
                    this.markers.push({ mesh, isTri, flipSide, u: (i + 0.5) / count });
                }
            }

            updateCurve(points3D, normalSide = 1, visible = true) {
                this.group.visible = visible;
                if (!visible) return;

                const curve = new THREE.CatmullRomCurve3(points3D);
                this.line.geometry.setFromPoints(curve.getPoints(32));

                const up = new THREE.Vector3(0, 1, 0);
                for (const m of this.markers) {
                    const pt = curve.getPointAt(m.u);
                    const tan = curve.getTangentAt(m.u).normalize();
                    const dir = new THREE.Vector3().crossVectors(up, tan).normalize().multiplyScalar(normalSide * m.flipSide);

                    if (m.isTri) {
                        m.mesh.position.copy(pt).addScaledVector(dir, 0.3);
                        m.mesh.position.y = 0.08;
                        m.mesh.lookAt(pt.clone().add(dir));
                    } else {
                        m.mesh.position.copy(pt);
                        m.mesh.position.y = 0.07;
                        const angle = Math.atan2(dir.x, dir.z);
                        m.mesh.rotation.set(0, angle - Math.PI / 2, 0);
                    }
                }
            }
        }

        // 地面等壓線圓環與 H / L 標記輔助函式
        function createIsobarRing(rx, rz, color = 0x94a3b8, opacity = 0.45) {
            const pts = [];
            const segs = 64;
            for (let i = 0; i <= segs; i++) {
                const a = (i / segs) * Math.PI * 2;
                pts.push(new THREE.Vector3(Math.cos(a) * rx, 0.05, Math.sin(a) * rz));
            }
            const geo = trackDispose(new THREE.BufferGeometry().setFromPoints(pts));
            const mat = trackDispose(new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
            const line = new THREE.Line(geo, mat);
            simGroup.add(line);
            return { line, mat, rx, rz };
        }
