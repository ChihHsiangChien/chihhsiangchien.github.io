                    warmSouth.update(-11.8, 11.8, -6.8, 6.8, (x, z) => slopeZ(z), (x, z) => Math.max(4.5, slopeZ(z) + 2.4));

                    frontLine.updateCurve([
                        new THREE.Vector3(-11.5, 0.06, fz),
                        new THREE.Vector3(0, 0.06, fz + 0.35),
                        new THREE.Vector3(11.5, 0.06, fz)
                    ], 1, true);

                    const build = THREE.MathUtils.smoothstep(p, 0.2, 0.65);
                    cloudBand1.setState({ x: -5.2, y: 4.1, z: fz - 1.8, scale: 0.45 + build * 0.55, opacity: 0.35 + build * 0.58, elapsed });
                    cloudBand2.setState({ x: 5.2, y: 4.3, z: fz - 1.6, scale: 0.45 + build * 0.55, opacity: 0.35 + build * 0.58, elapsed });

                    const rainInt = THREE.MathUtils.smoothstep(p, 0.35, 0.78);
                    meiyuRain.update(dt, 0, 3.6, fz - 1.7, rainInt);

                    coldParallel.forEach(s => s.update(elapsed, p));
                    warmParallel.forEach(s => s.update(elapsed, p));

                    lblFront.pos.set(0, 0.9, fz + 1.1);
                    lblCloud.pos.set(0, 6.9, fz - 1.8);
                };
            },

            // -----------------------------------------------------------------------
            // 1-4 閉塞鋒 (Occluded Front / 囚錮鋒)
            // -----------------------------------------------------------------------
            occluded_front() {
                const coldRear = new AirVolume(PALETTE.coldDeep, 0.36);   // 後方更冷氣團
                const coldAhead = new AirVolume(PALETTE.cold, 0.26);      // 前方次冷氣團
                const warmAloft = new AirVolume(PALETTE.warm, 0.28);      // 被抬離地面的暖舌

                const coldFrontLine = new SurfaceFrontLine('cold', 7);
                const warmFrontLine = new SurfaceFrontLine('warm', 7);
                const occFrontLine = new SurfaceFrontLine('occluded', 8);

                const complexCloud = new CloudCluster({ x: 0, y: 5.4, z: 0, sx: 6.5, sy: 4.5, sz: 9.5, puffs: 26, darkness: 0.24 });
                const rain = new RainSystem({ count: 280, width: 5.5, height: 4.5, depth: 9.5, slantX: 0.0 });

                const rearStream = new FlowStream({
                    color: PALETTE.cold, count: 4, speed: 0.42,
                    pointsFn: (p) => {
                        const cx = THREE.MathUtils.lerp(-5.5, 1.5, p);
                        return [new THREE.Vector3(-11, 1.1, -2), new THREE.Vector3(cx - 3.5, 1.2, -2), new THREE.Vector3(cx - 0.5, 0.8, -2)];
                    }
                });

                const warmSqueezeStream = [-2.5, 2.5].map(z => new FlowStream({
                    color: PALETTE.warm, count: 5, speed: 0.38,
                    pointsFn: (p) => {
                        const lift = THREE.MathUtils.smoothstep(p, 0.25, 0.75) * 3.4;
                        const midX = THREE.MathUtils.lerp(-1.0, 1.5, p);
                        return [
                            new THREE.Vector3(midX - 2.5, 1.2 + lift, z),
                            new THREE.Vector3(midX, 2.6 + lift * 1.15, z),
                            new THREE.Vector3(midX + 3.8, 4.8 + lift * 0.8, z)
                        ];
                    }
                }));

                const lblRear = addSimLabel('後方更冷氣團', '移速快・楔入最底層', 'cold', -7, 2.8, 0);
                const lblAhead = addSimLabel('前方次冷氣團', '退居右側低層', 'cold', 7.5, 2.0, 0);
                const lblWarmTongue = addSimLabel('暖空氣被抬離地面 (囚錮)', '高空 V 型暖舌', 'warm', 0, 6.2, 0);
                const lblOcc = addSimLabel('地面閉塞鋒 (紫色)', '溫帶氣旋發展末期特徵', 'occluded', 1, 0.9, 5.2);

                return (p, dt, elapsed) => {
                    // 冷鋒追趕暖鋒：在 p ≈ 0.42 追上並產生閉塞高度 liftY
                    const coldX = THREE.MathUtils.lerp(-5.5, 2.2, p);
                    const warmX = THREE.MathUtils.lerp(-0.5, 1.5, p);
                    const occluded = coldX >= warmX;
                    const meetX = occluded ? coldX : 0;
                    const liftBase = occluded ? (coldX - warmX) * 1.65 : 0;

                    const hRear = (x) => x > coldX ? 0 : Math.min(5.6, Math.pow((coldX - x) / 8.5, 0.65) * 5.2);
                    const hAhead = (x) => x < warmX ? 0 : Math.min(5.2, ((x - warmX) / 10.5) * 5.0);

                    coldRear.update(-12, coldX, -6.8, 6.8, () => 0.02, (x) => hRear(x));
                    coldAhead.update(warmX, 12, -6.8, 6.8, (x) => hRear(x), (x) => Math.max(hRear(x), hAhead(x)));
                    warmAloft.update(-8, 9, -6.8, 6.8,
                        (x) => Math.max(hRear(x), hAhead(x), liftBase * 0.4),
                        (x) => Math.max(hRear(x), hAhead(x)) + 2.6 * (1 - p * 0.25)
                    );

                    coldFrontLine.updateCurve([new THREE.Vector3(coldX, 0.06, -6.5), new THREE.Vector3(coldX, 0.06, 6.5)], -1, !occluded);
                    warmFrontLine.updateCurve([new THREE.Vector3(warmX, 0.06, -6.5), new THREE.Vector3(warmX, 0.06, 6.5)], -1, !occluded);
                    occFrontLine.updateCurve([new THREE.Vector3(meetX, 0.06, -6.5), new THREE.Vector3(meetX + 0.3, 0.06, 0), new THREE.Vector3(meetX, 0.06, 6.5)], -1, occluded);

                    const cScale = 0.5 + THREE.MathUtils.smoothstep(p, 0.15, 0.65) * 0.5 - THREE.MathUtils.smoothstep(p, 0.85, 1.0) * 0.2;
                    complexCloud.setState({ x: (coldX + warmX) * 0.5 + 0.8, y: 5.2, z: 0, scale: cScale, opacity: 0.88 * cScale, elapsed });

                    const rainInt = THREE.MathUtils.smoothstep(p, 0.2, 0.65) * (1 - THREE.MathUtils.smoothstep(p, 0.85, 1.0) * 0.55);
                    rain.update(dt, (coldX + warmX) * 0.5 + 0.8, 4.4, 0, rainInt);

                    rearStream.update(elapsed, p);
                    warmSqueezeStream.forEach(s => s.update(elapsed, p));

                    lblWarmTongue.pos.set((coldX + warmX) * 0.5, 4.2 + liftBase * 1.2, 0);
                    lblOcc.el.style.opacity = occluded ? '1' : '0.2';
                    lblOcc.pos.set(meetX, 0.9, 5.2);
                };
            },

            // -----------------------------------------------------------------------
            // 2-1 溫帶氣旋 / 低氣壓系統 (Extra-tropical Cyclone - 北半球逆時針渦旋)
            // -----------------------------------------------------------------------
            cyclone() {
                const rings = [
                    createIsobarRing(2.2, 1.8, 0x38bdf8, 0.7),
                    createIsobarRing(4.8, 3.8, 0x64748b, 0.5),
                    createIsobarRing(7.8, 6.0, 0x475569, 0.35)
                ];

                const coldFront = new SurfaceFrontLine('cold', 6);
                const warmFront = new SurfaceFrontLine('warm', 6);

                // 北半球逆時針旋入並向中心抬升的 5 條螺旋氣流
                const spiralStreams = [0, 1, 2, 3, 4].map(i => {
                    const baseAngle = (i / 5) * Math.PI * 2;
                    const isWarmSector = i === 1 || i === 2;
                    return new FlowStream({
                        color: isWarmSector ? PALETTE.warm : PALETTE.cold,
                        count: 5,
                        speed: 0.36,
                        pointsFn: (p) => {
                            const spin = p * 0.8;
                            const pts = [];
                            for (let k = 0; k <= 5; k++) {
                                const t = k / 5; // 0(外圍低空) -> 1(中心高空)
                                const r = THREE.MathUtils.lerp(8.5, 0.7, t);
                                // 北半球俯視逆時針：角度在 X-Z 平面向負方向旋轉 (cos(a), -sin(a))
                                const ang = baseAngle - spin - t * 2.1;
                                const y = 0.4 + Math.pow(t, 1.7) * (2.5 + p * 4.5);
                                pts.push(new THREE.Vector3(Math.cos(ang) * r, y, -Math.sin(ang) * r * 0.78));
                            }
                            return pts;
                        }
                    });
                });

                // 逗點狀雲系 (Comma Cloud: 氣旋中心雲團 + 暖鋒雲臂 + 冷鋒雲尾)
                const commaHead = new CloudCluster({ x: -0.8, y: 6.0, z: -1.2, sx: 5.2, sy: 2.5, sz: 4.5, puffs: 18, darkness: 0.18 });
                const warmArm = new CloudCluster({ x: 3.8, y: 4.8, z: -0.8, sx: 5.5, sy: 1.6, sz: 3.5, puffs: 14, darkness: 0.14 });
                const coldTail = new CloudCluster({ x: -3.2, y: 4.5, z: 2.8, sx: 3.0, sy: 2.8, sz: 5.5, puffs: 15, darkness: 0.22 });
                const rain = new RainSystem({ count: 240, width: 6.5, height: 4.5, depth: 5.5, slantX: 0.2 });

                const lblLow = addSimLabel('L 低氣壓中心', '中心氣壓最低・強烈輻合上升', 'warm', 0, 1.2, 0);
                const lblVortex = addSimLabel('北半球逆時針旋入氣流', '科氏力偏向 + 氣壓梯度力', 'cold', -6.5, 2.2, -3);
                const lblComma = addSimLabel('三維逗點狀螺旋雲系', '結合東側暖鋒與西側冷鋒', 'cloud', 0, 8.2, -1.5);

                return (p, dt, elapsed) => {
                    const tighten = 1 - p * 0.22;
                    rings.forEach((r, idx) => {
                        r.line.scale.set(tighten, 1, tighten);
                        r.mat.opacity = 0.25 + p * 0.45 - idx * 0.1;
                    });

                    // 冷鋒由中心向西南延伸並隨氣旋逆時針擺動；暖鋒向東偏南延伸
                    const cfAngle = -2.2 - p * 0.65; // 西南轉正南追趕
                    const wfAngle = -0.35 - p * 0.15;

                    const showFronts = p > 0.18;
                    coldFront.updateCurve([
                        new THREE.Vector3(0, 0.07, 0),
                        new THREE.Vector3(Math.cos(cfAngle) * 4.2, 0.07, -Math.sin(cfAngle) * 3.5),
                        new THREE.Vector3(Math.cos(cfAngle - 0.2) * 8.2, 0.07, -Math.sin(cfAngle - 0.2) * 6.2)
                    ], -1, showFronts);

                    warmFront.updateCurve([
                        new THREE.Vector3(0, 0.07, 0),
                        new THREE.Vector3(Math.cos(wfAngle) * 4.5, 0.07, -Math.sin(wfAngle) * 3.5),
                        new THREE.Vector3(Math.cos(wfAngle) * 8.8, 0.07, -Math.sin(wfAngle) * 5.8)
                    ], 1, showFronts);

                    const cVis = THREE.MathUtils.smoothstep(p, 0.22, 0.68);
                    commaHead.setState({ x: -0.6, y: 5.8, z: -1.0, scale: cVis, opacity: cVis * 0.9, elapsed });
                    warmArm.setState({ x: 3.6, y: 4.6, z: -0.5, scale: cVis, opacity: cVis * 0.85, elapsed });
                    coldTail.setState({ x: Math.cos(cfAngle) * 4.2, y: 4.3, z: -Math.sin(cfAngle) * 3.3, scale: cVis, opacity: cVis * 0.88, elapsed });

                    rain.update(dt, 0.5, 4.5, -0.5, cVis * 0.85);
                    spiralStreams.forEach(s => s.update(elapsed, p));
                };
            },

            // -----------------------------------------------------------------------
            // 2-2 高氣壓系統 / 反氣旋 (Anticyclone - 下沉氣流與順時針向外輻散)
            // -----------------------------------------------------------------------
            anticyclone() {
                const rings = [
                    createIsobarRing(2.8, 2.2, 0x38bdf8, 0.65),
                    createIsobarRing(5.8, 4.6, 0x64748b, 0.45),
                    createIsobarRing(9.0, 6.4, 0x475569, 0.30)
                ];

                // 中心高空下沉 ➔ 近地面北半球順時針向外旋出輻散
                const anticycloneStreams = [0, 1, 2, 3, 4, 5].map(i => {
                    const baseAngle = (i / 6) * Math.PI * 2;
                    return new FlowStream({
                        color: PALETTE.cold,
                        colorEnd: 0x93c5fd,
                        count: 5,
                        speed: 0.32,
                        pointsFn: (p) => {
                            const pts = [];
                            for (let k = 0; k <= 5; k++) {
                                const t = k / 5; // 0(高空中心匯聚) -> 1(地面外圍順時針擴散)
                                const r = THREE.MathUtils.lerp(0.6, 9.2, Math.pow(t, 1.3));
                                // 順時針：角度隨半徑向外遞增 (+ang)
                                const ang = baseAngle + t * 1.85 + p * 0.5;
                                const y = THREE.MathUtils.lerp(8.2, 0.45, Math.pow(t, 0.68));
                                pts.push(new THREE.Vector3(Math.cos(ang) * r, y, -Math.sin(ang) * r * 0.72));
                            }
                            return pts;
                        }
                    });
                });

                // 外圍零星晴天小積雲（中心因下沉增溫完全晴朗無雲）
                const fairClouds = [
                    new CloudCluster({ x: -9.2, y: 2.4, z: -4.5, sx: 2.0, sy: 0.7, sz: 1.8, puffs: 6 }),
                    new CloudCluster({ x: 9.2, y: 2.4, z: 4.2, sx: 2.0, sy: 0.7, sz: 1.8, puffs: 6 })
                ];

                // 中心清澈陽光柱視覺效果
                const sunConeGeo = trackDispose(new THREE.CylinderGeometry(1.5, 5.5, 8.5, 24, 1, true));
                const sunConeMat = trackDispose(new THREE.MeshBasicMaterial({
                    color: 0xfef08a,
                    transparent: true,
                    opacity: 0.06,
                    side: THREE.DoubleSide,
                    depthWrite: false
                }));
                const sunCone = new THREE.Mesh(sunConeGeo, sunConeMat);
                sunCone.position.y = 4.25;
                simGroup.add(sunCone);

                const lblHigh = addSimLabel('H 高氣壓中心', '天氣晴朗穩定・風速微弱', 'cold', 0, 1.2, 0);
                const lblSub = addSimLabel('高空空氣匯聚下沉', '絕熱壓縮增溫・水氣蒸發無雲', 'warm', 0, 7.8, 0);
                const lblDiv = addSimLabel('北半球順時針向外輻散', '低層空氣向四周擴散', 'cold', 6.5, 1.5, 3.8);

                return (p, dt, elapsed) => {
                    sunConeMat.opacity = 0.03 + THREE.MathUtils.smoothstep(p, 0.3, 0.9) * 0.07;
                    rings.forEach(r => {
                        const s = 0.85 + p * 0.18;
                        r.line.scale.set(s, 1, s);
                    });
                    anticycloneStreams.forEach(s => s.update(elapsed, p));
                    const edgeFade = 1 - THREE.MathUtils.smoothstep(p, 0.2, 0.7) * 0.45;
                    fairClouds.forEach(c => c.setState({ scale: edgeFade, opacity: 0.55 * edgeFade, elapsed }));
                };
            },

            // -----------------------------------------------------------------------
            // 2-3 高空噴射氣流 (Jet Stream - 羅斯貝波與高低空耦合)
            // -----------------------------------------------------------------------
            jet_stream() {
                // 北方極區冷空氣團 (低溫頂面較低)
                const polarCold = new AirVolume(PALETTE.cold, 0.18, 28, 12);

                // 蜿蜒的高空噴射氣流光帶 (TubeGeometry)
                const jetMat = trackDispose(new THREE.MeshStandardMaterial({
                    color: PALETTE.jet,
                    emissive: 0xd97706,
                    emissiveIntensity: 0.55,
                    transparent: true,
                    opacity: 0.72,
                    roughness: 0.3
                }));
                const jetRibbon = new THREE.Mesh(new THREE.BufferGeometry(), jetMat);
                simGroup.add(jetRibbon);

                const jetCoreStream = new FlowStream({
                    color: PALETTE.jet,
                    count: 9,
                    speed: 0.68,
                    size: 0.30,
                    showLine: false,
                    pointsFn: (p) => getJetPoints(p, 0)
                });

                function getJetPoints(p, phaseShift = 0) {
                    const amp = THREE.MathUtils.lerp(0.6, 3.6, THREE.MathUtils.smoothstep(p, 0.12, 0.55));
                    const shift = p * 2.2 + phaseShift;
                    const pts = [];
                    for (let i = 0; i <= 16; i++) {
                        const u = i / 16;
                        const x = THREE.MathUtils.lerp(-11.8, 11.8, u);
                        const z = Math.sin(u * Math.PI * 2 - shift) * amp;
                        const y = 8.4 + Math.cos(u * Math.PI * 2 - shift) * 0.35;
                        pts.push(new THREE.Vector3(x, y, z));
                    }
                    return pts;
                }

                // 槽前上升抽吸氣流 (連接地面氣旋 L 與高空噴流槽前輻散區)
                const chimneyUp = new FlowStream({
                    color: PALETTE.warm, count: 5, speed: 0.45,
                    pointsFn: (p) => {
                        const lx = THREE.MathUtils.lerp(-1.5, 4.5, p);
                        return [
                            new THREE.Vector3(lx - 1.5, 0.5, 2.2),
                            new THREE.Vector3(lx, 2.8, 1.2),
                            new THREE.Vector3(lx + 0.4, 6.2, 0.6),
                            new THREE.Vector3(lx + 1.8, 8.3, -0.5)
                        ];
                    }
                });

                const sfcLowRing = createIsobarRing(2.4, 2.0, PALETTE.warm, 0.65);
                const cycCloud = new CloudCluster({ x: 0, y: 4.8, z: 1.0, sx: 4.2, sy: 2.2, sz: 3.8, puffs: 14, darkness: 0.18 });

                const lblJet = addSimLabel('高空噴射氣流 (Jet Stream)', '9~12km 對流層頂高速西風長河', 'jet', -4, 9.6, 0);
                const lblTrough = addSimLabel('高空槽 (Trough) 與槽前輻散', '高空抽氣效應誘發地面氣旋', 'jet', 2, 8.8, 2.5);
                const lblSfcL = addSimLabel('L 地面溫帶氣旋', '受噴射氣流導引向東移動', 'warm', 1, 1.1, 1.2);

                return (p, dt, elapsed) => {
                    const pts = getJetPoints(p, elapsed * 0.25);
                    const curve = new THREE.CatmullRomCurve3(pts);

                    if (jetRibbon.geometry) jetRibbon.geometry.dispose();
                    jetRibbon.geometry = new THREE.TubeGeometry(curve, 64, 0.48, 10, false);

                    // 北側極區冷空氣隨噴流南北蜿蜒
                    polarCold.update(-11.8, 11.8, -6.8, 3.5, () => 0.02, (x, z) => {
                        const u = (x + 11.8) / 23.6;
                        const jetZ = curve.getPointAt(THREE.MathUtils.clamp(u, 0, 1)).z;
                        return z < jetZ ? THREE.MathUtils.clamp((jetZ - z) * 1.4, 0, 7.5) : 0;
                    });

                    jetCoreStream.pointsFn = () => pts;
                    jetCoreStream.update(elapsed, p);

                    const couple = THREE.MathUtils.smoothstep(p, 0.45, 0.78);
                    const lx = THREE.MathUtils.lerp(-1.5, 4.5, p);
                    chimneyUp.opacityScale = couple;
                    chimneyUp.update(elapsed, p);

                    sfcLowRing.line.position.set(lx, 0, 1.0);
                    sfcLowRing.mat.opacity = couple * 0.75;
                    cycCloud.setState({ x: lx + 0.3, y: 4.8, z: 0.9, scale: couple, opacity: couple * 0.88, elapsed });

                    lblJet.pos.copy(curve.getPointAt(0.22)).add(new THREE.Vector3(0, 1.1, 0));
                    lblTrough.pos.copy(curve.getPointAt(0.62)).add(new THREE.Vector3(0, 1.0, 0));
                    lblSfcL.pos.set(lx, 1.1, 1.2);
                    lblSfcL.el.style.opacity = couple > 0.2 ? '1' : '0.2';
                };
            },

            // -----------------------------------------------------------------------
            // 3-1 雷暴與超級胞 (Supercell - 中氣旋旋轉上升與微爆下衝流)
            // -----------------------------------------------------------------------
            supercell() {
                const cloudBase = new CloudCluster({ x: -1.2, y: 2.8, z: 0, sx: 5.5, sy: 1.6, sz: 5.5, puffs: 16, darkness: 0.32 });
                const cloudTower = new CloudCluster({ x: -0.8, y: 5.8, z: 0, sx: 4.2, sy: 4.8, sz: 4.2, puffs: 20, darkness: 0.24 });
                const cloudAnvil = new CloudCluster({ x: 1.8, y: 9.0, z: 0, sx: 9.5, sy: 1.5, sz: 7.5, puffs: 22, darkness: 0.08 });
                const overshootingTop = new CloudCluster({ x: -0.8, y: 10.2, z: 0, sx: 2.6, sy: 1.2, sz: 2.6, puffs: 8, darkness: 0.02 });

                // 雙股螺旋旋轉上升氣流 (Mesocyclone 中氣旋)
                const mesoStreams = [0, Math.PI].map(phase => new FlowStream({
                    color: PALETTE.warm,
                    colorEnd: PALETTE.warmHot,
                    count: 6,
                    speed: 0.52,
                    pointsFn: (p) => {
                        const topH = THREE.MathUtils.lerp(4.0, 9.5, THREE.MathUtils.smoothstep(p, 0.05, 0.65));
                        const turns = THREE.MathUtils.lerp(0.6, 2.8, THREE.MathUtils.smoothstep(p, 0.2, 0.6));
                        const pts = [];
                        for (let k = 0; k <= 8; k++) {
                            const t = k / 8;
                            const ang = phase + t * Math.PI * 2 * turns;
                            const r = THREE.MathUtils.lerp(2.2, 0.9, t);
                            pts.push(new THREE.Vector3(-1.0 + Math.cos(ang) * r, 0.5 + t * topH, Math.sin(ang) * r));
                        }
                        return pts;
                    }
                }));

                // 下衝流與地面微爆擴散氣流 (Downdraft / Microburst)
                const microburstStreams = [-1, 0, 1].map(dirZ => new FlowStream({
                    color: PALETTE.cold, count: 4, speed: 0.58,
                    pointsFn: () => [
                        new THREE.Vector3(2.5, 6.2, dirZ * 0.8),
                        new THREE.Vector3(2.8, 2.5, dirZ * 1.1),
                        new THREE.Vector3(3.2, 0.45, dirZ * 1.6),
                        new THREE.Vector3(6.8, 0.35, dirZ * 3.8)
                    ]
                }));

                const heavyRain = new RainSystem({ count: 300, width: 3.2, height: 5.2, depth: 3.8, slantX: 0.35 });
                const lightning = new LightningFlash();

                // 地面微爆衝擊波環
                const burstRing = createIsobarRing(1.0, 1.0, PALETTE.cold, 0.0);

                const lblMeso = addSimLabel('旋轉上升氣流 (中氣旋 Mesocyclone)', '強烈垂直風切誘發渦旋柱', 'warm', -1.2, 5.2, 2.6);
                const lblAnvil = addSimLabel('巨大砧狀雲頂 (Anvil) 與穿透雲頂', '猛烈對流撞擊對流層頂外擴', 'cloud', 2.2, 10.6, 0);
                const lblBurst = addSimLabel('下衝流與微爆氣流 (Microburst)', '降水蒸發冷卻砸向地面向外爆發', 'cold', 4.5, 1.4, 2.5);

                return (p, dt, elapsed) => {
                    const towerBuild = THREE.MathUtils.smoothstep(p, 0.05, 0.55);
                    const anvilBuild = THREE.MathUtils.smoothstep(p, 0.45, 0.78);
                    const burstBuild = THREE.MathUtils.smoothstep(p, 0.72, 0.96);

                    cloudBase.setState({ y: 2.6, scale: 0.5 + towerBuild * 0.5, opacity: 0.92, elapsed });
                    cloudTower.setState({ y: 3.2 + towerBuild * 2.5, scale: 0.45 + towerBuild * 0.55, scaleY: 0.3 + towerBuild * 0.75, opacity: 0.92, elapsed });
                    cloudTower.group.rotation.y = elapsed * 0.35 * THREE.MathUtils.smoothstep(p, 0.25, 0.6);

                    cloudAnvil.setState({ x: 1.8, y: 8.9, scale: anvilBuild, opacity: anvilBuild * 0.9, elapsed });
                    overshootingTop.setState({ y: 10.1, scale: anvilBuild, opacity: anvilBuild * 0.92, elapsed });

                    mesoStreams.forEach(s => s.update(elapsed, p));
                    microburstStreams.forEach(s => {
                        s.opacityScale = burstBuild;
                        s.update(elapsed, p);
                    });

                    heavyRain.update(dt, 2.8, 5.2, 0, burstBuild);
                    lightning.update(dt, 0.5, 7.8, 0, p > 0.52);

                    if (burstBuild > 0.05) {
                        const pulse = (elapsed * 0.9) % 1;
                        const s = 1.0 + pulse * 4.2;
                        burstRing.line.position.set(3.2, 0.06, 0);
                        burstRing.line.scale.set(s, 1, s);
                        burstRing.mat.opacity = (1 - pulse) * 0.75 * burstBuild;
                    } else {
                        burstRing.mat.opacity = 0;
                    }

                    lblAnvil.el.style.opacity = anvilBuild > 0.25 ? '1' : '0.2';
                    lblBurst.el.style.opacity = burstBuild > 0.2 ? '1' : '0.2';
                };
            },

            // -----------------------------------------------------------------------
            // 3-2 海陸風環流 (Sea & Land Breeze - 日夜熱力循環)
            // -----------------------------------------------------------------------
            sea_land_breeze() {
                // 左半部：海洋 (-12 ~ 0)，右半部：陸地與緩丘 (0 ~ 12)
                const seaMesh = new THREE.Mesh(
                    trackDispose(new THREE.BoxGeometry(12, 0.16, SLAB_D)),
                    trackDispose(new THREE.MeshStandardMaterial({ color: PALETTE.groundSea, roughness: 0.25, metalness: 0.3 }))
                );
                seaMesh.position.set(-6, 0.06, 0);
                simGroup.add(seaMesh);

                const landMesh = new THREE.Mesh(
                    trackDispose(new THREE.BoxGeometry(12, 0.24, SLAB_D)),
                    trackDispose(new THREE.MeshStandardMaterial({ color: PALETTE.groundLand, roughness: 0.85 }))
                );
                landMesh.position.set(6, 0.10, 0);
                simGroup.add(landMesh);

                // 太陽與月亮天體模型
                const sunOrb = new THREE.Mesh(
                    trackDispose(new THREE.SphereGeometry(0.85, 20, 20)),
                    trackDispose(new THREE.MeshBasicMaterial({ color: 0xfde047 }))
                );
                const moonOrb = new THREE.Mesh(
                    trackDispose(new THREE.SphereGeometry(0.65, 20, 20)),
                    trackDispose(new THREE.MeshBasicMaterial({ color: 0xe2e8f0 }))
                );
                simGroup.add(sunOrb, moonOrb);

                // 白天海風環流 (海洋 -> 陸地近地面，陸地上升 -> 高空回海下沉)
                const seaBreezeLow = [-3, 3].map(z => new FlowStream({
                    color: PALETTE.cold, colorEnd: PALETTE.warm, count: 5, speed: 0.38,
                    pointsFn: () => [
                        new THREE.Vector3(-6.5, 0.9, z),
                        new THREE.Vector3(0, 0.8, z),
                        new THREE.Vector3(6.5, 1.2, z),
                        new THREE.Vector3(7.2, 4.8, z)
                    ]
                }));
                const seaBreezeReturn = [-3, 3].map(z => new FlowStream({
                    color: PALETTE.warm, colorEnd: PALETTE.cold, count: 5, speed: 0.35,
                    pointsFn: () => [
                        new THREE.Vector3(6.8, 5.4, z),
                        new THREE.Vector3(0, 5.8, z),
                        new THREE.Vector3(-6.8, 5.2, z),
                        new THREE.Vector3(-7.2, 1.4, z)
                    ]
                }));

                // 夜晚陸風環流 (陸地 -> 海洋近地面，海面上升 -> 高空回陸下沉)
                const landBreezeLow = [-3, 3].map(z => new FlowStream({
                    color: PALETTE.cold, colorEnd: PALETTE.warm, count: 5, speed: 0.34,
                    pointsFn: () => [
                        new THREE.Vector3(6.5, 0.9, z),
                        new THREE.Vector3(0, 0.8, z),
                        new THREE.Vector3(-6.5, 1.2, z),
                        new THREE.Vector3(-7.2, 4.4, z)
                    ]
                }));
                const landBreezeReturn = [-3, 3].map(z => new FlowStream({
                    color: PALETTE.warm, colorEnd: PALETTE.cold, count: 5, speed: 0.32,
                    pointsFn: () => [
                        new THREE.Vector3(-6.8, 4.9, z),
                        new THREE.Vector3(0, 5.3, z),
                        new THREE.Vector3(6.8, 4.8, z),
                        new THREE.Vector3(7.2, 1.4, z)
                    ]
                }));

                const dayLandCloud = new CloudCluster({ x: 6.5, y: 6.2, z: 0, sx: 4.2, sy: 1.8, sz: 6.5, puffs: 14, darkness: 0.08 });
                const nightSeaCloud = new CloudCluster({ x: -6.5, y: 5.6, z: 0, sx: 4.2, sy: 1.5, sz: 6.5, puffs: 12, darkness: 0.12 });

                const lblSea = addSimLabel('海洋 (比熱大・溫差小)', '白天較涼 / 夜晚較暖', 'cold', -6.5, 0.6, 5.2);
                const lblLand = addSimLabel('陸地 (比熱小・升降溫快)', '白天酷熱 / 夜晚冷卻快', 'warm', 6.5, 0.7, 5.2);
                const lblBreeze = addSimLabel('海風 (Sea Breeze)', '白天近地面由海吹向陸', 'cold', 0, 2.0, 0);

                return (p, dt, elapsed) => {
                    const isNight = p >= 0.52;
                    const dayStrength = !isNight ? THREE.MathUtils.smoothstep(p, 0.02, 0.32) * (1 - THREE.MathUtils.smoothstep(p, 0.44, 0.52)) : 0;
                    const nightStrength = isNight ? THREE.MathUtils.smoothstep(p, 0.56, 0.85) : 0;

                    // 日夜光照平滑切換
                    const nightBlend = THREE.MathUtils.smoothstep(p, 0.46, 0.60);
                    ambientLight.intensity = THREE.MathUtils.lerp(0.95, 0.38, nightBlend);
                    dirLight.intensity = THREE.MathUtils.lerp(1.5, 0.45, nightBlend);
                    dirLight.color.setHex(isNight ? 0x93c5fd : 0xfffbeb);

                    sunOrb.visible = !isNight;
                    sunOrb.position.set(4, 9.2, -5);
                    moonOrb.visible = isNight;
                    moonOrb.position.set(-4, 9.0, -5);

                    seaBreezeLow.forEach(s => { s.opacityScale = dayStrength; s.update(elapsed, p); });
                    seaBreezeReturn.forEach(s => { s.opacityScale = dayStrength; s.update(elapsed, p); });

                    landBreezeLow.forEach(s => { s.opacityScale = nightStrength; s.update(elapsed, p); });
                    landBreezeReturn.forEach(s => { s.opacityScale = nightStrength; s.update(elapsed, p); });

                    dayLandCloud.setState({ scale: dayStrength, opacity: dayStrength * 0.9, elapsed });
                    nightSeaCloud.setState({ scale: nightStrength, opacity: nightStrength * 0.85, elapsed });

                    if (!isNight) {
                        lblBreeze.el.innerHTML = `海風環流 (Sea Breeze)<span class="sub">白天陸地熱低壓上升・涼爽海風吹入陸地</span>`;
                    } else {
                        lblBreeze.el.innerHTML = `陸風環流 (Land Breeze)<span class="sub">夜晚陸地輻射冷卻下沉・陸風吹向溫暖海面</span>`;
                    }
                };
            },

            // -----------------------------------------------------------------------
            // 3-3 地形雨與焚風效應 (Orographic Precipitation & Foehn Wind)
            // -----------------------------------------------------------------------
            foehn() {
                // 中央高聳山脈 3D 地形網格 (高斯山脊 h(x) = 5.8 * exp(-(x/3.3)^2))
                const mtnH = (x, z) => {
                    const ridge = 5.8 * Math.exp(-Math.pow(x / 3.4, 2));
                    const detail = Math.cos(z * 0.65) * 0.35 * Math.exp(-Math.pow(x / 4.2, 2));
                    return Math.max(0, ridge + detail - 0.15);
                };

                const mtnGeo = trackDispose(new THREE.PlaneGeometry(SLAB_W, SLAB_D, 64, 32));
                mtnGeo.rotateX(-Math.PI / 2);
                const pos = mtnGeo.attributes.position;
                const colors = [];
                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const z = pos.getZ(i);
                    const y = mtnH(x, z);
                    pos.setY(i, y);

                    // 依高度著色：平原綠 -> 森林深綠 -> 高山岩灰 -> 山頂微雪色
                    const c = new THREE.Color();
                    if (y < 0.8) c.setHex(0x26463b);
                    else if (y < 3.2) c.setHex(0x2f5241);
                    else if (y < 4.9) c.setHex(0x475569);
                    else c.setHex(0x94a3b8);
                    colors.push(c.r, c.g, c.b);
                }
                mtnGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                mtnGeo.computeVertexNormals();

                const mtnMesh = new THREE.Mesh(
                    mtnGeo,
                    trackDispose(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88 }))
                );
                mtnMesh.receiveShadow = true;
                mtnMesh.castShadow = true;
                simGroup.add(mtnMesh);

                // 迎風面雲牆 (止步於稜線 x ≈ 0.3，形成焚風牆 Foehn Wall)
                const windwardCloud = new CloudCluster({ x: -3.6, y: 4.6, z: 0, sx: 5.2, sy: 2.6, sz: 10.5, puffs: 22, darkness: 0.22 });
                const orographicRain = new RainSystem({ count: 280, width: 4.5, height: 4.2, depth: 10.5, slantX: 0.3 });

                // 跨越山脈氣流：左側迎風濕涼 (青藍) -> 越嶺潛熱釋放 -> 右側背風乾絕熱下沉焚風 (橘紅)
                const foehnStreams = [-4, 0, 4].map(z => new FlowStream({
                    color: PALETTE.cold,
                    colorEnd: PALETTE.warmHot,
                    count: 7,
                    speed: 0.38,
                    pointsFn: (p) => {
                        const maxReachX = THREE.MathUtils.lerp(-2.5, 11.5, THREE.MathUtils.smoothstep(p, 0.0, 0.85));
                        const pts = [];
                        for (let k = 0; k <= 10; k++) {
                            const x = THREE.MathUtils.lerp(-11.5, maxReachX, k / 10);
                            const y = mtnH(x, z) + 0.95 + (x < 0 ? 0.25 : 0.05);
                            pts.push(new THREE.Vector3(x, y, z));
                        }
                        return pts;
                    }
                }));

                // 背風坡乾熱暖空氣區視覺光暈
                const leeHeatZone = new AirVolume(PALETTE.warmHot, 0.22);

                const lblWindward = addSimLabel('迎風坡強迫抬升 (地形雨)', '濕絕熱冷卻 (~6°C/km)・水氣凝結降雨', 'cold', -5.2, 6.6, 0);
                const lblCrest = addSimLabel('山頂焚風牆 (Foehn Wall)', '水氣耗盡・越嶺後雲層迅速消散', 'cloud', 0.2, 7.3, -2.5);
                const lblLee = addSimLabel('背風坡乾熱焚風 (Foehn Wind)', '乾絕熱壓縮增溫 (~10°C/km)・高溫乾燥', 'warm', 6.8, 3.2, 0);

                return (p, dt, elapsed) => {
                    const rainBuild = THREE.MathUtils.smoothstep(p, 0.18, 0.52);
                    const leeBuild = THREE.MathUtils.smoothstep(p, 0.62, 0.94);

                    windwardCloud.setState({ x: -3.5, y: 4.6, z: 0, scale: 0.35 + rainBuild * 0.65, opacity: 0.3 + rainBuild * 0.65, elapsed });
                    orographicRain.update(dt, -3.8, 4.2, 0, rainBuild);

                    foehnStreams.forEach(s => s.update(elapsed, p));

                    if (leeBuild > 0.02) {
                        leeHeatZone.update(1.5, 11.8, -6.6, 6.6, (x, z) => mtnH(x, z) + 0.05, (x, z) => mtnH(x, z) + 2.5 * leeBuild);
                    } else {
                        leeHeatZone.mesh.visible = false;
                    }

                    lblCrest.el.style.opacity = p > 0.52 ? '1' : '0.25';
                    lblLee.el.style.opacity = leeBuild > 0.2 ? '1' : '0.2';
                };
            }
        };

        // =========================================================================
        // 7. 場景生命週期管理與記憶體安全釋放
        // =========================================================================
        let state = {
            catIdx: 0,
            sceneIdx: 0,
            stepIdx: 0,
            progress: 0.08,
            targetProgress: 0.08,
            isPlaying: false,
            showLabels: true,
            panMode: false
        };

        function clearCurrentSim() {
            while (simGroup.children.length > 0) {
                simGroup.remove(simGroup.children[0]);
            }
            for (const obj of disposables) {
                if (obj && typeof obj.dispose === 'function') obj.dispose();
            }
            disposables = [];

            for (const item of activeLabels) {
                if (item.el && item.el.parentNode) item.el.parentNode.removeChild(item.el);
            }
            activeLabels = [];
            resetEnvironmentDefaults();
        }

        // 平滑相機過渡目標
        let camTargetPos = null;
        function flyCameraTo(posArr) {
            camTargetPos = new THREE.Vector3(posArr[0], posArr[1], posArr[2]);
        }

        function loadScene(catIdx, sceneIdx) {
            state.catIdx = catIdx;
            state.sceneIdx = sceneIdx;
            state.isPlaying = false;
            updatePlayBtnUI();

            clearCurrentSim();

            const sceneDef = CATEGORIES[catIdx].scenes[sceneIdx];
            const builder = SCENE_BUILDERS[sceneDef.id];
            currentSceneUpdater = builder ? builder() : null;

            controls.target.set(0, 3.0, 0);
            flyCameraTo(sceneDef.camPos);

            renderTabsUI();
            renderStepperUI();
            jumpToStep(0, true);
        }

        // =========================================================================
        // 8. UI 互動控制與 Step-by-Step 流程同步
        // =========================================================================
        const elCatTabs = document.getElementById('cat-tabs');
        const elSubTabs = document.getElementById('sub-tabs');
        const elStepperRow = document.getElementById('stepper-row');
        const elSceneName = document.getElementById('ui-scene-name');
        const elStepTitle = document.getElementById('ui-step-title');
        const elStepDesc = document.getElementById('ui-step-desc');
        const elSlider = document.getElementById('progress-slider');
        const elPctLabel = document.getElementById('pct-label');
        const elBtnPlay = document.getElementById('btn-play');

        function renderTabsUI() {
            elCatTabs.innerHTML = '';
            CATEGORIES.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${idx === state.catIdx ? 'active' : ''}`;
                btn.textContent = cat.name;
                btn.onclick = () => loadScene(idx, 0);
                elCatTabs.appendChild(btn);
            });

            elSubTabs.innerHTML = '';
            CATEGORIES[state.catIdx].scenes.forEach((sc, idx) => {
                const btn = document.createElement('button');
                btn.className = `sub-btn ${idx === state.sceneIdx ? 'active' : ''}`;
                btn.textContent = sc.name;
                btn.onclick = () => loadScene(state.catIdx, idx);
                elSubTabs.appendChild(btn);
            });
        }

        function renderStepperUI() {
            const sceneDef = CATEGORIES[state.catIdx].scenes[state.sceneIdx];
            elSceneName.textContent = sceneDef.name;
            elStepperRow.innerHTML = '';

            sceneDef.steps.forEach((st, idx) => {
                const btn = document.createElement('button');
                btn.className = `step-pill ${idx === state.stepIdx ? 'active' : ''}`;
                btn.textContent = st.short;
                btn.onclick = () => {
                    state.isPlaying = false;
                    updatePlayBtnUI();
                    jumpToStep(idx, false);
                };
                elStepperRow.appendChild(btn);
            });
        }

        function syncStepInfoFromProgress(p) {
            const sceneDef = CATEGORIES[state.catIdx].scenes[state.sceneIdx];
            let bestIdx = 0;
            let minDist = Infinity;
            sceneDef.steps.forEach((st, idx) => {
                const d = Math.abs(p - st.p);
                if (d < minDist) {
                    minDist = d;
                    bestIdx = idx;
                }
            });

            if (bestIdx !== state.stepIdx) {
                state.stepIdx = bestIdx;
                Array.from(elStepperRow.children).forEach((el, idx) => {
                    el.classList.toggle('active', idx === bestIdx);
                });
            }

            const curStep = sceneDef.steps[state.stepIdx];
            elStepTitle.textContent = curStep.title;
            elStepDesc.textContent = curStep.desc;
            elSlider.value = Math.round(p * 1000);
            elPctLabel.textContent = `${Math.round(p * 100)}%`;
        }

        function jumpToStep(stepIdx, instant = false) {
            const sceneDef = CATEGORIES[state.catIdx].scenes[state.sceneIdx];
            const clamped = THREE.MathUtils.clamp(stepIdx, 0, sceneDef.steps.length - 1);
            state.stepIdx = clamped;
            state.targetProgress = sceneDef.steps[clamped].p;
            if (instant) state.progress = state.targetProgress;

            Array.from(elStepperRow.children).forEach((el, idx) => {
                el.classList.toggle('active', idx === clamped);
            });
            syncStepInfoFromProgress(state.targetProgress);
        }

        function updatePlayBtnUI() {
            elBtnPlay.textContent = state.isPlaying ? '⏸ 暫停演進' : '▶ 自動演進';
        }

        // 底部流程控制按鈕綁定
        document.getElementById('btn-prev').onclick = () => {
            state.isPlaying = false;
            updatePlayBtnUI();
            jumpToStep(state.stepIdx - 1);
        };

        document.getElementById('btn-next').onclick = () => {
            state.isPlaying = false;
            updatePlayBtnUI();
            jumpToStep(state.stepIdx + 1);
        };

        elBtnPlay.onclick = () => {
            state.isPlaying = !state.isPlaying;
            if (state.isPlaying && state.progress >= 0.98) {
                state.progress = 0.02;
                state.targetProgress = 0.02;
            }
            updatePlayBtnUI();
        };

        elSlider.addEventListener('input', (e) => {
            state.isPlaying = false;
            updatePlayBtnUI();
            const val = Number(e.target.value) / 1000;
            state.progress = val;
            state.targetProgress = val;
            syncStepInfoFromProgress(val);
        });

        // 收合說明面板（小螢幕觸控友善）
        const bottomDock = document.getElementById('bottom-dock');
        const btnCollapse = document.getElementById('btn-collapse-desc');
        btnCollapse.onclick = () => {
            bottomDock.classList.toggle('collapsed');
            btnCollapse.textContent = bottomDock.classList.contains('collapsed') ? '▴' : '▾';
        };

        // 文字標籤 Toggle 顯示 / 隱藏
        const btnToggleLabels = document.getElementById('btn-toggle-labels');
        btnToggleLabels.onclick = () => {
            state.showLabels = !state.showLabels;
            labelsContainer.classList.toggle('hidden', !state.showLabels);
            btnToggleLabels.classList.toggle('active', state.showLabels);
            btnToggleLabels.textContent = state.showLabels ? '🏷️ 標籤: 開' : '🏷️ 標籤: 關';
        };

        // 圖例浮窗開關
        const legendCard = document.getElementById('legend-card');
        document.getElementById('btn-toggle-legend').onclick = () => legendCard.classList.toggle('open');
        document.getElementById('btn-close-legend').onclick = () => legendCard.classList.remove('open');

        // 右側觸控友善 Zoom / Pan / Rotate 控制
        document.getElementById('btn-zoom-in').onclick = () => {
            const offset = camera.position.clone().sub(controls.target).multiplyScalar(0.82);
            if (offset.length() >= controls.minDistance) {
                camera.position.copy(controls.target).add(offset);
            }
            camTargetPos = null;
        };

        document.getElementById('btn-zoom-out').onclick = () => {
            const offset = camera.position.clone().sub(controls.target).multiplyScalar(1.22);
            if (offset.length() <= controls.maxDistance) {
                camera.position.copy(controls.target).add(offset);
            }
            camTargetPos = null;
        };

        const btnPanMode = document.getElementById('btn-pan-mode');
        const panModeLabel = document.getElementById('pan-mode-label');
        btnPanMode.onclick = () => {
            state.panMode = !state.panMode;
            btnPanMode.classList.toggle('mode-pan', state.panMode);
            btnPanMode.textContent = state.panMode ? '✋' : '🔄';
            panModeLabel.textContent = state.panMode ? '平移' : '旋轉';

            // 切換單指觸控與滑鼠左鍵行為（雙指觸控永遠支援 Pinch Zoom + Pan）
            controls.touches.ONE = state.panMode ? THREE.TOUCH.PAN : THREE.TOUCH.ROTATE;
            controls.mouseButtons.LEFT = state.panMode ? THREE.MOUSE.PAN : THREE.MOUSE.ROTATE;
        };

        document.getElementById('btn-reset-cam').onclick = () => {
            const sceneDef = CATEGORIES[state.catIdx].scenes[state.sceneIdx];
            controls.target.set(0, 3.0, 0);
            flyCameraTo(sceneDef.camPos);
        };

        // 使用者手動觸控或拖曳畫布時，取消自動飛鏡插值以免搶奪控制權
        renderer.domElement.addEventListener('pointerdown', () => {
            camTargetPos = null;
        });

        // =========================================================================
        // 9. 3D 空間座標投影至 HTML 浮動標籤與主動畫迴圈
        // =========================================================================
        const projVec = new THREE.Vector3();

        function updateLabelsProjection() {
            if (!state.showLabels) return;
            const halfW = window.innerWidth * 0.5;
            const halfH = window.innerHeight * 0.5;

            const projectItem = (item) => {
                projVec.copy(item.pos).project(camera);
                if (projVec.z > 1 || projVec.z < -1) {
                    item.el.style.display = 'none';
                    return;
                }
                item.el.style.display = 'block';
                const x = projVec.x * halfW + halfW;
                const y = -(projVec.y * halfH) + halfH;
                item.el.style.left = `${x}px`;
                item.el.style.top = `${y}px`;
            };

            for (const st of staticLabels) projectItem(st);
            for (const lb of activeLabels) projectItem(lb);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            // Step-by-step 平滑演進或自動連續播放
            if (state.isPlaying) {
                state.progress += dt * 0.095;
                if (state.progress >= 1.0) {
                    state.progress = 0.02; // 循環演進
                }
                state.targetProgress = state.progress;
                syncStepInfoFromProgress(state.progress);
            } else {
                state.progress = THREE.MathUtils.lerp(state.progress, state.targetProgress, Math.min(1, dt * 6.5));
            }

            // 相機平滑切鏡
            if (camTargetPos) {
                camera.position.lerp(camTargetPos, Math.min(1, dt * 5.0));
                if (camera.position.distanceTo(camTargetPos) < 0.08) {
                    camTargetPos = null;
                }
            }

            controls.update();

            if (currentSceneUpdater) {
                currentSceneUpdater(state.progress, dt, elapsed);
            }

            renderer.render(scene, camera);
            updateLabelsProjection();
        }

        // 啟動預設第一個場景（冷鋒）與主迴圈
        loadScene(0, 0);
        animate();
    </script>
</body>
