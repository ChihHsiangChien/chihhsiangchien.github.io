<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>旋轉線段軌跡繪圖 | Rotating Segments</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand">
        <span class="badge">EPICYCLES</span>
        <h1>用旋轉線段畫圖</h1>
      </div>

      <div class="top-actions">
        <button id="btn-pause" class="icon-btn">⏸ 暫停</button>
        <button id="btn-arms" class="icon-btn active" title="顯示或隱藏旋轉線段">🦾 機械臂</button>
        <button id="btn-rainbow" class="icon-btn active" title="切換彩虹漸層軌跡">🌈 彩虹</button>
        <button id="btn-clear" class="icon-btn" title="清除軌跡">🧹 清除</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-grid">
      <section class="canvas-card card">
        <div class="preset-bar">
          <span class="preset-label">經典圖形：</span>
          <button class="preset-btn active" data-l="19, 30, 23" data-s="41, 53, -41">✨ 預設花紋</button>
          <button class="preset-btn" data-l="40, 20, 10" data-s="12, -36, 84">🌸 玫瑰花瓣</button>
          <button class="preset-btn" data-l="36, 24" data-s="20, -30">⭐ 五角星</button>
          <button class="preset-btn" data-l="28, 22, 16, 10" data-s="15, -35, 65, -95">🌀 四重共振</button>
          <button id="btn-random" class="preset-btn">🎲 隨機靈感</button>
        </div>
        <div class="canvas-wrap">
          <canvas id="animationCanvas"></canvas>
        </div>
      </section>

      <aside class="controls-card card">
        <div class="ctrl-group">
          <label for="lengthsInput">各段長度（逗號分隔）</label>
          <input id="lengthsInput" type="text" value="19, 30, 23" />
        </div>

        <div class="ctrl-group">
          <label for="speedsInput">各段角速度（逗號分隔，負數反向）</label>
          <input id="speedsInput" type="text" value="41, 53, -41" />
        </div>

        <div class="ctrl-group">
          <div class="ctrl-head">
            <label for="lengthMultiplierInput">縮放倍率</label>
            <strong id="lbl-len-mult">1.0x</strong>
          </div>
          <input id="lengthMultiplierInput" type="range" min="0.4" max="2.0" step="0.1" value="1.0" />
        </div>

        <div class="ctrl-group">
          <div class="ctrl-head">
            <label for="speedMultiplierInput">旋轉速度</label>
            <strong id="lbl-spd-mult">3.0x</strong>
          </div>
          <input id="speedMultiplierInput" type="range" min="0.5" max="10" step="0.5" value="3.0" />
        </div>

        <button id="applyButton" class="primary-btn">套用並重繪</button>

        <p class="info-note">
          💡 <strong>數學原理</strong>：多段不同長度與角速度的旋轉向量首尾相接，端點軌跡即為傅立葉級數（Fourier Epicycles）所描繪的對稱幾何曲線。
        </p>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
