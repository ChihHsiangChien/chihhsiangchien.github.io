<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>樹木環狀剝皮（Girdling）生理變化動態模擬器</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
    }

    input[type="range"] {
      accent-color: #10b981;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .stage-pill {
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .stage-pill.active {
      background-color: #10b981;
      color: #022c22;
      border-color: #34d399;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>

<body class="h-screen w-screen flex flex-col overflow-hidden selection:bg-emerald-500 selection:text-white">

  <!-- Top Header (Static, Clean, No Jittering Day Readout) -->
  <header class="border-b border-slate-800 bg-slate-900/95 backdrop-blur z-30 px-4 py-2.5 shrink-0 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div
        class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center shadow-lg shadow-emerald-950/40 shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        </svg>
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
          樹木環狀剝皮生理動態模擬器
        </h1>
      </div>
    </div>

    <!-- Quick Legend In Header -->
    <div class="hidden md:flex items-center gap-4 text-xs">
      <span class="flex items-center gap-1.5 font-medium text-sky-400">
        <span class="w-2.5 h-2.5 rounded-full bg-sky-400 inline-block animate-pulse"></span>
        木質部：水分與礦物質 (向上 ↑)
      </span>
      <span class="flex items-center gap-1.5 font-medium text-amber-400">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block animate-pulse"></span>
        韌皮部：光合養分/蔗糖 (向下 ↓)
      </span>
    </div>
  </header>

  <!-- Main Body Layout: Left Sidebar UI + Right Expansive Canvas -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- Left Control Sidebar -->
    <aside
      class="w-full lg:w-80 xl:w-96 shrink-0 bg-slate-900/95 border-b lg:border-b-0 lg:border-r border-slate-800 flex flex-col overflow-y-auto custom-scrollbar p-4 gap-4 z-20">

      <!-- 1. Mode Switcher (Default: Continuous Normal) -->
      <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">
          🌱 模擬運作模式
        </label>
        <div class="flex flex-col gap-1.5 text-xs">
          <button id="modeControlBtn"
            class="w-full px-3 py-2 rounded-lg font-bold text-left transition flex items-center justify-between bg-emerald-500 text-slate-950 shadow-md shadow-emerald-950/50">
            <span>🌱 正常未環剝 (持續運作)</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-950/40 text-emerald-100 font-bold">預設</span>
          </button>
          <button id="modeGirdledBtn"
            class="w-full px-3 py-2 rounded-lg font-medium text-left transition flex items-center justify-between text-slate-300 hover:text-white hover:bg-slate-800/80 border border-transparent">
            <span>🔪 主幹完全環剝 (致死過程)</span>
          </button>
          <button id="modeShallowBtn"
            class="w-full px-3 py-2 rounded-lg font-medium text-left transition flex items-center justify-between text-slate-300 hover:text-white hover:bg-slate-800/80 border border-transparent">
            <span>🍎 果樹淺層環割 (癒合結果)</span>
          </button>
        </div>
      </div>

      <!-- 2. Timeline & Playback Controls (Hidden by Default, ONLY shown for Girdling modes) -->
      <div id="timelineSection" class="hidden flex-col gap-3 bg-slate-950/70 border border-slate-800 rounded-xl p-3">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
            <span>⏳ 環剝時間歷程</span>
          </label>
          <span id="sliderDayVal" class="text-xs font-mono font-bold text-emerald-400 bg-slate-900 px-2 py-0.5 rounded border border-slate-700/60">Day 0</span>
        </div>

        <!-- Slider -->
        <div class="space-y-1">
          <input id="timeSlider" type="range" min="0" max="120" step="0.2" value="0"
            class="w-full h-2 bg-slate-800 rounded-lg cursor-pointer">
          <div class="flex justify-between text-[11px] text-slate-500 font-mono">
            <span>D0 環剝</span>
            <span>D45 飢餓</span>
            <span>D78 斷水</span>
            <span>D120 枯死</span>
          </div>
        </div>

        <!-- Play / Pause / Reset / Speed -->
        <div class="flex items-center gap-2 pt-1">
          <button id="playPauseBtn"
            class="flex-1 py-1.5 px-3 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs flex items-center justify-center gap-1.5 shadow transition">
            <span id="playIcon">⏸</span>
            <span id="playText">暫停</span>
          </button>
          <button id="resetBtn"
            class="py-1.5 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700 transition">
            ↺ 重置 (D0)
          </button>
          <div class="flex items-center bg-slate-800 rounded-lg p-0.5 border border-slate-700 text-[11px]">
            <button data-speed="0.5" class="speed-btn px-1.5 py-1 rounded text-slate-300 hover:text-white">0.5x</button>
            <button data-speed="1" class="speed-btn px-1.5 py-1 rounded bg-slate-700 text-emerald-400 font-bold">1x</button>
            <button data-speed="2.5" class="speed-btn px-1.5 py-1 rounded text-slate-300 hover:text-white">2.5x</button>
          </div>
        </div>

        <!-- Stage Jump Pills -->
        <div class="flex flex-col gap-1.5 pt-1">
          <span class="text-[11px] text-slate-400 font-medium">跳轉關鍵生理階段：</span>
          <div class="grid grid-cols-1 gap-1 text-xs">
            <button data-jump="0"
              class="stage-pill active text-left px-2.5 py-1.5 rounded-lg bg-slate-800/80 text-slate-300 border border-slate-700/60 hover:text-white">
              1. 剛環剝 (D0)：木質部正常吸水
            </button>
            <button data-jump="18"
              class="stage-pill text-left px-2.5 py-1.5 rounded-lg bg-slate-800/80 text-slate-300 border border-slate-700/60 hover:text-white">
              2. 韌皮部阻斷 (D18)：養分下運卡住
            </button>
            <button data-jump="45"
              class="stage-pill text-left px-2.5 py-1.5 rounded-lg bg-slate-800/80 text-slate-300 border border-slate-700/60 hover:text-white">
              3. 上方腫大/根飢餓 (D45)：耗盡澱粉
            </button>
            <button data-jump="78"
              class="stage-pill text-left px-2.5 py-1.5 rounded-lg bg-slate-800/80 text-slate-300 border border-slate-700/60 hover:text-white">
              4. 根部壞死停水 (D78)：水柱斷裂
            </button>
            <button data-jump="110"
              class="stage-pill text-left px-2.5 py-1.5 rounded-lg bg-slate-800/80 text-slate-300 border border-slate-700/60 hover:text-white">
              5. 莖葉枯死 (D110)：脫水凋落全株亡
            </button>
          </div>
        </div>
      </div>

      <!-- 3. Stage Narrative & Physiological Detail Card -->
      <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 flex flex-col gap-2">
        <div class="flex items-center justify-between gap-2">
          <span id="stageBadge"
            class="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shrink-0">
            正常對照組
          </span>
          <span class="text-[11px] text-slate-500">生理機制</span>
        </div>
        <h2 id="stageTitle" class="text-sm font-bold text-white leading-snug">
          維管束完整：水分與養分雙向暢通
        </h2>
        <p id="stageDesc" class="text-xs text-slate-300 leading-relaxed">
          木質部持續將根部吸收的水分與無機鹽向上運送至枝葉；枝葉光合作用產生的蔗糖等有機養分，經由韌皮部順暢向下運送至根部儲存，整株樹木維持健康生長。
        </p>
      </div>

      <!-- 4. Visual Toggles -->
      <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 flex flex-col gap-2.5">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
          ⚙️ 畫面顯示設定
        </label>
        <div class="flex flex-col gap-2 text-xs">
          <label class="flex items-center justify-between cursor-pointer text-slate-300 hover:text-white select-none">
            <span>顯微放大鏡（維管束剖面）</span>
            <input type="checkbox" id="showMicroToggle" checked class="rounded accent-emerald-500 w-4 h-4 cursor-pointer">
          </label>
          <label class="flex items-center justify-between cursor-pointer text-slate-300 hover:text-white select-none">
            <span>解剖構造標籤</span>
            <input type="checkbox" id="showLabelsToggle" checked class="rounded accent-emerald-500 w-4 h-4 cursor-pointer">
          </label>
        </div>
      </div>

      <!-- 5. Pan & Zoom Guide & Reset View Button -->
      <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 flex flex-col gap-2.5 mt-auto">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
            🔍 畫布視角操作
          </label>
          <span id="zoomLevelText" class="text-xs font-mono font-bold text-slate-400">100%</span>
        </div>
        <div class="grid grid-cols-3 gap-1.5 text-xs">
          <button id="zoomInBtn"
            class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold border border-slate-700 transition flex items-center justify-center gap-1"
            title="放大">
            <span>➕</span> 放大
          </button>
          <button id="zoomOutBtn"
            class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold border border-slate-700 transition flex items-center justify-center gap-1"
            title="縮小">
            <span>➖</span> 縮小
          </button>
          <button id="resetViewBtn"
            class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold border border-slate-700 transition flex items-center justify-center gap-1"
            title="重置視角">
            <span>⟲</span> 置中
          </button>
        </div>
        <p class="text-[11px] text-slate-400 leading-normal">
          💡 可使用<strong class="text-slate-300">滑鼠滾輪</strong>縮放，<strong class="text-slate-300">按住左鍵拖曳</strong>平移畫布探索微觀構造。
        </p>
      </div>

    </aside>

    <!-- Right Large Canvas Container -->
    <main class="flex-1 h-full relative overflow-hidden bg-slate-950 select-none">
      <canvas id="treeCanvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>

      <!-- Floating Canvas Overlay Controls (Top-Right) -->
      <div class="absolute top-3 right-3 z-10 flex items-center gap-1.5 bg-slate-900/85 backdrop-blur-md border border-slate-800 rounded-xl p-1 shadow-xl">
        <button id="floatZoomInBtn"
          class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs flex items-center justify-center transition"
          title="放大">
          ＋
        </button>
        <button id="floatZoomOutBtn"
          class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs flex items-center justify-center transition"
          title="縮小">
          －
        </button>
        <button id="floatResetViewBtn"
          class="px-2 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-xs flex items-center justify-center transition"
          title="重置視角">
          ⟲ 置中
        </button>
        <span id="floatZoomBadge" class="text-[11px] font-mono text-emerald-400 px-2 py-0.5 font-bold">100%</span>
      </div>

      <!-- Floating Legend Pill for mobile / small screen (Bottom-Left) -->
      <div class="md:hidden absolute bottom-3 left-3 z-10 flex flex-col gap-1 text-[11px] bg-slate-900/85 backdrop-blur-md border border-slate-800 rounded-lg p-2 shadow-lg">
        <span class="flex items-center gap-1.5 font-medium text-sky-400">
          <span class="w-2 h-2 rounded-full bg-sky-400 inline-block animate-pulse"></span>
          木質部：水向上 ↑
        </span>
        <span class="flex items-center gap-1.5 font-medium text-amber-400">
          <span class="w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse"></span>
          韌皮部：養分向下 ↓
        </span>
      </div>
    </main>

  </div>

  <script>
    // --- Simulation State ---
    const state = {
      day: 0,
      maxDay: 120,
      playing: true,
      speed: 1, // days per second factor
      mode: 'control', // Default: 'control' (Normal continuous) | 'girdled' | 'shallow'
      showMicro: true,
      showLabels: true,
      waterParticles: [],
      sugarParticles: [],
      fallingLeaves: []
    };

    // --- Pan & Zoom View State ---
    const view = {
      x: 0,
      y: 0,
      scale: 1,
      baseScale: 1,
      minScale: 0.4,
      maxScale: 4.5,
      isDragging: false,
      dragStartX: 0,
      dragStartY: 0
    };

    // --- Physiological Model Calculation (0 to 120 Days) ---
    function computePhysiology(day, mode) {
      if (mode === 'control') {
        return {
          waterFlow: 100,
          upperSugar: 100,
          swelling: 0,
          rootSugar: 100,
          rootHealth: 100,
          leafHealth: 100,
          fruitSize: 20,
          healed: 100
        };
      }

      if (mode === 'shallow') {
        // Shallow agricultural scoring: heals between day 35 and 65
        const healProgress = Math.max(0, Math.min(100, ((day - 30) / 35) * 100));
        const blockFactor = 1 - (healProgress / 100);
        const upperSugar = 100 + Math.sin(Math.min(day, 70) / 70 * Math.PI) * 85;
        const swelling = Math.min(35, day * 0.6 * (0.4 + 0.6 * blockFactor));
        const rootSugar = Math.max(55, 100 - Math.sin(Math.min(day, 80) / 80 * Math.PI) * 42);
        const fruitSize = Math.min(100, 20 + (day / 120) * 80);
        return {
          waterFlow: 96,
          upperSugar: Math.round(upperSugar),
          swelling: Math.round(swelling),
          rootSugar: Math.round(rootSugar),
          rootHealth: 92,
          leafHealth: 96,
          fruitSize: Math.round(fruitSize),
          healed: Math.round(healProgress)
        };
      }

      // Complete trunk girdling ('girdled')
      // 1. Root sugar reserve drops steadily from Day 0 to Day 75 as roots respire without phloem supply
      const rootSugar = Math.max(0, 100 - (day / 72) * 100);

      // 2. Root health holds up while sugar > 30%, then collapses between Day 50 and Day 88
      let rootHealth = 100;
      if (day > 42) {
        rootHealth = Math.max(0, 100 - Math.pow((day - 42) / 46, 1.45) * 100);
      }

      // 3. Water transport in xylem stays near 100% early on, then drops as rootHealth collapses
      let waterFlow = 100;
      if (day > 52) {
        waterFlow = Math.max(0, 100 - Math.pow((day - 52) / 42, 1.6) * 100);
      }

      // 4. Leaf health / photosynthesis depends on waterFlow (lags slightly behind water loss)
      let leafHealth = 100;
      if (day > 62) {
        leafHealth = Math.max(0, 100 - Math.pow((day - 62) / 46, 1.55) * 100);
      }

      // 5. Upper bark swelling increases while leaves are still photosynthesizing, then plateaus
      const activePhotosynthesisDays = Math.min(day, 78);
      const swelling = Math.min(100, Math.pow(activePhotosynthesisDays / 78, 0.85) * 100);

      // 6. Upper sugar accumulation spikes above cut up to ~195%, then drops when leaves die
      let upperSugar = 100;
      if (day <= 68) {
        upperSugar = 100 + (day / 68) * 95;
      } else {
        upperSugar = Math.max(10, 195 - ((day - 68) / 52) * 185);
      }

      return {
        waterFlow: Math.round(waterFlow),
        upperSugar: Math.round(upperSugar),
        swelling: Math.round(swelling),
        rootSugar: Math.round(rootSugar),
        rootHealth: Math.round(rootHealth),
        leafHealth: Math.round(leafHealth),
        fruitSize: 25,
        healed: 0
      };
    }

    // --- Stage Narrative Descriptions ---
    function getStageInfo(day, mode) {
      if (mode === 'control') {
        return {
          badge: '正常對照組',
          title: '維管束完整：水分與養分雙向暢通',
          desc: '木質部持續將根部吸收的水分與無機鹽向上運送至枝葉；枝葉光合作用產生的蔗糖等有機養分，經由韌皮部順暢向下運送至根部儲存，整株樹木維持健康生長。'
        };
      }
      if (mode === 'shallow') {
        if (day < 35) {
          return {
            badge: '果樹環割初期',
            title: '暫時阻斷韌皮部：養分集中留給果實',
            desc: '農業上對枝條進行淺層環割（不傷及過多形成層），讓光合養分暫時無法下運，優先供給上方花芽與果實發育。'
          };
        } else {
          return {
            badge: '形成層癒合期',
            title: '形成層再生新韌皮部：果實碩大且根系恢復',
            desc: '約 1–2 個月後，淺層切口由形成層癒傷組織重新接通韌皮部，有機養分恢復向下運送至根部，果樹不會死亡。'
          };
        }
      }

      // Complete girdling stages
      if (day < 15) {
        return {
          badge: '階段一 (Day 0–14)',
          title: '剛完成環狀剝皮：木質部完好，枝葉翠綠',
          desc: '樹皮與韌皮部被環狀剝除，但內側木質部未受損。根部吸水照常上升，因此上方莖葉看起來完全正常，光合作用持續進行。'
        };
      } else if (day < 42) {
        return {
          badge: '階段二 (Day 15–41)',
          title: '韌皮部下運受阻：切口上緣開始累積養分',
          desc: '葉片製造的蔗糖經韌皮部向下運送時卡在環剝切口上方，局部養分濃度飆升；下方根部得不到新養分補給，開始消耗庫存澱粉。'
        };
      } else if (day < 72) {
        return {
          badge: '階段三 (Day 42–71)',
          title: '切口上緣明顯腫大 ＆ 根部陷入嚴重飢餓',
          desc: '切口上方因過量養分與生長素累積，細胞異常增生形成明顯「樹瘤腫大」；同時根部澱粉即將耗盡，細根開始萎縮壞死。'
        };
      } else if (day < 96) {
        return {
          badge: '階段四 (Day 72–95)',
          title: '根系餓死腐爛 → 木質部吸水功能崩潰',
          desc: '根部細胞因缺乏能量徹底壞死，失去主動吸收礦物質與水分的能力。木質部水柱斷裂，上方葉片開始出現缺水萎蔫與黃化。'
        };
      } else {
        return {
          badge: '階段五 (Day 96–120)',
          title: '水分供應斷絕：莖葉乾枯落葉，全株死亡',
          desc: '即使當初沒有切斷木質部，但因為「根部先餓死導致無法吸水」，最終上方枝葉嚴重脫水、葉片枯落，整棵樹死亡。'
        };
      }
    }

    // --- Initialize Particles ---
    function initParticles() {
      state.waterParticles = [];
      state.sugarParticles = [];
      for (let i = 0; i < 30; i++) {
        state.waterParticles.push({
          yProgress: Math.random(), // 0 (roots) to 1 (canopy)
          laneOffset: (Math.random() - 0.5) * 14,
          size: 2.5 + Math.random() * 1.5
        });
      }
      for (let i = 0; i < 34; i++) {
        state.sugarParticles.push({
          yProgress: Math.random(), // 0 (canopy) to 1 (roots)
          side: i % 2 === 0 ? -1 : 1,
          size: 3 + Math.random() * 1.5,
          stuckJitter: Math.random() * Math.PI * 2
        });
      }
    }
    initParticles();

    // --- UI Sync ---
    function updateUI() {
      const info = getStageInfo(state.day, state.mode);

      // Slider and Day readout in sidebar
      const slider = document.getElementById('timeSlider');
      const sliderVal = document.getElementById('sliderDayVal');
      if (slider) slider.value = state.day;
      if (sliderVal) sliderVal.textContent = 'Day ' + Math.round(state.day);

      // Narrative Box
      const stageBadge = document.getElementById('stageBadge');
      const stageTitle = document.getElementById('stageTitle');
      const stageDesc = document.getElementById('stageDesc');
      if (stageBadge) stageBadge.textContent = info.badge;
      if (stageTitle) stageTitle.textContent = info.title;
      if (stageDesc) stageDesc.textContent = info.desc;

      // Stage Pills highlight (in girdled mode)
      document.querySelectorAll('.stage-pill').forEach((btn) => {
        const jumpDay = parseFloat(btn.getAttribute('data-jump'));
        let isActive = false;
        if (jumpDay === 0 && state.day < 15) isActive = true;
        else if (jumpDay === 18 && state.day >= 15 && state.day < 42) isActive = true;
        else if (jumpDay === 45 && state.day >= 42 && state.day < 72) isActive = true;
        else if (jumpDay === 78 && state.day >= 72 && state.day < 96) isActive = true;
        else if (jumpDay === 110 && state.day >= 96) isActive = true;
        btn.classList.toggle('active', isActive);
      });
    }

    // --- Canvas & Pan/Zoom Setup ---
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function resetView() {
      const rect = canvas.getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;
      if (W === 0 || H === 0) return;

      // Tree nominal bounds: W ~440, H ~560, centered at X=0, Y=-105
      const fitScale = Math.min(W / 460, H / 580) * 0.95;
      view.baseScale = Math.max(0.6, Math.min(2.5, fitScale));
      view.scale = view.baseScale;
      view.x = W / 2;
      view.y = H / 2 - (-105) * view.scale;

      updateZoomBadge();
    }

    function updateZoomBadge() {
      const pct = Math.round((view.scale / (view.baseScale || 1)) * 100) + '%';
      const text1 = document.getElementById('zoomLevelText');
      const text2 = document.getElementById('floatZoomBadge');
      if (text1) text1.textContent = pct;
      if (text2) text2.textContent = pct;
    }

    function zoomAt(screenX, screenY, factor) {
      const newScale = Math.max(view.minScale, Math.min(view.maxScale, view.scale * factor));
      if (newScale === view.scale) return;
      const wx = (screenX - view.x) / view.scale;
      const wy = (screenY - view.y) / view.scale;
      view.scale = newScale;
      view.x = screenX - wx * view.scale;
      view.y = screenY - wy * view.scale;
      updateZoomBadge();
    }

    function zoomIn() {
      const rect = canvas.getBoundingClientRect();
      zoomAt(rect.width / 2, rect.height / 2, 1.25);
    }

    function zoomOut() {
      const rect = canvas.getBoundingClientRect();
      zoomAt(rect.width / 2, rect.height / 2, 0.8);
    }

    // Window events
    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    // Mouse Pan & Zoom
    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      view.isDragging = true;
      view.dragStartX = e.clientX - view.x;
      view.dragStartY = e.clientY - view.y;
      canvas.classList.remove('cursor-grab');
      canvas.classList.add('cursor-grabbing');
    });

    window.addEventListener('mousemove', (e) => {
      if (!view.isDragging) return;
      view.x = e.clientX - view.dragStartX;
      view.y = e.clientY - view.dragStartY;
    });

    window.addEventListener('mouseup', () => {
      if (view.isDragging) {
        view.isDragging = false;
        canvas.classList.remove('cursor-grabbing');
        canvas.classList.add('cursor-grab');
      }
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.14 : 0.88;
      zoomAt(mouseX, mouseY, factor);
    }, { passive: false });

    // Touch Pinch & Pan
    let touchStartDist = 0;
    let touchStartScale = 1;
    let touchStartCenter = { x: 0, y: 0 };

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        view.isDragging = true;
        view.dragStartX = e.touches[0].clientX - view.x;
        view.dragStartY = e.touches[0].clientY - view.y;
      } else if (e.touches.length === 2) {
        view.isDragging = false;
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        touchStartScale = view.scale;
        const rect = canvas.getBoundingClientRect();
        touchStartCenter = {
          x: (t1.clientX + t2.clientX) / 2 - rect.left,
          y: (t1.clientY + t2.clientY) / 2 - rect.top
        };
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && view.isDragging) {
        view.x = e.touches[0].clientX - view.dragStartX;
        view.y = e.touches[0].clientY - view.dragStartY;
      } else if (e.touches.length === 2 && touchStartDist > 0) {
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const currentDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        const factor = currentDist / touchStartDist;
        const newScale = Math.max(view.minScale, Math.min(view.maxScale, touchStartScale * factor));
        const wx = (touchStartCenter.x - view.x) / view.scale;
        const wy = (touchStartCenter.y - view.y) / view.scale;
        view.scale = newScale;
        view.x = touchStartCenter.x - wx * view.scale;
        view.y = touchStartCenter.y - wy * view.scale;
        updateZoomBadge();
      }
    }, { passive: true });

    canvas.addEventListener('touchend', () => {
      view.isDragging = false;
      touchStartDist = 0;
    });

    // Helper to blend colors for leaf yellowing/browning
    function getCanopyColor(leafHealth, variant = 0) {
      if (leafHealth >= 50) {
        const t = (leafHealth - 50) / 50;
        const r = Math.round(234 + (16 - 234) * t + variant * 12);
        const g = Math.round(179 + (185 - 179) * t + variant * 12);
        const b = Math.round(8 + (129 - 8) * t);
        return `rgb(${r},${g},${b})`;
      } else {
        const t = leafHealth / 50;
        const r = Math.round(115 + (234 - 115) * t + variant * 10);
        const g = Math.round(58 + (179 - 58) * t + variant * 8);
        const b = Math.round(18 + (8 - 18) * t);
        return `rgb(${r},${g},${b})`;
      }
    }

    // --- Main Scene Drawing with Pan & Zoom ---
    function drawScene(dt) {
      const rect = canvas.getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;
      const phys = computePhysiology(state.day, state.mode);

      // Clear full canvas with night background
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#09101f';
      ctx.fillRect(0, 0, W, H);

      // --- World Space Drawing (Affected by Pan & Zoom) ---
      ctx.save();
      ctx.translate(view.x, view.y);
      ctx.scale(view.scale, view.scale);

      // 1. Sky & Soil in World Space
      // Sky
      const skyGrad = ctx.createLinearGradient(0, -2500, 0, 0);
      skyGrad.addColorStop(0, '#09101f');
      skyGrad.addColorStop(1, '#111c33');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(-3500, -3500, 7000, 3500);

      // Soil (Ground is at Y = 0)
      const soilGrad = ctx.createLinearGradient(0, 0, 0, 2500);
      soilGrad.addColorStop(0, '#271c15');
      soilGrad.addColorStop(0.12, '#1c140f');
      soilGrad.addColorStop(1, '#0c0705');
      ctx.fillStyle = soilGrad;
      ctx.fillRect(-3500, 0, 7000, 3500);

      // Soil Horizon Line
      ctx.strokeStyle = '#3f2e21';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-3500, 0);
      ctx.lineTo(3500, 0);
      ctx.stroke();

      // Tree World Anatomy Coordinates:
      // Center: X = 0, Ground: Y = 0
      const trunkTopY = -215;
      const trunkBotY = 10;
      const girdleY = -105;
      const trunkHalfW = 28;

      // 2. Roots Below Ground
      drawRoots(ctx, phys);

      // 3. Trunk & Girdling Cut & Callus Swelling
      drawTrunkAndVessels(ctx, trunkTopY, trunkBotY, girdleY, trunkHalfW, phys);

      // 4. Canopy & Branches
      drawCanopy(ctx, trunkTopY, phys, dt);

      // 5. Animated Transport Particles (Water in Xylem, Sucrose in Phloem)
      drawParticles(ctx, trunkTopY, 70, girdleY, trunkHalfW, phys, dt);

      // 6. Anatomical Labels
      if (state.showLabels) {
        drawAnatomicalLabels(ctx, trunkTopY, girdleY, trunkHalfW, phys);
      }

      ctx.restore();
      // --- End World Space Drawing ---

      // --- Screen Space Drawing (Fixed HUD Overlays) ---
      // Microscopic Cross-Section Inset (PIP)
      if (state.showMicro && W > 460) {
        const girdleCutScreenX = view.x + (trunkHalfW + 6) * view.scale;
        const girdleCutScreenY = view.y + girdleY * view.scale;
        drawMicroscopeInset(ctx, W, H, girdleCutScreenX, girdleCutScreenY, phys);
      }
    }

    function drawRoots(ctx, phys) {
      const rootBranches = [
        { dx1: -35, dy1: 35, dx2: -95, dy2: 75, dx3: -140, dy3: 110, w: 12 },
        { dx1: -20, dy1: 45, dx2: -55, dy2: 95, dx3: -75, dy3: 130, w: 10 },
        { dx1: 0, dy1: 50, dx2: 5, dy2: 100, dx3: -10, dy3: 135, w: 11 },
        { dx1: 25, dy1: 45, dx2: 60, dy2: 95, dx3: 85, dy3: 128, w: 10 },
        { dx1: 40, dy1: 35, dx2: 100, dy2: 70, dx3: 145, dy3: 105, w: 12 }
      ];

      const healthRatio = phys.rootHealth / 100;
      const rCol = Math.round(65 + 75 * healthRatio);
      const gCol = Math.round(45 + 45 * healthRatio);
      const bCol = Math.round(35 + 20 * healthRatio);
      const rootColor = `rgb(${rCol},${gCol},${bCol})`;

      ctx.save();
      ctx.lineCap = 'round';

      rootBranches.forEach((rb) => {
        const shrink = 0.55 + 0.45 * healthRatio;
        ctx.strokeStyle = rootColor;
        ctx.lineWidth = rb.w * shrink;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(
          rb.dx1, rb.dy1,
          rb.dx2, rb.dy2,
          rb.dx3 * (0.82 + 0.18 * healthRatio), rb.dy3 * (0.85 + 0.15 * healthRatio)
        );
        ctx.stroke();

        // Fine root hairs (disappear when rootHealth < 25%)
        if (phys.rootHealth > 25) {
          ctx.strokeStyle = `rgba(251, 191, 36, ${0.15 + 0.45 * (phys.rootSugar / 100)})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(rb.dx2, rb.dy2);
          ctx.lineTo(rb.dx2 - 14, rb.dy2 + 18);
          ctx.moveTo(rb.dx2, rb.dy2);
          ctx.lineTo(rb.dx2 + 14, rb.dy2 + 20);
          ctx.stroke();
        }
      });

      // Starch reserve glow in roots
      if (phys.rootSugar > 5) {
        const glowRadius = 60 * (phys.rootSugar / 100);
        const rootGlow = ctx.createRadialGradient(0, 55, 5, 0, 55, glowRadius + 20);
        rootGlow.addColorStop(0, `rgba(245, 158, 11, ${0.35 * (phys.rootSugar / 100)})`);
        rootGlow.addColorStop(1, 'rgba(245, 158, 11, 0)');
        ctx.fillStyle = rootGlow;
        ctx.beginPath();
        ctx.arc(0, 55, glowRadius + 20, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawTrunkAndVessels(ctx, trunkTopY, trunkBotY, girdleY, trunkHalfW, phys) {
      const swellPx = (phys.swelling / 100) * 18;
      const cutHalfH = state.mode === 'control' ? 0 : (state.mode === 'shallow' ? 7 : 16);

      ctx.save();

      // Central Xylem Core (Heartwood + Sapwood) - Structurally intact
      ctx.fillStyle = '#fde68a';
      ctx.fillRect(-trunkHalfW + 8, trunkTopY, (trunkHalfW - 8) * 2, trunkBotY - trunkTopY);

      // Xylem Water Flow Tint
      ctx.fillStyle = `rgba(56, 189, 248, ${0.12 + 0.28 * (phys.waterFlow / 100)})`;
      ctx.fillRect(-trunkHalfW + 10, trunkTopY, (trunkHalfW - 10) * 2, trunkBotY - trunkTopY);

      // Outer Bark & Phloem
      ctx.fillStyle = '#78350f';
      // Left upper bark + swelling
      ctx.beginPath();
      ctx.moveTo(-trunkHalfW, trunkTopY);
      ctx.lineTo(-trunkHalfW, girdleY - cutHalfH - 36);
      ctx.quadraticCurveTo(
        -trunkHalfW - swellPx,
        girdleY - cutHalfH - 10,
        -trunkHalfW,
        girdleY - cutHalfH
      );
      ctx.lineTo(-trunkHalfW + 9, girdleY - cutHalfH);
      ctx.lineTo(-trunkHalfW + 9, trunkTopY);
      ctx.closePath();
      ctx.fill();

      // Right upper bark + swelling
      ctx.beginPath();
      ctx.moveTo(trunkHalfW, trunkTopY);
      ctx.lineTo(trunkHalfW, girdleY - cutHalfH - 36);
      ctx.quadraticCurveTo(
        trunkHalfW + swellPx,
        girdleY - cutHalfH - 10,
        trunkHalfW,
        girdleY - cutHalfH
      );
      ctx.lineTo(trunkHalfW - 9, girdleY - cutHalfH);
      ctx.lineTo(trunkHalfW - 9, trunkTopY);
      ctx.closePath();
      ctx.fill();

      // Golden sugar accumulation glow inside the upper swelling
      if (phys.swelling > 5) {
        ctx.fillStyle = `rgba(251, 191, 36, ${Math.min(0.75, phys.swelling / 110)})`;
        ctx.beginPath();
        ctx.arc(-trunkHalfW - swellPx * 0.35 + 3, girdleY - cutHalfH - 12, 6 + swellPx * 0.45, 0, Math.PI * 2);
        ctx.arc(trunkHalfW + swellPx * 0.35 - 3, girdleY - cutHalfH - 12, 6 + swellPx * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }

      // Lower trunk bark (below girdleY)
      const lowerBarkW = 9 * (0.65 + 0.35 * (phys.rootHealth / 100));
      ctx.fillStyle = '#5c280b';
      ctx.fillRect(-trunkHalfW, girdleY + cutHalfH, lowerBarkW, trunkBotY - (girdleY + cutHalfH));
      ctx.fillRect(trunkHalfW - lowerBarkW, girdleY + cutHalfH, lowerBarkW, trunkBotY - (girdleY + cutHalfH));

      // Callus bridge if shallow mode and healed
      if (state.mode === 'shallow' && phys.healed > 10) {
        ctx.fillStyle = `rgba(16, 185, 129, ${phys.healed / 120})`;
        ctx.fillRect(-trunkHalfW - 2, girdleY - cutHalfH, 8, cutHalfH * 2);
        ctx.fillRect(trunkHalfW - 6, girdleY - cutHalfH, 8, cutHalfH * 2);
      }

      // Girdling Notch Outline
      if (state.mode !== 'control') {
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.strokeRect(-trunkHalfW - 6, girdleY - cutHalfH, trunkHalfW * 2 + 12, cutHalfH * 2);
        ctx.setLineDash([]);
      }

      ctx.restore();
    }

    function drawCanopy(ctx, trunkTopY, phys, dt) {
      ctx.save();

      // Main Branches
      ctx.strokeStyle = '#78350f';
      ctx.lineCap = 'round';
      const branches = [
        { x2: -85, y2: trunkTopY - 65, w: 14 },
        { x2: -35, y2: trunkTopY - 105, w: 12 },
        { x2: 35, y2: trunkTopY - 105, w: 12 },
        { x2: 85, y2: trunkTopY - 65, w: 14 }
      ];
      branches.forEach((b) => {
        ctx.lineWidth = b.w;
        ctx.beginPath();
        ctx.moveTo(0, trunkTopY + 15);
        ctx.quadraticCurveTo(b.x2 * 0.4, trunkTopY - 30, b.x2, b.y2);
        ctx.stroke();
      });

      // Canopy Foliage Clusters
      const droopY = (1 - phys.leafHealth / 100) * 18;
      const scaleRadius = 0.45 + 0.55 * (phys.leafHealth / 100);

      const puffs = [
        { dx: -95, dy: -65, r: 46, v: -0.5 },
        { dx: -55, dy: -110, r: 54, v: 0.2 },
        { dx: 0, dy: -128, r: 62, v: 0 },
        { dx: 55, dy: -110, r: 54, v: -0.3 },
        { dx: 95, dy: -65, r: 46, v: 0.4 },
        { dx: -40, dy: -65, r: 48, v: 0.6 },
        { dx: 40, dy: -65, r: 48, v: -0.2 }
      ];

      puffs.forEach((p) => {
        ctx.fillStyle = getCanopyColor(phys.leafHealth, p.v);
        ctx.beginPath();
        ctx.arc(p.dx, trunkTopY + p.dy + droopY, p.r * scaleRadius, 0, Math.PI * 2);
        ctx.fill();
      });

      // If shallow girdling mode, draw growing fruits
      if (state.mode === 'shallow') {
        const fruitPositions = [
          { dx: -75, dy: -60 },
          { dx: -25, dy: -95 },
          { dx: 30, dy: -90 },
          { dx: 75, dy: -55 },
          { dx: 0, dy: -60 }
        ];
        const fRadius = 4 + (phys.fruitSize / 100) * 7;
        fruitPositions.forEach((fp) => {
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.arc(fp.dx, trunkTopY + fp.dy, fRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fda4af';
          ctx.beginPath();
          ctx.arc(fp.dx - fRadius * 0.3, trunkTopY + fp.dy - fRadius * 0.3, fRadius * 0.28, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // Falling withered leaves when leafHealth < 65%
      if (state.playing && phys.leafHealth < 65 && phys.leafHealth > 2 && Math.random() < 0.18) {
        state.fallingLeaves.push({
          x: (Math.random() - 0.5) * 180,
          y: trunkTopY - 50 - Math.random() * 60,
          vx: (Math.random() - 0.5) * 25,
          vy: 28 + Math.random() * 25,
          rot: Math.random() * Math.PI * 2
        });
      }

      for (let i = state.fallingLeaves.length - 1; i >= 0; i--) {
        const fl = state.fallingLeaves[i];
        if (state.playing) {
          fl.x += fl.vx * dt + Math.sin(fl.y * 0.05) * 0.5;
          fl.y += fl.vy * dt;
          fl.rot += 2 * dt;
        }
        ctx.save();
        ctx.translate(fl.x, fl.y);
        ctx.rotate(fl.rot);
        ctx.fillStyle = '#b45309';
        ctx.beginPath();
        ctx.ellipse(0, 0, 5, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (fl.y > 0) {
          state.fallingLeaves.splice(i, 1);
        }
      }

      ctx.restore();
    }

    function drawParticles(ctx, topY, botY, girdleY, trunkHalfW, phys, dt) {
      const spanH = botY - topY;
      const girdleRatio = (girdleY - topY) / spanH;

      // 1. Water Particles (Blue, moving UP in Xylem)
      const waterSpeed = 0.28 * (phys.waterFlow / 100);
      ctx.fillStyle = '#38bdf8';
      state.waterParticles.forEach((wp) => {
        if (state.playing && phys.waterFlow > 2) {
          wp.yProgress -= waterSpeed * dt;
          if (wp.yProgress < 0) wp.yProgress = 1;
        }
        if (phys.waterFlow > 2) {
          const py = topY + wp.yProgress * spanH;
          const px = wp.laneOffset;
          ctx.beginPath();
          ctx.arc(px, py, wp.size, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // 2. Sucrose / Phloem Particles (Amber, moving DOWN in phloem)
      const sugarProduction = phys.leafHealth / 100;
      const canCrossGirdle = state.mode === 'control' || (state.mode === 'shallow' && phys.healed > 55);

      ctx.fillStyle = '#fbbf24';
      state.sugarParticles.forEach((sp) => {
        if (state.playing && sugarProduction > 0.08) {
          if (canCrossGirdle) {
            sp.yProgress += 0.22 * dt;
            if (sp.yProgress > 1) sp.yProgress = 0;
          } else {
            // Blocked at girdle cut! Accumulate above cut
            const stopLimit = girdleRatio - 0.04;
            if (sp.yProgress < stopLimit) {
              sp.yProgress += 0.22 * sugarProduction * dt;
              if (sp.yProgress >= stopLimit) {
                sp.yProgress = stopLimit - Math.random() * 0.06;
              }
            } else {
              // Below cut particles get consumed by roots
              sp.yProgress += 0.18 * dt;
              if (sp.yProgress > 1) {
                sp.yProgress = 0;
              }
            }
          }
        }

        if (!canCrossGirdle && sp.yProgress > girdleRatio && phys.rootSugar < 15) {
          return;
        }
        if (sugarProduction <= 0.05 && sp.yProgress < girdleRatio - 0.08) {
          return;
        }

        const py = topY + sp.yProgress * spanH;
        const nearCut = !canCrossGirdle && Math.abs(sp.yProgress - (girdleRatio - 0.04)) < 0.07;
        const swellOffset = nearCut ? (phys.swelling / 100) * 10 * Math.sin(sp.stuckJitter + state.day) : 0;
        const px = sp.side * (trunkHalfW - 4) + sp.side * Math.abs(swellOffset);

        ctx.beginPath();
        ctx.arc(px, py, sp.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawAnatomicalLabels(ctx, trunkTopY, girdleY, trunkHalfW, phys) {
      ctx.save();
      ctx.font = '11px "Noto Sans TC", sans-serif';

      if (state.mode !== 'control') {
        // Callout 1: Upper Bark Swelling
        const labelX = -trunkHalfW - 150;
        const labelY = girdleY - 26;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(labelX, labelY - 16, 126, 36, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fcd34d';
        ctx.fillText('切口上緣：養分堆積', labelX + 8, labelY - 2);
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(`腫脹程度：${phys.swelling}%`, labelX + 8, labelY + 13);

        ctx.strokeStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(labelX + 126, labelY);
        ctx.lineTo(-trunkHalfW - 4, girdleY - 14);
        ctx.stroke();

        // Callout 2: Girdling Cut
        const cutLabelY = girdleY + 24;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.strokeStyle = '#ef4444';
        ctx.beginPath();
        ctx.roundRect(labelX, cutLabelY - 14, 126, 26, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fca5a5';
        ctx.fillText('🔪 環剝處 (韌皮部移除)', labelX + 8, cutLabelY + 3);
      } else {
        // Normal Mode Callouts
        const labelX = -trunkHalfW - 150;
        const labelY = girdleY - 10;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(labelX, labelY - 16, 126, 36, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#6ee7b7';
        ctx.fillText('維管束結構完整', labelX + 8, labelY - 2);
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText('水分與養分正常雙向運送', labelX + 8, labelY + 13);

        ctx.strokeStyle = '#10b981';
        ctx.beginPath();
        ctx.moveTo(labelX + 126, labelY);
        ctx.lineTo(-trunkHalfW - 4, girdleY);
        ctx.stroke();
      }

      // Roots Status Callout
      const rootLabelX = -170;
      const rootLabelY = 50;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.strokeStyle = phys.rootHealth > 40 ? '#fb923c' : '#f43f5e';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(rootLabelX, rootLabelY - 14, 132, 34, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = phys.rootHealth > 40 ? '#fdba74' : '#fda4af';
      ctx.fillText(`根部儲備養分: ${phys.rootSugar}%`, rootLabelX + 8, rootLabelY);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(phys.rootHealth > 40 ? '正常吸收水分與礦物質' : '⚠️ 根系飢餓壞死停止吸水', rootLabelX + 8, rootLabelY + 14);

      ctx.restore();
    }

    // Microscope Inset (Screen Space HUD)
    function drawMicroscopeInset(ctx, W, H, girdleCutScreenX, girdleCutScreenY, phys) {
      const boxW = 195;
      const boxH = 230;
      const boxX = W - boxW - 16;
      const boxY = H - boxH - 16;

      ctx.save();

      // Connector line if on-screen
      if (girdleCutScreenX > 0 && girdleCutScreenX < W && girdleCutScreenY > 0 && girdleCutScreenY < H) {
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(girdleCutScreenX, girdleCutScreenY);
        ctx.lineTo(boxX, boxY + boxH * 0.5);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Inset Background
      ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 12);
      ctx.fill();
      ctx.stroke();

      // Header
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 11px "Noto Sans TC", sans-serif';
      ctx.fillText('🔬 維管束縱切面微觀構造', boxX + 12, boxY + 20);

      const diagX = boxX + 18;
      const diagY = boxY + 34;
      const diagH = 148;
      const midY = diagY + diagH * 0.52;

      // 1. Xylem (木質部 - Inner)
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(diagX, diagY, 44, diagH);
      ctx.fillStyle = `rgba(56, 189, 248, ${0.25 + 0.45 * (phys.waterFlow / 100)})`;
      ctx.fillRect(diagX + 6, diagY, 32, diagH);

      // Upward arrows in Xylem
      ctx.fillStyle = '#0284c7';
      ctx.font = 'bold 12px sans-serif';
      if (phys.waterFlow > 10) {
        ctx.fillText('↑ 水', diagX + 10, diagY + 35);
        ctx.fillText('↑ 水', diagX + 10, diagY + 85);
        ctx.fillText('↑ 水', diagX + 10, diagY + 130);
      } else {
        ctx.fillStyle = '#e11d48';
        ctx.fillText('✕ 斷水', diagX + 4, diagY + 80);
      }

      // 2. Cambium (形成層)
      ctx.fillStyle = '#4ade80';
      if (state.mode === 'control') {
        ctx.fillRect(diagX + 44, diagY, 6, diagH);
      } else {
        ctx.fillRect(diagX + 44, diagY, 6, diagH * 0.38);
        ctx.fillRect(diagX + 44, diagY + diagH * 0.66, 6, diagH * 0.34);
        if (state.mode === 'shallow' && phys.healed > 40) {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(diagX + 44, diagY + diagH * 0.38, 6, diagH * 0.28);
        }
      }

      // 3. Phloem (韌皮部) & Outer Bark (樹皮)
      const upperBulge = (phys.swelling / 100) * 20;
      ctx.fillStyle = '#fbbf24';
      if (state.mode === 'control') {
        ctx.fillRect(diagX + 50, diagY, 36, diagH);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(diagX + 86, diagY, 14, diagH);

        ctx.fillStyle = '#78350f';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('↓ 養分', diagX + 52, diagY + 45);
        ctx.fillText('↓ 養分', diagX + 52, diagY + 105);
      } else {
        // Upper phloem with bulge
        ctx.beginPath();
        ctx.moveTo(diagX + 50, diagY);
        ctx.lineTo(diagX + 86, diagY);
        ctx.lineTo(diagX + 86 + upperBulge, diagY + diagH * 0.38);
        ctx.lineTo(diagX + 50, diagY + diagH * 0.38);
        ctx.closePath();
        ctx.fill();

        // Upper outer bark
        ctx.fillStyle = '#78350f';
        ctx.beginPath();
        ctx.moveTo(diagX + 86, diagY);
        ctx.lineTo(diagX + 100, diagY);
        ctx.lineTo(diagX + 100 + upperBulge, diagY + diagH * 0.38);
        ctx.lineTo(diagX + 86 + upperBulge, diagY + diagH * 0.38);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#78350f';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('↓ 養分', diagX + 52, diagY + 25);
        ctx.fillText('滯留腫大', diagX + 52, diagY + 50);

        // Lower phloem (starved)
        ctx.fillStyle = '#9ca3af';
        ctx.fillRect(diagX + 50, diagY + diagH * 0.66, 32, diagH * 0.34);
        ctx.fillStyle = '#5c280b';
        ctx.fillRect(diagX + 82, diagY + diagH * 0.66, 12, diagH * 0.34);

        // Cut label
        ctx.fillStyle = '#f87171';
        ctx.font = 'bold 10px "Noto Sans TC", sans-serif';
        ctx.fillText(state.mode === 'shallow' && phys.healed > 50 ? '✓ 癒傷組織接通' : '← 環剝缺口 →', diagX + 54, midY + 4);
      }

      // Legend Footer inside Inset
      ctx.font = '10px "Noto Sans TC", sans-serif';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('■ 木質部(內)', boxX + 14, boxY + boxH - 24);
      ctx.fillStyle = '#4ade80';
      ctx.fillText('■ 形成層(中)', boxX + 78, boxY + boxH - 24);
      ctx.fillStyle = '#fbbf24';
      ctx.fillText('■ 韌皮部(外)', boxX + 14, boxY + boxH - 8);
      ctx.fillStyle = '#a16207';
      ctx.fillText('■ 樹皮保護層', boxX + 78, boxY + boxH - 8);

      ctx.restore();
    }

    // --- Animation Loop ---
    let lastTime = performance.now();
    function animate(now) {
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;

      // Only advance chronological day when girdling simulation is active and playing
      if (state.mode !== 'control' && state.playing) {
        state.day += dt * 4.5 * state.speed;
        if (state.day >= state.maxDay) {
          state.day = state.maxDay;
          state.playing = false;
          syncPlayButton();
        }
        updateUI();
      }

      drawScene(dt);
      requestAnimationFrame(animate);
    }

    function syncPlayButton() {
      const playIcon = document.getElementById('playIcon');
      const playText = document.getElementById('playText');
      if (state.playing) {
        if (playIcon) playIcon.textContent = '⏸';
        if (playText) playText.textContent = '暫停';
      } else {
        if (playIcon) playIcon.textContent = '▶';
        if (playText) playText.textContent = state.day >= state.maxDay ? '重播' : '播放';
      }
    }

    // --- Mode Switching Logic ---
    function setSimulationMode(mode) {
      state.mode = mode;
      state.day = 0;
      state.fallingLeaves = [];
      state.playing = true;
      initParticles();
      syncPlayButton();

      const btnGirdled = document.getElementById('modeGirdledBtn');
      const btnControl = document.getElementById('modeControlBtn');
      const btnShallow = document.getElementById('modeShallowBtn');
      const timelineSection = document.getElementById('timelineSection');

      const inactiveClass = 'w-full px-3 py-2 rounded-lg font-medium text-left transition flex items-center justify-between text-slate-300 hover:text-white hover:bg-slate-800/80 border border-transparent';

      if (mode === 'control') {
        // Continuous normal: timeline not needed!
        btnControl.className = 'w-full px-3 py-2 rounded-lg font-bold text-left transition flex items-center justify-between bg-emerald-500 text-slate-950 shadow-md shadow-emerald-950/50';
        btnGirdled.className = inactiveClass;
        btnShallow.className = inactiveClass;
        timelineSection.classList.add('hidden');
      } else if (mode === 'girdled') {
        btnGirdled.className = 'w-full px-3 py-2 rounded-lg font-bold text-left transition flex items-center justify-between bg-amber-500 text-slate-950 shadow-md shadow-amber-950/50';
        btnControl.className = inactiveClass;
        btnShallow.className = inactiveClass;
        timelineSection.classList.remove('hidden');
      } else if (mode === 'shallow') {
        btnShallow.className = 'w-full px-3 py-2 rounded-lg font-bold text-left transition flex items-center justify-between bg-rose-500 text-white shadow-md shadow-rose-950/50';
        btnControl.className = inactiveClass;
        btnGirdled.className = inactiveClass;
        timelineSection.classList.remove('hidden');
      }

      updateUI();
    }

    // --- Event Listeners ---
    document.getElementById('modeControlBtn').addEventListener('click', () => setSimulationMode('control'));
    document.getElementById('modeGirdledBtn').addEventListener('click', () => setSimulationMode('girdled'));
    document.getElementById('modeShallowBtn').addEventListener('click', () => setSimulationMode('shallow'));

    document.getElementById('playPauseBtn').addEventListener('click', () => {
      if (state.day >= state.maxDay) {
        state.day = 0;
        state.fallingLeaves = [];
        state.playing = true;
      } else {
        state.playing = !state.playing;
      }
      syncPlayButton();
      updateUI();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      state.day = 0;
      state.fallingLeaves = [];
      state.playing = false;
      initParticles();
      syncPlayButton();
      updateUI();
    });

    document.getElementById('timeSlider').addEventListener('input', (e) => {
      state.day = parseFloat(e.target.value);
      state.playing = false;
      syncPlayButton();
      updateUI();
    });

    document.querySelectorAll('.speed-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.speed = parseFloat(btn.getAttribute('data-speed'));
        document.querySelectorAll('.speed-btn').forEach((b) => {
          b.className = 'speed-btn px-1.5 py-1 rounded text-slate-300 hover:text-white';
        });
        btn.className = 'speed-btn px-1.5 py-1 rounded bg-slate-700 text-emerald-400 font-bold';
      });
    });

    document.querySelectorAll('.stage-pill').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.day = parseFloat(btn.getAttribute('data-jump'));
        updateUI();
      });
    });

    document.getElementById('showMicroToggle').addEventListener('change', (e) => {
      state.showMicro = e.target.checked;
    });

    document.getElementById('showLabelsToggle').addEventListener('change', (e) => {
      state.showLabels = e.target.checked;
    });

    // Zoom buttons
    document.getElementById('zoomInBtn').addEventListener('click', zoomIn);
    document.getElementById('zoomOutBtn').addEventListener('click', zoomOut);
    document.getElementById('resetViewBtn').addEventListener('click', resetView);

    document.getElementById('floatZoomInBtn').addEventListener('click', zoomIn);
    document.getElementById('floatZoomOutBtn').addEventListener('click', zoomOut);
    document.getElementById('floatResetViewBtn').addEventListener('click', resetView);

    // Initialize on load
    window.addEventListener('load', () => {
      resizeCanvas();
      resetView();
      setSimulationMode('control');
      requestAnimationFrame(animate);
    });
  </script>
</body>

</html>
