<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>血糖恆定與代謝互動模型：肝糖儲存與粒線體呼吸作用</title>
  <meta name="description" content="互動式生物教學模擬：呈現血糖進入肝臟合成/分解肝糖分支結構（末端延長與水解），以及進入細胞粒線體進行呼吸作用產生ATP能量的生化機制。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->


    <!-- Main Workspace / Simulation Canvas -->
    <main class="simulation-layout">
      <!-- Left / Center Canvas Stage -->
      <div class="canvas-panel">

        <div class="canvas-wrapper">
          <canvas id="simCanvas" width="1120" height="700"></canvas>
          
          <!-- Contextual In-Canvas Action Buttons -->
          <div id="canvas-overlay" class="canvas-overlay">
            <!-- 1. 血管起點：進食升糖 (左側血管入口上方) -->
            <button id="btn-eat" class="btn btn-primary spot-btn spot-blood-start" title="飲食使血糖升高（由血管起點湧入）">
              <div class="btn-text">
                <strong>進食升糖</strong>
                <small>+6 葡萄糖入血</small>
              </div>
            </button>

            <!-- 2. 肝臟區域按鈕 (肝臟右側/內部空隙) -->
            <div class="spot-group spot-liver-group">
              <button id="btn-store-glycogen" class="btn btn-liver spot-btn" title="胰島素作用：促使血液葡萄糖結合到肝糖末端">
                <div class="btn-text">
                  <strong>合成肝糖</strong>
                  <small>葡萄糖接至末端</small>
                </div>
              </button>

              <button id="btn-break-glycogen" class="btn btn-break spot-btn" title="升糖素作用：水解末端肝糖釋放回血液">
                <div class="btn-text">
                  <strong>拆解肝糖</strong>
                  <small>釋出葡萄糖回血</small>
                </div>
              </button>
            </div>

            <!-- 3. 骨骼肌細胞按鈕 (左下骨骼肌頂部/空隙) -->
            <div class="spot-group spot-muscle-group">
              <button id="btn-store-muscle" class="btn btn-muscle spot-btn" title="胰島素作用：骨骼肌攝取血糖並合成肌糖原儲存">
                <div class="btn-text">
                  <strong>合成肝糖</strong>
                  <small>轉化儲存為肝糖</small>
                </div>
              </button>

              <button id="btn-use-muscle" class="btn btn-muscle-use spot-btn" title="運動收縮：骨骼肌消耗肌肉肝糖，並由血液大量攝取血糖氧化產能供肌纖維活動">
                <div class="btn-text">
                  <strong>運動產能</strong>
                  <small>消耗肝糖＋攝取血糖</small>
                </div>
              </button>
            </div>

            <!-- 4. 脂肪細胞按鈕 (中下脂肪細胞頂部) -->
            <div class="spot-group spot-adipose-group">
              <button id="btn-store-fat" class="btn btn-adipose spot-btn" title="胰島素作用：脂肪細胞攝取血糖並轉化為三酸甘油酯儲存">
                <div class="btn-text">
                  <strong>轉化脂肪</strong>
                  <small>轉化為三酸甘油酯</small>
                </div>
              </button>
            </div>

            <!-- 5. 組織細胞呼吸作用按鈕 (右下組織細胞頂部) -->
            <div class="spot-group spot-cell-group">
              <button id="btn-respire" class="btn btn-mito spot-btn" title="細胞攝取葡萄糖並經呼吸作用釋放能量">
                <div class="btn-text">
                  <strong>細胞呼吸</strong>
                  <small>裂解 → 粒線體產能</small>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Control Panel Sidebar (保留生理調節開關、重設與速度) -->
      <aside class="sidebar-control-panel">
        <div class="sidebar-card">
          <div class="sidebar-card-header">
            <h3>系統控制面板</h3>
            <span class="sub-badge">恆定調控</span>
          </div>

          <div class="sidebar-settings">
            <button id="btn-auto-sim" class="btn btn-toggle active">
              <span class="status-indicator"></span>
              <span>自動生理循環: <strong id="auto-sim-status">開啟</strong></span>
            </button>

            <button id="btn-reset" class="btn btn-secondary">
              <span>重設初態</span>
            </button>

            <div class="speed-control">
              <label for="slider-speed">動態速度:</label>
              <input type="range" id="slider-speed" min="0.5" max="2.0" step="0.1" value="1.0">
              <span id="speed-val">1.0x</span>
            </div>
          </div>

          <div class="sidebar-divider"></div>

          <!-- 生理功能導覽提示卡片 -->
          <div class="legend-card">
            <h4>操作指南</h4>
            <p>點擊畫布中各器官或細胞旁的實體按鈕：</p>
            <ul class="guide-list">
              <li><strong style="color:#f43f5e">血管起點：</strong> 進食補充血糖</li>
              <li><strong style="color:#10b981">肝臟：</strong> 合成 / 拆解肝糖調節血糖</li>
              <li><strong style="color:#fb7185">骨骼肌：</strong> 合成肝糖 / 運動消耗</li>
              <li><strong style="color:#facc15">脂肪細胞：</strong> 轉化為三酸甘油酯</li>
              <li><strong style="color:#8b5cf6">組織細胞：</strong> 細胞呼吸釋放 ATP</li>
            </ul>
          </div>
        </div>
      </aside>
    </main>


  </div>

  <script src="app.js"></script>
</body>
</html>
