                            ctx.fill();
                        }
                    }

                    // Germinating landed spores on the right
                    if (germ > 0.05) {
                        const spots = [115, 205];
                        spots.forEach((gx, idx) => {
                            const gAmt = clamp((germ - idx * 0.15) / 0.85, 0, 1);
                            if (gAmt <= 0) return;
                            ctx.fillStyle = P.spore;
                            ctx.beginPath();
                            ctx.arc(gx, 121, 5.5, 0, Math.PI * 2);
                            ctx.fill();

                            // Growing new hyphae
                            ctx.strokeStyle = P.newTissue;
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            ctx.moveTo(gx, 121);
                            ctx.quadraticCurveTo(gx + 10 * gAmt, 121 - 35 * gAmt, gx + 4 * gAmt, 121 - 65 * gAmt);
                            ctx.stroke();
                            if (gAmt > 0.4) {
                                drawRhizoid(gx, 124, gAmt * 0.75);
                            }
                        });
                        addLabel(160, 75, '孢子萌發為新菌絲', 45, -45, P.newTissue);
                    }

                    ctx.restore();

                    addLabel(-160, stalkTopY - spR * 0.9, '孢子囊 (含大量單倍體孢子)', -15, -48, P.spore);
                    addLabel(-160, 28, '孢子囊柄 (直立菌絲)', -92, -12, P.wall);
                    addLabel(-65, 115, '匍匐菌絲 (無隔膜)', 15, -35, P.wall);
                    addLabel(-160, 152, '假根 (固定與吸收養分)', -60, 48, P.wall);
                    if (burst > 0.2) {
                        addLabel(-25, -45, '孢子隨氣流散播', 35, -45, P.spore);
                    }
                },

                // 4B. 青黴菌 (Penicillium)
                penicillium(ctx, p, time) {
                    const branchGrow = ePhase(p, 0.1, 0.9);
                    const chainGrow = ePhase(p, 0.75, 1.75);
                    const disperse = ePhase(p, 1.65, 2.45);
                    const germ = ePhase(p, 2.25, 3.0);

                    // Substrate
                    ctx.save();
                    drawRoundedRectPath(ctx, -330, 130, 660, 66, 14);
                    ctx.fillStyle = '#334155';
                    ctx.fill();
                    ctx.strokeStyle = '#64748b';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    // Septate hyphae along substrate
                    const drawSeptateSegment = (x1, y1, x2, y2, segs) => {
                        ctx.strokeStyle = P.wall;
                        ctx.lineWidth = 5;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.stroke();
                        // Septa cross-walls
                        ctx.strokeStyle = '#0f172a';
                        ctx.lineWidth = 2;
                        for (let i = 1; i < segs; i++) {
                            const t = i / segs;
                            const px = lerp(x1, x2, t);
                            const py = lerp(y1, y2, t);
                            const ang = Math.atan2(y2 - y1, x2 - x1) + Math.PI / 2;
                            ctx.beginPath();
                            ctx.moveTo(px - Math.cos(ang) * 3.5, py - Math.sin(ang) * 3.5);
                            ctx.lineTo(px + Math.cos(ang) * 3.5, py + Math.sin(ang) * 3.5);
                            ctx.stroke();
                        }
                    };

                    drawSeptateSegment(-260, 127, 40, 127, 8);
                    // Erect Conidiophore (Septate)
                    const cx = -135;
                    drawSeptateSegment(cx, 127, cx, -12, 5);

                    // Broom-like branches (Metulae + Phialides)
                    const branches = [-28, 0, 28];
                    const subAngles = [-14, 14];
                    branches.forEach((bx) => {
                        const bLen = lerp(12, 42, branchGrow);
                        ctx.strokeStyle = P.wall;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(cx, -12);
                        ctx.lineTo(cx + bx * branchGrow, -12 - bLen);
                        ctx.stroke();

                        if (branchGrow > 0.35) {
                            subAngles.forEach((sxOff, sIdx) => {
                                const px1 = cx + bx * branchGrow;
                                const py1 = -12 - bLen;
                                const px2 = px1 + sxOff * 0.8;
                                const py2 = py1 - 28;
                                ctx.strokeStyle = P.plantLight;
                                ctx.lineWidth = 3;
                                ctx.beginPath();
                                ctx.moveTo(px1, py1);
                                ctx.lineTo(px2, py2);
                                ctx.stroke();

                                // Chains of Conidiospores (green-violet)
                                const numSpores = Math.floor(chainGrow * 5);
                                for (let k = 0; k < numSpores; k++) {
                                    let spX = px2 + sxOff * 0.14 * (k + 1);
                                    let spY = py2 - 11 * (k + 1);

                                    if (disperse > 0.05 && k >= 1) {
                                        const fly = clamp((disperse - (4 - k) * 0.12) / 0.7, 0, 1);
                                        if (fly > 0) {
                                            spX += fly * (135 + (k * 37 + sIdx * 55));
                                            spY += fly * (-45 + (bx + k * 24)) + fly * fly * 115;
                                        }
                                    }
                                    ctx.fillStyle = (k % 2 === 0) ? P.plant : P.spore;
                                    ctx.beginPath();
                                    ctx.arc(spX, spY, 5, 0, Math.PI * 2);
                                    ctx.fill();
                                    ctx.strokeStyle = '#0f172a';
                                    ctx.lineWidth = 1;
                                    ctx.stroke();
                                }
                            });
                        }
                    });

                    // Germinating conidia on the right
                    if (germ > 0.05) {
                        [115, 205].forEach((gx, idx) => {
                            const g = clamp((germ - idx * 0.15) / 0.85, 0, 1);
                            if (g <= 0) return;
                            ctx.fillStyle = P.plant;
                            ctx.beginPath();
                            ctx.arc(gx, 125, 5.5, 0, Math.PI * 2);
                            ctx.fill();
                            drawSeptateSegment(gx, 125, gx + 48 * g, 125 - 45 * g, 3);
                        });
                        addLabel(165, 88, '分生孢子萌發為有隔菌絲', 45, -45, P.newTissue);
                    }

                    ctx.restore();

                    addLabel(cx, 55, '分生孢子梗 (具細胞隔膜)', -110, -10, P.wall);
                    addLabel(cx, -50, '掃帚狀分枝', -105, -20, P.plantLight);
                    addLabel(cx + 15, -115, '串狀分生孢子 (外生無囊壁)', 55, -35, P.spore);
                    addLabel(-65, 127, '有隔膜菌絲', -40, 48, P.wall);
                },

                // 5A. 落地生根 (Bryophyllum - Leaf)
                bryophyllum(ctx, p, time) {
                    const budAmt = ePhase(p, 0.2, 1.15);
                    const rootAmt = ePhase(p, 1.0, 2.05);
                    const dropAmt = ePhase(p, 2.05, 3.0);

                    drawSoilBed(ctx, 115);

                    // Main fleshy Bryophyllum leaf
                    ctx.save();
                    ctx.translate(-35, -35);
                    ctx.rotate(-0.18);

                    // Scalloped leaf path
                    const notchPts = [];
                    ctx.beginPath();
                    ctx.moveTo(-155, 0);
                    for (let i = 0; i <= 4; i++) {
                        const x1 = lerp(-140, 145, i / 5);
                        const x2 = lerp(-140, 145, (i + 1) / 5);
                        const xm = (x1 + x2) / 2;
                        const yEdge = -Math.sin(((i + 0.5) / 5) * Math.PI) * 76 - 10;
                        const yNotch = -Math.sin(((i + 1) / 5) * Math.PI) * 62 - 6;
                        ctx.quadraticCurveTo(xm, yEdge - 14, x2, yNotch);
                        if (i < 4) notchPts.push({ x: x2, y: yNotch, side: -1 });
                    }
                    ctx.quadraticCurveTo(175, 0, 155, 14);
                    for (let i = 4; i >= 0; i--) {
                        const x1 = lerp(-140, 145, (i + 1) / 5);
                        const x2 = lerp(-140, 145, i / 5);
                        const xm = (x1 + x2) / 2;
                        const yEdge = Math.sin(((i + 0.5) / 5) * Math.PI) * 76 + 10;
                        const yNotch = Math.sin((i / 5) * Math.PI) * 62 + 6;
                        ctx.quadraticCurveTo(xm, yEdge + 14, x2, yNotch);
                        if (i > 0) notchPts.push({ x: x2, y: yNotch, side: 1 });
                    }
                    ctx.closePath();
                    ctx.fillStyle = P.plantDark;
                    ctx.fill();
                    ctx.strokeStyle = P.plantLight;
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Midrib vein
                    ctx.strokeStyle = 'rgba(134, 239, 172, 0.45)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-165, 0);
                    ctx.lineTo(148, 0);
                    ctx.stroke();

                    // Plantlets at leaf notches
                    const drawPlantlet = (px, py, scale, roots, color) => {
                        ctx.save();
                        ctx.translate(px, py);
                        ctx.scale(scale, scale);
                        // Roots
                        if (roots > 0.05) {
                            ctx.strokeStyle = P.newTissue;
                            ctx.lineWidth = 1.8;
                            [-6, 0, 6].forEach((rx) => {
                                ctx.beginPath();
                                ctx.moveTo(0, 2);
                                ctx.quadraticCurveTo(rx * 0.5, 14 * roots, rx, 26 * roots);
                                ctx.stroke();
                            });
                        }
                        // Tiny stem & 2 pairs of leaves
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.ellipse(-10, -8, 11, 5.5, -0.45, 0, Math.PI * 2);
                        ctx.ellipse(10, -8, 11, 5.5, 0.45, 0, Math.PI * 2);
                        ctx.ellipse(0, -15, 6, 9, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    };

                    // Keep upper plantlets on leaf, drop bottom ones to soil!
                    notchPts.forEach((pt, idx) => {
                        if (idx % 2 === 0 && budAmt > 0.05) {
                            if (pt.side === 1 && dropAmt > 0.05) {
                                // Dropping onto soil
                                ctx.save();
                                ctx.rotate(0.18); // unrotate into world space roughly
                                ctx.restore();
                            } else {
                                drawPlantlet(pt.x, pt.y, lerp(0.2, 1.05, budAmt), rootAmt, P.plantLight);
                            }
                        }
                    });
                    ctx.restore();

                    // Dropped plantlets on soil surface
                    if (dropAmt > 0.05 || budAmt > 0.1) {
                        const spots = [-105, 15, 125];
                        spots.forEach((sx, idx) => {
                            if (dropAmt > 0.02) {
                                const startY = 30 + idx * 5;
                                const curY = lerp(startY, 112, dropAmt);
                                const curScale = lerp(0.95, 1.4, dropAmt);
                                ctx.save();
                                ctx.translate(sx, curY);
                                ctx.scale(curScale, curScale);
                                ctx.strokeStyle = P.newTissue;
                                ctx.lineWidth = 2;
                                [-8, -2, 4, 9].forEach((rx) => {
                                    ctx.beginPath();
                                    ctx.moveTo(0, 2);
                                    ctx.quadraticCurveTo(rx * 0.5, 18, rx * 1.1, 32);
                                    ctx.stroke();
                                });
                                ctx.fillStyle = P.plant;
                                ctx.beginPath();
                                ctx.ellipse(-12, -9, 13, 6.5, -0.45, 0, Math.PI * 2);
                                ctx.ellipse(12, -9, 13, 6.5, 0.45, 0, Math.PI * 2);
                                ctx.ellipse(0, -17, 7, 10, 0, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.restore();
                            }
                        });
                    }

                    addLabel(-90, -5, '肥厚葉片 (營養器官)', -110, 52, P.plant);
                    addLabel(-45, -108, '葉緣缺刻處長出小芽體', -65, -45, P.newTissue);
                    if (rootAmt > 0.25) {
                        addLabel(45, -90, '不定根', 85, -42, P.newTissue);
                    }
                    if (dropAmt > 0.3) {
                        addLabel(125, 105, '掉落土中成為獨立新植株', 45, -52, P.plantLight);
                    }
                },

                // 5B. 石蓮 (Echeveria - Leaf)
                echeveria(ctx, p, time) {
                    const rootAmt = ePhase(p, 0.2, 1.2);
                    const sproutAmt = ePhase(p, 0.85, 2.2);
                    const witherAmt = ePhase(p, 2.1, 3.0);

                    drawSoilBed(ctx, 85);

                    // Parent succulent leaf lying on soil
                    ctx.save();
                    ctx.translate(-30, 62);
                    const shrink = 1 - witherAmt * 0.42;
                    ctx.scale(shrink, shrink * (1 - witherAmt * 0.35));
                    ctx.beginPath();
                    ctx.moveTo(100, 12); // leaf base (callus)
                    ctx.bezierCurveTo(60, -32, -80, -38, -145, -8);
                    ctx.bezierCurveTo(-110, 26, 20, 32, 100, 12);
                    ctx.closePath();
                    ctx.fillStyle = witherAmt > 0.5 ? '#6b7280' : '#34d399';
                    ctx.fill();
                    ctx.strokeStyle = witherAmt > 0.5 ? '#9ca3af' : P.plantLight;
                    ctx.lineWidth = 2.8;
                    ctx.stroke();
                    ctx.restore();

                    const basePointX = 70 - witherAmt * 42;
                    const basePointY = 74;

                    // Adventitious roots into soil
                    if (rootAmt > 0.05) {
                        ctx.save();
                        ctx.strokeStyle = P.dna;
                        ctx.lineWidth = 2.6;
                        const roots = [-32, -14, 4, 22, 42];
                        roots.forEach((rx, idx) => {
                            const rLen = lerp(5, 78, clamp(rootAmt + witherAmt * 0.3, 0, 1.2));
                            ctx.beginPath();
                            ctx.moveTo(basePointX, basePointY + 6);
                            ctx.quadraticCurveTo(
                                basePointX + rx * 0.5,
                                basePointY + rLen * 0.5,
                                basePointX + rx,
                                basePointY + rLen + (idx % 2) * 10
                            );
                            ctx.stroke();
                        });
                        ctx.restore();
                        addLabel(basePointX + 12, basePointY + 42, '不定根 (深入土壤)', 85, 32, P.dna);
                    }

                    // New rosette of succulent leaves
                    if (sproutAmt > 0.05) {
                        const s = lerp(0.15, 1.15, clamp(sproutAmt + witherAmt * 0.25, 0, 1.25));
                        ctx.save();
                        ctx.translate(basePointX, basePointY + 2);
                        ctx.scale(s, s);
                        const angles = [-1.15, -0.65, 0.65, 1.15, -0.32, 0.32, 0];
                        angles.forEach((ang, idx) => {
                            ctx.save();
                            ctx.rotate(ang);
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.bezierCurveTo(-16, -24, -14, -56, 0, -68);
                            ctx.bezierCurveTo(14, -56, 16, -24, 0, 0);
                            ctx.closePath();
                            ctx.fillStyle = idx >= 4 ? P.plantLight : P.plant;
                            ctx.fill();
                            ctx.strokeStyle = P.plantDark;
                            ctx.lineWidth = 1.8;
                            ctx.stroke();
                            ctx.restore();
                        });
                        ctx.restore();
                        addLabel(basePointX, basePointY - 52 * s, '蓮座狀新植株', 55, -45, P.newTissue);
                    }

                    addLabel(-95, 55, witherAmt > 0.6 ? '母葉養分耗盡枯萎' : '飽滿母葉 (葉插)', -45, -62, P.plantLight);
                },

                // 5C. 草莓 (Strawberry - Stolon)
                strawberry(ctx, p, time) {
                    const stolonAmt = ePhase(p, 0.1, 1.1);
                    const rootAmt = ePhase(p, 1.0, 2.05);
                    const severAmt = ePhase(p, 2.15, 3.0);

                    drawSoilBed(ctx, 90);

                    const drawStrawberryPlant = (cx, cy, scale, hasBerry) => {
                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.scale(scale, scale);

                        // Fibrous roots
                        ctx.strokeStyle = P.root;
                        ctx.lineWidth = 2.4;
                        [-28, -12, 0, 14, 30].forEach((rx, idx) => {
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.quadraticCurveTo(rx * 0.5, 28, rx, 58 + (idx % 2) * 14);
                            ctx.stroke();
                        });

                        // Stems & trifoliate leaves
                        const stems = [-0.65, -0.2, 0.25, 0.65];
                        stems.forEach((ang, idx) => {
                            const tipX = Math.sin(ang) * 78;
                            const tipY = -Math.cos(ang) * 78;
                            ctx.strokeStyle = P.plantDark;
                            ctx.lineWidth = 3.5;
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.quadraticCurveTo(tipX * 0.4, tipY * 0.6, tipX, tipY);
                            ctx.stroke();

                            ctx.save();
                            ctx.translate(tipX, tipY);
                            ctx.rotate(ang);
                            drawLeafShape(ctx, 32, 13, P.plant, P.plantLight);
                            ctx.rotate(-0.85);
                            drawLeafShape(ctx, 26, 11, P.plant, P.plantLight);
                            ctx.rotate(1.7);
                            drawLeafShape(ctx, 26, 11, P.plant, P.plantLight);
                            ctx.restore();
                        });

                        if (hasBerry) {
                            ctx.strokeStyle = P.plantDark;
                            ctx.lineWidth = 2.5;
                            ctx.beginPath();
                            ctx.moveTo(-12, -5);
                            ctx.quadraticCurveTo(-48, -22, -52, 2);
                            ctx.stroke();
                            // Red strawberry
                            ctx.fillStyle = '#ef4444';
                            ctx.beginPath();
                            ctx.moveTo(-58, 2);
                            ctx.bezierCurveTo(-66, 12, -58, 28, -52, 28);
                            ctx.bezierCurveTo(-46, 28, -38, 12, -46, 2);
                            ctx.closePath();
                            ctx.fill();
                        }
                        ctx.restore();
                    };

                    const parentX = -145;
                    const childX = 125;

                    // Parent plant
                    drawStrawberryPlant(parentX, 90, 1.05, true);

                    // Stolon (Runner)
                    if (stolonAmt > 0.05) {
                        const endX = lerp(parentX + 15, childX, stolonAmt);
                        const midX = (parentX + endX) / 2;
                        ctx.save();
                        ctx.strokeStyle = severAmt > 0.5 ? '#92400e' : P.newTissue;
                        ctx.lineWidth = 4.5;
                        if (severAmt > 0.45) {
                            ctx.setLineDash([8, 8]);
                            ctx.globalAlpha = 1 - (severAmt - 0.45) * 1.4;
                        }
                        ctx.beginPath();
                        ctx.moveTo(parentX + 8, 86);
                        ctx.quadraticCurveTo(midX, 32, endX, 88);
                        ctx.stroke();
                        ctx.restore();

                        if (severAmt < 0.7) {
                            addLabel(midX, 55, '匍匐莖 (水平特化莖)', 0, -48, P.newTissue);
                        }
                    }

                    // Node & Daughter plant
                    if (rootAmt > 0.05) {
                        // Node dot
                        ctx.fillStyle = P.newTissue;
                        ctx.beginPath();
                        ctx.arc(childX, 88, 6, 0, Math.PI * 2);
                        ctx.fill();

                        drawStrawberryPlant(childX, 90, lerp(0.15, 0.92, clamp(rootAmt + severAmt * 0.2, 0, 1.1)), false);
                        addLabel(childX, 88, '節 (接觸土壤生根長芽)', 45, 58, P.newTissue);
                        addLabel(childX, 22, '子代草莓植株', 40, -35, P.plantLight);
                    }

                    addLabel(parentX, 12, '親代草莓植株', -40, -42, P.plant);
                },

                // 5D. 番薯 (Sweet Potato - Tuberous Root)
                sweetpotato(ctx, p, time) {
                    const budAmt = ePhase(p, 0.15, 1.1);
                    const shootAmt = ePhase(p, 0.85, 2.15);
                    const leafAmt = ePhase(p, 1.75, 3.0);

                    drawSoilBed(ctx, 45);

                    // Swollen tuberous root embedded in soil
                    ctx.save();
                    ctx.translate(-10, 92);
                    ctx.rotate(-0.08);
                    ctx.beginPath();
                    ctx.moveTo(-145, 0);
                    ctx.bezierCurveTo(-95, -52, 85, -54, 150, 0);
                    ctx.bezierCurveTo(95, 54, -85, 52, -145, 0);
                    ctx.closePath();
                    ctx.fillStyle = '#9d174d'; // purple-red sweet potato skin
                    ctx.fill();
                    ctx.strokeStyle = '#f472b6';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Cream starch interior hint / sheen
                    ctx.beginPath();
                    ctx.ellipse(0, -14, 95, 16, 0, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(253, 230, 138, 0.15)';
                    ctx.fill();
                    ctx.restore();

                    // New fibrous roots below tuber
                    if (shootAmt > 0.15) {
                        ctx.save();
                        ctx.strokeStyle = P.tuber;
                        ctx.lineWidth = 2.2;
                        [-75, -25, 20, 68].forEach((rx, idx) => {
                            const rLen = lerp(4, 52, shootAmt);
                            ctx.beginPath();
                            ctx.moveTo(rx, 132);
                            ctx.quadraticCurveTo(rx - 10, 132 + rLen * 0.6, rx + (idx % 2 ? 14 : -14), 132 + rLen);
                            ctx.stroke();
                        });
                        ctx.restore();
                        addLabel(15, 162, '新長出的鬚根', 95, 25, P.tuber);
                    }

                    // Adventitious buds & leafy vines sprouting upward
                    const sproutSpots = [{ x: -55, y: 55, dir: -0.22 }, { x: 25, y: 48, dir: 0.18 }];
                    sproutSpots.forEach((sp, idx) => {
                        if (budAmt > 0.05) {
                            const h = lerp(10, 165, clamp(shootAmt + leafAmt * 0.25, 0, 1.2));
                            ctx.save();
                            ctx.translate(sp.x, sp.y);
                            // Vine stem
                            ctx.strokeStyle = P.plant;
                            ctx.lineWidth = 5;
                            ctx.lineCap = 'round';
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            const tipX = Math.sin(sp.dir) * h;
                            const tipY = -h;
                            ctx.quadraticCurveTo(tipX * 0.25 - 12, -h * 0.5, tipX, tipY);
                            ctx.stroke();

                            // Heart-shaped sweet potato leaves
                            if (shootAmt > 0.2) {
                                const numLeaves = Math.floor(lerp(1, 5, clamp(shootAmt * 0.6 + leafAmt * 0.5, 0, 1)));
                                for (let k = 1; k <= numLeaves; k++) {
                                    const t = k / (numLeaves + 0.5);
                                    const lx = tipX * t;
                                    const ly = tipY * t;
                                    ctx.save();
                                    ctx.translate(lx, ly);
                                    ctx.rotate(k % 2 === 0 ? 0.65 : -2.45);
                                    const lScale = lerp(0.4, 1.0, leafAmt * 0.6 + 0.4);
                                    ctx.scale(lScale, lScale);
                                    drawLeafShape(ctx, 42, 18, P.plant, P.plantLight);
                                    ctx.restore();
                                }
                            }
                            ctx.restore();
                        }
                    });

                    addLabel(-85, 95, '塊根 (儲存大量澱粉)', -95, 58, P.dna);
                    if (budAmt > 0.15) {
                        addLabel(-55, 52, '不定芽萌發', -98, -32, P.newTissue);
                    }
                    if (shootAmt > 0.35) {
                        addLabel(45, -45, '新蔓莖與葉 (可剪下扦插)', 75, -38, P.plantLight);
                    }
                },

                // 5E. 馬鈴薯 (Potato - Stem Tuber)
                potato(ctx, p, time) {
                    const sproutAmt = ePhase(p, 0.2, 1.25);
                    const rootAmt = ePhase(p, 1.0, 2.2);
                    const canopyAmt = ePhase(p, 1.8, 3.0);

                    drawSoilBed(ctx, 35);

                    // Underground stem tuber (Potato)
                    ctx.save();
                    ctx.translate(0, 108);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 118, 58, -0.05, 0, Math.PI * 2);
                    ctx.fillStyle = '#ca8a04';
                    ctx.fill();
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Potato eyes (nodes & axillary buds)
                    const eyes = [
                        { x: -62, y: -32 },
                        { x: 18, y: -44 },
                        { x: 74, y: -22 },
                        { x: -35, y: 12 },
                        { x: 42, y: 18 }
                    ];
                    eyes.forEach((ey) => {
                        ctx.strokeStyle = '#713f12';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.arc(ey.x, ey.y + 4, 11, Math.PI * 1.15, Math.PI * 1.85);
                        ctx.stroke();
                        ctx.fillStyle = P.newTissue;
                        ctx.beginPath();
                        ctx.arc(ey.x, ey.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.restore();

                    // Sprouting shoots from upper eyes
                    const activeEyes = [{ x: -62, y: 76, lean: -28 }, { x: 18, y: 64, lean: 18 }];
                    activeEyes.forEach((ey, idx) => {
                        if (sproutAmt > 0.05) {
                            const h = lerp(10, 195, clamp(sproutAmt * 0.55 + canopyAmt * 0.55, 0, 1.15));
                            ctx.save();
                            ctx.translate(ey.x, ey.y);
                            ctx.strokeStyle = P.plant;
                            ctx.lineWidth = 6;
                            ctx.lineCap = 'round';
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.quadraticCurveTo(ey.lean * 0.4, -h * 0.5, ey.lean, -h);
                            ctx.stroke();

                            // Adventitious roots growing from the BASE OF THE NEW SPROUT (below soil, above tuber)
                            if (rootAmt > 0.1) {
                                ctx.strokeStyle = P.tuber;
                                ctx.lineWidth = 2;
                                [-22, -10, 12, 24].forEach((rx) => {
                                    const rScale = rootAmt;
                                    ctx.beginPath();
                                    ctx.moveTo(ey.lean * 0.1, -14);
                                    ctx.quadraticCurveTo(rx * 0.6 * rScale, -4, rx * rScale, 18 * rScale);
                                    ctx.stroke();
                                });
                            }

                            // Leaves above soil (y < 35 in world, so relative y < 35 - ey.y)
                            if (canopyAmt > 0.1 || sproutAmt > 0.75) {
                                const lGrow = clamp((h - 45) / 140, 0, 1);
                                if (lGrow > 0.05) {
                                    for (let k = 0; k < 4; k++) {
                                        const ly = -55 - k * 34 * lGrow;
                                        const lx = ey.lean * (0.4 + k * 0.18);
                                        ctx.save();
                                        ctx.translate(lx, ly);
                                        ctx.rotate(k % 2 === 0 ? -0.55 : -2.55);
                                        ctx.scale(lGrow, lGrow);
                                        drawLeafShape(ctx, 38, 15, P.plant, P.plantLight);
                                        ctx.restore();
                                    }
                                }
                            }
                            ctx.restore();
                        }
                    });

                    addLabel(74, 86, '芽眼 (塊莖的節與腋芽)', 88, 22, P.newTissue);
                    addLabel(-5, 138, '塊莖 (地下莖，儲存養分)', -85, 52, P.wall);
                    if (rootAmt > 0.25) {
                        addLabel(-48, 66, '幼芽基部長出不定根', -115, -22, P.tuber);
                    }
                    if (canopyAmt > 0.25) {
                        addLabel(35, -75, '新植株莖葉', 85, -25, P.plantLight);
                    }
                },

                // 6. 組織培養 - 蘭花 (Tissue Culture - Orchid)
                orchid(ctx, p, time) {
                    const s1 = ePhase(p, 0.05, 0.95); // Step 1 -> 2 (Explant into Callus/PLB)
                    const s2 = ePhase(p, 1.0, 2.0);   // Step 2 -> 3 (Hormone differentiation -> shoots & roots)
                    const s3 = ePhase(p, 2.0, 3.0);   // Step 3 -> 4 (Acclimatization -> Potted identical clones)

                    // Helper to draw a sterile Erlenmeyer / Culture Flask
                    const drawCultureFlask = (fx, fy, scale) => {
                        ctx.save();
                        ctx.translate(fx, fy);
                        ctx.scale(scale, scale);

                        // Agar medium inside bottom
                        ctx.beginPath();
                        ctx.moveTo(-72, 62);
                        ctx.lineTo(72, 62);
                        ctx.quadraticCurveTo(82, 92, 62, 102);
                        ctx.lineTo(-62, 102);
                        ctx.quadraticCurveTo(-82, 92, -72, 62);
                        ctx.closePath();
                        ctx.fillStyle = 'rgba(45, 212, 191, 0.38)';
                        ctx.fill();
                        ctx.strokeStyle = P.agar;
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Flask glass outline
                        ctx.beginPath();
                        ctx.moveTo(-26, -108);
                        ctx.lineTo(-26, -42);
                        ctx.lineTo(-78, 72);
                        ctx.quadraticCurveTo(-86, 106, -58, 106);
                        ctx.lineTo(58, 106);
                        ctx.quadraticCurveTo(86, 106, 78, 72);
                        ctx.lineTo(26, -42);
                        ctx.lineTo(26, -108);
                        ctx.closePath();
                        ctx.fillStyle = 'rgba(186, 230, 253, 0.08)';
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(186, 230, 253, 0.65)';
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        // Sterile cotton/foil cap
                        drawRoundedRectPath(ctx, -30, -126, 60, 22, 8);
                        ctx.fillStyle = '#94a3b8';
                        ctx.fill();
                        ctx.strokeStyle = '#cbd5e1';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        ctx.restore();
                    };

                    const drawOrchidFlower = (ox, oy, scale, col = '#e879f9') => {
                        ctx.save();
                        ctx.translate(ox, oy);
                        ctx.scale(scale, scale);
                        // Petals
                        const pAngs = [-0.9, 0.9, -2.1, 2.1, 0];
                        pAngs.forEach((a, i) => {
                            ctx.save();
                            ctx.rotate(a);
                            ctx.fillStyle = col;
                            ctx.beginPath();
                            ctx.ellipse(0, -14, i === 4 ? 7 : 9, 14, 0, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        });
                        // Lip (labellum)
                        ctx.fillStyle = P.dnaDark;
                        ctx.beginPath();
                        ctx.ellipse(0, 7, 7, 9, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = P.newTissue;
                        ctx.beginPath();
                        ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    };

                    if (p < 0.75) {
                        // Stage 1: Parent Orchid + Meristem excision
                        const fadeOut = 1 - phase(p, 0.45, 0.75);
                        ctx.save();
                        ctx.globalAlpha = fadeOut;

                        // Parent orchid pot on left
                        drawRoundedRectPath(ctx, -230, 80, 110, 82, 10);
                        ctx.fillStyle = '#78350f';
                        ctx.fill();
                        ctx.strokeStyle = '#b45309';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();

                        // Leaves
                        [-1, 1].forEach((d) => {
                            ctx.save();
                            ctx.translate(-175, 80);
                            ctx.rotate(d * 0.55 - Math.PI / 2);
                            drawLeafShape(ctx, 88, 22, P.plant, P.plantLight);
                            ctx.restore();
                        });
                        // Flower spike
                        ctx.strokeStyle = P.plantDark;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(-175, 80);
                        ctx.quadraticCurveTo(-165, -20, -125, -75);
                        ctx.stroke();
                        drawOrchidFlower(-125, -75, 1.0);
                        drawOrchidFlower(-152, -32, 0.85);

                        // Zoomed Meristem Tip on right
                        ctx.strokeStyle = 'rgba(45, 212, 191, 0.5)';
                        ctx.setLineDash([5, 5]);
                        ctx.beginPath();
                        ctx.arc(-175, 65, 22, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // Magnified circle
                        ctx.beginPath();
                        ctx.arc(105, -10, 92, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                        ctx.fill();
                        ctx.strokeStyle = P.agar;
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        // Shoot apical meristem inside circle
                        ctx.fillStyle = P.plant;
                        ctx.beginPath();
                        ctx.moveTo(65, 45);
                        ctx.quadraticCurveTo(105, -55, 145, 45);
                        ctx.closePath();
                        ctx.fill();
                        // Meristem dome (bright yellow-green)
                        ctx.fillStyle = P.newTissue;
                        ctx.beginPath();
                        ctx.arc(105, -20, 20, 0, Math.PI * 2);
                        ctx.fill();

                        // Scalpel cut line
                        drawCutLine(ctx, 55, -2, 155, -2, time, 0);
                        ctx.restore();

                        addLabel(-175, 65, '取親代莖頂分生組織', -85, -45, P.plantLight);
                        addLabel(105, -25, '生長點 (無病毒培植體)', 85, -62, P.newTissue);
                        addLabel(105, 52, '表面消毒滅菌', 75, 45, P.agar);
                    }

                    if (p >= 0.4 && p < 2.65) {
                        // Stage 2 & 3: Sterile Culture Flask (Callus -> Organogenesis)
                        const fadeIn = phase(p, 0.4, 0.75);
                        const fadeOut = 1 - phase(p, 2.35, 2.65);
                        ctx.save();
                        ctx.globalAlpha = fadeIn * fadeOut;

                        drawCultureFlask(-35, 12, 1.25);

                        // Contents inside agar (around y = 86)
                        if (s2 < 0.25) {
                            // Callus / PLB proliferation
                            const blobs = Math.floor(lerp(1, 9, s1));
                            for (let i = 0; i < blobs; i++) {
                                const bx = -35 + ((i % 3) - 1) * 24 + Math.sin(i * 2.1) * 6;
                                const by = 84 - Math.floor(i / 3) * 12;
                                ctx.fillStyle = i % 2 === 0 ? P.newTissue : P.plantLight;
                                ctx.beginPath();
                                ctx.arc(bx, by, lerp(9, 13, s1), 0, Math.PI * 2);
                                ctx.fill();
                            }
                            addLabel(-35, 72, '癒傷組織 / 擬原球體 (PLB)', 145, -25, P.newTissue);
                        } else {
                            // Differentiating multiple plantlets inside flask!
                            const plantX = [-72, -35, 2];
                            plantX.forEach((px) => {
                                const g = s2;
                                // Roots in agar
                                ctx.strokeStyle = '#f8fafc';
                                ctx.lineWidth = 2.2;
                                [-8, 0, 8].forEach((rx) => {
                                    ctx.beginPath();
                                    ctx.moveTo(px, 86);
                                    ctx.lineTo(px + rx * g, 86 + 26 * g);
                                    ctx.stroke();
                                });
                                // Shoots & leaves
                                [-0.5, 0.5, 0].forEach((ang, li) => {
                                    ctx.save();
                                    ctx.translate(px, 86);
                                    ctx.rotate(ang - Math.PI / 2);
                                    ctx.scale(g * 0.55, g * 0.55);
                                    drawLeafShape(ctx, li === 2 ? 78 : 65, 16, P.plant, P.plantLight);
                                    ctx.restore();
                                });
                            });
                            addLabel(-25, 42, '無菌小苗 (分化出芽與根)', 155, -28, P.plantLight);
                        }

                        addLabel(-35, 118, '無菌洋菜培養基 (含養分與激素)', -155, 48, P.agar);

                        // Hormone Ratio Indicator Card in world space on the right
                        ctx.save();
                        drawRoundedRectPath(ctx, 130, -90, 175, 115, 12);
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(45, 212, 191, 0.45)';
                        ctx.lineWidth = 1.8;
                        ctx.stroke();

                        ctx.fillStyle = '#e2e8f0';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.fillText('植物激素比例調控', 144, -68);

                        // Cytokinin bar
                        const cytoRatio = s2 < 0.25 ? 0.55 : 0.82;
                        const auxinRatio = s2 < 0.25 ? 0.55 : 0.68;
                        ctx.fillStyle = '#94a3b8';
                        ctx.font = '11px sans-serif';
                        ctx.fillText('細胞分裂素 (促長芽)', 144, -44);
                        ctx.fillStyle = 'rgba(148,163,184,0.2)';
                        ctx.fillRect(144, -36, 145, 8);
                        ctx.fillStyle = P.plant;
                        ctx.fillRect(144, -36, 145 * cytoRatio, 8);

                        ctx.fillStyle = '#94a3b8';
                        ctx.fillText('生長素 (促發根)', 144, -8);
                        ctx.fillStyle = 'rgba(148,163,184,0.2)';
                        ctx.fillRect(144, 0, 145, 8);
                        ctx.fillStyle = P.dna;
                        ctx.fillRect(144, 0, 145 * auxinRatio, 8);
                        ctx.restore();

                        ctx.restore();
                    }

                    if (p >= 2.35) {
                        // Stage 4: Acclimatization & Identical Cloned Orchids in Pots!
                        const fadeIn = phase(p, 2.35, 2.75);
                        ctx.save();
                        ctx.globalAlpha = fadeIn;

                        const pots = [-190, 0, 190];
                        pots.forEach((px, idx) => {
                            const g = clamp(s3 * 1.15, 0.35, 1);
                            // Pot
                            drawRoundedRectPath(ctx, px - 48, 86, 96, 72, 10);
                            ctx.fillStyle = '#78350f';
                            ctx.fill();
                            ctx.strokeStyle = '#d97706';
                            ctx.lineWidth = 2.5;
                            ctx.stroke();

                            // Sphagnum moss top
                            ctx.fillStyle = '#a16207';
                            ctx.beginPath();
                            ctx.ellipse(px, 86, 46, 10, 0, 0, Math.PI * 2);
                            ctx.fill();

                            // Identical Orchid leaves
                            [-0.65, 0.65, -0.25, 0.25].forEach((ang) => {
                                ctx.save();
                                ctx.translate(px, 84);
                                ctx.rotate(ang - Math.PI / 2);
                                ctx.scale(g, g);
                                drawLeafShape(ctx, 72, 18, P.plant, P.plantLight);
                                ctx.restore();
                            });

                            // Flower spike
                            ctx.strokeStyle = P.plantDark;
                            ctx.lineWidth = 3.5;
                            ctx.beginPath();
                            ctx.moveTo(px, 84);
                            ctx.quadraticCurveTo(px + 8, 5, px + 24, -48 * g);
                            ctx.stroke();

                            if (g > 0.65) {
                                drawOrchidFlower(px + 24, -48 * g, 0.82 * g);
                            }
                        });

                        ctx.restore();

                        addLabel(-190, 115, '水苔盆栽馴化移植', -25, 62, P.root);
                        addLabel(0, -52, '大量基因完全相同的蘭花複製株', 0, -48, P.dna);
                        addLabel(190, 45, '優良性狀一致呈現', 25, 65, P.plantLight);
                    }
                }
            };

            // ==========================================
            // 5. MAIN RENDER LOOP & SCREEN-SPACE LABELS
            // ==========================================
            const canvas = document.getElementById('simCanvas');
            const ctx = canvas.getContext('2d');
            const stageWrap = document.getElementById('stageWrap');

            function resizeCanvas() {
                const rect = stageWrap.getBoundingClientRect();
                state.viewW = Math.max(100, rect.width);
                state.viewH = Math.max(100, rect.height);
                state.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                canvas.width = Math.floor(state.viewW * state.dpr);
                canvas.height = Math.floor(state.viewH * state.dpr);
            }

            function drawBackgroundGrid() {
                ctx.save();
                ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
                ctx.clearRect(0, 0, state.viewW, state.viewH);

                // Subtle microscopy grid in world space
                const s = getBaseScale() * state.camZoom;
                const step = 48 * s;
                if (step > 12) {
                    const offsetX = (state.viewW * 0.5 - state.camX * s) % step;
                    const offsetY = (state.viewH * 0.5 - state.camY * s) % step;
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.055)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let x = offsetX; x < state.viewW; x += step) {
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, state.viewH);
                    }
                    for (let y = offsetY; y < state.viewH; y += step) {
                        ctx.moveTo(0, y);
                        ctx.lineTo(state.viewW, y);
                    }
                    ctx.stroke();
                }
                ctx.restore();
            }

            function drawScreenLabels() {
                if (!state.labelsVisible || frameLabels.length === 0) return;
                ctx.save();
                ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

                const fontSize = Math.round(clamp(11.5 * Math.sqrt(getBaseScale() + 0.15), 11, 13.5));
                ctx.font = `600 ${fontSize}px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif`;

                for (const lbl of frameLabels) {
                    const anchor = worldToScreen(lbl.wx, lbl.wy);
                    const textPt = worldToScreen(lbl.wx + lbl.dx, lbl.wy + lbl.dy);

                    // Skip if far off screen
                    if (
                        textPt.x < -120 || textPt.x > state.viewW + 120 ||
                        textPt.y < -60 || textPt.y > state.viewH + 60
                    ) {
                        continue;
                    }

                    // Leader line
                    ctx.strokeStyle = lbl.color;
                    ctx.globalAlpha = 0.72;
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.moveTo(anchor.x, anchor.y);
                    ctx.lineTo(textPt.x, textPt.y);
                    ctx.stroke();

                    // Anchor dot
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = lbl.color;
                    ctx.beginPath();
                    ctx.arc(anchor.x, anchor.y, 3.6, 0, Math.PI * 2);
                    ctx.fill();

                    // Pill badge
                    const tw = ctx.measureText(lbl.text).width;
                    const padX = 8;
                    const boxW = tw + padX * 2;
                    const boxH = fontSize + 10;
                    const bx = clamp(textPt.x - boxW / 2, 6, state.viewW - boxW - 6);
                    const by = clamp(textPt.y - boxH / 2, 6, state.viewH - boxH - 6);

                    drawRoundedRectPath(ctx, bx, by, boxW, boxH, 7);
                    ctx.fillStyle = 'rgba(9, 17, 30, 0.88)';
                    ctx.fill();
                    ctx.strokeStyle = lbl.color;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();

                    ctx.fillStyle = '#f8fafc';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(lbl.text, bx + boxW / 2, by + boxH / 2 + 0.5);
                }

                ctx.restore();
            }

            function updateAndDrawParticles(dt) {
                if (state.burstParticles.length === 0 && state.slashFlash <= 0) return;

                for (let i = state.burstParticles.length - 1; i >= 0; i--) {
                    const pt = state.burstParticles[i];
                    pt.x += pt.vx * dt;
                    pt.y += pt.vy * dt;
                    pt.vy += 40 * dt;
                    pt.life -= dt;
                    if (pt.life <= 0) {
                        state.burstParticles.splice(i, 1);
                    } else {
                        ctx.save();
                        ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
                        ctx.fillStyle = pt.color;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                if (state.slashFlash > 0) {
                    state.slashFlash = Math.max(0, state.slashFlash - dt * 3);
                    ctx.save();
                    ctx.strokeStyle = `rgba(253, 224, 71, ${state.slashFlash})`;
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(-120, -20);
                    ctx.lineTo(120, 20);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            let lastTs = performance.now();
            function renderLoop(now) {
                const dt = Math.min((now - lastTs) / 1000, 0.05);
                lastTs = now;
                const timeSec = now / 1000;

                // Playback & step tweening
                if (state.isPlaying) {
                    if (state.playPauseTimer > 0) {
                        state.playPauseTimer -= dt;
                    } else {
                        const prevStep = Math.floor(state.animProgress + 0.0001);
                        state.animProgress += dt * 0.52;
                        const nextStep = Math.floor(state.animProgress + 0.0001);
                        if (state.animProgress >= 3) {
                            state.animProgress = 3;
                            state.isPlaying = false;
                            syncTimelineUI();
                        } else if (nextStep > prevStep) {
                            state.animProgress = nextStep;
                            state.playPauseTimer = 1.05; // Brief pause at each biological step
                        }
                        syncTimelineUI();
                    }
                } else if (state.isTweening) {
                    const diff = state.targetProgress - state.animProgress;
                    if (Math.abs(diff) < 0.004) {
                        state.animProgress = state.targetProgress;
                        state.isTweening = false;
                    } else {
                        state.animProgress += diff * Math.min(1, dt * 8.5);
                    }
                    syncTimelineUI();
                }

                drawBackgroundGrid();

                // World Transform
                frameLabels = [];
                const s = getBaseScale() * state.camZoom;
                ctx.save();
                ctx.setTransform(
                    s * state.dpr, 0,
                    0, s * state.dpr,
                    (state.viewW * 0.5 - state.camX * s) * state.dpr,
                    (state.viewH * 0.5 - state.camY * s) * state.dpr
                );

                const org = getActiveOrg();
                const drawer = DRAWERS[org.id];
                if (drawer) {
                    drawer(ctx, state.animProgress, timeSec);
                }
                updateAndDrawParticles(dt);
                ctx.restore();

                drawScreenLabels();
                requestAnimationFrame(renderLoop);
            }

            // ==========================================
            // 6. ZOOM, PAN & TOUCH GESTURE ENGINE
            // ==========================================
            const pointers = new Map();
            let lastPinchDist = null;
            let lastPinchMid = null;
            let tapStart = null;

            function setZoomAtScreenPoint(newZoom, sx, sy) {
                const clamped = clamp(newZoom, 0.45, 4.0);
                const before = screenToWorld(sx, sy);
                state.camZoom = clamped;
                const s = getBaseScale() * state.camZoom;
                state.camX = before.x - (sx - state.viewW * 0.5) / s;
                state.camY = before.y - (sy - state.viewH * 0.5) / s;
                updateZoomUI();
            }

            function resetCamera() {
                state.camX = 0;
                state.camY = 0;
                state.camZoom = 1.0;
                updateZoomUI();
            }

            function updateZoomUI() {
                document.getElementById('zoomReadout').textContent = `${Math.round(state.camZoom * 100)}%`;
            }

            canvas.addEventListener('pointerdown', (e) => {
                canvas.setPointerCapture(e.pointerId);
                const rect = canvas.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;
                pointers.set(e.pointerId, { x: sx, y: sy });

                if (pointers.size === 1) {
                    tapStart = { x: sx, y: sy, time: performance.now() };
                    lastPinchDist = null;
                    lastPinchMid = null;
                } else if (pointers.size === 2) {
                    tapStart = null;
                    const pts = Array.from(pointers.values());
                    lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    lastPinchMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
                }
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!pointers.has(e.pointerId)) return;
                const rect = canvas.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;
                const prev = pointers.get(e.pointerId);
                const dx = sx - prev.x;
                const dy = sy - prev.y;
                pointers.set(e.pointerId, { x: sx, y: sy });

                if (pointers.size === 1) {
                    const s = getBaseScale() * state.camZoom;
                    state.camX -= dx / s;
                    state.camY -= dy / s;
                    if (tapStart && Math.hypot(sx - tapStart.x, sy - tapStart.y) > 8) {
                        tapStart = null;
                    }
                } else if (pointers.size === 2) {
                    const pts = Array.from(pointers.values());
                    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
                    if (lastPinchDist && lastPinchMid && dist > 10) {
                        const worldBefore = screenToWorld(lastPinchMid.x, lastPinchMid.y);
                        state.camZoom = clamp(state.camZoom * (dist / lastPinchDist), 0.45, 4.0);
                        const s = getBaseScale() * state.camZoom;
                        state.camX = worldBefore.x - (mid.x - state.viewW * 0.5) / s;
                        state.camY = worldBefore.y - (mid.y - state.viewH * 0.5) / s;
                        updateZoomUI();
                    }
                    lastPinchDist = dist;
                    lastPinchMid = mid;
                }
            });

            function handlePointerEnd(e) {
                if (pointers.size === 1 && tapStart && (performance.now() - tapStart.time) < 280) {
                    handleCanvasTap(tapStart.x, tapStart.y);
                }
                pointers.delete(e.pointerId);
                if (pointers.size < 2) {
                    lastPinchDist = null;
                    lastPinchMid = null;
                }
                tapStart = null;
            }

            canvas.addEventListener('pointerup', handlePointerEnd);
            canvas.addEventListener('pointercancel', handlePointerEnd);

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;
                const factor = e.deltaY < 0 ? 1.12 : 0.89;
                setZoomAtScreenPoint(state.camZoom * factor, sx, sy);
            }, { passive: false });

            function handleCanvasTap(sx, sy) {
                const org = getActiveOrg();
                const w = screenToWorld(sx, sy);

                // Fragmentation interactive cut
                if (['planaria', 'spirogyra', 'starfish'].includes(org.id) && state.animProgress < 0.8) {
                    triggerInteractiveAction();
                    return;
                }
                // Spore interactive puff
                if (['rhizopus', 'penicillium'].includes(org.id)) {
                    spawnSporePuff(w.x, w.y, org.id === 'rhizopus' ? P.spore : P.plant);
                    if (state.animProgress < 1.5) {
                        tweenToStep(2);
                    }
                }
            }

            function spawnSporePuff(wx, wy, col) {
                for (let i = 0; i < 18; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const spd = 30 + Math.random() * 110;
                    state.burstParticles.push({
                        x: wx,
                        y: wy,
                        vx: Math.cos(ang) * spd + 35,
                        vy: Math.sin(ang) * spd - 35,
                        r: 2.8 + Math.random() * 2.5,
                        color: col,
                        life: 1.4,
                        maxLife: 1.4
                    });
                }
            }

            function triggerInteractiveAction() {
                const org = getActiveOrg();
                if (['planaria', 'spirogyra', 'starfish'].includes(org.id)) {
                    state.slashFlash = 1.0;
                    tweenToStep(1);
                } else if (['rhizopus', 'penicillium'].includes(org.id)) {
                    spawnSporePuff(-150, -80, org.id === 'rhizopus' ? P.spore : P.plant);
                    tweenToStep(2);
                }
            }

            // ==========================================
            // 7. STEP-BY-STEP CONTROLS & UI SYNC
            // ==========================================
            const tabsBar = document.getElementById('tabsBar');
            const subBar = document.getElementById('subBar');
            const stepDotsEl = document.getElementById('stepDots');
            const timelineSlider = document.getElementById('timelineSlider');
            const btnPlay = document.getElementById('btnPlay');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnReset = document.getElementById('btnReset');
            const btnLabels = document.getElementById('btnLabels');
            const btnLegend = document.getElementById('btnLegend');
            const legendPopover = document.getElementById('legendPopover');
            const interactiveCta = document.getElementById('interactiveCta');

            function tweenToStep(stepIdx) {
                state.isPlaying = false;
                state.targetProgress = clamp(stepIdx, 0, 3);
                state.isTweening = true;
                syncTimelineUI();
            }

            function renderTabs() {
                tabsBar.innerHTML = '';
                CATEGORIES.forEach((cat, idx) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `cat-tab ${idx === state.catIdx ? 'active' : ''}`;
                    btn.innerHTML = `<span>${cat.icon}</span><span>${cat.name}</span>`;
                    btn.addEventListener('click', () => {
                        if (state.catIdx === idx) return;
                        state.catIdx = idx;
                        state.orgIdx = 0;
                        resetSimulationState();
                        renderTabs();
                        renderSubBar();
                        syncTimelineUI();
                    });
                    tabsBar.appendChild(btn);
                });
            }

            function renderSubBar() {
                subBar.innerHTML = '<span class="sub-label">代表生物：</span>';
                const orgs = getActiveCat().organisms;
                orgs.forEach((org, idx) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `org-pill ${idx === state.orgIdx ? 'active' : ''}`;
                    btn.textContent = org.name;
                    btn.addEventListener('click', () => {
                        if (state.orgIdx === idx) return;
                        state.orgIdx = idx;
                        resetSimulationState();
                        renderSubBar();
                        syncTimelineUI();
                    });
                    subBar.appendChild(btn);
                });
            }

            function renderStepDots() {
                stepDotsEl.innerHTML = '';
                for (let i = 0; i < 4; i++) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'step-dot-btn';
                    btn.textContent = `${i + 1}`;
                    btn.title = `跳至步驟 ${i + 1}`;
                    btn.addEventListener('click', () => tweenToStep(i));
                    stepDotsEl.appendChild(btn);
                }
            }

            function resetSimulationState() {
                state.isPlaying = false;
                state.isTweening = false;
                state.animProgress = 0;
                state.targetProgress = 0;
                state.burstParticles = [];
                state.slashFlash = 0;
                resetCamera();
            }

            function syncTimelineUI() {
                const org = getActiveOrg();
                const p = state.animProgress;
                // Determine nearest/active step index cleanly
                const stepIdx = clamp(Math.round(p), 0, 3);
                const stepData = org.steps[stepIdx];

                document.getElementById('geneticNote').textContent = org.badge;
                document.getElementById('stepBadge').textContent = `步驟 ${stepIdx + 1} / 4`;
                document.getElementById('stepTitle').textContent = stepData.title;
                document.getElementById('stepDesc').textContent = stepData.desc;

                timelineSlider.value = p.toFixed(3);

                // Dots styling
                const dots = stepDotsEl.querySelectorAll('.step-dot-btn');
                dots.forEach((d, i) => {
                    d.classList.toggle('active', i === stepIdx);
                    d.classList.toggle('passed', i < stepIdx);
                });

                // Buttons
                btnPrev.disabled = p <= 0.02;
                btnNext.disabled = p >= 2.98;
                btnPlay.classList.toggle('playing', state.isPlaying);
                btnPlay.textContent = state.isPlaying ? '⏸ 暫停' : (p >= 2.98 ? '↺ 重播' : '▶ 播放');

                // Interactive CTA pill
                if (org.cta && (
                    (['planaria', 'spirogyra', 'starfish'].includes(org.id) && p < 0.8) ||
                    (['rhizopus', 'penicillium'].includes(org.id) && p >= 0.8 && p < 2.2)
                )) {
                    interactiveCta.textContent = org.cta;
                    interactiveCta.classList.remove('hidden');
                } else {
                    interactiveCta.classList.add('hidden');
                }
            }

            // Wire controls
            interactiveCta.addEventListener('click', triggerInteractiveAction);

            timelineSlider.addEventListener('input', (e) => {
                state.isPlaying = false;
                state.isTweening = false;
                state.animProgress = parseFloat(e.target.value);
                syncTimelineUI();
            });

            btnPrev.addEventListener('click', () => {
                const cur = state.isTweening ? state.targetProgress : state.animProgress;
                const target = Math.max(0, Math.ceil(cur - 0.05) - 1);
                tweenToStep(target);
            });

            btnNext.addEventListener('click', () => {
                const cur = state.isTweening ? state.targetProgress : state.animProgress;
                const target = Math.min(3, Math.floor(cur + 0.05) + 1);
                tweenToStep(target);
            });

            btnPlay.addEventListener('click', () => {
                if (state.isPlaying) {
                    state.isPlaying = false;
                } else {
                    if (state.animProgress >= 2.98) {
                        state.animProgress = 0;
                    }
                    state.isTweening = false;
                    state.playPauseTimer = 0.25;
                    state.isPlaying = true;
                }
                syncTimelineUI();
            });

            btnReset.addEventListener('click', () => {
                state.isPlaying = false;
                tweenToStep(0);
            });

            btnLabels.addEventListener('click', () => {
                state.labelsVisible = !state.labelsVisible;
                btnLabels.classList.toggle('active', state.labelsVisible);
                btnLabels.textContent = state.labelsVisible ? '🏷️ 標籤：開' : '🏷️ 標籤：關';
            });

            btnLegend.addEventListener('click', (e) => {
                e.stopPropagation();
                const open = legendPopover.classList.toggle('open');
                btnLegend.classList.toggle('active', open);
            });

            document.addEventListener('click', (e) => {
                if (legendPopover.classList.contains('open') && !legendPopover.contains(e.target) && e.target !== btnLegend) {
                    legendPopover.classList.remove('open');
                    btnLegend.classList.remove('active');
                }
            });

            document.getElementById('stepHeader').addEventListener('click', () => {
                state.collapsed = !state.collapsed;
                const card = document.getElementById('stepCard');
                card.classList.toggle('collapsed', state.collapsed);
                document.getElementById('btnCollapse').textContent = state.collapsed ? '▸ 展開' : '▾ 收合';
                requestAnimationFrame(resizeCanvas);
            });

            document.getElementById('btnZoomIn').addEventListener('click', () => {
                setZoomAtScreenPoint(state.camZoom * 1.25, state.viewW * 0.5, state.viewH * 0.5);
            });
            document.getElementById('btnZoomOut').addEventListener('click', () => {
                setZoomAtScreenPoint(state.camZoom * 0.8, state.viewW * 0.5, state.viewH * 0.5);
            });
            document.getElementById('btnZoomReset').addEventListener('click', resetCamera);

            window.addEventListener('resize', resizeCanvas);

            // Initialize
            renderTabs();
            renderSubBar();
            renderStepDots();
            resizeCanvas();
            updateZoomUI();
            syncTimelineUI();
            requestAnimationFrame(renderLoop);
        })();
    </script>
</body>

</html>
