<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>無性生殖互動動態模擬器</title>
    <style>
        :root {
            --bg-deep: #09111e;
            --bg-panel: rgba(15, 23, 42, 0.88);
            --bg-card: rgba(30, 41, 59, 0.85);
            --border-subtle: rgba(148, 163, 184, 0.2);
            --border-active: rgba(45, 212, 191, 0.7);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #2dd4bf;
            --accent-glow: rgba(45, 212, 191, 0.25);

            /* Consistent Biological Semantic Palette */
            --bio-dna: #f472b6;
            --bio-cyto: #38bdf8;
            --bio-wall: #fbbf24;
            --bio-plant: #22c55e;
            --bio-new: #fde047;
            --bio-spore: #c084fc;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            background: radial-gradient(circle at 50% 35%, #11223a 0%, #09111e 75%);
        }

        /* Top Header */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(9, 17, 30, 0.92);
            border-bottom: 1px solid var(--border-subtle);
            gap: 8px;
            flex-shrink: 0;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .brand-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(45, 212, 191, 0.25), rgba(56, 189, 248, 0.25));
            border: 1px solid var(--border-active);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 34px;
            padding: 0 11px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
        }

        .btn-pill:hover {
            border-color: rgba(148, 163, 184, 0.5);
            background: rgba(51, 65, 85, 0.9);
        }

        .btn-pill.active {
            border-color: var(--accent);
            background: rgba(45, 212, 191, 0.18);
            color: #99f6e4;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Main Category Tabs */
        .tabs-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            background: rgba(15, 23, 42, 0.78);
            border-bottom: 1px solid var(--border-subtle);
            overflow-x: auto;
            overflow-y: hidden;
            touch-action: pan-x;
            scrollbar-width: none;
            flex-shrink: 0;
            z-index: 19;
        }

        .tabs-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-tab {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 13px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: rgba(30, 41, 59, 0.55);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .cat-tab:hover {
            color: var(--text-main);
            background: rgba(51, 65, 85, 0.7);
        }

        .cat-tab.active {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(45, 212, 191, 0.24), rgba(56, 189, 248, 0.18));
            border-color: var(--border-active);
            box-shadow: 0 2px 10px rgba(45, 212, 191, 0.15);
        }

        /* Organism Sub-selector Bar */
        .sub-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.52);
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            overflow-x: auto;
            touch-action: pan-x;
            scrollbar-width: none;
            flex-shrink: 0;
            z-index: 18;
        }

        .sub-bar::-webkit-scrollbar {
            display: none;
        }

        .sub-label {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-right: 2px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .org-pill {
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            background: rgba(15, 23, 42, 0.65);
            color: var(--text-muted);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s ease;
            flex-shrink: 0;
        }

        .org-pill:hover {
            color: var(--text-main);
        }

        .org-pill.active {
            background: var(--accent);
            color: #042f2e;
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Viewport Stage */
        .stage-wrap {
            position: relative;
            flex: 1;
            min-height: 180px;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }

        .stage-wrap:active {
            cursor: grabbing;
        }

        canvas#simCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Stage Overlays */
        .hud-top-left {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
            max-width: calc(100% - 140px);
            z-index: 10;
        }

        .bio-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            font-size: 12px;
            color: #e2e8f0;
            width: fit-content;
        }

        .bio-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            flex-shrink: 0;
        }

        .interactive-cta {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(250, 204, 21, 0.16);
            border: 1px solid rgba(250, 204, 21, 0.55);
            color: #fef08a;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: fit-content;
            backdrop-filter: blur(6px);
            animation: pulseGlow 2s infinite;
        }

        .interactive-cta.hidden {
            display: none;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.25);
            }

            50% {
                box-shadow: 0 0 12px 2px rgba(250, 204, 21, 0.35);
            }
        }

        .hud-zoom {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }

        .zoom-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-main);
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s;
        }

        .zoom-btn:hover {
            background: rgba(30, 41, 59, 0.95);
        }

        .zoom-btn:active {
            transform: scale(0.95);
        }

        .zoom-readout {
            font-size: 10.5px;
            text-align: center;
            color: var(--text-muted);
            background: rgba(15, 23, 42, 0.72);
            border-radius: 6px;
            padding: 2px 4px;
            pointer-events: none;
        }

        .touch-hint {
            position: absolute;
            bottom: 8px;
            right: 10px;
            font-size: 11px;
            color: rgba(148, 163, 184, 0.72);
            background: rgba(15, 23, 42, 0.55);
            padding: 3px 8px;
            border-radius: 6px;
            pointer-events: none;
        }

        /* Legend Popover */
        .legend-popover {
            position: absolute;
            top: 52px;
            right: 12px;
            width: 240px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-active);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
            z-index: 50;
            display: none;
        }

        .legend-popover.open {
            display: block;
        }

        .legend-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        .legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* Bottom Step-by-Step Control Dock */
        .control-dock {
            background: rgba(15, 23, 42, 0.94);
            border-top: 1px solid var(--border-subtle);
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            z-index: 20;
        }

        .step-info-card {
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 10px;
            padding: 8px 11px;
            transition: all 0.2s ease;
        }

        .step-info-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
        }

        .step-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .step-badge {
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(45, 212, 191, 0.18);
            border: 1px solid rgba(45, 212, 191, 0.45);
            color: #5eead4;
            font-size: 11.5px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .step-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .collapse-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            padding: 2px 6px;
            flex-shrink: 0;
        }

        .step-desc {
            margin-top: 5px;
            font-size: 12.5px;
            line-height: 1.48;
            color: #cbd5e1;
        }

        .step-info-card.collapsed .step-desc {
            display: none;
        }

        /* Timeline & Transport */
        .timeline-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-dots {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .step-dot-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: rgba(30, 41, 59, 0.8);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.16s;
        }

        .step-dot-btn.active {
            background: var(--accent);
            color: #042f2e;
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .step-dot-btn.passed {
            border-color: rgba(45, 212, 191, 0.45);
            color: #99f6e4;
        }

        .scrubber-wrap {
            flex: 1;
            display: flex;
            align-items: center;
        }

        input[type="range"].timeline-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.25);
            outline: none;
            cursor: pointer;
        }

        input[type="range"].timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #0f172a;
            box-shadow: 0 0 10px var(--accent-glow);
            cursor: pointer;
        }

        input[type="range"].timeline-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #0f172a;
            cursor: pointer;
        }

        .transport-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .transport-btn {
            flex: 1;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: rgba(30, 41, 59, 0.85);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.16s;
        }

        .transport-btn:hover:not(:disabled) {
            background: rgba(51, 65, 85, 0.95);
            border-color: rgba(148, 163, 184, 0.45);
        }

        .transport-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .transport-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .transport-btn.primary {
            flex: 1.35;
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            border-color: #2dd4bf;
            color: #ffffff;
        }

        .transport-btn.primary.playing {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-color: #fbbf24;
        }

        @media (max-width: 600px) {
            .brand-title {
                font-size: 14px;
            }

            .btn-pill {
                padding: 0 9px;
                font-size: 12px;
                height: 32px;
            }

            .cat-tab {
                padding: 6px 10px;
                font-size: 12.5px;
            }

            .step-desc {
                font-size: 12px;
            }

            .transport-btn {
                height: 36px;
                font-size: 12.5px;
            }

            .touch-hint {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <!-- Top Header -->
        <header class="top-header">
            <div class="brand">
                <div class="brand-icon">🧬</div>
                <div class="brand-title">無性生殖互動模擬器</div>
            </div>
            <div class="header-actions">
                <button id="btnLegend" class="btn-pill" type="button" title="顏色圖例">🎨 圖例</button>
                <button id="btnLabels" class="btn-pill active" type="button" title="顯示或隱藏文字標籤">🏷️ 標籤：開</button>
            </div>
        </header>

        <!-- Legend Popover -->
        <div id="legendPopover" class="legend-popover">
            <div class="legend-title">全分頁一致視覺色碼</div>
            <div class="legend-item"><span class="legend-swatch" style="background: var(--bio-dna);"></span>細胞核 / 遺傳物質
                (DNA)</div>
            <div class="legend-item"><span class="legend-swatch" style="background: var(--bio-cyto);"></span>細胞質 /
                動物・原生生物體</div>
            <div class="legend-item"><span class="legend-swatch" style="background: var(--bio-wall);"></span>細胞壁 (細菌・真菌)
            </div>
            <div class="legend-item"><span class="legend-swatch" style="background: var(--bio-plant);"></span>植物營養器官 /
                葉綠體</div>
            <div class="legend-item"><span class="legend-swatch" style="background: var(--bio-new);"></span>新生組織 / 芽體 /
                再生芽基</div>
            <div class="legend-item"><span class="legend-swatch" style="background: var(--bio-spore);"></span>孢子 / 生殖單元
            </div>
        </div>

        <!-- Category Tabs -->
        <nav id="tabsBar" class="tabs-bar" aria-label="無性生殖分類"></nav>

        <!-- Organism Selector -->
        <div id="subBar" class="sub-bar" aria-label="代表生物"></div>

        <!-- Interactive Viewport -->
        <main id="stageWrap" class="stage-wrap">
            <canvas id="simCanvas"></canvas>

            <div class="hud-top-left">
                <div class="bio-badge">
                    <span class="bio-dot"></span>
                    <span id="geneticNote">子代遺傳物質與親代完全相同</span>
                </div>
                <button id="interactiveCta" class="interactive-cta hidden" type="button"></button>
            </div>

            <div class="hud-zoom">
                <button id="btnZoomIn" class="zoom-btn" type="button" aria-label="放大">＋</button>
                <div id="zoomReadout" class="zoom-readout">100%</div>
                <button id="btnZoomOut" class="zoom-btn" type="button" aria-label="縮小">－</button>
                <button id="btnZoomReset" class="zoom-btn" type="button" aria-label="重置視角" title="重置視角">⌖</button>
            </div>

            <div class="touch-hint">拖曳移動 • 滾輪 / 雙指縮放</div>
        </main>

        <!-- Bottom Step-by-Step Controls -->
        <footer class="control-dock">
            <div id="stepCard" class="step-info-card">
                <div id="stepHeader" class="step-info-header">
                    <div class="step-title-wrap">
                        <span id="stepBadge" class="step-badge">步驟 1 / 4</span>
                        <span id="stepTitle" class="step-title">親代準備</span>
                    </div>
                    <button id="btnCollapse" class="collapse-btn" type="button">▾ 收合</button>
                </div>
                <div id="stepDesc" class="step-desc"></div>
            </div>

            <div class="timeline-row">
                <div id="stepDots" class="step-dots"></div>
                <div class="scrubber-wrap">
                    <input id="timelineSlider" class="timeline-slider" type="range" min="0" max="3" step="0.005"
                        value="0" aria-label="生殖流程進度" />
                </div>
            </div>

            <div class="transport-row">
                <button id="btnReset" class="transport-btn" type="button">↺ 重設</button>
                <button id="btnPrev" class="transport-btn" type="button">◀ 上一步</button>
                <button id="btnPlay" class="transport-btn primary" type="button">▶ 播放</button>
                <button id="btnNext" class="transport-btn" type="button">下一步 ▶</button>
            </div>
        </footer>
    </div>

    <script>
        (() => {
            'use strict';

            // ==========================================
            // 1. UNIFIED VISUAL PALETTE & BIOLOGY DATA
            // ==========================================
            const P = {
                dna: '#f472b6',
                dnaDark: '#db2777',
                cyto: '#38bdf8',
                cytoDark: '#0284c7',
                membrane: '#7dd3fc',
                wall: '#fbbf24',
                wallDark: '#b45309',
                plant: '#22c55e',
                plantDark: '#15803d',
                plantLight: '#86efac',
                newTissue: '#fde047',
                spore: '#c084fc',
                sporeDark: '#7e22ce',
                vacuole: '#a5f3fc',
                root: '#d97706',
                tuber: '#fde68a',
                soil: '#452b18',
                soilTop: '#6b4226',
                agar: '#2dd4bf',
                glass: 'rgba(186, 230, 253, 0.35)'
            };

            const CATEGORIES = [
                {
                    id: 'fission',
                    name: '分裂生殖',
                    icon: '🦠',
                    organisms: [
                        {
                            id: 'bacteria',
                            name: '細菌',
                            badge: '原核生物 • 橫二分裂（雙子代基因完全相同）',
                            steps: [
                                { title: '成熟親代細菌', desc: '細菌為無核膜的原核生物，細胞內具有一條大型環狀 DNA，外圍有細胞壁與細胞膜保護。' },
                                { title: '環狀 DNA 複製', desc: '細胞吸收養分成長，環狀 DNA 進行複製成為兩份完全相同的遺傳物質，並附著於細胞膜上。' },
                                { title: '細胞延長與分裂溝形成', desc: '細菌體積拉長，兩份環狀 DNA 向細胞兩端分離；中央細胞膜向內凹陷並合成新的細胞壁隔板。' },
                                { title: '分裂成兩個子細胞', desc: '中央完全分隔，產生兩個體積相近、遺傳物質與親代完全相同的子代細菌。' }
                            ]
                        },
                        {
                            id: 'paramecium',

                                { title: '1. 取材與表面滅菌', desc: '切取優良蘭花親代的「莖頂分生組織」（生長點，細胞分裂旺盛且常無病毒），經酒精與次氯酸鈉消毒後取出微小培植體。' },

            // ==========================================
            // 2. APPLICATION STATE & CAMERA
            // ==========================================
            const state = {
                catIdx: 0,
                orgIdx: 0,
                animProgress: 0,      // continuous [0..3]
                targetProgress: 0,    // tween target
                isTweening: false,
                isPlaying: false,
                playPauseTimer: 0,
                labelsVisible: true,
                collapsed: false,
                burstParticles: [],   // interactive spore puffs / sparks
                slashFlash: 0,        // interactive cut flash

                // Camera (world space ~720x460 centered at 0,0)
                camX: 0,
                camY: 0,
                camZoom: 1.0,
                viewW: 800,
                viewH: 500,
                dpr: Math.min(window.devicePixelRatio || 1, 2.5)
            };

            const getActiveCat = () => CATEGORIES[state.catIdx];
            const getActiveOrg = () => getActiveCat().organisms[state.orgIdx];

            // Math helpers
            const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
            const lerp = (a, b, t) => a + (b - a) * t;
            const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            const phase = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
            const ePhase = (p, a, b) => ease(phase(p, a, b));

            function getBaseScale() {
                return Math.min(state.viewW / 740, state.viewH / 470);
            }

            function worldToScreen(wx, wy) {
                const s = getBaseScale() * state.camZoom;
                return {
                    x: state.viewW * 0.5 + (wx - state.camX) * s,
                    y: state.viewH * 0.5 + (wy - state.camY) * s
                };
            }

            function screenToWorld(sx, sy) {
                const s = getBaseScale() * state.camZoom;
                return {
                    x: (sx - state.viewW * 0.5) / s + state.camX,
                    y: (sy - state.viewH * 0.5) / s + state.camY
                };
            }

            // ==========================================
            // 3. CANVAS PRIMITIVES & LABEL SYSTEM
            // ==========================================
            let frameLabels = [];
            function addLabel(wx, wy, text, dx, dy, color = '#2dd4bf') {
                frameLabels.push({ wx, wy, text, dx, dy, color });
            }

            function drawRoundedRectPath(ctx, x, y, w, h, r) {
                const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
                ctx.beginPath();
                ctx.moveTo(x + rr, y);
                ctx.lineTo(x + w - rr, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
                ctx.lineTo(x + w, y + h - rr);
                ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
                ctx.lineTo(x + rr, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
                ctx.lineTo(x, y + rr);
                ctx.quadraticCurveTo(x, y, x + rr, y);
                ctx.closePath();
            }

            function drawSoilBed(ctx, yTop, width = 760, height = 220) {
                ctx.save();
                const grad = ctx.createLinearGradient(0, yTop, 0, yTop + height);
                grad.addColorStop(0, P.soilTop);
                grad.addColorStop(0.22, P.soil);
                grad.addColorStop(1, '#22140b');
                ctx.fillStyle = grad;
                ctx.fillRect(-width / 2, yTop, width, height);

                ctx.strokeStyle = '#855836';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(-width / 2, yTop);
                for (let x = -width / 2; x <= width / 2; x += 24) {
                    ctx.lineTo(x, yTop + Math.sin(x * 0.08) * 2.5);
                }
                ctx.stroke();

                // Soil pebbles
                ctx.fillStyle = 'rgba(253, 230, 138, 0.12)';
                for (let i = 0; i < 28; i++) {
                    const px = ((i * 97) % (width - 40)) - (width - 40) / 2;
                    const py = yTop + 16 + ((i * 53) % 90);
                    ctx.beginPath();
                    ctx.arc(px, py, 2 + (i % 3), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawCutLine(ctx, x1, y1, x2, y2, time, cutProgress) {
                if (cutProgress > 0.35) return;
                ctx.save();
                const alpha = 1 - cutProgress / 0.35;
                ctx.strokeStyle = `rgba(253, 224, 71, ${0.85 * alpha})`;
                ctx.lineWidth = 2.5;
                ctx.setLineDash([7, 5]);
                ctx.lineDashOffset = -time * 24;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.setLineDash([]);

                // Scissors icon indicator
                ctx.fillStyle = `rgba(253, 224, 71, ${alpha})`;
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('✂️', x1, y1 - 8);
                ctx.restore();
            }

            function drawLeafShape(ctx, len, wid, color, veinColor) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(len * 0.3, -wid, len * 0.78, -wid * 0.85, len, 0);
                ctx.bezierCurveTo(len * 0.78, wid * 0.85, len * 0.3, wid, 0, 0);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                if (veinColor) {
                    ctx.strokeStyle = veinColor;
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(2, 0);
                    ctx.lineTo(len * 0.86, 0);
                    ctx.stroke();
                }
            }

            function drawCircularDNA(ctx, cx, cy, r, rot, color) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rot);
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.shadowColor = color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                for (let a = 0; a <= Math.PI * 2 + 0.1; a += 0.15) {
                    const rr = r * (1 + 0.18 * Math.sin(a * 5) + 0.1 * Math.cos(a * 3));
                    const px = Math.cos(a) * rr;
                    const py = Math.sin(a) * rr * 0.72;
                    if (a === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            // Draw a pinched capsule cell for binary fission
            function drawPinchedCell(ctx, cx, cy, halfLen, r, pinch, fill, stroke, lineW) {
                // pinch: 0 = full capsule, 1 = completely pinched at center
                const neckR = Math.max(1.5, r * (1 - pinch * 0.96));
                ctx.beginPath();
                // Top profile from left cap to right cap
                ctx.arc(cx - halfLen, cy, r, Math.PI * 0.5, Math.PI * 1.5);
                ctx.bezierCurveTo(
                    cx - halfLen * 0.35, cy - r,
                    cx - halfLen * 0.2, cy - neckR,
                    cx, cy - neckR
                );
                ctx.bezierCurveTo(
                    cx + halfLen * 0.2, cy - neckR,
                    cx + halfLen * 0.35, cy - r,
                    cx + halfLen, cy - r
                );
                ctx.arc(cx + halfLen, cy, r, -Math.PI * 0.5, Math.PI * 0.5);
                ctx.bezierCurveTo(
                    cx + halfLen * 0.35, cy + r,
                    cx + halfLen * 0.2, cy + neckR,
                    cx, cy + neckR
                );
                ctx.bezierCurveTo(
                    cx - halfLen * 0.2, cy + neckR,
                    cx - halfLen * 0.35, cy + r,
                    cx - halfLen, cy + r
                );
                ctx.closePath();
                if (fill) {
                    ctx.fillStyle = fill;
                    ctx.fill();
                }
                if (stroke) {
                    ctx.strokeStyle = stroke;
                    ctx.lineWidth = lineW || 3;
                    ctx.stroke();
                }
            }

            function drawContractileVacuole(ctx, x, y, r, pulse) {
                const s = r * (0.8 + 0.25 * Math.sin(pulse));
                ctx.save();
                ctx.translate(x, y);
                ctx.strokeStyle = P.vacuole;
                ctx.fillStyle = 'rgba(165, 243, 252, 0.35)';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                const rays = 8;
                for (let i = 0; i < rays * 2; i++) {
                    const ang = (i * Math.PI) / rays;
                    const rad = i % 2 === 0 ? s * 1.45 : s * 0.55;
                    const px = Math.cos(ang) * rad;
                    const py = Math.sin(ang) * rad;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            // ==========================================
            // 4. ORGANISM SIMULATION DRAWERS (ALL 15)
            // ==========================================
            const DRAWERS = {
                // 1A. 細菌 (Bacteria)
                bacteria(ctx, p, time) {
                    const rep = ePhase(p, 0.15, 0.95);   // DNA replication
                    const elong = ePhase(p, 1.0, 1.9);   // Cell elongation
                    const pinch = ePhase(p, 1.25, 2.25); // Pinching
                    const split = ePhase(p, 2.25, 3.0);  // Separation

                    const bob = Math.sin(time * 2) * 3;
                    const baseHalfLen = lerp(65, 130, elong);
                    const cellR = 52;

                    const drawOneBacterium = (cx, cy, hLen, dnaOffset, showFlagLeft, showFlagRight) => {
                        // Flagella
                        ctx.save();
                        ctx.strokeStyle = 'rgba(251, 191, 36, 0.7)';
                        ctx.lineWidth = 3;
                        ctx.lineCap = 'round';
                        if (showFlagLeft) {
                            ctx.beginPath();
                            ctx.moveTo(cx - hLen - cellR, cy);
                            for (let i = 1; i <= 18; i++) {
                                const fx = cx - hLen - cellR - i * 4.5;
                                const fy = cy + Math.sin(time * 7 + i * 0.55) * (3 + i * 0.45);
                                ctx.lineTo(fx, fy);
                            }
                            ctx.stroke();
                        }
                        if (showFlagRight) {
                            ctx.beginPath();
                            ctx.moveTo(cx + hLen + cellR, cy);
                            for (let i = 1; i <= 18; i++) {
                                const fx = cx + hLen + cellR + i * 4.5;
                                const fy = cy + Math.sin(time * 7 - i * 0.55) * (3 + i * 0.45);
                                ctx.lineTo(fx, fy);
                            }
                            ctx.stroke();
                        }
                        ctx.restore();

                        // Outer Cell Wall (Amber)
                        drawPinchedCell(ctx, cx, cy, hLen, cellR, split > 0 ? 0 : pinch, 'rgba(251, 191, 36, 0.12)', P.wall, 5);
                        // Inner Membrane + Cytoplasm (Cyan)
                        drawPinchedCell(ctx, cx, cy, hLen - 2, cellR - 8, split > 0 ? 0 : pinch, 'rgba(56, 189, 248, 0.22)', P.membrane, 2.2);
                    };

                    if (split < 0.02) {
                        drawOneBacterium(0, bob, baseHalfLen, 0, true, false);
                        // DNA
                        if (rep < 0.05) {
                            drawCircularDNA(ctx, 0, bob, 24, time * 0.4, P.dna);
                            addLabel(0, bob - 20, '環狀 DNA', 0, -70, P.dna);
                        } else {
                            const sepDist = lerp(8, 86, ePhase(p, 0.35, 1.85));
                            drawCircularDNA(ctx, -sepDist, bob, 22, time * 0.4, P.dna);
                            drawCircularDNA(ctx, sepDist, bob, 22, -time * 0.4 + 1, P.dna);
                            addLabel(-sepDist, bob - 18, '複製後的環狀 DNA', -50, -72, P.dna);
                            addLabel(sepDist, bob - 18, '環狀 DNA (完全相同)', 55, -72, P.dna);
                        }
                        if (pinch > 0.2) {
                            addLabel(0, bob - cellR * (1 - pinch * 0.6), '分裂溝與新細胞壁', 0, 108, P.newTissue);
                        }
                        addLabel(-baseHalfLen - cellR - 35, bob + 8, '鞭毛', -35, 58, P.wall);
                        addLabel(baseHalfLen + 10, bob - cellR, '細胞壁', 55, -42, P.wall);
                        addLabel(baseHalfLen + 15, bob + cellR - 10, '細胞質 / 細胞膜', 58, 42, P.cyto);
                    } else {
                        // Two separated bacteria
                        const gap = lerp(95, 155, split);
                        const hLen = 62;
                        drawOneBacterium(-gap, bob, hLen, 0, true, false);
                        drawOneBacterium(gap, bob, hLen, 0, false, true);
                        drawCircularDNA(ctx, -gap, bob, 22, time * 0.4, P.dna);
                        drawCircularDNA(ctx, gap, bob, 22, -time * 0.4 + 1, P.dna);

                        addLabel(-gap, bob - cellR, '子代細菌 A (2n)', 0, -52, P.newTissue);
                        addLabel(gap, bob - cellR, '子代細菌 B (2n)', 0, -52, P.newTissue);
                        addLabel(-gap, bob + 10, '完全相同的環狀 DNA', 0, 82, P.dna);
                        addLabel(gap, bob + cellR - 6, '新形成細胞壁', 30, 52, P.wall);
                    }
                },

                // 1B. 草履蟲 (Paramecium)
                paramecium(ctx, p, time) {
                    const nucRep = ePhase(p, 0.1, 0.95);
                    const pinch = ePhase(p, 1.05, 2.2);
                    const split = ePhase(p, 2.2, 3.0);
                    const bob = Math.sin(time * 2.1) * 4;

                    const drawParameciumBody = (cx, cy, scaleX, scaleY, pinchAmt, ciliaCount) => {
                        ctx.save();
                        ctx.translate(cx, cy);
                        // Cilia fringe
                        ctx.strokeStyle = 'rgba(125, 211, 252, 0.65)';
                        ctx.lineWidth = 1.6;
                        const halfW = 120 * scaleX;
                        const maxH = 56 * scaleY;

                        // Body outline helper
                        const bodyPt = (t) => {
                            // t in [0, 2pi]
                            const cos = Math.cos(t);
                            const sin = Math.sin(t);
                            const pinchFactor = 1 - pinchAmt * 0.94 * Math.exp(-Math.pow(cos * 3.2, 2));
                            // slight slipper asymmetry
                            const asym = 1 + 0.14 * cos;
                            return {
                                x: cos * halfW,
                                y: sin * maxH * asym * pinchFactor
                            };
                        };

                        for (let i = 0; i < ciliaCount; i++) {
                            const t = (i / ciliaCount) * Math.PI * 2;
                            const pt = bodyPt(t);
                            const pt2 = bodyPt(t + 0.05);
                            const nx = -(pt2.y - pt.y);
                            const ny = pt2.x - pt.x;
                            const len = Math.hypot(nx, ny) || 1;
                            const wave = Math.sin(time * 9 + i * 0.5) * 4;
                            ctx.beginPath();
                            ctx.moveTo(pt.x, pt.y);
                            ctx.lineTo(pt.x + (nx / len) * 11 + wave * 0.4, pt.y + (ny / len) * 11);
                            ctx.stroke();
                        }

                        // Fill body
                        ctx.beginPath();
                        for (let i = 0; i <= 80; i++) {
                            const t = (i / 80) * Math.PI * 2;
                            const pt = bodyPt(t);
                            if (i === 0) ctx.moveTo(pt.x, pt.y);
                            else ctx.lineTo(pt.x, pt.y);
                        }
                        ctx.closePath();
                        ctx.fillStyle = 'rgba(56, 189, 248, 0.24)';
                        ctx.fill();
                        ctx.strokeStyle = P.membrane;
                        ctx.lineWidth = 3;
                        ctx.stroke();
                        ctx.restore();
                    };

                    if (split < 0.02) {
                        const stretch = lerp(1.0, 1.48, ePhase(p, 0.8, 1.9));
                        drawParameciumBody(0, bob, stretch, 1.0, pinch, 66);

                        // Macronucleus & Micronucleus
                        const sep = lerp(0, 78, ePhase(p, 0.25, 1.8));
                        if (nucRep < 0.45) {
                            // Single elongating macronucleus
                            ctx.save();
                            ctx.fillStyle = P.dna;
                            ctx.beginPath();
                            ctx.ellipse(0, bob - 4, lerp(26, 46, nucRep / 0.45), 16, 0, 0, Math.PI * 2);
                            ctx.fill();
                            // Micronucleus
                            ctx.fillStyle = '#fdf4ff';
                            ctx.beginPath();
                            ctx.arc(-8, bob + 14, 5.5, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                            addLabel(0, bob - 14, '大核 / 小核', 10, -78, P.dna);
                        } else {
                            // Two separating nuclei
                            ctx.fillStyle = P.dna;
                            ctx.beginPath();
                            ctx.ellipse(-sep, bob - 4, 22, 14, 0, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.ellipse(sep, bob - 4, 22, 14, 0, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = '#fdf4ff';
                            ctx.beginPath();
                            ctx.arc(-sep + 12, bob + 12, 5, 0, Math.PI * 2);
                            ctx.arc(sep - 12, bob + 12, 5, 0, Math.PI * 2);
                            ctx.fill();
                            addLabel(-sep, bob - 14, '複製後的大核/小核', -35, -75, P.dna);
                            addLabel(sep, bob - 14, '複製後的大核/小核', 45, -75, P.dna);
                        }

                        // Contractile Vacuoles
                        const vacAlpha = ePhase(p, 0.2, 0.9);
                        drawContractileVacuole(ctx, -85 * stretch, bob - 12, 12, time * 3);
                        drawContractileVacuole(ctx, 85 * stretch, bob - 12, 12, time * 3 + 1.5);
                        if (vacAlpha > 0.1) {
                            ctx.save();
                            ctx.globalAlpha = vacAlpha;
                            drawContractileVacuole(ctx, -22, bob + 18, 10, time * 3 + 0.7);
                            drawContractileVacuole(ctx, 22, bob + 18, 10, time * 3 + 2.2);
                            ctx.restore();
                        }

                        // Oral groove
                        ctx.strokeStyle = 'rgba(253, 224, 71, 0.65)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(-18 * stretch, bob + 38, 28, Math.PI * 1.15, Math.PI * 1.85);
                        ctx.stroke();

                        addLabel(-85 * stretch, bob - 22, '伸縮泡', -45, -45, P.vacuole);
                        addLabel(105 * stretch, bob + 30, '纖毛', 55, 45, P.membrane);
                        addLabel(-18 * stretch, bob + 42, '口溝', -55, 58, P.newTissue);
                        if (pinch > 0.2) {
                            addLabel(0, bob - 48 * (1 - pinch * 0.6), '橫向分裂溝', 0, 105, P.newTissue);
                        }
                    } else {
                        const gap = lerp(96, 155, split);
                        drawParameciumBody(-gap, bob, 0.92, 0.96, 0, 48);
                        drawParameciumBody(gap, bob, 0.92, 0.96, 0, 48);

                        // Nuclei & vacuoles in both
                        [-gap, gap].forEach((gx, idx) => {
                            ctx.fillStyle = P.dna;
                            ctx.beginPath();
                            ctx.ellipse(gx, bob - 4, 21, 13, 0, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = '#fdf4ff';
                            ctx.beginPath();
                            ctx.arc(gx + 10, bob + 12, 4.8, 0, Math.PI * 2);
                            ctx.fill();
                            drawContractileVacuole(ctx, gx - 68, bob - 10, 10, time * 3 + idx);
                            drawContractileVacuole(ctx, gx + 68, bob - 10, 10, time * 3 + 1.5 + idx);
                        });

                        addLabel(-gap, bob - 56, '子代草履蟲 A', 0, -45, P.newTissue);
                        addLabel(gap, bob - 56, '子代草履蟲 B', 0, -45, P.newTissue);
                        addLabel(-gap, bob + 4, '完全相同的遺傳物質', 0, 86, P.dna);
                    }
                },

                // 2A. 水螅 (Hydra)
                hydra(ctx, p, time) {
                    const budGrow = ePhase(p, 0.15, 1.35);
                    const tentGrow = ePhase(p, 1.0, 2.0);
                    const detach = ePhase(p, 2.1, 3.0);

                    // Water substrate rock
                    ctx.save();
                    ctx.fillStyle = '#334155';
                    ctx.beginPath();
                    ctx.moveTo(-340, 175);
                    ctx.quadraticCurveTo(-180, 148, 0, 162);
                    ctx.quadraticCurveTo(180, 145, 340, 175);
                    ctx.lineTo(340, 230);
                    ctx.lineTo(-340, 230);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#475569';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();

                    const drawPolyp = (bx, by, scale, swayPhase, bodyColor, tentAmt, isBud) => {
                        ctx.save();
                        ctx.translate(bx, by);
                        ctx.scale(scale, scale);

                        const sway = Math.sin(time * 1.8 + swayPhase) * 10;
                        const topX = sway;
                        const topY = -185;

                        // Body column
                        ctx.beginPath();
                        ctx.moveTo(-22, 0);
                        ctx.quadraticCurveTo(-16 + sway * 0.3, -90, -14 + topX, topY);
                        ctx.quadraticCurveTo(topX, topY - 12, 14 + topX, topY);
                        ctx.quadraticCurveTo(16 + sway * 0.3, -90, 22, 0);
                        ctx.closePath();
                        ctx.fillStyle = bodyColor;
                        ctx.fill();
                        ctx.strokeStyle = P.membrane;
                        ctx.lineWidth = 2.6;
                        ctx.stroke();

                        // Gastrovascular cavity (inner dashed/soft tube)
                        ctx.beginPath();
                        ctx.moveTo(-6, -10);
                        ctx.quadraticCurveTo(-5 + sway * 0.3, -90, -4 + topX, topY + 6);
                        ctx.lineTo(4 + topX, topY + 6);
                        ctx.quadraticCurveTo(5 + sway * 0.3, -90, 6, -10);
                        ctx.closePath();
                        ctx.fillStyle = 'rgba(244, 114, 182, 0.25)';
                        ctx.fill();

                        // Tentacles
                        if (tentAmt > 0.05) {
                            const tAngles = [-1.25, -0.75, -0.25, 0.25, 0.75, 1.25];
                            tAngles.forEach((ang, idx) => {
                                const len = 72 * tentAmt;
                                const wave = Math.sin(time * 2.5 + idx * 0.9 + swayPhase) * 14;
                                const ex = topX + Math.sin(ang) * len + wave;
                                const ey = topY - Math.cos(ang) * len * 0.75;
                                ctx.beginPath();
                                ctx.moveTo(topX + ang * 8, topY - 4);
                                ctx.quadraticCurveTo(
                                    topX + Math.sin(ang) * len * 0.5 - wave * 0.4,
                                    topY - Math.cos(ang) * len * 0.55,
                                    ex, ey
                                );
                                ctx.strokeStyle = isBud ? P.newTissue : P.cyto;
                                ctx.lineWidth = 4.2;
                                ctx.lineCap = 'round';
                                ctx.stroke();
                            });
                        }
                        ctx.restore();
                    };

                    // Parent Hydra
                    const parentX = lerp(-30, -90, detach);
                    drawPolyp(parentX, 160, 1.0, 0, 'rgba(56, 189, 248, 0.34)', 1.0, false);

                    // Budding Hydra
                    if (budGrow > 0.02) {
                        if (detach < 0.05) {
                            // Attached to parent body wall
                            const attachX = parentX + 14;
                            const attachY = 85;
                            ctx.save();
                            ctx.translate(attachX, attachY);
                            ctx.rotate(lerp(1.15, 0.72, budGrow));
                            const budScale = lerp(0.15, 0.58, budGrow);
                            drawPolyp(0, 0, budScale, 1.2, 'rgba(253, 224, 71, 0.32)', tentGrow, true);
                            ctx.restore();

                            const budTipX = attachX + Math.sin(lerp(1.15, 0.72, budGrow)) * (185 * budScale);
                            const budTipY = attachY - Math.cos(lerp(1.15, 0.72, budGrow)) * (185 * budScale);
                            addLabel(attachX + 20, attachY - 15, '芽體 (細胞有絲分裂隆起)', 75, -18, P.newTissue);
                            if (tentGrow > 0.3) {
                                addLabel(budTipX, budTipY, '芽體觸手與口', 75, -38, P.newTissue);
                            }
                        } else {
                            // Detaching & settling to the right
                            const budX = lerp(parentX + 45, 115, detach);
                            const budY = lerp(85, 162, Math.pow(detach, 0.8));
                            const budAngle = lerp(0.72, 0, detach);
                            ctx.save();
                            ctx.translate(budX, budY);
                            ctx.rotate(budAngle);
                            drawPolyp(0, 0, lerp(0.58, 0.72, detach), 1.5, 'rgba(253, 224, 71, 0.36)', 1.0, true);
                            ctx.restore();

                            addLabel(budX, budY - 125, '獨立新水螅 (基因與親代相同)', 40, -35, P.newTissue);
                        }
                    }

                    addLabel(parentX - 10, -25, '親代觸手', -95, -20, P.cyto);
                    addLabel(parentX, 55, '消化腔', -88, 12, P.dna);
                    addLabel(parentX - 15, 130, '親代水螅', -95, 22, P.membrane);
                },

                // 2B. 酵母菌 (Yeast)
                yeast(ctx, p, time) {
                    const budEmerg = ePhase(p, 0.1, 1.1);
                    const nucDiv = ePhase(p, 0.65, 1.85);
                    const budGrow = ePhase(p, 1.0, 2.2);
                    const detach = ePhase(p, 2.2, 3.0);

                    const bob = Math.sin(time * 2) * 3;
                    const parentX = lerp(-20, -75, detach);

                    const drawYeastCell = (cx, cy, rx, ry, rot, wallCol, hasVac, vacScale) => {
                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.rotate(rot);
                        // Outer cell wall
                        ctx.beginPath();
                        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(251, 191, 36, 0.16)';
                        ctx.fill();
                        ctx.strokeStyle = wallCol;
                        ctx.lineWidth = 4.5;
                        ctx.stroke();

                        // Inner cytoplasm
                        ctx.beginPath();
                        ctx.ellipse(0, 0, rx - 5, ry - 5, 0, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
                        ctx.fill();

                        // Vacuole
                        if (hasVac) {
                            ctx.beginPath();
                            ctx.ellipse(-rx * 0.25, ry * 0.15, rx * 0.34 * vacScale, ry * 0.34 * vacScale, 0.2, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(165, 243, 252, 0.35)';
                            ctx.fill();
                            ctx.strokeStyle = P.vacuole;
                            ctx.lineWidth = 1.8;
                            ctx.stroke();
                        }
                        ctx.restore();
                    };

                    // Parent yeast
                    drawYeastCell(parentX, bob, 82, 66, -0.1, P.wall, true, 1.0);

                    // Bud
                    if (budEmerg > 0.02) {
                        const budRx = lerp(10, 48, budGrow * 0.65 + budEmerg * 0.35);
                        const budRy = lerp(10, 39, budGrow * 0.65 + budEmerg * 0.35);
                        const distAttached = 74 + budRx * 0.68;
                        const bx = parentX + Math.cos(-0.42) * distAttached + detach * 68;
                        const by = bob + Math.sin(-0.42) * distAttached + detach * 18;
                        drawYeastCell(bx, by, budRx, budRy, -0.25, detach > 0.6 ? P.wall : P.newTissue, budGrow > 0.4, budGrow);

                        // Nucleus division
                        const pNucX = lerp(parentX + 18, parentX + 48, Math.sin(nucDiv * Math.PI * 0.5) * (1 - detach));
                        const pNucY = lerp(bob - 12, bob - 26, Math.sin(nucDiv * Math.PI * 0.5) * (1 - detach));

                        if (nucDiv < 0.55) {
                            // Stretching nucleus
                            ctx.save();
                            ctx.translate(pNucX, pNucY);
                            ctx.rotate(-0.42);
                            ctx.fillStyle = P.dna;
                            ctx.beginPath();
                            ctx.ellipse(0, 0, lerp(16, 30, nucDiv / 0.55), 12, 0, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                            addLabel(pNucX, pNucY, '細胞核進行分裂', -20, -68, P.dna);
                        } else {
                            // Two separated nuclei
                            const tSplit = phase(nucDiv, 0.55, 1.0);
                            const n1x = lerp(parentX + 42, parentX + 15, tSplit);
                            const n1y = lerp(bob - 22, bob - 10, tSplit);
                            const n2x = lerp(parentX + 58, bx - 4, tSplit);
                            const n2y = lerp(bob - 30, by, tSplit);

                            ctx.fillStyle = P.dna;
                            ctx.beginPath();
                            ctx.arc(n1x, n1y, 14, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(n2x, n2y, 11, 0, Math.PI * 2);
                            ctx.fill();

                            addLabel(n2x, n2y, '子細胞核移入芽體', 48, -56, P.dna);
                        }

                        if (detach < 0.5) {
                            addLabel(bx + budRx * 0.4, by - budRy * 0.5, '芽體 (小於母細胞)', 65, -35, P.newTissue);
                        } else {
                            addLabel(bx, by - budRy, '子代酵母菌 (較小)', 35, -48, P.newTissue);
                            addLabel((parentX + bx) / 2, (bob + by) / 2 + 25, '隔膜分離 (不均等分裂)', 0, 65, P.wall);
                        }
                    } else {
                        ctx.fillStyle = P.dna;
                        ctx.beginPath();
                        ctx.arc(parentX + 18, bob - 10, 16, 0, Math.PI * 2);
                        ctx.fill();
                        addLabel(parentX + 18, bob - 10, '細胞核', 35, -62, P.dna);
                    }

                    addLabel(parentX - 24, bob + 12, '液泡', -68, 56, P.vacuole);
                    addLabel(parentX - 65, bob - 48, '母細胞 (細胞壁)', -45, -45, P.wall);
                },

                // 3A. 渦蟲 (Planaria)
                planaria(ctx, p, time) {
                    const cutAmt = ePhase(p, 0.25, 0.95);
                    const blastema = ePhase(p, 1.0, 2.0);
                    const regen = ePhase(p, 1.85, 3.0);

                    const drawPlanariaHalf = (x, y, isHead, regenAmt, blastAmt) => {
                        ctx.save();
                        ctx.translate(x, y);

                        // Body shape
                        ctx.beginPath();
                        if (isHead) {
                            // Head + upper torso + regenerating tail
                            const tailLen = lerp(12, 130, regenAmt);
                            ctx.moveTo(0, -125); // head tip
                            ctx.lineTo(-42, -92); // left auricle
                            ctx.quadraticCurveTo(-30, -76, -33, -45);
                            ctx.lineTo(-33, 5); // cut line
                            // regenerating tail
                            ctx.quadraticCurveTo(-28 * (1 - regenAmt * 0.35), 5 + tailLen * 0.6, 0, 5 + tailLen);
                            ctx.quadraticCurveTo(28 * (1 - regenAmt * 0.35), 5 + tailLen * 0.6, 33, 5);
                            ctx.lineTo(33, -45);
                            ctx.quadraticCurveTo(30, -76, 42, -92);
                            ctx.closePath();
                        } else {
                            // Regenerating head + lower torso + tail
                            const headLen = lerp(12, 128, regenAmt);
                            const auricleW = lerp(33, 42, regenAmt);
                            ctx.moveTo(0, -5 - headLen);
                            ctx.lineTo(-auricleW, -5 - headLen * 0.72);
                            ctx.quadraticCurveTo(-31, -5 - headLen * 0.55, -33, -5);
                            ctx.lineTo(-32, 65);
                            ctx.quadraticCurveTo(-24, 115, 0, 135);
                            ctx.quadraticCurveTo(24, 115, 32, 65);
                            ctx.lineTo(33, -5);
                            ctx.quadraticCurveTo(31, -5 - headLen * 0.55, auricleW, -5 - headLen * 0.72);
                            ctx.closePath();
                        }
                        ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
                        ctx.fill();
                        ctx.strokeStyle = P.membrane;
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        // Blastema highlight at wound
                        if (blastAmt > 0.05 && regenAmt < 0.92) {
                            ctx.save();
                            ctx.globalAlpha = blastAmt * (1 - regenAmt * 0.85);
                            ctx.fillStyle = P.newTissue;
                            ctx.beginPath();
                            ctx.ellipse(0, isHead ? 10 : -10, 30, 12 + regenAmt * 18, 0, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        }

                        // Eyespots
                        if (isHead || regenAmt > 0.35) {
                            const eyeAlpha = isHead ? 1 : phase(regenAmt, 0.35, 0.85);
                            const eyeY = isHead ? -88 : -5 - lerp(12, 128, regenAmt) * 0.7;
                            ctx.save();
                            ctx.globalAlpha = eyeAlpha;
                            [-12, 12].forEach((ex) => {
                                ctx.fillStyle = '#ffffff';
                                ctx.beginPath();
                                ctx.arc(ex, eyeY, 7, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.fillStyle = '#0f172a';
                                ctx.beginPath();
                                ctx.arc(ex * 0.82, eyeY, 3.6, 0, Math.PI * 2);
                                ctx.fill();
                            });
                            ctx.restore();
                        }

                        // Pharynx / gut hint
                        ctx.strokeStyle = 'rgba(244, 114, 182, 0.45)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        if (isHead) {
                            ctx.moveTo(0, -68);
                            ctx.lineTo(0, -8);
                        } else {
                            ctx.moveTo(0, 10);
                            ctx.lineTo(0, 88);
                        }
                        ctx.stroke();

                        ctx.restore();
                    };

                    if (cutAmt < 0.05) {
                        // Whole planaria gliding gently
                        const bob = Math.sin(time * 2) * 5;
                        ctx.save();
                        ctx.translate(0, bob);
                        ctx.beginPath();
                        ctx.moveTo(0, -135);
                        ctx.lineTo(-42, -100);
                        ctx.quadraticCurveTo(-30, -82, -33, -45);
                        ctx.lineTo(-32, 60);
                        ctx.quadraticCurveTo(-24, 112, 0, 136);
                        ctx.quadraticCurveTo(24, 112, 32, 60);
                        ctx.lineTo(33, -45);
                        ctx.quadraticCurveTo(30, -82, 42, -100);
                        ctx.closePath();
                        ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
                        ctx.fill();
                        ctx.strokeStyle = P.membrane;
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        // Eyespots
                        [-12, 12].forEach((ex) => {
                            ctx.fillStyle = '#fff';
                            ctx.beginPath();
                            ctx.arc(ex, -95, 7, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = '#0f172a';
                            ctx.beginPath();
                            ctx.arc(ex * 0.82, -95, 3.6, 0, Math.PI * 2);
                            ctx.fill();
                        });
                        // Pharynx
                        ctx.strokeStyle = 'rgba(244, 114, 182, 0.55)';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.moveTo(0, -72);
                        ctx.lineTo(0, 82);
                        ctx.stroke();
                        ctx.restore();

                        drawCutLine(ctx, -78, bob, 78, bob, time, 0);
                        addLabel(12, bob - 95, '眼點', 75, -25, '#ffffff');
                        addLabel(-42, bob - 100, '耳突', -75, -18, P.cyto);
                        addLabel(0, bob + 20, '咽 / 腸道', 85, 22, P.dna);
                        addLabel(-72, bob, '橫切斷線', -78, 35, P.newTissue);
                    } else {
                        // Two regenerating halves placed side by side
                        const sepX = lerp(0, 128, cutAmt);
                        const yShiftH = lerp(-4, 0, regen);
                        const yShiftT = lerp(16, 0, regen);

                        drawPlanariaHalf(-sepX, yShiftH, true, regen, blastema);
                        drawPlanariaHalf(sepX, yShiftT, false, regen, blastema);

                        if (cutAmt < 0.9) {
                            drawCutLine(ctx, -78, 0, 78, 0, time, cutAmt);
                        }

                        if (regen < 0.85) {
                            addLabel(-sepX, yShiftH + 8, '再生芽基 (長出尾部)', -45, 72, P.newTissue);
                            addLabel(sepX, yShiftT - 8, '再生芽基 (長出頭部)', 55, -75, P.newTissue);
                        } else {
                            addLabel(-sepX, yShiftH - 90, '新個體 A (頭段再生尾)', -20, -48, P.newTissue);
                            addLabel(sepX, yShiftT - 90, '新個體 B (尾段再生頭)', 20, -48, P.newTissue);
                            addLabel(sepX + 12, yShiftT - 95, '再生眼點', 85, -12, '#ffffff');
                        }
                    }
                },

                // 3B. 水綿 (Spirogyra)
                spirogyra(ctx, p, time) {
                    const breakAmt = ePhase(p, 0.2, 0.95);
                    const growAmt = ePhase(p, 1.05, 3.0);

                    const drawFilament = (cx, cy, cells, cellW, cellH, rot) => {
                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.rotate(rot);
                        const totalW = cells * cellW;
                        const startX = -totalW / 2;

                        for (let i = 0; i < cells; i++) {
                            const x = startX + i * cellW;
                            // Cell wall box
                            ctx.fillStyle = 'rgba(34, 197, 94, 0.14)';
                            ctx.fillRect(x, -cellH / 2, cellW, cellH);
                            ctx.strokeStyle = P.plantLight;
                            ctx.lineWidth = 2.4;
                            ctx.strokeRect(x, -cellH / 2, cellW, cellH);

                            // Spiral chloroplast ribbon
                            ctx.save();
                            ctx.beginPath();
                            ctx.rect(x + 2, -cellH / 2 + 2, cellW - 4, cellH - 4);
                            ctx.clip();

                            ctx.strokeStyle = P.plant;
                            ctx.lineWidth = 5;
                            ctx.lineCap = 'round';
                            ctx.beginPath();
                            for (let s = 0; s <= 24; s++) {
                                const t = s / 24;
                                const sx = x + 3 + t * (cellW - 6);
                                const sy = Math.sin(t * Math.PI * 3 + i) * (cellH * 0.32);
                                if (s === 0) ctx.moveTo(sx, sy);
                                else ctx.lineTo(sx, sy);
                            }
                            ctx.stroke();
                            ctx.restore();

                            // Central nucleus
                            ctx.fillStyle = P.dna;
                            ctx.beginPath();
                            ctx.arc(x + cellW / 2, 0, 5.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    };

                    const cellW = 54;
                    const cellH = 44;
                    const bob = Math.sin(time * 1.8) * 3;

                    if (breakAmt < 0.05) {
                        drawFilament(0, bob, 8, cellW, cellH, 0);
                        drawCutLine(ctx, -cellW * 1.3, bob - 48, -cellW * 1.3, bob + 48, time, 0);
                        drawCutLine(ctx, cellW * 1.3, bob - 48, cellW * 1.3, bob + 48, time, 0);

                        addLabel(0, bob - cellH / 2, '細胞壁', -95, -52, P.plantLight);
                        addLabel(cellW * 0.5, bob, '螺旋狀葉綠體', 55, -62, P.plant);
                        addLabel(-cellW * 0.5, bob, '細胞核', -35, 68, P.dna);
                    } else {
                        // 3 fragments separating vertically & horizontally, then growing more cells
                        const extraCells = Math.floor(growAmt * 4);
                        const spreadY = lerp(0, 88, breakAmt);
                        const spreadX = lerp(60, 0, growAmt);

                        // Top fragment
                        drawFilament(-spreadX, -spreadY + bob, 3 + extraCells, cellW, cellH, lerp(-0.08, 0, growAmt));
                        // Middle fragment
                        drawFilament(0, bob, 2 + extraCells, cellW, cellH, lerp(0.06, 0, growAmt));
                        // Bottom fragment
                        drawFilament(spreadX, spreadY + bob, 3 + extraCells, cellW, cellH, lerp(-0.05, 0, growAmt));

                        if (growAmt < 0.35) {
                            addLabel(0, -spreadY / 2, '水流外力斷裂成數段', 110, -18, P.newTissue);
                        } else {
                            addLabel(0, -spreadY - 24, '斷片 1：細胞有絲分裂延長', 0, -38, P.newTissue);
                            addLabel(0, bob + 24, '斷片 2：螺旋葉綠體與核同步分裂', 0, 36, P.plant);
                            addLabel(0, spreadY + 24, '斷片 3：獨立為新水綿絲狀體', 0, 38, P.newTissue);
                        }
                    }
                },

                // 3C. 海星 (Starfish)
                starfish(ctx, p, time) {
                    const cutAmt = ePhase(p, 0.25, 0.95);
                    const blastema = ePhase(p, 1.0, 1.9);
                    const regen = ePhase(p, 1.85, 3.0);

                    // Helper to draw a starfish with specific arm lengths [0..1] for each of 5 arms
                    const drawStarfish = (cx, cy, armLens, rot, discFill, isMinorPiece, minorCut) => {
                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.rotate(rot);

                        const outerR = 112;
                        const innerR = 36;

                        ctx.beginPath();
                        for (let i = 0; i < 5; i++) {
                            const baseAng = (i * Math.PI * 2) / 5 - Math.PI / 2;
                            const nextAng = ((i + 1) * Math.PI * 2) / 5 - Math.PI / 2;
                            const midAng = (baseAng + nextAng) / 2;

                            const armFactor = armLens[i];
                            const tipR = lerp(innerR * 0.88, outerR, armFactor);
                            const tipX = Math.cos(baseAng) * tipR;
                            const tipY = Math.sin(baseAng) * tipR;

                            const valleyR = innerR;
                            const vx = Math.cos(midAng) * valleyR;
                            const vy = Math.sin(midAng) * valleyR;

                            if (i === 0) {
                                const prevMid = baseAng - Math.PI / 5;
                                ctx.moveTo(Math.cos(prevMid) * valleyR, Math.sin(prevMid) * valleyR);
                            }
                            ctx.quadraticCurveTo(
                                Math.cos(baseAng - 0.14) * tipR * 0.72,
                                Math.sin(baseAng - 0.14) * tipR * 0.72,
                                tipX, tipY
                            );
                            ctx.quadraticCurveTo(
                                Math.cos(baseAng + 0.14) * tipR * 0.72,
                                Math.sin(baseAng + 0.14) * tipR * 0.72,
                                vx, vy
                            );
                        }
                        ctx.closePath();
                        ctx.fillStyle = discFill;
                        ctx.fill();
                        ctx.strokeStyle = P.membrane;
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        // Central disc ring
                        ctx.beginPath();
                        ctx.arc(0, 0, 21, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(244, 114, 182, 0.35)';
                        ctx.fill();
                        ctx.strokeStyle = P.dna;
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Regenerating blastema highlights on growing arms
                        for (let i = 0; i < 5; i++) {
                            if (armLens[i] > 0.05 && armLens[i] < 0.92 && blastema > 0.1) {
                                const ang = (i * Math.PI * 2) / 5 - Math.PI / 2;
                                const r = lerp(innerR * 0.9, outerR, armLens[i]);
                                ctx.fillStyle = `rgba(253, 224, 71, ${0.85 * (1 - regen * 0.8)})`;
                                ctx.beginPath();
                                ctx.arc(Math.cos(ang) * r * 0.78, Math.sin(ang) * r * 0.78, 9, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }

                        ctx.restore();
                    };

                    if (cutAmt < 0.05) {
                        drawStarfish(0, 5, [1, 1, 1, 1, 1], 0, 'rgba(56, 189, 248, 0.28)', false, false);
                        drawCutLine(ctx, 22, -105, 38, 115, time, 0);

                        addLabel(0, 5, '中央盤', -115, -18, P.dna);
                        addLabel(-95, -25, '腕足', -55, -52, P.cyto);
                        addLabel(32, 85, '含部分中央盤之斷裂線', 95, 38, P.newTissue);
                    } else {
                        const sep = lerp(0, 145, cutAmt);
                        // Left piece keeps arms 0, 3, 4; regrows arms 1, 2
                        const leftArms = [1, regen, regen, 1, 1];
                        // Right piece keeps arms 1, 2; regrows arms 0, 3, 4
                        const rightArms = [regen, 1, 1, regen, regen];

                        drawStarfish(-sep, 8, leftArms, 0, 'rgba(56, 189, 248, 0.28)', false, false);
                        drawStarfish(sep, 8, rightArms, 0, 'rgba(253, 224, 71, 0.22)', true, true);

                        if (cutAmt < 0.85) {
                            drawCutLine(ctx, 0, -100, 0, 115, time, cutAmt);
                        }

                        if (regen < 0.85) {
                            addLabel(-sep + 30, 8, '保留3腕 + 部分中央盤', -40, -130, P.cyto);
                            addLabel(sep - 30, 8, '保留2腕 + 部分中央盤', 40, -130, P.newTissue);
                            addLabel(sep - 15, 25, '再生芽基萌發新腕足', 20, 125, P.newTissue);
                        } else {
                            addLabel(-sep, -110, '完整新海星 A', 0, -32, P.cyto);
                            addLabel(sep, -110, '完整新海星 B', 0, -32, P.newTissue);
                            addLabel(0, 140, '兩者遺傳物質完全相同', 0, 22, P.dna);
                        }
                    }
                },

                // 4A. 黑黴菌 (Rhizopus / Black Mold)
                rhizopus(ctx, p, time) {
                    const swell = ePhase(p, 0.15, 1.0);
                    const sporeFill = ePhase(p, 0.65, 1.5);
                    const burst = ePhase(p, 1.45, 2.35);
                    const germ = ePhase(p, 2.15, 3.0);

                    // Bread / organic substrate
                    ctx.save();
                    drawRoundedRectPath(ctx, -330, 125, 660, 72, 16);
                    ctx.fillStyle = '#5c3a21';
                    ctx.fill();
                    ctx.strokeStyle = '#925e36';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();

                    // Stolon & Rhizoids (non-septate hyphae)
                    ctx.save();
                    ctx.strokeStyle = P.wall;
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    // Stolon
                    ctx.beginPath();
                    ctx.moveTo(-220, 123);
                    ctx.quadraticCurveTo(-80, 112, 60, 123);
                    ctx.stroke();

                    // Rhizoids branching down into bread
                    const drawRhizoid = (rx, ry, s = 1) => {
                        ctx.save();
                        ctx.translate(rx, ry);
                        ctx.scale(s, s);
                        ctx.strokeStyle = 'rgba(251, 191, 36, 0.8)';
                        ctx.lineWidth = 2.4;
                        [-26, -10, 8, 24].forEach((tx, idx) => {
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.quadraticCurveTo(tx * 0.4, 22, tx, 42 + (idx % 2) * 12);
                            ctx.stroke();
                        });
                        ctx.restore();
                    };
                    drawRhizoid(-160, 124, 1);
                    drawRhizoid(-40, 122, 0.85);

                    // Tall Sporangiophore
                    const stalkX = -160;
                    const stalkTopY = -65;
                    ctx.strokeStyle = P.wall;
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(stalkX, 122);
                    ctx.quadraticCurveTo(stalkX - 8, 30, stalkX, stalkTopY);
                    ctx.stroke();

                    // Sporangium
                    const spR = lerp(22, 42, swell);
                    if (burst < 0.35) {
                        ctx.beginPath();
                        ctx.arc(stalkX, stalkTopY - spR * 0.5, spR, 0, Math.PI * 2);
                        ctx.fillStyle = sporeFill > 0.3 ? 'rgba(126, 34, 206, 0.72)' : 'rgba(251, 191, 36, 0.25)';
                        ctx.fill();
                        ctx.strokeStyle = P.wall;
                        ctx.lineWidth = 2.6;
                        ctx.stroke();
                    } else {
                        // Ruptured sporangium + columella
                        ctx.beginPath();
                        ctx.arc(stalkX, stalkTopY - spR * 0.5, spR, Math.PI * 0.2, Math.PI * 0.8);
                        ctx.strokeStyle = P.wall;
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                        // Columella dome
                        ctx.beginPath();
                        ctx.arc(stalkX, stalkTopY - 8, 14, Math.PI, 0);
                        ctx.fillStyle = 'rgba(251, 191, 36, 0.45)';
                        ctx.fill();
                    }

                    // Spores inside or dispersing
                    for (let i = 0; i < 36; i++) {
                        const ang = (i * 2.39996);
                        const dist = Math.sqrt(i / 36) * (spR - 6);
                        let sx = stalkX + Math.cos(ang) * dist;
                        let sy = (stalkTopY - spR * 0.5) + Math.sin(ang) * dist;

                        if (burst > 0.05) {
                            const fly = clamp((burst - (i % 6) * 0.05) / 0.75, 0, 1);
                            const windX = (90 + (i * 29) % 240) * fly;
                            const windY = (-70 + ((i * 41) % 180)) * fly + fly * fly * 125;
                            sx = lerp(sx, stalkX + windX, fly);
                            sy = lerp(sy, stalkTopY - 20 + windY, fly);
                        }
                        if (sporeFill > 0.05) {
                            ctx.fillStyle = P.spore;
                            ctx.beginPath();
                            ctx.arc(sx, sy, 3.6, 0, Math.PI * 2);
