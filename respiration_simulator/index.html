<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>人體的呼吸 — 互動動態生理模擬器</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-deep: #080f1e;
      --bg-panel: rgba(15, 23, 42, 0.88);
      --bg-card: rgba(30, 41, 59, 0.78);
      --border-subtle: rgba(148, 163, 184, 0.2);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;

      /* 跨分頁統一解剖與生理色票 */
      --col-airway: #f472b6;
      /* 呼吸道黏膜：粉紅 */
      --col-cartilage: #22d3ee;
      /* 軟骨(會厭/喉/C型環/肋軟骨)：青藍 */
      --col-lung: #fb7185;
      /* 肺臟/肺泡組織：鮭魚粉紅 */
      --col-muscle: #e11d48;
      /* 橫膈/肌肉：深肌紅 */
      --col-o2: #ef4444;
      /* 氧氣 / 充氧血：鮮紅 */
      --col-co2: #3b82f6;
      /* 二氧化碳 / 缺氧血：靜脈藍 */
      --col-mucus: #facc15;
      /* 黏液：琥珀黃 */
      --col-bolus: #84cc16;
      /* 食團：草綠 */
      --col-neural: #f59e0b;
      /* 腦幹呼吸中樞 / 神經訊號：神經金 */
      --col-dust: #a855f7;
      /* 異物微粒/病菌：紫灰 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* 頂部導覽與全域控制列 */
    header {
      flex-shrink: 0;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.02rem;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--col-lung);
      box-shadow: 0 0 10px var(--col-lung);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-pill {
      background: rgba(51, 65, 85, 0.7);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.18s ease;
      min-height: 34px;
      white-space: nowrap;
    }

    .btn-pill:hover {
      background: rgba(71, 85, 105, 0.85);
    }

    .btn-pill.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--accent);
      color: #7dd3fc;
    }

    /* 統一色彩圖例列 */
    .legend-bar {
      flex-shrink: 0;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border-subtle);
      padding: 6px 14px;
      display: none;
      flex-wrap: wrap;
      gap: 10px 14px;
      font-size: 0.76rem;
      color: var(--text-muted);
      z-index: 28;
    }

    .legend-bar.open {
      display: flex;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
    }

    /* 多分頁切換列 */
    nav.tabs-nav {
      flex-shrink: 0;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      background: rgba(11, 18, 34, 0.92);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 8px;
      gap: 4px;
      z-index: 25;
    }

    nav.tabs-nav::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 0 0 auto;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-bottom: 3px solid transparent;
      padding: 10px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: linear-gradient(to top, rgba(56, 189, 248, 0.12), transparent);
    }

    /* 主互動視窗區 */
    main.stage-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #13203b 0%, #070d19 100%);
      touch-action: none;
    }

    .tab-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      touch-action: none;
    }

    .tab-stage.active {
      display: block;
    }

    .sim-svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }

    .sim-svg:active {
      cursor: grabbing;
    }

    /* 文字標籤顯示/隱藏控制 */
    body.hide-labels .anat-label,
    body.hide-labels .label-3d {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .anat-label {
      transition: opacity 0.22s ease;
    }

    /* Three.js 3D 浮動標籤 */
    #labels3dContainer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .label-3d {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #f8fafc;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
      transition: opacity 0.2s, border-color 0.2s, transform 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    .label-3d.highlight {
      border-color: #facc15;
      background: rgba(30, 41, 59, 0.96);
      color: #fef08a;
      transform: translate(-50%, -50%) scale(1.1);
      z-index: 5;
    }

    /* 情境專用浮動控制卡 (左上) */
    .context-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 18;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: min(330px, calc(100vw - 70px));
      pointer-events: none;
    }

    .context-card {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 11px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      font-size: 0.8rem;
    }

    .seg-group {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border-subtle);
      gap: 2px;
    }

    .seg-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }

    .seg-btn.active {
      background: rgba(56, 189, 248, 0.22);
      color: #7dd3fc;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
    }

    .slider-row label {
      font-size: 0.76rem;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 5px;
      cursor: pointer;
    }

    .action-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border: 1px solid rgba(125, 211, 252, 0.4);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      margin-top: 5px;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    /* 右下角 Zoom / Pan 控制組 */
    .zoom-hud {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 18;
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: var(--bg-panel);
      backdrop-filter: blur(8px);
      padding: 5px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    .zoom-btn {
      width: 36px;
      height: 36px;
      border-radius: 7px;
      border: 1px solid var(--border-subtle);
      background: rgba(30, 41, 59, 0.85);
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-btn:active {
      background: rgba(56, 189, 248, 0.3);
    }

    .zoom-hint {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.1;
      padding-top: 2px;
    }

    /* 底部 Step-by-Step 流程控制塢 */
    footer.step-dock {
      flex-shrink: 0;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 25;
    }

    .step-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-dots {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .step-dot {
      min-width: 28px;
      height: 26px;
      padding: 0 7px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
    }

    .step-dot.active {
      background: var(--accent);
      color: #082f49;
      border-color: #bae6fd;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.45);
    }

    .step-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      background: rgba(51, 65, 85, 0.85);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 5px 11px;
      min-height: 34px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .ctrl-btn.play-btn {
      background: rgba(14, 165, 233, 0.25);
      border-color: rgba(56, 189, 248, 0.55);
      color: #7dd3fc;
    }

    .ctrl-btn:active {
      transform: scale(0.96);
    }

    .step-desc-box {
      background: rgba(15, 23, 42, 0.65);
      border-left: 3px solid var(--accent);
      border-radius: 0 7px 7px 0;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .step-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: #e0f2fe;
    }

    .step-text {
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.42;
    }

    /* 手機版微調 */
    @media (max-width: 640px) {
      header {
        padding: 6px 10px;
      }

      .brand span.sub {
        display: none;
      }

      .tab-btn {
        padding: 8px 10px;
        font-size: 0.8rem;
      }

      footer.step-dock {
        padding: 7px 10px 9px;
      }

      .step-title {
        font-size: 0.82rem;
      }

      .step-text {
        font-size: 0.76rem;
      }

      .context-panel {
        max-width: calc(100vw - 64px);
      }
    }
  </style>
</head>

<body>

  <!-- 頂部標題與全域標籤/圖例切換 -->
  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <span>人體的呼吸</span>
      <span class="sub" style="font-weight:400;font-size:0.8rem;color:var(--text-muted);">｜互動動態生理模擬器</span>
    </div>
    <div class="header-actions">
      <button id="btnToggleLegend" class="btn-pill" title="顯示跨分頁統一顏色圖例">🎨 圖例</button>
      <button id="btnToggleLabels" class="btn-pill active" title="切換顯示或隱藏所有文字標籤">🏷️ 標籤：顯示</button>
    </div>
  </header>

  <!-- 跨分頁統一視覺色票圖例 -->
  <div id="legendBar" class="legend-bar">
    <span class="legend-item"><i class="legend-swatch" style="background:var(--col-airway)"></i>呼吸道黏膜</span>
    <span class="legend-item"><i class="legend-swatch"
        style="background:var(--col-cartilage)"></i>軟骨(會厭/喉/C型環/肋軟骨)</span>
    <span class="legend-item"><i class="legend-swatch" style="background:var(--col-lung)"></i>肺臟 / 肺泡</span>
    <span class="legend-item"><i class="legend-swatch" style="background:var(--col-muscle)"></i>橫膈 / 呼吸肌</span>
    <span class="legend-item"><i class="legend-swatch" style="background:var(--col-o2)"></i>氧氣 (O₂) / 充氧血</span>
    <span class="legend-item"><i class="legend-swatch" style="background:var(--col-co2)"></i>二氧化碳 (CO₂) / 缺氧血</span>
    <span class="legend-item"><i class="legend-swatch" style="background:var(--col-mucus)"></i>氣管黏液</span>
    <span class="legend-item"><i class="legend-swatch" style="background:var(--col-bolus)"></i>食團</span>
    <span class="legend-item"><i class="legend-swatch" style="background:var(--col-neural)"></i>腦幹呼吸中樞 / 神經訊號</span>
  </div>

  <!-- 六大分頁列 -->
  <nav class="tabs-nav" id="tabsNav">
    <button class="tab-btn active" data-tab="0">🧊 1. 呼吸系統總覽 (3D)</button>
    <button class="tab-btn" data-tab="1">🗣️ 2. 會厭軟骨與聲帶</button>
    <button class="tab-btn" data-tab="2">🧹 3. 氣管纖毛與黏液</button>
    <button class="tab-btn" data-tab="3">🫧 4. 肺泡氣體交換</button>
    <button class="tab-btn" data-tab="4">🫁 5. 胸腔與呼吸運動</button>
    <button class="tab-btn" data-tab="5">⚡ 6. 運動與腦幹調節</button>
  </nav>

  <!-- 主畫布區 -->
  <main class="stage-wrapper" id="stageWrapper">

    <!-- 左上角情境互動面板 (依分頁動態更新) -->
    <div class="context-panel" id="contextPanel"></div>

    <!-- 分頁 0：Three.js 3D 呼吸系統總覽 -->
    <section class="tab-stage active" id="stage0">
      <div id="threeContainer" style="width:100%;height:100%;"></div>
      <div id="labels3dContainer"></div>
    </section>

    <!-- 分頁 1：咽喉分流（會厭軟骨/喉頭上升）與發聲（聲帶振動） -->
    <section class="tab-stage" id="stage1">
      <svg class="sim-svg" id="svg1" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
        <rect class="pz-ref" width="1" height="1" opacity="0" />
        <g class="pz-world" id="world1"></g>
      </svg>
    </section>

    <!-- 分頁 2：氣管壁纖毛與黏液排異物 -->
    <section class="tab-stage" id="stage2">
      <svg class="sim-svg" id="svg2" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
        <rect class="pz-ref" width="1" height="1" opacity="0" />
        <g class="pz-world" id="world2"></g>
      </svg>
    </section>

    <!-- 分頁 3：肺泡與微血管氣體擴散 -->
    <section class="tab-stage" id="stage3">
      <svg class="sim-svg" id="svg3" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
        <rect class="pz-ref" width="1" height="1" opacity="0" />
        <g class="pz-world" id="world3"></g>
      </svg>
    </section>

    <!-- 分頁 4：胸腔、肋骨、橫膈與呼吸運動 -->
    <section class="tab-stage" id="stage4">
      <svg class="sim-svg" id="svg4" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
        <rect class="pz-ref" width="1" height="1" opacity="0" />
        <g class="pz-world" id="world4"></g>
      </svg>
    </section>

    <!-- 分頁 5：激烈運動、CO2 與腦幹呼吸中樞 -->
    <section class="tab-stage" id="stage5">
      <svg class="sim-svg" id="svg5" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
        <rect class="pz-ref" width="1" height="1" opacity="0" />
        <g class="pz-world" id="world5"></g>
      </svg>
    </section>

    <!-- 右下角通用縮放與重置視角控制 -->
    <div class="zoom-hud">
      <button class="zoom-btn" id="btnZoomIn" title="放大">＋</button>
      <button class="zoom-btn" id="btnZoomOut" title="縮小">－</button>
      <button class="zoom-btn" id="btnZoomReset" title="重置縮放與位置" style="font-size:0.78rem;">重置</button>
      <div class="zoom-hint">雙指縮放<br>拖曳平移</div>
    </div>
  </main>

  <!-- 底部逐步流程控制器 -->
  <footer class="step-dock">
    <div class="step-top-row">
      <div class="step-dots" id="stepDots"></div>
      <div class="step-controls">
        <button class="ctrl-btn" id="btnPrevStep">⏮ 上一步</button>
        <button class="ctrl-btn play-btn" id="btnPlayPause">⏸ 自動播放中</button>
        <button class="ctrl-btn" id="btnNextStep">下一步 ⏭</button>
      </div>
    </div>
    <div class="step-desc-box">
      <div class="step-title" id="stepTitle">載入中...</div>
      <div class="step-text" id="stepText">...</div>
    </div>
  </footer>

  <script>
    (() => {
      'use strict';

      /* =========================================================
         跨分頁統一色票常數
         ========================================================= */
      const PALETTE = {
        airway: '#f472b6',
        airwayDark: '#be185d',
        cartilage: '#22d3ee',
        cartilageDark: '#0891b2',
        lung: '#fb7185',
        lungLight: '#fda4af',
        muscle: '#e11d48',
        o2: '#ef4444',
        co2: '#3b82f6',
        mucus: '#facc15',
        bolus: '#84cc16',
        neural: '#f59e0b',
        dust: '#a855f7',
        bone: '#cbd5e1'
      };

      /* =========================================================
         全域狀態管理
         ========================================================= */
      const STATE = {
        activeTab: 0,
        showLabels: true,
        autoPlay: true,
        stepIndex: 0,
        stepTimer: 0,
        stepDuration: 3.8, // 秒

        // 分頁 1 子狀態：'swallow' (吞嚥與會厭軟骨) | 'voice' (發聲與聲帶振動)
        tab1Mode: 'swallow',
        voicePitch: 0.55,    // 0..1 聲帶緊繃度
        voiceAirflow: 0.7,   // 0..1 氣流強度
        audioEnabled: false,

        // 分頁 2 子狀態：氣管纖毛擺動速率
        ciliaSpeed: 1.0,

        // 分頁 4 子狀態：使用者是否手動拖曳橫膈
        manualDiaphragm: false,
        breathPhase: 0, // 0(呼氣末/縮小) .. 1(吸氣末/擴大)

        // 分頁 5 子狀態：運動強度 0=靜息, 1=慢跑, 2=激烈運動
        exerciseLevel: 2
      };

      /* =========================================================
         各分頁 Step-by-Step 流程定義
         ========================================================= */

      /* =========================================================
         通用 2D SVG 縮放與平移控制器 (支援滑鼠滾輪、拖曳、觸控雙指縮放)
         ========================================================= */
      class PanZoomSVG {
        constructor(svgEl) {
          this.svg = svgEl;
          this.ref = svgEl.querySelector('.pz-ref');
          this.world = svgEl.querySelector('.pz-world');
          this.scale = 1;
          this.tx = 0;
          this.ty = 0;
          this.minScale = 0.55;
          this.maxScale = 4.2;

          this.pointers = new Map();
          this.lastPinchDist = 0;
          this.lastMid = null;

          this._bindEvents();
        }

        clientToSvg(clientX, clientY) {
          const pt = this.svg.createSVGPoint();
          pt.x = clientX;
          pt.y = clientY;
          const ctm = this.ref.getScreenCTM();
          if (!ctm) return { x: 500, y: 300 };
          return pt.matrixTransform(ctm.inverse());
        }

        apply() {
          this.world.setAttribute('transform', `translate(${this.tx.toFixed(2)}, ${this.ty.toFixed(2)}) scale(${this.scale.toFixed(4)})`);
        }

        zoomAt(factor, svgX, svgY) {
          const newScale = Math.max(this.minScale, Math.min(this.maxScale, this.scale * factor));
          const wx = (svgX - this.tx) / this.scale;
          const wy = (svgY - this.ty) / this.scale;
          this.scale = newScale;
          this.tx = svgX - wx * this.scale;
          this.ty = svgY - wy * this.scale;
          this.apply();
        }

        reset() {
          this.scale = 1;
          this.tx = 0;
          this.ty = 0;
          this.apply();
        }

        _bindEvents() {
          this.svg.addEventListener('wheel', (e) => {
            e.preventDefault();
            const p = this.clientToSvg(e.clientX, e.clientY);
            const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
            this.zoomAt(factor, p.x, p.y);
          }, { passive: false });

          this.svg.addEventListener('pointerdown', (e) => {
            if (e.target.closest('[data-interactive="true"]')) return;
            this.svg.setPointerCapture(e.pointerId);
            this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (this.pointers.size === 2) {
              const pts = Array.from(this.pointers.values());
              this.lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
              this.lastMid = this.clientToSvg((pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2);
            }
          });

          this.svg.addEventListener('pointermove', (e) => {
            if (!this.pointers.has(e.pointerId)) return;
            const prev = this.pointers.get(e.pointerId);
            const curr = { x: e.clientX, y: e.clientY };
            this.pointers.set(e.pointerId, curr);

            if (this.pointers.size === 1) {
              const p0 = this.clientToSvg(prev.x, prev.y);
              const p1 = this.clientToSvg(curr.x, curr.y);
              this.tx += (p1.x - p0.x);
              this.ty += (p1.y - p0.y);
              this.apply();
            } else if (this.pointers.size === 2) {
              const pts = Array.from(this.pointers.values());
              const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
              const mid = this.clientToSvg((pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2);
              if (this.lastPinchDist > 5) {
                const factor = dist / this.lastPinchDist;
                if (this.lastMid) {
                  this.tx += (mid.x - this.lastMid.x);
                  this.ty += (mid.y - this.lastMid.y);
                }
                this.zoomAt(factor, mid.x, mid.y);
              }
              this.lastPinchDist = dist;
              this.lastMid = mid;
            }
          });

          const endPtr = (e) => {
            this.pointers.delete(e.pointerId);
            if (this.pointers.size < 2) {
              this.lastPinchDist = 0;
              this.lastMid = null;
            }
          };
          this.svg.addEventListener('pointerup', endPtr);
          this.svg.addEventListener('pointercancel', endPtr);
        }
      }

      /* SVG 輔助建立函式 */
      const SVG_NS = 'http://www.w3.org/2000/svg';
      function svgEl(tag, attrs = {}, parent = null) {
        const el = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) {
          el.setAttribute(k, v);
        }
        if (parent) parent.appendChild(el);
        return el;
      }

      function createCalloutLabel(parent, x1, y1, x2, y2, text, subText = '', borderCol = PALETTE.cartilage) {
        const g = svgEl('g', { class: 'anat-label' }, parent);
        svgEl('line', {
          x1, y1, x2, y2,
          stroke: borderCol, 'stroke-width': 1.6, 'stroke-dasharray': '3,2', opacity: 0.85
        }, g);
        svgEl('circle', { cx: x1, cy: y1, r: 3.5, fill: borderCol }, g);

        const w = Math.max(text.length * 14 + 20, subText ? subText.length * 11 + 20 : 80);
        const h = subText ? 38 : 24;
        const rx = x2 >= x1 ? x2 : x2 - w;
        const ry = y2 - h / 2;

        svgEl('rect', {
          x: rx, y: ry, width: w, height: h, rx: 6,
          fill: 'rgba(15, 23, 42, 0.9)', stroke: borderCol, 'stroke-width': 1.3
        }, g);
        const t1 = svgEl('text', {
          x: rx + w / 2, y: ry + (subText ? 15 : 16),
          fill: '#f8fafc', 'font-size': 12.5, 'font-weight': '700', 'text-anchor': 'middle'
        }, g);
        t1.textContent = text;
        if (subText) {
          const t2 = svgEl('text', {
            x: rx + w / 2, y: ry + 31,
            fill: '#94a3b8', 'font-size': 10.2, 'text-anchor': 'middle'
          }, g);
          t2.textContent = subText;
        }
        return g;
      }

        function bindOrbitEvents(dom) {
          dom.addEventListener('wheel', (e) => {
            e.preventDefault();
            camCtrl.radius = Math.max(5.5, Math.min(24, camCtrl.radius * (e.deltaY < 0 ? 0.9 : 1.1)));
          }, { passive: false });

          dom.addEventListener('pointerdown', (e) => {
            dom.setPointerCapture(e.pointerId);
            camCtrl.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (camCtrl.pointers.size === 2) {
              const pts = Array.from(camCtrl.pointers.values());
              camCtrl.lastDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
              camCtrl.lastMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
            }
          });

          dom.addEventListener('pointermove', (e) => {
            if (!camCtrl.pointers.has(e.pointerId)) return;
            const prev = camCtrl.pointers.get(e.pointerId);
            const curr = { x: e.clientX, y: e.clientY };
            camCtrl.pointers.set(e.pointerId, curr);

            if (camCtrl.pointers.size === 1) {
              const dx = curr.x - prev.x;
              const dy = curr.y - prev.y;
              if (e.shiftKey || e.buttons === 2) {
                // 平移
                camCtrl.goalTarget.x -= dx * 0.012;
                camCtrl.goalTarget.y += dy * 0.012;
              } else {
                // 旋轉
                camCtrl.theta -= dx * 0.008;
                camCtrl.phi = Math.max(0.45, Math.min(2.65, camCtrl.phi - dy * 0.008));
              }
            } else if (camCtrl.pointers.size === 2) {
              const pts = Array.from(camCtrl.pointers.values());
              const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
              const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
              if (camCtrl.lastDist > 5) {
                camCtrl.radius = Math.max(5.5, Math.min(24, camCtrl.radius * (camCtrl.lastDist / dist)));
              }
              if (camCtrl.lastMid) {
                camCtrl.goalTarget.x -= (mid.x - camCtrl.lastMid.x) * 0.012;
                camCtrl.goalTarget.y += (mid.y - camCtrl.lastMid.y) * 0.012;
              }
              camCtrl.lastDist = dist;
              camCtrl.lastMid = mid;
            }
          });

          const up = (e) => {
            camCtrl.pointers.delete(e.pointerId);
            if (camCtrl.pointers.size < 2) {
              camCtrl.lastDist = 0;
              camCtrl.lastMid = null;
            }
          };
          dom.addEventListener('pointerup', up);
          dom.addEventListener('pointercancel', up);
          dom.addEventListener('contextmenu', e => e.preventDefault());
        }

        function onResize() {
          if (!renderer || !camera) return;
          const w = container.clientWidth || window.innerWidth;
          const h = container.clientHeight || window.innerHeight;
          camera.aspect = w / Math.max(1, h);
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        }

        function focusOrgan(focusId) {
          const yMap = { nose: 3.9, pharynx: 3.3, larynx: 2.4, trachea: 1.0, bronchi: -0.5, lungs: -1.1 };
          if (yMap[focusId] !== undefined) {
            camCtrl.goalTarget.set(0, yMap[focusId] * 0.45 + 0.3, 0);
          }
        }

        function zoomBy(factor) {
          camCtrl.radius = Math.max(5.5, Math.min(24, camCtrl.radius / factor));
        }

        function resetView() {
          camCtrl.theta = 0.25;
          camCtrl.phi = 1.42;
          camCtrl.radius = 13.5;
          camCtrl.goalTarget.set(0, 0.7, 0);
        }

        function update(t) {
          if (!renderer) return;

          // 呼吸律動：吸氣與呼氣週期
          const breathWave = Math.sin(t * 1.7); // -1..1
          const inhale = Math.cos(t * 1.7) > 0; // 正在吸氣或呼氣
          const scaleVal = 1 + breathWave * 0.065;
          lungRightGroup.scale.set(scaleVal, scaleVal, scaleVal);
          lungLeftGroup.scale.set(scaleVal, scaleVal, scaleVal);

          // 橫膈收縮下降(吸氣) / 舒張上升(呼氣)
          diaphragmMesh.position.y = -3.12 - breathWave * 0.24;
          diaphragmMesh.scale.y = 0.45 - breathWave * 0.12;

          // 高亮目前步驟器官
          const steps = TAB_STEPS[0];
          const activeFocus = steps[STATE.stepIndex]?.focusId;
          for (const [id, list] of Object.entries(organMeshes)) {
            const isFocus = id === activeFocus;
            const pulse = isFocus ? 0.28 + 0.18 * Math.sin(t * 5) : 0;
            list.forEach(m => {
              if (m.material && m.material.emissive) {
                m.material.emissive.setRGB(pulse * 0.9, pulse * 0.7, pulse * 0.2);
              }
            });
          }

          // 氣體粒子流動 (吸氣紅O2向下、呼氣藍CO2向上)
          airParticles.forEach(p => {
            let u = (p.offset + (inhale ? 1 : -1) * (t * 0.28)) % 1;
            if (u < 0) u += 1;
            // 讓粒子隨正弦往復更自然
            const cycleU = Math.min(0.99, Math.max(0.01, (p.offset + 0.5 * (breathWave + 1) * 0.55) % 1));
            const curve = p.leftSide ? airCurveLeft : airCurveRight;
            const pos = curve.getPointAt(cycleU);
            p.mesh.position.copy(pos);
            p.mesh.material.color.setHex(inhale ? 0xef4444 : 0x3b82f6);
          });

          // 相機平滑過渡
          camCtrl.target.lerp(camCtrl.goalTarget, 0.08);
          camera.position.x = camCtrl.target.x + camCtrl.radius * Math.sin(camCtrl.phi) * Math.sin(camCtrl.theta);
          camera.position.y = camCtrl.target.y + camCtrl.radius * Math.cos(camCtrl.phi);
          camera.position.z = camCtrl.target.z + camCtrl.radius * Math.sin(camCtrl.phi) * Math.cos(camCtrl.theta);
          camera.lookAt(camCtrl.target);

          renderer.render(scene, camera);

          // 更新 3D 浮動標籤座標
          const w = container.clientWidth;
          const h = container.clientHeight;
          labelItems.forEach(item => {
            const v = item.pos.clone().project(camera);
            if (v.z > 1) {
              item.el.style.display = 'none';
            } else {
              item.el.style.display = 'block';
              item.el.style.left = `${(v.x * 0.5 + 0.5) * w}px`;
              item.el.style.top = `${(-v.y * 0.5 + 0.5) * h}px`;
              const isHi = (item.id === activeFocus) || (activeFocus === 'lungs' && item.id === 'diaphragm');
              item.el.classList.toggle('highlight', isHi);
            }
          });
        }

        return { init, update, onResize, focusOrgan, zoomBy, resetView };
      })();

          glottisRightCord = svgEl('path', {

          }, world);

          createCalloutLabel(world, cx - 18, cy + 10, cx - 155, cy + 125, '聲帶 (Vocal Cords)', '氣流通過時快速振動', '#fde047');
          createCalloutLabel(world, cx, cy - 82, cx + 68, cy - 125, '會厭軟骨(俯視)', '前上方軟骨瓣', PALETTE.cartilage);

          // 右下：即時聲波與發聲狀態儀表
          svgEl('rect', {
            x: 626, y: 392, width: 322, height: 158, rx: 12,
            fill: 'rgba(9, 14, 28, 0.85)', stroke: 'rgba(148,163,184,0.25)'
          }, world);
          svgEl('text', {
            x: 644, y: 418, fill: '#94a3b8', 'font-size': 12.5, 'font-weight': '600'
          }, world).textContent = '聲帶振動聲波模擬（頻率＝音調／振幅＝音量）';

          wavePath = svgEl('path', {
            d: 'M 644 480 L 930 480',
            fill: 'none', stroke: '#fde047', 'stroke-width': 2.6
          }, world);
        }

        function toggleAudio(enable) {
          STATE.audioEnabled = enable;
          if (enable) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            if (!audioCtx) {
              audioCtx = new AudioContextClass();
              osc = audioCtx.createOscillator();
              gainNode = audioCtx.createGain();
              osc.type = 'triangle';
              gainNode.gain.value = 0;
              osc.connect(gainNode);
              gainNode.connect(audioCtx.destination);
              osc.start();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
          } else if (gainNode && audioCtx) {
            gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
          }
        }

        function update(t) {
          let targetLarynxY = 0;
          let targetEpiAngle = -22; // 直立開啟
          let targetCordGap = 24;
          let vibrating = false;
          let airFlowMode = 'inhale'; // 'inhale' | 'exhale' | 'paused'
          let targetBolus = -1;

          if (STATE.tab1Mode === 'swallow') {
            if (STATE.stepIndex === 0) {
              targetLarynxY = 0;
              targetEpiAngle = -22;
              targetCordGap = 24;
              targetBolus = -1;
              airFlowMode = Math.sin(t * 2) > 0 ? 'inhale' : 'exhale';
            } else if (STATE.stepIndex === 1) {
              targetLarynxY = -6;
              targetEpiAngle = 8;
              targetCordGap = 10;
              targetBolus = 0.35; // 推進咽口
              airFlowMode = 'paused';
            } else if (STATE.stepIndex === 2) {
              // 喉頭上升 + 會厭軟骨下蓋封住氣管口！
              targetLarynxY = -26;
              targetEpiAngle = 78;
              targetCordGap = 1; // 聲門緊閉雙重保護
              targetBolus = 0.68 + 0.14 * Math.sin(t * 2.2); // 滑過會厭上方進入食道入口
              airFlowMode = 'paused';
            } else {
              targetLarynxY = 0;
              targetEpiAngle = -22;
              targetCordGap = 24;
              targetBolus = 0.98; // 食道下段
              airFlowMode = 'inhale';
            }
          } else {
            // 發聲模式
            targetLarynxY = -4;
            targetEpiAngle = -24;
            if (STATE.stepIndex === 0) {
              targetCordGap = 32;
              airFlowMode = 'inhale';
            } else if (STATE.stepIndex === 1) {
              targetCordGap = 5;
              airFlowMode = 'paused';
            } else {
              targetCordGap = 3.5;
              vibrating = true;
              airFlowMode = 'exhale';
            }
          }

          anim.larynxY += (targetLarynxY - anim.larynxY) * 0.12;
          anim.epiAngle += (targetEpiAngle - anim.epiAngle) * 0.14;
          anim.cordGap += (targetCordGap - anim.cordGap) * 0.15;

          larynxGroup.setAttribute('transform', `translate(0, ${anim.larynxY.toFixed(2)})`);
          epiglottisGroup.setAttribute('transform', `translate(316, 312) rotate(${anim.epiAngle.toFixed(1)})`);

          // 喉頭上升與會厭封閉徽章顯示
          const isSwallowPeak = (STATE.tab1Mode === 'swallow' && STATE.stepIndex === 2);
          larynxUpBadge.setAttribute('opacity', isSwallowPeak ? '1' : '0');
          epiglottisSealBadge.setAttribute('opacity', isSwallowPeak ? '1' : '0');
          softPalatePath.setAttribute('d', (STATE.tab1Mode === 'swallow' && (STATE.stepIndex === 1 || STATE.stepIndex === 2))
            ? 'M 315 210 Q 365 208 408 205' // 軟顎上抬封住鼻咽
            : 'M 315 210 Q 345 220 356 245');

          // 食團路徑插值 (口腔 -> 咽 -> 越過蓋住的會厭 -> 後方食道)
          if (targetBolus < 0) {
            bolusCircle.setAttribute('opacity', '0');
          } else {
            bolusCircle.setAttribute('opacity', '1');
            // 分段路徑
            let bx = 240, by = 236, ang = 10;
            if (targetBolus <= 0.4) {
              const k = targetBolus / 0.4;
              bx = 235 + k * 125;
              by = 236 + k * 28;
              ang = 15;
            } else if (targetBolus <= 0.78) {
              const k = (targetBolus - 0.4) / 0.38;
              bx = 360 + k * 38;
              by = 264 + k * 95;
              ang = 68;
            } else {
              const k = ((t * 0.45) % 1);
              bx = 402;
              by = 365 + k * 175;
              ang = 86;
            }
            bolusCircle.setAttribute('cx', bx.toFixed(1));
            bolusCircle.setAttribute('cy', by.toFixed(1));
            bolusCircle.setAttribute('transform', `rotate(${ang}, ${bx.toFixed(1)}, ${by.toFixed(1)})`);
          }

          // 聲帶俯視振動與音波
          const freq = 10 + STATE.voicePitch * 26;
          const vibAmp = vibrating ? (2.5 + STATE.voiceAirflow * 8.5) * Math.abs(Math.sin(t * freq)) : 0;
          const gap = anim.cordGap + vibAmp;
          const cx = 787, cy = 225;
          // 緊繃時聲帶略拉長變細
          const cordLen = vibrating || STATE.tab1Mode === 'voice' ? 62 + STATE.voicePitch * 14 : 64;

          glottisLeftCord.setAttribute('d', `M ${cx - 1.5} ${cy - cordLen} Q ${cx - gap * 0.65} ${cy} ${cx - gap} ${cy + cordLen} L ${cx - gap - 16} ${cy + cordLen} L ${cx - 15} ${cy - cordLen} Z`);
          glottisRightCord.setAttribute('d', `M ${cx + 1.5} ${cy - cordLen} Q ${cx + gap * 0.65} ${cy} ${cx + gap} ${cy + cordLen} L ${cx + gap + 16} ${cy + cordLen} L ${cx + 15} ${cy - cordLen} Z`);

          // 矢狀面聲帶振動線
          const sagVib = vibrating ? Math.sin(t * freq * 1.4) * (2.5 + STATE.voiceAirflow * 3.5) : 0;
          sagittalCordLine.setAttribute('y1', (346 + sagVib).toFixed(1));
          sagittalCordLine.setAttribute('y2', (346 - sagVib).toFixed(1));

          // 右下音波曲線
          let dWave = 'M 644 480';
          for (let x = 644; x <= 930; x += 6) {
            const u = (x - 644) / 286;
            const y = vibrating
              ? 480 + Math.sin(u * (8 + STATE.voicePitch * 22) - t * 18) * (8 + STATE.voiceAirflow * 36) * Math.sin(u * Math.PI)
              : 480;
            dWave += ` L ${x} ${y.toFixed(1)}`;
          }
          wavePath.setAttribute('d', dWave);

          // Web Audio 合成聲帶頻率
          if (STATE.audioEnabled && audioCtx && osc && gainNode) {
            if (STATE.activeTab === 1 && vibrating) {
              osc.frequency.setTargetAtTime(130 + STATE.voicePitch * 290, audioCtx.currentTime, 0.04);
              gainNode.gain.setTargetAtTime(0.02 + STATE.voiceAirflow * 0.08, audioCtx.currentTime, 0.04);
            } else {
              gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.04);
            }
          }

          // 呼吸道氣體粒子流動 (鼻腔 <-> 咽 <-> 氣管)
          const airPts = [
            { x: 140, y: 188 }, { x: 255, y: 175 }, { x: 365, y: 215 },
            { x: 365, y: 285 }, { x: 337, y: 345 }, { x: 337, y: 540 }
          ];
          airDots.forEach(dot => {
            if (airFlowMode === 'paused') {
              dot.el.setAttribute('opacity', '0.12');
              return;
            }
            dot.el.setAttribute('opacity', '0.88');
            const dir = airFlowMode === 'inhale' ? 1 : -1;
            let u = (dot.offset + dir * t * (0.32 + (vibrating ? STATE.voiceAirflow * 0.35 : 0))) % 1;
            if (u < 0) u += 1;
            const segFloat = u * (airPts.length - 1);
            const idx = Math.min(airPts.length - 2, Math.floor(segFloat));
            const frac = segFloat - idx;
            const px = airPts[idx].x + (airPts[idx + 1].x - airPts[idx].x) * frac;
            const py = airPts[idx].y + (airPts[idx + 1].y - airPts[idx].y) * frac;
            dot.el.setAttribute('cx', px.toFixed(1));
            dot.el.setAttribute('cy', py.toFixed(1));
            dot.el.setAttribute('fill', airFlowMode === 'inhale' ? PALETTE.o2 : PALETTE.co2);
          });
        }

        return { init, update, toggleAudio };
      })();

        function spawnDustParticle(randomX = false) {
          const g = svgEl('g', {}, dustGroup);
          const isBacteria = Math.random() > 0.5;
          if (isBacteria) {
            svgEl('rect', {
              x: -9, y: -5, width: 18, height: 10, rx: 5,

            }, g);
          } else {
            svgEl('polygon', {
              points: '-8,-6 2,-9 9,-2 5,8 -6,7',
              fill: '#9333ea', stroke: '#f3e8ff', 'stroke-width': 1.5
            }, g);
          }
          dustParticles.push({
            el: g,
            x: randomX ? 310 + Math.random() * 560 : 315 + Math.random() * 240,
            y: randomX ? (Math.random() > 0.35 ? 278 + Math.random() * 20 : 120 + Math.random() * 110) : 105 + Math.random() * 45,
            trapped: false
          });
          if (dustParticles.length > 28) {
            const old = dustParticles.shift();
            old.el.remove();
          }
        }

        function update(t, dt) {
          // 根據步驟調整速度視覺重點
          const stepFactor = (STATE.stepIndex === 0) ? 0.35 : STATE.ciliaSpeed;
          const waveTime = t * 5.2 * stepFactor;

          // 1. 纖毛不對稱動力衝程 (Power stroke 挺直向右掃動 ➔ Recovery stroke 彎低向左收回)
          ciliaPaths.forEach(c => {
            const phase = (waveTime - c.phaseOffset) % (Math.PI * 2);
            const normP = (phase + Math.PI * 2) % (Math.PI * 2);
            let tipDx, tipDy, ctrlDx, ctrlDy;

            if (normP < Math.PI) {
              // Power stroke：高聳挺直向右（朝向咽喉體外方向）強力推進！
              const s = normP / Math.PI; // 0 -> 1
              tipDx = -18 + s * 42;
              tipDy = -74 + Math.abs(s - 0.5) * 12;
              ctrlDx = tipDx * 0.55;
              ctrlDy = -42;
            } else {
              // Recovery stroke：壓低彎曲收回，避免把黏液往回推
              const s = (normP - Math.PI) / Math.PI; // 0 -> 1
              tipDx = 24 - s * 42;
              tipDy = -52 + Math.sin(s * Math.PI) * 14;
              ctrlDx = tipDx * 0.3 - 8;
              ctrlDy = -26;
            }

            c.el.setAttribute('d', `M ${c.baseX.toFixed(1)} ${c.baseY} Q ${(c.baseX + ctrlDx).toFixed(1)} ${(c.baseY + ctrlDy).toFixed(1)} ${(c.baseX + tipDx).toFixed(1)} ${(c.baseY + tipDy).toFixed(1)}`);
          });

          // 2. 黏液層向右（咽喉出口方向）穩定平移
          for (let i = 1; i < mucusBlobs.length; i++) {
            const b = mucusBlobs[i];
            const u = (b.offset + t * 0.11 * stepFactor) % 1;
            const bx = 315 + u * 615;
            const by = 288 + Math.sin(u * 12 + t * 3) * 4;
            b.el.setAttribute('cx', bx.toFixed(1));
            b.el.setAttribute('cy', by.toFixed(1));
          }

          // 3. 異物微粒：落下 -> 被黏液黏住 -> 被纖毛朝外推向咽喉出口
          dustParticles.forEach(p => {
            if (p.y < 276) {
              p.y += dt * (48 + (STATE.stepIndex === 1 ? 35 : 0));
              p.x += Math.sin(t * 3 + p.y * 0.05) * 0.5;
            } else {
              p.trapped = true;
              p.x += dt * 74 * stepFactor;
              p.y = 282 + Math.sin(p.x * 0.05) * 5;
            }

            // 抵達右側咽喉出口後循環補充
            if (p.x > 938) {
              p.x = 315 + Math.random() * 140;
              p.y = 115 + Math.random() * 65;
              p.trapped = false;
            }
            p.el.setAttribute('transform', `translate(${p.x.toFixed(1)}, ${p.y.toFixed(1)})`);
          });
        }

          ];
          const cfg = configs[STATE.exerciseLevel];

          breathAngle += dt * cfg.speed;
          const wave = Math.sin(breathAngle); // -1..1

          const mScaleX = 1 - Math.abs(Math.sin(t * cfg.speed * 1.1)) * (0.05 + STATE.exerciseLevel * 0.06);

          brainstemGlow.setAttribute('fill', STATE.exerciseLevel === 2 ? 'rgba(245, 158, 11, 0.58)' : 'rgba(245, 158, 11, 0.28)');

          // 3. 肺與橫膈跳動速率
          const lungScale = 1 + wave * (0.04 + cfg.amp * 0.08);
          lungAnimGroup.setAttribute('transform', `translate(500, 205) scale(${lungScale.toFixed(3)}) translate(-500, -205)`);
          const diaY = 252 + wave * (8 + cfg.amp * 18);
          diaAnimPath.setAttribute('d', `M 412 278 Q 500 ${diaY.toFixed(1)} 588 278`);
          bpmValueText.textContent = `目前呼吸頻率：約 ${cfg.bpm} 次／分鐘`;

            if (idx >= cfg.activeDots) {
              d.el.setAttribute('opacity', '0');
              return;
            }
            d.el.setAttribute('opacity', '0.92');
            const u = (d.offset + t * (0.14 + STATE.exerciseLevel * 0.14)) % 1;
            let x, y;
            if (d.toLung) {

              if (u < 0.28) { x = 819; y = 245 + (u / 0.28) * 153; }
              else if (u < 0.72) { x = 819 - ((u - 0.28) / 0.44) * 319; y = 398; }
              else { x = 500; y = 398 - ((u - 0.72) / 0.28) * 123; }
            } else {

          }
        }
        else if (STATE.activeTab === 5) {
          const card = document.createElement('div');
          card.className = 'context-card';
          card.innerHTML = `
        <div style="font-weight:700;color:#fde047;margin-bottom:5px;">⚡ 切換身體活動強度</div>
        <div class="seg-group">
          <button class="seg-btn ${STATE.exerciseLevel === 0 ? 'active' : ''}" data-lv="0">🧘 靜息</button>
          <button class="seg-btn ${STATE.exerciseLevel === 1 ? 'active' : ''}" data-lv="1">🏃 慢跑</button>
          <button class="seg-btn ${STATE.exerciseLevel === 2 ? 'active' : ''}" data-lv="2">🔥 激烈運動</button>
        </div>
      `;
          contextPanel.appendChild(card);
          card.querySelectorAll('.seg-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              STATE.exerciseLevel = parseInt(btn.dataset.lv, 10);
              renderContextPanel();
            });
          });
        }
      }

      /* =========================================================
         Step-by-Step 流程控制與 UI 綁定
         ========================================================= */
      const stepDotsEl = document.getElementById('stepDots');
      const stepTitleEl = document.getElementById('stepTitle');
      const stepTextEl = document.getElementById('stepText');
      const btnPlayPause = document.getElementById('btnPlayPause');

      function updatePlayButtonUI() {
        btnPlayPause.textContent = STATE.autoPlay ? '⏸ 自動播放中' : '▶ 自動播放';
        btnPlayPause.classList.toggle('play-btn', STATE.autoPlay);
      }

      function renderStepDock() {
        const steps = getCurrentSteps();
        if (STATE.stepIndex >= steps.length) STATE.stepIndex = 0;

        stepDotsEl.innerHTML = '';
        steps.forEach((s, idx) => {
          const b = document.createElement('button');
          b.className = `step-dot ${idx === STATE.stepIndex ? 'active' : ''}`;
          b.textContent = `${idx + 1}`;
          b.title = s.title;
          b.addEventListener('click', () => setStep(idx, false));
          stepDotsEl.appendChild(b);
        });

        const cur = steps[STATE.stepIndex];
        stepTitleEl.textContent = cur.title;
        stepTextEl.textContent = cur.text;

        if (STATE.activeTab === 0 && cur.focusId) {
          Tab0_3D.focusOrgan(cur.focusId);
        }
      }

      function setStep(index, keepPlayState = false) {
        const steps = getCurrentSteps();
        STATE.stepIndex = (index + steps.length) % steps.length;
        STATE.stepTimer = 0;
        if (!keepPlayState) {
          STATE.autoPlay = false;
          STATE.manualDiaphragm = false;
          updatePlayButtonUI();
          if (STATE.activeTab === 4) renderContextPanel();
        }
        renderStepDock();
      }

      document.getElementById('btnPrevStep').addEventListener('click', () => setStep(STATE.stepIndex - 1, false));
      document.getElementById('btnNextStep').addEventListener('click', () => setStep(STATE.stepIndex + 1, false));
      btnPlayPause.addEventListener('click', () => {
        STATE.autoPlay = !STATE.autoPlay;
        if (STATE.autoPlay) STATE.manualDiaphragm = false;
        updatePlayButtonUI();
        if (STATE.activeTab === 4) renderContextPanel();
      });

      /* 頂部標籤顯示/隱藏 & 圖例開關 */
      const btnToggleLabels = document.getElementById('btnToggleLabels');
      btnToggleLabels.addEventListener('click', () => {
        STATE.showLabels = !STATE.showLabels;
        document.body.classList.toggle('hide-labels', !STATE.showLabels);
        btnToggleLabels.classList.toggle('active', STATE.showLabels);
        btnToggleLabels.textContent = STATE.showLabels ? '🏷️ 標籤：顯示' : '🏷️ 標籤：隱藏';
      });

      const btnToggleLegend = document.getElementById('btnToggleLegend');
      const legendBar = document.getElementById('legendBar');
      btnToggleLegend.addEventListener('click', () => {
        legendBar.classList.toggle('open');
        btnToggleLegend.classList.toggle('active', legendBar.classList.contains('open'));
        setTimeout(() => Tab0_3D.onResize(), 50);
      });

      /* 右下角縮放與重置視角按鈕 */
      document.getElementById('btnZoomIn').addEventListener('click', () => {
        if (STATE.activeTab === 0) Tab0_3D.zoomBy(1.22);
        else pzControllers[STATE.activeTab].zoomAt(1.22, 500, 300);
      });
      document.getElementById('btnZoomOut').addEventListener('click', () => {
        if (STATE.activeTab === 0) Tab0_3D.zoomBy(1 / 1.22);
        else pzControllers[STATE.activeTab].zoomAt(1 / 1.22, 500, 300);
      });
      document.getElementById('btnZoomReset').addEventListener('click', () => {
        if (STATE.activeTab === 0) Tab0_3D.resetView();
        else pzControllers[STATE.activeTab].reset();
      });

      /* 分頁切換邏輯 */
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const nextTab = parseInt(btn.dataset.tab, 10);
          if (nextTab === STATE.activeTab) return;

          if (STATE.activeTab === 1 && STATE.audioEnabled) {
            Tab1_PharynxVoice.toggleAudio(false);
          }

          STATE.activeTab = nextTab;
          STATE.stepIndex = 0;
          STATE.stepTimer = 0;
          STATE.manualDiaphragm = false;

          document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.tab, 10) === nextTab));
          document.querySelectorAll('.tab-stage').forEach((st, idx) => st.classList.toggle('active', idx === nextTab));

          if (nextTab === 0) Tab0_3D.onResize();
          renderContextPanel();
          renderStepDock();
        });
      });

      /* =========================================================
         初始化所有模擬模組與主動畫迴圈
         ========================================================= */
      Tab0_3D.init();
      Tab1_PharynxVoice.init();
      Tab2_CiliaMucus.init();
      Tab3_AlveoliDiffusion.init();
      Tab4_Mechanics.init();
      Tab5_BrainstemControl.init();

      renderContextPanel();
      renderStepDock();
      updatePlayButtonUI();

      let lastTime = performance.now();
      function animate(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        const t = now / 1000;

        // 自動播放時推進 Step-by-Step 流程
        if (STATE.autoPlay) {
          STATE.stepTimer += dt;
          if (STATE.stepTimer >= STATE.stepDuration) {
            STATE.stepTimer = 0;
            const steps = getCurrentSteps();
            STATE.stepIndex = (STATE.stepIndex + 1) % steps.length;
            renderStepDock();
          }
        }

        // 僅更新當前顯示的分頁以兼顧手機平板流暢度與省電
        switch (STATE.activeTab) {
          case 0: Tab0_3D.update(t, dt); break;
          case 1: Tab1_PharynxVoice.update(t, dt); break;
          case 2: Tab2_CiliaMucus.update(t, dt); break;
          case 3: Tab3_AlveoliDiffusion.update(t, dt); break;
          case 4: Tab4_Mechanics.update(t, dt); break;
          case 5: Tab5_BrainstemControl.update(t, dt); break;
        }

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>

</html>
