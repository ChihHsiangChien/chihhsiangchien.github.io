            ctx.restore();

            // S1 頂樹突 (Apical Dendrite) 伸向皮質表面第一層 (Layer I, y=85)
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.0;
            ctx.beginPath();
            ctx.moveTo(s1Soma.x, s1Soma.y - 10);
            ctx.lineTo(s1Soma.x, 90);
            // 樹突簇 (Apical Tuft) 於皮質表層展開
            ctx.moveTo(s1Soma.x, 90); ctx.lineTo(s1Soma.x - 8, 84);
            ctx.moveTo(s1Soma.x, 90); ctx.lineTo(s1Soma.x + 8, 84);
            // 基底樹突 (Basal Dendrites) 於皮質第 IV 層展開
            ctx.moveTo(s1Soma.x - 6, s1Soma.y + 6); ctx.lineTo(s1Soma.x - 14, s1Soma.y + 13);
            ctx.moveTo(s1Soma.x + 6, s1Soma.y + 6); ctx.lineTo(s1Soma.x + 14, s1Soma.y + 13);
            ctx.stroke();

            // S1 三角形錐體胞體 (100% 位於大腦皮質灰質帶內部)
            ctx.save();
            ctx.fillStyle = '#0369a1';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.2;
            if (brainPerceptionGlow > 0) {
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 18;
            }
            ctx.beginPath();
            ctx.moveTo(s1Soma.x, s1Soma.y - 10);
            ctx.lineTo(s1Soma.x + 9, s1Soma.y + 8);
            ctx.lineTo(s1Soma.x - 9, s1Soma.y + 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(s1Soma.x, s1Soma.y + 1, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // S1 胞體皮質位置標籤
            ctx.font = 'bold 8.5px Inter, sans-serif';
            ctx.fillStyle = '#7dd3fc';
            ctx.textAlign = 'left';
            ctx.fillText('S1 感覺皮質胞體', s1Soma.x + 14, s1Soma.y + 3);

            // 感覺感知光暈波動 (Perceptual Awareness Wave)
            if (brainPerceptionGlow > 0) {
                ctx.save();
                ctx.strokeStyle = `rgba(56, 189, 248, ${brainPerceptionGlow})`;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(s1Soma.x, s1Soma.y, 16 + (1 - brainPerceptionGlow) * 35, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = `rgba(245, 158, 11, ${brainPerceptionGlow * 0.8})`;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.arc(s1Soma.x, s1Soma.y, 8 + (1 - brainPerceptionGlow) * 20, 0, Math.PI * 2);
                ctx.stroke();

                // 感知形成標籤
                ctx.font = 'bold 10px Inter, sans-serif';
                ctx.fillStyle = `rgba(254, 240, 138, ${brainPerceptionGlow})`;
                ctx.textAlign = 'left';
                ctx.fillText('💡 體感覺意識感知形成！', s1Soma.x + 16, s1Soma.y - 12);

                ctx.restore();
            }

            // -------------------------------------------------------------
            // 4. 皮質聯絡整合中繼神經元 (位於皮質灰質層內: x=585, y=106)
            // -------------------------------------------------------------
            const assocSoma = { x: 585, y: 106 };
            const betzSoma = { x: 465, y: 112 };

            // S1 錐體細胞皮質內軸突 ➔ 皮質聯絡神經元
            ctx.save();
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2.2;
            ctx.shadowColor = '#34d399';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.moveTo(s1Soma.x - 8, s1Soma.y);
            ctx.quadraticCurveTo(620, 102, assocSoma.x + 8, assocSoma.y);
            ctx.stroke();
            ctx.restore();

            // 聯絡神經元軸突 (皮質下弓狀聯絡纖維 U-fiber，繞過中央溝底部 535, 178) ➔ M1 貝茲巨型錐體細胞
            ctx.save();
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(assocSoma.x - 6, assocSoma.y + 4);
            ctx.quadraticCurveTo(535, 185, betzSoma.x + 10, betzSoma.y + 4);
            ctx.stroke();
            ctx.restore();

            // 聯絡神經元胞體 (綠，位於皮質灰質層內)
            ctx.save();
            ctx.fillStyle = brainAssocGlow > 0 ? '#10b981' : '#064e3b';
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2.2;
            if (brainAssocGlow > 0) {
                ctx.shadowColor = '#34d399';
                ctx.shadowBlur = 14;
            }
            ctx.beginPath();
            ctx.arc(assocSoma.x, assocSoma.y, 7.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(assocSoma.x, assocSoma.y, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // 聯絡整合標籤
            if (brainAssocGlow > 0) {
                ctx.font = 'bold 9px Inter, sans-serif';
                ctx.fillStyle = `rgba(110, 231, 183, ${brainAssocGlow})`;
                ctx.textAlign = 'center';
                ctx.fillText('⚙️ 運動程序編排規劃中...', assocSoma.x, assocSoma.y - 14);
            }
            ctx.restore();

            // -------------------------------------------------------------
            // 5. M1 貝茲巨型錐體細胞 (位於中央前回大腦皮質第 V 層內: x=465, y=112)
            // -------------------------------------------------------------
            // 巨大頂樹突 (Apical Trunk) 向上伸至皮質第一層 (Layer I, y=85)
            ctx.strokeStyle = '#c084fc';
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(betzSoma.x, betzSoma.y - 14);
            ctx.lineTo(betzSoma.x, 89);
            // 頂樹突茂盛終端樹 (於皮質表層展開)
            ctx.moveTo(betzSoma.x, 89); ctx.lineTo(betzSoma.x - 10, 83);
            ctx.moveTo(betzSoma.x, 89); ctx.lineTo(betzSoma.x + 10, 83);
            ctx.moveTo(betzSoma.x, 95); ctx.lineTo(betzSoma.x - 8, 90);
            // 基底樹突 (Basal Dendrites) 延伸於皮質第五層內
            ctx.moveTo(betzSoma.x - 10, betzSoma.y + 8); ctx.lineTo(betzSoma.x - 20, betzSoma.y + 14);
            ctx.moveTo(betzSoma.x + 10, betzSoma.y + 8); ctx.lineTo(betzSoma.x + 20, betzSoma.y + 14);
            ctx.stroke();

            // 巨型三角形錐體胞體 (Layer V Giant Soma, 100% 位於大腦皮質灰質層內)
            ctx.save();
            ctx.fillStyle = brainBetzGlow > 0 ? '#d946ef' : '#581c87';
            ctx.strokeStyle = '#e879f9';
            ctx.lineWidth = 2.6;
            if (brainBetzGlow > 0) {
                ctx.shadowColor = '#e879f9';
                ctx.shadowBlur = 20;
            }
            ctx.beginPath();
            ctx.moveTo(betzSoma.x, betzSoma.y - 14);
            ctx.lineTo(betzSoma.x + 13, betzSoma.y + 12);
            ctx.lineTo(betzSoma.x - 13, betzSoma.y + 12);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(betzSoma.x, betzSoma.y + 1, 3.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // M1 胞體皮質位置標籤
            ctx.font = 'bold 8.5px Inter, sans-serif';
            ctx.fillStyle = '#e879f9';
            ctx.textAlign = 'right';
            ctx.fillText('M1 貝茲運動胞體', betzSoma.x - 16, betzSoma.y + 3);

            // 貝茲細胞激發光波
            if (brainBetzGlow > 0) {
                ctx.save();
                ctx.strokeStyle = `rgba(232, 121, 249, ${brainBetzGlow})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(betzSoma.x, betzSoma.y, 18 + (1 - brainBetzGlow) * 40, 0, Math.PI * 2);
                ctx.stroke();

                ctx.font = 'bold 10px Inter, sans-serif';
                ctx.fillStyle = `rgba(253, 224, 71, ${brainBetzGlow})`;
                ctx.textAlign = 'right';
                ctx.fillText('⚡ 貝茲巨錐體細胞激發！隨意運動指令發出！', betzSoma.x - 22, betzSoma.y - 12);
                ctx.restore();
            }

            // -------------------------------------------------------------
            // 6. 下行皮質脊髓束 (Corticospinal / Pyramidal Tract)
            // 自 M1 皮質胞體出發 ➔ 穿經放射冠 ➔ 內囊後肢 ➔ 中腦大腦腳 ➔ 橋腦基底 ➔ 延髓錐體 ➔ 錐體交叉跨越中線 ➔ 脊髓
            // -------------------------------------------------------------
            ctx.save();
            ctx.strokeStyle = '#c084fc';
            ctx.lineWidth = 3.2;
            ctx.shadowColor = '#c084fc';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(betzSoma.x, betzSoma.y + 12);
            ctx.quadraticCurveTo(482, 235, 505, 350); // 放射冠至內囊後肢
            ctx.quadraticCurveTo(508, 435, 508, 520); // 中腦大腦腳至橋腦基底
            ctx.lineTo(508, 618);                     // 延髓錐體上段
            // 錐體交叉 (85% 跨越中線 x=512 向對側偏折)
            ctx.quadraticCurveTo(502, 640, 494, 662);
            // 對側脊髓側索下行直達脊髓前角運動神經元
            ctx.lineTo(494, 720);
            ctx.stroke();
            ctx.restore();

            // 髓鞘裝飾節段 (Myelin Sheaths along Pyramidal Tract)
            ctx.save();
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 5.5;
            const myelinSegments = [
                { x: 478, y: 200 },
                { x: 490, y: 265 },
                { x: 502, y: 335 },
                { x: 507, y: 445 },
                { x: 508, y: 520 },
                { x: 508, y: 585 },
            ];
            myelinSegments.forEach(m => {
                ctx.beginPath();
                ctx.arc(m.x, m.y, 3, 0, Math.PI * 2);
                ctx.stroke();
            });
            ctx.restore();

            ctx.restore();
        }

        // 大腦脈衝與訊號模擬迴圈
        function updateAndDrawBrainSimulation() {
            // 光暈漸退
            if (brainPerceptionGlow > 0) brainPerceptionGlow -= 0.015;
            if (brainBetzGlow > 0) brainBetzGlow -= 0.015;
            if (brainThalamusGlow > 0) brainThalamusGlow -= 0.02;
            if (brainAssocGlow > 0) brainAssocGlow -= 0.02;

            for (let i = brainPulses.length - 1; i >= 0; i--) {
                const p = brainPulses[i];
                p.progress += p.speed * globalSpeedMultiplier;

                if (p.stage === 'ascending') {
                    // 自脊髓 (530, 720) 經延髓、橋腦、中腦前往視丘 (615, 385)
                    // 與第三分頁上行脈衝統一為金黃色發光光點
                    let pt;
                    if (p.progress < 0.5) {
                        const t = p.progress / 0.5;
                        pt = getQuadBezierPoint({ x: 530, y: 720 }, { x: 532, y: 620 }, { x: 538, y: 525 }, t);
                    } else {
                        const t = (p.progress - 0.5) / 0.5;
                        pt = getQuadBezierPoint({ x: 538, y: 525 }, { x: 545, y: 445 }, { x: 615, y: 385 }, t);
                    }
                    drawAmberGlowingSpark(pt.x, pt.y);

                    if (p.progress >= 1.0) {
                        brainPulses.splice(i, 1);
                        brainThalamusGlow = 1.0;
                        synapticFlashes.push({ x: 615, y: 385, radius: 6, alpha: 1.0, color: '#f59e0b' });

                        // 視丘接獲感覺：若在 full 或 sensory 模式，向下一個節點 (S1皮質胞體) 傳遞！
                        if (p.mode === 'full' || p.mode === 'sensory') {
                            brainPulses.push({
                                stage: 'thalamocortical',
                                progress: 0.0,
                                speed: 0.024,
                                mode: p.mode
                            });
                        }
                    }
                } else if (p.stage === 'thalamocortical') {
                    // 自視丘 (615, 367) 經內囊與放射冠深入 S1 皮質錐體神經元胞體 (655, 110)
                    let pt;
                    if (p.progress < 0.5) {
                        const t = p.progress / 0.5;
                        pt = getQuadBezierPoint({ x: 615, y: 367 }, { x: 555, y: 330 }, { x: 608, y: 225 }, t);
                    } else {
                        const t = (p.progress - 0.5) / 0.5;
                        pt = getQuadBezierPoint({ x: 608, y: 225 }, { x: 642, y: 160 }, { x: 655, y: 110 }, t);
                    }
                    drawAmberGlowingSpark(pt.x, pt.y);

                    if (p.progress >= 1.0) {
                        brainPulses.splice(i, 1);
                        brainPerceptionGlow = 1.0;
                        synapticFlashes.push({ x: 655, y: 110, radius: 8, alpha: 1.0, color: '#38bdf8' });

                        // S1 產生感覺感知！若為完整迴路，接續啟動皮質聯絡整合
                        if (p.mode === 'full') {
                            brainPulses.push({
                                stage: 'association_s1_to_assoc',
                                progress: 0.0,
                                speed: 0.026,
                                mode: 'full'
                            });
                        }
                    }
                } else if (p.stage === 'association_s1_to_assoc') {
                    // 自 S1 皮質胞體 (655, 110) 經皮質內纖維前往聯絡神經元胞體 (585, 106)
                    const pt = getQuadBezierPoint({ x: 655, y: 110 }, { x: 620, y: 102 }, { x: 585, y: 106 }, p.progress);
                    drawGreenGlowingSpark(pt.x, pt.y);

                    if (p.progress >= 1.0) {
                        brainPulses.splice(i, 1);
                        brainAssocGlow = 1.0;
                        synapticFlashes.push({ x: 585, y: 106, radius: 7, alpha: 1.0, color: '#34d399' });

                        // 聯絡神經元完成動作編排，沿皮質下 U-fiber 弓狀纖維發射至 M1 貝茲細胞
                        brainPulses.push({
                            stage: 'association_assoc_to_m1',
                            progress: 0.0,
                            speed: 0.026,
                            mode: p.mode
                        });
                    }
                } else if (p.stage === 'association_assoc_to_m1') {
                    // 自聯絡神經元 (585, 106) 沿 U-fiber 繞過中央溝底部前往 M1 貝茲細胞 (465, 112)
                    const pt = getQuadBezierPoint({ x: 585, y: 110 }, { x: 535, y: 185 }, { x: 465, y: 112 }, p.progress);
                    drawGreenGlowingSpark(pt.x, pt.y);

                    if (p.progress >= 1.0) {
                        brainPulses.splice(i, 1);
                        brainBetzGlow = 1.0;
                        synapticFlashes.push({ x: 465, y: 112, radius: 10, alpha: 1.0, color: '#e879f9' });

                        // 若為 full 模式（或開啟跨分頁接續），貝茲巨型錐體細胞激發後啟動下行皮質脊髓束
                        if (p.mode === 'full' || linkBundleBrainSignal) {
                            brainPulses.push({
                                stage: 'corticospinal',
                                progress: 0.0,
                                speed: 0.022,
                                mode: p.mode
                            });
                        }
                    }
                } else if (p.stage === 'corticospinal') {
                    // 自 M1 皮質貝茲細胞 (465, 124) 沿錐體束下行：放射冠 ➔ 內囊 ➔ 中腦/橋腦/延髓 ➔ 錐體交叉 ➔ 脊髓 (494, 720)
                    let pt;
                    if (p.progress < 0.35) {
                        const t = p.progress / 0.35;
                        pt = getQuadBezierPoint({ x: 465, y: 124 }, { x: 482, y: 235 }, { x: 505, y: 350 }, t);
                    } else if (p.progress < 0.72) {
                        const t = (p.progress - 0.35) / 0.37;
                        pt = getQuadBezierPoint({ x: 505, y: 350 }, { x: 508, y: 480 }, { x: 508, y: 618 }, t);
                    } else {
                        const t = (p.progress - 0.72) / 0.28;
                        pt = getQuadBezierPoint({ x: 508, y: 618 }, { x: 498, y: 650 }, { x: 494, y: 720 }, t);
                    }
                    drawPurpleGlowingSpark(pt.x, pt.y);

                    if (p.progress >= 1.0) {
                        brainPulses.splice(i, 1);
                        synapticFlashes.push({ x: 494, y: 720, radius: 12, alpha: 1.0, color: '#c084fc' });

                        // 若勾選「跨分頁接續第三分頁訊號」，下行錐體束抵達脊髓出口後自動切回第3分頁並驅動下行運動至肌肉收縮！
                        if (linkBundleBrainSignal) {
                            setTimeout(() => {
                                if (currentTab === 'brain' && linkBundleBrainSignal) {
                                    switchTab('bundle');
                                    triggerBundleDescending('all');
                                }
                            }, 220);
                        }
                    }
                }
            }
        }

        // 觸發大腦下行運動指令

        // 發光粒子與光點繪製

        function drawBlueGlowingSpark(x, y) {

            ctx.shadowBlur = 18;
            ctx.fillStyle = 'rgba(14, 165, 233, 0.45)';

            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(x, y, 5.5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x, y, 2.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

            ctx.save();

            ctx.fillStyle = 'rgba(52, 211, 153, 0.45)';

            ctx.strokeStyle = '#34d399';

            ctx.fill();
            ctx.restore();
        }

        function drawRedGlowingSpark(x, y) {
            ctx.save();
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 18;
            ctx.fillStyle = 'rgba(244, 63, 94, 0.45)';
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);

            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 2.5;

        function drawAmberGlowingSpark(x, y) {
            ctx.save();
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 18;
            ctx.fillStyle = 'rgba(245, 158, 11, 0.45)';

            ctx.arc(x, y, 2.5, 0, Math.PI * 2);
            ctx.fill();

        }

        function drawPurpleGlowingSpark(x, y) {
            ctx.save();
            ctx.shadowColor = '#c084fc';
            ctx.shadowBlur = 18;
            ctx.fillStyle = 'rgba(192, 132, 252, 0.45)';
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#e879f9';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(x, y, 5.5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x, y, 2.8, 0, Math.PI * 2);

        }

        function drawSynapticFlashes() {
            for (let i = synapticFlashes.length - 1; i >= 0; i--) {
                const flash = synapticFlashes[i];
                ctx.save();
                ctx.strokeStyle = flash.color;
                ctx.lineWidth = 2;
                ctx.globalAlpha = flash.alpha;
                ctx.beginPath();
                ctx.arc(flash.x, flash.y, 6 + (1 - flash.alpha) * 16, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                flash.alpha -= 0.05;
                if (flash.alpha <= 0) synapticFlashes.splice(i, 1);
            }
        }

        // ==========================================
        // 互動事件處理 (平移、縮放、點擊激發)
        // ==========================================
        function resizeCanvas() {
            const container = document.getElementById('canvasContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function screenToWorld(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left - offsetX) / scale,
                y: (clientY - rect.top - offsetY) / scale
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            mouseDownX = e.clientX;
            mouseDownY = e.clientY;
            startDragX = e.clientX - offsetX;
            startDragY = e.clientY - offsetY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX = e.clientX - startDragX;
                offsetY = e.clientY - startDragY;
                return;
            }

            const pos = screenToWorld(e.clientX, e.clientY);

            if (currentTab === 'sensory') {
                hoveredSensoryIndex = -1;
                for (let i = 0; i < sensoryData.length; i++) {
                    const y = 96 + i * 65;
                    if (pos.x >= 28 && pos.x <= 235 && pos.y >= y - 24 && pos.y <= y + 24) {
                        hoveredSensoryIndex = i;
                        break;
                    }
                }
                canvas.style.cursor = (hoveredSensoryIndex !== -1) ? 'pointer' : 'default';

            } else if (currentTab === 'motor') {
                hoveredMotorIndex = -1;
                for (let i = 0; i < motorData.length; i++) {
                    const y = 100 + i * 95;
                    if (pos.x >= 35 && pos.x <= 250 && pos.y >= y - 35 && pos.y <= y + 35) {
                        hoveredMotorIndex = i;
                        break;
                    }
                }
                canvas.style.cursor = (hoveredMotorIndex !== -1) ? 'pointer' : 'default';

            } else if (currentTab === 'bundle') {
                let hover = false;
                // 檢查是否在受器或動器區域
                if (pos.x >= 45 && pos.x <= 180 && pos.y >= 88 && pos.y <= 560) {
                    hover = true;
                }
                canvas.style.cursor = hover ? 'pointer' : 'default';

            } else if (currentTab === 'brain') {
                brainHoverTarget = null;
                if (Math.hypot(pos.x - 615, pos.y - 375) < 28) {
                    brainHoverTarget = { x: 615, y: 375, text: '視丘 (Thalamus VPL/VPM) · 點擊激發感覺中繼' };
                } else if (Math.hypot(pos.x - 655, pos.y - 110) < 32) {
                    brainHoverTarget = { x: 655, y: 110, text: '初級體感覺皮質胞體 (S1) · 點擊激發感知' };
                } else if (Math.hypot(pos.x - 585, pos.y - 106) < 28) {
                    brainHoverTarget = { x: 585, y: 106, text: '皮質聯絡整合神經元 · 點擊規劃運動程式' };
                } else if (Math.hypot(pos.x - 465, pos.y - 112) < 32) {
                    brainHoverTarget = { x: 465, y: 112, text: '初級運動皮質 (M1 貝茲胞體) · 點擊發送錐體束' };
                } else if (pos.x >= 510 && pos.x <= 555 && pos.y >= 675 && pos.y <= 740) {
                    brainHoverTarget = { x: 530, y: 720, text: '脊髓/腦幹感覺上行 · 點擊激發完整閉環' };
                } else if (pos.x >= 475 && pos.x <= 510 && pos.y >= 675 && pos.y <= 740) {
                    brainHoverTarget = { x: 494, y: 720, text: '下行皮質脊髓束出口 · 點擊激發下行運動' };
                }
                canvas.style.cursor = brainHoverTarget ? 'pointer' : 'default';
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            const dragDist = Math.hypot(e.clientX - mouseDownX, e.clientY - mouseDownY);
            isDragging = false;

            if (dragDist < 6) {
                const pos = screenToWorld(e.clientX, e.clientY);

                if (currentTab === 'sensory') {
                    for (let i = 0; i < sensoryData.length; i++) {
                        const y = 96 + i * 65;
                        if (pos.x >= 28 && pos.x <= 235 && pos.y >= y - 24 && pos.y <= y + 24) {
                            triggerSensory(sensoryData[i].id);
                            return;
                        }
                    }

                } else if (currentTab === 'motor') {
                    for (let i = 0; i < motorData.length; i++) {
                        const y = 100 + i * 95;
                        if (pos.x >= 35 && pos.x <= 250 && pos.y >= y - 35 && pos.y <= y + 35) {
                            triggerMotor(motorData[i].id);
                            return;
                        }
                    }

                } else if (currentTab === 'bundle') {
                    // 點擊左側卡片切換顯示或激發
                    if (pos.x >= 45 && pos.x <= 180) {
                        if (pos.y >= 88 && pos.y <= 138) {
                            if (!bundleLayers.sensory1) { toggleBundleLayer('sensory1'); }
                            else { triggerBundleAction('sensory1'); }
                        } else if (pos.y >= 150 && pos.y <= 200) {
                            if (!bundleLayers.sensory2) { toggleBundleLayer('sensory2'); }
                            else { triggerBundleAction('sensory2'); }
                        } else if (pos.y >= 212 && pos.y <= 262) {
                            if (!bundleLayers.sensory3) { toggleBundleLayer('sensory3'); }
                            else { triggerBundleAction('sensory3'); }
                        } else if (pos.y >= 368 && pos.y <= 458) {
                            if (!bundleLayers.muscle1) { toggleBundleLayer('muscle1'); }
                            else { triggerBundleAction('motor1'); }
                        } else if (pos.y >= 474 && pos.y <= 564) {
                            if (!bundleLayers.muscle2) { toggleBundleLayer('muscle2'); }
                            else { triggerBundleAction('motor2'); }
                        }
                    }

                } else if (currentTab === 'brain') {
                    if (brainHoverTarget) {
                        if (brainHoverTarget.text.includes('視丘')) triggerBrainSimulation('sensory');
                        else if (brainHoverTarget.text.includes('體感覺')) triggerBrainSimulation('sensory');
                        else if (brainHoverTarget.text.includes('聯絡')) triggerBrainSimulation('association');
                        else if (brainHoverTarget.text.includes('運動皮質') || brainHoverTarget.text.includes('貝茲') || brainHoverTarget.text.includes('下行')) triggerBrainSimulation('motor');
                        else if (brainHoverTarget.text.includes('感覺上行')) triggerBrainSimulation('full');
                    }
                }
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const worldX = (mouseX - offsetX) / scale;
            const worldY = (mouseY - offsetY) / scale;

            const factor = 1.12;
            if (e.deltaY < 0) {
                scale = Math.min(scale * factor, 2.6);
            } else {
                scale = Math.max(scale / factor, 0.45);
            }
            offsetX = mouseX - worldX * scale;
            offsetY = mouseY - worldY * scale;
        }, { passive: false });

        // ==========================================
        // 面板與按鈕事件綁定
        // ==========================================
        document.getElementById('tabBtnSensory').addEventListener('click', () => switchTab('sensory'));
        document.getElementById('tabBtnMotor').addEventListener('click', () => switchTab('motor'));
        document.getElementById('tabBtnBundle').addEventListener('click', () => switchTab('bundle'));
        document.getElementById('tabBtnBrain').addEventListener('click', () => switchTab('brain'));

        document.getElementById('stimulateAllBtn').addEventListener('click', () => {
            if (currentTab === 'sensory') {
                sensoryData.forEach(s => triggerSensory(s.id));
            } else if (currentTab === 'motor') {
                motorData.forEach(m => triggerMotor(m.id));
            } else if (currentTab === 'bundle') {
                triggerBundleReflex('all');
            } else if (currentTab === 'brain') {
                triggerBrainSimulation(brainMode || 'full');
            }
        });

        document.getElementById('resetViewBtn').addEventListener('click', () => {
            autoFitView();
            activePulses = [];
            bundlePulses = [];
            brainPulses = [];
            synapticFlashes = [];
        });

        const rightPanel = document.getElementById('rightPanel');
        const toggleRightPanelBtn = document.getElementById('toggleRightPanelBtn');
        const closeRightPanelBtn = document.getElementById('closeRightPanelBtn');
        const floatingOpenPanelBtn = document.getElementById('floatingOpenPanelBtn');
        const togglePanelIcon = document.getElementById('togglePanelIcon');
        const togglePanelText = document.getElementById('togglePanelText');
        let isPanelOpen = true;

        function togglePanel(open) {
            isPanelOpen = (open !== undefined) ? open : !isPanelOpen;
            if (isPanelOpen) {
                rightPanel.classList.remove('hidden', 'w-0');
                rightPanel.classList.add('w-80', 'sm:w-96');
                floatingOpenPanelBtn.classList.add('hidden');
                togglePanelIcon.innerText = '▶';
                togglePanelText.innerText = '收起面板';
            } else {
                rightPanel.classList.add('hidden');
                rightPanel.classList.remove('w-80', 'sm:w-96');
                floatingOpenPanelBtn.classList.remove('hidden');
                togglePanelIcon.innerText = '◀';
                togglePanelText.innerText = '展開面板';
            }
            setTimeout(() => {
                resizeCanvas();
                autoFitView();
            }, 310);
        }

        toggleRightPanelBtn.addEventListener('click', () => togglePanel());
        closeRightPanelBtn.addEventListener('click', () => togglePanel(false));
        floatingOpenPanelBtn.addEventListener('click', () => togglePanel(true));

        // 啟動加載
        window.addEventListener('load', () => {
            resizeCanvas();
            const urlParams = new URLSearchParams(window.location.search);
            const tabParam = urlParams.get('tab');
            if (tabParam && ['sensory', 'motor', 'bundle', 'brain'].includes(tabParam)) {
                switchTab(tabParam);
                const reflexParam = urlParams.get('reflex');
                if (tabParam === 'bundle' && reflexParam) {
                    setTimeout(() => triggerBundleReflex(reflexParam), 350);
                }
            } else {
                switchTab('sensory');
            }
            window.addEventListener('resize', () => {
                resizeCanvas();
            });
            drawSimulation();
        });
    </script>
</body>
</html>
