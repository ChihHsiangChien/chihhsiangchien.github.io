            const inv = 1 - t;
            return {
                x: inv * inv * p0.x + 2 * inv * t * p1.x + t * t * p2.x,
                y: inv * inv * p0.y + 2 * inv * t * p1.y + t * t * p2.y

            };
        }

                    const contentW = 1080;
                    const contentH = 760;
                    scale = Math.min(availW / contentW, availH / contentH, 1.12);

                    offsetY = Math.max(10, (canvas.height - contentH * scale) / 2);
                }
            }

        function selectSensory(id) {
            selectedSensoryId = id;
            updateRightPanel();
        }

        function triggerSensory(id) {
            selectSensory(id);
            const idx = sensoryData.findIndex(s => s.id === id);
            if (idx === -1) return;
            const rec = sensoryData[idx];
            const y = 96 + idx * 65;

            activePulses.push({
                type: 'sensory',
                id: id,
                startX: 220,
                endX: 830, // 纖維終點：深入脊髓後角灰質內部！
                y: y,
                progress: 0.0,
                speed: rec.speedNormalized,
                isMyelinated: rec.isMyelinated
            });
        }

        function selectMotor(id) {
            selectedMotorId = id;
            updateRightPanel();
        }

        function triggerMotor(id) {
            selectMotor(id);
            const idx = motorData.findIndex(m => m.id === id);
            if (idx === -1) return;
            const mot = motorData[idx];
            const y = 100 + idx * 95;

            if (mot.isTwoNeuronChain) {
                // 自律神經兩段式傳導：
                // 階段 1：脊髓灰質側角 (765) ➔ 自律神經節 (470)
                activePulses.push({
                    type: 'motor_preganglionic',
                    id: id,
                    startX: 765,
                    endX: 470,
                    y: y,
                    progress: 0.0,
                    speed: mot.speedNormalized,
                    isMyelinated: true
                });
            } else {
                // 體運動神經元一段式直達：
                activePulses.push({
                    type: 'motor',
                    id: id,
                    startX: 765,
                    endX: 174,
                    y: y,
                    progress: 0.0,
                    speed: mot.speedNormalized,
                    isMyelinated: mot.isMyelinated
                });
            }
        }

        // ==========================================
        // 繪圖核心迴圈
        // ==========================================
        function drawSimulation() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            if (currentTab === 'sensory') {
                drawSensoryTab();
            } else if (currentTab === 'motor') {
                drawMotorTab();
            } else if (currentTab === 'bundle') {
                drawBundleTab();
            } else if (currentTab === 'brain') {
                drawBrainTab();
            }

            drawSynapticFlashes();

            ctx.restore();
            requestAnimationFrame(drawSimulation);
        }

function drawSensoryTab() {
            ctx.font = 'bold 12px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fde047';
            ctx.fillText('【 感覺與感覺受器 (Sensation & Receptor) 】', 100, 48);
            ctx.fillStyle = '#64748b';
            ctx.fillText('【 周邊感覺神經纖維 (Axon & Myelin) 】', 460, 48);
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('【 背根神經節 DRG (假單極胞體) 】', 680, 48);
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('【 脊髓後角縱剖柱 (Spinal Cord) 】', 840, 48);

            // 分界虛線
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 6]);
            ctx.beginPath();
            ctx.moveTo(250, 70); ctx.lineTo(250, 730);
            ctx.moveTo(645, 70); ctx.lineTo(645, 730);
            ctx.stroke();
            ctx.setLineDash([]);

            // 繪製脊髓縱剖面
            drawSpinalCordColumnOnly(800, 65, 80, 660);

            // 繪製 DRG 膠囊背景
            ctx.fillStyle = 'rgba(14, 165, 233, 0.1)';
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(650, 65, 60, 660, 24);
            ctx.fill();
            ctx.stroke();

            // 繪製 10 組神經元
            sensoryData.forEach((rec, idx) => {
                const y = 96 + idx * 65;
                const isSelected = (selectedSensoryId === rec.id);
                const isHovered = (hoveredSensoryIndex === idx);

                // 1. 畫布左側標籤 (以感覺為主)
                drawSensoryCard(rec, 14, y, isSelected, isHovered);

                // 2. 受器末梢圖形 (與軸突無縫實體相連)
                drawSensoryEnding(rec, 220, y, isSelected);

                // 3. 周邊神經纖維 (統一藍色，連入 DRG T 接點)
                const fiberStartX = getFiberConnectX(rec, 220);
                drawAxonFiber(rec, fiberStartX, y, 680, y, true);

                // 4. 假單極胞體 (統一天藍色 #38bdf8，與纖維一致！)
                drawDRGSoma(rec, 680, y, isSelected);

                // 5. 中樞突進入脊髓後角
                drawCentralFiber(rec, 680, y, 825, y, isSelected);
            });

            updateAndDrawSensoryPulses();
        }

        function drawSensoryCard(rec, x, y, isSelected, isHovered) {
            ctx.save();
            ctx.fillStyle = isSelected ? 'rgba(14, 165, 233, 0.16)' : (isHovered ? 'rgba(255, 255, 255, 0.06)' : 'rgba(15, 23, 42, 0.65)');
            ctx.strokeStyle = isSelected ? 'rgba(56, 189, 248, 0.7)' : (isHovered ? 'rgba(255, 255, 255, 0.2)' : 'rgba(51, 65, 85, 0.4)');
            ctx.lineWidth = isSelected ? 1.5 : 1;
            ctx.beginPath();
            ctx.roundRect(x, y - 24, 172, 48, 8);
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 11px Inter, sans-serif';
            ctx.fillStyle = isSelected ? '#38bdf8' : (isHovered ? '#fef08a' : '#fde047');
            ctx.textAlign = 'left';
            ctx.fillText(rec.sensationMain, x + 8, y - 6);

            // 色彩圓點 (統一感覺天藍)
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(x + 11, y + 10, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = '9.5px Inter, sans-serif';
            ctx.fillStyle = isSelected ? '#e0f2fe' : '#94a3b8';
            ctx.fillText(rec.name, x + 18, y + 13);
            ctx.restore();
        }

        function getFiberConnectX(rec, rx) {
            if (rec.id === 'spindle') return rx + 19;
            if (rec.id === 'pacinian') return rx + 18;
            if (rec.id === 'meissner') return rx + 13;
            if (rec.id === 'merkel') return rx + 8;
            if (rec.id === 'ruffini') return rx + 16;
            return rx;
        }

        function drawSensoryEnding(rec, x, y, isSelected) {
            ctx.save();
            ctx.strokeStyle = isSelected ? '#38bdf8' : rec.accentColor;
            ctx.fillStyle = rec.accentColor;
            ctx.lineWidth = isSelected ? 2.5 : 1.8;

            if (rec.id === 'pacinian') {
                for (let r = 18; r >= 6; r -= 4) {
                    ctx.beginPath();
                    ctx.ellipse(x, y, r, r * 0.65, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            } else if (rec.id === 'meissner') {
                ctx.beginPath();
                ctx.roundRect(x - 13, y - 11, 26, 22, 6);
                ctx.stroke();
                for (let i = -6; i <= 6; i += 4) {
                    ctx.beginPath();
                    ctx.moveTo(x - 9, y + i);
                    ctx.lineTo(x + 9, y + i);
                    ctx.stroke();
                }
            } else if (rec.id === 'merkel') {
                ctx.beginPath();
                ctx.ellipse(x - 4, y, 12, 9, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#34d399';
                ctx.beginPath();
                ctx.arc(x + 5, y, 4, 0, Math.PI * 2);
                ctx.fill();
            } else if (rec.id === 'ruffini') {
                ctx.beginPath();
                ctx.moveTo(x - 16, y);
                ctx.quadraticCurveTo(x, y - 12, x + 16, y);
                ctx.quadraticCurveTo(x, y + 12, x - 16, y);
                ctx.stroke();
            } else if (rec.id === 'spindle') {
                ctx.fillStyle = 'rgba(251, 191, 36, 0.15)';
                ctx.beginPath();
                ctx.ellipse(x, y, 19, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.strokeStyle = '#fbbf24';
                for (let sx = -9; sx <= 9; sx += 4.5) {
                    ctx.beginPath();
                    ctx.arc(x + sx, y, 4.5, 0, Math.PI * 2);
                    ctx.stroke();
                }
            } else {
                ctx.strokeStyle = rec.accentColor;
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.moveTo(x, y); ctx.lineTo(x - 10, y - 8); ctx.lineTo(x - 18, y - 11);
                ctx.moveTo(x, y); ctx.lineTo(x - 13, y); ctx.lineTo(x - 20, y);
                ctx.moveTo(x, y); ctx.lineTo(x - 10, y + 8); ctx.lineTo(x - 18, y + 11);
                ctx.stroke();

                ctx.fillStyle = rec.accentColor;
                [-11, 0, 11].forEach((dy, i) => {
                    ctx.beginPath();
                    ctx.arc(x - (i === 1 ? 20 : 18), y + dy, 2.2, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.beginPath();
                ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawAxonFiber(rec, x1, y1, x2, y2, toRight = true) {
            ctx.save();
            ctx.strokeStyle = '#38bdf8'; // 統一感覺天藍
            ctx.lineWidth = rec.axonWidth;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            if (rec.isMyelinated) {
                const segLen = rec.myelinLen;
                const gapLen = 5;
                const mHeight = rec.myelinHeight;
                let curX = Math.min(x1, x2) + 8;
                const maxX = Math.max(x1, x2) - 18;

                while (curX + segLen < maxX) {
                    ctx.fillStyle = '#f59e0b';
                    ctx.strokeStyle = '#d97706';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.roundRect(curX, y1 - mHeight / 2, segLen, mHeight, 4);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#78350f';
                    ctx.beginPath();
                    ctx.ellipse(curX + segLen / 2, y1 - mHeight / 2 + 2, 3.5, 1.8, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(curX + segLen, y1 - rec.axonWidth / 2 - 1, gapLen, rec.axonWidth + 2);

                    curX += segLen + gapLen;
                }
            } else {
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 4]);
                ctx.beginPath();
                ctx.moveTo(x1, y1 + 3);
                ctx.lineTo(x2 - 10, y2 + 3);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            ctx.restore();
        }

        // 假單極胞體：色彩統一為天藍色 (#38bdf8)，與周邊/中樞突完全一致！
        function drawDRGSoma(rec, tx, ty, isSelected) {
            ctx.save();
            const somaX = tx;
            const somaY = ty - 21;
            const radius = 13;

            // 莖突起 (Stem)
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(somaX, somaY + radius);
            ctx.stroke();

            // 胞體外框 (天藍)
            ctx.fillStyle = isSelected ? '#0369a1' : '#0c4a6e';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(somaX, somaY, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 細胞核
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(somaX, somaY, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // T 接點
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(tx, ty, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawCentralFiber(rec, tx, ty, targetX, targetY, isSelected) {
            ctx.save();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = rec.axonWidth;
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(targetX, targetY);
            ctx.stroke();

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(targetX, targetY - 3, 3, 0, Math.PI * 2);
            ctx.arc(targetX + 5, targetY + 2, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawSpinalCordColumnOnly(x, y, w, h) {
            ctx.save();
            const grad = ctx.createLinearGradient(x, y, x + w, y);
            grad.addColorStop(0, '#090d16');
            grad.addColorStop(0.3, '#1e1b4b');
            grad.addColorStop(0.7, '#1e293b');
            grad.addColorStop(1, '#090d16');

            ctx.fillStyle = grad;
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 18);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'rgba(67, 56, 202, 0.45)';
            ctx.beginPath();
            ctx.roundRect(x + 8, y + 15, 30, h - 30, 12);
            ctx.fill();

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.moveTo(x + 55, y + 10);
            ctx.lineTo(x + 50, y + 20);
            ctx.lineTo(x + 60, y + 20);
            ctx.closePath();
            ctx.fill();

            ctx.font = '8px Inter, sans-serif';
            ctx.fillText('▲後索上行', x + 55, y + 32);
            ctx.restore();
        }

        function updateAndDrawSensoryPulses() {
            const speedMultiplier = globalSpeedMultiplier;
            for (let i = activePulses.length - 1; i >= 0; i--) {
                const p = activePulses[i];
                if (p.type !== 'sensory') continue;
                p.progress += p.speed * speedMultiplier;

                const curX = p.startX + (p.endX - p.startX) * p.progress;
                const curY = p.y;

                drawBlueGlowingSpark(curX, curY);

                if (p.progress >= 1.0) {
                    synapticFlashes.push({ x: p.endX, y: curY, radius: 4, alpha: 1.0 });
                    activePulses.splice(i, 1);
                }
            }
        }

        // =====================================================================
        // TAB 2: 脊髓橫切面與初級傳入三分岔 (單突觸、多突觸縮回與交叉上行大腦)
        // =====================================================================
        
        // =====================================================================
        // TAB 2: 運動神經元與效應器繪圖
        // 修正重點：
        // 1. 骨骼肌：體運動神經元前角發出，一段式直達運動終板！
        // 2. 腺體與平滑肌：兩段式控制 (節前 ➔ 自律神經節換元節後胞體 ➔ 節後 ➔ 腺體/平滑肌)！
        // =====================================================================
        function drawMotorTab() {
            ctx.font = 'bold 12px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#34d399';
            ctx.fillText('【 效應器：肌肉收縮 ＆ 腺體分泌 (Effectors) 】', 140, 48);
            ctx.fillStyle = '#64748b';
            ctx.fillText('【 運動神經纖維與自律神經節 (Two-Neuron Chain) 】', 470, 48);
            ctx.fillStyle = '#f43f5e';
            ctx.fillText('【 脊髓灰質前角/側角 (Soma Inside Spinal Cord) 】', 790, 48);

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 6]);
            ctx.beginPath();
            ctx.moveTo(270, 70); ctx.lineTo(270, 680);
            ctx.moveTo(690, 70); ctx.lineTo(690, 680);
            ctx.stroke();
            ctx.setLineDash([]);

            drawSpinalCordMotorSection(690, 65, 170, 610);

            motorData.forEach((mot, idx) => {
                const y = 100 + idx * 95;
                const isSelected = (selectedMotorId === mot.id);

                drawEffectorItem(mot, 140, y, isSelected);

                const isMuscle = mot.effectorType.includes('muscle') && !mot.isTwoNeuronChain;
                const connX = isMuscle ? 174 : 155;
                drawMotorAxon(mot, connX, y, 765, y, isSelected);

                drawMotorSomaInsideCord(mot, 765, y, isSelected);
            });

            updateAndDrawMotorPulses();
        }

        function drawSpinalCordMotorSection(x, y, w, h) {
            ctx.save();
            const grad = ctx.createLinearGradient(x, y, x + w, y);
            grad.addColorStop(0, '#090d16');
            grad.addColorStop(0.3, '#1e293b');
            grad.addColorStop(1, '#090d16');

            ctx.fillStyle = grad;
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 18);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'rgba(67, 56, 202, 0.55)';
            ctx.strokeStyle = 'rgba(129, 140, 248, 0.5)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(x + 45, y + 15, 80, h - 30, 16);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(x, y + 20); ctx.lineTo(x, y + h - 20);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.font = 'bold 10px Inter, sans-serif';
            ctx.fillStyle = '#c7d2fe';
            ctx.textAlign = 'center';
            ctx.fillText('脊髓灰質內部', x + 85, y + 28);
            ctx.fillText('(前角/側角核團)', x + 85, y + 42);

            ctx.font = '8px Inter, sans-serif';
            ctx.fillStyle = '#f43f5e';
            ctx.fillText('◀ 腹根出髓', x + 24, y + h - 14);
            ctx.restore();
        }

        function drawMotorSomaInsideCord(mot, x, y, isSelected) {
            ctx.save();
            const color = mot.color;
            const r = mot.isTwoNeuronChain ? 9 : 12;

            ctx.fillStyle = isSelected ? 'rgba(244, 63, 94, 0.35)' : 'rgba(15, 23, 42, 0.9)';
            ctx.strokeStyle = color;
            ctx.lineWidth = isSelected ? 2.8 : 2.0;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x, y, r * 0.32, 0, Math.PI * 2);
            ctx.fill();

            // 多極樹突
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            const angles = [-0.7, -0.3, 0.3, 0.7, Math.PI];
            angles.forEach(ang => {
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(ang) * r, y + Math.sin(ang) * r);
                ctx.lineTo(x + Math.cos(ang) * (r + 7), y + Math.sin(ang) * (r + 7));
                ctx.stroke();
            });

            ctx.font = 'bold 9.5px Inter, sans-serif';
            ctx.fillStyle = color;
            ctx.textAlign = 'left';
            ctx.fillText(mot.isTwoNeuronChain ? '側角節前胞體' : '前角運動胞體', x + 16, y + 3);
            ctx.restore();
        }

        function drawMotorAxon(mot, x1, y1, x2, y2, isSelected) {
            ctx.save();
            const color = mot.color;

            if (mot.isTwoNeuronChain) {
                // 兩段式控制 (Two-Neuron Chain)：
                const gx = mot.ganglionX || 470;

                // 1. 節前纖維 (765 ➔ gx)
                ctx.strokeStyle = color;
                ctx.lineWidth = 2.0;
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(gx + 12, y2);
                ctx.stroke();

                // 節前細髓鞘
                ctx.fillStyle = '#f59e0b';
                ctx.strokeStyle = '#d97706';
                ctx.lineWidth = 1;
                for (let cx = gx + 35; cx < x2 - 50; cx += 32) {
                    ctx.beginPath();
                    ctx.roundRect(cx, y2 - 4, 24, 8, 2);
                    ctx.fill();
                    ctx.stroke();
                }

                // 2. 自律神經節膠囊與節後神經元胞體 (gx, y2)
                ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.roundRect(gx - 22, y2 - 18, 44, 36, 10);
                ctx.fill();
                ctx.stroke();

                // 節後胞體
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(gx - 4, y2, 6.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(gx - 4, y2, 2.2, 0, Math.PI * 2);
                ctx.fill();

                // 節前突觸終端
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(gx + 4, y2, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = 'bold 8.5px Inter, sans-serif';
                ctx.fillStyle = '#fde047';
                ctx.textAlign = 'center';
                ctx.fillText('自律神經節 (換元)', gx, y2 - 22);

                // 3. 節後纖維 (gx - 22 ➔ x1)：C類無髓鞘細纖維
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.4;
                ctx.setLineDash([4, 3]);
                ctx.beginPath();
                ctx.moveTo(gx - 22, y2);
                ctx.lineTo(x1, y1);
                ctx.stroke();
                ctx.setLineDash([]);

                // 腺體接合點
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(x1, y1, 4, 0, Math.PI * 2);
                ctx.fill();

            } else {
                // 體運動神經元一段式直達：
                ctx.strokeStyle = color;
                ctx.lineWidth = mot.axonWidth;
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x1, y1);
                ctx.stroke();

                // 終板接頭
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(x1, y1, 5, 0, Math.PI * 2);
                ctx.fill();

                // 粗髓鞘
                if (mot.isMyelinated) {
                    const segLen = 34;
                    const gapLen = 5;
                    const mHeight = mot.myelinHeight;
                    let curX = x1 + 10;
                    while (curX + segLen < x2 - 75) {
                        ctx.fillStyle = '#f59e0b';
                        ctx.strokeStyle = '#d97706';
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.roundRect(curX, y1 - mHeight / 2, segLen, mHeight, 4);
                        ctx.fill();
                        ctx.stroke();

                        ctx.fillStyle = '#ef4444';
                        ctx.fillRect(curX + segLen, y1 - mot.axonWidth / 2 - 1, gapLen, mot.axonWidth + 2);
                        curX += segLen + gapLen;
                    }
                }
            }
            ctx.restore();
        }

        function drawEffectorItem(mot, x, y, isSelected) {
            ctx.save();
            const isMuscle = mot.effectorType.includes('muscle') && !mot.isTwoNeuronChain;

            if (isMuscle) {
                const isContracting = mot.contractionState > 0;
                const bulge = isContracting ? mot.contractionState * 12 : 0;
                const lengthShrink = isContracting ? mot.contractionState * 16 : 0;
                const width = 85 - lengthShrink;
                const height = 24 + bulge;
                const centerX = x - 20;

                ctx.fillStyle = isContracting ? '#ef4444' : '#b91c1c';
                ctx.strokeStyle = isContracting ? '#fca5a5' : '#f87171';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(centerX, y, width / 2, height / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 橫向弧線
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
                ctx.lineWidth = 1.3;
                const rx = width / 2;
                const ry = height / 2;
                const yFractions = [-0.68, -0.42, -0.18, 0.0, 0.18, 0.42, 0.68];
                yFractions.forEach(frac => {
                    const oy = frac * ry;
                    const xw = rx * Math.sqrt(Math.max(0, 1 - (frac * frac))) * 0.94;
                    const x1 = centerX - xw;
                    const x2 = centerX + xw;
                    const bow = frac * ry * 0.38;
                    ctx.beginPath();
                    ctx.moveTo(x1, y + oy);
                    ctx.quadraticCurveTo(centerX, y + oy + bow, x2, y + oy);
                    ctx.stroke();
                });

                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(centerX - width / 2 - 12, y - 4, 12, 8);
                ctx.fillRect(centerX + width / 2, y - 4, 12, 8);

                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(centerX + width / 2 + 12, y, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = 'bold 11px Inter, sans-serif';
                ctx.fillStyle = isContracting ? '#fef08a' : '#f8fafc';
                ctx.textAlign = 'center';
                ctx.fillText(isContracting ? `💪 ${mot.effectorName} (收縮!)` : mot.effectorName, centerX, y - 22);

                if (mot.contractionState > 0) mot.contractionState -= 0.03;

            } else if (mot.effectorType === 'muscle_smooth') {
                // 平滑肌 (膀胱逼尿肌)
                const isContracting = mot.contractionState > 0;
                const centerX = x - 20;
                ctx.fillStyle = isContracting ? '#9333ea' : '#581c87';
                ctx.strokeStyle = isContracting ? '#c084fc' : '#a855f7';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(centerX, y, 38, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.font = 'bold 10px Inter, sans-serif';
                ctx.fillStyle = '#e9d5ff';
                ctx.textAlign = 'center';
                ctx.fillText(isContracting ? '🌊 逼尿肌 (蠕動排尿!)' : mot.effectorName, centerX, y - 22);

                if (mot.contractionState > 0) mot.contractionState -= 0.03;

            } else {
                // 腺體繪製 (汗腺 / 唾液腺)
                const acinusCenterX = x - 5;
                const ductTipX = x - 58;

                // 導管朝左延伸
                ctx.fillStyle = mot.id === 'sweat' ? '#0891b2' : '#0d9488';
                ctx.strokeStyle = mot.id === 'sweat' ? '#22d3ee' : '#2dd4bf';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(ductTipX, y - 5, (acinusCenterX - ductTipX), 10, 3);
                ctx.fill();
                ctx.stroke();

                // 導管內腔
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(ductTipX - 1, y - 2.5, (acinusCenterX - ductTipX) - 2, 5);

                // 腺泡分泌部 (右側)
                const acinusGlow = (mot.secretionParticles && mot.secretionParticles.length > 0);
                ctx.fillStyle = acinusGlow ? (mot.id === 'sweat' ? '#06b6d4' : '#14b8a6') : '#0f172a';
                ctx.strokeStyle = mot.id === 'sweat' ? '#22d3ee' : '#2dd4bf';
                ctx.lineWidth = 2;
                const lobes = [
                    { ox: 0, oy: 0, r: 12 },
                    { ox: 7, oy: -8, r: 8 },
                    { ox: 7, oy: 8, r: 8 },
                    { ox: 14, oy: -3, r: 7 },
                    { ox: 14, oy: 4, r: 7 }
                ];
                lobes.forEach(lobe => {
                    ctx.beginPath();
                    ctx.arc(acinusCenterX + lobe.ox, y + lobe.oy, lobe.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                });

                ctx.font = 'bold 10px Inter, sans-serif';
                ctx.fillStyle = '#a5f3fc';
                ctx.textAlign = 'center';
                ctx.fillText(mot.effectorName, acinusCenterX + 6, y - 22);

                // 分泌微滴粒子朝左噴灑
                if (mot.secretionParticles && mot.secretionParticles.length > 0) {
                    for (let i = mot.secretionParticles.length - 1; i >= 0; i--) {
                        const p = mot.secretionParticles[i];
                        ctx.fillStyle = `rgba(${mot.id === 'sweat' ? '56, 189, 248' : '45, 212, 191'}, ${p.alpha})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();

                        p.x -= p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.025;
                        p.size *= 0.98;

                        if (p.alpha <= 0) mot.secretionParticles.splice(i, 1);
                    }
                }
            }
            ctx.restore();
        }

        function updateAndDrawMotorPulses() {
            for (let i = activePulses.length - 1; i >= 0; i--) {
                const pulse = activePulses[i];
                pulse.progress += pulse.speed * globalSpeedMultiplier;

                if (pulse.type === 'motor_preganglionic') {
                    // 自律神經節前階段 (765 ➔ 470)
                    const curX = pulse.startX + (pulse.endX - pulse.startX) * pulse.progress;
                    drawBlueGlowingSpark(curX, pulse.y);

                    if (pulse.progress >= 1.0) {
                        // 抵達神經節換元！
                        synapticFlashes.push({ x: pulse.endX, y: pulse.y, alpha: 1.0, color: '#fde047' });
                        const mot = motorData.find(m => m.id === pulse.id);
                        activePulses.splice(i, 1);

                        // 啟動節後階段 (470 ➔ 155)
                        activePulses.push({
                            type: 'motor_postganglionic',
                            id: pulse.id,
                            startX: pulse.endX,
                            endX: 155,
                            y: pulse.y,
                            progress: 0.0,
                            speed: (mot ? mot.speedNormalized : 0.012) * 1.2
                        });
                    }

                } else if (pulse.type === 'motor_postganglionic') {
                    // 自律神經節後階段 (470 ➔ 155)
                    const curX = pulse.startX + (pulse.endX - pulse.startX) * pulse.progress;
                    drawGreenGlowingSpark(curX, pulse.y);

                    if (pulse.progress >= 1.0) {
                        synapticFlashes.push({ x: pulse.endX, y: pulse.y, alpha: 1.0, color: '#22d3ee' });
                        const mot = motorData.find(m => m.id === pulse.id);
                        if (mot) {
                            if (mot.secretionParticles) {
                                for (let k = 0; k < 18; k++) {
                                    mot.secretionParticles.push({
                                        x: 140 - 58,
                                        y: pulse.y + (Math.random() - 0.5) * 6,
                                        vx: 1.2 + Math.random() * 2.8,
                                        vy: (Math.random() - 0.5) * 1.8,
                                        size: 2.5 + Math.random() * 2.5,
                                        alpha: 1.0
                                    });
                                }
                            }
                            if (mot.contractionState !== undefined) mot.contractionState = 1.0;
                        }
                        activePulses.splice(i, 1);
                    }

                } else if (pulse.type === 'motor') {
                    // 體運動神經元一段式直達 (765 ➔ 174)
                    const curX = pulse.startX + (pulse.endX - pulse.startX) * pulse.progress;
                    drawRedGlowingSpark(curX, pulse.y);

                    if (pulse.progress >= 1.0) {
                        synapticFlashes.push({ x: pulse.endX, y: pulse.y, alpha: 1.0, color: '#fde047' });
                        const mot = motorData.find(m => m.id === pulse.id);
                        if (mot && mot.contractionState !== undefined) {
                            mot.contractionState = 1.0;
                        }
                        activePulses.splice(i, 1);
                    }
                }
            }
        }

        // =====================================================================
        // TAB 3: 混合周圍神經束、DRG 與脊髓反射弧整合繪圖
        // 修正重點：
        // 1. 各受器與動器 100% 獨立開關控制
        // 2. 脊髓橫切面底圖高對比清晰呈現 (含前正中裂、後正中溝、蝴蝶灰質)
        // 3. 脊髓反射弧特點完整呈現 (單突觸牽張、多突觸縮回零延遲、交叉上行、大腦下行)
        // =====================================================================
        function drawBundleTab() {
            ctx.font = 'bold 12px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fde047';
            ctx.fillText('【 周圍感覺受器 ＆ 骨骼肌效應器群 】', 115, 62);

            ctx.fillStyle = '#e0e7ff';
            ctx.fillText('【 脊髓橫切面 (後角入 / 前角出 / 內聯絡 / 大腦下行) 】', 945, 62);

            // 1. 左側受器與動器
            drawBundleReceptorsAndEffectors();

            // 2. 脊髓橫切面白質與蝴蝶形灰質底圖 (cx=945, cy=310, rx=108, ry=145)
            drawBundleSpinalCordBase(945, 310, 108, 145);

            // 3. 腹根運動神經纖維 (走在 DRG 後方，實體連接前角運動胞體！)
            drawBundleVentralRootMotorFibers();

            // 4. 混合神經幹 (外膜/束膜與內部平行獨立纖維)
            drawBundleMixedNerveTrunk();

            // 5. 大顆背根神經節 (DRG) 與假單極胞體群
            drawBundleDRG(705, 205);

            // 6. 背根中樞突神經纖維 (深入脊髓後角灰質內部，含單突觸牽張側枝直通前角胞體！)
            drawBundleDorsalRootSensoryFibers();

            // 7. 脊髓內部神經元 (前角運動胞體、聯絡神經元、上行神經元、下行皮質脊髓束)
            drawBundleSpinalCordInternalElements(945, 310, 108, 145);

            // 8. 動態衝動傳導模擬
            updateAndDrawBundleSimulation();

            // 9. 大腦感知輝光
            if (bundleCortexGlow > 0) {
                ctx.save();
                ctx.strokeStyle = `rgba(245, 158, 11, ${bundleCortexGlow})`;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(945 + 42, 310 - 145 - 35, 16 + (1 - bundleCortexGlow) * 28, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
                bundleCortexGlow -= 0.02;
            }
        }

        // 1. 左側受器與動器繪製 (支援獨立開關，若關閉則繪製簡明可點選開關的虛線卡片)
        function drawBundleReceptorsAndEffectors() {

            } else {

        function drawBundleMuscleCard(x, y, w, h, title, subtitle, state, unitId) {
            ctx.save();
            const isContracted = state > 0;
            const bulge = isContracted ? 11 : 0;
            const muscleX = x + 62;
            const muscleY = y + 46;
            const rx = 44;
            const ry = 19 + bulge;

            ctx.fillStyle = isContracted ? 'rgba(239, 68, 68, 0.22)' : 'rgba(15, 23, 42, 0.85)';
            ctx.strokeStyle = isContracted ? '#f43f5e' : '#e11d48';
            ctx.lineWidth = isContracted ? 2.2 : 1.4;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 10);
            ctx.fill();
            ctx.stroke();

            // 肌腹本體
            ctx.fillStyle = isContracted ? '#ef4444' : '#b91c1c';
            ctx.strokeStyle = isContracted ? '#fca5a5' : '#f87171';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.ellipse(muscleX, muscleY, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 橫向弧線
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
            ctx.lineWidth = 1.2;
            const fractions = [-0.65, -0.32, 0.0, 0.32, 0.65];
            fractions.forEach(frac => {
                const oy = frac * ry;
                const xw = rx * Math.sqrt(Math.max(0, 1 - (frac * frac))) * 0.94;
                const x1 = muscleX - xw;
                const x2 = muscleX + xw;
                const bow = frac * ry * 0.36;
                ctx.beginPath();
                ctx.moveTo(x1, muscleY + oy);
                ctx.quadraticCurveTo(muscleX, muscleY + oy + bow, x2, muscleY + oy);
                ctx.stroke();
            });

            ctx.font = 'bold 10px Inter, sans-serif';
            ctx.fillStyle = isContracted ? '#fef08a' : '#f8fafc';
            ctx.textAlign = 'left';
            ctx.fillText(title, x + 8, y + 20);

            ctx.font = '8px Inter, sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText(subtitle, x + 8, y + 36);

            ctx.restore();
        }

        // 2. 脊髓橫切面底圖 (高對比度、前正中裂、後正中溝、蝴蝶灰質清晰呈現)
        function drawBundleSpinalCordBase(cx, cy, rx, ry) {

            ctx.lineTo(cx, cy + ry * 0.72); // 前正中裂
            ctx.lineTo(cx - 8, cy + ry);

            // 後正中溝中線
            ctx.strokeStyle = '#334155';

            ctx.fillStyle = '#2e1065';

            ctx.moveTo(cx - 8, cy - 8);

            ctx.bezierCurveTo(cx - 60, cy - ry * 0.25, cx - 44, cy - 6, cx - 54, cy + 10);
            // 左腹角 (運動胞體區，寬大圓潤，外緣至 870, 368)
            ctx.bezierCurveTo(cx - 75, cy + 30, cx - 75, cy + ry * 0.48, cx - 44, cy + ry * 0.56);
            ctx.bezierCurveTo(cx - 24, cy + ry * 0.50, cx - 18, cy + 22, cx - 6, cy + 10);
            // 灰質連合 (中央管周圍)

            // 右腹角 (對稱)
            ctx.bezierCurveTo(cx + 18, cy + 22, cx + 24, cy + ry * 0.50, cx + 44, cy + ry * 0.56);
            ctx.bezierCurveTo(cx + 75, cy + ry * 0.48, cx + 75, cy + 30, cx + 54, cy + 10);
            // 右背角 (對稱)
            ctx.bezierCurveTo(cx + 44, cy - 6, cx + 60, cy - ry * 0.25, cx + 73, cy - ry * 0.50);
            ctx.bezierCurveTo(cx + 55, cy - ry * 0.65, cx + 24, cy - 18, cx + 8, cy - 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 中央管
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(cx, cy, 3.8, 0, Math.PI * 2);

            // 解剖位置鮮明標籤

            ctx.restore();

        // 5. 大顆背根神經節 (DRG) 與假單極胞體群 (100% 內含於神經節內)
        function drawBundleDRG(x, y) {
            ctx.save();
            const trunkEndX = 580;
            const drgRx = 80;
            const drgRy = 85;

            ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';

            ctx.beginPath();

            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.font = 'bold 11px Inter, sans-serif';
            ctx.fillStyle = '#e0f2fe';
            ctx.textAlign = 'center';
            ctx.fillText('背根神經節 (DRG)', x, y - 60);

            const sensorySomas = [
                { id: 'sensory1', stemX: 675, fiberY: 168, somaX: 675, somaY: 148, r: 12.0, inY: 212, label: '胞體 1 (觸覺)' },
                { id: 'sensory2', stemX: 730, fiberY: 205, somaX: 730, somaY: 185, r: 13.0, inY: 232, label: '胞體 2 (痛覺)' },
                { id: 'sensory3', stemX: 675, fiberY: 242, somaX: 675, somaY: 262, r: 12.0, inY: 252, label: '胞體 3 (本體)' }
            ];

            sensorySomas.forEach(s => {
                if (!bundleLayers[s.id]) return;

                // 周邊突纖維自神經幹進入 DRG 接點
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = s.id === 'sensory2' ? 2.2 : (s.id === 'sensory3' ? 3.2 : 2.8);
                ctx.beginPath();
                ctx.moveTo(trunkEndX, s.inY);
                ctx.quadraticCurveTo(s.id === 'sensory2' ? 645 : 625, s.inY, s.stemX, s.fiberY);
                ctx.stroke();

                // T-stem 垂直短莖
                ctx.lineWidth = 2.6;
                ctx.beginPath();
                ctx.moveTo(s.stemX, s.fiberY);
                ctx.lineTo(s.somaX, s.somaY > s.fiberY ? (s.somaY - s.r) : (s.somaY + s.r));
                ctx.stroke();

                // T 型交會點結節
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(s.stemX, s.fiberY, 3.8, 0, Math.PI * 2);
                ctx.fill();

                // 假單極胞體 (天藍色)
                ctx.fillStyle = '#0c4a6e';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.arc(s.somaX, s.somaY, s.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 細胞核
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.somaX, s.somaY, s.r * 0.35, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.font = '9px Inter, sans-serif';
            ctx.fillStyle = '#7dd3fc';
            ctx.textAlign = 'center';
            ctx.fillText('假單極胞體群 (居於節內)', x, y + 68);

            ctx.restore();

                ctx.fillText('🧠 上行大腦', cx + 45, brainY - 16);
                ctx.restore();
            }

            // 前角多極運動神經元胞體 (實體連接腹根發出點)
            if (bundleLayers.muscle1) {
                drawMultipolarMotorSoma(motorSoma1.x, motorSoma1.y, 11.5, '前角運動胞體 1');
            }
            if (bundleLayers.muscle2) {
                drawMultipolarMotorSoma(motorSoma2.x, motorSoma2.y, 10.0, '前角運動胞體 2');
            }

            ctx.restore();
        }

        function drawMultipolarMotorSoma(x, y, r, label) {
            ctx.fillStyle = '#4c0519';
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x, y, r * 0.32, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 1.5;
            const dendriteOffsets = [
                { dx: 7, dy: -9 }, { dx: -8, dy: -8 }, { dx: 10, dy: 6 }, { dx: -7, dy: 8 }
            ];
            dendriteOffsets.forEach(d => {
                ctx.beginPath();
                ctx.moveTo(x + d.dx * 0.7, y + d.dy * 0.7);
                ctx.lineTo(x + d.dx * 1.5, y + d.dy * 1.5);
                ctx.stroke();
            });

            ctx.font = 'bold 9px Inter, sans-serif';
            ctx.fillStyle = '#fca5a5';
            ctx.textAlign = 'left';
            ctx.fillText(label, x + 15, y + 3);
        }

        // Tab 3 衝動傳導模擬 (幾何路徑100%貼合神經纖維，絕無回頭、脫節或懸空)
        function updateAndDrawBundleSimulation() {
            const trunkStartX = 290;
            const trunkEndX = 580;
            const entryX = 855;
            const motorSoma1 = { x: 896, y: 355 };
            const motorSoma2 = { x: 916, y: 378 };
            const dorsalHornX = 892;
            const dorsalHornY = 265;
            const interneuronX = 908;
            const interneuronY = 305;
            const cx = 945;
            const cy = 310;
            const ry = 145;

            for (let i = bundlePulses.length - 1; i >= 0; i--) {
                const p = bundlePulses[i];
                p.progress += p.speed * globalSpeedMultiplier;

                if (p.type === 'sensory') {
                    let curPt = null;
                    const fiberY = (p.fiber === 1) ? 212 : ((p.fiber === 2) ? 232 : 252);
                    const startY = (p.fiber === 1) ? 114 : ((p.fiber === 2) ? 176 : 238);
                    const stemX = (p.fiber === 2) ? 730 : 675;
                    const drgY = (p.fiber === 1) ? 168 : ((p.fiber === 2) ? 205 : 242);
                    const drgControlX = (p.fiber === 2) ? 645 : 625;
                    const rootEntryY = (p.fiber === 1) ? 235 : ((p.fiber === 2) ? 245 : 255);
                    const rootControlX = (p.fiber === 2) ? 800 : ((p.fiber === 1) ? 775 : 780);
                    const rootControlY = (p.fiber === 2) ? 215 : ((p.fiber === 1) ? 172 : 248);
                    const targetDorsalY = (p.fiber === 1) ? 255 : 265;

                    // 五段式連續精確傳導
                    if (p.progress < 0.20) {
                        // 1. 周邊受器至神經幹入口 (180, startY) ➔ (290, fiberY)
                        const t = p.progress / 0.20;
                        curPt = getCubicBezierPoint(
                            { x: 180, y: startY },
                            { x: 235, y: startY },
                            { x: 245, y: fiberY },
                            { x: trunkStartX, y: fiberY },
                            t
                        );
                    } else if (p.progress < 0.45) {
                        // 2. 混合神經幹平行直線段 (290, fiberY) ➔ (580, fiberY)
                        const t = (p.progress - 0.20) / 0.25;
                        curPt = { x: trunkStartX + (trunkEndX - trunkStartX) * t, y: fiberY };
                    } else if (p.progress < 0.65) {
                        // 3. 神經幹出端進入背根 DRG 假單極胞體接點 (580, fiberY) ➔ (stemX, drgY)
                        const t = (p.progress - 0.45) / 0.20;
                        curPt = getQuadBezierPoint(
                            { x: trunkEndX, y: fiberY },
                            { x: drgControlX, y: fiberY },
                            { x: stemX, y: drgY },
                            t
                        );
                    } else if (p.progress < 0.82) {
                        // 4. DRG 出端沿背根直抵脊髓入髓孔 (stemX, drgY) ➔ (865, rootEntryY)
                        const t = (p.progress - 0.65) / 0.17;
                        curPt = getQuadBezierPoint(
                            { x: stemX, y: drgY },
                            { x: rootControlX, y: rootControlY },
                            { x: entryX, y: rootEntryY },
                            t
                        );
                    } else {
                        // 5. 入髓後之中樞分支 (855 ➔ 灰質終點)
                        const t = (p.progress - 0.82) / 0.18;
                        if (p.reflexMode === 'stretch') {
                            // 單突觸牽張側枝：自入髓孔弧形直通前角運動胞體 1
                            curPt = getQuadBezierPoint(
                                { x: entryX, y: 255 },
                                { x: 875, y: 280 },
                                { x: motorSoma1.x, y: motorSoma1.y - 10 },
                                t
                            );
                        } else {
                            // 進入後角突觸換元終點 (892, targetDorsalY)
                            curPt = {
                                x: entryX + (dorsalHornX - entryX) * t,
                                y: rootEntryY + (targetDorsalY - rootEntryY) * t
                            };
                        }
                    }

                    if (curPt) drawBlueGlowingSpark(curPt.x, curPt.y);

                    if (p.progress >= 1.0) {
                        bundlePulses.splice(i, 1);

                        if (p.reflexMode === 'stretch') {
                            // 單突觸牽張：光點精確抵達前角運動胞體 1，激發運動神經元脈衝傳向肌肉 1
                            synapticFlashes.push({ x: motorSoma1.x, y: motorSoma1.y - 10, alpha: 1.0, color: '#fde047' });
                            if (!bundleLayers.muscle1) {
                                bundleLayers.muscle1 = true;
                                updateBundleLayerButtons();
                            }
                            bundlePulses.push({ type: 'motor1', progress: 0.0, speed: 0.030 });

                        } else if (p.reflexMode === 'withdrawal') {
                            // 多突觸縮回：光點抵達後角突觸，立即無縫啟動翠綠色聯絡神經元！
                            synapticFlashes.push({ x: dorsalHornX, y: dorsalHornY, alpha: 1.0, color: '#38bdf8' });
                            if (!bundleLayers.interneuron) {
                                bundleLayers.interneuron = true;
                                updateBundleLayerButtons();
                            }
                            bundlePulses.push({ type: 'bundle_interneuron', progress: 0.0, speed: 0.050 });

                        } else if (p.reflexMode === 'ascending') {
                            // 交叉上行：光點抵達後角，立即啟動交叉上行脈衝
                            synapticFlashes.push({ x: dorsalHornX, y: targetDorsalY, alpha: 1.0, color: '#38bdf8' });
                            if (!bundleLayers.ascending) {
                                bundleLayers.ascending = true;
                                updateBundleLayerButtons();
                            }
                            bundlePulses.push({ type: 'bundle_ascending', progress: 0.0, speed: 0.040 });
                        }

                        // 若勾選「跨分頁接續大腦中樞訊號」，任何感覺刺激入髓後若尚未啟動上行脈衝，同步啟動上行傳往大腦！
                        if (linkBundleBrainSignal && p.reflexMode !== 'ascending') {
                            const hasAscending = bundlePulses.some(bp => bp.type === 'bundle_ascending' || (bp.type === 'sensory' && bp.reflexMode === 'ascending'));
                            if (!hasAscending) {
                                if (!bundleLayers.ascending) {
                                    bundleLayers.ascending = true;
                                    updateBundleLayerButtons();
                                }
                                bundlePulses.push({ type: 'bundle_ascending', progress: 0.0, speed: 0.040 });
                            }
                        }
                    }

                } else if (p.type === 'bundle_interneuron') {
                    // 聯絡神經元傳導：後角 (900, 265) ➔ 聯絡神經元胞體 (918, 308) ➔ 前角胞體 1 (898, 335)
                    let curPt = null;
                    if (p.progress < 0.5) {
                        const t = p.progress / 0.5;
                        curPt = {
                            x: dorsalHornX + (interneuronX - dorsalHornX) * t,
                            y: dorsalHornY + (interneuronY - dorsalHornY) * t
                        };
                    } else {
                        const t = (p.progress - 0.5) / 0.5;
                        curPt = {
                            x: interneuronX + (motorSoma1.x - interneuronX) * t,
                            y: interneuronY + (motorSoma1.y - 10 - interneuronY) * t
                        };
                    }

                    if (curPt) drawGreenGlowingSpark(curPt.x, curPt.y);

                    if (p.progress >= 1.0) {
                        // 抵達前角運動胞體 1，立即激發運動神經元 1 傳導出髓！
                        synapticFlashes.push({ x: motorSoma1.x, y: motorSoma1.y - 10, alpha: 1.0, color: '#34d399' });
                        bundlePulses.splice(i, 1);
                        if (!bundleLayers.muscle1) {
                            bundleLayers.muscle1 = true;
                            updateBundleLayerButtons();
                        }
                        bundlePulses.push({ type: 'motor1', progress: 0.0, speed: 0.030 });
                    }

                } else if (p.type === 'bundle_ascending') {
                    // 交叉上行：後角 ➔ 前白連合交叉 ➔ 對側前外側索 ➔ 上行大腦皮質
                    let curPt = null;
                    if (p.progress < 0.25) {
                        const t = p.progress / 0.25;
                        curPt = getQuadBezierPoint({ x: dorsalHornX + 4, y: dorsalHornY }, { x: cx - 20, y: cy + 12 }, { x: cx, y: cy + 14 }, t);
                    } else if (p.progress < 0.50) {
                        const t = (p.progress - 0.25) / 0.25;
                        curPt = getQuadBezierPoint({ x: cx, y: cy + 14 }, { x: cx + 25, y: cy + 16 }, { x: cx + 45, y: cy + 5 }, t);
                    } else {
                        const t = (p.progress - 0.50) / 0.50;
                        curPt = { x: cx + 45, y: (cy + 5) + ((cy - ry - 35) - (cy + 5)) * t };
                    }

                    if (curPt) drawAmberGlowingSpark(curPt.x, curPt.y);

                    if (p.progress >= 1.0) {
                        bundleCortexGlow = 1.0;
                        synapticFlashes.push({ x: cx + 45, y: cy - ry - 35, alpha: 1.0, color: '#f59e0b' });
                        bundlePulses.splice(i, 1);

                        // 若開啟跨分頁接續，上行訊號抵達「上行大腦」後自動切換至第4分頁(腦部中樞)並接續上行訊號！
                        if (linkBundleBrainSignal) {
                            setTimeout(() => {
                                if (currentTab === 'bundle' && linkBundleBrainSignal) {
                                    brainMode = 'full';
                                    switchTab('brain');
                                    triggerBrainSimulation('full');
                                }
                            }, 220);
                        }
                    }

                } else if (p.type === 'descending') {
                    // 大腦皮質下行運動脈衝：自大腦下行穿入脊髓側索，分岔直接突觸於前角運動胞體！
                    const tractTopX = cx + 22;
                    const tractTopY = cy - ry + 12;
                    const forkY = cy + 10;
                    let curPt1 = null;
                    let curPt2 = null;

                    if (p.progress < 0.45) {
                        // 1. 直線沿外側索下行段
                        const t = p.progress / 0.45;
                        const curY = tractTopY + (forkY - tractTopY) * t;
                        curPt1 = { x: tractTopX, y: curY };
                        curPt2 = { x: tractTopX, y: curY };
                    } else {
                        // 2. 分岔段：穿入前角突觸於運動胞體
                        const t = (p.progress - 0.45) / 0.55;
                        curPt1 = getQuadBezierPoint({ x: tractTopX, y: forkY }, { x: cx, y: cy + 25 }, { x: motorSoma1.x + 8, y: motorSoma1.y - 8 }, t);
                        curPt2 = getQuadBezierPoint({ x: tractTopX, y: forkY }, { x: cx + 8, y: cy + 35 }, { x: motorSoma2.x + 8, y: motorSoma2.y - 8 }, t);
                    }

                    if (p.target === 'fine') {
                        if (curPt2) drawPurpleGlowingSpark(curPt2.x, curPt2.y);
                    } else {
                        if (curPt1) drawPurpleGlowingSpark(curPt1.x, curPt1.y);
                        if (curPt2) drawPurpleGlowingSpark(curPt2.x, curPt2.y);
                    }

                    if (p.progress >= 1.0) {
                        bundlePulses.splice(i, 1);
                        if (p.target === 'fine') {
                            synapticFlashes.push({ x: motorSoma2.x + 8, y: motorSoma2.y - 8, alpha: 1.0, color: '#c084fc' });
                            if (!bundleLayers.muscle2) { bundleLayers.muscle2 = true; updateBundleLayerButtons(); }
                            bundlePulses.push({ type: 'motor2', progress: 0.0, speed: 0.030 });
                        } else {
                            synapticFlashes.push({ x: motorSoma1.x + 8, y: motorSoma1.y - 8, alpha: 1.0, color: '#c084fc' });
                            synapticFlashes.push({ x: motorSoma2.x + 8, y: motorSoma2.y - 8, alpha: 1.0, color: '#c084fc' });
                            if (!bundleLayers.muscle1) { bundleLayers.muscle1 = true; }
                            if (!bundleLayers.muscle2) { bundleLayers.muscle2 = true; }
                            updateBundleLayerButtons();
                            bundlePulses.push({ type: 'motor1', progress: 0.0, speed: 0.030 });
                            bundlePulses.push({ type: 'motor2', progress: 0.0, speed: 0.030 });
                        }
                    }

                } else if (p.type === 'motor1' || p.type === 'motor2') {
                    // 腹根運動纖維脈衝：自前角運動胞體出發 ➔ 腹根 ➔ 繞行 DRG 後方 ➔ 神經幹 ➔ 肌肉運動終板！
                    const isM1 = (p.type === 'motor1');
                    const startPt = isM1 ? motorSoma1 : motorSoma2;
                    const exitControl = isM1 ? { x: 874, y: 365 } : { x: 890, y: 388 };
                    const exitPt = isM1 ? { x: 855, y: 372 } : { x: 865, y: 395 };
                    const rootMid = isM1 ? { x: 650, y: 385 } : { x: 650, y: 404 };
                    const rootMidCtrl = isM1 ? { x: 750, y: 385 } : { x: 750, y: 404 };
                    const trunkY = isM1 ? 278 : 302;
                    const trunkCtrl = isM1 ? { x: 620, y: 278 } : { x: 620, y: 302 };
                    const endY = isM1 ? 414 : 520;
                    let curPt = null;

                    if (p.progress < 0.15) {
                        // 1. 前角胞體至腹根出髓處
                        const t = p.progress / 0.15;
                        curPt = getQuadBezierPoint(startPt, exitControl, exitPt, t);
                    } else if (p.progress < 0.35) {
                        // 2. 腹根繞過 DRG 後方
                        const t = (p.progress - 0.15) / 0.20;
                        curPt = getQuadBezierPoint(exitPt, rootMidCtrl, rootMid, t);
                    } else if (p.progress < 0.50) {
                        // 3. 匯入混合神經幹末端
                        const t = (p.progress - 0.35) / 0.15;
                        curPt = getQuadBezierPoint(rootMid, trunkCtrl, { x: trunkEndX, y: trunkY }, t);
                    } else if (p.progress < 0.75) {
                        // 4. 混合神經幹內向左傳導
                        const t = (p.progress - 0.50) / 0.25;
                        curPt = { x: trunkEndX - (trunkEndX - trunkStartX) * t, y: trunkY };
                    } else {
                        // 5. 神經幹向左分岔至肌肉效應器
                        const t = (p.progress - 0.75) / 0.25;
                        curPt = getCubicBezierPoint(
                            { x: trunkStartX, y: trunkY },
                            { x: 245, y: trunkY },
                            { x: 235, y: endY },
                            { x: 180, y: endY },
                            t
                        );
                    }

                    if (curPt) drawRedGlowingSpark(curPt.x, curPt.y);

                    if (p.progress >= 1.0) {
                        bundlePulses.splice(i, 1);
                        synapticFlashes.push({ x: 180, y: endY, alpha: 1.0, color: '#f43f5e' });
                        if (isM1) bundleMuscleState1 = 1.0;
                        else bundleMuscleState2 = 1.0;
                    }
                }
            }

            if (bundleMuscleState1 > 0) bundleMuscleState1 -= 0.035;
            if (bundleMuscleState2 > 0) bundleMuscleState2 -= 0.035;
        }

        function triggerBundleReflex(mode) {
            bundleReflexMode = mode;
            if (mode === 'stretch') {
                bundleLayers.sensory3 = true;
                bundleLayers.muscle1 = true;
                updateBundleLayerButtons();
                updateRightPanel();
                bundlePulses.push({ type: 'sensory', fiber: 3, reflexMode: 'stretch', progress: 0.0, speed: 0.028 });
            } else if (mode === 'withdrawal') {
                bundleLayers.sensory2 = true;
                bundleLayers.interneuron = true;
                bundleLayers.muscle1 = true;
                updateBundleLayerButtons();
                updateRightPanel();
                bundlePulses.push({ type: 'sensory', fiber: 2, reflexMode: 'withdrawal', progress: 0.0, speed: 0.025 });
            } else if (mode === 'ascending') {
                bundleLayers.sensory1 = true;
                bundleLayers.ascending = true;
                updateBundleLayerButtons();
                updateRightPanel();
                bundlePulses.push({ type: 'sensory', fiber: 1, reflexMode: 'ascending', progress: 0.0, speed: 0.026 });
            } else if (mode === 'all') {
                bundleLayers.sensory1 = true;
                bundleLayers.sensory3 = true;
                bundleLayers.interneuron = true;
                bundleLayers.ascending = true;
                bundleLayers.muscle1 = true;
                updateBundleLayerButtons();
                updateRightPanel();
                bundlePulses = [];
                bundlePulses.push({ type: 'sensory', fiber: 3, reflexMode: 'stretch', progress: 0.0, speed: 0.028 });
                bundlePulses.push({ type: 'sensory', fiber: 2, reflexMode: 'withdrawal', progress: 0.0, speed: 0.024 });
                bundlePulses.push({ type: 'sensory', fiber: 1, reflexMode: 'ascending', progress: 0.0, speed: 0.026 });
            }
        }

        function triggerBundleDescending(target) {
            if (!bundleLayers.descending) {
                bundleLayers.descending = true;
                updateBundleLayerButtons();
                updateRightPanel();
            }
            bundlePulses.push({
                type: 'descending',
                target: target,
                progress: 0.0,
                speed: 0.028
            });
        }

        function triggerBundleAction(type) {
            if (type === 'sensory1') {
                if (!bundleLayers.sensory1) { bundleLayers.sensory1 = true; updateBundleLayerButtons(); }
                bundlePulses.push({ type: 'sensory', fiber: 1, reflexMode: 'ascending', progress: 0.0, speed: 0.026 });
            } else if (type === 'sensory2') {
                if (!bundleLayers.sensory2) { bundleLayers.sensory2 = true; updateBundleLayerButtons(); }
                bundlePulses.push({ type: 'sensory', fiber: 2, reflexMode: 'withdrawal', progress: 0.0, speed: 0.024 });
            } else if (type === 'sensory3') {
                if (!bundleLayers.sensory3) { bundleLayers.sensory3 = true; updateBundleLayerButtons(); }
                bundlePulses.push({ type: 'sensory', fiber: 3, reflexMode: 'stretch', progress: 0.0, speed: 0.028 });
            } else if (type === 'motor1') {
                if (!bundleLayers.muscle1) { bundleLayers.muscle1 = true; updateBundleLayerButtons(); }
                bundlePulses.push({ type: 'motor1', progress: 0.0, speed: 0.028 });
            } else if (type === 'motor2') {
                if (!bundleLayers.muscle2) { bundleLayers.muscle2 = true; updateBundleLayerButtons(); }
                bundlePulses.push({ type: 'motor2', progress: 0.0, speed: 0.028 });
            }
        }

        // ==========================================
        // 大腦中樞模式切換與激發
        // ==========================================
        function setBrainMode(mode) {
            brainMode = mode;
            updateBrainModeButtons();
            updateRightPanel();
        }

        function updateBrainModeButtons() {
            const btnFull = document.getElementById('modeBrainFullBtn');
            const btnSensory = document.getElementById('modeBrainSensoryBtn');
            const btnAssoc = document.getElementById('modeBrainAssocBtn');
            const btnMotor = document.getElementById('modeBrainMotorBtn');

            [btnFull, btnSensory, btnAssoc, btnMotor].forEach(b => {
                if (b) b.className = 'px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-800 text-slate-300 hover:bg-cyan-900 hover:text-white transition';
            });

            if (brainMode === 'full' && btnFull) {
                btnFull.className = 'px-2.5 py-1 text-xs font-bold rounded-lg bg-cyan-900 text-white border border-cyan-400 shadow-md transition';
            } else if (brainMode === 'sensory' && btnSensory) {
                btnSensory.className = 'px-2.5 py-1 text-xs font-bold rounded-lg bg-cyan-900 text-white border border-cyan-400 shadow-md transition';
            } else if (brainMode === 'association' && btnAssoc) {
                btnAssoc.className = 'px-2.5 py-1 text-xs font-bold rounded-lg bg-cyan-900 text-white border border-cyan-400 shadow-md transition';
            } else if (brainMode === 'motor' && btnMotor) {
                btnMotor.className = 'px-2.5 py-1 text-xs font-bold rounded-lg bg-cyan-900 text-white border border-cyan-400 shadow-md transition';
            }
        }

        function triggerBrainSimulation(type) {
            if (type === 'sensory' || type === 'full') {
                brainPulses.push({
                    stage: 'ascending',
                    progress: 0.0,
                    speed: 0.025,
                    mode: type
                });
            } else if (type === 'association') {
                brainPerceptionGlow = 0.7;
                brainPulses.push({
                    stage: 'association_s1_to_assoc',
                    progress: 0.0,
                    speed: 0.024,
                    mode: 'association'
                });
            } else if (type === 'motor') {
                brainBetzGlow = 1.0;
                brainPulses.push({
                    stage: 'corticospinal',
                    progress: 0.0,
                    speed: 0.028,
                    mode: 'motor'
                });
            }
        }

function drawBrainTab() {
            drawBrainBackdrop();
            drawBrainNeurons();
            updateAndDrawBrainSimulation();

            if (brainHoverTarget) {
                ctx.save();
                ctx.font = 'bold 11px Inter, sans-serif';
                const text = brainHoverTarget.text;
                const textW = ctx.measureText(text).width;
                const tipX = brainHoverTarget.x;
                const tipY = brainHoverTarget.y - 24;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 1.5;
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.roundRect(tipX - textW / 2 - 10, tipY - 14, textW + 20, 24, 6);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText(text, tipX, tipY + 2);
                ctx.restore();
            }
        }

        // 繪製大腦解剖底圖：大腦半球冠狀剖面、大腦皮質(中央前回/中央後回/中央溝)、放射冠、內囊、視丘、基底核、腦幹延髓
        function drawBrainBackdrop() {
