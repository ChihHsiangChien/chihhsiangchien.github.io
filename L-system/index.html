<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>L-System 碎形生成實驗室</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <span class="badge">FRACTAL</span>
        <h1>L-System 碎形生成實驗室</h1>
      </div>
      <div class="status-chips">
        <span class="chip">迭代：<strong id="lbl-gen">0</strong></span>
        <span class="chip">符號數：<strong id="lbl-len">0</strong></span>
        <a href="guide.html" class="chip" style="text-decoration:none; color:#7dd3fc; border-color:rgba(56,189,248,0.45); font-weight:700;">📖 教學指南</a>
      </div>
    </header>

    <main class="main-grid">
      <section class="canvas-card card">
        <div class="canvas-toolbar">
          <span class="hint">可直接在畫布上拖曳平移、滾輪縮放</span>
          <div class="tool-btns">
            <button id="fitBtn" class="mini-btn">🔍 自動置中</button>
            <button id="generateBtn" class="primary-btn">▶ 迭代生長</button>
            <button id="resetBtn" class="secondary-btn">🔄 重置</button>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="canvas"></canvas>
        </div>
      </section>

      <aside class="controls card">
        <div class="input-group">
          <label for="lSystemSelect">預設 L-System 範本</label>
          <select id="lSystemSelect"></select>
        </div>

        <div class="input-group">
          <label for="axiomInput">初始公理 (Axiom)</label>
          <input type="text" id="axiomInput" value="F-F-F-F" />
        </div>

        <div class="input-group">
          <label for="ruleInput">轉換規則 (例: F -> F+F-F-F+F)</label>
          <textarea id="ruleInput" rows="4"></textarea>
        </div>

        <div class="input-group">
          <label for="angleInput">旋轉角度 (°)</label>
          <input type="number" id="angleInput" value="90" min="0" max="360" step="0.1" />
        </div>

        <div class="input-group">
          <label for="scale">縮放倍率 (Scale)</label>
          <input type="range" id="scale" min="0.05" max="5" step="0.05" value="1" />
        </div>

        <div class="input-group hidden-origins">
          <label for="xOrigin">X 原點</label>
          <input type="range" id="xOrigin" min="-1000" max="2000" value="400" />
        </div>
        <div class="input-group hidden-origins">
          <label for="yOrigin">Y 原點</label>
          <input type="range" id="yOrigin" min="-1000" max="2000" value="300" />
        </div>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
