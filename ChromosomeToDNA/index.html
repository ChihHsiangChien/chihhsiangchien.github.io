<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>染色體到 DNA — 全域連續縮放 3D 觀察</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container"></div>

    <!-- 左側生物資訊與尺度面板 -->
    <aside id="info-panel" class="glass-panel">
        <div class="panel-header">
            <span id="stage-badge" class="badge">層級 1 / 4</span>
            <span id="scale-readout" class="scale-chip">~1,400 nm</span>
        </div>
        <div id="region-readout" class="region-chip">目標區位：右側染色分體 · 短臂 (p臂)</div>
        <h1 id="stage-title">中期染色體 (Metaphase Chromosome)</h1>
        <p id="stage-desc">
            將游標指向染色體上的任意位置（短臂、長臂、端粒或著絲粒）並滾動滑鼠滾輪或雙擊，即可從該處連續放大穿入內部的染色質纖維、核小體與 DNA 雙股螺旋。
        </p>

        <div id="legend-list" class="legend-list"></div>

        <div class="controls-hint">
            <span>滾輪 / 雙擊：指哪放哪</span>
            <span>左鍵：旋轉　右鍵：平移掃描</span>
        </div>
    </aside>

    <!-- 底部連續縮放導覽列 -->
    <nav id="zoom-dock" class="glass-panel" aria-label="尺度縮放控制">
        <div class="stage-pills" role="tablist">
            <button type="button" class="stage-pill active" data-zoom="0.00" data-stage="chromosome">染色體</button>
            <button type="button" class="stage-pill" data-zoom="0.34" data-stage="chromatin">染色質纖維</button>
            <button type="button" class="stage-pill" data-zoom="0.65" data-stage="nucleosome">核小體</button>
            <button type="button" class="stage-pill" data-zoom="0.96" data-stage="dna">DNA 雙股螺旋</button>
        </div>

        <div class="slider-row">
            <button type="button" id="zoom-out-btn" class="step-btn" title="縮小 (Zoom Out)" aria-label="縮小">−</button>
            <div class="slider-track-wrap">
                <input
                    type="range"
                    id="zoom-slider"
                    min="0"
                    max="1000"
                    value="0"
                    step="1"
                    aria-label="連續放大倍率"
                />
                <div class="slider-ticks" aria-hidden="true">
                    <span>1,400 nm</span>
                    <span>30 nm</span>
                    <span>11 nm</span>
                    <span>2 nm</span>
                </div>
            </div>
            <button type="button" id="zoom-in-btn" class="step-btn" title="放大 (Zoom In)" aria-label="放大">+</button>
            <button type="button" id="reset-view-btn" class="reset-btn" title="重設視角">重設</button>
        </div>
    </nav>

    <div id="loading">正在建構全域多尺度 3D 結構...</div>

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
