                    ctx.stroke();
                    ctx.restore();
                });

                // Zone 1: Passive (Simple + Channel + Carrier)
                const cyc = (state.ambientTime * 0.45) % 1;
                drawParticle('o2', -425, lerp(-110, 110, cyc), 1, 1);
                drawParticle('o2', -445, -130, 0.9, 0.85);
                drawParticle('o2', -405, -145, 0.9, 0.85);
                drawArrow(-425, -80, -425, 80, PALETTE.o2, true, 2);

                drawChannelProtein(-285, 0, 0.85, 'none', false);
                drawParticle('k', -285, lerp(-120, 120, (cyc + 0.3) % 1), 0.9, 1);

                drawCarrierProtein(-172, 0, Math.sin(state.ambientTime * 2) * 0.5 + 0.5, true);

                // Zone 2: Active (Na+/K+ Pump + Symport)
                const pConf = Math.sin(state.ambientTime * 1.8) * 0.5 + 0.5;
                drawPumpProtein(0, 0, pConf, pConf > 0.35 && pConf < 0.85, pConf < 0.5 ? 2 : 0, pConf > 0.6 ? 2 : 0);
                drawParticle('atp', 52, 85, 0.85, 0.95);
                drawCarrierProtein(125, 0, pConf, true, PALETTE.symport, PALETTE.symportDark, 'glucose');
                drawParticle('na', 125, lerp(-115, 115, cyc), 0.85, 0.9);

                // Zone 3: Bulk (Endocytosis + Exocytosis)
                drawClosedVesicleBilayer(295, lerp(-15, 110, cyc), 34, 30, 0);
                drawParticle('ldl', 295, lerp(-15, 110, cyc), 0.85, 1);
                drawArrow(295, -50, 295, 55, PALETTE.bulk, true, 2.2);

                drawClosedVesicleBilayer(415, lerp(110, -15, cyc), 34, 30, 0);
                drawParticle('cargo', 415, lerp(110, -15, cyc) - 6, 0.9, 1);
                drawParticle('cargo', 425, lerp(110, -15, cyc) + 5, 0.9, 1);
                drawArrow(415, 65, 415, -60, PALETTE.cargo, true, 2.2);

                // Labels
                drawLabel('磷脂雙層', -460, 0, -460, -22, PALETTE.lipidHead);
                drawLabel('1. 單純擴散', -425, -175, -425, -145, PALETTE.o2);
                drawLabel('2. 離子通道', -285, -175, -285, -52, PALETTE.channel);
                drawLabel('3. 載體蛋白', -172, -175, -172, -52, PALETTE.carrier);
                drawLabel('初級：鈉鉀泵 (ATP)', 0, -175, 0, -56, PALETTE.pump);
                drawLabel('次級：協同運輸', 125, -175, 125, -52, PALETTE.symport);
                drawLabel('胞吞作用', 295, -175, 295, -65, PALETTE.bulk);
                drawLabel('胞吐作用', 415, -175, 415, -65, PALETTE.cargo);
            }

            // --- 1A. SIMPLE DIFFUSION ---
            function renderSimpleDiffusion(t) {
                drawEnvironmentZones(0);
                drawStraightBilayer(-560, 560, 0);

                // Gradient panel on right
                if (state.showLabels) {
                    drawArrow(430, -135, 430, 120, PALETTE.o2, false, 3);
                    drawLabel('高濃度 (O₂/脂溶性)', 415, -162, null, null, PALETTE.o2);
                    drawLabel('低濃度', 415, 148, null, null, PALETTE.o2);
                }

                const p1 = clamp(t / 3.5);
                const pStep2 = ease(clamp(t - 1));
                const pStep3 = ease(clamp(t - 2));
                const pStep4 = ease(clamp(t - 3));

                // O2 molecules (High outside -> move inside)
                const o2Starts = [
                    [-280, -160], [-210, -120], [-140, -175], [-60, -110],
                    [20, -155], [100, -125], [170, -170], [-340, -135]
                ];
                const o2Ends = [
                    [-265, 130], [-195, 155], [-130, 105], [-55, 165],
                    [25, 125], [95, -95], [165, 140], [-335, -115]
                ];
                o2Starts.forEach(([sx, sy], i) => {
                    const wobX = Math.sin(state.ambientTime * 2.2 + i) * 7;
                    const wobY = Math.cos(state.ambientTime * 2.0 + i * 1.4) * 6;
                    let prog = 0;
                    if (i < 6) {
                        prog = clamp((t - 0.8 - i * 0.12) / 2.1);
                    } else {
                        prog = pStep4 * 0.35;
                    }
                    const x = lerp(sx, o2Ends[i][0], ease(prog)) + wobX;
                    const y = lerp(sy, o2Ends[i][1], ease(prog)) + wobY;
                    drawParticle('o2', x, y, 1.05, 1);
                });

                // Lipid-soluble small molecules (entering directly through bilayer)
                for (let i = 0; i < 4; i++) {
                    const sx = -235 + i * 135;
                    const prog = clamp((t - 0.9 - i * 0.18) / 1.9);
                    const y = lerp(-150, 140, ease(prog)) + Math.sin(state.ambientTime * 2.4 + i) * 5;
                    drawParticle('lipid', sx, y, 1.15, 1);
                }

                // Tiny fraction of H2O
                const h2oProg = clamp((t - 1.1) / 2.2);
                drawParticle('h2o', 235 + Math.sin(state.ambientTime * 2) * 4, lerp(-140, 120, ease(h2oProg)), 1.05, 1);

                // CO2 (High inside -> move outside)
                const co2Starts = [[-250, 145], [-90, 175], [70, 150], [210, 165]];
                const co2Ends = [[-240, -135], [-85, -145], [75, -130], [215, 120]];
                co2Starts.forEach(([sx, sy], i) => {
                    const prog = clamp((t - 1.0 - i * 0.16) / 2.1);
                    const x = lerp(sx, co2Ends[i][0], ease(prog)) + Math.cos(state.ambientTime * 2.1 + i) * 6;
                    const y = lerp(sy, co2Ends[i][1], ease(prog)) + Math.sin(state.ambientTime * 1.9 + i) * 5;
                    drawParticle('co2', x, y, 1.05, 1);
                });

                if (pStep2 > 0.05 && pStep3 < 0.95) {
                    drawArrow(-130, -75, -130, 75, PALETTE.o2, true, 2.5);
                    drawArrow(70, 75, 70, -75, PALETTE.co2, true, 2.5);
                }

                drawLabel('親水性磷酸頭', -385, -70, -350, -24, PALETTE.lipidHead);
                drawLabel('疏水性脂肪酸尾', -385, 72, -350, 6, '#fde68a');
                drawLabel('O₂ 順濃度進入', -210, -195, -210, -135, PALETTE.o2);
                drawLabel('脂溶性分子直接穿膜', -100, 195, -100, 130, PALETTE.lipidMol);
                drawLabel('極少量 H₂O 滲透', 250, -180, 238, -110, PALETTE.h2o);
                drawLabel('CO₂ 順濃度排出', 70, 200, 70, 155, PALETTE.co2);
            }

            // --- 1B. ION CHANNELS ---
            function renderIonChannel(t) {
                drawEnvironmentZones(0);
                drawStraightBilayer(-560, 560, 0, [[-65, 65]]);

                const gateType = state.gateType;
                // t in [0,4]: 0-1 closed, 1-2 trigger, 2-3 open & rush, 3-4 close
                let openFactor = 0;
                let ligandPos = null;
                let ligandBound = false;
                let depolarized = false;

                if (t < 1) {
                    openFactor = 0;
                    ligandPos = [-180, -125];
                } else if (t < 2) {
                    const p = ease(t - 1);
                    openFactor = p * 0.45;
                    ligandPos = [lerp(-180, -45, p), lerp(-125, -24, p)];
                    if (p > 0.8) ligandBound = true;
                    depolarized = p > 0.45;
                } else if (t < 3) {
                    openFactor = lerp(0.45, 1.0, ease(Math.min(1, (t - 2) * 2)));
                    ligandBound = true;
                    depolarized = true;
                } else {
                    const p = ease(t - 3);
                    openFactor = lerp(1.0, 0.0, p);
                    ligandPos = [lerp(-45, -195, p), lerp(-24, -145, p)];
                    depolarized = p < 0.35;
                }

                // Voltage-gated membrane charge indicator
                if (gateType === 'voltage') {
                    ctx.save();
                    ctx.font = '800 15px monospace';
                    ctx.textAlign = 'center';
                    const topSign = depolarized ? '－  －  (去極化)' : '＋  ＋  (靜止極化)';
                    const botSign = depolarized ? '＋  ＋' : '－  －';
                    ctx.fillStyle = depolarized ? '#fde047' : '#38bdf8';
                    ctx.fillText(topSign, -210, -45);
                    ctx.fillText(botSign, -210, 55);
                    if (depolarized) {
                        drawLabel('⚡ 電位改變開啟閘門', -210, -90, -48, -22, '#fde047');
                    }
                    ctx.restore();
                }

                drawChannelProtein(0, 0, openFactor, gateType, gateType === 'ligand' && ligandBound);
                if (gateType === 'ligand' && !ligandBound && ligandPos) {
                    drawParticle('ligand', ligandPos[0], ligandPos[1], 1.15, 1);
                    drawLabel('訊號配體 (Ligand)', ligandPos[0] - 40, ligandPos[1] - 32, ligandPos[0], ligandPos[1], PALETTE.ligand);
                }

                // Ions rushing through when open
                const ions = [
                    { type: 'na', sx: -22, sy: -155, phase: 0.0 },
                    { type: 'na', sx: 18, sy: -120, phase: 0.35 },
                    { type: 'na', sx: -8, sy: -185, phase: 0.65 },
                    { type: 'na', sx: 8, sy: -95, phase: 0.18 }
                ];

                ions.forEach((ion, idx) => {
                    const wobX = Math.sin(state.ambientTime * 2.5 + idx) * 5;
                    const wobY = Math.cos(state.ambientTime * 2.2 + idx) * 4;
                    let x = ion.sx + wobX;
                    let y = ion.sy + wobY;
                    if (t >= 2 && t < 3.4) {
                        const flowP = clamp((t - 2 - ion.phase * 0.45) / 0.85);
                        x = lerp(ion.sx, (idx % 2 === 0 ? -12 : 12) + wobX, ease(flowP));
                        y = lerp(ion.sy, 145 + idx * 14, ease(flowP));
                    } else if (t >= 3.4) {
                        y = 145 + idx * 14 + wobY;
                    }
                    drawParticle(ion.type, x, y, 1.05, 1);
                });

                // Blocked ions on lipid bilayer (showing charged ions cannot cross lipids)
                const blockY = -44 + Math.sin(state.ambientTime * 4) * 5;
                drawParticle('ca', 195, blockY, 1, 1);
                drawParticle('cl', 255, blockY - 8, 1, 1);
                drawLabel('帶電離子無法直接穿過疏水層', 235, -108, 225, blockY - 12, '#94a3b8');

                if (openFactor > 0.5) {
                    drawArrow(0, -82, 0, 82, PALETTE.na, true, 3);
                }

                drawLabel(
                    gateType === 'ligand' ? '配體閘控離子通道' : '電位閘控離子通道',
                    0, -210, 0, -52, PALETTE.channel
                );
                drawLabel('親水性孔道 (順濃度梯度)', 140, 120, 15, 25, PALETTE.channel);
            }

            // --- 1C. CARRIER PROTEINS ---
            function renderCarrier(t) {
                drawEnvironmentZones(0);
                drawStraightBilayer(-560, 560, 0, [[-65, 65]]);

                // 0-1: outward open, glucose approaches
                // 1-2: binds glucose
                // 2-3: conformational flip (0 -> 1)
                // 3-4: releases glucose, resets (1 -> 0)
                let conform = 0;
                let hasCargo = false;
                let gluX = -40, gluY = -145;

                if (t < 1) {
                    const p = ease(t);
                    gluX = lerp(-95, -5, p);
                    gluY = lerp(-165, -75, p);
                } else if (t < 2) {
                    const p = ease(t - 1);
                    gluX = lerp(-5, 0, p);
                    gluY = lerp(-75, -24, p);
                    if (p > 0.82) hasCargo = true;
                } else if (t < 3) {
                    conform = ease(t - 2);
                    hasCargo = true;
                } else {
                    const p = ease(t - 3);
                    hasCargo = false;
                    conform = p < 0.45 ? 1 : lerp(1, 0, (p - 0.45) / 0.55);
                    gluX = lerp(0, 35, p);
                    gluY = lerp(24, 155, p);
                }

                drawCarrierProtein(0, 0, conform, hasCargo, PALETTE.carrier, PALETTE.carrierDark, 'glucose');
                if (!hasCargo) {
                    drawParticle('glucose', gluX, gluY, 1.15, 1);
                }

                // Ambient extracellular high concentration of glucose
                const bgGlu = [[-220, -135], [-160, -175], [150, -145], [220, -110], [275, -165]];
                bgGlu.forEach(([gx, gy], i) => {
                    drawParticle('glucose', gx + Math.sin(state.ambientTime * 1.8 + i) * 5, gy + Math.cos(state.ambientTime * 1.5 + i) * 5, 0.95, 0.85);
                });
                // Low intracellular glucose
                drawParticle('glucose', -205, 150, 0.9, 0.75);

                if (t >= 2 && t < 3.4) {
                    drawArrow(95, -65, 95, 65, PALETTE.glucose, true, 2.5);
                }

                drawLabel('高濃度葡萄糖 (胞外)', -195, -210, -165, -170, PALETTE.glucose);
                drawLabel('促進性載體蛋白 (如 GLUT)', 0, -210, 0, -52, PALETTE.carrier);
                drawLabel(
                    conform > 0.3 && conform < 0.85 ? '蛋白質構形改變中！' : (conform >= 0.85 ? '朝內開放釋放' : '朝外開放結合位點'),
                    195, 15, 38, 12, PALETTE.carrier
                );
            }

            // --- 2A. PRIMARY ACTIVE: Na+/K+-ATPase ---
            function renderNaKPump(t) {
                drawEnvironmentZones(0, { top: '+  +  +', bot: '-  -  -' });
                drawStraightBilayer(-560, 560, 0, [[-75, 75]]);

                // 6-step classic cycle:
                // 0-1: 3 Na+ enter & bind from inside (conform=0)
                // 1-2: ATP -> ADP + Pi, phosphorylates pump (conform=0)
                // 2-3: conform 0 -> 1, 3 Na+ released outside
                // 3-4: 2 K+ bind from outside (conform=1)
                // 4-5: Pi detaches, conform 1 -> 0
                // 5-6: 2 K+ released inside
                let conform = 0;
                let phos = false;
                let boundNa = 0;
                let boundK = 0;

                if (t < 1) {
                    const p = ease(t);
                    boundNa = p > 0.75 ? 3 : Math.floor(p * 3);
                    for (let i = boundNa; i < 3; i++) {
                        drawParticle('na', lerp(-90 + i * 45, (i - 1) * 8, p), lerp(145, 35, p), 0.95, 1);
                    }
                } else if (t < 2) {
                    const p = ease(t - 1);
                    boundNa = 3;
                    if (p < 0.55) {
                        drawParticle('atp', lerp(135, 52, p / 0.55), lerp(130, 58, p / 0.55), 1.05, 1);
                    } else {
                        phos = true;
                        const p2 = (p - 0.55) / 0.45;
                        drawParticle('adp', lerp(58, 155, p2), lerp(68, 145, p2), 1.0, 1 - p2 * 0.25);
                    }
                } else if (t < 3) {
                    const p = ease(t - 2);
                    phos = true;
                    conform = Math.min(1, p * 1.4);
                    if (p < 0.55) {
                        boundNa = 3;
                    } else {
                        const pRel = (p - 0.55) / 0.45;
                        for (let i = 0; i < 3; i++) {
                            drawParticle('na', lerp((i - 1) * 10, -65 + i * 65, pRel), lerp(-25, -135, pRel), 0.95, 1);
                        }
                    }
                } else if (t < 4) {
                    const p = ease(t - 3);
                    phos = true;
                    conform = 1;
                    boundK = p > 0.78 ? 2 : Math.floor(p * 2);
                    for (let i = boundK; i < 2; i++) {
                        drawParticle('k', lerp(-45 + i * 90, (i === 0 ? -8 : 8), p), lerp(-145, -30, p), 0.95, 1);
                    }
                } else if (t < 5) {
                    const p = ease(t - 4);
                    boundK = 2;
                    phos = p < 0.35;
                    conform = lerp(1, 0, Math.max(0, (p - 0.3) / 0.7));
                    if (!phos) {
                        drawParticle('pi', lerp(50, 140, p), lerp(55, 130, p), 0.95, 1 - p * 0.4);
                    }
                } else {
                    const p = ease(t - 5);
                    conform = 0;
                    for (let i = 0; i < 2; i++) {
                        drawParticle('k', lerp((i === 0 ? -8 : 8), -45 + i * 90, p), lerp(28, 145, p), 0.95, 1);
                    }
                }

                drawPumpProtein(0, 0, conform, phos, boundNa, boundK);

                // Background concentrations showing uphill direction
                for (let x of [-310, -250, -195, 220, 280]) {
                    drawParticle('na', x, -145 + Math.sin(state.ambientTime + x) * 6, 0.85, 0.65);
                }
                for (let x of [-300, -235, -175, 240, 300]) {
                    drawParticle('k', x, 155 + Math.cos(state.ambientTime + x) * 6, 0.85, 0.65);
                }

                // Membrane potential meter badge
                ctx.save();
                roundRect(245, -205, 210, 56, 12);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                ctx.fill();
                ctx.strokeStyle = PALETTE.pump;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.fillStyle = '#e2e8f0';
                ctx.font = '700 12px "Noto Sans TC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('靜止膜電位 (Resting Potential)', 350, -184);
                ctx.fillStyle = '#fde047';
                ctx.font = '800 15px monospace';
                ctx.fillText('外正 / 內負 ≈ -70 mV', 350, -162);
                ctx.restore();

                drawLabel('高濃度 Na⁺ (胞外)', -250, -200, -250, -155, PALETTE.na);
                drawLabel('高濃度 K⁺ (胞內)', -245, 210, -235, 165, PALETTE.k);
                drawLabel('鈉鉀泵 (Na⁺/K⁺-ATPase)', 0, -205, 0, -58, PALETTE.pump);
                drawLabel('ATP 水解供能區', 145, 195, 42, 52, PALETTE.atp);
            }

            // --- 2B. SECONDARY ACTIVE: SYMPORT (SGLT) ---
            function renderSymport(t) {
                drawEnvironmentZones(0);
                // Primary pump on left at -260 maintaining Na+ gradient, Symport on right at +110
                drawStraightBilayer(-560, 560, 0, [[-330, -190], [45, 175]]);

                // Left: supporting Na+/K+ pump
                const bgConf = Math.sin(state.ambientTime * 2) * 0.5 + 0.5;
                drawPumpProtein(-260, 0, bgConf, bgConf > 0.4, bgConf < 0.5 ? 2 : 0, bgConf > 0.6 ? 2 : 0);
                drawParticle('atp', -200, 92, 0.8, 0.9);
                drawArrow(-260, 68, -260, -78, PALETTE.na, true, 2);

                // High extracellular Na+
                for (let x of [-120, -40, 20, 230, 300]) {
                    drawParticle('na', x, -135 + Math.sin(state.ambientTime * 2 + x) * 5, 0.9, 0.8);
                }
                // High intracellular Glucose
                for (let x of [20, 215, 285, 345]) {
                    drawParticle('glucose', x, 145 + Math.cos(state.ambientTime * 1.8 + x) * 5, 0.9, 0.8);
                }

                // Symport steps:
                // 0-1: Na+ gradient ready
                // 1-2: 2 Na+ + 1 Glucose bind outside
                // 2-3: conform 0 -> 1 together
                // 3-4: release inside + reset
                let conform = 0;
                let bound = false;
                let naPos = [75, -145];
                let gluPos = [145, -155];

                if (t < 1) {
                    // hovering outside
                } else if (t < 2) {
                    const p = ease(t - 1);
                    naPos = [lerp(75, 98, p), lerp(-145, -24, p)];
                    gluPos = [lerp(145, 122, p), lerp(-155, -24, p)];
                    if (p > 0.85) bound = true;
                } else if (t < 3) {
                    const p = ease(t - 2);
                    conform = p;
                    bound = true;
                    naPos = [98, lerp(-24, 24, p)];
                    gluPos = [122, lerp(-24, 24, p)];
                } else {
                    const p = ease(t - 3);
                    conform = p < 0.45 ? 1 : lerp(1, 0, (p - 0.45) / 0.55);
                    naPos = [lerp(98, 65, p), lerp(24, 155, p)];
                    gluPos = [lerp(122, 165, p), lerp(24, 155, p)];
                }

                drawCarrierProtein(110, 0, conform, false, PALETTE.symport, PALETTE.symportDark, 'glucose');
                drawParticle('na', naPos[0], naPos[1], 1.0, 1);
                drawParticle('glucose', gluPos[0], gluPos[1], 1.05, 1);

                if (t >= 2 && t < 3.4) {
                    drawArrow(195, -60, 195, 65, PALETTE.symport, true, 2.8);
                }

                drawLabel('初級鈉鉀泵 (建立 Na⁺ 梯度)', -260, -185, -260, -58, PALETTE.pump);
                drawLabel('高濃度 Na⁺ (提供驅動位能)', -20, -195, -40, -142, PALETTE.na);
                drawLabel('同向運輸蛋白 (SGLT)', 110, -195, 110, -52, PALETTE.symport);
                drawLabel('葡萄糖逆濃度進入高濃度胞內', 280, 200, 285, 155, PALETTE.glucose);
            }

            // --- 2C. SECONDARY ACTIVE: ANTIPORT (Na+/Ca2+) ---
            function renderAntiport(t) {
                drawEnvironmentZones(0);
                drawStraightBilayer(-560, 560, 0, [[-70, 70]]);

                // Background concentrations
                for (let x of [-290, -215, 205, 275]) {
                    drawParticle('na', x, -135 + Math.sin(state.ambientTime * 2 + x) * 5, 0.9, 0.75);
                    drawParticle('ca', x + 25, -175 + Math.cos(state.ambientTime * 1.7 + x) * 5, 0.85, 0.7);
                }

                let conform = 0; // 0 = Na outside + Ca inside, 1 = flipped
                let naPos = [-14, -145];
                let caPos = [14, 145];

                if (t < 1) {
                    // ready
                } else if (t < 2) {
                    const p = ease(t - 1);
                    naPos = [-14, lerp(-145, -26, p)];
                    caPos = [14, lerp(145, 26, p)];
                } else if (t < 3) {
                    const p = ease(t - 2);
                    conform = p;
                    naPos = [-14, lerp(-26, 26, p)];
                    caPos = [14, lerp(26, -26, p)];
                } else {
                    const p = ease(t - 3);
                    conform = p < 0.45 ? 1 : lerp(1, 0, (p - 0.45) / 0.55);
                    naPos = [lerp(-14, -45, p), lerp(26, 155, p)];
                    caPos = [lerp(14, 48, p), lerp(-26, -155, p)];
                }

                drawCarrierProtein(0, 0, conform, false, PALETTE.symport, PALETTE.symportDark, 'ca');
                drawParticle('na', naPos[0], naPos[1], 1.05, 1);
                drawParticle('ca', caPos[0], caPos[1], 1.05, 1);

                if (t >= 2 && t < 3.4) {
                    drawArrow(-85, -60, -85, 65, PALETTE.na, true, 2.5);
                    drawArrow(85, 65, 85, -60, PALETTE.ca, true, 2.5);
                }

                drawLabel('高濃度 Na⁺ & Ca²⁺ (胞外)', -245, -210, -240, -150, PALETTE.ca);
                drawLabel('反向運輸蛋白 (Na⁺/Ca²⁺ 交換)', 0, -210, 0, -52, PALETTE.symport);
                drawLabel('Na⁺ 順濃度入胞', -135, 95, -85, 40, PALETTE.na);
                drawLabel('Ca²⁺ 逆濃度出胞', 135, -95, 85, -40, PALETTE.ca);
            }

            // --- 3A. PHAGOCYTOSIS ---
            function renderPhagocytosis(t) {
                drawEnvironmentZones(0);

                // 0-1: bacterium approaches
                // 1-2: pseudopodia extend upward around bacterium
                // 2-3: tips fuse and pinch off into phagosome
                // 3-4: phagosome moves deeper, lysosome approaches to fuse
                let bactY = -125;
                let detached = false;

                if (t < 1) {
                    bactY = lerp(-155, -85, ease(t));
                } else if (t < 2) {
                    bactY = lerp(-85, -55, ease(t - 1));
                } else if (t < 3) {
                    const p = ease(t - 2);
                    bactY = lerp(-55, 55, p);
                    detached = p > 0.58;
                } else {
                    detached = true;
                    bactY = lerp(55, 125, ease(t - 3));
                }

                if (!detached) {
                    // Continuous curved bilayer with rising pseudopodia
                    const pRise = t < 1 ? 0 : ease(Math.min(1, t - 1));
                    const pClose = t < 2 ? 0 : ease(Math.min(1, (t - 2) / 0.58));
                    const tipX = lerp(115, 22, pClose);
                    const tipY = lerp(-15, -125, pRise) + pClose * 12;

                    const pts = [
                        { x: -560, y: 0 }, { x: -240, y: 0 }, { x: -165, y: lerp(0, -18, pRise) },
                        { x: -tipX - 25, y: lerp(0, -85, pRise) },
                        { x: -tipX, y: tipY },
                        { x: -tipX + 18, y: lerp(0, -45, pRise) },
                        { x: -65, y: lerp(0, 35, pRise) },
                        { x: 0, y: lerp(0, 48, pRise) },
                        { x: 65, y: lerp(0, 35, pRise) },
                        { x: tipX - 18, y: lerp(0, -45, pRise) },
                        { x: tipX, y: tipY },
                        { x: tipX + 25, y: lerp(0, -85, pRise) },
                        { x: 165, y: lerp(0, -18, pRise) }, { x: 240, y: 0 }, { x: 560, y: 0 }
                    ];
                    drawCurvedBilayer(pts, 20);
                } else {
                    drawStraightBilayer(-560, 560, 0);
                    drawClosedVesicleBilayer(0, bactY, 72, 54, 0);
                }

                drawParticle('bacterium', 0, bactY, 1.15, 1);

                // Lysosome approaching in step 4
                if (t >= 2.8) {
                    const lp = ease(clamp((t - 2.8) / 1.1));
                    const lx = lerp(-230, -108, lp);
                    const ly = lerp(190, 140, lp);
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(lx, ly, 36, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(244, 63, 94, 0.25)';
                    ctx.fill();
                    ctx.strokeStyle = '#fb7185';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#fda4af';
                    for (let [dx, dy] of [[-10, -8], [12, -5], [-4, 12], [10, 10]]) {
                        ctx.beginPath(); ctx.arc(lx + dx, ly + dy, 3.5, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.restore();
                    drawLabel('溶體 (含水解酶)', lx - 35, ly + 52, lx, ly + 25, '#fb7185');
                }

                drawLabel('外來細菌 / 大顆粒', 0, bactY - 75, 0, bactY - 22, PALETTE.bacterium);
                if (!detached && t >= 1) {
                    drawLabel('偽足 (Pseudopodia)', -165, -135, -95, -80, PALETTE.lipidHead);
                }
                if (detached) {
                    drawLabel('吞噬體 (Phagosome)', 155, bactY, 75, bactY, PALETTE.bulk);
                }
            }

            // --- 3B. PINOCYTOSIS ---
            function renderPinocytosis(t) {
                drawEnvironmentZones(0);

                let detached = false;
                let vesY = 0;

                if (t < 2.55) {
                    const pPit = t < 1 ? 0 : ease(Math.min(1, t - 1));
                    const pPinch = t < 2 ? 0 : ease(Math.min(1, (t - 2) / 0.55));
                    const neckX = lerp(65, 14, pPinch);
                    const depth = lerp(0, 115, pPit);

                    const pts = [
                        { x: -560, y: 0 }, { x: -180, y: 0 },
                        { x: -neckX - 25, y: 0 },
                        { x: -neckX, y: depth * 0.25 },
                        { x: -58, y: depth * 0.75 },
                        { x: 0, y: depth },
                        { x: 58, y: depth * 0.75 },
                        { x: neckX, y: depth * 0.25 },
                        { x: neckX + 25, y: 0 },
                        { x: 180, y: 0 }, { x: 560, y: 0 }
                    ];
                    drawCurvedBilayer(pts, 20);
                    vesY = depth * 0.58;
                } else {
                    detached = true;
                    vesY = lerp(75, 155, ease(clamp((t - 2.55) / 1.3)));
                    drawStraightBilayer(-560, 560, 0);
                    drawClosedVesicleBilayer(0, vesY, 48, 44, 0);
                }

                // Tiny extracellular solutes & water droplets being engulfed
                const solutes = [
                    [-18, -32, 'h2o'], [16, -26, 'h2o'], [0, -12, 'cargo'],
                    [-10, -48, 'lipid'], [20, -45, 'h2o']
                ];
                solutes.forEach(([ox, oy, kind], i) => {
                    const followY = t < 1 ? oy - 35 : (detached ? vesY + oy * 0.45 : lerp(oy - 35, vesY + oy * 0.45, ease(clamp(t - 1))));
                    drawParticle(kind, ox + Math.sin(state.ambientTime * 2 + i) * 3, followY, 0.85, 1);
                });

                // Ambient extracellular solutes
                for (let x of [-250, -180, 175, 260]) {
                    drawParticle('h2o', x, -95 + Math.sin(state.ambientTime + x) * 6, 0.85, 0.7);
                }

                drawLabel('胞外液體與微小溶質 (非專一性)', -195, -145, -175, -95, PALETTE.h2o);
                if (!detached) {
                    drawLabel('細胞膜內陷囊袋', 165, 85, 55, 65, PALETTE.lipidHead);
                } else {
                    drawLabel('胞飲囊泡 (Pinocytic Vesicle)', 165, vesY, 50, vesY, PALETTE.bulk);
                }
            }

            // --- 3C. RECEPTOR-MEDIATED ENDOCYTOSIS ---
            function renderReceptorEndocytosis(t) {
                drawEnvironmentZones(0);

                let detached = false;
                let vesY = 0;
                let clathrinAlpha = 0;

                // Receptor + LDL positions along curve
                const receptorAngles = [-0.65, -0.22, 0.22, 0.65];

                if (t < 2.65) {
                    const pPit = t < 1 ? 0 : ease(Math.min(1, t - 1));
                    const pPinch = t < 2 ? 0 : ease(Math.min(1, (t - 2) / 0.65));
                    clathrinAlpha = pPit;
                    const neckX = lerp(95, 16, pPinch);
                    const depth = lerp(0, 132, pPit);

                    const pts = [
                        { x: -560, y: 0 }, { x: -200, y: 0 },
                        { x: -neckX - 28, y: 0 },
                        { x: -neckX, y: depth * 0.28 },
                        { x: -74, y: depth * 0.78 },
                        { x: 0, y: depth },
                        { x: 74, y: depth * 0.78 },
                        { x: neckX, y: depth * 0.28 },
                        { x: neckX + 28, y: 0 },
                        { x: 200, y: 0 }, { x: 560, y: 0 }
                    ];
                    drawCurvedBilayer(pts, 20);
                    vesY = depth * 0.58;

                    // Clathrin coat under the pit
                    if (clathrinAlpha > 0.05) {
                        ctx.save();
                        ctx.globalAlpha = clathrinAlpha;
                        ctx.strokeStyle = PALETTE.clathrin;
                        ctx.lineWidth = 4;
                        ctx.setLineDash([8, 6]);
                        ctx.beginPath();
                        ctx.arc(0, vesY - 8, 86, 0.15 * Math.PI, 0.85 * Math.PI);
                        ctx.stroke();
                        ctx.restore();
                    }

                    // Draw Receptors & LDL bound to them
                    receptorAngles.forEach((a, i) => {
                        const rx = Math.sin(a) * lerp(95, 48, pPit);
                        const ry = lerp(-20, vesY + Math.cos(a) * 44 - 22, pPit);
                        // Y-shaped receptor
                        ctx.save();
                        ctx.translate(rx, ry);
                        ctx.rotate(-a * pPit);
                        ctx.strokeStyle = PALETTE.receptor;
                        ctx.lineWidth = 3.2;
                        ctx.beginPath();
                        ctx.moveTo(0, 18); ctx.lineTo(0, -4);
                        ctx.moveTo(-7, -13); ctx.lineTo(0, -4); ctx.lineTo(7, -13);
                        ctx.stroke();

                        const ldlApproach = t < 1 ? ease(t) : 1;
                        const lx = 0;
                        const ly = lerp(-85 - i * 8, -22, ldlApproach);
                        drawParticle('ldl', lx, ly, 0.88, 1);
                        ctx.restore();
                    });
                } else {
                    detached = true;
                    const pPost = ease(clamp((t - 2.65) / 1.25));
                    vesY = lerp(78, 165, pPost);
                    // Uncoating in step 4 (t > 3)
                    clathrinAlpha = t < 3.1 ? 1 : Math.max(0, 1 - (t - 3.1) / 0.65);

                    drawStraightBilayer(-560, 560, 0);
                    drawClosedVesicleBilayer(0, vesY, 58, 54, clathrinAlpha);

                    // Inside vesicle: receptors pointing inward + LDL
                    receptorAngles.forEach((a, i) => {
                        const ang = Math.PI / 2 + a * 1.4;
                        const rx = Math.cos(ang) * 34;
                        const ry = vesY + Math.sin(ang) * 30;
                        ctx.save();
                        ctx.translate(rx, ry);
                        ctx.rotate(ang + Math.PI / 2);
                        ctx.strokeStyle = PALETTE.receptor;
                        ctx.lineWidth = 2.8;
                        ctx.beginPath();
                        ctx.moveTo(0, 12); ctx.lineTo(0, -2);
                        ctx.moveTo(-6, -10); ctx.lineTo(0, -2); ctx.lineTo(6, -10);
                        ctx.stroke();
                        drawParticle('ldl', 0, -18, 0.8, 1);
                        ctx.restore();
                    });
                }

                drawLabel('膽固醇 LDL 目標分子', -170, -145, -75, -105, '#fbbf24');
                drawLabel('專一性膜受體', 170, -110, 60, -22, PALETTE.receptor);
                if (clathrinAlpha > 0.2) {
                    drawLabel('網格蛋白外衣 (Clathrin)', -195, 130, -70, vesY + 60, PALETTE.clathrin);
                } else if (detached) {
                    drawLabel('網格蛋白脫離回收', -195, 140, -65, vesY, PALETTE.clathrin);
                }
            }

            // --- 3D. EXOCYTOSIS ---
            function renderExocytosis(t) {
                drawEnvironmentZones(0);

                // 0-1: secretory vesicle moves UP toward plasma membrane
                // 1-2: docks at inner leaflet
                // 2-3: fuses & opens pore to extracellular space
                // 3-4: cargo released outside, membrane flattens out
                const cargoOffsets = [[-16, -10], [14, -12], [0, 8], [-12, 14], [16, 10]];

                if (t < 2) {
                    const pMove = ease(Math.min(1, t));
                    const vesY = lerp(165, 68, pMove);
                    drawStraightBilayer(-560, 560, 0);
                    drawClosedVesicleBilayer(0, vesY, 54, 48, 0);

                    cargoOffsets.forEach(([ox, oy], i) => {
                        drawParticle('cargo', ox + Math.sin(state.ambientTime * 2 + i) * 2, vesY + oy, 1.05, 1);
                    });

                    if (t < 1) {
                        drawArrow(-85, 165, -85, 75, PALETTE.cargo, true, 2.5);
                    }
                    drawLabel('分泌囊泡 (內含神經傳導物質/激素)', 195, vesY, 55, vesY, PALETTE.cargo);
                } else {
                    const pFuse = ease(clamp(t - 2));
                    const pRelease = ease(clamp(t - 3));
                    const depth = lerp(108, 18, pRelease);
                    const mouthX = lerp(22, 95, Math.min(1, pFuse * 0.65 + pRelease * 0.55));

                    const pts = [
                        { x: -560, y: 0 }, { x: -200, y: 0 },
                        { x: -mouthX - 24, y: 0 },
                        { x: -mouthX, y: depth * 0.3 },
                        { x: -mouthX * 0.85, y: depth * 0.85 },
                        { x: 0, y: depth },
                        { x: mouthX * 0.85, y: depth * 0.85 },
                        { x: mouthX, y: depth * 0.3 },
                        { x: mouthX + 24, y: 0 },
                        { x: 200, y: 0 }, { x: 560, y: 0 }
                    ];
                    drawCurvedBilayer(pts, 20);

                    cargoOffsets.forEach(([ox, oy], i) => {
                        const prog = clamp((t - 2.15 - i * 0.08) / 1.35);
                        const cx = lerp(ox, ox * 4.8 + (i - 2) * 28, ease(prog));
                        const cy = lerp(45 + oy, -115 - (i % 3) * 32, ease(prog));
                        drawParticle('cargo', cx, cy, 1.05, 1);
                    });

                    drawArrow(0, 35, 0, -95, PALETTE.cargo, true, 2.8);
                    drawLabel('釋放分泌物至細胞外', 180, -135, 35, -95, PALETTE.cargo);
                    drawLabel('囊泡膜併入細胞膜', -195, 75, -75, 25, PALETTE.lipidHead);
                }

                drawLabel('高基氏體來源囊泡', -200, 200, -90, 175, '#94a3b8');
            }

            // =========================================================================
            // 9. MAIN ANIMATION LOOP
            // =========================================================================
            let lastTime = performance.now();

            function tick(now) {
                const dt = Math.min(0.05, (now - lastTime) / 1000);
                lastTime = now;

                state.ambientTime += dt;
                const sub = getActiveSub();
                const totalSteps = sub.steps.length;

                if (state.isPlaying) {
                    state.t += dt * 0.65 * state.speed;
                    if (state.t >= totalSteps) {
                        state.t = 0;
                    }
                    updateStepUI(false);
                } else if (state.targetT !== null) {
                    const diff = state.targetT - state.t;
                    if (Math.abs(diff) < 0.015) {
                        state.t = state.targetT;
                        state.targetT = null;
                    } else {
                        state.t += Math.sign(diff) * Math.min(Math.abs(diff), dt * 1.15 * Math.max(0.8, state.speed));
                    }
                    updateStepUI(false);
                }

                // Render scene
                const w = stageWrap.clientWidth;
                const h = stageWrap.clientHeight;
                ctx.clearRect(0, 0, w, h);

                ctx.save();
                ctx.translate(w / 2, h / 2);
                ctx.scale(state.cam.zoom, state.cam.zoom);
                ctx.translate(-state.cam.x, -state.cam.y);

                switch (sub.id) {
                    case 'overview_all': renderOverview(state.t); break;
                    case 'simple': renderSimpleDiffusion(state.t); break;
                    case 'channel': renderIonChannel(state.t); break;
                    case 'carrier': renderCarrier(state.t); break;
                    case 'nakpump': renderNaKPump(state.t); break;
                    case 'symport': renderSymport(state.t); break;
                    case 'antiport': renderAntiport(state.t); break;
                    case 'phagocytosis': renderPhagocytosis(state.t); break;
                    case 'pinocytosis': renderPinocytosis(state.t); break;
                    case 'receptor': renderReceptorEndocytosis(state.t); break;
                    case 'exocytosis': renderExocytosis(state.t); break;
                }

                ctx.restore();
                requestAnimationFrame(tick);
            }

            // =========================================================================
            // 10. INITIALIZATION
            // =========================================================================
            window.addEventListener('resize', () => {
                resizeCanvas();
            });

            resizeCanvas();
            fitCameraToStage(true);
            renderNavUI();
            requestAnimationFrame(tick);
        })();
    </script>
</body>

</html>
