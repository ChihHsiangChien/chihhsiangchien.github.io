<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>細胞膜運輸機制｜互動動態模擬器</title>
    <style>
        :root {
            --bg-app: #070e1a;
            --bg-panel: #0e192c;
            --bg-card: #13223b;
            --bg-hover: #1b3052;
            --border: #233b61;
            --text-main: #eef4ff;
            --text-muted: #93a8c7;
            --accent: #38bdf8;
            --accent-soft: rgba(56, 189, 248, 0.16);

            /* Unified biological element colors (consistent across all tabs) */
            --c-passive: #22d3ee;
            --c-carrier: #10b981;
            --c-active: #a78bfa;
            --c-symport: #818cf8;
            --c-bulk: #fb923c;
            --c-receptor: #fb7185;
            --c-atp: #fde047;
            --c-na: #f97316;
            --c-k: #ec4899;
            --c-glucose: #facc15;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: var(--bg-app);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Header & Main Tabs */
        .topbar {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
            display: grid;
            place-items: center;
            font-size: 15px;
            box-shadow: 0 2px 10px rgba(14, 165, 233, 0.35);
        }

        .main-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            max-width: 100%;
            padding: 2px 0;
        }

        .main-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s ease;
            min-height: 36px;
        }

        .tab-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--accent-soft);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.22);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .icon-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 7px 11px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-height: 36px;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .icon-btn:hover {
            background: var(--bg-hover);
        }

        .icon-btn.active {
            background: rgba(16, 185, 129, 0.18);
            border-color: #10b981;
            color: #a7f3d0;
        }

        .icon-btn.off {
            background: rgba(244, 63, 94, 0.14);
            border-color: #fb7185;
            color: #fecdd3;
        }

        /* Sub-mechanism Navigation */
        .subbar {
            background: rgba(14, 25, 44, 0.92);
            border-bottom: 1px solid var(--border);
            padding: 7px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 15;
        }

        .sub-pills {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            max-width: 100%;
        }

        .sub-pills::-webkit-scrollbar {
            display: none;
        }

        .sub-pill {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            min-height: 32px;
            transition: all 0.15s ease;
        }

        .sub-pill:hover {
            background: var(--bg-card);
            color: var(--text-main);
        }

        .sub-pill.active {
            background: var(--bg-hover);
            color: var(--accent);
            border-color: rgba(56, 189, 248, 0.5);
        }

        .meta-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .meta-badge {
            font-size: 11.5px;
            font-weight: 600;
            padding: 4px 9px;
            border-radius: 999px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            white-space: nowrap;
        }

        .meta-badge.energy-free {
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.4);
        }

        .meta-badge.energy-atp {
            color: #fde047;
            border-color: rgba(250, 204, 21, 0.45);
        }

        .meta-badge.energy-sec {
            color: #c4b5fd;
            border-color: rgba(167, 139, 250, 0.45);
        }

        /* Canvas Stage */
        .stage-wrap {
            position: relative;
            flex: 1 1 auto;
            min-height: 220px;
            background: #08111f;
            overflow: hidden;
        }

        canvas#simCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
        }

        canvas#simCanvas:active {
            cursor: grabbing;
        }

        /* Floating Stage HUD */
        .hud-top-left {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-top-left>* {
            pointer-events: auto;
        }

        .gate-switcher {
            display: inline-flex;
            background: rgba(14, 25, 44, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
            gap: 3px;
        }

        .gate-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 7px;
            cursor: pointer;
        }

        .gate-btn.active {
            background: rgba(34, 211, 238, 0.2);
            color: #67e8f9;
        }

        .hud-top-right {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            z-index: 10;
        }

        .zoom-group {
            display: flex;
            background: rgba(14, 25, 44, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .zoom-btn {
            background: transparent;
            border: none;
            border-right: 1px solid var(--border);
            color: var(--text-main);
            font-size: 15px;
            font-weight: 700;
            min-width: 38px;
            height: 36px;
            padding: 0 9px;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .zoom-btn:last-child {
            border-right: none;
            font-size: 12px;
            font-weight: 600;
        }

        .zoom-btn:hover {
            background: var(--bg-hover);
        }

        .touch-hint {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(10, 18, 32, 0.78);
            border: 1px solid rgba(35, 59, 97, 0.7);
            border-radius: 8px;
            padding: 4px 8px;
            pointer-events: none;
        }

        /* Legend Drawer */
        .legend-drawer {
            position: absolute;
            top: 10px;
            right: 10px;
            width: min(330px, calc(100vw - 20px));
            max-height: calc(100% - 20px);
            overflow-y: auto;
            background: rgba(13, 23, 40, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            z-index: 25;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.55);
            display: none;
        }

        .legend-drawer.open {
            display: block;
        }

        .legend-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 13.5px;
        }

        .legend-close {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            width: 28px;
            height: 28px;
            cursor: pointer;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--text-main);
        }

        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .swatch.hex {
            border-radius: 3px;
            transform: rotate(15deg);
        }

        .swatch.rect {
            border-radius: 4px;
            width: 16px;
            height: 11px;
        }

        /* Bottom Step-by-Step Dock */
        .step-dock {
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
        }

        .step-progress-row {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .step-progress-row::-webkit-scrollbar {
            display: none;
        }

        .step-pill {
            flex: 1 1 0;
            min-width: 72px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 5px 8px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
            transition: all 0.15s ease;
        }

        .step-pill.done {
            border-color: rgba(56, 189, 248, 0.35);
            color: var(--text-main);
        }

        .step-pill.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: #fff;
        }

        .step-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .step-info {
            flex: 1 1 340px;
            min-width: 0;
        }

        .step-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .step-desc {
            font-size: 12.5px;
            line-height: 1.45;
            color: var(--text-main);
        }

        .step-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .ctrl-btn:hover {
            background: var(--bg-hover);
        }

        .ctrl-btn:active {
            transform: scale(0.97);
        }

        .ctrl-btn.primary {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border-color: #38bdf8;
            color: #fff;
            min-width: 92px;
        }

        .ctrl-btn.speed {
            min-width: 52px;
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 720px) {
            .topbar {
                padding: 6px 8px;
                gap: 6px;
            }

            .brand span {
                display: none;
            }

            .tab-btn {
                padding: 6px 10px;
                font-size: 12px;
                min-height: 34px;
            }

            .icon-btn {
                padding: 6px 9px;
                font-size: 12px;
                min-height: 34px;
            }

            .subbar {
                padding: 5px 8px;
                gap: 6px;
            }

            .meta-badges {
                display: none;
            }

            .step-dock {
                padding: 7px 9px calc(7px + env(safe-area-inset-bottom));
                gap: 6px;
            }

            .step-desc {
                font-size: 12px;
            }

            .ctrl-btn {
                padding: 7px 10px;
                font-size: 12.5px;
                min-height: 38px;
            }

            .touch-hint {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Top Header & Main Tabs -->
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">🧬</div>
            <span>細胞膜運輸機制模擬器</span>
        </div>

        <nav class="main-tabs" id="mainTabs" role="tablist"></nav>

        <div class="top-actions">
            <button class="icon-btn active" id="toggleLabelsBtn" title="顯示或隱藏畫面文字標籤">
                🏷️ <span id="toggleLabelsText">標籤：開</span>
            </button>
            <button class="icon-btn" id="toggleLegendBtn" title="檢視統一圖例">
                🎨 圖例
            </button>
        </div>
    </header>

    <!-- Sub-mechanisms & Metadata -->
    <div class="subbar">
        <div class="sub-pills" id="subPills"></div>
        <div class="meta-badges" id="metaBadges"></div>
    </div>

    <!-- Main Interactive Canvas Stage -->
    <main class="stage-wrap" id="stageWrap">
        <canvas id="simCanvas"></canvas>

        <div class="hud-top-left" id="hudTopLeft"></div>

        <div class="hud-top-right">
            <div class="zoom-group">
                <button class="zoom-btn" id="zoomInBtn" title="放大">＋</button>
                <button class="zoom-btn" id="zoomOutBtn" title="縮小">－</button>
                <button class="zoom-btn" id="zoomResetBtn" title="重置視角">⟲ 重置</button>
            </div>
            <div class="touch-hint">單指/滑鼠拖曳平移・雙指/滾輪縮放</div>
        </div>

        <!-- Unified Color & Element Legend Drawer -->
        <aside class="legend-drawer" id="legendDrawer">
            <div class="legend-header">
                <span>🎨 全分頁統一視覺圖例</span>
                <button class="legend-close" id="closeLegendBtn">✕</button>
            </div>
            <div class="legend-grid">
                <div class="legend-item"><span class="swatch" style="background:#f59e0b"></span>磷脂雙層 (親水頭/疏水尾)</div>
                <div class="legend-item"><span class="swatch rect" style="background:#06b6d4"></span>離子通道蛋白</div>
                <div class="legend-item"><span class="swatch rect" style="background:#10b981"></span>載體蛋白 (GLUT等)</div>
                <div class="legend-item"><span class="swatch rect" style="background:#8b5cf6"></span>初級幫浦 (Na⁺/K⁺泵)
                </div>
                <div class="legend-item"><span class="swatch rect" style="background:#6366f1"></span>次級協同運輸蛋白</div>
                <div class="legend-item"><span class="swatch rect" style="background:#f43f5e"></span>膜受體 / 配體訊號</div>
                <div class="legend-item"><span class="swatch" style="background:#38bdf8"></span>O₂ / 水 / 胞吐分泌物</div>
                <div class="legend-item"><span class="swatch" style="background:#94a3b8"></span>CO₂ 氣體分子</div>
                <div class="legend-item"><span class="swatch" style="background:#4ade80"></span>脂溶性小分子</div>
                <div class="legend-item"><span class="swatch" style="background:#f97316"></span>Na⁺ (鈉離子)</div>
                <div class="legend-item"><span class="swatch" style="background:#ec4899"></span>K⁺ (鉀離子)</div>
                <div class="legend-item"><span class="swatch" style="background:#eab308"></span>Ca²⁺ (鈣離子)</div>
                <div class="legend-item"><span class="swatch hex" style="background:#facc15"></span>葡萄糖 (Glucose)</div>
                <div class="legend-item"><span class="swatch hex" style="background:#fde047"></span>ATP 高能分子</div>
                <div class="legend-item"><span class="swatch" style="background:#fb923c"></span>網格蛋白 (Clathrin)</div>
                <div class="legend-item"><span class="swatch rect" style="background:#84cc16"></span>細菌 / LDL大顆粒</div>
            </div>
        </aside>
    </main>

    <!-- Step-by-Step Controller Dock -->
    <footer class="step-dock">
        <div class="step-progress-row" id="stepPills"></div>
        <div class="step-body">
            <div class="step-info">
                <div class="step-title" id="stepTitle"></div>
                <div class="step-desc" id="stepDesc"></div>
            </div>
            <div class="step-controls">
                <button class="ctrl-btn" id="restartBtn" title="回到步驟 1">⏮</button>
                <button class="ctrl-btn" id="prevStepBtn">◀ 上一步</button>
                <button class="ctrl-btn primary" id="playPauseBtn">⏸ 暫停</button>
                <button class="ctrl-btn" id="nextStepBtn">下一步 ▶</button>
                <button class="ctrl-btn speed" id="speedBtn" title="切換播放速度">1.0x</button>
            </div>
        </div>
    </footer>

    <script>
        (() => {
            'use strict';

            // =========================================================================
            // 1. UNIFIED VISUAL PALETTE & MOLECULAR DEFINITIONS
            // =========================================================================
            const PALETTE = {
                extraBgTop: '#081526',
                extraBgBot: '#0d213a',
                intraBgTop: '#12182b',
                intraBgBot: '#0b101d',

                lipidHead: '#f59e0b',
                lipidHeadHi: '#fef08a',
                lipidTail: 'rgba(253, 230, 138, 0.72)',

                channel: '#06b6d4',

                o2: '#38bdf8',

                h2o: '#60a5fa',

                k: '#ec4899',
                ca: '#eab308',
                cl: '#2dd4bf',
                glucose: '#facc15',

                adp: '#94a3b8',
                pi: '#fb7185',
                ligand: '#fb7185',
                bacterium: '#84cc16',
                cargo: '#38bdf8'
            };

            // =========================================================================
            // 2. COMPLETE CURRICULUM & STEP-BY-STEP ARCHITECTURE
            // =========================================================================
            const CATEGORIES = [
                {
                    id: 'overview',
                    name: '總覽架構',
                    subs: [
                        {
                            id: 'overview_all',
                            name: '完整運輸架構總覽',
                            energyBadge: '三大運輸系統對照',
                            energyClass: '',
                            gradientBadge: '順濃度 vs 逆濃度 vs 囊泡',
                            steps: [
                                {
                                    short: '1. 膜結構',
                                    title: '步驟 1/4：流體鑲嵌細胞膜與梯度',
                                    desc: '細胞膜由雙層磷脂（親水性磷酸頭朝外、疏水性脂肪酸尾朝內）構成，並鑲嵌各式專一性運輸蛋白，分隔細胞內外環境。'

                                {
                                    short: '2. 被動運輸',
                                    title: '步驟 2/4：一、被動運輸 (Passive Transport)',

                                {
                                    short: '3. 主動運輸',
                                    title: '步驟 3/4：二、主動運輸 (Active Transport)',
                                    desc: '消耗能量，使物質逆著濃度梯度（低 → 高）移動。包含直接水解 ATP 的「初級主動運輸（如鈉鉀泵）」與利用離子梯度的「次級協同運輸」。'
                                },
                                {
                                    short: '4. 胞吞胞吐',
                                    title: '步驟 4/4：三、胞吞與胞吐作用 (Bulk Transport)',
                                    desc: '針對大顆粒、巨分子或大量分泌物，利用細胞膜流動性以囊泡包裹進出（胞吞：吞噬、胞飲、受體媒介；胞吐：分泌釋放）。'
                                }
                            ]
                        }
                    ]
                },

                state.cam.zoom = Math.max(state.cam.minZoom, Math.min(1.4, fitZoom));
                if (resetCenter) {
                    state.cam.x = 0;
                    state.cam.y = 0;
                }
            }

            function resizeCanvas() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                const w = stageWrap.clientWidth;
                const h = stageWrap.clientHeight;
                canvas.width = Math.floor(w * dpr);
                canvas.height = Math.floor(h * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function renderNavUI() {
                // Main Tabs
                mainTabsEl.innerHTML = '';
                CATEGORIES.forEach((cat, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'tab-btn' + (idx === state.catIdx ? ' active' : '');
                    btn.textContent = cat.name;
                    btn.onclick = () => selectMechanism(idx, 0);
                    mainTabsEl.appendChild(btn);
                });

                // Sub-mechanisms
                const cat = getActiveCat();
                subPillsEl.innerHTML = '';
                cat.subs.forEach((sub, sIdx) => {
                    const pill = document.createElement('button');
                    pill.className = 'sub-pill' + (sIdx === state.subIdx ? ' active' : '');
                    pill.textContent = sub.name;
                    pill.onclick = () => selectMechanism(state.catIdx, sIdx);
                    subPillsEl.appendChild(pill);
                });

                // Meta badges
                const sub = getActiveSub();
                metaBadgesEl.innerHTML = `
      <span class="meta-badge ${sub.energyClass}">${sub.energyBadge}</span>
      <span class="meta-badge">${sub.gradientBadge}</span>
    `;

                // HUD top-left (e.g. Gate Toggle for Ion Channels, or Quick Jump for Overview)
                hudTopLeftEl.innerHTML = '';
                if (sub.hasGateToggle) {
                    const sw = document.createElement('div');
                    sw.className = 'gate-switcher';
                    sw.innerHTML = `
        <button class="gate-btn ${state.gateType === 'ligand' ? 'active' : ''}" data-gate="ligand">🔑 配體閘控</button>
        <button class="gate-btn ${state.gateType === 'voltage' ? 'active' : ''}" data-gate="voltage">⚡ 電位閘控</button>
      `;
                    sw.querySelectorAll('.gate-btn').forEach(b => {
                        b.onclick = () => {
                            state.gateType = b.dataset.gate;
                            renderNavUI();
                        };
                    });
                    hudTopLeftEl.appendChild(sw);
                } else if (sub.id === 'overview_all') {
                    const sw = document.createElement('div');
                    sw.className = 'gate-switcher';
                    sw.innerHTML = `
        <button class="gate-btn" data-jump="1">進入：被動運輸 ↗</button>
        <button class="gate-btn" data-jump="2">進入：主動運輸 ↗</button>
        <button class="gate-btn" data-jump="3">進入：胞吞胞吐 ↗</button>
      `;
                    sw.querySelectorAll('.gate-btn').forEach(b => {
                        b.onclick = () => selectMechanism(Number(b.dataset.jump), 0);
                    });
                    hudTopLeftEl.appendChild(sw);
                }

                // Step Pills
                stepPillsEl.innerHTML = '';
                sub.steps.forEach((st, idx) => {
                    const p = document.createElement('button');
                    p.className = 'step-pill';
                    p.textContent = st.short;
                    p.onclick = () => jumpToStep(idx);
                    stepPillsEl.appendChild(p);
                });

                updateStepUI();
            }

            let lastRenderedStepIdx = -1;
            function updateStepUI(force = false) {
                const sub = getActiveSub();
                const total = sub.steps.length;
                const stepIdx = Math.min(total - 1, Math.max(0, Math.floor(state.t - 0.0001)));

                if (!force && stepIdx === lastRenderedStepIdx) {
                    // still update play button text
                    playPauseBtn.textContent = state.isPlaying ? '⏸ 暫停' : '▶ 播放';
                    return;
                }
                lastRenderedStepIdx = stepIdx;

                const st = sub.steps[stepIdx];
                stepTitleEl.textContent = st.title;
                stepDescEl.textContent = st.desc;

                const pills = stepPillsEl.querySelectorAll('.step-pill');
                pills.forEach((el, idx) => {
                    el.classList.toggle('active', idx === stepIdx);
                    el.classList.toggle('done', idx < stepIdx);
                });

                playPauseBtn.textContent = state.isPlaying ? '⏸ 暫停' : '▶ 播放';
            }

            function selectMechanism(catIdx, subIdx) {
                state.catIdx = catIdx;
                state.subIdx = subIdx;
                state.t = 0;
                state.targetT = null;
                state.isPlaying = true;
                lastRenderedStepIdx = -1;
                fitCameraToStage(true);
                renderNavUI();
                updateStepUI(true);
            }

            function jumpToStep(idx) {
                const sub = getActiveSub();
                const clamped = Math.max(0, Math.min(sub.steps.length - 1, idx));
                state.isPlaying = false;
                state.t = clamped;
                state.targetT = clamped + 0.999; // Animate cleanly through this step and hold at completion
                lastRenderedStepIdx = -1;
                updateStepUI(true);
            }

            playPauseBtn.onclick = () => {
                state.targetT = null;
                state.isPlaying = !state.isPlaying;
                updateStepUI(true);
            };

            restartBtn.onclick = () => {
                state.isPlaying = false;
                state.t = 0;
                state.targetT = 0.999;
                lastRenderedStepIdx = -1;
                updateStepUI(true);
            };

            nextStepBtn.onclick = () => {
                const sub = getActiveSub();
                const total = sub.steps.length;
                state.isPlaying = false;
                const currentStep = Math.floor(state.t - 0.0001);
                let nextIdx;
                if (state.t < 0.05) {
                    nextIdx = 0;
                } else if (state.t - currentStep < 0.85) {
                    // finish current step first
                    state.targetT = currentStep + 0.999;
                    updateStepUI(true);
                    return;
                } else {
                    nextIdx = (currentStep + 1) % total;
                }
                state.t = nextIdx;
                state.targetT = nextIdx + 0.999;
                lastRenderedStepIdx = -1;
                updateStepUI(true);
            };

            prevStepBtn.onclick = () => {
                const sub = getActiveSub();
                const total = sub.steps.length;
                state.isPlaying = false;
                const currentStep = Math.max(0, Math.floor(state.t - 0.0001));
                const prevIdx = (currentStep - 1 + total) % total;
                state.t = prevIdx;
                state.targetT = prevIdx + 0.999;
                lastRenderedStepIdx = -1;
                updateStepUI(true);
            };

            const speeds = [0.6, 1.0, 1.5];
            let speedIdx = 1;
            speedBtn.onclick = () => {
                speedIdx = (speedIdx + 1) % speeds.length;
                state.speed = speeds[speedIdx];
                speedBtn.textContent = state.speed.toFixed(1) + 'x';
            };

            toggleLabelsBtn.onclick = () => {
                state.showLabels = !state.showLabels;
                toggleLabelsText.textContent = state.showLabels ? '標籤：開' : '標籤：關';
                toggleLabelsBtn.classList.toggle('active', state.showLabels);
                toggleLabelsBtn.classList.toggle('off', !state.showLabels);
            };

            toggleLegendBtn.onclick = () => legendDrawer.classList.toggle('open');
            closeLegendBtn.onclick = () => legendDrawer.classList.remove('open');

            // =========================================================================
            // 5. POINTER / TOUCH ZOOM & PAN ENGINE
            // =========================================================================
            const pointers = new Map();
            let lastPinchDist = null;
            let lastPinchMid = null;

            function zoomBy(factor, clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const cx = (clientX ?? rect.left + rect.width / 2) - rect.left;
                const cy = (clientY ?? rect.top + rect.height / 2) - rect.top;

                const oldZoom = state.cam.zoom;
                const newZoom = Math.max(state.cam.minZoom, Math.min(state.cam.maxZoom, oldZoom * factor));
                if (newZoom === oldZoom) return;

                // Keep world point under cursor stationary
                const worldX = (cx - rect.width / 2) / oldZoom + state.cam.x;
                const worldY = (cy - rect.height / 2) / oldZoom + state.cam.y;

                state.cam.zoom = newZoom;
                state.cam.x = worldX - (cx - rect.width / 2) / newZoom;
                state.cam.y = worldY - (cy - rect.height / 2) / newZoom;
                clampCamera();
            }

            function clampCamera() {
                state.cam.x = Math.max(-680, Math.min(680, state.cam.x));
                state.cam.y = Math.max(-420, Math.min(420, state.cam.y));
            }

            canvas.addEventListener('pointerdown', (e) => {
                canvas.setPointerCapture(e.pointerId);
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers.size === 2) {
                    const pts = [...pointers.values()];
                    lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    lastPinchMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
                }
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!pointers.has(e.pointerId)) return;
                const prev = pointers.get(e.pointerId);
                const curr = { x: e.clientX, y: e.clientY };
                pointers.set(e.pointerId, curr);

                if (pointers.size === 1) {
                    const dx = curr.x - prev.x;
                    const dy = curr.y - prev.y;
                    state.cam.x -= dx / state.cam.zoom;
                    state.cam.y -= dy / state.cam.zoom;
                    clampCamera();
                } else if (pointers.size === 2) {
                    const pts = [...pointers.values()];
                    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };

                    if (lastPinchDist && lastPinchMid) {
                        const panDx = mid.x - lastPinchMid.x;
                        const panDy = mid.y - lastPinchMid.y;
                        state.cam.x -= panDx / state.cam.zoom;
                        state.cam.y -= panDy / state.cam.zoom;

                        const scale = dist / lastPinchDist;
                        zoomBy(scale, mid.x, mid.y);
                    }
                    lastPinchDist = dist;
                    lastPinchMid = mid;
                }
            });

            function removePointer(e) {
                pointers.delete(e.pointerId);
                if (pointers.size < 2) {
                    lastPinchDist = null;
                    lastPinchMid = null;
                }
            }
            canvas.addEventListener('pointerup', removePointer);
            canvas.addEventListener('pointercancel', removePointer);

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const factor = e.deltaY < 0 ? 1.1 : 0.9;
                zoomBy(factor, e.clientX, e.clientY);
            }, { passive: false });

            zoomInBtn.onclick = () => zoomBy(1.22);
            zoomOutBtn.onclick = () => zoomBy(0.82);
            zoomResetBtn.onclick = () => fitCameraToStage(true);

            // =========================================================================
            // 6. DRAWING PRIMITIVES (SHARED VISUAL SYSTEM)
            // =========================================================================
            const lerp = (a, b, t) => a + (b - a) * t;
            const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
            const ease = (t) => {
                const x = clamp(t, 0, 1);
                return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
            };

            function roundRect(x, y, w, h, r) {
                const radius = Math.min(r, w / 2, h / 2);
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.arcTo(x + w, y, x + w, y + h, radius);
                ctx.arcTo(x + w, y + h, x, y + h, radius);
                ctx.arcTo(x, y + h, x, y, radius);
                ctx.arcTo(x, y, x + w, y, radius);
                ctx.closePath();
            }

            function drawEnvironmentZones(memY = 0, memPotential = null) {
                // Extracellular zone (top)
                const gTop = ctx.createLinearGradient(0, -450, 0, memY);
                gTop.addColorStop(0, PALETTE.extraBgTop);
                gTop.addColorStop(1, PALETTE.extraBgBot);
                ctx.fillStyle = gTop;
                ctx.fillRect(-1400, -900, 2800, 900 + memY);

                // Intracellular zone (bottom)
                const gBot = ctx.createLinearGradient(0, memY, 0, 450);
                gBot.addColorStop(0, PALETTE.intraBgTop);
                gBot.addColorStop(1, PALETTE.intraBgBot);
                ctx.fillStyle = gBot;
                ctx.fillRect(-1400, memY, 2800, 900);

                // Subtle biological grid
                ctx.save();
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.045)';
                ctx.lineWidth = 1;
                for (let x = -700; x <= 700; x += 70) {
                    ctx.beginPath(); ctx.moveTo(x, -450); ctx.lineTo(x, 450); ctx.stroke();
                }
                for (let y = -350; y <= 350; y += 70) {
                    ctx.beginPath(); ctx.moveTo(-800, y); ctx.lineTo(800, y); ctx.stroke();
                }
                ctx.restore();

                if (state.showLabels) {
                    ctx.save();
                    ctx.font = '700 13px "Noto Sans TC", sans-serif';
                    ctx.fillStyle = 'rgba(147, 197, 253, 0.65)';
                    ctx.textAlign = 'left';
                    ctx.fillText('細胞外液 (Extracellular Fluid)', -480, -248);
                    ctx.fillStyle = 'rgba(196, 181, 253, 0.65)';
                    ctx.fillText('細胞質 / 細胞內 (Intracellular / Cytoplasm)', -480, 256);
                    ctx.restore();
                }

                // Optional Membrane Potential signs (+ + + / - - -)
                if (memPotential) {
                    ctx.save();
                    ctx.font = '700 14px monospace';
                    ctx.textAlign = 'center';
                    for (let x = -430; x <= 430; x += 110) {
                        if (Math.abs(x) < 95) continue;
                        ctx.fillStyle = memPotential.top === '+' ? 'rgba(251, 146, 60, 0.65)' : 'rgba(56, 189, 248, 0.65)';
                        ctx.fillText(memPotential.top, x, memY - 40);
                        ctx.fillStyle = memPotential.bot === '-' ? 'rgba(56, 189, 248, 0.65)' : 'rgba(251, 146, 60, 0.65)';
                        ctx.fillText(memPotential.bot, x, memY + 50);
                    }
                    ctx.restore();
                }
            }

            function drawPhospholipid(cx, cy, nx, ny, halfThick, phase) {
                // nx, ny points outward (extracellular)
                const tx = -ny, ty = nx;
                const hOutX = cx + nx * halfThick;
                const hOutY = cy + ny * halfThick;
                const hInX = cx - nx * halfThick;
                const hInY = cy - ny * halfThick;

                const wave1 = Math.sin(state.ambientTime * 3.2 + phase) * 1.6;
                const wave2 = Math.cos(state.ambientTime * 3.0 + phase + 1.1) * 1.6;

                // Tails (outer leaflet -> center)
                ctx.strokeStyle = PALETTE.lipidTail;
                ctx.lineWidth = 1.8;
                for (let side of [-2.6, 2.6]) {
                    const w = side < 0 ? wave1 : wave2;
                    ctx.beginPath();
                    ctx.moveTo(hOutX + tx * side, hOutY + ty * side);
                    ctx.quadraticCurveTo(
                        cx + nx * (halfThick * 0.48) + tx * (side + w),
                        cy + ny * (halfThick * 0.48) + ty * (side + w),
                        cx + nx * 2 + tx * (side * 0.9),
                        cy + ny * 2 + ty * (side * 0.9)
                    );
                    ctx.stroke();

                    // Inner leaflet -> center
                    ctx.beginPath();
                    ctx.moveTo(hInX + tx * side, hInY + ty * side);
                    ctx.quadraticCurveTo(
                        cx - nx * (halfThick * 0.48) + tx * (side - w),
                        cy - ny * (halfThick * 0.48) + ty * (side - w),
                        cx - nx * 2 + tx * (side * 0.9),
                        cy - ny * 2 + ty * (side * 0.9)
                    );
                    ctx.stroke();
                }

                // Hydrophilic Heads
                for (let [hx, hy] of [[hOutX, hOutY], [hInX, hInY]]) {
                    ctx.beginPath();
                    ctx.arc(hx, hy, 5.8, 0, Math.PI * 2);
                    ctx.fillStyle = PALETTE.lipidHead;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(hx - 1.6, hy - 1.6, 2.0, 0, Math.PI * 2);
                    ctx.fillStyle = PALETTE.lipidHeadHi;
                    ctx.fill();
                }
            }

            function drawStraightBilayer(xStart, xEnd, yCenter, gaps = []) {
                const step = 15.5;
                const halfThick = 23;
                for (let x = xStart; x <= xEnd; x += step) {
                    let skip = false;
                    for (const [g1, g2] of gaps) {
                        if (x > g1 && x < g2) { skip = true; break; }
                    }
                    if (skip) continue;
                    drawPhospholipid(x, yCenter, 0, -1, halfThick, x * 0.08);
                }
            }

            function resamplePolyline(pts, spacing) {
                const res = [];
                if (pts.length < 2) return res;
                let acc = 0;
                res.push({ ...pts[0] });
                for (let i = 1; i < pts.length; i++) {
                    let p0 = pts[i - 1], p1 = pts[i];
                    let dx = p1.x - p0.x, dy = p1.y - p0.y;
                    let segLen = Math.hypot(dx, dy);
                    if (segLen < 0.001) continue;
                    let ux = dx / segLen, uy = dy / segLen;
                    let d = spacing - acc;
                    while (d <= segLen) {
                        res.push({ x: p0.x + ux * d, y: p0.y + uy * d });
                        d += spacing;
                    }
                    acc = segLen - (d - spacing);
                }
                return res;
            }

            function drawCurvedBilayer(rawPts, halfThick = 22) {
                const pts = resamplePolyline(rawPts, 15.5);
                for (let i = 0; i < pts.length; i++) {
                    const pPrev = pts[Math.max(0, i - 1)];
                    const pNext = pts[Math.min(pts.length - 1, i + 1)];
                    const tx = pNext.x - pPrev.x;
                    const ty = pNext.y - pPrev.y;
                    const len = Math.hypot(tx, ty) || 1;
                    // Normal pointing toward top (extracellular) when moving left-to-right
                    const nx = ty / len;
                    const ny = -tx / len;
                    drawPhospholipid(pts[i].x, pts[i].y, nx, ny, halfThick, i * 0.55);
                }
            }

            function drawClosedVesicleBilayer(cx, cy, rx, ry, clathrinAlpha = 0, clathrinScale = 1) {
                const avgR = (rx + ry) / 2;
                const count = Math.max(14, Math.round((2 * Math.PI * avgR) / 15.5));
                const halfThick = 16;
                for (let i = 0; i < count; i++) {
                    const ang = (i / count) * Math.PI * 2;
                    const px = cx + Math.cos(ang) * rx;
                    const py = cy + Math.sin(ang) * ry;
                    // Normal outward
                    const nx = Math.cos(ang);
                    const ny = Math.sin(ang);
                    drawPhospholipid(px, py, nx, ny, halfThick, i * 0.6);

                    if (clathrinAlpha > 0.02) {
                        ctx.save();
                        ctx.globalAlpha = clathrinAlpha;
                        const ox = cx + Math.cos(ang) * (rx + halfThick + 10 * clathrinScale);
                        const oy = cy + Math.sin(ang) * (ry + halfThick + 10 * clathrinScale);
                        ctx.strokeStyle = PALETTE.clathrin;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(ox - ny * 7, oy + nx * 7);
                        ctx.lineTo(ox + nx * 5, oy + ny * 5);
                        ctx.lineTo(ox + ny * 7, oy - nx * 7);
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }

            function drawLabel(text, x, y, tx = null, ty = null, color = '#38bdf8') {
                if (!state.showLabels) return;
                ctx.save();
                if (tx !== null && ty !== null) {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.4;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(tx, ty);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.beginPath();
                    ctx.arc(tx, ty, 3.2, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.fill();
                }

                ctx.font = '600 12px "Noto Sans TC", sans-serif';
                const padX = 9;
                const textW = ctx.measureText(text).width;
                const boxW = textW + padX * 2;
                const boxH = 24;

                roundRect(x - boxW / 2, y - boxH / 2, boxW, boxH, 7);
                ctx.fillStyle = 'rgba(10, 18, 33, 0.88)';
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.fillStyle = '#f1f5f9';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x, y + 0.5);
                ctx.restore();
            }

            function drawArrow(x1, y1, x2, y2, color = '#38bdf8', dashed = false, width = 2.6) {
                ctx.save();
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = width;
                if (dashed) ctx.setLineDash([6, 5]);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.setLineDash([]);

                const ang = Math.atan2(y2 - y1, x2 - x1);
                const head = 10;
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - head * Math.cos(ang - 0.42), y2 - head * Math.sin(ang - 0.42));
                ctx.lineTo(x2 - head * Math.cos(ang + 0.42), y2 - head * Math.sin(ang + 0.42));
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            function drawParticle(type, x, y, scale = 1, alpha = 1) {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(x, y);
                ctx.scale(scale, scale);

                const drawSphere = (r, color, sym) => {
                    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
                    g.addColorStop(0, '#ffffff');
                    g.addColorStop(0.35, color);
                    g.addColorStop(1, color);
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fillStyle = g;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    if (state.showLabels && sym) {
                        ctx.fillStyle = '#090f1d';
                        ctx.font = '800 9.5px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(sym, 0, 0.5);
                    }
                };

                switch (type) {
                    case 'o2': {
                        for (let dx of [-4.5, 4.5]) {
                            ctx.beginPath();
                            ctx.arc(dx, 0, 5.5, 0, Math.PI * 2);
                            ctx.fillStyle = PALETTE.o2;
                            ctx.fill();
                            ctx.strokeStyle = '#e0f2fe';
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                        if (state.showLabels) {
                            ctx.fillStyle = '#e0f2fe';
                            ctx.font = '700 10px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.fillText('O₂', 0, -10);
                        }
                        break;
                    }
                    case 'co2': {
                        for (let [dx, r, col] of [[-7, 4.3, '#ef4444'], [7, 4.3, '#ef4444'], [0, 5.2, PALETTE.co2]]) {
                            ctx.beginPath();
                            ctx.arc(dx, 0, r, 0, Math.PI * 2);
                            ctx.fillStyle = col;
                            ctx.fill();
                        }
                        if (state.showLabels) {
                            ctx.fillStyle = '#cbd5e1';
                            ctx.font = '700 10px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.fillText('CO₂', 0, -10);
                        }
                        break;
                    }
                    case 'lipid': {
                        ctx.beginPath();
                        ctx.moveTo(0, -8); ctx.lineTo(8, 0); ctx.lineTo(0, 8); ctx.lineTo(-8, 0);
                        ctx.closePath();
                        ctx.fillStyle = PALETTE.lipidMol;
                        ctx.fill();
                        ctx.strokeStyle = '#dcfce7';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        break;
                    }
                    case 'h2o': {
                        ctx.beginPath();
                        ctx.moveTo(0, -8);
                        ctx.bezierCurveTo(6, -1, 7, 5, 0, 8);
                        ctx.bezierCurveTo(-7, 5, -6, -1, 0, -8);
                        ctx.fillStyle = PALETTE.h2o;
                        ctx.fill();
                        if (state.showLabels) {
                            ctx.fillStyle = '#dbeafe';
                            ctx.font = '700 9px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.fillText('H₂O', 0, -11);
                        }
                        break;
                    }
                    case 'na': drawSphere(10.5, PALETTE.na, 'Na⁺'); break;
                    case 'k': drawSphere(10.5, PALETTE.k, 'K⁺'); break;
                    case 'ca': drawSphere(11, PALETTE.ca, 'Ca²⁺'); break;
                    case 'cl': drawSphere(10.5, PALETTE.cl, 'Cl⁻'); break;
                    case 'glucose': {
                        ctx.beginPath();
                        for (let i = 0; i < 6; i++) {
                            const a = (i / 6) * Math.PI * 2;
                            const px = Math.cos(a) * 13, py = Math.sin(a) * 13;
                            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fillStyle = PALETTE.glucose;
                        ctx.fill();
                        ctx.strokeStyle = '#fef9c3';
                        ctx.lineWidth = 1.6;
                        ctx.stroke();
                        if (state.showLabels) {
                            ctx.fillStyle = '#422006';
                            ctx.font = '800 9.5px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('Glu', 0, 0.5);
                        }
                        break;
                    }
                    case 'atp': {
                        ctx.beginPath();
                        for (let i = 0; i < 16; i++) {
                            const r = i % 2 === 0 ? 18 : 10;
                            const a = (i / 16) * Math.PI * 2;
                            const px = Math.cos(a) * r, py = Math.sin(a) * r;
                            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fillStyle = PALETTE.atp;
                        ctx.fill();
                        ctx.strokeStyle = '#fffbeb';
                        ctx.lineWidth = 1.3;
                        ctx.stroke();
                        if (state.showLabels) {
                            ctx.fillStyle = '#422006';
                            ctx.font = '800 10px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('ATP', 0, 0.5);
                        }
                        break;
                    }
                    case 'adp': {
                        roundRect(-14, -9, 28, 18, 9);
                        ctx.fillStyle = PALETTE.adp;
                        ctx.fill();
                        if (state.showLabels) {
                            ctx.fillStyle = '#0f172a';
                            ctx.font = '800 9.5px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('ADP', 0, 0.5);
                        }
                        break;
                    }
                    case 'pi': {
                        ctx.beginPath();
                        ctx.arc(0, 0, 8, 0, Math.PI * 2);
                        ctx.fillStyle = PALETTE.pi;
                        ctx.fill();
                        ctx.strokeStyle = '#ffe4e6';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();
                        if (state.showLabels) {
                            ctx.fillStyle = '#fff';
                            ctx.font = '800 9px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('Pᵢ', 0, 0.5);
                        }
                        break;
                    }
                    case 'ligand': {
                        ctx.beginPath();
                        ctx.moveTo(0, -10); ctx.lineTo(9, 0); ctx.lineTo(0, 10); ctx.lineTo(-9, 0);
                        ctx.closePath();
                        ctx.fillStyle = PALETTE.ligand;
                        ctx.fill();
                        ctx.strokeStyle = '#ffe4e6';
                        ctx.lineWidth = 1.3;
                        ctx.stroke();
                        break;
                    }
                    case 'ldl': {
                        ctx.beginPath();
                        ctx.arc(0, 0, 15, 0, Math.PI * 2);
                        ctx.fillStyle = '#fbbf24';
                        ctx.fill();
                        ctx.strokeStyle = '#fef3c7';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        // inner cholesterol dots
                        ctx.fillStyle = '#d97706';
                        for (let [dx, dy] of [[-4, -3], [5, -2], [0, 5], [-5, 4]]) {
                            ctx.beginPath(); ctx.arc(dx, dy, 2.3, 0, Math.PI * 2); ctx.fill();
                        }
                        // apoB receptor-binding tag
                        ctx.beginPath();
                        ctx.arc(0, 15, 5, 0, Math.PI * 2);
                        ctx.fillStyle = PALETTE.receptor;
                        ctx.fill();
                        if (state.showLabels) {
                            ctx.fillStyle = '#fef3c7';
                            ctx.font = '700 10px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.fillText('LDL', 0, -20);
                        }
                        break;
                    }
                    case 'bacterium': {
                        // Capsule microbe
                        ctx.save();
                        ctx.rotate(-0.18);
                        roundRect(-34, -17, 68, 34, 17);
                        ctx.fillStyle = PALETTE.bacterium;
                        ctx.fill();
                        ctx.strokeStyle = '#ecfccb';
                        ctx.lineWidth = 2.2;
                        ctx.stroke();
                        // internal DNA squiggle
                        ctx.strokeStyle = '#365314';
                        ctx.lineWidth = 2.2;
                        ctx.beginPath();
                        ctx.moveTo(-18, 0);
                        ctx.bezierCurveTo(-8, -10, 4, 10, 18, -2);
                        ctx.stroke();
                        // flagella
                        ctx.strokeStyle = '#bef264';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(34, 0);
                        ctx.quadraticCurveTo(46, -10, 56, 3);
                        ctx.stroke();
                        ctx.restore();
                        break;
                    }
                    case 'cargo': {
                        ctx.beginPath();
                        ctx.arc(0, 0, 7, 0, Math.PI * 2);
                        ctx.fillStyle = PALETTE.cargo;
                        ctx.fill();
                        ctx.strokeStyle = '#e0f2fe';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();
                        break;
                    }
                }
                ctx.restore();
            }

            // =========================================================================
            // 7. SHARED TRANSMEMBRANE PROTEIN RENDERERS
            // =========================================================================
            function drawChannelProtein(cx, cy, openFactor, gateType, ligandBound = false) {
                // Two transmembrane subunits forming a hydrophilic pore
                ctx.save();
                ctx.translate(cx, cy);
                const gap = lerp(5, 21, openFactor);
                const tilt = lerp(0.14, 0, openFactor);

                for (let side of [-1, 1]) {
                    ctx.save();
                    ctx.translate(side * (gap + 22), 0);
                    ctx.rotate(side * tilt);
                    const grad = ctx.createLinearGradient(-20, -48, 20, 48);
                    grad.addColorStop(0, '#67e8f9');
                    grad.addColorStop(0.5, PALETTE.channel);
                    grad.addColorStop(1, PALETTE.channelDark);
                    roundRect(-20, -48, 40, 96, 16);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = '#a5f3fc';
                    ctx.lineWidth = 1.6;
                    ctx.stroke();

                    // Ligand binding pocket on left subunit if ligand-gated
                    if (gateType === 'ligand' && side === -1) {
                        ctx.beginPath();
                        ctx.arc(-18, -24, 9, 0, Math.PI * 2);
                        ctx.fillStyle = '#083344';
                        ctx.fill();
                        ctx.strokeStyle = PALETTE.receptor;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // Hydrophilic pore glow when open
                if (openFactor > 0.1) {
                    ctx.fillStyle = `rgba(34, 211, 238, ${0.18 * openFactor})`;
                    ctx.fillRect(-gap, -46, gap * 2, 92);
                }

                // Gate bar / hinge indicator
                const gateAngle = lerp(0, 1.15, openFactor);
                ctx.save();
                ctx.translate(-gap - 4, -22);
                ctx.rotate(-gateAngle);
                roundRect(0, -4, gap * 2 + 8, 8, 4);
                ctx.fillStyle = gateType === 'ligand' ? PALETTE.receptor : '#fde047';
                ctx.fill();
                ctx.restore();

                if (ligandBound) {
                    drawParticle('ligand', -gap - 40, -24, 1.05, 1);
                }
                ctx.restore();
            }

            function drawCarrierProtein(cx, cy, conform, hasCargo = false, colorMain = PALETTE.carrier, colorDark = PALETTE.carrierDark, cargoType = 'glucose') {
                // conform: 0 = open UP (extracellular), 0.5 = occluded, 1 = open DOWN (intracellular)
                ctx.save();
                ctx.translate(cx, cy);

                const topSpread = lerp(18, -3, conform);
                const botSpread = lerp(-3, 18, conform);

                for (let side of [-1, 1]) {
                    ctx.beginPath();
                    ctx.moveTo(side * (14 + topSpread), -50);
                    ctx.bezierCurveTo(side * 46, -42, side * 48, 42, side * (14 + botSpread), 50);
                    ctx.lineTo(side * (4 + botSpread * 0.4), 50);
                    ctx.bezierCurveTo(side * 16, 12, side * 16, -12, side * (4 + topSpread * 0.4), -50);
                    ctx.closePath();

                    const grad = ctx.createLinearGradient(0, -50, 0, 50);
                    grad.addColorStop(0, colorMain);
                    grad.addColorStop(1, colorDark);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.42)';
                    ctx.lineWidth = 1.6;
                    ctx.stroke();
                }

                if (hasCargo) {
                    const cargoY = lerp(-24, 24, conform);
                    drawParticle(cargoType, 0, cargoY, 0.95, 1);
                }
                ctx.restore();
            }

            function drawPumpProtein(cx, cy, conform, phosphorylated, naCount, kCount) {
                // conform: 0 = open IN (down), 1 = open OUT (up)
                ctx.save();
                ctx.translate(cx, cy);

                const topSpread = lerp(-2, 22, conform);
                const botSpread = lerp(22, -2, conform);

                for (let side of [-1, 1]) {
                    ctx.beginPath();
                    ctx.moveTo(side * (16 + topSpread), -56);
                    ctx.bezierCurveTo(side * 56, -48, side * 56, 48, side * (16 + botSpread), 56);
                    ctx.lineTo(side * (5 + botSpread * 0.35), 56);
                    ctx.bezierCurveTo(side * 20, 14, side * 20, -14, side * (5 + topSpread * 0.35), -56);
                    ctx.closePath();

                    const grad = ctx.createLinearGradient(0, -56, 0, 56);
                    grad.addColorStop(0, '#c4b5fd');
                    grad.addColorStop(0.45, PALETTE.pump);
                    grad.addColorStop(1, PALETTE.pumpDark);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = '#ddd6fe';
                    ctx.lineWidth = 1.8;
                    ctx.stroke();
                }

                // ATPase phosphorylation domain on intracellular right lobe
                ctx.beginPath();
                ctx.arc(38, 46, 14, 0, Math.PI * 2);
                ctx.fillStyle = phosphorylated ? '#7c3aed' : '#4c1d95';
                ctx.fill();
                ctx.strokeStyle = '#ddd6fe';
                ctx.lineWidth = 1.4;
                ctx.stroke();

                if (phosphorylated) {
                    drawParticle('pi', 48, 52, 1.0, 1);
                }

                // Bound Na+ (3 slots)
                const naSlots = [[-7, -14], [7, 0], [-6, 14]];
                for (let i = 0; i < naCount; i++) {
                    const [sx, sy] = naSlots[i];
                    drawParticle('na', sx, sy + lerp(6, -8, conform), 0.8, 1);
                }

                // Bound K+ (2 slots)
                const kSlots = [[-7, -6], [7, 8]];
                for (let i = 0; i < kCount; i++) {
                    const [sx, sy] = kSlots[i];
                    drawParticle('k', sx, sy + lerp(6, -6, conform), 0.8, 1);
                }
                ctx.restore();
            }

            // =========================================================================
            // 8. INDIVIDUAL MECHANISM SCENE RENDERERS
            // =========================================================================

            // --- 0. OVERVIEW ---
            function renderOverview(t) {
                drawEnvironmentZones(0);
                drawStraightBilayer(-600, 600, 0, [
                    [-325, -245], [-210, -135], // Passive channels/carriers
                    [-45, 45], [85, 165]        // Active pumps
                ]);

                const activeStep = Math.floor(t - 0.0001);

                // Highlight Zone Backdrop
                const zones = [
                    { step: 1, x: -335, w: 270, col: PALETTE.passive, label: '一、被動運輸\n(不耗ATP・高→低)' },
                    { step: 2, x: 55, w: 230, col: PALETTE.active, label: '二、主動運輸\n(耗ATP・低→高)' },
                    { step: 3, x: 355, w: 270, col: PALETTE.bulk, label: '三、胞吞與胞吐\n(囊泡包裹進出)' }
                ];

                zones.forEach(z => {
                    const isFocused = activeStep === z.step;
                    ctx.save();
                    roundRect(z.x - z.w / 2, -210, z.w, 420, 18);
                    ctx.fillStyle = isFocused ? 'rgba(56, 189, 248, 0.07)' : 'rgba(255,255,255,0.015)';
