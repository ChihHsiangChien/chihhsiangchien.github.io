                    drawConformationalProtein(0, 0, openState, C.pump, C.pumpDark, 42, 60);
                    addLabel(-46, -10, '鈉鉀泵 (Na⁺/K⁺-ATPase)', C.pump, -125, -15);

                    // 3 顆 Na+ 逆濃度打出細胞外軌跡
                    const naOffsets = [-16, 0, 16];
                    if (step <= 2) {
                        naOffsets.forEach((ox, idx) => {
                            let nx = ox, ny = 140;
                            if (step === 0) {
                                nx = lerp(-90 + idx * 45, ox, e);
                                ny = lerp(145, 12 - idx * 8, e);
                            } else if (step === 1) {
                                nx = ox;
                                ny = 12 - idx * 8;
                            } else if (step === 2) {
                                nx = lerp(ox, -55 + idx * 55, e);
                                ny = lerp(12 - idx * 8, -135, e);
                            }
                            drawIon(nx, ny, 'Na⁺', C.na, 11.5);
                        });
                        if (step === 2) addLabel(0, -135, '3 個 Na⁺ 逆濃度打出細胞外', C.na, 0, -28);
                    }

                    // 2 顆 K+ 逆濃度送入細胞內軌跡
                    if (step >= 3) {
                        [-11, 11].forEach((ox, idx) => {
                            let kx = ox, ky = -135;
                            if (step === 3) {
                                kx = lerp(-40 + idx * 80, ox, e);
                                ky = lerp(-140, -6 + idx * 12, e);
                            } else if (step === 4) {
                                kx = ox;
                                ky = -6 + idx * 12;
                            } else if (step === 5) {
                                kx = lerp(ox, -40 + idx * 80, e);
                                ky = lerp(-6 + idx * 12, 138, e);
                            }
                            drawIon(kx, ky, 'K⁺', C.k, 12);
                        });
                        if (step === 5) addLabel(0, 138, '2 個 K⁺ 逆濃度送入細胞內', C.k, 0, 30);
                    }

                    // ATP 水解與磷酸化視覺
                    if (step === 1) {
                        if (t <= 0.5) {
                            const k = t / 0.5;
                            drawATPStar(lerp(130, 56, k), lerp(135, 65, k), 'ATP', 1.05);
                        } else {
                            const k = (t - 0.5) / 0.5;
                            drawATPStar(lerp(56, 135, k), lerp(65, 140, k), 'ADP', 0.85);
                        }
                        addLabel(95, 105, 'ATP 水解供能・磷酸化', C.atp, 85, 22);
                    }

                    if (hasPi) {
                        drawIon(piPos.x, piPos.y, 'Pi', C.pi, 11);
                        ctx.fillStyle = '#0f172a';
                        ctx.font = 'bold 9.5px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('Pi', piPos.x, piPos.y + 3);
                        if (step === 4) addLabel(piPos.x, piPos.y, '去磷酸化 (Pi 脫離)', C.pi, 90, 18);
                    }
                },

                /* 2B. 次級主動運輸：同向運輸 (Symport - SGLT) */
                symport(step, t) {
                    drawCompartments(0);
                    drawPlanarBilayer([{ x1: -265, x2: -185 }, { x1: -10, x2: 105 }], 0);
                    drawGradientMeter(340, '[Na⁺]', true, C.na);
                    drawGradientMeter(390, '[葡萄糖]', false, C.glucose);

                    const e = easeInOut(t);

                    // 左側輔助顯示：初級主動運輸（鈉鉀泵）建立 Na+ 濃度梯度
                    const miniSwing = Math.sin(state.globalTime * 2.5) * 0.7;
                    drawConformationalProtein(-225, 0, miniSwing, C.pump, C.pumpDark, 28, 48);
                    drawATPStar(-225, 76, 'ATP', 0.72);
                    drawArrow(-225, 30, -225, -95, C.na, true);
                    drawIon(-225, -108, 'Na⁺', C.na, 10.5);
                    addLabel(-225, -12, '初級主動運輸建立 Na⁺ 濃度差', C.pump, 0, -130);

                    // 頂部橫向位能耦合箭頭
                    drawArrow(-185, -110, 20, -110, 'rgba(249, 115, 22, 0.55)', true);

                    // 右側主角：同向運輸蛋白 SGLT (Indigo)
                    let openState = -1;
                    if (step === 0) openState = -1;
                    else if (step === 1) openState = lerp(-1, -0.2, e);
                    else if (step === 2) openState = lerp(-0.2, 1.0, e);
                    else openState = lerp(1.0, -1.0, clamp01((t - 0.45) / 0.55));

                    const cx = 48;
                    drawConformationalProtein(cx, 0, openState, C.carrier, C.carrierDark, 42, 58);
                    addLabel(cx + 45, 0, '同向運輸蛋白 (Symporter)', C.carrier, 110, 0);

                    // 細胞內高濃度葡萄糖背景（凸顯逆濃度進入！）
                    [[155, 130], [220, 150], [185, 175], [-40, 155]].forEach(([gx, gy], i) => {
                        drawGlucose(gx + Math.sin(state.globalTime * 1.5 + i) * 4, gy, 12);
                    });

                    // Na+ (順梯度) + 葡萄糖 (逆梯度) 同步進入
                    let naPos = { x: cx - 14, y: -135 };
                    let glcPos = { x: cx + 14, y: -135 };

                    if (step === 0) {
                        naPos = { x: cx - 22, y: -130 };
                        glcPos = { x: cx + 28, y: -130 };
                    } else if (step === 1) {
                        naPos = { x: lerp(cx - 28, cx - 12, e), y: lerp(-130, -6, e) };
                        glcPos = { x: lerp(cx + 28, cx + 12, e), y: lerp(-130, 8, e) };
                    } else if (step === 2) {
                        naPos = { x: cx - 12, y: lerp(-6, 12, e) };
                        glcPos = { x: cx + 12, y: lerp(8, 22, e) };
                    } else {
                        naPos = { x: lerp(cx - 12, cx - 38, e), y: lerp(12, 138, e) };
                        glcPos = { x: lerp(cx + 12, cx + 38, e), y: lerp(22, 138, e) };
                    }

                    drawIon(naPos.x, naPos.y, 'Na⁺', C.na, 12);
                    drawGlucose(glcPos.x, glcPos.y, 13.5);

                    if (step >= 2) {
                        drawArrow(cx - 16, -40, cx - 16, 95, C.na, true);
                        drawArrow(cx + 16, -40, cx + 16, 95, C.glucose, true);
                        addLabel(glcPos.x, glcPos.y, '葡萄糖逆濃度梯度協同進入', C.glucose, 115, 26);
                    }
                },

                /* 2C. 次級主動運輸：反向運輸 (Antiport - Na+/Ca2+ Exchanger) */
                antiport(step, t) {
                    drawCompartments(0);
                    drawPlanarBilayer([{ x1: -64, x2: 64 }], 0);
                    drawGradientMeter(340, '[Na⁺]', true, C.na);
                    drawGradientMeter(390, '[Ca²⁺]', true, C.ca);

                    // 背景高濃度外液 Na+ 與高濃度外液 Ca2+
                    [[-200, -135], [-130, -155], [160, -140]].forEach(([x, y], i) =>
                        drawIon(x + Math.sin(state.globalTime * 2 + i) * 4, y, 'Na⁺', C.na, 11));
                    [[225, -125], [275, -150], [-255, -120]].forEach(([x, y], i) =>
                        drawIon(x + Math.cos(state.globalTime * 2 + i) * 4, y, 'Ca²⁺', C.ca, 11.5));

                    const e = easeInOut(t);
                    let openState = -0.7;
                    if (step === 0) openState = lerp(-0.7, -0.35, e);
                    else if (step === 1) openState = lerp(-0.35, 0.0, e);
                    else if (step === 2) openState = lerp(0.0, 0.85, e);
                    else openState = lerp(0.85, -0.7, clamp01((t - 0.45) / 0.55));

                    drawConformationalProtein(0, 0, openState, C.carrier, C.carrierDark, 42, 58);
                    addLabel(-46, 0, '反向運輸蛋白 (Antiporter)', C.carrier, -125, 0);

                    // Na+ 由外向內 (順濃度) vs Ca2+ 由內向外 (逆濃度)
                    let naPos, caPos;
                    if (step === 0) {
                        naPos = { x: lerp(-35, -13, e), y: lerp(-135, -20, e) };
                        caPos = { x: lerp(35, 13, e), y: lerp(135, 20, e) };
                    } else if (step === 1) {
                        naPos = { x: -13, y: lerp(-20, -4, e) };
                        caPos = { x: 13, y: lerp(20, 4, e) };
                    } else if (step === 2) {
                        naPos = { x: -13, y: lerp(-4, 65, e) };
                        caPos = { x: 13, y: lerp(4, -65, e) };
                    } else {
                        naPos = { x: lerp(-13, -45, e), y: lerp(65, 140, e) };
                        caPos = { x: lerp(13, 45, e), y: lerp(-65, -140, e) };
                    }

                    drawArrow(-18, -85, -18, 85, C.na, true);
                    drawArrow(18, 85, 18, -85, C.ca, true);

                    drawIon(naPos.x, naPos.y, 'Na⁺', C.na, 12);
                    drawIon(caPos.x, caPos.y, 'Ca²⁺', C.ca, 13);

                    addLabel(naPos.x, naPos.y, 'Na⁺ 順梯度流入提供位能', C.na, -120, 26);
                    addLabel(caPos.x, caPos.y, 'Ca²⁺ 逆濃度梯度排出膜外', C.ca, 125, -24);
                },

                /* =======================================================================
                 * 三、胞吞與胞吐作用：可變形流體磷脂膜與囊泡幾何引擎
                 * ======================================================================= */

                /* 3A. 吞噬作用 (Phagocytosis) */
                phago(step, t) {
                    const memY = 20;
                    const e = easeInOut(t);

                    // 計算偽足包圍進度與囊泡高度
                    let pseudoH = 0;      // 偽足向上延伸高度
                    let pinch = 0;        // 頂端合攏程度
                    let vesY = -45;       // 細菌與吞噬體 Y 座標
                    let detached = false;

                    if (step === 0) {
                        vesY = lerp(-125, -55, e);
                    } else if (step === 1) {
                        vesY = -50;
                        pseudoH = lerp(0, 95, e);
                    } else if (step === 2) {
                        vesY = lerp(-50, -25, e);
                        pseudoH = 95;
                        pinch = e;
                    } else {
                        detached = true;
                        vesY = lerp(45, 135, e);
                    }

                    // 繪製底層細胞質與外液
                    drawCompartments(memY);

                    if (!detached) {
                        // 繪製向上延伸包圍細菌的偽足連續細胞膜曲線
                        drawDeformedMembrane(memY, x => {
                            const ax = Math.abs(x);
                            if (ax > 135) return 0;
                            // 兩側隆起偽足、中央凹窩承接細菌
                            const bell = Math.cos((ax / 135) * Math.PI * 0.5);
                            const armPeak = Math.exp(-Math.pow((ax - (72 - pinch * 54)) / 28, 2));
                            const cup = -pseudoH * 0.92 * armPeak + (pseudoH * 0.25) * Math.exp(-Math.pow(x / 42, 2));
                            return cup * bell;
                        });

                        // 肌動蛋白微絲骨架推進示意
                        if (step === 1 || step === 2) {
                            ctx.strokeStyle = 'rgba(244, 63, 94, 0.55)';
                            ctx.lineWidth = 2.5;
                            for (const side of [-1, 1]) {
                                const px = side * (68 - pinch * 45);
                                drawArrow(px, 55, px, -35, '#fb7185', true);
                            }
                            addLabel(88, 12, '偽足延伸 (細胞骨架推動)', '#fb7185', 105, 16);
                        }
                    } else {
                        // 膜已平復，下方形成獨立大型磷脂雙層吞噬體囊泡
                        drawDeformedMembrane(memY, () => 0);
                        drawBilayerVesicle(0, vesY, 64);
                        addLabel(64, vesY, '吞噬體 (Phagosome)', C.lipidHead, 95, 0);
                    }

                    // 繪製桿狀細菌 (Bacterium)
                    drawBacterium(0, vesY);
                    addLabel(0, vesY - 26, '入侵細菌 (大型固體顆粒)', C.bacteria, 0, -34);
                },

                /* 3B. 胞飲作用 (Pinocytosis) */
                pino(step, t) {
                    const memY = -20;
                    const e = easeInOut(t);

                    let pitDepth = 0;
                    let detached = false;
                    let vesY = 45;

                    if (step === 0) pitDepth = lerp(0, 15, e);
                    else if (step === 1) pitDepth = lerp(15, 92, e);
                    else if (step === 2) pitDepth = lerp(92, 108, e);
                    else {
                        detached = true;
                        vesY = lerp(68, 145, e);
                    }

                    drawCompartments(memY);

                    if (!detached) {
                        const neckPinch = step === 2 ? e * 0.62 : 0;
                        drawDeformedMembrane(memY, x => {
                            const w = 68 * (1 - neckPinch * 0.45);
                            return pitDepth * Math.exp(-Math.pow(x / w, 2));
                        });
                        if (step === 2) {
                            drawArrow(-42, memY + 22, -12, memY + 22, '#38bdf8', false);
                            drawArrow(42, memY + 22, 12, memY + 22, '#38bdf8', false);
                            addLabel(45, memY + 22, '膜頸部收縮封口', '#38bdf8', 95, -18);
                        }
                    } else {
                        drawDeformedMembrane(memY, () => 0);
                        drawBilayerVesicle(0, vesY, 46);
                        addLabel(48, vesY, '胞飲囊泡 (液體與小溶質)', C.lipidHead, 105, 0);
                    }

                    // 細胞外液與非專一微小溶質顆粒
                    const dropCenterY = detached ? vesY : (step === 0 ? lerp(-95, -25, e) : memY + pitDepth * 0.58);
                    const solutes = [
                        { dx: -14, dy: -8, c: C.gas },
                        { dx: 13, dy: -5, c: C.na },
                        { dx: -4, dy: 11, c: C.glucose },
                        { dx: 10, dy: 12, c: C.water },
                        { dx: -15, dy: 8, c: C.ca }
                    ];
                    solutes.forEach((s, idx) => {
                        const jx = Math.sin(state.globalTime * 3 + idx) * 2.5;
                        const jy = Math.cos(state.globalTime * 2.7 + idx) * 2.5;
                        drawIon(s.dx + jx, dropCenterY + s.dy + jy, '', s.c, 6);
                    });

                    // 外液背景游離小溶質
                    [[-190, -110, C.gas], [175, -120, C.water], [-95, -135, C.na], [115, -95, C.ca]].forEach(([x, y, c], i) => {
                        drawIon(x + Math.sin(state.globalTime * 2 + i) * 4, y, '', c, 6);
                    });

                    if (!detached) {
                        addLabel(0, dropCenterY - 22, '非專一性吸入細胞外液與溶質', C.water, 0, -34);
                    }
                },

                /* 3C. 受體媒介型胞吞 (Receptor-mediated Endocytosis - LDL & Clathrin) */
                rme(step, t) {
                    const memY = -25;
                    const e = easeInOut(t);

                    let pitDepth = 0;
                    let detached = false;
                    let vesY = 65;

                    if (step === 0) pitDepth = 0;
                    else if (step === 1) pitDepth = lerp(0, 95, e);
                    else if (step === 2) pitDepth = 105;
                    else {
                        detached = true;
                        vesY = lerp(75, 148, e);
                    }

                    drawCompartments(memY);

                    const recAngles = [-0.55, 0, 0.55];

                    if (!detached) {
                        const w = step === 2 ? lerp(76, 46, e) : 76;
                        const curveFn = x => pitDepth * Math.exp(-Math.pow(x / w, 2));
                        drawDeformedMembrane(memY, curveFn);

                        // 繪製膜上 Y 型專一受體與結合的 LDL 膽固醇顆粒
                        recAngles.forEach((ang, idx) => {
                            const rx = ang * (step === 0 ? 78 : lerp(78, 38, step === 1 ? e : 1));
                            const ry = memY + curveFn(rx) - 18;
                            drawYReceptor(rx, ry, -ang * (pitDepth / 100) * 0.9);

                            const ldlY = step === 0 ? lerp(-130 - idx * 14, ry - 15, e) : ry - 15;
                            drawIon(rx, ldlY, 'LDL', '#facc15', 12);
                        });

                        // 繪製細胞質側網格蛋白外衣 (Clathrin Coat)
                        if (step >= 1) {
                            const coatAlpha = step === 1 ? e : 1;
                            ctx.save();
                            ctx.globalAlpha = coatAlpha;
                            ctx.strokeStyle = C.clathrin;
                            ctx.lineWidth = 3;
                            ctx.setLineDash([6, 4]);
                            ctx.beginPath();
                            for (let x = -72; x <= 72; x += 6) {
                                const cy = memY + curveFn(x) + 28;
                                if (x === -72) ctx.moveTo(x, cy); else ctx.lineTo(x, cy);
                            }
                            ctx.stroke();
                            ctx.restore();
                            addLabel(0, memY + pitDepth + 36, '網格蛋白外衣 (Clathrin) 有被小窩', C.clathrin, 0, 22);
                        }

                        addLabel(-50, memY - 38, '膜上專一受體捕捉 LDL', C.receptor, -110, -28);
                    } else {
                        drawDeformedMembrane(memY, () => 0);
                        drawBilayerVesicle(0, vesY, 54);

                        // 囊泡內的受體與 LDL
                        recAngles.forEach(a => {
                            const ca = a * 2.1 - Math.PI * 0.5;
                            const rx = Math.cos(ca) * 24;
                            const ry = vesY + Math.sin(ca) * 24;
                            drawIon(rx * 0.55, vesY + (ry - vesY) * 0.55, 'LDL', '#facc15', 10.5);
                        });

                        // 脫去網格蛋白外衣動畫
                        const coatR = lerp(62, 92, e);
                        ctx.save();
                        ctx.globalAlpha = 1 - e * 0.8;
                        ctx.strokeStyle = C.clathrin;
                        ctx.lineWidth = 2.8;
                        ctx.setLineDash([7, 6]);
                        ctx.beginPath();
                        ctx.arc(0, vesY, coatR, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.restore();

                        addLabel(58, vesY, '有被囊泡進入細胞並脫去外衣', C.receptor, 115, 0);
                    }
                },

                /* 3D. 胞吐作用 (Exocytosis) */
                exo(step, t) {
                    const memY = -15;
                    const e = easeInOut(t);

                    drawCompartments(memY);

                    if (step === 0 || step === 1) {
                        // 囊泡在細胞質向上靠近並由 SNARE 蛋白錨定
                        drawDeformedMembrane(memY, () => 0);
                        const vy = step === 0 ? lerp(155, 72, e) : lerp(72, 54, e);
                        drawBilayerVesicle(0, vy, 50);

                        // 囊泡內分泌分子（神經傳導物質／激素／消化酶）
                        const cargos = [[-14, -10], [14, -8], [0, 12], [-12, 10], [12, 11], [0, -2]];
                        cargos.forEach(([dx, dy]) => drawIon(dx, vy + dy, '', C.secretory, 7.5));

                        // SNARE 錨定對接複合體
                        if (step === 1) {
                            for (const sx of [-26, 26]) {
                                ctx.strokeStyle = C.receptor;
                                ctx.lineWidth = 3.2;
                                ctx.beginPath();
                                ctx.moveTo(sx, memY + 18);
                                ctx.lineTo(sx * 0.85, vy - 42);
                                ctx.stroke();
                            }
                            addLabel(32, (memY + vy) * 0.5, 'SNARE 融合蛋白錨定對接', C.receptor, 120, 8);
                        }
                        addLabel(-52, vy, '分泌囊泡 (傳導物質/激素/酶)', C.lipidHead, -115, 16);

                    } else if (step === 2) {
                        // 脂雙層融合開啟 Omega 融合孔
                        const openW = lerp(22, 68, e);
                        drawDeformedMembrane(memY, x => 82 * Math.exp(-Math.pow(x / openW, 2)));

                        const cargos = [[-14, -10], [14, -8], [0, 12], [-12, 10], [12, 11], [0, -2]];
                        cargos.forEach(([dx, dy], i) => {
                            const rise = lerp(42, -25 - i * 10, e);
                            drawIon(dx * (1 + e * 0.5), memY + rise + dy * 0.3, '', C.secretory, 7.5);
                        });
                        drawArrow(0, memY + 45, 0, memY - 75, C.secretory, true);
                        addLabel(52, memY + 25, '囊泡膜與細胞膜融合開啟孔道', C.lipidHead, 120, 18);

                    } else {
                        // 囊泡完全併入細胞膜並大量釋放物質至膜外
                        const flatten = (1 - e) * 35;
                        drawDeformedMembrane(memY, x => flatten * Math.exp(-Math.pow(x / 80, 2)));

                        const burst = [
                            [-75, -145], [-35, -165], [0, -180], [42, -160], [82, -138], [-18, -120], [25, -115]
                        ];
                        burst.forEach(([bx, by], i) => {
                            const px = lerp(bx * 0.25, bx, e) + Math.sin(state.globalTime * 2.5 + i) * 4;
                            const py = lerp(memY - 25, by, e);
                            drawIon(px, py, '', C.secretory, 8);
                        });
                        addLabel(0, -155, '神經傳導物質／激素／消化酶排出細胞外', C.secretory, 0, -30);
                    }
                }
            };

            /* 胞吞與胞吐專用幾何輔助繪圖 */
            function drawDeformedMembrane(baseY, offsetFn) {
                // 填滿膜曲線下方的細胞質色塊，讓凹陷或偽足內部底色完全正確！
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(-1400, 1000);
                ctx.lineTo(-1400, baseY);
                for (let x = -450; x <= 450; x += 8) {
                    ctx.lineTo(x, baseY + offsetFn(x));
                }
                ctx.lineTo(1400, baseY);
                ctx.lineTo(1400, 1000);
                ctx.closePath();
                ctx.fillStyle = C.icfBg;
                ctx.fill();
                ctx.restore();

                // 沿參數曲線計算切線與法向量，排列雙層磷脂分子
                const dx = 2;
                for (let x = -430; x <= 430; x += 18) {
                    const y = baseY + offsetFn(x);
                    const yNext = baseY + offsetFn(x + dx);
                    const yPrev = baseY + offsetFn(x - dx);
                    const slope = (yNext - yPrev) / (2 * dx);
                    const len = Math.hypot(1, slope);
                    // 朝向膜內部的單位法向量 (往下為 +y)
                    const nx = -slope / len;
                    const ny = 1 / len;

                    const halfT = 18;
                    // 外層磷脂（頭朝外液 -n，尾朝膜核心 +n）
                    drawSingleLipid(x - nx * halfT, y - ny * halfT, nx, ny, 16, x * 0.08);
                    // 內層磷脂（頭朝細胞質 +n，尾朝膜核心 -n）
                    drawSingleLipid(x + nx * halfT, y + ny * halfT, -nx, -ny, 16, x * 0.08 + 1.2);
                }
            }

            function drawBilayerVesicle(cx, cy, radius) {
                // 囊泡內部水相底色
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, radius - 14, 0, Math.PI * 2);
                ctx.fillStyle = C.ecfBg;
                ctx.fill();
                ctx.restore();

                const outerCount = Math.max(14, Math.round((2 * Math.PI * (radius + 9)) / 16));
                for (let i = 0; i < outerCount; i++) {
                    const a = (i / outerCount) * Math.PI * 2;
                    const nx = Math.cos(a), ny = Math.sin(a);
                    drawSingleLipid(cx + nx * (radius + 11), cy + ny * (radius + 11), -nx, -ny, 11, i);
                }

                const innerCount = Math.max(10, Math.round((2 * Math.PI * (radius - 11)) / 16));
                for (let i = 0; i < innerCount; i++) {
                    const a = (i / innerCount) * Math.PI * 2;
                    const nx = Math.cos(a), ny = Math.sin(a);
                    drawSingleLipid(cx + nx * (radius - 11), cy + ny * (radius - 11), nx, ny, 11, i + 0.5);
                }
            }

            function drawBacterium(x, y) {
                ctx.save();
                ctx.translate(x, y);
                ctx.fillStyle = C.bacteria;
                ctx.strokeStyle = '#86efac';
                ctx.lineWidth = 2.2;
                roundRectPath(ctx, -34, -18, 68, 36, 18);
                ctx.fill();
                ctx.stroke();

                // 細菌內部擬核螺旋與鞭毛
                ctx.strokeStyle = '#14532d';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let px = -20; px <= 20; px += 4) {
                    const py = Math.sin(px * 0.45) * 6;
                    if (px === -20) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.stroke();

                ctx.strokeStyle = '#86efac';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.moveTo(34, 0);
                ctx.quadraticCurveTo(48, Math.sin(state.globalTime * 8) * 10, 58, -4);
                ctx.stroke();
                ctx.restore();
            }

            function drawYReceptor(x, y, rot = 0) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rot);
                ctx.strokeStyle = C.receptor;
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 14);
                ctx.lineTo(0, 0);
                ctx.moveTo(-9, -9);
                ctx.lineTo(0, 0);
                ctx.lineTo(9, -9);
                ctx.stroke();
                ctx.restore();
            }

            /* =========================================================================
             * 9. 主動畫迴圈 (Main Simulation Loop)
             * ========================================================================= */
            let lastTS = performance.now();

            function animate(now) {
                const dt = Math.min(0.05, (now - lastTS) / 1000);
                lastTS = now;
                state.globalTime += dt * state.speed;

                // 更新步驟進度條與狀態機
                const sub = currentSub();
                const stepDuration = sub.id === 'nakpump' ? 2.4 : 2.8;

                if (state.autoPlay) {
                    state.stepT += (dt * state.speed) / stepDuration;
                    if (state.stepT >= 1.0) {
                        state.stepT = 0;
                        state.stepIndex = (state.stepIndex + 1) % sub.steps.length;
                        if (state.tab === 'overview' && threeApp.ready) {
                            threeApp.tweenToStep(state.stepIndex);
                        }
                    }
                    updateStepText();
                } else if (state.stepAnimating) {
                    // 單步模式下，平滑演繹完當前步驟 0 -> 1 後停駐在該步驟關鍵狀態！
                    state.stepT += (dt * state.speed) / 1.15;
                    if (state.stepT >= 1.0) {
                        state.stepT = 1.0;
                        state.stepAnimating = false;
                    }
                    updateStepText();
                }

                // 渲染 3D 或 2D 視圖
                if (state.tab === 'overview') {
                    threeApp.render(state.globalTime);
                } else {
                    render2DScene(sub.id, state.stepIndex, state.stepT);
                }

                requestAnimationFrame(animate);
            }

            function render2DScene(subId, stepIdx, stepT) {
                frameLabels = [];
                ctx.save();
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, vw, vh);

                // 套用世界座標與 Zoom & Pan 矩陣
                const s = getBaseScale() * state.cam2d.zoom;
                ctx.translate(vw * 0.5, vh * 0.5);
                ctx.scale(s, s);
                ctx.translate(state.cam2d.x, state.cam2d.y);

                const fn = Renderers[subId];
                if (fn) fn(stepIdx, stepT);

                ctx.restore();

                // 以螢幕原生解析度繪製文字標籤（縮放時永遠清晰銳利）
                ctx.save();
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                flush2DLabels();
                ctx.restore();
            }

            /* =========================================================================
             * 10. UI 事件與鍵盤快捷鍵綁定
             * ========================================================================= */
            dom.mainTabs.addEventListener('click', e => {
                const btn = e.target.closest('.tab-btn');
                if (!btn) return;
                const nextTab = btn.dataset.tab;
                if (nextTab === state.tab) return;
                state.tab = nextTab;
                state.subIndex = 0;
                state.stepIndex = 0;
                state.stepT = 0;
                state.stepAnimating = true;
                state.cam2d = { x: 0, y: 0, zoom: 1.0 };
                if (nextTab === 'overview' && threeApp.ready) {
                    threeApp.tweenToStep(0);
                }
                syncUI();
            });

            dom.subTabs.addEventListener('click', e => {
                const btn = e.target.closest('.sub-btn');
                if (!btn) return;
                state.subIndex = Number(btn.dataset.idx);
                state.stepIndex = 0;
                state.stepT = 0;
                state.stepAnimating = true;
                state.cam2d = { x: 0, y: 0, zoom: 1.0 };
                syncUI();
            });

            dom.contextActions.addEventListener('click', e => {
                const btn = e.target.closest('.ctx-btn');
                if (!btn) return;
                if (btn.dataset.gate) {
                    state.gateMode = btn.dataset.gate;
                    syncUI();
                } else if (btn.dataset.t3d) {
                    state.touch3dMode = btn.dataset.t3d;
                    syncUI();
                }
            });

            dom.stepDots.addEventListener('click', e => {
                const btn = e.target.closest('.step-dot');
                if (!btn) return;
                goToStep(Number(btn.dataset.step), true);
            });

            dom.btnPrev.addEventListener('click', () => goToStep(state.stepIndex - 1, true));
            dom.btnNext.addEventListener('click', () => goToStep(state.stepIndex + 1, true));

            dom.btnReplayStep.addEventListener('click', () => {
                state.autoPlay = false;
                state.stepT = 0;
                state.stepAnimating = true;
                updateStepText();
            });

            dom.btnPlayPause.addEventListener('click', () => {
                state.autoPlay = !state.autoPlay;
                if (state.autoPlay && state.stepT >= 0.99) {
                    state.stepT = 0;
                    state.stepIndex = (state.stepIndex + 1) % currentSub().steps.length;
                }
                updateStepText();
            });

            dom.speedSelect.addEventListener('change', e => {
                state.speed = parseFloat(e.target.value) || 1.0;
            });

            function toggleLabels() {
                state.showLabels = !state.showLabels;
                dom.btnToggleLabels.classList.toggle('active', state.showLabels);
                dom.btnToggleLabels.querySelector('.txt').textContent = `文字標籤：${state.showLabels ? '開' : '關'}`;
            }
            dom.btnToggleLabels.addEventListener('click', toggleLabels);

            dom.btnLegend.addEventListener('click', () => {
                dom.legendDrawer.classList.toggle('hidden');
                dom.btnLegend.classList.toggle('active', !dom.legendDrawer.classList.contains('hidden'));
            });
            dom.btnCloseLegend.addEventListener('click', () => {
                dom.legendDrawer.classList.add('hidden');
                dom.btnLegend.classList.remove('active');
            });

            // 浮動 Zoom 按鈕
            dom.btnZoomIn.addEventListener('click', () => {
                if (state.tab === 'overview' && threeApp.ready) {
                    threeApp.camGoal = null;
                    threeApp.camSpherical.r = Math.max(8, threeApp.camSpherical.r * 0.84);
                    updateZoomReadout();
                } else {
                    const rect = dom.viewport.getBoundingClientRect();
                    zoom2DBy(1.22, rect.left + vw * 0.5, rect.top + vh * 0.5);
                }
            });

            dom.btnZoomOut.addEventListener('click', () => {
                if (state.tab === 'overview' && threeApp.ready) {
                    threeApp.camGoal = null;
                    threeApp.camSpherical.r = Math.min(42, threeApp.camSpherical.r * 1.18);
                    updateZoomReadout();
                } else {
                    const rect = dom.viewport.getBoundingClientRect();
                    zoom2DBy(1 / 1.22, rect.left + vw * 0.5, rect.top + vh * 0.5);
                }
            });

            dom.btnZoomReset.addEventListener('click', () => {
                if (state.tab === 'overview' && threeApp.ready) {
                    threeApp.resetCamera();
                } else {
                    state.cam2d = { x: 0, y: 0, zoom: 1.0 };
                    updateZoomReadout();
                }
            });

            // 鍵盤快捷鍵支援
            window.addEventListener('keydown', e => {
                if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    dom.btnPlayPause.click();
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    goToStep(state.stepIndex + 1, true);
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    goToStep(state.stepIndex - 1, true);
                } else if (e.key === 'l' || e.key === 'L') {
                    toggleLabels();
                }
            });

            /* =========================================================================
             * 11. 啟動初始化
             * ========================================================================= */
            resizeViewport();
            threeApp.init();
            syncUI();
            requestAnimationFrame(animate);
        })();
    </script>
</body>

</html>
