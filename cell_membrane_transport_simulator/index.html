<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>細胞膜運輸機制完整互動模擬器 | Cell Membrane Transport Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-app: #0b1120;
            --bg-panel: rgba(15, 23, 42, 0.92);
            --bg-card: rgba(30, 41, 59, 0.85);
            --border-subtle: rgba(148, 163, 184, 0.2);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.28);

            /* 跨分頁統一生物分子色票 */
            --c-lipid-head: #f59e0b;
            --c-lipid-tail: #94a3b8;
            --c-gas: #38bdf8;
            --c-na: #f97316;
            --c-k: #a855f7;
            --c-ca: #10b981;
            --c-glucose: #eab308;
            --c-atp: #f43f5e;
            --c-channel: #06b6d4;
            --c-carrier: #6366f1;
            --c-pump: #ec4899;
            --c-receptor: #14b8a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: var(--bg-app);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh;
        }

        /* 頂部導覽列 */
        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-subtle);
            padding: 8px 12px 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 30;
            backdrop-filter: blur(10px);
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: clamp(0.92rem, 2vw, 1.08rem);
            letter-spacing: 0.02em;
            color: #fff;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--c-lipid-head);
            box-shadow: 0 0 10px var(--c-lipid-head);
        }

        .global-tools {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn {
            background: rgba(51, 65, 85, 0.75);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.18s ease;
            min-height: 34px;
        }

        .tool-btn:hover {
            background: rgba(71, 85, 105, 0.9);
        }

        .tool-btn.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent);
            color: #7dd3fc;
        }

        /* 主分頁 Tabs */
        .main-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .main-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex: 1 0 auto;
            background: rgba(30, 41, 59, 0.7);
            color: var(--text-muted);
            border: 1px solid transparent;
            border-radius: 9px;
            padding: 7px 12px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            min-height: 36px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.28), rgba(99, 102, 241, 0.28));
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* 子機制選擇列 */
        .sub-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.75);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 25;
        }

        .sub-tabs::-webkit-scrollbar {
            display: none;
        }

        .sub-tabs.hidden {
            display: none;
        }

        .sub-btn {
            background: rgba(30, 41, 59, 0.8);
            color: #cbd5e1;
            border: 1px solid var(--border-subtle);
            border-radius: 999px;
            padding: 5px 13px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s;
            min-height: 32px;
        }

        .sub-btn.active {
            background: var(--accent);
            color: #082f49;
            border-color: var(--accent);
            font-weight: 700;
        }

        /* 模擬主畫布區 */
        #viewport {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: hidden;
            touch-action: none;
            background: radial-gradient(circle at 50% 35%, #10233a 0%, #0b1324 65%, #080d1a 100%);
        }

        #simCanvas,
        #threeContainer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #threeContainer.hidden,
        #simCanvas.hidden {
            display: none;
        }

        /* 3D 投影標籤層 */
        #overlayLabels {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .lbl-3d {
            position: absolute;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(148, 163, 184, 0.45);
            border-left: 3px solid var(--accent);
            color: #f8fafc;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
            transition: opacity 0.15s;
        }

        /* 左上機制資訊膠囊 */
        .hud-info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: min(330px, calc(100% - 70px));
            pointer-events: none;
        }

        .hud-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .badge {
            background: rgba(15, 23, 42, 0.84);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(6px);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.73rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .badge.no-atp {
            border-left: 3px solid #38bdf8;
        }

        .badge.use-atp {
            border-left: 3px solid #f43f5e;
        }

        .badge.grad-down {
            border-left: 3px solid #10b981;
        }

        .badge.grad-up {
            border-left: 3px solid #f59e0b;
        }

        /* 特殊互動按鈕列（如閘門模式切換 / 3D單指模式） */
        .context-actions {
            pointer-events: auto;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .ctx-btn {
            background: rgba(30, 41, 59, 0.92);
            color: #bae6fd;
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 7px;
            padding: 5px 10px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .ctx-btn.active {
            background: #0284c7;
            color: #fff;
        }

        /* 右上縮放與視角控制浮動鈕 */
        .zoom-dock {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid var(--border-subtle);
            padding: 5px;
            border-radius: 10px;
            backdrop-filter: blur(6px);
        }

        .z-btn {
            width: 36px;
            height: 34px;
            border-radius: 7px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(30, 41, 59, 0.85);
            color: #f8fafc;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .z-btn:active {
            background: rgba(56, 189, 248, 0.35);
        }

        .z-readout {
            font-size: 0.68rem;
            text-align: center;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        /* 底部 Step-by-Step 控制面板 */
        footer {
            background: var(--bg-panel);
            border-top: 1px solid var(--border-subtle);
            padding: 8px 12px 10px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 7px;
            backdrop-filter: blur(10px);
        }

        .step-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .step-title-box {
            flex: 1;
            min-width: 0;
        }

        .step-tag {
            display: inline-block;
            background: rgba(56, 189, 248, 0.2);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 5px;
            padding: 1px 7px;
            font-size: 0.73rem;
            font-weight: 700;
            margin-right: 6px;
        }

        .step-desc {
            font-size: clamp(0.8rem, 1.9vw, 0.92rem);
            color: #f1f5f9;
            line-height: 1.4;
        }

        .mode-indicator {
            font-size: 0.72rem;
            padding: 2px 7px;
            border-radius: 99px;
            white-space: nowrap;
            background: rgba(16, 185, 129, 0.18);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .mode-indicator.paused {
            background: rgba(245, 158, 11, 0.18);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.4);
        }

        /* 步驟節點軌 */
        .step-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .step-dot {
            flex: 1;
            height: 24px;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
            background: rgba(30, 41, 59, 0.8);
            color: var(--text-muted);
            font-size: 0.73rem;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s, color 0.2s;
        }

        .step-dot .fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: rgba(56, 189, 248, 0.28);
            pointer-events: none;
        }

        .step-dot span {
            position: relative;
            z-index: 1;
        }

        .step-dot.active {
            border-color: var(--accent);
            color: #fff;
        }

        .step-dot.done {
            border-color: rgba(56, 189, 248, 0.45);
            color: #bae6fd;
        }

        /* 播放與單步按鈕列 */
        .transport-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            justify-content: center;
        }

        .ctrl-btn {
            background: rgba(51, 65, 85, 0.82);
            color: #f8fafc;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.15s;
        }

        .ctrl-btn:hover {
            background: rgba(71, 85, 105, 0.95);
        }

        .ctrl-btn:active {
            transform: scale(0.97);
        }

        .ctrl-btn.primary {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border-color: #38bdf8;
            min-width: 108px;
        }

        .speed-box {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.76rem;
            color: var(--text-muted);
        }

        .speed-select {
            background: rgba(30, 41, 59, 0.9);
            color: #e2e8f0;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 5px 6px;
            font-size: 0.76rem;
            min-height: 32px;
        }

        /* 統一色彩圖例彈窗 */
        #legendDrawer {
            position: fixed;
            top: 56px;
            right: 12px;
            width: min(330px, calc(100vw - 24px));
            max-height: calc(100dvh - 160px);
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            padding: 14px;
            z-index: 60;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
        }

        #legendDrawer.hidden {
            display: none;
        }

        .legend-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .legend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.77rem;
            color: #e2e8f0;
        }

        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .swatch.hex {
            border-radius: 3px;
            transform: rotate(45deg) scale(0.85);
        }

        .swatch.prot {
            border-radius: 4px;
            width: 14px;
            height: 16px;
        }

        .gesture-tip {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.73rem;
            color: var(--text-muted);
            line-height: 1.45;
        }

        @media (max-width: 640px) {
            header {
                padding: 6px 8px 5px;
            }

            .sub-tabs {
                padding: 5px 8px;
            }

            footer {
                padding: 6px 8px 8px;
                gap: 5px;
            }

            .ctrl-btn {
                padding: 6px 9px;
                font-size: 0.78rem;
                min-height: 36px;
            }

            .ctrl-btn.primary {
                min-width: 92px;
            }

            .tool-btn span.txt {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- 頂部導覽 -->
        <header>
            <div class="top-row">
                <div class="brand">
                    <span class="brand-dot"></span>
                    <span>細胞膜運輸機制完整架構模擬器</span>
                </div>
                <div class="global-tools">
                    <button id="btnToggleLabels" class="tool-btn active" title="顯示或隱藏畫面文字標籤 (快捷鍵 L)">
                        <span>🏷️</span><span class="txt">文字標籤：開</span>
                    </button>
                    <button id="btnLegend" class="tool-btn" title="開啟跨分頁視覺圖例">
                        <span>🎨</span><span class="txt">視覺圖例</span>
                    </button>
                </div>
            </div>

            <div class="main-tabs" id="mainTabs">
                <button class="tab-btn active" data-tab="overview">🧊 3D 架構總覽</button>
                <button class="tab-btn" data-tab="passive">一、被動運輸 (Passive)</button>
                <button class="tab-btn" data-tab="active">二、主動運輸 (Active)</button>
                <button class="tab-btn" data-tab="bulk">三、胞吞與胞吐 (Bulk)</button>
            </div>
        </header>

        <!-- 子機制選單 -->
        <div class="sub-tabs hidden" id="subTabs"></div>

        <!-- 互動視窗 -->
        <main id="viewport">
            <canvas id="simCanvas" class="hidden"></canvas>
            <div id="threeContainer"></div>
            <div id="overlayLabels"></div>

            <!-- 左上機制特性卡片與情境開關 -->
            <div class="hud-info">
                <div class="hud-badges" id="hudBadges"></div>
                <div class="context-actions" id="contextActions"></div>
            </div>

            <!-- 右上 Zoom / Pan 控制 -->
            <div class="zoom-dock">
                <button class="z-btn" id="btnZoomIn" title="放大">+</button>
                <div class="z-readout" id="zoomReadout">100%</div>
                <button class="z-btn" id="btnZoomOut" title="縮小">−</button>
                <button class="z-btn" id="btnZoomReset" title="重置視角與縮放" style="font-size:0.78rem;">⟲</button>
            </div>
        </main>

        <!-- 視覺一致性圖例抽屜 -->
        <aside id="legendDrawer" class="hidden">
            <div class="legend-title">
                <span>🎨 跨分頁統一元素圖例</span>
                <button id="btnCloseLegend" class="z-btn" style="width:26px;height:26px;font-size:0.8rem;">✕</button>
            </div>
            <div class="legend-grid">
                <div class="legend-item"><span class="swatch" style="background:#f59e0b"></span>親水磷酸頭部</div>
                <div class="legend-item"><span class="swatch" style="background:#94a3b8"></span>疏水脂肪酸尾</div>
                <div class="legend-item"><span class="swatch" style="background:#38bdf8"></span>O₂ / CO₂ 小分子</div>
                <div class="legend-item"><span class="swatch" style="background:#f97316"></span>Na⁺ 鈉離子</div>
                <div class="legend-item"><span class="swatch" style="background:#a855f7"></span>K⁺ 鉀離子</div>
                <div class="legend-item"><span class="swatch" style="background:#10b981"></span>Ca²⁺ / Cl⁻ 離子</div>
                <div class="legend-item"><span class="swatch hex" style="background:#eab308"></span>葡萄糖 (Glucose)</div>
                <div class="legend-item"><span class="swatch" style="background:#f43f5e"></span>ATP / 磷酸根 Pi</div>
                <div class="legend-item"><span class="swatch prot" style="background:#06b6d4"></span>離子通道蛋白</div>
                <div class="legend-item"><span class="swatch prot" style="background:#6366f1"></span>載體 / 協同蛋白</div>
                <div class="legend-item"><span class="swatch prot" style="background:#ec4899"></span>鈉鉀泵 ATPase</div>
                <div class="legend-item"><span class="swatch prot" style="background:#14b8a6"></span>膜受體 / SNARE</div>
            </div>
            <div class="gesture-tip">
                💡 <b>觸控與滑鼠操作說明：</b><br>
                • <b>雙指張合 / 滾輪</b>：自由縮放局部細節 (Zoom)<br>
                • <b>單指拖曳 / 滑鼠拖曳</b>：平移視野 (Pan，3D 分頁可切換旋轉/平移)<br>
                • <b>單步控制</b>：點擊下方步驟數字或「上一步／下一步」可逐格拆解機制
            </div>
        </aside>

        <!-- 底部 Step-by-Step 控制器 -->
        <footer>
            <div class="step-header">
                <div class="step-title-box">
                    <span class="step-tag" id="stepTag">步驟 1 / 4</span>
                    <span class="step-desc" id="stepDesc">載入中...</span>
                </div>
                <span class="mode-indicator" id="modeBadge">自動連續播放</span>
            </div>

            <div class="step-dots" id="stepDots"></div>

            <div class="transport-bar">
                <div class="ctrl-group">
                    <button class="ctrl-btn" id="btnPrev" title="上一個步驟 (←)">◀ 上一步</button>
                    <button class="ctrl-btn primary" id="btnPlayPause" title="播放或暫停 (空白鍵)">⏸ 暫停</button>
                    <button class="ctrl-btn" id="btnReplayStep" title="重新演繹目前步驟">↻ 重播本步</button>
                    <button class="ctrl-btn" id="btnNext" title="下一個步驟 (→)">下一步 ▶</button>
                </div>
                <div class="speed-box">
                    <label for="speedSelect">速度</label>
                    <select id="speedSelect" class="speed-select">
                        <option value="0.5">0.5x 慢速</option>
                        <option value="1" selected>1.0x 標準</option>
                        <option value="1.6">1.6x 快速</option>
                    </select>
                </div>
            </div>
        </footer>
    </div>

    <script>
        (() => {
            'use strict';

            /* =========================================================================
             * 1. 跨分頁統一色票 (Visual Consistency Palette)
             * ========================================================================= */
            const C = {
                ecfBg: '#0d2238',
                icfBg: '#191b2e',
                lipidHead: '#f59e0b',
                lipidHeadStroke: '#b45309',
                lipidTail: '#94a3b8',
                gas: '#38bdf8',
                water: '#7dd3fc',
                na: '#f97316',
                k: '#a855f7',
                ca: '#10b981',
                glucose: '#eab308',

            /* =========================================================================
             * 3. 全域應用程式狀態 (App State)
             * ========================================================================= */
            const state = {
                tab: 'overview',
                subIndex: 0,
                stepIndex: 0,
                stepT: 0,          // 0.0 -> 1.0 當前步驟動畫進度
                autoPlay: true,    // true: 連續自動循環; false: Step-by-Step 單步推進並停駐
                stepAnimating: true,
                speed: 1.0,
                showLabels: true,
                gateMode: 'ligand', // 'ligand' | 'voltage' (離子通道專用)
                touch3dMode: 'rotate', // 'rotate' | 'pan' (3D 單指操作切換)
                globalTime: 0,

                // 2D 畫布 Zoom & Pan 狀態
                cam2d: { x: 0, y: 0, zoom: 1.0 }
            };

            function currentSub() {
                return TAXONOMY[state.tab].subs[state.subIndex];
            }

            /* =========================================================================
             * 4. DOM 元素綁定與 UI 更新
             * ========================================================================= */
            const dom = {
                mainTabs: document.getElementById('mainTabs'),
                subTabs: document.getElementById('subTabs'),
                viewport: document.getElementById('viewport'),
                canvas: document.getElementById('simCanvas'),
                threeContainer: document.getElementById('threeContainer'),
                overlayLabels: document.getElementById('overlayLabels'),
                hudBadges: document.getElementById('hudBadges'),
                contextActions: document.getElementById('contextActions'),
                zoomReadout: document.getElementById('zoomReadout'),
                stepTag: document.getElementById('stepTag'),
                stepDesc: document.getElementById('stepDesc'),
                modeBadge: document.getElementById('modeBadge'),
                stepDots: document.getElementById('stepDots'),
                btnPlayPause: document.getElementById('btnPlayPause'),
                btnPrev: document.getElementById('btnPrev'),
                btnNext: document.getElementById('btnNext'),
                btnReplayStep: document.getElementById('btnReplayStep'),
                speedSelect: document.getElementById('speedSelect'),
                btnToggleLabels: document.getElementById('btnToggleLabels'),
                btnLegend: document.getElementById('btnLegend'),
                legendDrawer: document.getElementById('legendDrawer'),
                btnCloseLegend: document.getElementById('btnCloseLegend'),
                btnZoomIn: document.getElementById('btnZoomIn'),
                btnZoomOut: document.getElementById('btnZoomOut'),
                btnZoomReset: document.getElementById('btnZoomReset')
            };

            const ctx = dom.canvas.getContext('2d');

            function syncUI() {
                const sub = currentSub();
                const steps = sub.steps;

                // Main tabs
                dom.mainTabs.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === state.tab);
                });

                // Sub tabs
                const subs = TAXONOMY[state.tab].subs;
                if (subs.length <= 1) {
                    dom.subTabs.classList.add('hidden');
                } else {
                    dom.subTabs.classList.remove('hidden');
                    dom.subTabs.innerHTML = subs.map((s, idx) =>
                        `<button class="sub-btn ${idx === state.subIndex ? 'active' : ''}" data-idx="${idx}">${s.name}</button>`
                    ).join('');
                }

                // Canvas vs 3D visibility
                const is3D = state.tab === 'overview';
                dom.threeContainer.classList.toggle('hidden', !is3D);
                dom.canvas.classList.toggle('hidden', is3D);
                if (!is3D) dom.overlayLabels.innerHTML = '';

                // HUD Badges
                dom.hudBadges.innerHTML = sub.badges.map(b =>
                    `<span class="badge ${b.cls}">${b.text}</span>`
                ).join('');

                // Context actions (離子通道閘門切換 / 3D 單指模式切換)
                if (sub.id === 'channel') {
                    dom.contextActions.innerHTML = `
        <button class="ctx-btn ${state.gateMode === 'ligand' ? 'active' : ''}" data-gate="ligand">🔑 配體閘控模式</button>
        <button class="ctx-btn ${state.gateMode === 'voltage' ? 'active' : ''}" data-gate="voltage">⚡ 電位閘控模式</button>
      `;
                } else if (is3D) {
                    dom.contextActions.innerHTML = `
        <button class="ctx-btn ${state.touch3dMode === 'rotate' ? 'active' : ''}" data-t3d="rotate">🔄 單指：旋轉視角</button>
        <button class="ctx-btn ${state.touch3dMode === 'pan' ? 'active' : ''}" data-t3d="pan">✋ 單指：平移視角</button>
      `;
                } else {
                    dom.contextActions.innerHTML = '';
                }

                // Step dots
                dom.stepDots.innerHTML = steps.map((_, i) => `
      <button class="step-dot ${i === state.stepIndex ? 'active' : (i < state.stepIndex ? 'done' : '')}" data-step="${i}">
        <div class="fill" id="dotFill_${i}"></div>
        <span>步驟 ${i + 1}</span>
      </button>
    `).join('');

                updateStepText();
                updateZoomReadout();
                resizeViewport();
            }

            function updateStepText() {
                const sub = currentSub();
                const total = sub.steps.length;
                const step = sub.steps[state.stepIndex];
                dom.stepTag.textContent = `步驟 ${state.stepIndex + 1} / ${total}`;
                dom.stepDesc.textContent = step.title;

                if (state.autoPlay) {
                    dom.modeBadge.textContent = '▶ 自動連續播放';
                    dom.modeBadge.classList.remove('paused');
                    dom.btnPlayPause.innerHTML = '⏸ 暫停';
                } else {
                    dom.modeBadge.textContent = '🎯 單步控制模式';
                    dom.modeBadge.classList.add('paused');
                    dom.btnPlayPause.innerHTML = '▶ 自動播放';
                }

                // 更新步驟圓點填色
                for (let i = 0; i < total; i++) {
                    const btn = dom.stepDots.children[i];
                    if (!btn) continue;
                    btn.classList.toggle('active', i === state.stepIndex);
                    btn.classList.toggle('done', i < state.stepIndex);
                    const fill = btn.querySelector('.fill');
                    if (fill) {
                        fill.style.width = i < state.stepIndex ? '100%' : (i === state.stepIndex ? `${Math.round(state.stepT * 100)}%` : '0%');
                    }
                }
            }

            function goToStep(idx, enterStepMode = true) {
                const total = currentSub().steps.length;
                state.stepIndex = (idx + total) % total;
                state.stepT = 0;
                state.stepAnimating = true;
                if (enterStepMode) state.autoPlay = false;

                if (state.tab === 'overview' && threeApp.ready) {
                    threeApp.tweenToStep(state.stepIndex);
                }
                updateStepText();
            }

            /* =========================================================================
             * 5. 2D 視角轉換、觸控縮放平移 (Zoom & Pan) 與銳利標籤系統
             * ========================================================================= */
            let vw = 800, vh = 500, dpr = 1;
            const WORLD_W = 860;
            const WORLD_H = 500;

            function getBaseScale() {
                return Math.min(vw / WORLD_W, vh / WORLD_H);
            }

            function worldToScreen(wx, wy) {
                const s = getBaseScale() * state.cam2d.zoom;
                return {
                    x: vw * 0.5 + (wx + state.cam2d.x) * s,
                    y: vh * 0.5 + (wy + state.cam2d.y) * s
                };
            }

            function resizeViewport() {
                const rect = dom.viewport.getBoundingClientRect();
                vw = Math.max(100, rect.width);
                vh = Math.max(100, rect.height);
                dpr = Math.min(window.devicePixelRatio || 1, 2);

                dom.canvas.width = Math.round(vw * dpr);
                dom.canvas.height = Math.round(vh * dpr);

                if (threeApp.ready) {
                    threeApp.resize(vw, vh);
                }
            }

            window.addEventListener('resize', resizeViewport);
            if (window.ResizeObserver) {
                new ResizeObserver(resizeViewport).observe(dom.viewport);
            }

            function updateZoomReadout() {
                if (state.tab === 'overview' && threeApp.ready) {
                    const pct = Math.round((21 / threeApp.camSpherical.r) * 100);
                    dom.zoomReadout.textContent = `${pct}%`;
                } else {
                    dom.zoomReadout.textContent = `${Math.round(state.cam2d.zoom * 100)}%`;
                }
            }

            function zoom2DBy(factor, clientX = vw * 0.5, clientY = vh * 0.5) {
                const rect = dom.viewport.getBoundingClientRect();
                const sx = clientX - rect.left;
                const sy = clientY - rect.top;
                const baseS = getBaseScale();
                const oldZoom = state.cam2d.zoom;
                const newZoom = Math.max(0.55, Math.min(3.2, oldZoom * factor));

                // 以手指或游標位置為中心縮放
                const wx = (sx - vw * 0.5) / (baseS * oldZoom) - state.cam2d.x;
                const wy = (sy - vh * 0.5) / (baseS * oldZoom) - state.cam2d.y;

                state.cam2d.zoom = newZoom;
                state.cam2d.x = (sx - vw * 0.5) / (baseS * newZoom) - wx;
                state.cam2d.y = (sy - vh * 0.5) / (baseS * newZoom) - wy;
                clampCam2D();
                updateZoomReadout();
            }

            function clampCam2D() {
                const maxPanX = 380;
                const maxPanY = 260;
                state.cam2d.x = Math.max(-maxPanX, Math.min(maxPanX, state.cam2d.x));
                state.cam2d.y = Math.max(-maxPanY, Math.min(maxPanY, state.cam2d.y));
            }

            // 2D Canvas 多點觸控與滑鼠拖曳平移／雙指縮放
            const pointers2D = new Map();
            let lastPinchDist2D = 0;
            let lastMid2D = null;

            dom.canvas.addEventListener('pointerdown', e => {
                dom.canvas.setPointerCapture(e.pointerId);
                pointers2D.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers2D.size === 2) {
                    const pts = [...pointers2D.values()];
                    lastPinchDist2D = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    lastMid2D = { x: (pts[0].x + pts[1].x) * 0.5, y: (pts[0].y + pts[1].y) * 0.5 };
                }
            });

            dom.canvas.addEventListener('pointermove', e => {
                if (!pointers2D.has(e.pointerId)) return;
                const prev = pointers2D.get(e.pointerId);
                const curr = { x: e.clientX, y: e.clientY };
                pointers2D.set(e.pointerId, curr);

                const baseS = getBaseScale() * state.cam2d.zoom;

                if (pointers2D.size === 1) {
                    state.cam2d.x += (curr.x - prev.x) / baseS;
                    state.cam2d.y += (curr.y - prev.y) / baseS;
                    clampCam2D();
                } else if (pointers2D.size === 2) {
                    const pts = [...pointers2D.values()];
                    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    const mid = { x: (pts[0].x + pts[1].x) * 0.5, y: (pts[0].y + pts[1].y) * 0.5 };
                    if (lastPinchDist2D > 10) {
                        zoom2DBy(dist / lastPinchDist2D, mid.x, mid.y);
                    }
                    if (lastMid2D) {
                        const s2 = getBaseScale() * state.cam2d.zoom;
                        state.cam2d.x += (mid.x - lastMid2D.x) / s2;
                        state.cam2d.y += (mid.y - lastMid2D.y) / s2;
                        clampCam2D();
                    }
                    lastPinchDist2D = dist;
                    lastMid2D = mid;
                }
            });

            function endPointer2D(e) {
                pointers2D.delete(e.pointerId);
                if (pointers2D.size < 2) {
                    lastPinchDist2D = 0;
                    lastMid2D = null;
                }
            }
            dom.canvas.addEventListener('pointerup', endPointer2D);
            dom.canvas.addEventListener('pointercancel', endPointer2D);

            dom.canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
                zoom2DBy(factor, e.clientX, e.clientY);
            }, { passive: false });

            /* =========================================================================
             * 6. Three.js 3D 流體鑲嵌模型總覽 (Tab 0)
             * ========================================================================= */
            const threeApp = {
                ready: false,
                scene: null,
                camera: null,
                renderer: null,
                camSpherical: { theta: 0.35, phi: 1.08, r: 23, tx: 0, ty: 0, tz: 0 },
                camGoal: null,
                lipids: [],
                ions3d: [],
                vesicleGroup: null,
                pumpGroup: null,
                carrierGroup: null,
                atpMesh: null,
                labels3d: [],

                init() {
                    if (typeof THREE === 'undefined') {
                        dom.threeContainer.innerHTML = '<div style="padding:30px;color:#94a3b8;text-align:center;">無法載入 Three.js，請切換至右側分頁體驗完整 2D 動態模擬。</div>';
                        return;
                    }
                    const scene = new THREE.Scene();
                    this.scene = scene;

                    const camera = new THREE.PerspectiveCamera(42, vw / vh, 0.1, 200);
                    this.camera = camera;

                    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                    renderer.setSize(vw, vh);
                    dom.threeContainer.appendChild(renderer.domElement);
                    this.renderer = renderer;

                    // 燈光設定
                    scene.add(new THREE.AmbientLight(0xffffff, 0.68));
                    const dir1 = new THREE.DirectionalLight(0xffffff, 0.85);
                    dir1.position.set(12, 20, 16);
                    scene.add(dir1);
                    const dir2 = new THREE.DirectionalLight(0x38bdf8, 0.35);
                    dir2.position.set(-15, -12, -10);
                    scene.add(dir2);

                    // 共用材質（與 2D 色票完全一致）
                    const matHead = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.35, metalness: 0.1 });
                    const matTail = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.6 });
                    const matChannel = new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.3, metalness: 0.15 });
                    const matCarrier = new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.32, metalness: 0.15 });
                    const matPump = new THREE.MeshStandardMaterial({ color: 0xec4899, roughness: 0.3, metalness: 0.15 });
                    const matReceptor = new THREE.MeshStandardMaterial({ color: 0x14b8a6, roughness: 0.3 });

                    const geoHead = new THREE.SphereGeometry(0.36, 14, 12);
                    const geoTail = new THREE.CylinderGeometry(0.06, 0.05, 1.35, 7);

                    // 建立磷脂雙層陣列（避開蛋白質與囊泡凹陷位置）
                    const holes = [
                        { x: -3.5, z: 0, r: 1.45 }, // 離子通道
                        { x: -1.2, z: 1.8, r: 1.35 }, // 載體蛋白
                        { x: 2.0, z: -0.4, r: 1.55 }, // 鈉鉀泵
                        { x: 6.8, z: 0.2, r: 2.15 }   // 囊泡內吞區
                    ];

                    for (let gx = -9; gx <= 9; gx += 0.88) {
                        for (let gz = -3.6; gz <= 3.6; gz += 0.88) {
                            let skip = false;
                            for (const h of holes) {
                                if (Math.hypot(gx - h.x, gz - h.z) < h.r) { skip = true; break; }
                            }
                            if (skip) continue;

                            // 上層與下層磷脂
                            for (const dir of [1, -1]) {
                                const grp = new THREE.Group();
                                const head = new THREE.Mesh(geoHead, matHead);
                                head.position.y = dir * 1.65;
                                grp.add(head);

                                const t1 = new THREE.Mesh(geoTail, matTail);
                                t1.position.set(-0.11, dir * 0.82, 0);
                                t1.rotation.z = dir * 0.08;
                                const t2 = new THREE.Mesh(geoTail, matTail);
                                t2.position.set(0.11, dir * 0.82, 0);
                                t2.rotation.z = -dir * 0.08;
                                grp.add(t1, t2);

                                grp.position.set(gx, 0, gz);
                                scene.add(grp);
                                this.lipids.push({ grp, baseX: gx, baseZ: gz, phase: gx * 0.6 + gz * 0.5 });
                            }
                        }
                    }

                    // 1) 離子通道蛋白 (Teal) - 由環狀次單元組成中空通道
                    const chGrp = new THREE.Group();
                    const subGeo = new THREE.CylinderGeometry(0.38, 0.38, 4.1, 14);
                    for (let i = 0; i < 6; i++) {
                        const a = (i / 6) * Math.PI * 2;
                        const m = new THREE.Mesh(subGeo, matChannel);
                        m.position.set(Math.cos(a) * 0.72, 0, Math.sin(a) * 0.72);
                        chGrp.add(m);
                    }
                    chGrp.position.set(-3.5, 0, 0);
                    scene.add(chGrp);

                    // 2) 載體蛋白 (Indigo) - 雙葉對開構形
                    const carGrp = new THREE.Group();
                    const lobeGeo = new THREE.CylinderGeometry(0.45, 0.52, 4.0, 14);
                    const lobeL = new THREE.Mesh(lobeGeo, matCarrier);
                    lobeL.position.x = -0.45;
                    const lobeR = new THREE.Mesh(lobeGeo, matCarrier);
                    lobeR.position.x = 0.45;
                    carGrp.add(lobeL, lobeR);
                    carGrp.position.set(-1.2, 0, 1.8);
                    scene.add(carGrp);
                    this.carrierGroup = { grp: carGrp, lobeL, lobeR };

                    // 3) 鈉鉀泵 ATPase (Pink) + 發光 ATP
                    const pGrp = new THREE.Group();
                    const pL = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.62, 4.3, 16), matPump);
                    pL.position.x = -0.5;
                    const pR = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.62, 4.3, 16), matPump);
                    pR.position.x = 0.5;
                    pGrp.add(pL, pR);
                    pGrp.position.set(2.0, 0, -0.4);
                    scene.add(pGrp);
                    this.pumpGroup = { grp: pGrp, pL, pR };

                    const atpMesh = new THREE.Mesh(
                        new THREE.OctahedronGeometry(0.45, 1),
                        new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0xe11d48, emissiveIntensity: 0.6 })
                    );
                    atpMesh.position.set(2.0, -3.1, 0.5);
                    scene.add(atpMesh);
                    this.atpMesh = atpMesh;

                    // 4) 胞吞／胞吐磷脂囊泡 (Vesicle)
                    const vesGrp = new THREE.Group();
                    const vesR = 1.65;
                    for (let i = 0; i < 28; i++) {
                        const phi = Math.acos(1 - 2 * (i + 0.5) / 28);
                        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
                        const vx = vesR * Math.sin(phi) * Math.cos(theta);
                        const vy = vesR * Math.cos(phi);
                        const vz = vesR * Math.sin(phi) * Math.sin(theta);
                        const hMesh = new THREE.Mesh(geoHead, matHead);
                        hMesh.position.set(vx, vy, vz);
                        vesGrp.add(hMesh);
                    }
                    // 囊泡內包裹分子與受體
                    const recMesh = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.12, 10, 18), matReceptor);
                    vesGrp.add(recMesh);
                    const cargoGeo = new THREE.SphereGeometry(0.28, 12, 12);
                    const cargoMat = new THREE.MeshStandardMaterial({ color: 0xeab308, emissive: 0xca8a04, emissiveIntensity: 0.25 });
                    for (let k = 0; k < 4; k++) {
                        const cm = new THREE.Mesh(cargoGeo, cargoMat);
                        cm.position.set((k - 1.5) * 0.35, (k % 2 - 0.5) * 0.4, 0);
                        vesGrp.add(cm);
                    }
                    vesGrp.position.set(6.8, -2.5, 0.2);
                    scene.add(vesGrp);
                    this.vesicleGroup = vesGrp;

                    // 動態粒子：O2 單純擴散、Na+ 經通道、葡萄糖經載體、Na+/K+ 經幫浦
                    const sphereSmall = new THREE.SphereGeometry(0.24, 12, 12);
                    const makeIon = (color, type, x, z, phase) => {
                        const m = new THREE.Mesh(sphereSmall, new THREE.MeshStandardMaterial({ color, roughness: 0.25 }));
                        scene.add(m);
                        this.ions3d.push({ mesh: m, type, x, z, phase });
                    };
                    makeIon(0x38bdf8, 'gas', -7.2, -0.8, 0.0);
                    makeIon(0x38bdf8, 'gas', -6.0, 1.4, 0.5);
                    makeIon(0xf97316, 'channel_na', -3.5, 0.0, 0.2);
                    makeIon(0xeab308, 'carrier_glu', -1.2, 1.8, 0.0);
                    makeIon(0xf97316, 'pump_na', 1.85, -0.4, 0.0);
                    makeIon(0xa855f7, 'pump_k', 2.15, -0.4, 0.5);

                    // 定義 3D 空間錨點標籤
                    this.labels3d = [
                        { pos: new THREE.Vector3(0, 4.4, 0), text: '細胞外液 (Extracellular Fluid)', color: '#38bdf8' },
                        { pos: new THREE.Vector3(0, -4.4, 0), text: '細胞質 (Cytoplasm)', color: '#fbbf24' },
                        { pos: new THREE.Vector3(-8.2, 1.9, 2.2), text: '磷脂雙層 (Phospholipid Bilayer)', color: '#f59e0b' },
                        { pos: new THREE.Vector3(-6.8, 2.8, -0.8), text: '單純擴散 (O₂ / CO₂)', color: '#38bdf8' },
                        { pos: new THREE.Vector3(-3.5, 2.9, 0), text: '離子通道 (促進性擴散)', color: '#06b6d4' },
                        { pos: new THREE.Vector3(-1.2, 2.8, 1.8), text: '載體蛋白 (構形改變)', color: '#6366f1' },
                        { pos: new THREE.Vector3(2.0, 3.0, -0.4), text: '鈉鉀泵 (初級主動運輸)', color: '#ec4899' },
                        { pos: new THREE.Vector3(2.0, -3.5, 0.8), text: 'ATP 能量水解', color: '#f43f5e' },
                        { pos: new THREE.Vector3(6.8, 1.8, 0.2), text: '胞吞 / 胞吐囊泡運輸', color: '#14b8a6' }
                    ];

                    this.bindControls(renderer.domElement);
                    this.ready = true;
                    this.updateCamera();
                },

                bindControls(el) {
                    const pts = new Map();
                    let lastDist = 0;
                    let lastMid = null;

                    el.addEventListener('pointerdown', e => {
                        el.setPointerCapture(e.pointerId);
                        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
                        this.camGoal = null; // 使用者手動介入時停止自動運鏡
                        if (pts.size === 2) {
                            const arr = [...pts.values()];
                            lastDist = Math.hypot(arr[1].x - arr[0].x, arr[1].y - arr[0].y);
                            lastMid = { x: (arr[0].x + arr[1].x) * 0.5, y: (arr[0].y + arr[1].y) * 0.5 };
                        }
                    });

                    el.addEventListener('pointermove', e => {
                        if (!pts.has(e.pointerId)) return;
                        const prev = pts.get(e.pointerId);
                        const curr = { x: e.clientX, y: e.clientY };
                        pts.set(e.pointerId, curr);

                        const dx = curr.x - prev.x;
                        const dy = curr.y - prev.y;

                        if (pts.size === 1) {
                            const panMode = e.buttons === 2 || e.shiftKey || state.touch3dMode === 'pan';
                            if (panMode) {
                                this.panBy(dx, dy);
                            } else {
                                this.camSpherical.theta -= dx * 0.007;
                                this.camSpherical.phi = Math.max(0.25, Math.min(Math.PI - 0.25, this.camSpherical.phi - dy * 0.007));
                            }
                        } else if (pts.size === 2) {
                            const arr = [...pts.values()];
                            const dist = Math.hypot(arr[1].x - arr[0].x, arr[1].y - arr[0].y);
                            const mid = { x: (arr[0].x + arr[1].x) * 0.5, y: (arr[0].y + arr[1].y) * 0.5 };
                            if (lastDist > 10) {
                                this.camSpherical.r = Math.max(8, Math.min(42, this.camSpherical.r * (lastDist / dist)));
                                updateZoomReadout();
                            }
                            if (lastMid) {
                                this.panBy(mid.x - lastMid.x, mid.y - lastMid.y);
                            }
                            lastDist = dist;
                            lastMid = mid;
                        }
                    });

                    const endP = e => { pts.delete(e.pointerId); };
                    el.addEventListener('pointerup', endP);
                    el.addEventListener('pointercancel', endP);
                    el.addEventListener('contextmenu', e => e.preventDefault());
                    el.addEventListener('wheel', e => {
                        e.preventDefault();
                        this.camGoal = null;
                        this.camSpherical.r = Math.max(8, Math.min(42, this.camSpherical.r * (e.deltaY > 0 ? 1.1 : 0.9)));
                        updateZoomReadout();
                    }, { passive: false });
                },

                panBy(dx, dy) {
                    const scale = this.camSpherical.r * 0.0018;
                    const rightX = Math.cos(this.camSpherical.theta);
                    const rightZ = -Math.sin(this.camSpherical.theta);
                    this.camSpherical.tx = Math.max(-12, Math.min(12, this.camSpherical.tx - dx * scale * rightX));
                    this.camSpherical.tz = Math.max(-8, Math.min(8, this.camSpherical.tz - dx * scale * rightZ));
                    this.camSpherical.ty = Math.max(-6, Math.min(6, this.camSpherical.ty + dy * scale));
                },

                tweenToStep(idx) {
                    const step = TAXONOMY.overview.subs[0].steps[idx];
                    if (step && step.cam) {
                        this.camGoal = { ...step.cam };
                    }
                },

                resetCamera() {
                    this.camGoal = { theta: 0.35, phi: 1.08, r: 23, tx: 0, ty: 0, tz: 0 };
                },

                resize(w, h) {
                    if (!this.ready) return;
                    this.camera.aspect = w / h;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(w, h);
                },

                updateCamera() {
                    if (this.camGoal) {
                        const s = this.camSpherical;
                        const g = this.camGoal;
                        s.theta += (g.theta - s.theta) * 0.08;
                        s.phi += (g.phi - s.phi) * 0.08;
                        s.r += (g.r - s.r) * 0.08;
                        s.tx += (g.tx - s.tx) * 0.08;
                        s.ty += (g.ty - s.ty) * 0.08;
                        s.tz += (g.tz - s.tz) * 0.08;
                        updateZoomReadout();
                        if (Math.abs(g.r - s.r) < 0.03 && Math.abs(g.tx - s.tx) < 0.03 && Math.abs(g.theta - s.theta) < 0.01) {
                            this.camGoal = null;
                        }
                    }
                    const { theta, phi, r, tx, ty, tz } = this.camSpherical;
                    this.camera.position.set(
                        tx + r * Math.sin(phi) * Math.sin(theta),
                        ty + r * Math.cos(phi),
                        tz + r * Math.sin(phi) * Math.cos(theta)
                    );
                    this.camera.lookAt(tx, ty, tz);
                },

                render(t) {
                    if (!this.ready) return;
                    this.updateCamera();

                    // 磷脂雙層流體波動
                    for (const l of this.lipids) {
                        l.grp.position.y = Math.sin(t * 2.0 + l.phase) * 0.14;
                    }

                    // 載體蛋白與鈉鉀泵構形搖擺動畫
                    const swing = Math.sin(t * 2.2);
                    this.carrierGroup.lobeL.rotation.z = swing * 0.18;
                    this.carrierGroup.lobeR.rotation.z = -swing * 0.18;

                    const pSwing = Math.sin(t * 2.6 + 1.0);
                    this.pumpGroup.pL.rotation.z = pSwing * 0.18;
                    this.pumpGroup.pR.rotation.z = -pSwing * 0.18;

                    this.atpMesh.rotation.y = t * 2.5;
                    const atpPulse = 0.85 + 0.25 * Math.sin(t * 5.0);
                    this.atpMesh.scale.setScalar(atpPulse);

                    // 囊泡升降融合動態
                    const vesCycle = (Math.sin(t * 1.3) + 1) * 0.5; // 0..1
                    this.vesicleGroup.position.y = -3.6 + vesCycle * 3.1;
                    this.vesicleGroup.rotation.y = t * 0.6;

                    // 離子與分子穿膜軌跡
                    for (const item of this.ions3d) {
                        const p = (t * 0.45 + item.phase) % 1;
                        if (item.type === 'gas' || item.type === 'channel_na' || item.type === 'carrier_glu') {
                            item.mesh.position.set(item.x, 3.6 - p * 7.2, item.z);
                        } else if (item.type === 'pump_na') {
                            item.mesh.position.set(item.x, -3.5 + p * 7.0, item.z); // 逆濃度向外
                        } else if (item.type === 'pump_k') {
                            item.mesh.position.set(item.x, 3.5 - p * 7.0, item.z); // 逆濃度向內
                        }
                    }

                    this.renderer.render(this.scene, this.camera);

                    // 投影 3D 標籤至螢幕
                    if (!state.showLabels) {
                        dom.overlayLabels.innerHTML = '';
                        return;
                    }

                    if (dom.overlayLabels.children.length !== this.labels3d.length) {
                        dom.overlayLabels.innerHTML = this.labels3d.map(l =>
                            `<div class="lbl-3d" style="border-left-color:${l.color}">${l.text}</div>`
                        ).join('');
                    }

                    this.labels3d.forEach((l, idx) => {
                        const el = dom.overlayLabels.children[idx];
                        const v = l.pos.clone().project(this.camera);
                        if (v.z > 1) {
                            el.style.opacity = '0';
                        } else {
                            const sx = (v.x * 0.5 + 0.5) * vw;
                            const sy = (-v.y * 0.5 + 0.5) * vh;
                            el.style.opacity = '1';
                            el.style.left = `${sx}px`;
                            el.style.top = `${sy}px`;
                        }
                    });
                }
            };

            /* =========================================================================
             * 7. 2D 生物化學繪圖引擎共用函式庫 (Shared Drawing Primitives)
             * ========================================================================= */
            const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
            const lerp = (a, b, t) => a + (b - a) * t;
            const clamp01 = v => Math.max(0, Math.min(1, v));

            let frameLabels = [];
            function addLabel(wx, wy, text, color = '#38bdf8', offsetX = 0, offsetY = 0) {
                if (!state.showLabels) return;
                frameLabels.push({ wx, wy, text, color, offsetX, offsetY });
            }

            function flush2DLabels() {
                if (!state.showLabels || frameLabels.length === 0) return;
                ctx.save();
                ctx.font = '600 12.5px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif';
                ctx.textBaseline = 'middle';

                for (const lb of frameLabels) {
                    const anchor = worldToScreen(lb.wx, lb.wy);
                    const bx = anchor.x + lb.offsetX;
                    const by = anchor.y + lb.offsetY;

                    if (Math.hypot(lb.offsetX, lb.offsetY) > 6) {
                        ctx.beginPath();
                        ctx.moveTo(anchor.x, anchor.y);
                        ctx.lineTo(bx, by);
                        ctx.strokeStyle = 'rgba(226, 232, 240, 0.55)';
                        ctx.lineWidth = 1.3;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(anchor.x, anchor.y, 2.8, 0, Math.PI * 2);
                        ctx.fillStyle = lb.color;
                        ctx.fill();
                    }

                    const padX = 8;
                    const tw = ctx.measureText(lb.text).width;
                    const bw = tw + padX * 2;
                    const bh = 23;
                    const rx = bx - bw * 0.5;
                    const ry = by - bh * 0.5;

                    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                    ctx.strokeStyle = 'rgba(148, 163, 184, 0.42)';
                    ctx.lineWidth = 1;
                    roundRectPath(ctx, rx, ry, bw, bh, 6);
                    ctx.fill();
                    ctx.stroke();

                    // 左側色條
                    ctx.fillStyle = lb.color;
                    roundRectPath(ctx, rx, ry, 3.5, bh, 2);
                    ctx.fill();

                    ctx.fillStyle = '#f8fafc';
                    ctx.fillText(lb.text, rx + padX + 2, by + 0.5);
                }
                ctx.restore();
            }

            function roundRectPath(c, x, y, w, h, r) {
                c.beginPath();
                c.moveTo(x + r, y);
                c.lineTo(x + w - r, y);
                c.quadraticCurveTo(x + w, y, x + w, y + r);
                c.lineTo(x + w, y + h - r);
                c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                c.lineTo(x + r, y + h);
                c.quadraticCurveTo(x, y + h, x, y + h - r);
                c.lineTo(x, y + r);
                c.quadraticCurveTo(x, y, x + r, y);
                c.closePath();
            }

            // 繪製環境背景（外液 vs 細胞質）
            function drawCompartments(membraneY = 0) {
                ctx.fillStyle = C.ecfBg;
                ctx.fillRect(-1400, -1000, 2800, 1000 + membraneY);
                ctx.fillStyle = C.icfBg;
                ctx.fillRect(-1400, membraneY, 2800, 1000);

                addLabel(-320, -210, '細胞外液 (Extracellular Fluid)', '#38bdf8');
                addLabel(-320, 215, '細胞質 (Cytoplasm / Intracellular)', '#fbbf24');
            }

            // 繪製單顆磷脂分子（沿法線角度 nx, ny）
            function drawSingleLipid(hx, hy, nx, ny, tailLen = 28, phase = 0) {
                const wiggle = Math.sin(state.globalTime * 4.5 + phase) * 2.2;
                const px = -ny;
                const py = nx;

                ctx.strokeStyle = C.lipidTail;
                ctx.lineWidth = 2.1;
                ctx.lineCap = 'round';

                for (const side of [-3.6, 3.6]) {
                    const sx = hx + px * side + nx * 6;
                    const sy = hy + py * side + ny * 6;
                    const mx = hx + px * (side + wiggle * 0.6) + nx * (tailLen * 0.55);
                    const my = hy + py * (side + wiggle * 0.6) + ny * (tailLen * 0.55);
                    const ex = hx + px * (side * 1.15 - wiggle * 0.5) + nx * tailLen;
                    const ey = hy + py * (side * 1.15 - wiggle * 0.5) + ny * tailLen;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.quadraticCurveTo(mx, my, ex, ey);
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(hx, hy, 7.5, 0, Math.PI * 2);
                ctx.fillStyle = C.lipidHead;
                ctx.fill();
                ctx.strokeStyle = C.lipidHeadStroke;
                ctx.lineWidth = 1.4;
                ctx.stroke();
            }

            // 繪製水平磷脂雙層（支援多組蛋白質缺口 gaps: [{x1, x2}]）
            function drawPlanarBilayer(gaps = [], yCenter = 0) {
                const halfThick = 36;
                const stepX = 17.5;
                for (let x = -430; x <= 430; x += stepX) {
                    let inGap = false;
                    for (const g of gaps) {
                        if (x > g.x1 && x < g.x2) { inGap = true; break; }
                    }
                    if (inGap) continue;
                    const wave = Math.sin(state.globalTime * 2.4 + x * 0.03) * 2.0;
                    // 外層（頭在上，尾朝下 ny = +1）
                    drawSingleLipid(x, yCenter - halfThick + wave, 0, 1, 29, x * 0.1);
                    // 內層（頭在下，尾朝上 ny = -1）
                    drawSingleLipid(x, yCenter + halfThick + wave, 0, -1, 29, x * 0.1 + 1.5);
                }
            }

            // 繪製濃度梯度視覺化側欄
            function drawGradientMeter(x, label, topHigh, color) {
                ctx.save();
                const w = 22, h = 150;
                const yTop = -175;
                const grad = ctx.createLinearGradient(0, yTop, 0, yTop + h * 2 + 40);
                if (topHigh) {
                    grad.addColorStop(0, color);
                    grad.addColorStop(1, 'rgba(30, 41, 59, 0.2)');
                } else {
                    grad.addColorStop(0, 'rgba(30, 41, 59, 0.2)');
                    grad.addColorStop(1, color);
                }
                ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
                roundRectPath(ctx, x - w / 2, -165, w, 330, 8);
                ctx.fill();
                ctx.stroke();

                ctx.globalAlpha = 0.75;
                ctx.fillStyle = grad;
                roundRectPath(ctx, x - w / 2 + 3, -162, w - 6, 324, 6);
                ctx.fill();
                ctx.globalAlpha = 1;

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(topHigh ? '高' : '低', x, -145);
                ctx.fillText(topHigh ? '低' : '高', x, 152);
                ctx.fillStyle = color;
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(label, x, -176);
                ctx.restore();
            }

            // 繪製各種生物分子與離子
            function drawIon(x, y, label, color, r = 11) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.65)';
                ctx.lineWidth = 1.3;
                ctx.stroke();

                if (label) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${Math.max(9, Math.round(r * 0.88))}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(label, x, y + 0.5);
                }
                ctx.restore();
            }

            function drawGlucose(x, y, r = 13, showText = true) {
                ctx.save();
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
                    const px = x + Math.cos(a) * r;
                    const py = y + Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fillStyle = C.glucose;
                ctx.shadowColor = C.glucose;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 1.6;
                ctx.stroke();

                if (showText) {
                    ctx.fillStyle = '#1e293b';
                    ctx.font = 'bold 9.5px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('Glc', x, y + 0.5);
                }
                ctx.restore();
            }

            function drawATPStar(x, y, text = 'ATP', scale = 1) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                ctx.beginPath();
                const spikes = 8, outerR = 20, innerR = 12;
                for (let i = 0; i < spikes * 2; i++) {
                    const r = i % 2 === 0 ? outerR : innerR;
                    const a = (i / (spikes * 2)) * Math.PI * 2 + state.globalTime * 1.5;
                    const px = Math.cos(a) * r;
                    const py = Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fillStyle = C.atp;
                ctx.shadowColor = C.atp;
                ctx.shadowBlur = 14;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 1.6;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10.5px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 0, 0.5);
                ctx.restore();
            }

            function drawArrow(x1, y1, x2, y2, color = '#38bdf8', dashed = false) {
                ctx.save();
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = 2.6;
                if (dashed) ctx.setLineDash([5, 4]);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.setLineDash([]);

                const ang = Math.atan2(y2 - y1, x2 - x1);
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - 10 * Math.cos(ang - 0.42), y2 - 10 * Math.sin(ang - 0.42));
                ctx.lineTo(x2 - 10 * Math.cos(ang + 0.42), y2 - 10 * Math.sin(ang + 0.42));
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            // 繪製雙葉可變構形膜蛋白（載體／鈉鉀泵／協同運輸通用）
            // openState: -1.0 = 完全朝上(外)開口, 0 = 閉合過渡態, +1.0 = 完全朝下(內)開口
            function drawConformationalProtein(cx, cy, openState, colorMain, colorDark, halfW = 36, halfH = 58) {
                const tilt = openState * 0.28; // 正值時底部張開、頂部收攏；負值時頂部張開、底部收攏

                for (const side of [-1, 1]) {
                    ctx.save();
                    ctx.translate(cx + side * (halfW * 0.56), cy);
                    ctx.rotate(-side * tilt);

                    const grad = ctx.createLinearGradient(-18, -halfH, 18, halfH);
                    grad.addColorStop(0, colorMain);
                    grad.addColorStop(1, colorDark);

                    ctx.fillStyle = grad;
                    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                    ctx.lineWidth = 1.8;
                    roundRectPath(ctx, -18, -halfH, 36, halfH * 2, 16);
                    ctx.fill();
                    ctx.stroke();

                    // 內部結合凹槽視覺細節
                    ctx.beginPath();
                    ctx.arc(-side * 15, 0, 8, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
                    ctx.fill();
                    ctx.restore();
                }
            }

            /* =========================================================================
             * 8. 各大運輸機制專屬動態渲染器 (10 Mechanisms)
             * ========================================================================= */
            const Renderers = {

                /* 1A. 單純擴散 (Simple Diffusion) */
                simple(step, t) {
                    drawCompartments(0);
                    drawPlanarBilayer([], 0);
                    drawGradientMeter(380, '[O₂ / CO₂]', true, C.gas);

                    addLabel(-210, -40, '親水磷酸頭部', C.lipidHead, -45, -36);
                    addLabel(-210, 4, '疏水脂肪酸尾部', C.lipidTail, -65, 0);

                    // 背景高濃度外液分子 vs 低濃度內液分子
                    const bgOut = [[-260, -130], [-140, -155], [130, -140], [230, -110], [290, -150], [-60, -170], [60, -165]];
                    bgOut.forEach(([bx, by], i) => {
                        const jx = Math.sin(state.globalTime * 1.8 + i) * 6;
                        const jy = Math.cos(state.globalTime * 1.6 + i * 2) * 5;
                        drawIon(bx + jx, by + jy, i % 2 === 0 ? 'O₂' : 'CO₂', C.gas, 11);
                    });
                    if (step >= 2) {
                        drawIon(-150 + Math.sin(state.globalTime) * 5, 135, 'O₂', C.gas, 11);
                    }

                    const e = easeInOut(t);
                    // 三顆主角脂溶性小分子 + 一顆緩慢滲透的極小部分水分子
                    const heroes = [
                        { x: -70, label: 'O₂', delay: 0 },
                        { x: 15, label: 'CO₂', delay: 0.1 },
                        { x: 100, label: '酒精', delay: 0.18 }
                    ];

                    heroes.forEach((h, idx) => {
                        let py = -120;
                        if (step === 0) py = lerp(-155, -72, e);
                        else if (step === 1) py = lerp(-72, 10, e);
                        else if (step === 2) py = lerp(10, 118, e);
                        else if (step === 3) py = lerp(118, 150, e) + Math.sin(state.globalTime * 2 + idx) * 6;

                        drawArrow(h.x, -85, h.x, 82, 'rgba(56, 189, 248, 0.35)', true);
                        drawIon(h.x, py, h.label, C.gas, 14);
                    });

                    // 極小部分水分子緩慢滲透示意
                    const wy = step === 0 ? -95 : (step === 1 ? lerp(-95, -15, e) : (step === 2 ? lerp(-15, 45, e) : lerp(45, 95, e)));
                    drawIon(-165, wy, 'H₂O', C.water, 10);
                    addLabel(-165, wy, '極少量水分子緩慢穿透', C.water, -90, 26);
                    addLabel(15, step <= 1 ? -75 : 105, '直接穿過磷脂雙層 (不需蛋白)', C.gas, 95, step <= 1 ? -32 : 30);
                },

                /* 1B. 促進性擴散：離子通道 (Ion Channels) */
                channel(step, t) {
                    drawCompartments(0);
                    drawPlanarBilayer([{ x1: -56, x2: 56 }], 0);
                    drawGradientMeter(380, '[Na⁺]', true, C.na);

                    const e = easeInOut(t);
                    // 計算通道閘門開度 (0 = 關閉, 1 = 開啟)
                    let gateOpen = 0;
                    if (step === 0) gateOpen = 0;
                    else if (step === 1) gateOpen = e;
                    else if (step === 2) gateOpen = 1;
                    else if (step === 3) gateOpen = 1 - e;

                    // 繪製通道蛋白左右次單元與親水孔道
                    const poreHalf = 10 + gateOpen * 13;
                    ctx.save();
                    // 中央親水通道水相背景
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.16)';
                    ctx.fillRect(-poreHalf, -56, poreHalf * 2, 112);

                    for (const side of [-1, 1]) {
                        const xWall = side * poreHalf;
                        const grad = ctx.createLinearGradient(xWall, -58, xWall + side * 34, 58);
                        grad.addColorStop(0, C.channel);
                        grad.addColorStop(1, C.channelDark);
                        ctx.fillStyle = grad;
                        ctx.strokeStyle = 'rgba(255,255,255,0.48)';
                        ctx.lineWidth = 1.8;
                        roundRectPath(ctx, side === -1 ? xWall - 34 : xWall, -58, 34, 116, 14);
                        ctx.fill();
                        ctx.stroke();

                        // 閘門葉片
                        ctx.beginPath();
                        const gateY = -12;
                        const gateExt = (1 - gateOpen) * (poreHalf + 1);
                        ctx.moveTo(xWall, gateY - 8);
                        ctx.lineTo(xWall - side * gateExt, gateY);
                        ctx.lineTo(xWall, gateY + 8);
                        ctx.closePath();
                        ctx.fillStyle = '#fde047';
                        ctx.fill();
                    }
                    ctx.restore();

                    // 閘控機制視覺（配體 vs 電位）
                    if (state.gateMode === 'ligand') {
                        // 右上受體凹槽與配體分子
                        const ligY = step === 0 ? -130 : (step === 1 ? lerp(-130, -64, e) : (step === 2 ? -64 : lerp(-64, -135, e)));
                        const ligX = 36;
                        drawIon(ligX, ligY, '配體', '#facc15', 11);
                        addLabel(ligX, ligY, '配體結合觸發閘門開關', '#facc15', 105, -24);
                    } else {
                        // 電位閘控：顯示膜兩側正負電荷翻轉
                        const depolarized = (step === 1 && t > 0.35) || step === 2;
                        const topSign = depolarized ? '−' : '+';
                        const botSign = depolarized ? '+' : '−';
                        ctx.fillStyle = depolarized ? '#fde047' : '#94a3b8';
                        ctx.font = 'bold 16px sans-serif';
                        for (const sx of [-125, -95, 95, 125]) {
                            ctx.fillText(topSign, sx, -52);
                            ctx.fillText(botSign, sx, 62);
                        }
                        addLabel(110, -52, depolarized ? '膜電位去極化 → 閘門開啟' : '靜止電位狀態 → 閘門關閉', '#fde047', 95, -28);
                    }

                    // 背景高濃度 Na+ (外) 與被脂雙層彈開示意
                    [[-220, -135], [-150, -110], [165, -135], [240, -115], [-60, -155]].forEach(([bx, by], i) => {
                        drawIon(bx + Math.sin(state.globalTime * 2 + i) * 5, by, 'Na⁺', C.na, 11.5);
                    });
                    // 左側一顆離子受疏水層阻擋反彈
                    const bounceY = -75 - Math.abs(Math.sin(state.globalTime * 3)) * 28;
                    drawIon(-210, bounceY, 'Na⁺', C.na, 11.5);
                    addLabel(-210, -55, '帶電離子無法直接穿過脂雙層', C.na, -85, -35);

                    // 通過通道的主角離子群
                    if (step === 0) {
                        drawIon(0, -105 + Math.sin(state.globalTime * 3) * 4, 'Na⁺', C.na, 13);
                    } else if (step === 1) {
                        drawIon(0, lerp(-105, -45, e), 'Na⁺', C.na, 13);
                    } else if (step === 2) {
                        drawArrow(0, -90, 0, 105, C.channel, true);
                        drawIon(0, lerp(-45, 125, e), 'Na⁺', C.na, 13);
                        drawIon(0, lerp(-115, 55, e), 'Na⁺', C.na, 13);
                    } else {
                        drawIon(-22, 135, 'Na⁺', C.na, 13);
                        drawIon(26, 120, 'Na⁺', C.na, 13);
                    }

                    addLabel(-36, 10, '離子通道蛋白 (親水性孔道)', C.channel, -125, 22);
                },

                /* 1C. 促進性擴散：載體蛋白 (Carrier Proteins - GLUT) */
                carrier(step, t) {
                    drawCompartments(0);
                    drawPlanarBilayer([{ x1: -62, x2: 62 }], 0);
                    drawGradientMeter(380, '[葡萄糖]', true, C.glucose);

                    const e = easeInOut(t);
                    // openState: -1 朝外開, 0 閉合, +1 朝內開
                    let openState = -1;
                    let glcY = -135;

                    if (step === 0) {
                        openState = -1;
                        glcY = lerp(-155, -88, e);
                    } else if (step === 1) {
                        openState = lerp(-1, -0.25, e);
                        glcY = lerp(-88, -4, e);
                    } else if (step === 2) {
                        openState = lerp(-0.25, 1.0, e);
                        glcY = lerp(-4, 14, e);
                    } else if (step === 3) {
                        openState = lerp(1.0, -1.0, clamp01((t - 0.35) / 0.65));
                        glcY = lerp(14, 140, e);
                    }

                    // 背景高濃度外液葡萄糖
                    [[-230, -135], [-145, -150], [155, -130], [245, -148]].forEach(([bx, by], i) => {
                        drawGlucose(bx + Math.sin(state.globalTime * 1.7 + i) * 5, by, 12.5);
                    });
                    if (step >= 3) drawGlucose(-120, 145, 12.5);

                    drawConformationalProtein(0, 0, openState, C.carrier, C.carrierDark, 38, 58);
                    drawGlucose(0, glcY, 14.5);

                    if (step === 2) {
                        drawArrow(-62, -25, -62, 28, '#a5b4fc', false);
                        drawArrow(62, -25, 62, 28, '#a5b4fc', false);
                    }

                    addLabel(42, 0, '專一性載體蛋白 (構形改變)', C.carrier, 125, -8);
                    addLabel(0, glcY, '葡萄糖分子 (順濃度梯度)', C.glucose, -125, step < 2 ? -26 : 26);
                },

                /* 2A. 初級主動運輸：鈉鉀泵 (Na+/K+-ATPase) - 經典 6 步驟 */
                nakpump(step, t) {
                    drawCompartments(0);
                    drawPlanarBilayer([{ x1: -68, x2: 68 }], 0);
                    drawGradientMeter(345, '[Na⁺]', true, C.na);
                    drawGradientMeter(392, '[K⁺]', false, C.k);

                    // 靜止膜電位指示標章 (外正內負 -70mV)
                    ctx.save();
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = 'bold 14px sans-serif';
                    for (const sx of [-260, -210, 190, 240]) {
                        ctx.fillText('+', sx, -52);
                        ctx.fillText('−', sx, 60);
                    }
                    ctx.restore();
                    addLabel(-235, -55, '維持靜止膜電位 (外正內負 -70mV)', '#94a3b8', 0, -26);

                    // 背景濃度分佈：外高 Na+ / 內高 K+
                    [[-170, -140], [140, -145], [220, -120], [-260, -125]].forEach(([x, y], i) =>
                        drawIon(x + Math.sin(state.globalTime * 2 + i) * 4, y, 'Na⁺', C.na, 11));
                    [[-190, 145], [165, 140], [235, 125], [-265, 130]].forEach(([x, y], i) =>
                        drawIon(x + Math.cos(state.globalTime * 2 + i) * 4, y, 'K⁺', C.k, 11));

                    const e = easeInOut(t);
                    let openState = 1.0; // +1 朝細胞內開, -1 朝細胞外開
                    let hasPi = false;
                    let piPos = { x: 44, y: 56 };

                    if (step === 0) openState = 1.0;
                    else if (step === 1) { openState = lerp(1.0, 0.35, e); hasPi = t > 0.45; }
                    else if (step === 2) { openState = lerp(0.35, -1.0, e); hasPi = true; }
                    else if (step === 3) { openState = -1.0; hasPi = true; }
                    else if (step === 4) { openState = lerp(-1.0, -0.2, e); hasPi = true; piPos = { x: lerp(44, 115, e), y: lerp(56, 125, e) }; }
                    else if (step === 5) { openState = lerp(-0.2, 1.0, e); hasPi = false; }
