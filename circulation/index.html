<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>血液循環</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="tab-bar" style="margin-bottom:8px; z-index:10; position:relative; background:#fff;">
    <button class="tab-btn" id="tab-circulation" data-view="circulation">全體血液循環</button>
    <button class="tab-btn" id="tab-tissue" data-view="tissue">組織</button>
    <button class="tab-btn" id="tab-alveolus" data-view="alveolus">肺泡</button>
  </div>
  <div class="controls" style="position:relative; z-index:2; background:#fff;">
    <label id="cellCountLabel">
      細胞數量:
      <input type="number" id="cellCountInput" min="100" max="3000" step="100" value="800">
    </label>
    <label id="heartPeriodControl">
      心搏速率:
      <input type="range" id="heartPeriodInput" min="40" max="180" step="1" value="60">
      <span id="heartPeriodLabel">60</span> bpm
    </label>
    <button type="button" id="fadeToggleBtn">血球淡化：關</button>
    <button type="button" id="toggleCirculationSVGBtn">心房心室：開</button>
    <button type="button" id="toggleLabelsBtn">器官/血管標籤：開</button>
    <button type="button" id="toggleTrackBtn">鏡頭追蹤：關</button>
  </div>
  <div style="margin-bottom:8px; color:#444; font-size:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
    <span id="hintSelectCell">點擊畫面可標註單一血球</span>
    <button type="button" id="clearHighlightBtn">取消所有血球選取</button>
    <span id="trackStatusIndicator" style="display:none; color:#1976d2; font-weight:bold; background:#e3f2fd; padding:2px 8px; border-radius:12px; font-size:13px;">🎯 正在追蹤標註血球</span>
  </div>
  <!--
  <svg id="alveolusSVG" width="800" height="800" style="display:none; position:absolute; left:0; top:0; z-index:2; background:#fff;"></svg>
  <canvas id="vesselLayer" width="800" height="800" style="position:absolute;left:0;top:0;z-index:0"></canvas>
  <canvas id="graph" width="800" height="800" style="position:absolute;left:0;top:0;z-index:1"></canvas>
  -->
  <div id="viewportContainer" class="viewport-container">
    <div id="viewportContent" class="viewport-content">
      <svg id="mainSVG" width="800" height="800" style="position:absolute; left:0; top:0; z-index:1; pointer-events:none;"></svg>
      <canvas id="vesselLayer" width="800" height="800" style="position:absolute; left:0; top:0; z-index:2; pointer-events:none;"></canvas>
      <canvas id="graph" width="800" height="800" style="position:absolute; left:0; top:0; z-index:3;"></canvas>
    </div>
    <!-- 縮放與平移工具條 -->
    <div class="zoom-controls">
      <button type="button" id="zoomInBtn" title="放大 (+)">＋</button>
      <button type="button" id="zoomOutBtn" title="縮小 (-)">－</button>
      <button type="button" id="zoomResetBtn" title="重設視角 (100%)">100%</button>
      <button type="button" id="zoomFitBtn" title="適應視野">⛶</button>
    </div>
    <!-- 操作提示 -->
    <div class="pan-zoom-hint">
      <span>🖱️ 滾輪縮放 / 拖曳平移 / 點擊標註血球</span>
    </div>
  </div>

  <pre id="output"></pre>
  <script src="main.js"></script> 
</body>
</html>
