<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海洋與地球系統 3D 互動動態模擬器 (12 大核心主題)</title>
<style>
  :root {
    --bg-abyss: #040b16;
    --panel-bg: rgba(8, 20, 38, 0.82);
    --panel-border: rgba(0, 212, 255, 0.25);
    --text-main: #eaf6ff;
    --text-muted: #8ab4d8;
    --accent-cyan: #00e5ff;
    --accent-warm: #ff6d00;
    --accent-cold: #2979ff;
    --accent-bio: #00e676;
    --accent-coral: #ff4081;
    --accent-warn: #ffd600;
    --radius-lg: 14px;
    --radius-sm: 8px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-abyss);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    touch-action: none;
  }

  /* 3D 浮動標籤層 */
  #labels-container {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
    transition: opacity 0.25s ease;
  }
  #labels-container.hidden {
    opacity: 0 !important;
  }

  .label-3d {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, -100%);
    background: rgba(5, 16, 32, 0.86);
    border: 1px solid rgba(0, 229, 255, 0.45);
    border-left: 3px solid var(--accent-cyan);
    color: #fff;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.35;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: opacity 0.2s ease;
  }
  .label-3d .lbl-sub {
    display: block;
    font-size: 10.5px;
    color: var(--text-muted);
  }
  .label-3d::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 5px 5px 0;
    border-style: solid;
    border-color: rgba(0, 229, 255, 0.55) transparent transparent;
  }

  /* 頂部導覽與工具列 */
  #top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(4,11,22,0.95) 0%, rgba(4,11,22,0.75) 80%, transparent 100%);
    padding: 8px 12px 6px;
    gap: 8px;
    pointer-events: none;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    pointer-events: auto;
  }

  .brand-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 229, 255, 0.14);
    border: 1px solid rgba(0, 229, 255, 0.4);
    color: var(--text-main);
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    white-space: nowrap;
  }
  .brand-btn:active { transform: scale(0.97); }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 36px;
    min-width: 36px;
    padding: 0 10px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-main);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .icon-btn:hover { border-color: var(--accent-cyan); }
  .icon-btn:active { transform: scale(0.95); }
  .icon-btn.active {
    background: rgba(0, 229, 255, 0.22);
    border-color: var(--accent-cyan);
    color: #fff;
  }

  /* 水平多分頁選單 */
  #tabs-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    pointer-events: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #tabs-scroll::-webkit-scrollbar { display: none; }

  .tab-pill {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(10, 25, 48, 0.78);
    border: 1px solid rgba(138, 180, 216, 0.25);
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .tab-pill:hover {
    color: #fff;
    border-color: rgba(0, 229, 255, 0.5);
  }
  .tab-pill.active {
    background: linear-gradient(135deg, rgba(0, 180, 216, 0.45), rgba(0, 119, 182, 0.65));
    border-color: var(--accent-cyan);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
  }

  /* 手勢提示氣泡 */
  #gesture-toast {
    position: fixed;
    top: 98px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    background: rgba(5, 18, 36, 0.85);
    border: 1px solid rgba(0, 229, 255, 0.35);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--text-muted);
    pointer-events: none;
    transition: opacity 0.6s ease;
    white-space: nowrap;
  }

  /* 底部 / 側邊控制與敘事面板 */
  #hud-panel {
    position: fixed;
    z-index: 10;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.65);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease, max-height 0.3s ease;
  }
  #hud-panel.collapsed .hud-collapsible {
    display: none;
  }
  #hud-panel.collapsed {
    padding: 8px 12px;
  }

  .hud-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  #hud-panel.collapsed .hud-header {
    margin-bottom: 0;
  }

  .hud-header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  /* 收合時可直接切換步驟的迷你控制器 */
  .hud-mini-stepper {
    display: none;
    align-items: center;
    gap: 3px;
    background: rgba(0, 229, 255, 0.12);
    border: 1px solid rgba(0, 229, 255, 0.32);
    border-radius: var(--radius-sm);
    padding: 2px 5px;
  }
  #hud-panel.collapsed .hud-mini-stepper {
    display: inline-flex;
  }
  .mini-step-btn {
    background: transparent;
    border: none;
    color: var(--accent-cyan);
    font-size: 11px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }
  .mini-step-btn:hover {
    background: rgba(0, 229, 255, 0.25);
  }
  .mini-step-btn:active {
    transform: scale(0.92);
  }
  .mini-step-text {
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    min-width: 26px;
    text-align: center;
  }

  .theme-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    cursor: pointer;
  }
  .theme-badge {
    flex: 0 0 auto;
    background: rgba(0, 229, 255, 0.2);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
  }
  #theme-title {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .concept-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 8px;
  }
  .concept-tag {
    font-size: 11px;
    color: #b3e5fc;
    background: rgba(41, 121, 255, 0.18);
    border: 1px solid rgba(41, 121, 255, 0.35);
    padding: 2px 8px;
    border-radius: 99px;
  }

  /* 步驟進度軌 */
  .steps-track {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .step-node {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 7px;
    padding: 6px 8px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    color: var(--text-muted);
  }
  .step-node:hover {
    background: rgba(0, 229, 255, 0.1);
  }
  .step-node.active {
    background: rgba(0, 229, 255, 0.22);
    border-color: var(--accent-cyan);
    color: #fff;
    box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.18);
  }
  .step-num {
    display: block;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-cyan);
    margin-bottom: 1px;
  }
  .step-name {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .narrative-box {
    background: rgba(3, 10, 20, 0.65);
    border-left: 3px solid var(--accent-cyan);
    border-radius: 6px;
    padding: 8px 11px;
    font-size: 13px;
    line-height: 1.55;
    color: #dceefb;
    margin-bottom: 10px;
    min-height: 52px;
    user-select: text;
  }

  /* 底部控制列與互動滑桿 */
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .step-btns {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ctrl-btn {
    min-height: 38px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid rgba(0, 229, 255, 0.35);
    background: rgba(0, 180, 216, 0.16);
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
  }
  .ctrl-btn:hover { background: rgba(0, 229, 255, 0.28); }
  .ctrl-btn:active { transform: scale(0.96); }
  .ctrl-btn.play-active {
    background: rgba(0, 230, 118, 0.25);
    border-color: var(--accent-bio);
    color: #b9f6ca;
  }

  .slider-box {
    flex: 1 1 230px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 6px 11px;
    border-radius: 8px;
  }
  .slider-label {
    font-size: 11.5px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .slider-val {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-cyan);
    min-width: 56px;
    text-align: right;
    white-space: nowrap;
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 99px;
    background: rgba(138, 180, 216, 0.3);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent-cyan);
    border: 2px solid #fff;
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.7);
  }

  /* 12 主題總覽抽屜 Modal */
  #drawer-modal {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(2, 8, 18, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #drawer-modal.open { display: flex; }

  .drawer-card {
    width: min(880px, 100%);
    max-height: 88vh;
    background: rgba(8, 22, 42, 0.96);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow: hidden;
  }
  .drawer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .drawer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .drawer-item {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(138, 180, 216, 0.2);
    border-radius: 10px;
    padding: 11px 12px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .drawer-item:hover, .drawer-item.active {
    background: rgba(0, 229, 255, 0.16);
    border-color: var(--accent-cyan);
  }
  .drawer-item .di-num {
    font-size: 11px;
    color: var(--accent-cyan);
    font-weight: 700;
  }
  .drawer-item .di-title {
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    margin: 3px 0 4px;
  }
  .drawer-item .di-sub {
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.35;
  }

  /* 視覺一致性色票圖例小條 */
  .legend-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .leg-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }

  /* 桌面寬螢幕 (>= 900px)：面板移至右側懸浮，3D 主畫面中央與左側完全開闊 */
  @media (min-width: 900px) {
    #hud-panel {
      top: 96px;
      right: 20px;
      bottom: 20px;
      left: auto;
      transform: none;
      width: 380px;
      max-height: calc(100vh - 116px);
      display: flex;
      flex-direction: column;
    }
    #hud-panel.collapsed {
      bottom: auto;
      max-height: none;
      width: auto;
      min-width: 290px;
      max-width: 420px;
    }
    #hud-panel .hud-collapsible {
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 229, 255, 0.35) transparent;
    }
    #hud-panel .hud-collapsible::-webkit-scrollbar {
      width: 4px;
    }
    #hud-panel .hud-collapsible::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 255, 0.35);
      border-radius: 99px;
    }
    #hud-panel .steps-track {
      grid-template-columns: repeat(2, 1fr);
    }
    #hud-panel .controls-row {
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    #hud-panel .step-btns {
      width: 100%;
      justify-content: space-between;
    }
    #hud-panel .ctrl-btn {
      flex: 1;
      justify-content: center;
      padding: 0 6px;
    }
    #hud-panel .slider-box {
      width: 100%;
      flex: none;
    }
  }

  /* 行動端與中小型螢幕 (< 900px)：置於底部，緊湊排版不遮蔽過半螢幕 */
  @media (max-width: 899px) {
    #hud-panel {
      bottom: calc(10px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: min(680px, calc(100vw - 16px));
      max-height: 50vh;
      display: flex;
      flex-direction: column;
    }
    #hud-panel.collapsed {
      max-height: none;
      width: min(560px, calc(100vw - 16px));
    }
    #hud-panel .hud-collapsible {
      overflow-y: auto;
      max-height: calc(50vh - 46px);
      padding-right: 3px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 229, 255, 0.3) transparent;
    }
    #hud-panel .hud-collapsible::-webkit-scrollbar {
      width: 4px;
    }
    #hud-panel .hud-collapsible::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 255, 0.3);
      border-radius: 99px;
    }
    .narrative-box {
      max-height: 80px;
      overflow-y: auto;
    }
  }

  @media (max-width: 640px) {
    .brand-text-long { display: none; }
    .steps-track { grid-template-columns: repeat(2, 1fr); }
    #hud-panel { padding: 8px 10px; bottom: calc(6px + var(--safe-bottom)); max-height: 52vh; }
    #hud-panel .hud-collapsible { max-height: calc(52vh - 44px); }
    .narrative-box { font-size: 12px; padding: 6px 8px; line-height: 1.45; max-height: 70px; }
    .ctrl-btn { padding: 0 6px; font-size: 11.5px; min-height: 34px; }
    .slider-box { padding: 4px 7px; }
    #gesture-toast { top: 92px; font-size: 11px; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="canvas-container"></div>
<div id="labels-container"></div>

<!-- 頂部導覽與工具列 -->
<header id="top-bar">
  <div class="top-row">
    <button class="brand-btn" id="btn-open-drawer" title="開啟 12 大主題目錄">
      <span>☰ 主題總覽</span>
      <span class="brand-text-long" style="color:var(--accent-cyan);font-weight:400;">| 海洋地科 3D 模擬器</span>
    </button>

    <div class="tool-group">
      <button class="icon-btn active" id="btn-toggle-labels" title="顯示或隱藏 3D 文字標籤">🏷️ 標籤: 開</button>
      <button class="icon-btn" id="btn-zoom-in" title="放大視角">＋</button>
      <button class="icon-btn" id="btn-zoom-out" title="縮小視角">－</button>
      <button class="icon-btn" id="btn-reset-cam" title="重置當前步驟最佳視角">🎯 視角</button>
      <button class="icon-btn" id="btn-toggle-hud" title="收合或展開下方解說面板">▾ 面板</button>
    </div>
  </div>

  <nav id="tabs-scroll" aria-label="12大海洋科學主題分頁"></nav>
</header>

<div id="gesture-toast">👆 單指拖曳旋轉 · 雙指縮放與平移 (支援滑鼠滾輪/右鍵平移)</div>

<!-- 底部 / 側邊敘事與互動控制面板 -->
<section id="hud-panel">
  <div class="hud-header">
    <div class="theme-title-wrap" title="點擊收合或展開詳細說明">
      <span class="theme-badge" id="theme-badge">主題 01 / 12</span>
      <h1 id="theme-title">海底黑煙囪與地球內部熱循環</h1>
    </div>
    <div class="hud-header-actions">
      <!-- 迷你步驟指示與切換 (收合時亦可輕鬆切換步驟) -->
      <div class="hud-mini-stepper" id="hud-mini-stepper" title="目前步驟 (點擊箭頭可切換)">
        <button class="mini-step-btn" id="btn-mini-prev" title="上一步">◀</button>
        <span class="mini-step-text" id="mini-step-text">1/4</span>
        <button class="mini-step-btn" id="btn-mini-next" title="下一步">▶</button>
      </div>
      <button class="icon-btn" id="btn-hud-mini" style="min-height:28px;padding:0 8px;font-size:11.5px;">收合</button>
    </div>
  </div>

  <div class="hud-collapsible">
    <div class="concept-tags" id="concept-tags"></div>

/* 3D 標籤管理 */
function add3DLabel(pos, title, sub = '', borderColor = '#00e5ff', steps = null, parentObj = null) {
  const el = document.createElement('div');
  el.className = 'label-3d';
  el.style.borderLeftColor = borderColor;
  el.innerHTML = `<strong>${title}</strong>${sub ? `<span class="lbl-sub">${sub}</span>` : ''}`;
  labelsContainer.appendChild(el);
  const item = {
    el,
    pos: pos instanceof THREE.Vector3 ? pos.clone() : new THREE.Vector3(...pos),
    steps,
    parentObj
  };
  activeLabels.push(item);
  return item;
}

const _projVec = new THREE.Vector3();
function update3DLabels() {
  if (!labelsVisible) return;
  const w = window.innerWidth;
  const h = window.innerHeight;
  for (const lbl of activeLabels) {
    if (lbl.steps && !lbl.steps.includes(currentStepIdx)) {
      lbl.el.style.display = 'none';
      continue;
    }
    _projVec.copy(lbl.pos);
    if (lbl.parentObj) {
      lbl.parentObj.localToWorld(_projVec);
    }
    _projVec.project(camera);
    if (_projVec.z > 1 || _projVec.z < -1) {
      lbl.el.style.display = 'none';
      continue;
    }
    const x = (_projVec.x * 0.5 + 0.5) * w;
    const y = (-_projVec.y * 0.5 + 0.5) * h;
    lbl.el.style.display = 'block';
    lbl.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) translate(-50%, -115%)`;
  }
}

/* 清除並釋放前一個主題的 GPU 記憶體 */
function disposeActiveScene() {
  activeLabels.forEach(l => l.el.remove());
  activeLabels = [];
  scene.remove(activeGroup);
  activeGroup.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
  activeGroup = new THREE.Group();
  scene.add(activeGroup);
  dirLight.intensity = 1.4;
  dirLight.position.set(15, 28, 18);
  hemiLight.intensity = 1.15;
  scene.fog.density = 0.011;
}

let cachedEarthTex = null;
function getProceduralEarthTexture() {
  if (cachedEarthTex) return cachedEarthTex;
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 512;
  const ctx = c.getContext('2d');

  // 深海漸層底圖
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#0a2540');
  grad.addColorStop(0.5, '#071c38');
  grad.addColorStop(1, '#0a2540');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 512);

  // 經緯網格細線
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= 1024; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke(); }
  for (let y = 0; y <= 512; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke(); }

  const ll2xy = (lon, lat) => [((lon + 180) / 360) * 1024, ((90 - lat) / 180) * 512];
  const drawPoly = (coords, fill, stroke = '#4895ef') => {
    ctx.beginPath();
    coords.forEach(([lon, lat], i) => {
      const [x, y] = ll2xy(lon, lat);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  };

  const landCol = '#2a5c43';
  // 北美洲
  drawPoly([[-165,65],[-130,70],[-80,72],[-60,50],[-80,25],[-95,18],[-82,9],[-105,20],[-123,38],[-140,60]], landCol);
  // 格陵蘭
  drawPoly([[-55,60],[-20,65],[-18,81],[-52,82],[-60,72]], '#a8dadc', '#e0fbfc');
  // 南美洲
  drawPoly([[-80,10],[-60,8],[-35,-6],[-42,-23],[-58,-38],[-70,-54],[-75,-42],[-71,-18],[-81,-4]], landCol);
  // 歐亞大陸
  drawPoly([[-10,36],[0,52],[15,68],[60,72],[130,72],[170,65],[142,45],[122,32],[105,10],[96,16],[80,8],[70,22],[55,24],[42,12],[34,30],[26,38],[12,42]], landCol);
  // 非洲
  drawPoly([[-17,15],[-6,35],[12,34],[33,30],[50,12],[40,-12],[30,-34],[18,-34],[12,-15],[8,4],[-8,5]], landCol);
  // 澳洲與印尼群島
  drawPoly([[114,-22],[130,-12],[145,-15],[153,-28],[144,-38],[130,-33],[115,-34]], '#386641');
  drawPoly([[98,4],[106,-6],[118,-8],[115,2]], landCol);
  drawPoly([[132,-2],[148,-6],[146,-9],[134,-5]], landCol);
  // 南極洲
  drawPoly([[-180,-72],[180,-72],[180,-90],[-180,-90]], '#cfe8ef', '#ffffff');

  cachedEarthTex = new THREE.CanvasTexture(c);
  cachedEarthTex.colorSpace = THREE.SRGBColorSpace;
  return cachedEarthTex;
}

// 經緯度轉 3D 球座標 (與 Three.js SphereGeometry UV 完全對齊)
function latLonToVec3(lat, lon, radius) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

// 建立 3D 立體箭頭
function createArrow3D(from, to, color = PALETTE.accentCyan, shaftRadius = 0.1, headLen = 0.55, headRad = 0.28) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const grp = new THREE.Group();
  if (len < 0.001) return grp;

  const mat = new THREE.MeshStandardMaterial({
    color,
    emissive: color,
    emissiveIntensity: 0.35,
    roughness: 0.3
  });
  const sLen = Math.max(0.05, len - headLen);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftRadius, shaftRadius, sLen, 12), mat);
  shaft.position.y = sLen * 0.5;
  grp.add(shaft);

  const head = new THREE.Mesh(new THREE.ConeGeometry(headRad, headLen, 14), mat);
  head.position.y = sLen + headLen * 0.5;
  grp.add(head);

  grp.position.copy(from);
  grp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return grp;
}

// 建立沿曲線運動的發光粒子流
function createCurveParticleStream(curve, count, color, size = 0.26) {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const offsets = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    offsets[i] = i / count;
    const p = curve.getPointAt(offsets[i]);
    positions[i * 3] = p.x;
    positions[i * 3 + 1] = p.y;
    positions[i * 3 + 2] = p.z;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color,
    size,
    transparent: true,
    opacity: 0.92,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  return {
    mesh: pts,
    update(dt, speed = 0.15) {
      const arr = geo.attributes.position.array;
      for (let i = 0; i < count; i++) {
        offsets[i] = (offsets[i] + dt * speed) % 1;
        if (offsets[i] < 0) offsets[i] += 1;
        const p = curve.getPointAt(offsets[i]);
        arr[i * 3] = p.x;
        arr[i * 3 + 1] = p.y;
        arr[i * 3 + 2] = p.z;
      }
      geo.attributes.position.needsUpdate = true;
    }
  };
}
