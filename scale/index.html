<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>宇宙尺度探索：從星系到原子 (Scale of the Universe)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Main Interactive Canvas -->
  <canvas id="zoomCanvas"></canvas>

  <!-- Top Header & Scale Readout -->
  <header class="hud-header">
    <div class="brand-box">
      <h1 class="brand-title">宇宙尺度探索：十的次方</h1>
      <p class="brand-subtitle">從行星軌道一路放大至地球、人體、細胞、DNA 分子與原子核</p>
    </div>

    <div class="scale-readout">
      <div class="scale-power" id="scalePowerText">10<sup>7.0</sup> m</div>
      <div class="scale-unit-text" id="scaleHumanText">≈ 10,000 公里 (km)</div>
    </div>
  </header>

  <!-- Left Quick-Jump Milestones -->
  <nav class="milestones-nav" id="milestonesNav" aria-label="尺度快速跳轉">
    <!-- Generated dynamically by app.js -->
  </nav>

  <!-- Right Scientific Info Panel -->
  <aside class="info-panel" id="infoPanel">
    <span class="info-badge" id="infoCategory">巨觀尺度 · Macrocosmos</span>
    <h2 class="info-title" id="infoTitle">地球</h2>
    <div class="info-en" id="infoSubtitle">Planet Earth</div>
    <div class="info-size-row">
      <span class="info-size-label">典型尺度</span>
      <span class="info-size-val" id="infoSizeVal">1.27 × 10⁷ m (12,742 km)</span>
    </div>
    <p class="info-desc" id="infoDesc">
      我們孕育生命的藍色家園。擁有液態海洋、氮氧大氣層與活躍的板塊構造。繼續放大將穿越雲層進入陸地與生命尺度。
    </p>
    <div class="info-tags" id="infoTags">
      <!-- Populated dynamically -->
    </div>
  </aside>

  <!-- Bottom Control Bar -->
  <section class="bottom-bar">
    <div class="controls-top">
      <div class="btn-group">
        <button class="ctrl-btn primary" id="btnAutoTour" title="自動播放從星球到原子的連續縮放導覽 (空白鍵)">
          <span id="autoTourIcon">▶</span>
          <span id="autoTourLabel">自動深入導覽</span>
        </button>
        <button class="ctrl-btn" id="btnZoomOut" title="縮小看宏觀 (↑ 或 -)">
          🔍− 縮小 (宏觀)
        </button>
        <button class="ctrl-btn" id="btnZoomIn" title="放大看微觀 (↓ 或 +)">
          🔍+ 放大 (微觀)
        </button>
      </div>

      <div class="scale-bar-widget">
        <div class="scale-bar-graphic" id="scaleBarGraphic"></div>
        <span class="scale-bar-label" id="scaleBarLabel">1,000 km</span>
      </div>

      <div class="hint-text">
        💡 滾輪 / 雙指縮放 / 拖曳滑桿 / 點擊左側節點
      </div>
    </div>

    <div class="slider-row">
      <span class="slider-EndLabel">🪐 10¹¹ m (行星系)</span>
      <input
        type="range"
        id="scaleSlider"
        class="scale-slider"
        min="0"
        max="1000"
        step="1"
        value="154"
        aria-label="尺度縮放滑桿"
      />
      <span class="slider-EndLabel">⚛️ 10⁻¹⁵ m (原子核)</span>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
