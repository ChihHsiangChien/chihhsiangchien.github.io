            // 4. 一對腎形保衛細胞 (Guard Cells) 圍成中央氣孔 (Stoma) — 中心 x = 500, y = 456
            // 展現「內側細胞壁較厚、外側細胞壁較薄」的關鍵解剖特徵！
            const drawGuardCell = (side) => {
                // side: -1 左保衛細胞, +1 右保衛細胞
                ctx.save();
                const outerBow = isOpen ? 152 : 128;
                const innerEdge = poreHalfW;
                ctx.beginPath();
                // 上端接合點 (500 + side*12, 422) -> 外弧彎曲 -> 下端接合點 (500 + side*12, 490) -> 內側厚壁弧線
                ctx.moveTo(500 + side * 8, 422);
                ctx.bezierCurveTo(
                    500 + side * outerBow, 412,
                    500 + side * outerBow, 500,
                    500 + side * 8, 490
                );
                ctx.bezierCurveTo(
                    500 + side * innerEdge, 476,
                    500 + side * innerEdge, 436,
                    500 + side * 8, 422
                );
                ctx.closePath();
                ctx.fillStyle = isOpen ? '#dcfce7' : '#ecfccb';
                ctx.fill();
                // 外側薄細胞壁
                ctx.strokeStyle = PALETTE.phloemWall;
                ctx.lineWidth = 3;
                ctx.stroke();

                // 內側特化加厚細胞壁 (Thick inner cell wall)
                ctx.beginPath();
                ctx.moveTo(500 + side * 8, 424);
                ctx.bezierCurveTo(
                    500 + side * innerEdge, 436,
                    500 + side * innerEdge, 476,
                    500 + side * 8, 488
                );
                ctx.strokeStyle = '#14532d';
                ctx.lineWidth = 8.5;
                ctx.lineCap = 'round';
                ctx.stroke();

                // 保衛細胞具有葉綠體 (一般表皮細胞沒有！) 與液胞
                for (let [gx, gy] of [[side * 68, 438], [side * 86, 456], [side * 66, 474]]) {
                    ctx.beginPath(); ctx.ellipse(500 + gx, gy, 8, 5, 0.2, 0, Math.PI * 2);
                    ctx.fillStyle = PALETTE.chloroplast; ctx.fill();
                }
                ctx.restore();
            };
            drawGuardCell(-1);
            drawGuardCell(1);

            // === Step 動態流程 ===
            // Step >= 1: 液態水離開導管，沿葉肉細胞壁擴散浸潤表面
            if (step >= 1) {
                const filmPath1 = [[285, 118], [320, 125], [495, 130], [535, 130]];
                const filmPath2 = [[285, 128], [235, 215], [320, 275]];
                for (let i = 0; i < 6; i++) {
                    const p1 = samplePath(filmPath1, (t * 0.5 + i / 6) % 1);
                    const p2 = samplePath(filmPath2, (t * 0.5 + (i + 0.5) / 6) % 1);
                    drawWaterDot(p1.x, p1.y, 5.5);
                    drawWaterDot(p2.x, p2.y, 5.5);
                }
                drawArrow(275, 148, 345, 195, '#0284c7', 3);
            }

            // Step >= 2: 液態水在細胞壁表面蒸發為氣態水蒸氣 (淺藍半透明擴散霧氣球) 充滿氣室
            const drawVapor = (vx, vy, r = 7, alpha = 0.75) => {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.beginPath(); ctx.arc(vx, vy, r, 0, Math.PI * 2);
                ctx.fillStyle = '#7dd3fc'; ctx.fill();
                ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 1.2;
                ctx.setLineDash([2, 2]); ctx.stroke();
                ctx.restore();
            };

            if (step >= 2) {
                // 蒸發動畫：由各葉肉細胞壁向中央氣室 (x:340..660, y:210..390) 飄散
                const evapOrigins = [[410, 185], [610, 185], [322, 285], [692, 300]];
                evapOrigins.forEach(([ox, oy], idx) => {
                    for (let i = 0; i < 4; i++) {
                        const u = (t * 0.45 + i / 4 + idx * 0.2) % 1;
                        const tx = 500 + (idx - 1.5) * 45 + Math.sin(t * 3 + i) * 14;
                        const ty = 320 + (i % 2) * 35;
                        drawVapor(ox + (tx - ox) * u, oy + (ty - oy) * u, 6.5, 0.85);
                    }
                });
                drawArrow(410, 192, 445, 255, '#38bdf8', 2.5, true);
                drawArrow(610, 192, 575, 255, '#38bdf8', 2.5, true);
            }

            // Step >= 3: K+ 離子與水主動/滲透進入保衛細胞，膨壓升高撐開氣孔！
            if (step >= 3) {
                drawATPBadge(355, 405, 0.85);
                drawATPBadge(645, 405, 0.85);
                for (let side of [-1, 1]) {
                    for (let i = 0; i < 3; i++) {
                        const u = (t * 0.65 + i / 3) % 1;
                        const startX = 500 + side * 185;
                        const endX = 500 + side * 85;
                        drawIonDot(startX + (endX - startX) * u, 448, 5);
                        drawWaterDot(startX + (endX - startX) * ((u + 0.5) % 1), 466, 5);
                    }
                    drawArrow(500 + side * 175, 456, 500 + side * 115, 456, '#9333ea', 3);
                    // 保衛細胞內累積的 K+ 離子
                    drawIonDot(500 + side * 52, 448, 5);
                    drawIonDot(500 + side * 52, 466, 5);
                    drawIonDot(500 + side * 98, 456, 5);
                }
            }

            // Step >= 4: 水蒸氣順水勢梯度快速穿過張開的氣孔擴散至外部乾燥大氣！
            if (step >= 4) {
                for (let i = 0; i < 14; i++) {
                    const u = (t * 0.55 + i / 14) % 1;
                    const startX = 500 + ((i % 5) - 2) * 18;
                    const spreadX = 500 + ((i % 5) - 2) * (18 + u * 85);
                    const vy = 355 + u * 225;
                    // 在氣孔咽喉處收束再向外擴散
                    const neckFactor = Math.exp(-Math.pow((vy - 456) / 36, 2));
                    const actualX = spreadX * (1 - neckFactor * 0.65) + 500 * (neckFactor * 0.65);
                    drawVapor(actualX, vy, 6.5 + u * 3, 1 - u * 0.55);
                }
                drawArrow(500, 385, 500, 565, '#38bdf8', 5.5, true);
            }

            // === 標籤 ===
            drawLabel("葉脈木質部導管末端", 192, 52, { bold: true, borderColor: PALETTE.xylemWall });
            drawLabel("葉肉細胞 (含葉綠體)", 625, 52, { borderColor: '#16a34a' });
            drawLabel("葉內氣室 (Substomatal Chamber)\n高濕度、相對水勢較高", 500, 295, { borderColor: '#38bdf8' });
            drawLabel("下表皮與角質層 (防水)", 190, 518, { targetX: 190, targetY: 490, borderColor: '#fde047' });
            drawLabel("保衛細胞 (Guard Cells)\n內壁厚、外壁薄", 775, 522, { targetX: 605, targetY: 465, bold: true, borderColor: PALETTE.phloemWall });
            drawLabel(isOpen ? "氣孔張開\n(Stoma Open)" : "氣孔微閉", 500, 402, { bold: true, borderColor: isOpen ? '#34d399' : '#94a3b8' });

            if (step === 1) {
                drawLabel("液態水浸潤葉肉細胞壁形成薄水膜", 425, 215, { targetX: 410, targetY: 184, borderColor: '#0284c7' });
            }
            if (step === 2) {
                drawLabel("液態水吸收熱能「蒸發」為水蒸氣\n微纖絲彎月面產生拉動全株的表面張力！", 500, 232, { bg: 'rgba(12,74,110,0.92)', borderColor: '#7dd3fc', bold: true });
            }
            if (step === 3) {
                drawLabel("耗能排 H⁺ 促使 K⁺ 與水進入\n膨壓升高使保衛細胞向外彎曲撐開氣孔！", 500, 555, { bg: 'rgba(59,7,100,0.92)', borderColor: '#c084fc', bold: true });
            }
            if (step === 4) {
                drawLabel("外部大氣 (極低水勢 Ψw)：水蒸氣擴散離開完成蒸散作用！", 500, 578, { bg: 'rgba(6,95,70,0.92)', borderColor: '#34d399', bold: true });
            }
        }

        /* =========================================================================
           主渲染迴圈 (Animation Loop)
           ========================================================================= */
        let lastTimestamp = performance.now();

        function animate(now) {
            const dt = Math.min(0.05, (now - lastTimestamp) / 1000);
            lastTimestamp = now;
            state.time += dt;

            const tabInfo = TABS_DATA[state.currentTab];
            if (tabInfo.is3D) {
                threeApp.render(state.time, state.currentStep);
            } else {
                const rect = viewport.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, rect.width, rect.height);

                // 套用 2D Zoom & Pan 矩陣
                ctx.save();
                ctx.translate(state.cam.x, state.cam.y);
                ctx.scale(state.cam.scale, state.cam.scale);

                // 繪製細緻科學座標背景網格
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.06)';
                ctx.lineWidth = 1;
                for (let gx = 0; gx <= BASE_W; gx += 50) {
                    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, BASE_H); ctx.stroke();
                }
                for (let gy = 0; gy <= BASE_H; gy += 50) {
                    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(BASE_W, gy); ctx.stroke();
                }

                switch (state.currentTab) {
                    case 0: renderTab0(state.time, state.currentStep); break;
                    case 1: renderTab1(state.time, state.currentStep); break;
                    case 2: renderTab2(state.time, state.currentStep); break;
                    case 4: renderTab4(state.time, state.currentStep); break;
                    case 5: renderTab5(state.time, state.currentStep); break;
                    case 6: renderTab6(state.time, state.currentStep); break;
                }
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        // 初始化啟動
        resizeAll();
        updateUI();
        requestAnimationFrame(animate);
    </script>
</body>

</html>
