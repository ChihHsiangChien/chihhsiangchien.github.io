<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下肢靜脈瓣膜、肌肉幫浦與深部靜脈血栓 (DVT) 互動模擬</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --vein-wall: #64748b;
      --muscle-base: #be123c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(90deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      border-bottom: 1px solid #334155;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f1f5f9;
    }

    header .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .main-layout {
      display: grid;
      grid-template-columns: 380px 540px;
      justify-content: center;
      align-items: start;
      gap: 20px;
      padding: 18px;
      flex: 1;
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 980px) {
      .main-layout {
        grid-template-columns: 1fr;
        max-width: 560px;
      }
      .canvas-section {
        order: -1;
      }
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-blue);
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Canvas Container */
    .canvas-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .canvas-overlay-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px 10px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .direction-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    /* Controls */
    .btn-pump {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      color: white;
      border: 2px solid #fda4af;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s ease;
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.4);
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn-pump:hover {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
    }

    .btn-pump:active, .btn-pump.active {
      background: linear-gradient(135deg, #9f1239 0%, #881337 100%);
      border-color: #fecdd3;
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.45), 0 0 12px rgba(244, 63, 94, 0.5);
    }

    .btn-pump small {
      display: block;
      font-size: 0.8rem;
      font-weight: 400;
      opacity: 0.9;
      margin-top: 4px;
    }

    .mode-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mode-btn {
      background: #0f172a;
      color: var(--text-muted);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn:hover {
      border-color: var(--accent-blue);
      color: var(--text-main);
    }

    .mode-btn.active {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .mode-btn.danger.active {
      background: rgba(248, 113, 113, 0.2);
      color: var(--accent-red);
      border-color: var(--accent-red);
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .secondary-btn {
      flex: 1;
      background: #334155;
      color: #f1f5f9;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .secondary-btn:hover {
      background: #475569;
    }

    .secondary-btn.warn {
      background: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
      color: #fcd34d;
    }

    .secondary-btn.warn:hover {
      background: rgba(245, 158, 11, 0.35);
    }

    /* Legend */
    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.8rem;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.86rem;
      background: #0f172a;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.84rem;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🦵 下肢靜脈瓣膜、骨骼肌幫浦與血栓形成 (DVT) 互動展示</h1>
      <div class="subtitle">觀察「第二心臟」小腿肌肉如何推動血液克服地心引力，以及久坐不動如何導致靜脈血栓</div>
    </div>
    <div class="direction-badge">⬆️ 血液回流方向：由下往上（流向心臟）</div>
  </header>

  <main class="main-layout">
    <!-- Left Panel: Interactive Controls & Live Metrics -->
    <section class="panel">
      <div class="panel-title">
        <span>🎮 互動控制面板</span>
        <span id="modeLabel" style="font-size:0.8rem; color:#94a3b8;">手動控制模式</span>
      </div>

      <button id="pumpBtn" class="btn-pump">
        💪 按住收縮腓腸肌 (墊腳尖/踝泵)
        <small>亦可按住鍵盤【空白鍵 Space】或直接點擊解剖圖肌肉</small>
      </button>

      <div>
        <div style="font-size: 0.83rem; color: var(--text-muted); margin-bottom: 6px;">選擇生活情境模式：</div>
        <div class="mode-group">
          <button class="mode-btn active" data-mode="manual">🖐️ 手動收縮</button>
          <button class="mode-btn" data-mode="walk">🚶 規律步行</button>
          <button class="mode-btn danger" data-mode="sedentary">🪑 久坐不動</button>
        </div>
      </div>

      <div class="action-row">
        <button id="fastForwardBtn" class="secondary-btn warn" title="模擬長時間搭乘飛機或久坐辦公">⏩ 加速模擬久坐 (+15秒)</button>
        <button id="resetBtn" class="secondary-btn" title="清除血栓並重置模擬">🔄 清除血栓 / 重置</button>
      </div>

      <div class="toggle-row">
        <span>靜脈瓣膜狀態：</span>
        <select id="valveHealthSelect">
          <option value="normal">✅ 正常單向瓣膜</option>
          <option value="incompetent">⚠️ 瓣膜閉鎖不全 (靜脈曲張)</option>
        </select>
      </div>

      <div class="legend" style="margin-top: 10px;">
        <div class="legend-item">
          <span class="dot" style="background: #ef4444; border: 2px solid #991b1b;"></span>
          <span>紅血球 (RBC)</span>
        </div>
        <div class="legend-item">
          <span class="dot" style="background: #fde047;"></span>
          <span>血小板 / 凝血因子</span>
        </div>
        <div class="legend-item">
          <span class="dot" style="background: #e2e8f0; border-radius: 2px; height: 4px;"></span>
          <span>靜脈雙葉瓣膜</span>
        </div>
        <div class="legend-item">
          <span class="dot" style="background: #7f1d1d; border: 1px dashed #fca5a5;"></span>
          <span>纖維蛋白網與血栓</span>
        </div>
      </div>
    </section>

    <!-- Center Panel: Interactive Anatomical Canvas -->
    <section class="canvas-section">
      <div class="canvas-overlay-top">
        <span>❤️ <strong>近心端 (往心臟 / 下腔靜脈)</strong></span>
        <span>💡 提示：點擊畫布兩側紅色肌肉也可直接收縮</span>
      </div>
      <canvas id="veinCanvas" width="520" height="650"></canvas>
      <div class="canvas-overlay-top" style="padding-top: 10px; padding-bottom: 2px;">
        <span>🦶 <strong>遠心端 (來自腳掌微血管)</strong> · 地心引力向下 ⬇️</span>
        <span id="peToast" style="color: #f87171; font-weight: 700;"></span>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('veinCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const pumpBtn = document.getElementById('pumpBtn');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const modeLabel = document.getElementById('modeLabel');
    const fastForwardBtn = document.getElementById('fastForwardBtn');
    const resetBtn = document.getElementById('resetBtn');
    const valveHealthSelect = document.getElementById('valveHealthSelect');

    const peToast = document.getElementById('peToast');

    // Simulation Geometry & State
    const W = canvas.width;
    const H = canvas.height;
    const CENTER_X = W / 2;
    const BASE_VEIN_HALF_WIDTH = 66;

    // Two venous valves: Upper (proximal) and Lower (distal)
    const UPPER_VALVE_Y = 205;
    const LOWER_VALVE_Y = 465;

    let simState = {
      mode: 'manual',           // 'manual', 'walk', 'sedentary'
      valveHealth: 'normal',    // 'normal', 'incompetent'
      isContracting: false,
      wasContracting: false,
      relaxationTimer: 0.0,     // Visible duration for diastolic refilling (suction through lower valve)
      contractionAmount: 0,     // 0 (relaxed) to 1 (fully contracted)
      contractionVelocity: 0,   // Rate of change of contraction
      upperValveOpen: 0.0,      // 0 (closed) to 1 (fully open) - starts at rest
      lowerValveOpen: 0.0,
      bloodVelocityY: 0.0,      // 0 at rest (no flow through valves when stationary)
      stasisSeconds: 0,         // Time without meaningful muscle contraction
      thrombusLevel: 0,         // 0 to 100 (%)
      walkTimer: 0,
      pushedClots: [],          // Formed thrombi that were detached and pushed upward by muscle contraction
      peWarningTimer: 0
    };

    // Helper: Exact leaflet X position at given Y coordinate for Bezier curve collision
    function getLeafletX(y, vY, open, hw, side) {
      const tipY = vY - 46;
      const rootY = vY;
      if (y < tipY) return CENTER_X + side * (open * hw * 0.76);
      if (y > rootY) return CENTER_X + side * hw;

      const bellyY = vY - 46 * (0.12 + open * 0.38);
      const rootX = CENTER_X + side * hw;
      const tipX = CENTER_X + side * (open * hw * 0.76);
      const bellyX = CENTER_X + side * (hw * 0.55);

      const A = rootY - 2 * bellyY + tipY;
      const B = 2 * (bellyY - rootY);
      const C = rootY - y;

      let t = 0;
      if (Math.abs(A) < 1e-5) {
        t = Math.abs(B) > 1e-5 ? -C / B : 0;
      } else {
        const disc = B * B - 4 * A * C;
        t = disc >= 0 ? (-B - Math.sqrt(disc)) / (2 * A) : 0;
      }
      t = Math.max(0, Math.min(1, t));
      return (1 - t) * (1 - t) * rootX + 2 * (1 - t) * t * bellyX + t * t * tipX;
    }

    // Unified Thrombus Cluster Generator (used both while forming in the valve pocket AND when pushed upward)
    function createClotStructure(side) {
      const cells = [];
      const numCells = 22;
      for (let i = 0; i < numCells; i++) {
        const progress = i / numCells; // 0 to 1: inner nucleus forms first, outer layer grows later
        const ringRadius = 3 + Math.sqrt(progress) * 19;
        const angle = i * 2.39996 + (side < 0 ? 0.3 : 1.1); // Golden angle spiral for natural clump
        // Slightly elongated vertically along the valve sinus pocket
        const dx = Math.cos(angle) * ringRadius * 0.85;
        const dy = Math.sin(angle) * ringRadius * 1.15;
        cells.push({
          threshold: progress * 92, // Appears when thrombusLevel >= threshold
          dx,
          dy,
          rx: (i % 4 === 0) ? 3.5 : 6.2 + (i % 3) * 1.1,
          ry: (i % 4 === 0) ? 3.5 : 4.2 + (i % 2) * 0.9,
          rot: (i * 1.17) % (Math.PI * 2),
          isPlatelet: i % 4 === 0
        });
      }
      return { side, cells };
    }

    let formingStructures = {
      left: createClotStructure(-1),
      right: createClotStructure(1)
    };

    // Helper: Get exact center (x, y) of a forming thrombus in the valve sinus pocket
    function getFormingClotPosition(side, level, contraction) {
      const pocketY = LOWER_VALVE_Y - 26;
      const hw = getVeinHalfWidthAtY(pocketY, contraction);
      // Starts nested in the sinus wall pocket and bulges slightly inward as it grows
      const inwardShift = 16 + (level / 100) * 10;
      const pocketX = CENTER_X + side * (hw - inwardShift);
      return { x: pocketX, y: pocketY };
    }

    // Helper: Get vein inner wall half-width at a given Y coordinate
    function getVeinHalfWidthAtY(y, contraction) {
      // Sinus bulges just above each valve (anatomical venous sinus pocket)
      let sinusBulge = 0;
      const distUpper = y - (UPPER_VALVE_Y - 18);
      if (Math.abs(distUpper) < 42) {
        sinusBulge += Math.cos((distUpper / 42) * (Math.PI / 2)) * 15;
      }
      const distLower = y - (LOWER_VALVE_Y - 18);
      if (Math.abs(distLower) < 42) {
        sinusBulge += Math.cos((distLower / 42) * (Math.PI / 2)) * 15;
      }

      // Calf muscle squeezes the middle segment between the two valves (and slightly beyond)
      let squeezeFactor = 0;
      if (y > 140 && y < 530) {
        const midY = (UPPER_VALVE_Y + LOWER_VALVE_Y) / 2;
        const normDist = (y - midY) / 185;
        if (Math.abs(normDist) < 1) {
          squeezeFactor = Math.cos(normDist * (Math.PI / 2)) * contraction * 29;
        }
      }

      return BASE_VEIN_HALF_WIDTH + sinusBulge - squeezeFactor;
    }

    // Helper: Enforce strict physical valve barriers and non-penetration of cusps
    function applyValveCollisions(p, prevY = p.y - p.vy) {
      const valves = [
        { y: UPPER_VALVE_Y, open: simState.upperValveOpen },
        { y: LOWER_VALVE_Y, open: simState.lowerValveOpen }
      ];

      for (let i = 0; i < valves.length; i++) {
        const v = valves[i];
        const vY = v.y;
        const open = v.open;
        const tipY = vY - 46;
        const hw = getVeinHalfWidthAtY(vY, simState.contractionAmount);
        const tipGap = open * (hw * 0.76);
        const isOpen = open > 0.08 && tipGap > (p.radius + 1);

        // 1. Upward crossing check at the valve tip plane (tipY):
        // Only applies to particles that were at/below tipY and are attempting to move above tipY
        if (prevY >= tipY - 0.5 && p.y <= tipY + p.radius) {
          if (!isOpen) {
            // Closed valve: completely blocks upward passage!
            p.y = tipY + p.radius + 0.5;
            if (p.vy < 0) p.vy = 0;
          } else {
            // Open valve: check if particle is outside the central tip gap
            const distCenter = Math.abs(p.x - CENTER_X);
            if (distCenter >= tipGap - p.radius * 0.5) {
              // Blocks particle against the leaflet tip and funnels it toward center
              p.y = tipY + p.radius + 0.5;
              if (p.vy < 0) p.vy = 0;
              p.x += (CENTER_X - p.x) * 0.12;
            }
          }
        }

        // 2. Downward landing / backflow on closed valve cusps (from above):
        if (prevY <= tipY + 0.5 && p.y >= tipY - p.radius && !isOpen) {
          const distCenter = Math.abs(p.x - CENTER_X);
          if (distCenter <= hw * 0.85) {
            p.y = tipY - p.radius - 0.5;
            if (p.vy > 0) p.vy = 0;
          }
        }

        // 3. Leaflet lateral confinement within the valve cusp height [tipY, vY]
        if (p.y >= tipY && p.y <= vY + p.radius) {
          const clampedY = Math.max(tipY, Math.min(vY, p.y));
          const leftLeafletX = getLeafletX(clampedY, vY, open, hw, -1);
          const rightLeafletX = getLeafletX(clampedY, vY, open, hw, 1);

          const inLeftPocket = p.x < leftLeafletX;
          const inRightPocket = p.x > rightLeafletX;

          if (inLeftPocket) {
            // In left sinus pocket (behind leaflet):
            // Cannot penetrate through leaflet into central lumen
            if (p.x > leftLeafletX - p.radius) {
              p.x = leftLeafletX - p.radius;
            }
            // Leaflet root stops downward fall:
            if (p.y > vY - p.radius - 1) {
              p.y = vY - p.radius - 1;
              if (p.vy > 0) p.vy = 0;
            }
          } else if (inRightPocket) {
            // In right sinus pocket:
            if (p.x < rightLeafletX + p.radius) {
              p.x = rightLeafletX + p.radius;
            }
            if (p.y > vY - p.radius - 1) {
              p.y = vY - p.radius - 1;
              if (p.vy > 0) p.vy = 0;
            }
          } else {
            // In central lumen (between leaflets):
            // Cannot penetrate through leaflets outward into pockets from between
            if (p.x < leftLeafletX + p.radius) {
              p.x = leftLeafletX + p.radius;
            }
            if (p.x > rightLeafletX - p.radius) {
              p.x = rightLeafletX - p.radius;
            }
          }
        }
      }
    }

    // Helper: Soft particle-particle stacking collision to form natural sediment piles in valve pockets & cusps
    function applyParticleParticleCollisions() {
      particles.sort((a, b) => a.y - b.y);

      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dy = p2.y - p1.y;
          if (dy > 18) break; // Beyond collision diameter

          const dx = p2.x - p1.x;
          const distSq = dx * dx + dy * dy;
          const minDist = p1.radius + p2.radius;

          if (distSq < minDist * minDist && distSq > 0.001) {
            const dist = Math.sqrt(distSq);
            const overlap = (minDist - dist) * 0.38;
            const nx = dx / dist;
            const ny = dy / dist;

            p1.x -= nx * overlap;
            p1.y -= ny * overlap;
            p2.x += nx * overlap;
            p2.y += ny * overlap;
          }
        }
      }
    }

    // Red Blood Cells & Platelets
    const particles = [];
    const NUM_PARTICLES = 145;

    function createParticle(randomY = true) {
      const isPlatelet = Math.random() < 0.16;
      const radius = isPlatelet ? 3.2 : 6.0 + Math.random() * 1.6;
      let y = randomY ? Math.random() * H : H + 10;

      // Avoid spawning directly overlapping the valve leaflets
      [UPPER_VALVE_Y, LOWER_VALVE_Y].forEach(vY => {
        if (y >= vY - 48 && y <= vY + 4) {
          if (Math.random() < 0.5) {
            y = vY - 52 - Math.random() * 12;
          } else {
            y = vY + 8 + Math.random() * 12;
          }
        }
      });

      const rNorm = (Math.random() - 0.5) * 1.62;
      const hw = getVeinHalfWidthAtY(y, 0);
      const x = CENTER_X + rNorm * (hw - radius - 6);

      return {
        xNorm: (x - CENTER_X) / hw,
        x,
        y,
        vx: 0,
        vy: 0.0, // stationary at start!
        radius,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.03,
        isPlatelet
      };
    }

    for (let i = 0; i < NUM_PARTICLES; i++) {
      particles.push(createParticle(true));
    }

    // Controls & Event Listeners
    function setContracting(active) {
      if (simState.mode === 'sedentary' && active) {
        // Switching to manual if user actively presses pump
        setMode('manual');
      }
      if (simState.isContracting && !active) {
        // Releasing contraction triggers ~0.95s of visible diastolic suction refill
        simState.relaxationTimer = 0.95;
      }
      if (active) {
        simState.relaxationTimer = 0;
      }
      simState.isContracting = active;
      if (active) {
        pumpBtn.classList.add('active');
      } else {
        pumpBtn.classList.remove('active');
      }
    }

    pumpBtn.addEventListener('mousedown', () => setContracting(true));
    window.addEventListener('mouseup', () => {
      if (simState.mode === 'manual') setContracting(false);
    });
    pumpBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      setContracting(true);
    });
    pumpBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (simState.mode === 'manual') setContracting(false);
    });

    // Click directly on canvas muscles to contract
    canvas.addEventListener('mousedown', () => setContracting(true));
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      setContracting(true);
    });
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (simState.mode === 'manual') setContracting(false);
    });

    // Spacebar support
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement.tagName !== 'SELECT') {
        e.preventDefault();
        setContracting(true);
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (simState.mode === 'manual') setContracting(false);
      }
    });

    function setMode(newMode) {
      simState.mode = newMode;
      modeBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === newMode);
      });
      if (newMode === 'manual') {
        modeLabel.textContent = '🖐️ 手動控制模式';
        simState.isContracting = false;
      } else if (newMode === 'walk') {
        modeLabel.textContent = '🚶 規律步行模式';
        simState.walkTimer = 0;
      } else if (newMode === 'sedentary') {
        modeLabel.textContent = '🪑 久坐不動模式 (高風險)';
        simState.isContracting = false;
      }
    }

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    fastForwardBtn.addEventListener('click', () => {
      setMode('sedentary');
      simState.stasisSeconds += 15;
      simState.thrombusLevel = Math.min(100, simState.thrombusLevel + 32);
      // Advance sedimentation so blood cells visibly pool into the valve sinus pockets
      for (let step = 0; step < 45; step++) {
        for (let p of particles) {
          p.y += p.isPlatelet ? 0.35 : 0.55;
          [UPPER_VALVE_Y, LOWER_VALVE_Y].forEach(vY => {
            const tipY = vY - 46;
            if (p.y >= tipY - 14 && p.y <= vY) {
              const side = p.x >= CENTER_X ? 1 : -1;
              p.x += side * 0.35;
            }
          });
          if (p.y > H - p.radius - 4) {
            p.y = H - p.radius - 4;
            p.vy = 0;
          }
          applyValveCollisions(p);
        }
        applyParticleParticleCollisions();
        for (let p of particles) applyValveCollisions(p);
      }
    });

    resetBtn.addEventListener('click', () => {
      simState.stasisSeconds = 0;
      simState.thrombusLevel = 0;
      simState.pushedClots = [];
      simState.peWarningTimer = 0;
      peToast.textContent = '';
      simState.bloodVelocityY = 0;
      simState.upperValveOpen = simState.valveHealth === 'incompetent' ? 0.42 : 0.0;
      simState.lowerValveOpen = simState.valveHealth === 'incompetent' ? 0.42 : 0.0;
    });

    valveHealthSelect.addEventListener('change', (e) => {
      simState.valveHealth = e.target.value;
    });

    // Physics Update Loop
    let lastTime = performance.now();

    function updateSimulation(dt) {
      // 1. Handle Auto Modes
      const wasContracting = simState.isContracting;
      if (simState.mode === 'walk') {
        simState.walkTimer += dt * 3.4;
        // Step cadence with natural contraction and refill periods
        simState.isContracting = Math.sin(simState.walkTimer) > 0.15;
        pumpBtn.classList.toggle('active', simState.isContracting);
      } else if (simState.mode === 'sedentary') {
        simState.isContracting = false;
        pumpBtn.classList.remove('active');
      }

      // Detect transition from contraction to relaxation -> trigger ~0.95s of visible diastolic refill
      if (wasContracting && !simState.isContracting) {
        simState.relaxationTimer = 0.95;
      }
      if (simState.isContracting) {
        simState.relaxationTimer = 0;
      }

      // 2. Muscle Contraction Interpolation
      const prevContraction = simState.contractionAmount;
      const targetContraction = simState.isContracting ? 1.0 : 0.0;
      const speed = simState.isContracting ? 7.5 : 4.5;
      simState.contractionAmount += (targetContraction - simState.contractionAmount) * Math.min(1, dt * speed);
      simState.contractionVelocity = (simState.contractionAmount - prevContraction) / Math.max(0.001, dt);

      // 3. Hemodynamics & Valve Mechanics
      const isIncompetent = simState.valveHealth === 'incompetent';
      const minValveClosure = isIncompetent ? 0.42 : 0.0; // Incompetent valves cannot fully close!

      const isContractingPhase = simState.isContracting || simState.contractionVelocity > 0.08;
      const isRelaxingPhase = !isContractingPhase && (simState.relaxationTimer > 0 || simState.contractionVelocity < -0.15);
      const isRestPhase = !isContractingPhase && !isRelaxingPhase;

      if (isContractingPhase) {
        // Active contraction: muscle squeezes intramuscular vein lumen, generating high upward pressure gradient
        const surge = Math.max(0, simState.contractionVelocity) * 4.6;
        const targetVy = -Math.min(7.2, 3.4 + surge);
        simState.bloodVelocityY += (targetVy - simState.bloodVelocityY) * Math.min(1, dt * 16);

        // Upper valve pushed wide open; Lower valve slammed firmly shut by retrograde intramuscular pressure
        simState.upperValveOpen += (0.95 - simState.upperValveOpen) * Math.min(1, dt * 16);
        simState.lowerValveOpen += (minValveClosure - simState.lowerValveOpen) * Math.min(1, dt * 20);

        // If a visible thrombus has formed in the pocket, muscle contraction squeezes and pushes THAT EXACT thrombus upward!
        if (simState.thrombusLevel >= 8) {
          pushFormedThrombusUpward();
        }
      } else if (isRelaxingPhase) {
        if (simState.relaxationTimer > 0) {
          simState.relaxationTimer -= dt;
        }

        // Active relaxation / diastolic refilling:
        if (isIncompetent) {
          // Faulty upper valve allows gravity backflow downward
          simState.bloodVelocityY += (2.2 - simState.bloodVelocityY) * Math.min(1, dt * 10);
          simState.upperValveOpen += (0.42 - simState.upperValveOpen) * Math.min(1, dt * 12);
          simState.lowerValveOpen += (0.80 - simState.lowerValveOpen) * Math.min(1, dt * 12);
        } else {
          // Normal:
          // 1. Upper valve snaps firmly shut (< 0.1s) to prevent proximal blood column from dropping
          simState.upperValveOpen += (0.0 - simState.upperValveOpen) * Math.min(1, dt * 22);

          // 2. Negative suction draws lower valve wide open to refill mid segment from foot!
          const refillRatio = Math.max(0, simState.relaxationTimer / 0.95);
          const targetLower = refillRatio > 0.18 ? 0.85 : (refillRatio / 0.18) * 0.85;
          simState.lowerValveOpen += (targetLower - simState.lowerValveOpen) * Math.min(1, dt * 14);

          // 3. Suction upward velocity
          simState.bloodVelocityY += (-2.6 - simState.bloodVelocityY) * Math.min(1, dt * 12);
        }
      } else {
        // Stationary / Rest (靜止不動):
        if (isIncompetent) {
          // Valves cannot close; gravity causes backflow downward
          simState.bloodVelocityY += (1.2 - simState.bloodVelocityY) * Math.min(1, dt * 4);
          simState.upperValveOpen += (0.42 - simState.upperValveOpen) * Math.min(1, dt * 6);
          simState.lowerValveOpen += (0.42 - simState.lowerValveOpen) * Math.min(1, dt * 6);
        } else {
          // Healthy valves when stationary:
          // Hydrostatic gravity column holds both valves firmly SHUT!
          // No flow across valves (bloodVelocityY -> 0)
          simState.bloodVelocityY += (0.0 - simState.bloodVelocityY) * Math.min(1, dt * 10);
          simState.upperValveOpen += (0.0 - simState.upperValveOpen) * Math.min(1, dt * 14);
          simState.lowerValveOpen += (0.0 - simState.lowerValveOpen) * Math.min(1, dt * 14);
          if (Math.abs(simState.bloodVelocityY) < 0.01) simState.bloodVelocityY = 0;
          if (simState.upperValveOpen < 0.01) simState.upperValveOpen = 0;
          if (simState.lowerValveOpen < 0.01) simState.lowerValveOpen = 0;
        }
      }

      // 4. Stasis Timer & Thrombus Formation (Virchow's Triad)
      if (Math.abs(simState.contractionVelocity) > 0.4 || simState.isContracting) {
        // Active muscle contraction resets stasis timer
        simState.stasisSeconds = Math.max(0, simState.stasisSeconds - dt * 8.0);
        if (simState.thrombusLevel >= 8 && simState.contractionAmount > 0.25) {
          pushFormedThrombusUpward();
        } else if (simState.thrombusLevel > 0 && simState.thrombusLevel < 8) {
          simState.thrombusLevel = Math.max(0, simState.thrombusLevel - dt * 12);
        }
      } else {
        // No muscle movement -> blood pools in valve pockets
        const stasisRate = simState.mode === 'sedentary' ? 1.8 : 1.0;
        simState.stasisSeconds += dt * stasisRate;

        // After 3 seconds of stasis, coagulation cascade visibly begins in the valve sinus pocket
        if (simState.stasisSeconds > 3.0) {
          const growthRate = (simState.stasisSeconds > 12 ? 5.5 : 3.4) * stasisRate;
          simState.thrombusLevel = Math.min(100, simState.thrombusLevel + dt * growthRate);
        }
      }

      // 5. Update Blood Particles
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const prevY = p.y;
        const halfW = getVeinHalfWidthAtY(p.y, simState.contractionAmount);

        // Check if particle is inside a valve sinus pocket
        const inLowerSinus = (p.y > LOWER_VALVE_Y - 48 && p.y <= LOWER_VALVE_Y - 2 && Math.abs(p.x - CENTER_X) > 24);
        const inUpperSinus = (p.y > UPPER_VALVE_Y - 48 && p.y <= UPPER_VALVE_Y - 2 && Math.abs(p.x - CENTER_X) > 24);

        if (isRestPhase) {
          if (isIncompetent) {
            // Incompetent valves: gravity reflux down through gap
            const normDist = (p.x - CENTER_X) / Math.max(1, halfW);
            const radialProfile = 1.15 - 0.45 * (normDist * normDist);
            const localVy = 1.1 * radialProfile;
            p.vy += (localVy - p.vy) * 0.25;
          } else {
            // Normal healthy valves when stationary:
            // Gravitational sedimentation of blood cells down towards the valves & sinus pockets!
            const sedimentVy = p.isPlatelet ? 0.30 : 0.45;
            p.vy += (sedimentVy - p.vy) * 0.15;

            // When hovering near the closed valve tip ridge, slide outward down the concave cusp into the sinus pocket:
            [UPPER_VALVE_Y, LOWER_VALVE_Y].forEach(vY => {
              const tipY = vY - 46;
              if (p.y >= tipY - 14 && p.y <= vY) {
                const side = p.x >= CENTER_X ? 1 : -1;
                // Outward gravitational slide down the curved leaflet into the pocket
                p.x += side * 0.22;
              }
            });

            // If in pocket, gentle stasis settling
            if (inLowerSinus || inUpperSinus) {
              const sinusCenterY = inLowerSinus ? LOWER_VALVE_Y - 24 : UPPER_VALVE_Y - 24;
              const side = p.x > CENTER_X ? 1 : -1;
              const dy = p.y - sinusCenterY;
              p.x += (-dy * 0.008 * side);
              if (inLowerSinus && simState.thrombusLevel > 2) {
                const targetX = CENTER_X + side * (halfW - 20);
                p.x += (targetX - p.x) * 0.02;
              }
            }
          }
        } else {
          // Actively pumping, relaxing, or walking:
          const normDist = (p.x - CENTER_X) / Math.max(1, halfW);
          const radialProfile = 1.20 - 0.45 * (normDist * normDist);
          let localVy = simState.bloodVelocityY * radialProfile;

          if (isContractingPhase) {
            // Contraction: middle chamber & pockets squeezed upward with great force
            if (p.y <= LOWER_VALVE_Y - 8) {
              localVy = simState.bloodVelocityY * radialProfile;
              // Gentle streamline funneling toward the open upper valve center
              if (p.y > UPPER_VALVE_Y - 46 && p.y < UPPER_VALVE_Y) {
                p.x += (CENTER_X - p.x) * 0.08;
              }
            } else {
              localVy = 0; // below closed lower valve: held in place
            }
          } else if (isRelaxingPhase) {
            // Relaxation / Diastolic refill:
            if (p.y > UPPER_VALVE_Y - 46) {
              // Distal and mid chamber sucked upward through open lower valve
              localVy = simState.bloodVelocityY * radialProfile;
              if (p.y > LOWER_VALVE_Y - 46 && p.y < LOWER_VALVE_Y + 40) {
                p.x += (CENTER_X - p.x) * 0.08; // funnel into open lower valve
              }
            } else {
              localVy = 0; // upper valve closed: blood column above is held
            }
          }

          p.vy += (localVy - p.vy) * 0.35;
        }

        p.y += p.vy;

        // Bottom boundary of the vein (foot microvasculature reservoir)
        if (p.y > H - p.radius - 4) {
          p.y = H - p.radius - 4;
          if (p.vy > 0) p.vy = 0;
        }

        // Apply strict valve & leaflet boundaries (passing through when open, blocked when closed)
        applyValveCollisions(p, prevY);

        // Constrain within vein walls
        const currentHw = getVeinHalfWidthAtY(p.y, simState.contractionAmount);
        const maxDist = currentHw - p.radius - 3;
        const distFromCenter = p.x - CENTER_X;
        if (Math.abs(distFromCenter) > maxDist) {
          p.x = CENTER_X + Math.sign(distFromCenter) * maxDist;
        }
        p.xNorm = (p.x - CENTER_X) / Math.max(1, currentHw);

        p.angle += p.spin + Math.abs(p.vy) * 0.02;

        // Wrap around top/bottom ONLY when blood is actively pumped or leaking
        if (p.y < -15) {
          if (simState.bloodVelocityY < -0.5) {
            p.y = H + 12;
            const newHw = getVeinHalfWidthAtY(p.y, 0);
            p.x = CENTER_X + (Math.random() - 0.5) * 1.5 * (newHw - p.radius - 6);
            p.xNorm = (p.x - CENTER_X) / newHw;
            p.vy = simState.bloodVelocityY;
          } else {
            p.y = -14;
            p.vy = 0;
          }
        } else if (p.y > H + 18) {
          if (simState.bloodVelocityY > 0.5 && isIncompetent) {
            p.y = -10;
            const newHw = getVeinHalfWidthAtY(p.y, 0);
            p.x = CENTER_X + (Math.random() - 0.5) * 1.5 * (newHw - p.radius - 6);
            p.xNorm = (p.x - CENTER_X) / newHw;
            p.vy = simState.bloodVelocityY;
          } else {
            p.y = H + 16;
            p.vy = 0;
          }
        }
      }

      // Soft stacking collision between particles: ONLY during resting sedimentation
      // (During high-speed jet flow, fluid stream keeps cells aligned smoothly without artificial popping)
      if (isRestPhase || Math.abs(simState.bloodVelocityY) < 0.6) {
        applyParticleParticleCollisions();
        for (let i = 0; i < particles.length; i++) {
          applyValveCollisions(particles[i], particles[i].y - particles[i].vy);
        }
      }

      // 6. Update Pushed Thrombi (the exact clots formed in the pocket now pushed upward by muscle contraction)
      for (let i = simState.pushedClots.length - 1; i >= 0; i--) {
        const clot = simState.pushedClots[i];
        const targetVy = simState.bloodVelocityY < -1.0
          ? Math.min(-3.6, simState.bloodVelocityY * 0.95)
          : -2.6;
        clot.vy += (targetVy - clot.vy) * 0.18;
        clot.y += clot.vy;

        const currentHw = getVeinHalfWidthAtY(clot.y, simState.contractionAmount);
        const channelOffset = clot.side * Math.min(18, currentHw * 0.32);
        const targetX = CENTER_X + channelOffset;
        clot.x += (targetX - clot.x) * 0.08;
        clot.angle += clot.side * 0.025;

        if (Math.abs(clot.y - UPPER_VALVE_Y) < 32) {
          simState.upperValveOpen = Math.max(simState.upperValveOpen, 0.85);
        }

        if (clot.y < -55) {
          simState.pushedClots.splice(i, 1);
        }
      }

      if (simState.peWarningTimer > 0) {
        simState.peWarningTimer -= dt;
        if (simState.peWarningTimer <= 0) {
          peToast.textContent = '';
        }
      }

      updateUI();
    }

    // Detach the exact thrombus formed in the valve pocket and push it upward from its exact (x, y) position
    function pushFormedThrombusUpward() {
      const levelToPush = simState.thrombusLevel;
      if (levelToPush < 8) return;

      [-1, 1].forEach(side => {
        const pos = getFormingClotPosition(side, levelToPush, simState.contractionAmount);
        const struct = side < 0 ? formingStructures.left : formingStructures.right;
        simState.pushedClots.push({
          x: pos.x,
          y: pos.y,
          vy: -3.2,
          side,
          level: levelToPush,
          structure: struct,
          angle: 0
        });
      });

      // Reset formation site now that the thrombus has been pushed upward out of the pocket
      simState.thrombusLevel = 0;
      simState.stasisSeconds = 0;
      formingStructures = {
        left: createClotStructure(-1),
        right: createClotStructure(1)
      };

      simState.peWarningTimer = 4.5;
      if (levelToPush >= 38) {
        peToast.textContent = '🚨 肌肉收縮將形成的深部血栓 (DVT) 推向上方！隨血流衝向心肺可能引發肺栓塞！';
      } else {
        peToast.textContent = '⬆️ 肌肉收縮擠壓，將瓣膜袋內剛凝集的血栓團塊直接往上推走！';
      }
    }

    // Update UI Status
    function updateUI() {
      // Dynamic live valve states, chamber pressures, and flow hemodynamics
      // are rendered directly onto the anatomical canvas in real time.
    }

    // Drawing Functions
    function drawSkeletalMuscles() {
      const c = simState.contractionAmount;
      // Left and Right Gastrocnemius / Soleus Muscle Bellies flanking the vein
      const topY = 125;
      const bottomY = 545;
      const midY = (topY + bottomY) / 2;

      [-1, 1].forEach(side => {
        ctx.save();
        // Outer & inner boundaries of the muscle belly
        const innerWallMidX = CENTER_X + side * (getVeinHalfWidthAtY(midY, c) + 12);
        const outerWallMidX = CENTER_X + side * (225 - c * 10);
        const tendonX = CENTER_X + side * 125;

        const grad = ctx.createLinearGradient(
          CENTER_X + side * 60, midY,
          CENTER_X + side * 230, midY
        );
        // Brighter, firmer crimson when contracting
        if (c > 0.3) {
          grad.addColorStop(0, '#e11d48');
          grad.addColorStop(0.5, '#be123c');
          grad.addColorStop(1, '#881337');
        } else {
          grad.addColorStop(0, '#9f1239');
          grad.addColorStop(0.5, '#881337');
          grad.addColorStop(1, '#4c0519');
        }

        ctx.fillStyle = grad;
        ctx.strokeStyle = c > 0.3 ? '#fda4af' : '#f43f5e';
        ctx.lineWidth = 2.5;

        ctx.beginPath();
        // Top attachment
        ctx.moveTo(tendonX, topY);
        // Inner edge pressing against the deep vein
        ctx.bezierCurveTo(
          innerWallMidX, topY + 90,
          innerWallMidX, bottomY - 90,
          tendonX, bottomY
        );
        // Outer edge bulging out
        ctx.bezierCurveTo(
          outerWallMidX, bottomY - 75,
          outerWallMidX, topY + 75,
          tendonX, topY
        );
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Draw striated muscle fiber lines
        ctx.strokeStyle = 'rgba(255, 228, 230, 0.22)';
        ctx.lineWidth = 1.5;
        for (let i = 1; i <= 5; i++) {
          const t = i / 6;
          const fiberMidX = innerWallMidX * (1 - t) + outerWallMidX * t;
          ctx.beginPath();
          ctx.moveTo(tendonX, topY + 12);
          ctx.quadraticCurveTo(fiberMidX, midY, tendonX, bottomY - 12);
          ctx.stroke();
        }

        // Draw force arrows when contracting
        if (c > 0.15) {
          ctx.fillStyle = '#fef08a';
          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 2.5;
          const arrowYList = [midY - 70, midY, midY + 70];
          arrowYList.forEach(ay => {
            const startX = CENTER_X + side * 175;
            const endX = innerWallMidX + side * 12;
            ctx.beginPath();
            ctx.moveTo(startX, ay);
            ctx.lineTo(endX, ay);
            ctx.stroke();

            // Arrowhead pointing inward toward the vein
            ctx.beginPath();
            ctx.moveTo(endX, ay);
            ctx.lineTo(endX + side * 10, ay - 6);
            ctx.lineTo(endX + side * 10, ay + 6);
            ctx.closePath();
            ctx.fill();
          });
        }

        // Muscle Label (fixed X position so text does not jitter during contraction)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        const labelX = CENTER_X + side * 148;
        ctx.fillText('小腿骨骼肌', labelX, midY - 8);
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#fecdd3';
        ctx.fillText(c > 0.3 ? '(收縮擠壓!)' : '(腓腸肌/比目魚肌)', labelX, midY + 10);

        ctx.restore();
      });
    }

    function drawVeinLumenAndWalls() {
      const c = simState.contractionAmount;

      // Build left and right wall paths
      ctx.save();
      ctx.beginPath();
      for (let y = 0; y <= H; y += 6) {
        const hw = getVeinHalfWidthAtY(y, c);
        if (y === 0) ctx.moveTo(CENTER_X - hw, y);
        else ctx.lineTo(CENTER_X - hw, y);
      }
      for (let y = H; y >= 0; y -= 6) {
        const hw = getVeinHalfWidthAtY(y, c);
        ctx.lineTo(CENTER_X + hw, y);
      }
      ctx.closePath();

      // Dark venous blood background gradient
      const lumenGrad = ctx.createLinearGradient(CENTER_X - 80, 0, CENTER_X + 80, 0);
      lumenGrad.addColorStop(0, '#1e0b16');
      lumenGrad.addColorStop(0.5, '#3b0a1e');
      lumenGrad.addColorStop(1, '#1e0b16');
      ctx.fillStyle = lumenGrad;
      ctx.fill();

      // Draw Vein Tunica Wall (Blue-ish venous endothelium & wall)
      [-1, 1].forEach(side => {
        ctx.beginPath();
        for (let y = 0; y <= H; y += 5) {
          const hw = getVeinHalfWidthAtY(y, c);
          const x = CENTER_X + side * hw;
          if (y === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 7;
        ctx.stroke();

        ctx.strokeStyle = '#bae6fd';
        ctx.lineWidth = 2;
        ctx.stroke();
      });
      ctx.restore();
    }

    function drawStasisVortexIndicators() {
      if (simState.stasisSeconds < 3.5) return;
      const alpha = Math.min(0.65, (simState.stasisSeconds - 3.5) / 10);

      ctx.save();
      ctx.strokeStyle = `rgba(251, 191, 36, ${alpha})`;
      ctx.lineWidth = 1.6;
      ctx.setLineDash([4, 4]);

      const time = performance.now() * 0.002;
      [UPPER_VALVE_Y, LOWER_VALVE_Y].forEach(vy => {
        [-1, 1].forEach(side => {
          const hw = getVeinHalfWidthAtY(vy - 24, simState.contractionAmount);
          const cx = CENTER_X + side * (hw - 18);
          const cy = vy - 24;

          ctx.beginPath();
          ctx.arc(cx, cy, 14, time * side, time * side + Math.PI * 1.4);
          ctx.stroke();
        });
      });
      ctx.restore();
    }

    // Unified renderer used for BOTH a thrombus forming in the valve pocket AND the same thrombus pushed upward
    function drawUnifiedClotCluster(x, y, level, structure, angle) {
      const activeCells = structure.cells.filter(cell => level >= cell.threshold);
      if (activeCells.length === 0) return;

      const clusterRadius = 8 + (level / 100) * 18;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // 1. Coagulated Thrombus Matrix Background (makes the growing clot clearly visible)
      const bgGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, clusterRadius + 4);
      bgGrad.addColorStop(0, 'rgba(127, 29, 29, 0.92)');
      bgGrad.addColorStop(0.75, 'rgba(69, 10, 10, 0.82)');
      bgGrad.addColorStop(1, 'rgba(69, 10, 10, 0)');
      ctx.fillStyle = bgGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, clusterRadius * 0.92, clusterRadius * 1.15, 0, 0, Math.PI * 2);
      ctx.fill();

      // 2. Trapped Clotted Red Blood Cells & Activated Platelets inside the thrombus
      activeCells.forEach(cell => {
        ctx.save();
        ctx.translate(cell.dx, cell.dy);
        ctx.rotate(cell.rot);
        ctx.beginPath();
        if (cell.isPlatelet) {
          ctx.arc(0, 0, cell.rx, 0, Math.PI * 2);
          ctx.fillStyle = '#fde047';
          ctx.strokeStyle = '#ca8a04';
        } else {
          ctx.ellipse(0, 0, cell.rx, cell.ry, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#991b1b';
          ctx.strokeStyle = '#f87171';
        }
        ctx.lineWidth = 1.2;
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      // 3. Criss-crossing Fibrin Mesh Web (灰白色纖維蛋白絲纏繞血球)
      ctx.strokeStyle = 'rgba(241, 245, 249, 0.85)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let i = 0; i < activeCells.length; i++) {
        const a = activeCells[i];
        const b = activeCells[(i + 1) % activeCells.length];
        ctx.moveTo(a.dx, a.dy);
        ctx.lineTo(b.dx, b.dy);
        if (i + 3 < activeCells.length) {
          const c = activeCells[i + 3];
          ctx.moveTo(a.dx, a.dy);
          ctx.lineTo(c.dx, c.dy);
        }
      }
      ctx.stroke();

      // 4. Outer Fibrin Capsule / Highlight Ring
      ctx.strokeStyle = level >= 38 ? 'rgba(248, 113, 113, 0.9)' : 'rgba(253, 224, 71, 0.75)';
      ctx.lineWidth = 1.8;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.ellipse(0, 0, clusterRadius * 0.85, clusterRadius * 1.05, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    function drawFormingThrombi() {
      if (simState.thrombusLevel < 2) return;

      const level = simState.thrombusLevel;
      const leftPos = getFormingClotPosition(-1, level, simState.contractionAmount);
      const rightPos = getFormingClotPosition(1, level, simState.contractionAmount);

      drawUnifiedClotCluster(leftPos.x, leftPos.y, level, formingStructures.left, 0);
      drawUnifiedClotCluster(rightPos.x, rightPos.y, level, formingStructures.right, 0);
    }

    function drawPushedThrombi() {
      if (simState.pushedClots.length === 0) return;

      simState.pushedClots.forEach(clot => {
        // Draw the exact same thrombus cluster moving upward with blood flow
        drawUnifiedClotCluster(clot.x, clot.y, clot.level, clot.structure, clot.angle);
      });
    }

    function drawChamberIndicators() {
      const isContracting = simState.isContracting || simState.contractionVelocity > 0.08;
      const isRelaxing = simState.relaxationTimer > 0;
      const midY = (UPPER_VALVE_Y + LOWER_VALVE_Y - 46) / 2; // ~312

      ctx.save();
      if (isContracting) {
        // High pressure chamber glow inside vein lumen
        const hw = getVeinHalfWidthAtY(midY, simState.contractionAmount);
        const glow = ctx.createRadialGradient(CENTER_X, midY, 10, CENTER_X, midY, hw + 10);
        glow.addColorStop(0, 'rgba(239, 68, 68, 0.22)');
        glow.addColorStop(1, 'rgba(239, 68, 68, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(CENTER_X - hw - 10, midY - 60, (hw + 10) * 2, 120);
      } else if (isRelaxing) {
        // Suction chamber glow inside vein lumen
        const hw = getVeinHalfWidthAtY(midY, simState.contractionAmount);
        const glow = ctx.createRadialGradient(CENTER_X, midY, 10, CENTER_X, midY, hw + 10);
        glow.addColorStop(0, 'rgba(56, 189, 248, 0.22)');
        glow.addColorStop(1, 'rgba(56, 189, 248, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(CENTER_X - hw - 10, midY - 60, (hw + 10) * 2, 120);
      }
      ctx.restore();
    }

    function drawLowerValveMechanics() {
      const isContracting = simState.isContracting || simState.contractionVelocity > 0.08;
      const isRelaxing = simState.relaxationTimer > 0;
      const hw = getVeinHalfWidthAtY(LOWER_VALVE_Y, simState.contractionAmount);

      ctx.save();
      if (isContracting) {
        // Downward retrograde backpressure vectors filling the lower valve sinus cusps
        const time = performance.now() * 0.005;
        const pulse = 0.75 + 0.25 * Math.sin(time);

        ctx.strokeStyle = `rgba(248, 113, 113, ${0.9 * pulse})`;
        ctx.fillStyle = `rgba(248, 113, 113, ${0.9 * pulse})`;
        ctx.lineWidth = 2.5;

        // Left cusp pressure arrow
        ctx.beginPath();
        ctx.moveTo(CENTER_X - 10, LOWER_VALVE_Y - 44);
        ctx.quadraticCurveTo(CENTER_X - 25, LOWER_VALVE_Y - 30, CENTER_X - (hw * 0.48), LOWER_VALVE_Y - 18);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(CENTER_X - (hw * 0.48), LOWER_VALVE_Y - 18);
        ctx.lineTo(CENTER_X - (hw * 0.48) + 8, LOWER_VALVE_Y - 24);
        ctx.lineTo(CENTER_X - (hw * 0.48) + 2, LOWER_VALVE_Y - 28);
        ctx.closePath();
        ctx.fill();

        // Right cusp pressure arrow
        ctx.beginPath();
        ctx.moveTo(CENTER_X + 10, LOWER_VALVE_Y - 44);
        ctx.quadraticCurveTo(CENTER_X + 25, LOWER_VALVE_Y - 30, CENTER_X + (hw * 0.48), LOWER_VALVE_Y - 18);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(CENTER_X + (hw * 0.48), LOWER_VALVE_Y - 18);
        ctx.lineTo(CENTER_X + (hw * 0.48) - 8, LOWER_VALVE_Y - 24);
        ctx.lineTo(CENTER_X + (hw * 0.48) - 2, LOWER_VALVE_Y - 28);
        ctx.closePath();
        ctx.fill();

      } else if (isRelaxing) {
        // Upward suction flow arrows through open lower valve
        const time = performance.now() * 0.006;
        const pulse = 0.8 + 0.2 * Math.sin(time);

        ctx.strokeStyle = `rgba(56, 189, 248, ${0.95 * pulse})`;
        ctx.fillStyle = `rgba(56, 189, 248, ${0.95 * pulse})`;
        ctx.lineWidth = 2.5;

        [-12, 12].forEach(offset => {
          ctx.beginPath();
          ctx.moveTo(CENTER_X + offset, LOWER_VALVE_Y + 22);
          ctx.lineTo(CENTER_X + offset * 0.6, LOWER_VALVE_Y - 40);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(CENTER_X + offset * 0.6, LOWER_VALVE_Y - 46);
          ctx.lineTo(CENTER_X + offset * 0.6 - 5, LOWER_VALVE_Y - 36);
          ctx.lineTo(CENTER_X + offset * 0.6 + 5, LOWER_VALVE_Y - 36);
          ctx.closePath();
          ctx.fill();
        });
      }
      ctx.restore();
    }

    function drawVenousValves() {
      const c = simState.contractionAmount;
      const isIncompetent = simState.valveHealth === 'incompetent';

      const valves = [
        { y: UPPER_VALVE_Y, open: simState.upperValveOpen, name: '近心端靜脈瓣膜' },
        { y: LOWER_VALVE_Y, open: simState.lowerValveOpen, name: '遠心端靜脈瓣膜' }
      ];

      valves.forEach(v => {
        const hw = getVeinHalfWidthAtY(v.y, c);
        const tipGap = v.open * (hw * 0.76);
        const leafletHeight = 46;
        const tipY = v.y - leafletHeight;

        [-1, 1].forEach(side => {
          const rootX = CENTER_X + side * hw;
          const rootY = v.y;
          const tipX = CENTER_X + side * tipGap;

          const bellyX = CENTER_X + side * (hw * 0.55);
          const bellyY = v.y - leafletHeight * (0.12 + v.open * 0.38);

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(rootX, rootY);
          ctx.quadraticCurveTo(bellyX, bellyY, tipX, tipY);

          ctx.strokeStyle = isIncompetent ? '#fca5a5' : '#f8fafc';
          ctx.lineWidth = 5;
          ctx.lineCap = 'round';
          ctx.stroke();

          // Subtle sinus pocket shading behind leaflet
          ctx.lineTo(rootX, v.y - leafletHeight * 0.75);
          ctx.closePath();
          ctx.fillStyle = 'rgba(148, 163, 184, 0.14)';
          ctx.fill();
          ctx.restore();
        });

        // Clean static anatomical labels on the sides
        const baseHw = getVeinHalfWidthAtY(v.y, 0);
        ctx.save();
        ctx.font = 'bold 12px sans-serif';
        ctx.fillStyle = '#e2e8f0';
        ctx.textAlign = 'left';
        ctx.fillText(v.name, CENTER_X + baseHw + 14, v.y - 4);
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('瓣膜竇 (易滯留處)', CENTER_X - baseHw - 104, v.y - 22);
        ctx.restore();
      });
    }

    function drawBloodParticles() {
      ctx.save();
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        if (p.isPlatelet) {
          // Small yellow-white spiky platelet
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Biconcave Red Blood Cell (RBC)
          ctx.fillStyle = '#ef4444';
          ctx.strokeStyle = '#b91c1c';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.radius, p.radius * 0.68, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Inner dimple of biconcave disc
          ctx.fillStyle = '#991b1b';
          ctx.beginPath();
          ctx.ellipse(0, 0, p.radius * 0.45, p.radius * 0.28, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      ctx.restore();
    }

    function drawCentralFlowArrows() {
      const isContracting = simState.isContracting || simState.contractionVelocity > 0.08;
      const isRelaxing = simState.relaxationTimer > 0;
      const isIncompetent = simState.valveHealth === 'incompetent';

      if (!isContracting && !isRelaxing && !isIncompetent) return;

      ctx.save();
      if (isContracting) {
        // Upward flow in mid chamber and through upper valve into heart
        const arrowColor = 'rgba(74, 222, 128, 0.45)';
        ctx.strokeStyle = arrowColor;
        ctx.fillStyle = arrowColor;
        ctx.lineWidth = 3;

        // Above upper valve (y=110) & in mid chamber (y=280)
        [110, 280].forEach(y => {
          ctx.beginPath();
          ctx.moveTo(CENTER_X, y + 16);
          ctx.lineTo(CENTER_X, y - 16);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(CENTER_X, y - 24);
          ctx.lineTo(CENTER_X - 7, y - 12);
          ctx.lineTo(CENTER_X + 7, y - 12);
          ctx.closePath();
          ctx.fill();
        });
      } else if (isRelaxing) {
        // Suction upward flow through open lower valve into mid chamber
        const arrowColor = 'rgba(56, 189, 248, 0.55)';
        ctx.strokeStyle = arrowColor;
        ctx.fillStyle = arrowColor;
        ctx.lineWidth = 3;

        // In mid chamber (y=360) & distal chamber (y=530)
        [360, 530].forEach(y => {
          ctx.beginPath();
          ctx.moveTo(CENTER_X, y + 16);
          ctx.lineTo(CENTER_X, y - 16);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(CENTER_X, y - 24);
          ctx.lineTo(CENTER_X - 7, y - 12);
          ctx.lineTo(CENTER_X + 7, y - 12);
          ctx.closePath();
          ctx.fill();
        });
      } else if (isIncompetent) {
        // Downward reflux arrows
        const arrowColor = 'rgba(248, 113, 113, 0.45)';
        ctx.strokeStyle = arrowColor;
        ctx.fillStyle = arrowColor;
        ctx.lineWidth = 3;

        [120, 360, 540].forEach(y => {
          ctx.beginPath();
          ctx.moveTo(CENTER_X, y - 16);
          ctx.lineTo(CENTER_X, y + 16);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(CENTER_X, y + 24);
          ctx.lineTo(CENTER_X - 7, y + 12);
          ctx.lineTo(CENTER_X + 7, y + 12);
          ctx.closePath();
          ctx.fill();
        });
      }
      ctx.restore();
    }

    function render(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      updateSimulation(dt);

      ctx.clearRect(0, 0, W, H);

      drawSkeletalMuscles();
      drawVeinLumenAndWalls();
      drawChamberIndicators();
      drawCentralFlowArrows();
      drawLowerValveMechanics();
      drawStasisVortexIndicators();
      drawBloodParticles();
      drawVenousValves();
      drawFormingThrombi();
      drawPushedThrombi();

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
