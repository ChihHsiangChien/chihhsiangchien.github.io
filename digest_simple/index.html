<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三大營養素的消化模擬器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Microsoft JhengHei';
            margin: 0;
            padding: 15px;
            background-color: #f1f5f9;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            max-width: 1180px;
            width: 100%;
            margin-bottom: 12px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            color: #0f172a;
            font-size: 1.65rem;
            text-align: center;
        }

        .concept-box {
            background: #ffffff;
            border-left: 5px solid #2563eb;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .main-container {
            display: flex;
            gap: 16px;
            max-width: 1180px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #cbd5e1;
            background: #fff;
        }

        canvas {
            display: block;
        }

        .sidebar {
            flex: 1;
            min-width: 340px;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel {
            background: white;
            padding: 12px 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .panel h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pathway-group {
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
        }

        .group-carb {
            background-color: #f5f3ff;
            border-color: #ddd6fe;
        }

        .group-prot {
            background-color: #fff1f2;
            border-color: #fecdd3;
        }

        .group-lipid {
            background-color: #fefce8;
            border-color: #fef08a;
        }

        .group-title {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 7px 8px;
            border: none;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-carb {
            background: #ede9fe;
            color: #5b21b6;
            border: 1px solid #c4b5fd;
        }

        .btn-carb:hover {
            background: #ddd6fe;
        }

        .btn-carb-enz {
            background: #7c3aed;
            color: white;
        }

        .btn-carb-enz:hover {
            background: #6d28d9;
        }

        .btn-prot {
            background: #ffe4e6;
            color: #9f1239;
            border: 1px solid #fda4af;
        }

        .btn-prot:hover {
            background: #fecdd3;
        }

        .btn-prot-enz {
            background: #e11d48;
            color: white;
        }

        .btn-prot-enz:hover {
            background: #be123c;
        }

        .btn-lipid {
            background: #fef9c3;
            color: #854d0e;
            border: 1px solid #fde047;
        }

        .btn-lipid:hover {
            background: #fef08a;
        }

        .btn-lipid-enz {
            background: #d97706;
            color: white;
        }

        .btn-lipid-enz:hover {
            background: #b45309;
        }

        .btn-reset {
            width: 100%;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            margin-top: 4px;
            padding: 8px;
        }

        .btn-reset:hover {
            background: #e2e8f0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .stat-card {
            background: #f8fafc;
            padding: 6px 8px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .stat-card.wide {
            grid-column: span 3;
            background: #ecfdf5;
            border-color: #a7f3d0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px;
        }

        .stat-num {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .legend-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .legend-table th,
        .legend-table td {
            padding: 5px 4px;
            border-bottom: 1px solid #f1f5f9;
            text-align: left;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .status-toast {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.88);
            color: white;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            pointer-events: none;
            transition: opacity 0.3s;
            white-space: nowrap;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>三大營養素的消化模擬器</h1>

    </div>

    <div class="main-container">
        <div class="canvas-wrapper">
            <canvas id="simCanvas" width="730" height="550"></canvas>
            <div id="toast" class="status-toast"></div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h3>營養素投入與專一性酵素分泌</h3>

                <!-- 醣類路徑 -->
                <div class="pathway-group group-carb">
                    <div class="group-title" style="color:#5b21b6;">
                        <span>醣類消化：澱粉 ➔ 麥芽糖 ➔ 葡萄糖</span>
                    </div>
                    <div class="btn-row">
                        <button class="btn-carb" onclick="spawnStarch(1)">投入澱粉</button>
                        <button class="btn-carb-enz" onclick="secreteEnzyme('amylase', 2)">分泌澱粉酶</button>
                        <button class="btn-carb-enz" style="background:#059669;"
                            onclick="secreteEnzyme('maltase', 2)">分泌麥芽糖酶</button>
                    </div>
                </div>

                <!-- 蛋白質路徑 -->
                <div class="pathway-group group-prot">
                    <div class="group-title" style="color:#9f1239;">
                        <span>蛋白質消化：蛋白質 ➔ 多肽 ➔ 胺基酸</span>
                    </div>
                    <div class="btn-row">
                        <button class="btn-prot" onclick="spawnProtein(1)">投入蛋白質</button>
                        <button class="btn-prot-enz" onclick="secreteEnzyme('protease', 2)">分泌蛋白酶</button>
                        <button class="btn-prot-enz" style="background:#db2777;"
                            onclick="secreteEnzyme('peptidase', 2)">分泌肽酶</button>
                    </div>
                </div>

                <!-- 脂質路徑 -->
                <div class="pathway-group group-lipid">
                    <div class="group-title" style="color:#854d0e;">
                        <span>脂質消化：脂質 ➔ 甘油 ＋ 3 脂肪酸</span>
                    </div>
                    <div class="btn-row">
                        <button class="btn-lipid" onclick="spawnLipid(1)">投入脂質(三酸甘油酯)</button>
                        <button class="btn-lipid-enz" onclick="secreteEnzyme('lipase', 2)">分泌脂肪酶</button>
                    </div>
                </div>

                <button class="btn-reset" onclick="resetSim()">重置模擬器</button>
            </div>

            <div class="panel">
                <h3>即時分子監測</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div style="font-size:0.75rem; color:#64748b;">大分子(澱/蛋/脂)</div>
                        <div id="stat-macro" class="stat-num" style="color:#475569;">0</div>
                    </div>
                    <div class="stat-card">
                        <div style="font-size:0.75rem; color:#64748b;">中分子(麥芽糖/多肽)</div>
                        <div id="stat-mid" class="stat-num" style="color:#7c3aed;">0</div>
                    </div>
                    <div class="stat-card">
                        <div style="font-size:0.75rem; color:#b91c1c;">存活酵素總數</div>
                        <div id="stat-enzyme" class="stat-num" style="color:#dc2626;">0</div>
                    </div>
                    <div class="stat-card wide">
                        <div>
                            <div style="font-size:0.75rem; color:#047857;">胞內小分子養分</div>
                            <div id="stat-in" class="stat-num" style="color:#059669;">0</div>
                        </div>
                        <div style="height:25px; width:1px; background:#a7f3d0;"></div>
                        <div>
                            <div style="font-size:0.78rem; color:#b45309; font-weight:bold;">⚡ 累積代謝與合成利用</div>
                            <div id="stat-metabolized" class="stat-num" style="color:#d97706;">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const toast = document.getElementById('toast');

        // 畫面與細胞膜常數
        const MEMBRANE_Y = 280;
        const MEMBRANE_THICKNESS = 36;

        // 定義細胞膜上的專一性蛋白質通道 (2個葡萄糖通道，2個胺基酸通道)
        const CHANNELS = [
            { x: 140, type: 'glucose', label: '葡萄糖通道', color: '#2563eb', bg: '#bae6fd' },
            { x: 310, type: 'amino', label: '胺基酸通道', color: '#9333ea', bg: '#f3e8ff' },
            { x: 480, type: 'glucose', label: '葡萄糖通道', color: '#2563eb', bg: '#bae6fd' },
            { x: 630, type: 'amino', label: '胺基酸通道', color: '#9333ea', bg: '#f3e8ff' }
        ];
        const CHANNEL_WIDTH = 44;

        // 酵素設定字典 (名稱、顏色、目標受質)
        const ENZYME_CONFIG = {
            amylase: { name: '澱粉酶', color: '#7c3aed', target: 'starch' },
            maltase: { name: '麥芽糖酶', color: '#059669', target: 'maltose' },
            protease: { name: '蛋白酶', color: '#e11d48', target: 'protein' },
            peptidase: { name: '肽酶', color: '#db2777', target: 'polypeptide' },
            lipase: { name: '脂肪酶', color: '#d97706', target: 'lipid' }
        };

        // 粒子陣列
        let molecules = []; // 包含大分子、中分子、小分子
        let enzymes = [];
        let vesicles = [];
        let effects = [];
        let metabolizedCount = 0;

        function showToast(msg) {
            toast.innerText = msg;
            toast.style.opacity = 0.3;
        }

        // 繪製六角形 (代表醣類單體)
        function drawHexagon(ctx, x, y, radius, fillColor, strokeColor, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, alpha);
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const hx = x + radius * Math.cos(angle);
                const hy = y + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = strokeColor;
            ctx.stroke();
            ctx.restore();
        }

        // 繪製圓珠 (代表胺基酸單體)
        function drawAminoBead(ctx, x, y, radius, fillColor, strokeColor, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, alpha);
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = strokeColor;
            ctx.stroke();
            ctx.restore();
        }

        // 1. 產生大分子：澱粉 (6個六角形組成的聚合物)
        function spawnStarch(count = 1) {
            for (let i = 0; i < count; i++) {
                molecules.push({
                    type: 'starch', category: 'macro',
                    x: 60 + Math.random() * (canvas.width - 120),
                    y: 45 + Math.random() * 120,
                    vx: (Math.random() - 0.5) * 1.4,
                    vy: (Math.random() - 0.5) * 1.4,
                    angle: Math.random() * Math.PI * 2,
                    va: (Math.random() - 0.5) * 0.015,
                    radius: 40, state: 'outside'
                });
            }
            showToast("已投入【澱粉】！請分泌「澱粉酶」將其初步分解為麥芽糖。");
        }

        // 2. 產生大分子：蛋白質 (6個圓珠折疊組成的聚合物)
        function spawnProtein(count = 1) {
            for (let i = 0; i < count; i++) {
                molecules.push({
                    type: 'protein', category: 'macro',
                    x: 60 + Math.random() * (canvas.width - 120),
                    y: 45 + Math.random() * 120,
                    vx: (Math.random() - 0.5) * 1.4,
                    vy: (Math.random() - 0.5) * 1.4,
                    angle: Math.random() * Math.PI * 2,
                    va: (Math.random() - 0.5) * 0.015,
                    radius: 36, state: 'outside'
                });
            }
            showToast("已投入【蛋白質】！請分泌「蛋白酶」將其初步分解為多肽。");
        }

        // 3. 產生大分子：脂質 (三酸甘油酯 = 1甘油 + 3脂肪酸尾)
        function spawnLipid(count = 1) {
            for (let i = 0; i < count; i++) {
                molecules.push({
                    type: 'lipid', category: 'macro',
                    x: 60 + Math.random() * (canvas.width - 120),
                    y: 45 + Math.random() * 120,
                    vx: (Math.random() - 0.5) * 1.3,
                    vy: (Math.random() - 0.5) * 1.3,
                    angle: Math.random() * Math.PI * 2,
                    va: (Math.random() - 0.5) * 0.015,
                    radius: 30, state: 'outside'
                });
            }
            showToast("已投入【脂質】！請分泌「脂肪酶」分解為甘油與脂肪酸。");
        }

        // 分泌指定類型的酵素 (胞吐作用)
        function secreteEnzyme(enzymeType, count = 1) {
            const cfg = ENZYME_CONFIG[enzymeType];
            for (let i = 0; i < count; i++) {
                vesicles.push({
                    x: 80 + Math.random() * (canvas.width - 160),
                    y: canvas.height - 45,
                    vy: -3.0,
                    enzymeType: enzymeType,
                    color: cfg.color
                });
            }
            showToast(`細胞正在分泌【${cfg.name}】，它只會專一性地分解對應的養分！`);
        }

        function resetSim() {
            molecules = [];
            enzymes = [];
            vesicles = [];
            effects = [];
            metabolizedCount = 0;
            spawnStarch(0);
            spawnProtein(0);
            spawnLipid(0);
            showToast("模擬器已重置！");
        }

        // 繪製背景、細胞膜與專一性通道
        function drawEnvironment() {
            const topY = MEMBRANE_Y - MEMBRANE_THICKNESS / 2;
            const bottomY = MEMBRANE_Y + MEMBRANE_THICKNESS / 2;

            // 1. 細胞外環境
            ctx.fillStyle = '#e0f2fe';
            ctx.fillRect(0, 0, canvas.width, MEMBRANE_Y);
            ctx.fillStyle = '#0369a1';
            ctx.font = 'bold 14px "Microsoft JhengHei"';
            ctx.fillText('細胞外環境 (消化腔 / 外界 —— 大分子與中分子均無法穿過細胞膜)', 15, 26);

            // 2. 細胞內環境 (細胞質)
            ctx.fillStyle = '#fef3c7';
            ctx.fillRect(0, MEMBRANE_Y, canvas.width, canvas.height - MEMBRANE_Y);
            ctx.fillStyle = '#b45309';
            ctx.fillText('細胞質 (吸收葡萄糖、胺基酸、脂肪酸與甘油，進行呼吸代謝或合成細胞構造)', 15, canvas.height - 14);

            // 繪製胞內「粒線體」與「核糖體/內質網」背景暗示
            ctx.save();
            ctx.translate(115, canvas.height - 80);
            ctx.rotate(-0.15);
            ctx.beginPath();
            ctx.ellipse(0, 0, 50, 22, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(249, 115, 22, 0.14)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(234, 88, 12, 0.35)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
            ctx.fillStyle = 'rgba(194, 65, 12, 0.55)';
            ctx.font = 'bold 12px "Microsoft JhengHei"';
            ctx.fillText('粒線體 (代謝養分產能)', 45, canvas.height - 42);

            ctx.beginPath();
            ctx.arc(canvas.width - 95, canvas.height - 78, 45, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(217, 119, 6, 0.12)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(217, 119, 6, 0.25)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = 'rgba(180, 83, 9, 0.5)';
            ctx.fillText('細胞核 / 核糖體 (合成酵素)', canvas.width - 175, canvas.height - 74);

            // 3. 繪製磷脂雙層細胞膜
            ctx.fillStyle = '#fde68a';
            ctx.fillRect(0, topY, canvas.width, MEMBRANE_THICKNESS);

            for (let x = 6; x < canvas.width; x += 12) {
                let inChannel = false;
                for (let ch of CHANNELS) {
                    if (Math.abs(x - ch.x) < CHANNEL_WIDTH / 2 + 4) {
                        inChannel = true;
                        break;
                    }
                }
                if (inChannel) continue;

                ctx.strokeStyle = '#d97706';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x - 2, topY + 5); ctx.lineTo(x - 2, MEMBRANE_Y - 2);
                ctx.moveTo(x + 2, topY + 5); ctx.lineTo(x + 2, MEMBRANE_Y - 2);
                ctx.moveTo(x - 2, bottomY - 5); ctx.lineTo(x - 2, MEMBRANE_Y + 2);
                ctx.moveTo(x + 2, bottomY - 5); ctx.lineTo(x + 2, MEMBRANE_Y + 2);
                ctx.stroke();

                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(x, topY + 4, 4.5, 0, Math.PI * 2);
                ctx.arc(x, bottomY - 4, 4.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // 標示磷脂雙層可讓脂溶性分子直接穿過
            ctx.fillStyle = '#b45309';
            ctx.font = '11px "Microsoft JhengHei"';
            ctx.fillText('脂溶性(脂肪酸/甘油)可直接穿過磷脂膜', 18, topY - 5);

            // 4. 繪製專一性蛋白質通道
            for (let ch of CHANNELS) {
                ctx.fillStyle = ch.bg;
                ctx.fillRect(ch.x - 10, topY - 4, 20, MEMBRANE_THICKNESS + 8);

                ctx.fillStyle = ch.color;
                ctx.beginPath();
                ctx.roundRect(ch.x - CHANNEL_WIDTH / 2, topY - 6, 14, MEMBRANE_THICKNESS + 12, 6);
                ctx.fill();

                ctx.beginPath();
                ctx.roundRect(ch.x + CHANNEL_WIDTH / 2 - 14, topY - 6, 14, MEMBRANE_THICKNESS + 12, 6);
                ctx.fill();

                ctx.fillStyle = ch.color;
                ctx.font = 'bold 11px "Microsoft JhengHei"';
                ctx.fillText(ch.label, ch.x - 28, MEMBRANE_Y + 50);
            }
        }

        // 繪製各類營養分子的視覺外觀
        function drawMolecule(m) {
            let alpha = (m.state === 'inside' && m.life < 70) ? (m.life / 70) : 1.0;
            ctx.save();
            ctx.translate(m.x, m.y);
            if (m.angle) ctx.rotate(m.angle);
            ctx.globalAlpha = Math.max(0.1, alpha);

            if (m.type === 'starch') {
                // 澱粉：6個紫色六角形鏈
                ctx.strokeStyle = '#4c1d95'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(-38, 0); ctx.lineTo(38, 0); ctx.stroke();
                for (let u = 0; u < 6; u++) {
                    let ox = (u - 2.5) * 15;
                    let oy = (u % 2 === 0) ? -4 : 4;
                    drawHexagon(ctx, ox, oy, 8.5, '#8b5cf6', '#4c1d95', alpha);
                }
            }
            else if (m.type === 'maltose') {
                // 麥芽糖：2個相連的六角形 (雙醣)
                ctx.strokeStyle = '#065f46'; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.stroke();
                drawHexagon(ctx, -8, 0, 8, '#a78bfa', '#4c1d95', alpha);
                drawHexagon(ctx, 8, 0, 8, '#a78bfa', '#4c1d95', alpha);
            }
            else if (m.type === 'glucose') {
                // 葡萄糖：單一綠色六角形
                drawHexagon(ctx, 0, 0, 8, '#10b981', '#047857', alpha);
            }
            else if (m.type === 'protein') {
                // 蛋白質：6個折疊團狀的紅色圓珠
                const pts = [[-22, -8], [-8, -14], [8, -6], [22, -12], [-12, 10], [10, 12]];
                ctx.strokeStyle = '#881337'; ctx.lineWidth = 3.5;
                ctx.beginPath();
                pts.forEach((p, idx) => idx === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
                ctx.stroke();
                pts.forEach((p, idx) => {
                    drawAminoBead(ctx, p[0], p[1], 8, idx % 2 === 0 ? '#f43f5e' : '#fb7185', '#881337', alpha);
                });
            }
            else if (m.type === 'polypeptide') {
                // 多肽：3個相連的粉紅圓珠
                ctx.strokeStyle = '#9d174d'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(14, 0); ctx.stroke();
                drawAminoBead(ctx, -14, -2, 7.5, '#f472b6', '#9d174d', alpha);
                drawAminoBead(ctx, 0, 3, 7.5, '#fb7185', '#9d174d', alpha);
                drawAminoBead(ctx, 14, -2, 7.5, '#f472b6', '#9d174d', alpha);
            }
            else if (m.type === 'amino') {
                // 胺基酸：單一粉紅圓珠
                drawAminoBead(ctx, 0, 0, 7.5, '#ec4899', '#831843', alpha);
            }
            else if (m.type === 'lipid') {
                // 脂質(三酸甘油酯)：1個棕色甘油頭 + 3條黃色彎曲脂肪酸尾
                ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 3;
                for (let t = -1; t <= 1; t++) {
                    ctx.beginPath();
                    ctx.moveTo(t * 8, -6);
                    ctx.quadraticCurveTo(t * 8 - 5, 6, t * 8 + 4, 16);
                    ctx.quadraticCurveTo(t * 8 - 4, 24, t * 8 + 2, 30);
                    ctx.stroke();
                }
                ctx.fillStyle = '#d97706';
                ctx.strokeStyle = '#78350f';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-16, -14, 32, 12, 5);
                ctx.fill();
                ctx.stroke();
            }
            else if (m.type === 'glycerol') {
                // 甘油：琥珀色小膠囊
                ctx.fillStyle = '#f59e0b';
                ctx.strokeStyle = '#78350f';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.roundRect(-10, -5, 20, 10, 4);
                ctx.fill();
                ctx.stroke();
            }
            else if (m.type === 'fatty_acid') {
                // 脂肪酸：黃色小圓頭與短尾
                ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, -6);
                ctx.quadraticCurveTo(-5, 4, 3, 12);
                ctx.stroke();
                ctx.fillStyle = '#eab308';
                ctx.beginPath();
                ctx.arc(0, -6, 4.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // 當酵素遇到對應受質時的分解邏輯
        function cleaveMolecule(m, index) {
            if (m.type === 'starch') {
                // 澱粉 (6單體) -> 3 個麥芽糖 (雙醣)
                for (let k = 0; k < 3; k++) {
                    molecules.push({
                        type: 'maltose', category: 'mid',
                        x: m.x + (Math.random() - 0.5) * 25,
                        y: m.y + (Math.random() - 0.5) * 25,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        angle: Math.random() * Math.PI * 2,
                        va: (Math.random() - 0.5) * 0.03,
                        radius: 18, state: 'outside'
                    });
                }
                effects.push({ x: m.x, y: m.y, r: 8, maxR: 40, color: '#7c3aed', text: '澱粉 ➔ 3 麥芽糖!' });
                showToast("【澱粉酶】將澱粉分解成「麥芽糖」了！但麥芽糖還是太大，請分泌「麥芽糖酶」！");
            }
            else if (m.type === 'maltose') {
                // 麥芽糖 -> 2 個葡萄糖
                for (let k = 0; k < 2; k++) {
                    molecules.push({
                        type: 'glucose', category: 'mono',
                        x: m.x + (Math.random() - 0.5) * 15,
                        y: m.y + (Math.random() - 0.5) * 15,
                        vx: (Math.random() - 0.5) * 2.2,
                        vy: (Math.random() - 0.5) * 2.2,
                        radius: 8, state: 'outside',
                        life: 320 + Math.floor(Math.random() * 120)
                    });
                }
                effects.push({ x: m.x, y: m.y, r: 6, maxR: 32, color: '#059669', text: '麥芽糖 ➔ 2 葡萄糖!' });
            }
            else if (m.type === 'protein') {
                // 蛋白質 -> 2 個多肽
                for (let k = 0; k < 2; k++) {
                    molecules.push({
                        type: 'polypeptide', category: 'mid',
                        x: m.x + (Math.random() - 0.5) * 25,
                        y: m.y + (Math.random() - 0.5) * 25,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        angle: Math.random() * Math.PI * 2,
                        va: (Math.random() - 0.5) * 0.03,
                        radius: 22, state: 'outside'
                    });
                }
                effects.push({ x: m.x, y: m.y, r: 8, maxR: 40, color: '#e11d48', text: '蛋白質 ➔ 2 多肽!' });
                showToast("【蛋白酶】將蛋白質分解成「多肽」了！請接著分泌「肽酶」將其分解為胺基酸！");
            }
            else if (m.type === 'polypeptide') {
                // 多肽 -> 3 個胺基酸
                for (let k = 0; k < 3; k++) {
                    molecules.push({
                        type: 'amino', category: 'mono',
                        x: m.x + (Math.random() - 0.5) * 18,
                        y: m.y + (Math.random() - 0.5) * 18,
                        vx: (Math.random() - 0.5) * 2.2,
                        vy: (Math.random() - 0.5) * 2.2,
                        radius: 8, state: 'outside',
                        life: 320 + Math.floor(Math.random() * 120)
                    });
                }
                effects.push({ x: m.x, y: m.y, r: 6, maxR: 32, color: '#db2777', text: '多肽 ➔ 3 胺基酸!' });
            }
            else if (m.type === 'lipid') {
                // 脂質 -> 1 個甘油 + 3 個脂肪酸
                molecules.push({
                    type: 'glycerol', category: 'mono',
                    x: m.x, y: m.y - 8,
                    vx: (Math.random() - 0.5) * 2, vy: 0.8 + Math.random(),
                    radius: 8, state: 'outside',
                    life: 320 + Math.floor(Math.random() * 120)
                });
                for (let k = 0; k < 3; k++) {
                    molecules.push({
                        type: 'fatty_acid', category: 'mono',
                        x: m.x + (k - 1) * 12, y: m.y + 8,
                        vx: (Math.random() - 0.5) * 2, vy: 0.8 + Math.random(),
                        radius: 8, state: 'outside',
                        life: 320 + Math.floor(Math.random() * 120)
                    });
                }
                effects.push({ x: m.x, y: m.y, r: 8, maxR: 40, color: '#d97706', text: '脂質 ➔ 甘油 + 3 脂肪酸!' });
                showToast("【脂肪酶】已分解脂質！觀察看看：脂肪酸與甘油不需通道即可直接穿過磷脂膜！");
            }

            molecules.splice(index, 1);
        }

        // 更新與繪製所有粒子
        function updateAndDrawParticles() {
            const membraneTop = MEMBRANE_Y - MEMBRANE_THICKNESS / 2;
            const membraneBottom = MEMBRANE_Y + MEMBRANE_THICKNESS / 2;

            // 1. 處理分泌囊泡
            for (let i = vesicles.length - 1; i >= 0; i--) {
                let v = vesicles[i];
                v.y += v.vy;

                ctx.beginPath();
                ctx.arc(v.x, v.y, 13, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(245, 158, 11, 0.25)';
                ctx.fill();
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = v.color;
                ctx.beginPath();
                ctx.arc(v.x, v.y, 6.5, 0, Math.PI * 2);
                ctx.fill();

                if (v.y <= membraneBottom) {
                    let maxLife = 680 + Math.floor(Math.random() * 200);
                    enzymes.push({
                        enzymeType: v.enzymeType,
                        x: v.x,
                        y: membraneTop - 10,
                        vx: (Math.random() - 0.5) * 2.8,
                        vy: -1.5 - Math.random() * 1.5,
                        angle: Math.random() * Math.PI * 2,
                        life: maxLife,
                        maxLife: maxLife
                    });
                    vesicles.splice(i, 1);
                }
            }

            // 2. 處理所有酵素 (專一性導引、催化、半衰期消散)
            for (let i = enzymes.length - 1; i >= 0; i--) {
                let e = enzymes[i];
                const cfg = ENZYME_CONFIG[e.enzymeType];
                e.life--;

                if (e.life <= 0) {
                    effects.push({ x: e.x, y: e.y, r: 4, maxR: 20, color: '#94a3b8', text: `${cfg.name}消散` });
                    enzymes.splice(i, 1);
                    continue;
                }

                // 尋找對應的目標受質進行微弱導引
                let targetMol = null;
                let minDist = Infinity;
                for (let m of molecules) {
                    if (m.state === 'outside' && m.type === cfg.target) {
                        let d = Math.hypot(m.x - e.x, m.y - e.y);
                        if (d < minDist) { minDist = d; targetMol = m; }
                    }
                }
                if (targetMol && minDist < 260) {
                    e.vx += ((targetMol.x - e.x) / minDist) * 0.09;
                    e.vy += ((targetMol.y - e.y) / minDist) * 0.09;
                }

                let sp = Math.hypot(e.vx, e.vy);
                if (sp > 2.4) { e.vx = (e.vx / sp) * 2.4; e.vy = (e.vy / sp) * 2.4; }

                e.x += e.vx;
                e.y += e.vy;
                e.angle = Math.atan2(e.vy, e.vx);

                if (e.x < 14) { e.x = 14; e.vx *= -1; }
                if (e.x > canvas.width - 14) { e.x = canvas.width - 14; e.vx *= -1; }
                if (e.y < 14) { e.y = 14; e.vy *= -1; }
                if (e.y > membraneTop - 12) { e.y = membraneTop - 12; e.vy = -Math.abs(e.vy); }

                // 繪製酵素與名稱標籤
                let alpha = e.life < 140 ? (e.life / 140) : 1.0;
                ctx.save();
                ctx.globalAlpha = Math.max(0.15, alpha);
                ctx.translate(e.x, e.y);

                // 壽命條與酵素名稱
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(-12, -20, 24, 3);
                ctx.fillStyle = cfg.color;
                ctx.fillRect(-12, -20, 24 * (e.life / e.maxLife), 3);
                ctx.font = 'bold 10px "Microsoft JhengHei"';
                ctx.fillStyle = '#1e293b';
                ctx.fillText(cfg.name, -18, -23);

                ctx.rotate(e.angle);
                ctx.beginPath();
                let mouth = 0.25 + Math.sin(Date.now() * 0.016) * 0.15;
                ctx.arc(0, 0, 10.5, mouth * Math.PI, (2 - mouth) * Math.PI);
                ctx.lineTo(0, 0);
                ctx.closePath();
                ctx.fillStyle = cfg.color;
                ctx.fill();
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 1.2;
                ctx.stroke();
                ctx.restore();

                // 碰撞檢測：檢查是否遇到受質
                for (let j = molecules.length - 1; j >= 0; j--) {
                    let m = molecules[j];
                    if (m.state !== 'outside') continue;
                    let dist = Math.hypot(m.x - e.x, m.y - e.y);
                    if (dist < m.radius + 9) {
                        if (m.type === cfg.target) {
                            // 專一性吻合！進行催化分解
                            cleaveMolecule(m, j);
                            e.life -= 35;
                            break;
                        } else if (m.category !== 'mono' && Math.random() < 0.06) {
                            // 專一性不符提示
                            e.vx *= -1; e.vy *= -1;
                            effects.push({ x: e.x, y: e.y, r: 4, maxR: 22, color: '#64748b', text: '酵素專一性不符!' });
                        }
                    }
                }
            }

            // 3. 處理所有營養分子 (大分子、中分子、小分子)
            let macroCount = 0, midCount = 0, inCount = 0;

            for (let i = molecules.length - 1; i >= 0; i--) {
                let m = molecules[i];
                if (m.category === 'macro') macroCount++;
                if (m.category === 'mid') midCount++;
                if (m.state === 'inside') inCount++;

                // 大分子與中分子：只能在細胞外游動，撞到細胞膜會反彈
                if (m.category === 'macro' || m.category === 'mid') {
                    m.x += m.vx;
                    m.y += m.vy;
                    if (m.va) m.angle += m.va;

                    if (m.x < m.radius) { m.x = m.radius; m.vx *= -1; }
                    if (m.x > canvas.width - m.radius) { m.x = canvas.width - m.radius; m.vx *= -1; }
                    if (m.y < m.radius) { m.y = m.radius; m.vy *= -1; }

                    if (m.y + m.radius > membraneTop) {
                        m.y = membraneTop - m.radius;
                        m.vy = -Math.abs(m.vy);
                        if (Math.random() < 0.25) {
                            let msg = m.category === 'macro' ? '大分子進不去!' : '中分子仍太大進不去!';
                            effects.push({ x: m.x, y: membraneTop, r: 5, maxR: 26, color: '#ef4444', text: msg });
                        }
                    }
                }
                // 小分子單體：跨膜吸收與細胞內代謝
                else if (m.category === 'mono') {
                    if (m.state === 'outside') {
                        m.vy += 0.018;

                        // 區分「通道轉運(葡萄糖/胺基酸)」與「直接穿膜(脂肪酸/甘油)」
                        if (m.type === 'glucose' || m.type === 'amino') {
                            let reqType = (m.type === 'glucose') ? 'glucose' : 'amino';
                            let nearestCh = null;
                            let minDist = Infinity;
                            for (let ch of CHANNELS) {
                                if (ch.type === reqType) {
                                    let d = Math.abs(m.x - ch.x);
                                    if (d < minDist) { minDist = d; nearestCh = ch; }
                                }
                            }

                            if (nearestCh && m.y > membraneTop - 95 && minDist < 120) {
                                m.vx += (nearestCh.x - m.x) * 0.009;
                            }

                            let sp = Math.hypot(m.vx, m.vy);
                            if (sp > 2.2) { m.vx = (m.vx / sp) * 2.2; m.vy = (m.vy / sp) * 2.2; }
                            m.x += m.vx; m.y += m.vy;

                            if (m.x < 10) { m.x = 10; m.vx *= -1; }
                            if (m.x > canvas.width - 10) { m.x = canvas.width - 10; m.vx *= -1; }
                            if (m.y < 10) { m.y = 10; m.vy *= -1; }

                            if (m.y + 8 >= membraneTop) {
                                if (nearestCh && minDist < 13) {
                                    m.state = 'transiting';
                                    m.x = nearestCh.x;
                                    m.vx = 0; m.vy = 2.2;
                                } else {
                                    m.y = membraneTop - 8;
                                    m.vy = -Math.abs(m.vy) * 0.7;
                                    if (nearestCh) m.vx += (nearestCh.x > m.x ? 0.9 : -0.9);
                                }
                            }
                        }
                        else if (m.type === 'fatty_acid' || m.type === 'glycerol') {
                            // 脂溶性小分子：只要避開蛋白質通道，在任何磷脂雙層處都能直接穿過！
                            let sp = Math.hypot(m.vx, m.vy);
                            if (sp > 2.0) { m.vx = (m.vx / sp) * 2.0; m.vy = (m.vy / sp) * 2.0; }
                            m.x += m.vx; m.y += m.vy;

                            if (m.x < 10) { m.x = 10; m.vx *= -1; }
                            if (m.x > canvas.width - 10) { m.x = canvas.width - 10; m.vx *= -1; }
                            if (m.y < 10) { m.y = 10; m.vy *= -1; }

                            if (m.y + 6 >= membraneTop) {
                                let hitProtein = false;
                                for (let ch of CHANNELS) {
                                    if (Math.abs(m.x - ch.x) < CHANNEL_WIDTH / 2) hitProtein = true;
                                }
                                if (!hitProtein) {
                                    m.state = 'transiting';
                                    m.vx *= 0.3;
                                    m.vy = 1.6; // 直接溶入磷脂雙層穿過
                                } else {
                                    m.x += 15;
                                }
                            }
                        }
                    }
                    else if (m.state === 'transiting') {
                        m.y += m.vy;
                        if (m.y > membraneBottom + 10) {
                            m.state = 'inside';
                            m.vx = (Math.random() - 0.5) * 1.8;
                            m.vy = 0.8 + Math.random() * 1.2;
                            let txt = (m.type === 'fatty_acid' || m.type === 'glycerol') ? '脂溶性直接穿膜!' : '專屬通道吸收!';
                            effects.push({ x: m.x, y: membraneBottom + 10, r: 4, maxR: 22, color: '#2563eb', text: txt });
                        }
                    }
                    else if (m.state === 'inside') {
                        m.life--;
                        // 往左下角粒線體方向微弱吸引
                        let mitoX = 115, mitoY = canvas.height - 80;
                        let dMito = Math.hypot(mitoX - m.x, mitoY - m.y);
                        if (dMito < 260) {
                            m.vx += ((mitoX - m.x) / dMito) * 0.025;
                            m.vy += ((mitoY - m.y) / dMito) * 0.025;
                        }

                        m.x += m.vx; m.y += m.vy;
                        if (m.x < 10) { m.x = 10; m.vx *= -1; }
                        if (m.x > canvas.width - 10) { m.x = canvas.width - 10; m.vx *= -1; }
                        if (m.y < membraneBottom + 10) { m.y = membraneBottom + 10; m.vy = Math.abs(m.vy); }
                        if (m.y > canvas.height - 10) { m.y = canvas.height - 10; m.vy = -Math.abs(m.vy); }

                        if (m.life <= 0) {
                            metabolizedCount++;
                            let effText = m.type === 'amino' ? '🧬 合成蛋白質/代謝!' : '⚡ 代謝產能 (ATP)!';
                            effects.push({ x: m.x, y: m.y, r: 5, maxR: 30, color: '#d97706', text: effText });
                            molecules.splice(i, 1);
                            continue;
                        }
                    }
                }

                drawMolecule(m);
            }

            // 4. 繪製視覺回饋特效
            for (let i = effects.length - 1; i >= 0; i--) {
                let ef = effects[i];
                ef.r += 1.1;
                let alpha = 1 - (ef.r / ef.maxR);

                ctx.save();
                ctx.beginPath();
                ctx.arc(ef.x, ef.y, ef.r, 0, Math.PI * 2);
                ctx.strokeStyle = ef.color;
                ctx.globalAlpha = Math.max(0, alpha);
                ctx.lineWidth = 2;
                ctx.stroke();

                if (ef.text) {
                    ctx.font = 'bold 11.5px "Microsoft JhengHei"';
                    ctx.fillStyle = ef.color;
                    ctx.fillText(ef.text, ef.x - 38, ef.y - ef.r * 0.5);
                }
                ctx.restore();

                if (ef.r >= ef.maxR) effects.splice(i, 1);
            }

            // 更新統計數據
            document.getElementById('stat-macro').innerText = macroCount;
            document.getElementById('stat-mid').innerText = midCount;
            document.getElementById('stat-enzyme').innerText = enzymes.length;
            document.getElementById('stat-in').innerText = inCount;
            document.getElementById('stat-metabolized').innerText = metabolizedCount;
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment();
            updateAndDrawParticles();
            requestAnimationFrame(animate);
        }

        // 預設啟動時投入三大營養素各 1 個
        resetSim();
        animate();
    </script>
</body>
