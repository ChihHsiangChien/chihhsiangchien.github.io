<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>壞血病病理、膠原蛋白3D機制與林德臨床試驗互動模擬器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --bg-deep: #08111e;
    --bg-stage: #0b1628;
    --bg-panel: #111f36;
    --bg-card: #172946;
    --border-subtle: rgba(148, 163, 184, 0.2);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;

    /* 跨分頁統一語意色票 */
    --c-vitc: #fbbf24;          /* 維生素C / 柑橘：亮金黃 */
    --c-collagen-ok: #2dd4bf;   /* 健康膠原蛋白：青綠藍 */
    --c-collagen-bad: #64748b;  /* 崩解膠原蛋白：灰藍紫 */
    --c-blood: #ef4444;         /* 紅血球 / 出血：鮮紅 */
    --c-purpura: #a855f7;       /* 皮下紫斑 / 瘀血：紫羅蘭 */
    --c-fe2: #10b981;           /* 活化態 Fe2+ / 正常酶：翠綠 */
    --c-fe3: #f97316;           /* 氧化失活 Fe3+ / 熱破壞：鏽橘 */
    --c-accent: #38bdf8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
  }

  /* 頂部導覽與全域控制列 */
  #topbar {
    flex-shrink: 0;
    background: rgba(13, 25, 43, 0.96);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    gap: 8px;
    z-index: 30;
  }

  .nav-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }

  .tab-btn {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-muted);
    border: 1px solid transparent;
    padding: 7px 13px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-main);
  }
  .tab-btn.active {
    background: rgba(45, 212, 191, 0.16);
    color: var(--c-collagen-ok);
    border-color: rgba(45, 212, 191, 0.55);
    box-shadow: 0 0 12px rgba(45, 212, 191, 0.15);
  }

  .global-tools {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .tool-btn {
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border-subtle);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s ease;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tool-btn:hover { border-color: var(--c-accent); }
  .tool-btn.active-toggle {
    background: rgba(251, 191, 36, 0.16);
    border-color: rgba(251, 191, 36, 0.6);
    color: var(--c-vitc);
  }
  .tool-btn.panel-toggle.active-toggle {
    background: rgba(56, 189, 248, 0.18);
    border-color: rgba(56, 189, 248, 0.6);
    color: var(--c-accent);
  }

  /* 中央主工作區（畫布 + 可收合說明面板，絕不重疊遮擋） */
  #workspace {
    flex: 1;
    display: flex;
    flex-direction: row;
    min-height: 0;
    min-width: 0;
    position: relative;
  }

  #stage-container {
    flex: 1;
    position: relative;
    min-width: 0;
    min-height: 0;
    background: radial-gradient(circle at 50% 45%, #11223d 0%, #08111e 100%);
    overflow: hidden;
    touch-action: none;
  }

  #canvas2d {
    width: 100%;
    height: 100%;
    display: block;
  }

  #three-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    overflow: hidden;
  }

  #labels-3d {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .label-3d-tag {
    position: absolute;
    transform: translate(-50%, -50%);
    background: rgba(8, 17, 30, 0.86);
    border: 1px solid rgba(148, 163, 184, 0.4);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transition: opacity 0.15s;
  }

  /* 畫布角落統一視覺圖例與縮放輔助鈕 */
  #legend-bar {
    position: absolute;
    top: 8px;
    left: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: rgba(8, 17, 30, 0.76);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border-subtle);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 11px;
    color: var(--text-muted);
    pointer-events: none;
    z-index: 10;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .leg-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  #zoom-controls {
    position: absolute;
    bottom: 10px;
    left: 10px;
    display: flex;
    gap: 5px;
    z-index: 12;
  }
  .mini-ctrl-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: rgba(15, 28, 48, 0.85);
    color: var(--text-main);
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .mini-ctrl-btn:active { transform: scale(0.94); }
  .mini-ctrl-btn.pan-mode-active {
    background: rgba(56, 189, 248, 0.25);
    border-color: var(--c-accent);
    color: var(--c-accent);
  }

  #gesture-hint {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(8, 17, 30, 0.72);
    border: 1px solid var(--border-subtle);
    color: var(--text-muted);
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 11px;
    pointer-events: none;
    z-index: 10;
  }

  /* 可收合控制與說明面板（獨立佔位，不遮擋畫布） */
  #side-panel {
    width: 380px;
    flex-shrink: 0;
    background: var(--bg-panel);
    border-left: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.24s ease, height 0.24s ease;
    z-index: 20;
  }
  #side-panel.collapsed {
    display: none;
  }

  .panel-header {
    padding: 10px 14px;
    background: rgba(8, 17, 30, 0.55);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .panel-header h2 {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--c-collagen-ok);
  }

  .panel-body {
    padding: 12px 14px;
    overflow-y: auto;
    flex: 1;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
    user-select: text;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sub-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .sub-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-muted);
    padding: 7px 8px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }
  .sub-btn.active {
    background: rgba(45, 212, 191, 0.15);
    border-color: var(--c-collagen-ok);
    color: #fff;
  }

  .info-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 9px;
    padding: 11px 12px;
  }
  .info-card .step-badge {
    display: inline-block;
    background: rgba(251, 191, 36, 0.18);
    color: var(--c-vitc);
    border: 1px solid rgba(251, 191, 36, 0.45);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    margin-bottom: 6px;
  }
  .info-card h3 {
    font-size: 14.5px;
    color: #fff;
    margin-bottom: 6px;
    line-height: 1.35;
  }
  .info-card p {
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 6px;
  }
  .info-card p:last-child { margin-bottom: 0; }

  .highlight-box {
    background: rgba(8, 17, 30, 0.6);
    border-left: 3px solid var(--c-vitc);
    padding: 8px 10px;
    border-radius: 0 6px 6px 0;
    font-size: 12.5px;
    color: #e2e8f0;
    line-height: 1.55;
  }

  .slider-box {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 9px;
    padding: 10px 12px;
  }
  .slider-box label {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--c-vitc);
    margin-bottom: 6px;
  }
  .slider-box input[type=range] {
    width: 100%;
    accent-color: var(--c-vitc);
    cursor: pointer;
  }

  .group-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
  }
  .group-chip {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-muted);
    padding: 6px 5px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .group-chip.active {
    border-color: var(--c-vitc);
    background: rgba(251, 191, 36, 0.16);
    color: #fff;
  }

  /* 側欄頂部集中式流程控制區（固定於說明面板上方，滾動時不遮擋） */
  #stepbar {
    flex-shrink: 0;
    background: rgba(13, 23, 40, 0.95);
    border-bottom: 1px solid var(--border-subtle);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 5;
  }

  .step-title-readout {
    font-size: 12.5px;
    color: var(--c-vitc);
    font-weight: 700;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .step-dots {
    display: flex;
    gap: 6px;
    width: 100%;
  }

  .step-dot {
    flex: 1;
    height: 30px;
    border-radius: 7px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
  }
  .step-dot:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-main);
    border-color: var(--c-collagen-ok);
  }
  .step-dot.active {
    background: var(--c-collagen-ok);
    color: #06131f;
    border-color: var(--c-collagen-ok);
    box-shadow: 0 0 10px rgba(45, 212, 191, 0.35);
  }

  .step-controls {
    display: flex;
    gap: 6px;
    width: 100%;
  }

  .step-btn {
    flex: 1;
    min-height: 34px;
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border-subtle);
    padding: 6px 8px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 0.18s ease;
  }
  .step-btn:hover:not(:disabled) {
    border-color: var(--c-collagen-ok);
    color: var(--c-collagen-ok);
    background: rgba(45, 212, 191, 0.08);
  }
  .step-btn:disabled {
    opacity: 0.38;
    cursor: not-allowed;
  }
  .step-btn.play-active {
    background: rgba(45, 212, 191, 0.2);
    border-color: var(--c-collagen-ok);
    color: var(--c-collagen-ok);
  }

  /* 直向手機與平板響應式設計：控制與說明面板改為下方停駐，畫布自動在上方最大化 */
  @media (max-aspect-ratio: 1/1), (max-width: 820px) {
    #topbar {
      flex-wrap: wrap;
      padding: 6px 8px;
      gap: 6px;
    }
    .nav-tabs {
      order: 2;
      width: 100%;
      justify-content: space-between;
    }
    .tab-btn {
      flex: 1;
      justify-content: center;
      padding: 6px 6px;
      font-size: 12px;
    }
    .global-tools {
      order: 1;
      width: 100%;
      justify-content: flex-end;
    }
    #workspace {
      flex-direction: column;
    }
    #side-panel {
      width: 100%;
      height: 44dvh;
      border-left: none;
      border-top: 1px solid var(--border-subtle);
    }
    #stepbar {
      padding: 8px 10px;
      gap: 6px;
    }
    .step-dot {
      height: 28px;
      font-size: 11.5px;
    }
    .step-btn {
      min-height: 32px;
      font-size: 12px;
      padding: 5px 6px;
    }
    .step-title-readout {
      font-size: 11.5px;
    }
    #legend-bar {
      font-size: 10px;
      padding: 4px 7px;
      gap: 6px;
    }
    #gesture-hint {
      display: none;
    }
  }
</style>
</head>
<body>
<div id="app">
  <!-- 頂部導覽與控制 -->
  <header id="topbar">
    <nav class="nav-tabs" aria-label="主題分頁">
      <button class="tab-btn active" data-tab="0">1. 水手病症與「壞血」病理</button>
      <button class="tab-btn" data-tab="1">2. 維生素C與膠原蛋白 (3D)</button>
      <button class="tab-btn" data-tab="2">3. 林德 1747 臨床試驗</button>
    </nav>
    <div class="global-tools">
      <button id="btn-toggle-labels" class="tool-btn active-toggle" title="顯示或隱藏畫面文字標籤">🏷️ 標籤: 開</button>
      <button id="btn-reset-view" class="tool-btn" title="重置縮放與平移視角">🔍 重置視角</button>
      <button id="btn-toggle-panel" class="tool-btn panel-toggle active-toggle" title="顯示或隱藏控制與說明面板">🎛️ 控制與說明: 開</button>
    </div>
  </header>

  <!-- 中央主工作區 -->
  <main id="workspace">
    <div id="stage-container">
      <!-- 跨分頁統一色票圖例 -->
      <div id="legend-bar">
        <span class="leg-item"><i class="leg-dot" style="background:var(--c-vitc)"></i>維生素C / 柑橘</span>
        <span class="leg-item"><i class="leg-dot" style="background:var(--c-collagen-ok)"></i>強韌膠原蛋白</span>
        <span class="leg-item"><i class="leg-dot" style="background:var(--c-collagen-bad)"></i>解體膠原纖維</span>
        <span class="leg-item"><i class="leg-dot" style="background:var(--c-blood)"></i>紅血球 / 滲血</span>
        <span class="leg-item"><i class="leg-dot" style="background:var(--c-purpura)"></i>皮下紫斑</span>
      </div>

      <!-- 2D 動態模擬畫布 (Tab 1 & Tab 3) -->
      <canvas id="canvas2d"></canvas>

      <!-- 3D Three.js 容器 (Tab 2) -->
      <div id="three-container">
        <div id="labels-3d"></div>
      </div>

      <!-- 左下角觸控友善縮放與平移模式鈕 -->
      <div id="zoom-controls">
        <button class="mini-ctrl-btn" id="btn-zoom-in" title="放大">＋</button>
        <button class="mini-ctrl-btn" id="btn-zoom-out" title="縮小">－</button>
        <button class="mini-ctrl-btn" id="btn-3d-pan-mode" style="display:none; width:auto; padding:0 9px; font-size:12px;" title="切換單指旋轉或平移">🔄 單指: 旋轉</button>
      </div>

      <div id="gesture-hint">支援滑鼠拖曳/滾輪縮放・觸控雙指縮放與平移</div>
    </div>

    <!-- 右側/底部 集中式控制與說明面板 -->
    <aside id="side-panel">
      <div class="panel-header">
        <h2 id="panel-main-title">水手病症與微觀病理</h2>
      </div>

      <!-- 集中化流程控制區（固定於頂端，不隨解說滾動被遮擋） -->
      <div id="stepbar">
        <div class="step-title-readout" id="step-readout-text">步驟 1 / 4</div>
        <div class="step-dots" id="step-dots-container"></div>
        <div class="step-controls">
          <button class="step-btn" id="btn-prev-step">◀ 上一步</button>
          <button class="step-btn" id="btn-play-step">▶ 自動演示</button>
          <button class="step-btn" id="btn-next-step">下一步 ▶</button>
        </div>
      </div>

      <div class="panel-body" id="panel-content"></div>
    </aside>
  </main>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================
     全域色彩常數（確保三個分頁視覺語意一致）
  ========================================================= */
  const COLORS = {
    vitC: '#fbbf24',
    vitCGlow: 'rgba(251, 191, 36, 0.35)',
    collagenOk: '#2dd4bf',
    collagenOkDim: 'rgba(45, 212, 191, 0.32)',
    collagenBad: '#64748b',
    blood: '#ef4444',
    bloodDark: '#991b1b',
    purpura: '#a855f7',
    fe2: '#10b981',
    fe3: '#f97316',
    panelBg: '#111f36',
    textMain: '#f8fafc',
    textMuted: '#94a3b8'
  };

  /* =========================================================
     各分頁知識內容與步驟資料庫
  ========================================================= */
  const TAB1_MODES = [
    {
      id: 'gums',
      name: '🦷 1. 牙齦出血',
      subtitle: '齦乳頭微血管網與牙周膜崩解',
      steps: [
        {
          title: '健康狀態：膠原蛋白穩固支撐牙周與微血管',
          desc: '牙齦（齦乳頭）含有極為豐富的微血管網，高度依賴成纖維細胞合成「第一型與第四型膠原蛋白（青綠色網）」來固定牙周膜並緊密包覆微血管壁。紅血球穩定在管腔內流動。',
          key: '關鍵結構：第 I 型膠原蛋白固定牙周膜與牙齒；第 IV 型膠原蛋白強化微血管基底膜。'
        },
        {
          title: '長期缺乏維生素 C：成纖維細胞停產穩固纖維',
          desc: '水手遠洋航行數月缺乏新鮮蔬果，血液中維生素 C（金色微粒）耗盡。成纖維細胞無法合成具備交聯強度的膠原蛋白，原有的牙周韌帶與血管支撐網逐漸鬆散脆化（轉為灰暗斷裂狀）。',
          key: '病理變化：結締組織支撐崩解，微血管壁失去外圍保護網，變得極度脆弱。'
        },
        {
          title: '輕微機械摩擦：日常咀嚼造成壓力衝擊',
          desc: '當水手啃咬硬餅乾或日常咀嚼時，輕微的機械摩擦與咬合壓力傳導至缺乏膠原緩衝的牙齦乳頭與微血管壁。',
          key: '誘發因子：正常組織可輕鬆承受的輕微咀嚼摩擦，對壞血病牙齦卻是致命衝擊。'
