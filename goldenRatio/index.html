<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>葉序花序的黃金比例 | Golden Ratio Phyllotaxis</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand">
        <span class="badge">PHYLLOTAXIS</span>
        <h1>葉序花序的黃金比例</h1>
      </div>

      <div class="mode-group" role="group" aria-label="繪製模式">
        <button class="mode-btn active" data-mode="leaf">🌱 葉序模式</button>
        <button class="mode-btn" data-mode="seed">🌻 花序種子</button>
      </div>

      <div class="top-actions">
        <button id="btn-animate" class="primary-btn">▶ 生長演示</button>
        <button id="btn-reset" class="secondary-btn">🔄 重置</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-grid">
      <!-- Left: High-DPI Responsive Canvas -->
      <section class="canvas-card card">
        <div class="preset-bar">
          <span class="preset-label">快速角度：</span>
          <button class="preset-btn active" data-angle="137.508" data-num="1" data-den="1">✨ 黃金角 137.51°</button>
          <button class="preset-btn" data-angle="120" data-num="1" data-den="3">1/3 (120°)</button>
          <button class="preset-btn" data-angle="144" data-num="2" data-den="5">2/5 (144°)</button>
          <button class="preset-btn" data-angle="135" data-num="3" data-den="8">3/8 (135°)</button>
          <button class="preset-btn" data-angle="90" data-num="1" data-den="4">1/4 (90°)</button>
        </div>
        <div class="canvas-wrap">
          <canvas id="canvas"></canvas>
        </div>
      </section>

      <!-- Right: Parameter Controls -->
      <aside class="controls-card card">
        <div class="ctrl-group">
          <div class="ctrl-head">
            <label for="numSlider">葉片 / 種子數量</label>
            <input type="number" id="numInput" min="1" max="400" value="36" />
          </div>
          <input type="range" id="numSlider" min="1" max="400" value="36" />
        </div>

        <div class="ctrl-group">
          <div class="ctrl-head">
            <label for="angleSlider">發散角度 (°)</label>
            <input type="number" id="angleInput" min="0" max="360" step="0.01" value="137.51" />
          </div>
          <input type="range" id="angleSlider" min="0" max="360" step="0.01" value="137.51" />
          <div class="fraction-row">
            <span>分數比例：</span>
            <input type="number" id="angleInputNumerator" min="1" max="99" value="3" />
            <span>/</span>
            <input type="number" id="angleInputDenominator" min="1" max="99" value="5" />
            <span>× 360°</span>
            <button id="btn-apply-frac" class="mini-btn">套用</button>
          </div>
        </div>

        <div class="ctrl-group">
          <div class="ctrl-head">
            <label for="startAngleSlider">起始角度 (°)</label>
            <input type="number" id="startAngleInput" min="0" max="360" value="0" />
          </div>
          <input type="range" id="startAngleSlider" min="0" max="360" value="0" />
        </div>

        <div class="ctrl-group">
          <div class="ctrl-head">
            <label for="sizeSlider">單元大小</label>
            <strong id="sizeValue">8</strong>
          </div>
          <input type="range" id="sizeSlider" min="2" max="20" step="0.5" value="8" />
        </div>

        <div class="ctrl-group">
          <div class="ctrl-head">
            <label for="connectSlider">螺旋連線步長 (費波那契)</label>
            <input type="number" id="connectInput" min="0" max="55" value="0" />
          </div>
          <input type="range" id="connectSlider" min="0" max="55" value="0" />
          <div class="fib-chips">
            <button class="fib-btn" data-k="0">無</button>
            <button class="fib-btn" data-k="3">3</button>
            <button class="fib-btn" data-k="5">5</button>
            <button class="fib-btn" data-k="8">8</button>
            <button class="fib-btn" data-k="13">13</button>
            <button class="fib-btn" data-k="21">21</button>
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="showNumbersCheckbox" />
          <span>顯示生長編號 (1, 2, 3…)</span>
        </label>

        <p class="info-note">
          💡 <strong>植物學小知識</strong>：當發散角為黃金角（約 <code>137.508°</code>）時，上下葉片最不容易重疊遮光，能最大化受光面積！
        </p>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
