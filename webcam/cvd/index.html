<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>色覺障礙模擬器（CVD Simulator）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-group">
        <h1>👁️ 色覺障礙模擬器</h1>
        <span id="statusBadge" class="status-badge">啟動相機中...</span>
      </div>
      <div class="source-controls">
        <label for="videoSource" class="sr-only">攝影機來源</label>
        <select id="videoSource" aria-label="攝影機來源"></select>
        <button id="mirrorBtn" class="btn btn-secondary active" type="button">🪞 鏡像：開</button>
        <label for="fileInput" class="btn btn-secondary file-label">📁 上傳圖片</label>
        <input id="fileInput" type="file" accept="image/*" hidden>
        <button id="sampleBtn" class="btn btn-secondary" type="button">🎨 內建測試圖</button>
      </div>
    </header>

    <section class="cvd-bar" aria-label="色覺類型選擇">
      <div class="cvd-presets" id="cvdPresets">
        <button class="chip-btn active" type="button" data-type="protanopia">紅色盲 Protanopia</button>
        <button class="chip-btn" type="button" data-type="protanomaly">紅色弱 Protanomaly</button>
        <button class="chip-btn" type="button" data-type="deuteranopia">綠色盲 Deuteranopia</button>
        <button class="chip-btn" type="button" data-type="deuteranomaly">綠色弱 Deuteranomaly</button>
        <button class="chip-btn" type="button" data-type="tritanopia">藍色盲 Tritanopia</button>
        <button class="chip-btn" type="button" data-type="tritanomaly">藍色弱 Tritanomaly</button>
        <button class="chip-btn" type="button" data-type="achromatopsia">全色盲 Achromatopsia</button>
        <button class="chip-btn" type="button" data-type="normal">正常視覺 Normal</button>
      </div>
      <p id="cvdDesc" class="cvd-desc">
        紅色盲（Protanopia）：缺乏 L 型（長波長／紅光）視錐細胞，紅色會顯得偏暗或接近黃褐色，難以分辨紅與綠。
      </p>
    </section>

    <main id="stageContainer" class="stage-grid">
      <section class="stage-card" id="originalCard">
        <div class="card-header">
          <h2>正常視覺（原圖）</h2>
          <span class="chip">Normal</span>
        </div>
        <div class="canvas-box">
          <canvas id="origCanvas"></canvas>
        </div>
      </section>

      <section class="stage-card" id="simCard">
        <div class="card-header">
          <h2 id="simTitle">色覺模擬：紅色盲</h2>
          <span id="simBadge" class="chip">Protanopia</span>
        </div>
        <div class="canvas-box" id="simBox">
          <canvas id="simCanvas"></canvas>
          <div id="splitLine" class="split-line" hidden>
            <div class="split-handle">↔</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bottom-bar">
      <div class="controls-row">
        <button id="layoutBtn" class="btn btn-secondary" type="button">▥ 切換為分割滑桿</button>
        <button id="freezeBtn" class="btn btn-primary" type="button">📸 暫停定格</button>
        <button id="downloadBtn" class="btn btn-accent" type="button">💾 下載模擬圖</button>
      </div>
    </footer>
  </div>

  <video class="player" playsinline muted autoplay aria-hidden="true"></video>
  <script src="scripts.js"></script>
</body>
</html>
