<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>你的臉對稱嗎？互動對稱線組合 | Symmetry Mirror</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <span class="badge">SYMMETRY</span>
        <h1>你的臉對稱嗎？</h1>
      </div>

      <div class="camera-controls">
        <select id="videoSource" aria-label="選擇攝影機"></select>
        <label class="upload-btn">
          📁 上傳照片
          <input type="file" id="fileInput" accept="image/*" hidden />
        </label>
      </div>
    </header>

    <!-- Main 3-Panel Stage -->
    <main class="stage-grid">
      <!-- Panel 1: Source (Live Camera / Frozen Photo + Draggable Symmetry Line) -->
      <section class="panel-card">
        <div class="panel-head">
          <span class="panel-title">📷 原圖（拍照後拖曳橘色對稱線）</span>
          <span id="line-status" class="line-status">位置 50% · 0°</span>
        </div>
        <div class="canvas-box source-box">
          <canvas id="sourceCanvas"></canvas>
          <div id="cam-error" class="cam-error hidden">無法存取攝影機，請允許權限或改用「上傳照片」。</div>
        </div>
        <div class="source-actions">
          <button id="snapshot" class="primary-btn">📸 拍照定格</button>
          <button id="reset" class="secondary-btn">🔄 重拍</button>
          <button id="btn-center-line" class="secondary-btn" title="將對稱線歸中">⌖ 歸中</button>
        </div>
      </section>

      <!-- Panel 2: Left-Side Composite -->
      <section class="panel-card">
        <div class="panel-head">
          <span class="panel-title">◀ 左半臉對稱組合</span>
          <span class="tag left">左 × 2</span>
        </div>
        <div class="canvas-box">
          <canvas id="leftCanvas"></canvas>
        </div>
      </section>

      <!-- Panel 3: Right-Side Composite -->
      <section class="panel-card">
        <div class="panel-head">
          <span class="panel-title">▶ 右半臉對稱組合</span>
          <span class="tag right">右 × 2</span>
        </div>
        <div class="canvas-box">
          <canvas id="rightCanvas"></canvas>
        </div>
      </section>
    </main>

    <!-- Bottom Fine-Tune Bar -->
    <footer class="bottom-dock">
      <div class="ctrl-item">
        <label for="tiltSlider">微調對稱線傾角：<strong id="lbl-tilt">0°</strong></label>
        <input type="range" id="tiltSlider" min="-25" max="25" step="0.5" value="0" />
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="mirrorPreviewCheck" checked />
        <span>鏡頭水平鏡像</span>
      </label>
      <button id="btn-download" class="primary-btn small">💾 下載組合圖</button>
    </footer>
  </div>

  <!-- Hidden video & offscreen buffer -->
  <video class="player" playsinline muted autoplay hidden></video>
  <script src="scripts.js"></script>
</body>
</html>
