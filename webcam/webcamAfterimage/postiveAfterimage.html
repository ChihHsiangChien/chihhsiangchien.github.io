<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>負片後像錯覺實驗 | Negative Afterimage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <span class="badge">AFTERIMAGE</span>
        <h1>負片後像視覺錯覺</h1>
      </div>

      <div class="camera-controls">
        <select id="videoSource" aria-label="選擇攝影機"></select>
        <label class="upload-btn">
          📁 上傳照片
          <input type="file" id="fileInput" accept="image/*" hidden />
        </label>
      </div>
    </header>

    <main class="stage">
      <div class="guide-banner" id="guide-text">
        步驟 1：按下 <strong>📸 拍照定格</strong>（或上傳照片），接著盯著畫面中央的 <strong>紅點</strong> 看 15 秒！
      </div>

      <div class="canvas-box">
        <canvas id="canvas"></canvas>
        <div id="fixation-dot" class="fixation-dot" title="請凝視此處"></div>
        <div id="countdown-badge" class="countdown-badge hidden">15</div>
        <div id="cam-error" class="cam-error hidden">無法存取攝影機，請允許權限或改用「📁 上傳照片」。</div>
      </div>

      <div class="action-bar">
        <button id="snapshot" class="primary-btn">📸 拍照定格</button>
        <button id="btn-auto-gaze" class="accent-btn" disabled>⏱️ 15秒凝視自動切灰階</button>
        <button id="showGrey" class="secondary-btn">🌗 手動切換：負片 / 灰階</button>
      </div>
    </main>

    <footer class="footer-note">
      💡 <strong>視覺生理原理</strong>：長時間凝視負片互補色會使視網膜對應的錐狀細胞疲勞；突然切換成灰階時，未疲勞的互補色細胞會產生強烈訊號，讓大腦在黑白照片上「看見」逼真的正常彩色！
    </footer>
  </div>

  <video class="player" playsinline muted autoplay hidden></video>
  <script src="scripts.js"></script>
</body>
</html>
