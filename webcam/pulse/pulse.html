<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>即時脈搏量測（抗光源干擾 rPPG）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-group">
        <h1>💓 即時脈搏量測</h1>
        <span id="statusBadge" class="status-badge">啟動相機中...</span>
      </div>
      <div class="source-controls">
        <label for="videoSource" class="sr-only">攝影機來源</label>
        <select id="videoSource" aria-label="攝影機來源"></select>
        <select id="algoMode" aria-label="演算法模式">
          <option value="auto">🤖 自動（POS + 紅光自適應）</option>
          <option value="pos">🙂 臉部／皮膚（抗光源 POS 演算法）</option>
          <option value="finger">👆 指尖貼鏡頭（AC/DC 正規化）</option>
        </select>
        <button id="torchBtn" class="btn btn-secondary" type="button" hidden>🔦 補光燈：關</button>
        <button id="beepBtn" class="btn btn-secondary" type="button">🔇 心跳音：關</button>
        <button id="demoBtn" class="btn btn-secondary" type="button">🧪 模擬不穩光源</button>
      </div>
    </header>

    <main class="main-layout">
      <section class="stage-card">
        <div class="card-header">
          <h2>📷 攝影機取景（中央綠框為取樣區）</h2>
          <span id="lightChip" class="chip">光源亮度：--</span>
        </div>
        <div class="canvas-box">
          <canvas id="canvas"></canvas>
        </div>
        <div class="tip-row">
          <span>💡 <strong>臉部非接觸</strong>：保持臉頰/額頭在綠框內；<strong>指尖貼鏡頭</strong>：輕蓋後鏡頭與閃光燈。</span>
        </div>
      </section>

      <section class="stage-card">
        <div class="bpm-panel">
          <div class="bpm-main">
            <span id="heartIcon" class="heart-icon">❤️</span>
            <span id="bpmValue" class="bpm-number">--</span>
            <span class="bpm-unit">BPM</span>
          </div>
          <div class="bpm-meta">
            <div class="quality-row">
              <span>訊號品質 (SQI)</span>
              <strong id="sqiText">0%</strong>
            </div>
            <div class="quality-bar">
              <div id="sqiFill" class="quality-fill"></div>
            </div>
            <span id="algoNote" class="algo-note">等待累積 4 秒訊號...</span>
          </div>
        </div>

        <div class="card-header">
          <h2>📈 濾波後脈搏波形（0.7–3.3 Hz 帶通 + 去漂移）</h2>
          <span id="bufferChip" class="chip">樣本 0.0 s</span>
        </div>
        <div class="graph-box">
          <canvas id="graphCanvas"></canvas>
        </div>

        <div class="controls-row">
          <button id="resetBtn" class="btn btn-secondary" type="button">🔄 重設訊號緩衝</button>
        </div>
      </section>
    </main>
  </div>

  <video class="player" playsinline muted autoplay aria-hidden="true"></video>
  <script src="scripts.js"></script>
</body>
</html>
