<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>停格動畫製作</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-group">
        <h1>🎬 停格動畫製作</h1>
        <span id="statusBadge" class="status-badge">啟動相機中...</span>
      </div>
      <div class="source-controls">
        <label for="videoSource" class="sr-only">攝影機來源</label>
        <select id="videoSource" aria-label="攝影機來源"></select>
        <button id="mirrorBtn" class="btn btn-secondary active" type="button" title="左右鏡像翻轉">🪞 鏡像：開</button>
        <label for="fileInput" class="btn btn-secondary file-label">📁 匯入圖片</label>
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
      </div>
    </header>

    <main class="stage-grid">
      <section class="stage-card">
        <div class="card-header">
          <h2>📷 拍攝取景</h2>
          <span id="onionLabel" class="chip">🧅 洋蔥皮：開</span>
        </div>
        <div class="canvas-box">
          <canvas id="canvas"></canvas>
          <div id="shutterFlash" class="shutter-flash" aria-hidden="true"></div>
          <div id="cameraHiddenMsg" class="overlay-msg" hidden>相機畫面已隱藏</div>
        </div>
        <div class="controls-row">
          <button id="snapshot" class="btn btn-primary" type="button">📸 拍照 (+1格)</button>
          <button id="undoFrame" class="btn btn-secondary" type="button" disabled>↩️ 刪上一格</button>
          <button id="toggleOnion" class="btn btn-secondary active" type="button">🧅 洋蔥皮</button>
          <button id="hideCamera" class="btn btn-secondary" type="button">👁️ 隱藏相機</button>
        </div>
      </section>

      <section class="stage-card">
        <div class="card-header">
          <h2>🎞️ 動畫預覽</h2>
          <span id="animStats" class="chip">0 格 ｜ 10.0 FPS</span>
        </div>
        <div class="canvas-box">
          <canvas id="animationCanvas"></canvas>
          <div id="emptyAnimMsg" class="overlay-msg">尚未拍攝影格，請按「拍照」或「匯入圖片」</div>
        </div>
        <div class="controls-row">
          <button id="playPause" class="btn btn-accent" type="button" disabled>⏸️ 暫停</button>
          <button id="speedDown" class="btn btn-secondary" type="button">🐢 變慢</button>
          <button id="speedUp" class="btn btn-secondary" type="button">🐇 加快</button>
          <button id="exportBtn" class="btn btn-secondary" type="button" disabled>💾 匯出影片</button>
          <button id="reset" class="btn btn-danger" type="button" disabled>🗑️ 重置</button>
        </div>
      </section>
    </main>

    <section class="filmstrip-section" aria-label="影格時間軸">
      <div class="filmstrip-header">
        <span>影格時間軸（點擊影格可刪除）</span>
        <span id="frameCountText">共 0 格</span>
      </div>
      <div id="filmstrip" class="filmstrip"></div>
    </section>
  </div>

  <video class="player" playsinline muted autoplay aria-hidden="true"></video>
  <script src="scripts.js"></script>
</body>
</html>
