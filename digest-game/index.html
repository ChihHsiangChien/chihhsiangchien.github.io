<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="HandheldFriendly" content="true">
  <title>人體消化大冒險</title>
  <meta name="description" content="互動式人體消化道教育遊戲，親身體驗唾腺、胃腺、肝臟膽汁、胰臟及腸腺如何分段水解與乳化養分！">
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=31">
</head>

<body>

  <!-- Top Header & Game Status HUD -->
  <header>
    <div class="title-group">
      <div>
        <h1>人體消化大冒險</h1>
      </div>
    </div>

    <!-- HUD Stats -->
    <div class="hud-panel">
      <!-- Health (HP) -->
      <div class="hud-item">
        <span class="hud-label">腸胃健康 (HP)</span>
        <div class="hp-container">
          <div class="hp-bar-outer">
            <div id="hpBar" class="hp-bar-inner"></div>
          </div>
          <span id="hudHp" class="hud-val" style="color: #10b981;">100%</span>
        </div>
      </div>

      <!-- Score -->
      <div class="hud-item">
        <span class="hud-label">養分分數</span>
        <span id="hudScore" class="hud-val" style="color: #38bdf8;">0</span>
      </div>

      <!-- Target Goal -->
      <div class="hud-item">
        <span class="hud-label">小腸吸收進度</span>
        <span id="hudProgress" class="hud-val">0 / 10</span>
      </div>

      <!-- Mode Selector -->
      <div class="hud-item">
        <span class="hud-label">關卡難度</span>
        <div class="btn-group">
          <button id="btnBeginner" class="pill-btn active">初階</button>
          <button id="btnIntermediate" class="pill-btn">中階</button>
        </div>
      </div>

      <!-- Teaching Practice Focus Selector -->
      <div class="hud-item">
        <span class="hud-label">指定養分</span>
        <select id="selectNutrient" class="pill-select" title="選擇特定養分持續生成，方便課堂練習與專題教學">
          <option value="random">隨機出現</option>
          <option value="starch">澱粉</option>
          <option value="protein">蛋白質</option>
          <option value="lipid">脂質</option>
          <option value="cellulose">纖維素</option>
        </select>
      </div>

      <!-- Movement Speed Control -->
      <div class="hud-item">
        <span class="hud-label">移動速度</span>
        <select id="selectSpeed" class="pill-select" title="調整養分分子移動與腸胃蠕動波的速度">
          <option value="1">1x</option>
          <option value="2" selected>2x</option>
          <option value="4">4x</option>
          <option value="8">8x</option>
        </select>
      </div>

      <!-- Tools & Settings -->
      <div class="hud-item">
        <span class="hud-label">系統控制</span>
        <div class="btn-group">
          <button id="btnMute" class="icon-btn" title="切換音效">音效</button>
          <button id="btnReset" class="icon-btn" title="重新開始">重開</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Game Arena -->
  <main>
    <!-- Digestive Anatomy Canvas Stage -->
    <div class="canvas-wrapper">
      <!-- Organ Labels Top Bar (7 Equal Sections) -->
      <div class="organ-labels-bar">
        <div class="organ-tag" style="border-top: 3px solid var(--mouth-color);">
          <span class="organ-tag-name" style="color: var(--mouth-color);">1. 口腔</span>
        </div>
        <div class="organ-tag" style="border-top: 3px solid var(--esophagus-color);">
          <span class="organ-tag-name" style="color: var(--esophagus-color);">2. 食道</span>
        </div>
        <div class="organ-tag" style="border-top: 3px solid var(--stomach-color);">
          <span class="organ-tag-name" style="color: var(--stomach-color);">3. 胃</span>
        </div>
        <div class="organ-tag" style="border-top: 3px solid var(--duodenum-color);">
          <span class="organ-tag-name" style="color: var(--duodenum-color);">4. 小腸前段 (十二指腸)</span>
        </div>
        <div class="organ-tag" style="border-top: 3px solid var(--pancreatic-color);">
          <span class="organ-tag-name" style="color: var(--pancreatic-color);">5. 小腸中段</span>
        </div>
        <div class="organ-tag" style="border-top: 3px solid var(--intestinal-color);">
          <span class="organ-tag-name" style="color: var(--intestinal-color);">6. 小腸後段</span>
        </div>
        <div class="organ-tag" style="border-top: 3px solid var(--large-int-color);">
          <span class="organ-tag-name" style="color: var(--large-int-color);">7. 大腸</span>
        </div>
      </div>

      <!-- Realtime Canvas for Animation & Physics -->
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Digestive Glands Control Console -->
    <section class="control-console">
      <!-- 7-Columns Glands Grid aligned with Digestive Tube Sections (Uniform Widths) -->
      <div class="glands-grid">

        <!-- Column 1: 口腔 -> 唾腺 -->
        <div class="gland-col">
          <button id="btn-salivary" class="gland-btn btn-salivary">
            <span class="btn-name">唾腺</span>
            <div class="charge-container">
              <div class="charge-track">
                <div id="charge-bar-salivary" class="charge-fill"></div>
              </div>
              <span id="charge-txt-salivary" class="charge-label">5/5</span>
            </div>
          </button>
        </div>

        <!-- Column 2: 食道 -> 無消化腺 -->
        <div class="gland-col">
          <div class="no-gland-box">

          </div>
        </div>

        <!-- Column 3: 胃 -> 胃腺 -->
        <div class="gland-col">
          <button id="btn-gastric" class="gland-btn btn-gastric">
            <span class="btn-name">胃腺</span>
            <div class="charge-container">
              <div class="charge-track">
                <div id="charge-bar-gastric" class="charge-fill"></div>
              </div>
              <span id="charge-txt-gastric" class="charge-label">5/5</span>
            </div>
          </button>
        </div>

        <!-- Column 4: 小腸前段 (十二指腸) -> 肝臟 (膽汁) -->
        <div class="gland-col">
          <button id="btn-liver" class="gland-btn btn-liver">
            <span class="btn-name">肝臟</span>
            <div class="charge-container">
              <div class="charge-track">
                <div id="charge-bar-liver" class="charge-fill"></div>
              </div>
              <span id="charge-txt-liver" class="charge-label">5/5</span>
            </div>
          </button>
        </div>

        <!-- Column 5: 小腸中段 -> 胰臟 -->
        <div class="gland-col">
          <button id="btn-pancreas" class="gland-btn btn-pancreas">
            <span class="btn-name">胰臟</span>
            <div class="charge-container">
              <div class="charge-track">
                <div id="charge-bar-pancreas" class="charge-fill"></div>
              </div>
              <span id="charge-txt-pancreas" class="charge-label">5/5</span>
            </div>
          </button>
        </div>

        <!-- Column 6: 小腸後段 -> 腸腺 -->
        <div class="gland-col">
          <button id="btn-intestinal" class="gland-btn btn-intestinal">
            <span class="btn-name">腸腺</span>
            <div class="charge-container">
              <div class="charge-track">
                <div id="charge-bar-intestinal" class="charge-fill"></div>
              </div>
              <span id="charge-txt-intestinal" class="charge-label">5/5</span>
            </div>
          </button>
        </div>

        <!-- Column 7: 大腸 -->
        <div class="gland-col">
          <div class="no-gland-box" style="border-color: rgba(139, 92, 246, 0.25);">
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- Game Over / Victory Modal -->
  <div id="modalResult" class="modal-overlay">
    <div class="modal-card" style="max-width: 500px;">
      <div class="result-box">
        <h2 id="modalResultTitle" class="result-title">結算標題</h2>
        <p id="modalResultDesc" style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.5;"></p>

        <div class="result-stats">
          <div class="stat-item">
            <span id="resScore" class="stat-val">0</span>
            <span class="stat-lbl">得分</span>
          </div>
          <div class="stat-item">
            <span id="resAbsorbed" class="stat-val">0</span>
            <span class="stat-lbl">吸收分子數</span>
          </div>
          <div class="stat-item">
            <span id="resHp" class="stat-val">100%</span>
            <span class="stat-lbl">剩餘健康</span>
          </div>
        </div>

        <button id="btnRestartModal" class="pill-btn" style="font-size: 1rem; padding: 10px 24px; margin-top: 10px;">
          再玩一次
        </button>
      </div>
    </div>
  </div>

  <script src="game.js?v=31"></script>
</body>

</html>
