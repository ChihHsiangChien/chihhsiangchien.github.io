<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>天干地支六十甲子互動羅盤 | Sexagenary Cycle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand">
        <span class="badge">60 CYCLE</span>
        <h1>天干地支六十甲子圖</h1>
      </div>

      <div class="cycle-tabs" role="group" aria-label="甲子週期切換">
        <button class="tab-btn" data-base="1924">1924–1983</button>
        <button class="tab-btn active" data-base="1984">1984–2043</button>
        <button class="tab-btn" data-base="2044">2044–2103</button>
      </div>
    </header>

    <!-- Main Layout -->
    <main class="main-grid">
      <!-- Left: Interactive SVG Wheel -->
      <section class="wheel-card card">
        <div class="wheel-toolbar">
          <div class="wuxing-filters" role="group" aria-label="五行篩選">
            <button class="wx-btn active" data-wx="all">全部</button>
            <button class="wx-btn wood" data-wx="木">木</button>
            <button class="wx-btn fire" data-wx="火">火</button>
            <button class="wx-btn earth" data-wx="土">土</button>
            <button class="wx-btn metal" data-wx="金">金</button>
            <button class="wx-btn water" data-wx="水">水</button>
          </div>
          <div class="anim-controls">
            <button id="btn-prev" class="mini-btn" title="前一年">◀</button>
            <button id="btn-play" class="mini-btn" title="自動演示 60 甲子循環">▶ 輪轉</button>
            <button id="btn-next" class="mini-btn" title="後一年">▶</button>
          </div>
        </div>

        <div class="wheel-stage">
          <svg id="zodiac-svg" viewBox="-430 -430 860 860" aria-label="六十甲子互動圓盤"></svg>
        </div>
      </section>

      <!-- Right: Year Inspector & Quiz -->
      <aside class="info-col">
        <!-- Year Lookup -->
        <div class="card lookup-card">
          <label for="year-input" class="section-label">🔍 查詢任意西元年（支援西元前／後）</label>
          <div class="lookup-row">
            <input type="number" id="year-input" value="2026" min="1" max="9999" />
            <button id="btn-lookup" class="primary-btn">查詢</button>
            <button id="btn-today" class="secondary-btn">今年</button>
          </div>
        </div>

        <!-- Selected Year Detail -->
        <div class="card detail-card">
          <div class="detail-top">
            <div>
              <div class="year-badge" id="detail-year">西元 2026 年（民國 115 年）</div>
              <h2 id="detail-ganzhi" class="ganzhi-title">丙午年</h2>
            </div>
            <div class="zodiac-hero" id="detail-zodiac">🐴</div>
          </div>

          <div class="detail-grid">
            <div class="d-box">
              <span>天干（五行）</span>
              <strong id="detail-stem">丙 · 火</strong>
            </div>
            <div class="d-box">
              <span>地支（生肖）</span>
              <strong id="detail-branch">午 · 馬</strong>
            </div>
            <div class="d-box">
              <span>甲子序號</span>
              <strong id="detail-index">第 43 / 60 位</strong>
            </div>
            <div class="d-box">
              <span>陰陽屬性</span>
              <strong id="detail-yinyang">陽</strong>
            </div>
          </div>

          <div class="related-years" id="detail-related">
            同干支年份：1906、1966、2026、2086
          </div>
        </div>

        <!-- Math Principle & Mini Quiz -->
        <div class="card quiz-card">
          <div class="quiz-header">
            <span>🎯 互動小測驗</span>
            <span id="quiz-score" class="quiz-score">答對 0 題</span>
          </div>
          <p id="quiz-question" class="quiz-q"></p>
          <div id="quiz-options" class="quiz-options"></div>
          <p id="quiz-feedback" class="quiz-feedback"></p>
          <button id="btn-next-quiz" class="secondary-btn full-w">換一題</button>
        </div>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
