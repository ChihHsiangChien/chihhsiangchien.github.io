<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人體血液循環互動式教學板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .vessel-path {
      transition: stroke 0.25s ease, stroke-width 0.25s ease, opacity 0.25s ease;
    }

    .chamber-bg {
      transition: fill 0.3s ease, opacity 0.3s ease;
    }

    @keyframes flowDash {
      to {
        stroke-dashoffset: -44;
      }
    }

    .flow-highlight-active {
      stroke-dasharray: 12 10;
      animation: flowDash 0.9s linear infinite;
    }

    .node-interactive {
      cursor: pointer;
    }

    .node-interactive rect {
      transition: fill 0.15s ease, stroke 0.15s ease, stroke-width 0.15s ease, filter 0.15s ease;
    }

    .node-interactive:hover rect {
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.18));
    }

    .canvas-grab {
      cursor: grab;
    }

    .canvas-grabbing {
      cursor: grabbing !important;
    }

    @keyframes pulseRing {

      0%,
      100% {
        opacity: 0.95;
        stroke-width: 4px;
        transform: scale(1);
      }

      50% {
        opacity: 0.3;
        stroke-width: 8px;
        transform: scale(1.15);
      }
    }

    .particle-pulse-ring {
      animation: pulseRing 1.1s ease-in-out infinite;
      transform-origin: center;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 h-screen w-screen overflow-hidden flex flex-col">

  <!-- 頂部功能與控制工具列 -->
  <header class="bg-white border-b border-slate-200 shadow-sm shrink-0 z-30 px-3 py-1.5">
    <div class="w-full flex flex-wrap items-center justify-between gap-2">
      <!-- 標題與解剖鏡像視角提示 -->
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-rose-600 flex items-center justify-center text-white font-black text-sm shadow-sm shrink-0">心</div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base md:text-lg font-black tracking-tight text-slate-900">人體血液循環互動式教學板</h1>
            <span
              class="text-[12px] font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-300 hidden sm:inline-block">
              解剖視角：圖左＝人體右心 / 圖右＝人體左心
            </span>
          </div>
        </div>
      </div>

      <!-- 標籤填空切換與線條獨立顯示開關 -->
      <div class="flex flex-wrap items-center gap-1.5 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
        <span class="text-xs font-bold text-slate-500 px-1 hidden xl:inline">標籤填空：</span>
        <button onclick="setLabelFilter('all')" id="btn-filter-all" class="px-2.5 py-1 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow-sm border border-slate-300">全部顯示</button>
        <button onclick="setLabelFilter('none')" id="btn-filter-none" class="px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-600 hover:bg-white">全部隱藏 (測驗)</button>
        <button onclick="setLabelFilter('chambers')" id="btn-filter-chambers" class="px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-600 hover:bg-white">心臟腔室</button>
        <button onclick="setLabelFilter('vessels')" id="btn-filter-vessels" class="px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-600 hover:bg-white">血管路徑</button>
        <button onclick="toggleValvesDisplay()" id="btn-toggle-valves" class="px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-600 hover:bg-white">瓣膜標籤: 隱藏</button>

        <div class="h-4 w-[1px] bg-slate-300 mx-1"></div>

        <button onclick="toggleHeartLines()" id="btn-toggle-heart-lines" class="px-2.5 py-1 rounded-lg text-xs font-bold transition bg-rose-600 text-white shadow-sm hover:bg-rose-700">心臟線條: 顯示</button>
        <button onclick="toggleVesselLines()" id="btn-toggle-vessel-lines" class="px-2.5 py-1 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow-sm hover:bg-indigo-700">路徑線條: 顯示</button>

        <div class="h-4 w-[1px] bg-slate-300 mx-1"></div>
        <button onclick="toggleContinuousRBCFlow()" id="btn-top-rbc-flow"
          class="px-3 py-1 rounded-lg text-xs font-black transition bg-red-600 hover:bg-red-700 text-white shadow-sm flex items-center gap-1">
          <span id="top-rbc-btn-text">啟動紅血球循環</span>
        </button>

        <div class="h-4 w-[1px] bg-slate-300 mx-1"></div>
        <button onclick="resetBoard()" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-800 text-white hover:bg-slate-700 transition">重置</button>
      </div>

      <!-- 右側面板展開/收合切換 -->
      <div class="flex items-center">
        <button onclick="toggleRightSidebar()" id="btn-toggle-sidebar"
          class="px-3.5 py-1.5 rounded-xl text-xs font-black bg-amber-500 hover:bg-amber-600 text-white shadow-sm transition flex items-center gap-1.5">
          <span id="sidebar-toggle-icon">⇥</span>
          <span id="sidebar-toggle-text">隱藏右側面板</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主工作區：左側大畫布 + 右側獨立捲動面板 -->
  <main class="w-full flex-1 min-h-0 flex flex-col lg:flex-row gap-2.5 p-2 overflow-hidden relative">

    <!-- 左側：SVG 幾何校準循環圖 -->
    <section id="left-canvas-section"
      class="flex-1 h-full min-w-0 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden relative">

      <!-- 畫布頂部資訊條 -->
      <div
        class="h-9 px-3 bg-slate-50 border-b border-slate-200 shrink-0 flex items-center justify-between text-xs overflow-x-auto">
        <div class="flex items-center gap-4 shrink-0 font-bold">
          <span class="text-slate-800 flex items-center gap-1.5"><span
              class="w-3 h-3 rounded-full bg-slate-900 inline-block"></span> 原始簡圖</span>
          <span class="text-red-600 flex items-center gap-1.5"><span
              class="w-3 h-3 rounded-full bg-red-600 inline-block"></span> 充氧血 (高 O₂)</span>
          <span class="text-blue-700 flex items-center gap-1.5"><span
              class="w-3 h-3 rounded-full bg-blue-700 inline-block"></span> 缺氧血 (高 CO₂)</span>
          <span class="hidden md:inline text-[12px] text-slate-500 font-normal">滾輪縮放、拖曳畫布；點擊標籤可翻開/蓋上測驗</span>
        </div>
      </div>

      <!-- SVG 畫布 (絕對定位滿版，支援 Pan & Zoom) -->
      <div id="svg-viewport" class="relative flex-1 w-full bg-white overflow-hidden canvas-grab">
        <svg id="circulation-svg" viewBox="0 0 1100 860" preserveAspectRatio="xMidYMid meet"
          class="absolute inset-0 w-full h-full select-none">
          <defs>
            <!-- 箭頭標記：黑色、鮮紅色(充氧血)、寶藍色(缺氧血) -->
            <marker id="arr-black" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5"
              orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f172a" />
            </marker>
            <marker id="arr-oxy" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5"
              orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626" />
            </marker>
            <marker id="arr-deoxy" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5"
              orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1d4ed8" />
            </marker>
          </defs>

          <!-- Pan / Zoom 總容器 -->
          <g id="viewport-group" transform="translate(0, 0) scale(1)">

            <!-- 0. 左右循環大分區背景提示 -->
            <g id="layer-zones" class="opacity-70 pointer-events-none">
              <text x="210" y="38" text-anchor="middle"
                class="text-sm font-black fill-slate-400 tracking-widest">【體循環路徑（大循環）】</text>
              <text x="890" y="38" text-anchor="middle"
                class="text-sm font-black fill-slate-400 tracking-widest">【肺循環路徑（小循環）】</text>
            </g>

            <!-- 1. 心臟四腔室填充底色 -->
            <g id="layer-chamber-fills">
              <!-- 右心房 RA (圖左上) -->
              <path id="fill-ra" class="chamber-bg"
                d="M 550 290 C 500 220, 360 240, 360 380 L 435 390 L 445 422 L 475 422 L 485 390 L 550 385 Z"
                fill="#f8fafc" opacity="0.6" />
              <!-- 右心室 RV (圖左下) -->
              <path id="fill-rv" class="chamber-bg"
                d="M 360 380 C 360 485, 450 545, 548 590 L 550 385 L 485 390 L 475 422 L 445 422 L 435 390 Z"
                fill="#f8fafc" opacity="0.6" />
              <!-- 左心房 LA (圖右上) -->
              <path id="fill-la" class="chamber-bg"
                d="M 550 290 C 600 220, 740 240, 740 380 L 665 390 L 655 422 L 625 422 L 615 390 L 550 385 Z"
                fill="#f8fafc" opacity="0.6" />
              <!-- 左心室 LV (圖右下) -->
              <path id="fill-lv" class="chamber-bg"
                d="M 740 380 C 740 485, 650 545, 548 590 L 550 385 L 615 390 L 625 422 L 655 422 L 665 390 Z"
                fill="#f8fafc" opacity="0.6" />
            </g>

            <!-- 2. 中央心臟外形、中隔與房室瓣水平折線 -->
            <g id="layer-heart-outline" class="pointer-events-none">
              <!-- 心臟外廓心形輪廓 -->
              <path
                d="M 550 290 C 500 220, 360 240, 360 380 C 360 485, 450 545, 548 590 C 650 545, 740 485, 740 380 C 740 240, 600 220, 550 290 Z"
                fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
              <!-- 中央心室中隔 -->
              <line x1="550" y1="290" x2="548" y2="590" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />
              <!-- 右側房室隔折線 (三尖瓣) -->
              <polyline points="360,380 435,390 445,422" fill="none" stroke="#0f172a" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round" />
              <polyline points="475,422 485,390 550,385" fill="none" stroke="#0f172a" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round" />
              <!-- 左側房室隔折線 (二尖瓣) -->
              <polyline points="550,385 615,390 625,422" fill="none" stroke="#0f172a" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round" />
              <polyline points="655,422 665,390 740,380" fill="none" stroke="#0f172a" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round" />
            </g>

            <!-- 3. 動態流動高亮軌跡 (體循環 / 肺循環，嚴格與結構骨幹對齊) -->
            <g id="layer-circuit-highlight" class="pointer-events-none">
              <!-- 體循環高亮流動虛線：左心室 ➔ 大動脈 ➔ 全身小動脈 ➔ 全身組織微血管 ➔ 全身小靜脈 ➔ 上下大靜脈 ➔ 右心房 -->
              <path id="highlight-systemic" class="hidden flow-highlight-active"
                d="M 640 495 L 640 600 C 640 740, 430 765, 140 620 L 140 595 L 140 545 C 140 455, 140 445, 140 375 L 140 315 C 140 250, 190 200, 260 175 L 340 175 C 410 175, 450 200, 460 295"
                fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" opacity="0.65" />

              <!-- 肺循環高亮流動虛線：右心室 ➔ 肺動脈 ➔ 肺部微血管 ➔ 肺靜脈 ➔ 左心房 -->
              <path id="highlight-pulmonary" class="hidden flow-highlight-active"
                d="M 460 495 L 460 600 C 460 740, 670 765, 960 525 L 960 475 C 960 250, 920 185, 860 175 L 760 175 C 690 175, 650 200, 640 295"
                fill="none" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" opacity="0.65" />

              <!-- 完整連續循環 8 字形隱藏校準路徑 (用於 requestAnimationFrame 連續取樣) -->
              <path id="path-continuous-full-circuit" class="opacity-0 pointer-events-none"
                d="M 640 470 L 640 575 L 640 600 L 640 625 C 640 740, 430 765, 140 620 L 140 595 L 140 570 L 140 525 L 140 500 L 140 475 L 140 420 L 140 395 L 140 370 C 140 250, 180 185, 240 175 L 300 175 L 360 175 C 430 175, 460 215, 460 295 L 460 320 L 460 345 L 460 395 L 460 445 L 460 470 L 460 495 L 460 575 L 460 600 L 460 625 C 460 740, 670 765, 960 525 L 960 500 L 960 475 C 960 250, 920 185, 860 175 L 800 175 L 740 175 C 670 175, 640 215, 640 295 L 640 320 L 640 345 L 640 395 L 640 445 Z"
                fill="none" />
            </g>

            <!-- 4. 原圖所有血管路徑與方向箭頭 (嚴格接續標籤邊緣) -->
            <g id="layer-vessels">
              <!-- (A) 心房到心室瓣膜處向下箭頭 -->
              <!-- 三尖瓣 (右心房 ➔ 右心室) -->
              <line id="path-valve-r" data-blood="deoxy" class="vessel-path cursor-pointer"
                onclick="selectNode('valve-r')" x1="460" y1="350" x2="460" y2="440" stroke="#0f172a" stroke-width="4.5"
                stroke-linecap="round" marker-end="url(#arr-black)" />
              <!-- 二尖瓣 (左心房 ➔ 左心室) -->
              <line id="path-valve-l" data-blood="oxy" class="vessel-path cursor-pointer"
                onclick="selectNode('valve-l')" x1="640" y1="350" x2="640" y2="440" stroke="#0f172a" stroke-width="4.5"
                stroke-linecap="round" marker-end="url(#arr-black)" />

              <!-- (B) 心室射血短箭頭 (左心室往下至主動脈、右心室往下至肺動脈) -->
              <!-- 右心室射出 (右心室 ➔ 肺動脈標籤頂端) -->
              <line id="path-rv-exit" data-blood="deoxy" class="vessel-path cursor-pointer"
                onclick="selectNode('pul-artery')" x1="460" y1="500" x2="460" y2="570" stroke="#0f172a"
                stroke-width="4.5" stroke-linecap="round" marker-end="url(#arr-black)" />
              <!-- 左心室射出 (左心室 ➔ 主動脈標籤頂端) -->
              <line id="path-lv-exit" data-blood="oxy" class="vessel-path cursor-pointer" onclick="selectNode('aorta')"
                x1="640" y1="500" x2="640" y2="570" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"
                marker-end="url(#arr-black)" />

              <!-- (C) 下方兩條交叉主幹長弧線 (自主動脈、肺動脈標籤底端出發，交叉導向全身/肺微血管) -->
              <!-- 主動脈長弧：自主動脈標籤底端 (x=640, y=630) ➔ 向下向左弧線跨越 ➔ 導向小動脈底端 (y=625) -->
              <path id="path-aorta" data-blood="oxy" class="vessel-path cursor-pointer" onclick="selectNode('aorta')"
                d="M 640 630 C 640 740, 430 765, 140 625" fill="none" stroke="#0f172a" stroke-width="4.8"
                stroke-linecap="round" marker-end="url(#arr-black)" />
              <!-- 肺動脈長弧：自肺動脈標籤底端 (x=460, y=630) ➔ 向下向右弧線跨越 ➔ 導向肺部微血管底端 (y=532) -->
              <path id="path-pul-artery" data-blood="deoxy" class="vessel-path cursor-pointer"
                onclick="selectNode('pul-artery')" d="M 460 630 C 460 740, 670 765, 960 532" fill="none"
                stroke="#0f172a" stroke-width="4.8" stroke-linecap="round" marker-end="url(#arr-black)" />

              <!-- (D) 左側體循環分段箭頭 (完全銜接標籤之間) -->
              <!-- 小動脈標籤頂端 (y=565) ➔ 組織微血管標籤底端 (y=532) -->
              <line id="path-sys-arteriole-to-cap" data-blood="oxy" class="vessel-path cursor-pointer"
                onclick="selectNode('sys-cap')" x1="140" y1="565" x2="140" y2="532" stroke="#0f172a" stroke-width="4.5"
                stroke-linecap="round" marker-end="url(#arr-black)" />
              <!-- 組織微血管標籤頂端 (y=470) ➔ 小靜脈標籤底端 (y=425) -->
              <line id="path-sys-cap-to-venule" data-blood="deoxy" class="vessel-path cursor-pointer"
                onclick="selectNode('sys-venule')" x1="140" y1="470" x2="140" y2="425" stroke="#0f172a"
                stroke-width="4.5" stroke-linecap="round" marker-end="url(#arr-black)" />
              <!-- 小靜脈標籤頂端 (y=365) ➔ 弧形導向上下大靜脈標籤左端 (x=205, y=175) -->
              <path id="path-sys-venule-to-cava" data-blood="deoxy" class="vessel-path cursor-pointer"
                onclick="selectNode('vena-cava')" d="M 140 365 C 140 250, 160 185, 205 175" fill="none" stroke="#0f172a"
                stroke-width="4.5" stroke-linecap="round" marker-end="url(#arr-black)" />
              <!-- 上下大靜脈標籤右端 (x=395, y=175) ➔ 導向右心房標籤頂端 (x=460, y=290) -->
              <path id="path-sys-cava-to-ra" data-blood="deoxy" class="vessel-path cursor-pointer"
                onclick="selectNode('ra')" d="M 395 175 C 430 175, 460 215, 460 290" fill="none" stroke="#0f172a"
                stroke-width="4.5" stroke-linecap="round" marker-end="url(#arr-black)" />

              <!-- (E) 右側肺循環分段箭頭 (肺部微血管向上流回左心) -->
              <!-- 肺部微血管頂端 (y=470) ➔ 弧形導向肺靜脈標籤右端 (x=885, y=175) (預留足夠箭頭空間) -->
              <path id="path-pul-cap-to-vein" data-blood="oxy" class="vessel-path cursor-pointer"
                onclick="selectNode('pul-vein')" d="M 960 470 C 960 250, 935 185, 885 175" fill="none" stroke="#0f172a"
                stroke-width="4.5" stroke-linecap="round" marker-end="url(#arr-black)" />
              <!-- 肺靜脈標籤左端 (x=715, y=175) ➔ 導向左心房標籤頂端 (x=640, y=290) (預留足夠箭頭空間) -->
              <path id="path-pul-vein-to-la" data-blood="oxy" class="vessel-path cursor-pointer"
                onclick="selectNode('la')" d="M 715 175 C 665 175, 640 215, 640 290" fill="none" stroke="#0f172a"
                stroke-width="4.5" stroke-linecap="round" marker-end="url(#arr-black)" />
            </g>

            <!-- 5. 氣體交換說明框與指示引線 (已依要求移除) -->
            <g id="layer-sketch-guides" class="pointer-events-none hidden">
            </g>

            <!-- 6. 互動式標籤圖層 (放大尺寸、大字體、節點端點串接) -->
            <g id="layer-labels"></g>

            <!-- 6.5 多顆紅血球連續循環圖層 (Multi-RBC Continuous Hemodynamic Layer) -->
            <g id="layer-continuous-rbcs" class="pointer-events-none"></g>

            <!-- 7. O₂ / CO₂ 動態循環旅程粒子 -->
            <g id="layer-journey-particle" class="hidden pointer-events-none">
              <!-- 粒子主體圓球 -->
              <circle id="journey-ball" cx="960" cy="500" r="23" fill="#ef4444" stroke="#ffffff" stroke-width="3.5" />
              <!-- 粒子中心文字 (O₂ 或 CO₂) -->
              <text id="journey-gas-text" x="960" y="507" text-anchor="middle" fill="#ffffff"
                class="text-[15px] font-black tracking-tight">O₂</text>
            </g>

          </g><!-- 結束 #viewport-group -->
        </svg>

        <!-- 懸浮 Pan / Zoom 操作列 (左下角) -->
        <div
          class="absolute bottom-3 left-3 z-20 flex items-center gap-1.5 bg-white/95 backdrop-blur border border-slate-300 shadow-md rounded-xl p-1.5">
          <button onclick="zoomCanvas(1.2)"
            class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-800 font-black text-lg flex items-center justify-center transition"
            title="放大">＋</button>
          <span id="zoom-level-badge" onclick="resetPanZoom()"
            class="px-2.5 text-xs font-black text-slate-700 cursor-pointer hover:text-indigo-600"
            title="點擊重置">100%</span>
          <button onclick="zoomCanvas(1/1.2)"
            class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-800 font-black text-lg flex items-center justify-center transition"
            title="縮小">－</button>
          <div class="h-4 w-[1px] bg-slate-200 mx-0.5"></div>
          <button onclick="resetPanZoom()" class="px-2.5 h-8 rounded-lg hover:bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center transition">置中重置</button>
        </div>

        <!-- 懸浮快捷切換列 (右下角) -->
        <div class="absolute bottom-3 right-3 z-20 flex items-center gap-2">
          <button onclick="toggleRightSidebar()" id="btn-floating-sidebar"

    function buildLabelsDOM() {
      const container = document.getElementById('layer-labels');
      container.innerHTML = '';

      NODES_DATA.forEach(node => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('id', `label-group-${node.id}`);
        g.setAttribute('transform', `translate(${node.x}, ${node.y})`);
        g.setAttribute('class', 'node-interactive');
        g.addEventListener('click', (e) => {
          e.stopPropagation();
          if (state.pointerMoved) return;
          handleNodeClick(node.id);
        });

        const halfW = node.width / 2;
        const halfH = node.height / 2;

        // 選中高亮外光環
        const halo = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        halo.setAttribute('id', `label-halo-${node.id}`);
        halo.setAttribute('x', -(halfW + 4));
        halo.setAttribute('y', -(halfH + 4));
        halo.setAttribute('width', node.width + 8);
        halo.setAttribute('height', node.height + 8);
        halo.setAttribute('rx', '12');
        halo.setAttribute('fill', 'none');
        halo.setAttribute('stroke', '#f59e0b');
        halo.setAttribute('stroke-width', '3.5');
        halo.setAttribute('opacity', '0');
        g.appendChild(halo);

        // 標籤卡片本體
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('id', `label-rect-${node.id}`);
        rect.setAttribute('x', -halfW);
        rect.setAttribute('y', -halfH);
        rect.setAttribute('width', node.width);
        rect.setAttribute('height', node.height);
        rect.setAttribute('rx', '9');
        g.appendChild(rect);

        // 文字節點 (字體放大一倍：原 15~16px 放大為 26~30px)
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('id', `label-text-${node.id}`);
        text.setAttribute('x', '0');
        text.setAttribute('y', '9');
        text.setAttribute('text-anchor', 'middle');
        g.appendChild(text);

        // 右上角血型小圓點
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('id', `label-dot-${node.id}`);
        dot.setAttribute('cx', halfW - 8);
        dot.setAttribute('cy', -halfH + 8);
        dot.setAttribute('r', '4.5');
        dot.setAttribute('fill', 'transparent');
        g.appendChild(dot);

        container.appendChild(g);
      });
    }

    function updateLabelsVisual() {
      NODES_DATA.forEach(node => {
        const isRevealed = state.visibleNodes.has(node.id);
        const isSelected = state.selectedNodeId === node.id;
        const isApproached = state.approachingNodeId === node.id;
        const group = document.getElementById(`label-group-${node.id}`);

        // 瓣膜 (valves)：依據 state.showValves toggle 開關決定是否顯示標籤包含文字與框線
        if (node.category === 'valves' && !state.showValves && !isSelected) {
          if (group) group.style.display = 'none';
          return;
        } else if (group) {
          group.style.display = '';
        }

        const halo = document.getElementById(`label-halo-${node.id}`);
        const rect = document.getElementById(`label-rect-${node.id}`);
        const text = document.getElementById(`label-text-${node.id}`);
        const dot = document.getElementById(`label-dot-${node.id}`);

        let bgFill = '#ffffff';
        let strokeColor = '#0f172a';
        let textColor = '#0f172a';

        if (!isRevealed) {
          bgFill = '#f8fafc';
          strokeColor = '#64748b';
          textColor = '#64748b';
        } else {
          if (state.bloodColorMode === 'oxy' || state.bloodColorMode === 'both') {
            if (node.blood === 'oxy') {
              bgFill = '#fef2f2';
              strokeColor = '#dc2626';
              textColor = '#991b1b';
            }
          }
          if (state.bloodColorMode === 'deoxy' || state.bloodColorMode === 'both') {
            if (node.blood === 'deoxy') {
              bgFill = '#eff6ff';
              strokeColor = '#1d4ed8';
              textColor = '#1e3a8a';
            }
          }
          if (state.bloodColorMode !== 'bw' && (node.blood === 'exchange-sys' || node.blood === 'exchange-pul')) {
            bgFill = '#faf5ff';
            strokeColor = '#7e22ce';
            textColor = '#581c87';
          }
        }

        if (isSelected) {
          strokeColor = '#d97706';
        }

        // 單顆紅血球或氣體分子經過時 highlight / 離開時 dim
        const isDynamicFlowTracking = (state.continuousRBCRunning && state.rbcCount === 1) || state.journeyPlaying;
        if (isDynamicFlowTracking) {
          if (isApproached) {
            // 自動 highlight：如同被 click 的 highlight 邊框，保持原坐標不移動/不放大文字
            strokeColor = '#d97706'; // 與 click 選中相同之金色 highlight
            halo.setAttribute('stroke', '#f59e0b');
            halo.setAttribute('stroke-width', '4');
            halo.setAttribute('opacity', '1');
            rect.setAttribute('stroke', '#d97706');
            rect.setAttribute('stroke-width', '3.5');
            group.style.opacity = '1';
            group.style.transition = 'opacity 0.15s ease';
          } else {
            // 離開時 dim 標籤 (降低透明度)
            halo.setAttribute('opacity', isSelected ? '1' : '0');
            group.style.opacity = '0.38';
            group.style.transition = 'opacity 0.25s ease';
          }
        } else {
          // 一般狀態重置
          group.style.opacity = '1';
          halo.setAttribute('stroke', '#f59e0b');
          halo.setAttribute('stroke-width', '3.5');
          halo.setAttribute('opacity', isSelected ? '1' : '0');
        }

        rect.setAttribute('fill', bgFill);
        if (!isApproached || !isDynamicFlowTracking) {
          rect.setAttribute('stroke', strokeColor);
          rect.setAttribute('stroke-width', isSelected ? '3.2' : (isRevealed ? '2.4' : '2'));
        }

        // 瓣膜在開啟顯示時直接顯示其名稱
        if (!isRevealed && !(isApproached && isDynamicFlowTracking) && node.category !== 'valves') {
          rect.setAttribute('stroke-dasharray', '5 3');
          text.setAttribute('class', 'text-[24px] font-bold');
          text.textContent = '翻開';
        } else {
          rect.removeAttribute('stroke-dasharray');
          text.setAttribute('class', node.name.length >= 6 ? 'text-[24px] font-black' : 'text-[28px] font-black');
          text.textContent = node.name;
        }

        text.setAttribute('fill', textColor);
        if (dot) dot.setAttribute('fill', 'transparent');
      });
    }

    // =========================================================================
    // 5. 互動式事件與介面控制
    // =========================================================================
    function handleNodeClick(nodeId) {
      if (state.selectedNodeId === nodeId) {
        // 再次點選已選中的節點：取消 highlight 邊框
        state.selectedNodeId = null;
      } else {
        // 點選新節點：若尚未翻開則同時翻開，並設為選中 highlight
        if (!state.visibleNodes.has(nodeId)) {
          state.visibleNodes.add(nodeId);
        }
        state.selectedNodeId = nodeId;
      }
      updateLabelsVisual();
      updateDetailBanner(state.selectedNodeId);
    }

    function selectNode(nodeId, forceReveal = false) {
      if (forceReveal) state.visibleNodes.add(nodeId);
      state.selectedNodeId = nodeId;
      updateLabelsVisual();
      updateDetailBanner(nodeId);
    }

    function toggleCurrentNodeVisibility() {
      const id = state.selectedNodeId;
      if (state.visibleNodes.has(id)) state.visibleNodes.delete(id);
      else state.visibleNodes.add(id);
      updateLabelsVisual();
      updateDetailBanner(id);
    }

    function updateDetailBanner(nodeId) {
      const node = NODES_DATA.find(n => n.id === nodeId);
      if (!node) return;
      const isRevealed = state.visibleNodes.has(nodeId);

      const badgeEl = document.getElementById('detail-badge');
      if (badgeEl) {
        badgeEl.textContent = node.category === 'chambers' ? '心臟腔室' : (node.category === 'valves' ? '瓣膜' : '血管與微血管網');
      }
      const titleEl = document.getElementById('detail-title');
      if (titleEl) {
        titleEl.textContent = isRevealed ? node.name : '【已蓋牌隱藏 — 點擊標籤翻開】';
      }

      const bloodTag = document.getElementById('detail-blood-tag');
      if (bloodTag) {
        if (node.blood === 'oxy') {
          bloodTag.textContent = '充氧血 (高 O₂)';
          bloodTag.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-600 text-white';
        } else if (node.blood === 'deoxy') {
          bloodTag.textContent = '缺氧血 (高 CO₂)';
          bloodTag.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-700 text-white';
        } else {
          bloodTag.textContent = '氣體交換微血管網 (O₂ ⇄ CO₂)';
          bloodTag.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-700 text-white';
        }
      }

      const descEl = document.getElementById('detail-desc');
      if (descEl) descEl.textContent = node.desc;
      const extraEl = document.getElementById('detail-extra');
      if (extraEl) {
        extraEl.innerHTML = `
          <span class="bg-white border border-slate-200 px-2 py-0.5 rounded text-slate-700 font-bold">${node.connects}</span>
          <span class="bg-white border border-slate-200 px-2 py-0.5 rounded text-slate-700 font-bold">${node.circuit}</span>
        `;
      }
      const btnToggle = document.getElementById('btn-toggle-single');
      if (btnToggle) {
        btnToggle.textContent = isRevealed ? '隱藏此標籤' : '顯示此標籤';

    function setLabelFilter(mode) {
      if (mode === 'all') {
        state.visibleNodes = new Set(NODES_DATA.map(n => n.id));
        state.showValves = true;
      } else if (mode === 'none') {
        state.visibleNodes.clear();
        state.showValves = false;
      } else if (mode === 'chambers') {
        state.visibleNodes = new Set(NODES_DATA.filter(n => n.category === 'chambers').map(n => n.id));
      } else if (mode === 'vessels') {
        state.visibleNodes = new Set(NODES_DATA.filter(n => n.category === 'vessels').map(n => n.id));
      }

      updateValvesBtnStyle();

      ['all', 'none', 'chambers', 'vessels'].forEach(m => {
        const btn = document.getElementById(`btn-filter-${m}`);
        if (!btn) return;
        btn.className = (m === mode)
          ? 'px-2.5 py-1 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow-sm border border-slate-300'
          : 'px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-600 hover:bg-white';

      updateLabelsVisual();
      updateDetailBanner(state.selectedNodeId);
    }

    // =========================================================================
    // 7. O₂ 與 CO₂ 循環旅程粒子模擬
    // =========================================================================
    function selectJourneyMode(mode, autoStartFirstStep = true) {
      pauseJourney();
      state.journeyMode = mode;
      state.journeyStepIndex = 0;

      const btnFull = document.getElementById('btn-journey-full');
      const btnO2 = document.getElementById('btn-journey-o2');
      const btnCO2 = document.getElementById('btn-journey-co2');

      btnFull.className = mode === 'full_from_lung'
        ? 'px-3 py-2 rounded-xl border-2 border-emerald-600 bg-emerald-50 text-left transition flex items-center justify-between shadow-sm'
        : 'px-3 py-2 rounded-xl border-2 border-slate-200 hover:border-emerald-300 bg-white text-left transition flex items-center justify-between';

      btnO2.className = mode === 'o2_only'
        ? 'px-2.5 py-1.5 rounded-xl border-2 border-red-600 bg-red-50 text-left transition shadow-sm'
        : 'px-2.5 py-1.5 rounded-xl border-2 border-slate-200 hover:border-red-300 bg-white text-left transition';

      btnCO2.className = mode === 'co2_journey'
        ? 'px-2.5 py-1.5 rounded-xl border-2 border-blue-700 bg-blue-50 text-left transition shadow-sm'
        : 'px-2.5 py-1.5 rounded-xl border-2 border-slate-200 hover:border-blue-300 bg-white text-left transition';

      renderJourneyStepList();
      if (autoStartFirstStep) {
        goToJourneyStep(0, false);
      } else {
        updateJourneyStepUI(0);
      }
    }

    function renderJourneyStepList() {
      const listEl = document.getElementById('journey-steps-list');
      const steps = JOURNEYS[state.journeyMode].steps;
      listEl.innerHTML = '';

      steps.forEach((step, idx) => {
        const isCurrent = idx === state.journeyStepIndex;
        const isO2 = step.gas === 'O₂';
        const gasBadge = isO2
          ? '<span class="px-1.5 py-0.5 rounded text-[11px] font-black bg-red-600 text-white shrink-0">O₂</span>'
          : '<span class="px-1.5 py-0.5 rounded text-[11px] font-black bg-blue-700 text-white shrink-0">CO₂</span>';

        const item = document.createElement('button');
        item.type = 'button';
        item.onclick = () => {
          pauseJourney();
          goToJourneyStep(idx, true);
        };
        item.className = `w-full text-left px-2.5 py-1.5 rounded-lg text-xs flex items-center justify-between gap-1.5 transition border ${isCurrent
            ? 'bg-amber-50 border-amber-400 font-black text-slate-900 shadow-sm'
            : 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-700 font-medium'
          }`;
        item.innerHTML = `<span class="truncate">${step.title}</span>${gasBadge}`;
        listEl.appendChild(item);
      });
    }

    function applyParticleGasAppearance(step) {
      const isO2 = step.gas === 'O₂';
      const mainColor = isO2 ? '#ef4444' : '#2563eb';

      const pulse = document.getElementById('journey-pulse');
      if (pulse) pulse.setAttribute('stroke', mainColor);
      const ball = document.getElementById('journey-ball');
      if (ball) ball.setAttribute('fill', mainColor);
      const gasText = document.getElementById('journey-gas-text');
      if (gasText) {
        gasText.textContent = step.gas;
        gasText.setAttribute('class', isO2 ? 'text-[15px] font-black' : 'text-[13px] font-black');
      }

      const topIndicator = document.getElementById('journey-gas-indicator');
      if (topIndicator) {
        if (isO2) {
          topIndicator.textContent = '目前分子：O₂';
          topIndicator.className = 'text-xs font-black px-2.5 py-0.5 rounded-full bg-red-100 text-red-700 border border-red-300';
        } else {
          topIndicator.textContent = '目前分子：CO₂';
          topIndicator.className = 'text-xs font-black px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800 border border-blue-300';
        }
      }
      const stepGasTag = document.getElementById('journey-step-gas-tag');
      if (stepGasTag) {
        if (isO2) {
          stepGasTag.textContent = '目前分子：O₂';
          stepGasTag.className = 'text-xs font-black px-2 py-0.5 rounded bg-red-600 text-white';
        } else {
          stepGasTag.textContent = '目前分子：CO₂';
          stepGasTag.className = 'text-xs font-black px-2 py-0.5 rounded bg-blue-600 text-white';
        }
      }
    }

    function setParticlePosition(x, y) {
      const pulse = document.getElementById('journey-pulse');
      if (pulse) { pulse.setAttribute('cx', x); pulse.setAttribute('cy', y); }
      const ball = document.getElementById('journey-ball');
      if (ball) { ball.setAttribute('cx', x); ball.setAttribute('cy', y); }
      const gasText = document.getElementById('journey-gas-text');
      if (gasText) { gasText.setAttribute('x', x); gasText.setAttribute('y', y + 6); }
      const badge = document.getElementById('journey-badge');
      if (badge) badge.setAttribute('transform', `translate(${x}, ${y + 36})`);
      const callout = document.getElementById('journey-callout');
      if (callout) callout.setAttribute('transform', `translate(${x}, ${y - 36})`);
    }

    function updateJourneyStepUI(stepIdx) {
      const steps = JOURNEYS[state.journeyMode].steps;
      const step = steps[stepIdx];
      if (!step) return;

      const badgeEl = document.getElementById('journey-step-badge');
      if (badgeEl) badgeEl.textContent = `第 ${stepIdx + 1} / ${steps.length} 站`;
      const titleEl = document.getElementById('journey-step-title');
      if (titleEl) titleEl.textContent = step.title;
      const descEl = document.getElementById('journey-step-desc');
      if (descEl) descEl.textContent = step.desc;

      applyParticleGasAppearance(step);
      renderJourneyStepList();
    }

    function goToJourneyStep(stepIdx, animate = true, onComplete = null) {
      if (state.animFrameId) {
        cancelAnimationFrame(state.animFrameId);
        state.animFrameId = null;
      }

      const steps = JOURNEYS[state.journeyMode].steps;
      if (stepIdx < 0) stepIdx = steps.length - 1;
      if (stepIdx >= steps.length) stepIdx = 0;

      state.journeyStepIndex = stepIdx;
      const step = steps[stepIdx];

      document.getElementById('layer-journey-particle').classList.remove('hidden');
      selectNode(step.nodeId, false);
      updateJourneyStepUI(stepIdx);

      const pts = step.waypoints;
      if (!animate || pts.length <= 1) {
        const lastPt = pts[pts.length - 1];
        setParticlePosition(lastPt[0], lastPt[1]);
        if (onComplete) onComplete();
        return;
      }

      let segLengths = [];
      let totalLength = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
        segLengths.push(d);
        totalLength += d;
      }

      const duration = Math.max(450, (totalLength * 3.2) / state.journeySpeed);
      const startTime = performance.now();

      function detectParticleApproachingNode(x, y) {
        let closestNode = null;
        let minDist = Infinity;
        NODES_DATA.forEach(node => {
          if (node.isValve && !state.showValves) {
            return;
          }
          const dx = node.x - x;
          const dy = node.y - y;
          const dist = Math.hypot(dx, dy);
          const threshold = node.isValve ? 42 : 55;
          if (dist < threshold && dist < minDist) {
            minDist = dist;
            closestNode = node.id;
          }
        });
        if (state.approachingNodeId !== closestNode) {
          state.approachingNodeId = closestNode;
          updateLabelsVisual();
        }
      }

      function tick(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        const targetDist = t * totalLength;

        let acc = 0;
        let curX = pts[pts.length - 1][0];
        let curY = pts[pts.length - 1][1];

        for (let i = 0; i < segLengths.length; i++) {
          if (acc + segLengths[i] >= targetDist) {
            const localT = segLengths[i] === 0 ? 0 : (targetDist - acc) / segLengths[i];
            curX = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * localT;
            curY = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * localT;
            break;
          }
          acc += segLengths[i];
        }

        setParticlePosition(curX, curY);
        detectParticleApproachingNode(curX, curY);

        if (t < 1) {
          state.animFrameId = requestAnimationFrame(tick);
        } else {
          state.animFrameId = null;
          if (onComplete) onComplete();
        }
      }

      state.animFrameId = requestAnimationFrame(tick);
    }

    function togglePlayJourney() {
      if (state.journeyPlaying) {
        pauseJourney();
      } else {
        startPlayJourney();
      }
    }

    function startPlayJourney() {
      state.journeyPlaying = true;
      const playBtn = document.getElementById('btn-journey-play');
      playBtn.className = 'px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-xs font-black shadow-sm transition flex items-center gap-1';
      playBtn.innerHTML = '<span>⏸</span> <span>暫停播放</span>';

      function runNext() {
        if (!state.journeyPlaying) return;
        goToJourneyStep(state.journeyStepIndex, true, () => {
          if (!state.journeyPlaying) return;
          state.journeyTimer = setTimeout(() => {
            if (!state.journeyPlaying) return;
            const steps = JOURNEYS[state.journeyMode].steps;
            state.journeyStepIndex = (state.journeyStepIndex + 1) % steps.length;
            runNext();
          }, 950 / state.journeySpeed);
        });
      }

      runNext();
    }

    function pauseJourney() {
      state.journeyPlaying = false;
      if (state.journeyTimer) {
        clearTimeout(state.journeyTimer);
        state.journeyTimer = null;
      }
      if (state.animFrameId) {
        cancelAnimationFrame(state.animFrameId);
        state.animFrameId = null;
      }
      state.approachingNodeId = null;
      updateLabelsVisual();
      const playBtn = document.getElementById('btn-journey-play');
      if (playBtn) {
        playBtn.className = 'px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black shadow-sm transition flex items-center gap-1';
        playBtn.innerHTML = '<span>▶</span> <span>自動播放</span>';
      }
    }

    function stepJourney(delta) {
      pauseJourney();
      const steps = JOURNEYS[state.journeyMode].steps;
      const nextIdx = (state.journeyStepIndex + delta + steps.length) % steps.length;
      goToJourneyStep(nextIdx, true);
    }

    function stopJourney() {
      pauseJourney();
      state.approachingNodeId = null;
      document.getElementById('layer-journey-particle').classList.add('hidden');
      updateLabelsVisual();
    }

    function setJourneySpeed(val) {
      changeJourneySpeed(val);
    }

    function changeJourneySpeed(val) {
      state.journeySpeed = parseFloat(val) || 2.5;
      const lbl = document.getElementById('label-journey-speed');
      if (lbl) lbl.textContent = `${state.journeySpeed.toFixed(1)}x`;
      const slider = document.getElementById('slider-journey-speed');
      if (slider && slider.value !== val) slider.value = val;
    }

    // =========================================================================
    // 7.5 多顆紅血球連續真實循環系統 (Multi-RBC Continuous Hemodynamics)
    // =========================================================================
    function initContinuousRBCs() {
      const container = document.getElementById('layer-continuous-rbcs');
      container.innerHTML = '';
      state.rbcOffsets = [];

      for (let i = 0; i < state.rbcCount; i++) {
        state.rbcOffsets.push(i / state.rbcCount);

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('id', `rbc-group-${i}`);
        g.setAttribute('class', 'transition-opacity duration-300');

        // 紅血球外圈光暈
        const halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        halo.setAttribute('id', `rbc-halo-${i}`);
        halo.setAttribute('r', '13.5');
        halo.setAttribute('fill', 'none');
        halo.setAttribute('stroke-width', '2.5');
        halo.setAttribute('opacity', '0.45');
        g.appendChild(halo);

        // 雙凹圓盤造形外本體
        const disc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        disc.setAttribute('id', `rbc-disc-${i}`);
        disc.setAttribute('r', '10.5');
        disc.setAttribute('stroke', '#ffffff');
        disc.setAttribute('stroke-width', '1.6');
        g.appendChild(disc);

        // 紅血球中心凹槽反光感
        const inner = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        inner.setAttribute('id', `rbc-inner-${i}`);
        inner.setAttribute('r', '4.5');
        inner.setAttribute('fill', '#ffffff');
        inner.setAttribute('opacity', '0.45');
        g.appendChild(inner);

        // 氣體文字 (O₂ 或 CO₂)
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('id', `rbc-txt-${i}`);
        txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('dy', '3.8');
        txt.setAttribute('fill', '#ffffff');
        txt.setAttribute('class', 'text-[9.5px] font-black select-none pointer-events-none');
        g.appendChild(txt);

        container.appendChild(g);
      }
      updateContinuousRBCPositions(0);
    }

    // 顏色插值工具函數 (充氧鮮紅 #ef4444 ⇄ 缺氧藍紫 #2563eb)
    function interpolateColor(t) {
      // 0: 充氧血鮮紅 rgb(239, 68, 68)
      // 1: 缺氧血藍紫 rgb(37, 99, 235)
      const r = Math.round(239 + (37 - 239) * t);
      const g = Math.round(68 + (99 - 68) * t);
      const b = Math.round(68 + (235 - 68) * t);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function toggleContinuousRBCFlow() {
      if (state.continuousRBCRunning) {
        pauseContinuousRBCFlow();
      } else {
        startContinuousRBCFlow();
      }
    }

    function startContinuousRBCFlow() {
      // 如果單顆分子旅程正在播放，先暫停以避免衝突
      pauseJourney();

      state.continuousRBCRunning = true;
      state.lastTimestamp = performance.now();

      // 同步頂部按鈕與側邊欄按鈕
      document.getElementById('top-rbc-btn-text').textContent = '暫停多紅血球連續循環';
      document.getElementById('btn-top-rbc-flow').className = 'px-3 py-1 rounded-lg text-xs font-black transition bg-amber-500 hover:bg-amber-600 text-white shadow-sm flex items-center gap-1';

      document.getElementById('side-rbc-btn-text').textContent = '暫停血液循環';
      document.getElementById('side-rbc-icon').textContent = '';
      document.getElementById('btn-side-rbc-flow').className = 'flex-1 py-2.5 px-3 rounded-xl text-xs font-black bg-amber-500 hover:bg-amber-600 text-white shadow-sm flex items-center justify-center gap-2 transition active:scale-95';

      const statusBadge = document.getElementById('rbc-flow-status-badge');
      statusBadge.textContent = '血流流動中 (60 FPS)';
      statusBadge.className = 'text-[11px] font-black px-2.5 py-0.5 rounded-full bg-emerald-500 text-white animate-pulse';

      state.continuousAnimId = requestAnimationFrame(continuousRBCAnimationLoop);
    }

    function pauseContinuousRBCFlow() {
      state.continuousRBCRunning = false;
      if (state.continuousAnimId) {
        cancelAnimationFrame(state.continuousAnimId);
        state.continuousAnimId = null;
      }

      document.getElementById('top-rbc-btn-text').textContent = '啟動紅血球循環';
      document.getElementById('btn-top-rbc-flow').className = 'px-3 py-1 rounded-lg text-xs font-black transition bg-red-600 hover:bg-red-700 text-white shadow-sm flex items-center gap-1';

      document.getElementById('side-rbc-btn-text').textContent = '啟動連續血液循環';
      document.getElementById('side-rbc-icon').textContent = '';
      document.getElementById('btn-side-rbc-flow').className = 'flex-1 py-2.5 px-3 rounded-xl text-xs font-black bg-red-600 hover:bg-red-700 text-white shadow-sm flex items-center justify-center gap-2 transition active:scale-95';

      const statusBadge = document.getElementById('rbc-flow-status-badge');
      statusBadge.textContent = '已暫停';
      statusBadge.className = 'text-[11px] font-black px-2.5 py-0.5 rounded-full bg-slate-200 text-slate-700';

      state.approachingNodeId = null;
      updateLabelsVisual();
    }

    function resetContinuousRBCs() {
      pauseContinuousRBCFlow();
      state.approachingNodeId = null;
      initContinuousRBCs();
      updateLabelsVisual();
    }

    function changeRBCSpeed(val) {
      state.rbcSpeed = parseFloat(val) || 2.5;
      const lbl = document.getElementById('label-rbc-speed');
      if (lbl) lbl.textContent = `${state.rbcSpeed.toFixed(1)}x`;
      const slider = document.getElementById('slider-rbc-speed');
      if (slider && slider.value !== val) slider.value = val;
    }

    function changeRBCCount(val) {
      state.rbcCount = parseInt(val, 10);
      if (isNaN(state.rbcCount)) state.rbcCount = 0;
      document.getElementById('label-rbc-count').textContent = `${state.rbcCount} 顆`;
      initContinuousRBCs();
      if (state.continuousRBCRunning) {
        state.lastTimestamp = performance.now();
        state.continuousAnimId = requestAnimationFrame(continuousRBCAnimationLoop);
      }
    }

    function toggleRBCLabels(checked) {
      state.showRBCLabels = checked;
      for (let i = 0; i < state.rbcCount; i++) {
        const txt = document.getElementById(`rbc-txt-${i}`);
        if (txt) txt.setAttribute('opacity', checked ? '1' : '0');
      }
    }

    function continuousRBCAnimationLoop(now) {
      if (!state.continuousRBCRunning) return;

      const dt = (now - state.lastTimestamp) / 1000;
      state.lastTimestamp = now;

      // 基準跑完 8 字形完整循環約需要 22 秒
      const baseCycleSeconds = 22.0 / state.rbcSpeed;
      const progressDelta = dt / baseCycleSeconds;

      updateContinuousRBCPositions(progressDelta);
      state.continuousAnimId = requestAnimationFrame(continuousRBCAnimationLoop);
    }

    function updateContinuousRBCPositions(delta) {
      const fullPath = document.getElementById('path-continuous-full-circuit');
      if (!fullPath) return;

      const totalLength = fullPath.getTotalLength();
      let singleRBCPoint = null;

      for (let i = 0; i < state.rbcCount; i++) {
        let frac = (state.rbcOffsets[i] + delta) % 1.0;
        if (frac < 0) frac += 1.0;
        state.rbcOffsets[i] = frac;

        const distance = frac * totalLength;
        const pt = fullPath.getPointAtLength(distance);
        if (i === 0 && state.rbcCount === 1) {
          singleRBCPoint = pt;
        }

        const group = document.getElementById(`rbc-group-${i}`);
        const halo = document.getElementById(`rbc-halo-${i}`);
        const disc = document.getElementById(`rbc-disc-${i}`);
        const txt = document.getElementById(`rbc-txt-${i}`);

        if (!group) continue;
        group.setAttribute('transform', `translate(${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})`);

        // 動態生理換氣與顏色漸變計算 (8 字形路徑比例劃分)：
        // 0.00 ~ 0.22 : 體循環出心至小動脈 (充氧血，鮮紅，帶 O₂)
        // 0.22 ~ 0.32 : 全身組織微血管換氣 (O₂ 釋出給細胞，鮮紅漸變至深藍紫，紅血球不帶 O₂)
        // 0.32 ~ 0.72 : 上下大靜脈、右心、肺動脈 (缺氧血，深藍紫)
        // 0.72 ~ 0.82 : 肺部微血管外呼吸換氣 (吸收外側 O₂，藍紫漸變回鮮紅，重新攜帶 O₂)
        // 0.82 ~ 1.00 : 肺靜脈、左心 (充氧血，鮮紅，帶 O₂)
        // ※ 說明：紅血球主要運送氧氣，CO₂ 不是紅血球主要運送的，因此紅血球在缺氧血階段不標記 CO₂
        let colorStr = '#ef4444';
        let gasText = 'O₂';

        if (frac >= 0 && frac < 0.22) {
          colorStr = '#ef4444';
          gasText = 'O₂';
        } else if (frac >= 0.22 && frac < 0.32) {
          const t = (frac - 0.22) / 0.10;
          colorStr = interpolateColor(t);
          gasText = t < 0.5 ? 'O₂' : '';
        } else if (frac >= 0.32 && frac < 0.72) {
          colorStr = '#2563eb';
          gasText = '';
        } else if (frac >= 0.72 && frac < 0.82) {
          const t = 1 - (frac - 0.72) / 0.10;
          colorStr = interpolateColor(t);
          gasText = t < 0.5 ? '' : 'O₂';
        } else {
          colorStr = '#ef4444';
          gasText = 'O₂';
        }

        disc.setAttribute('fill', colorStr);
        halo.setAttribute('stroke', colorStr);

        if (txt) {
          txt.textContent = gasText;
          txt.setAttribute('opacity', state.showRBCLabels ? '1' : '0');
        }
      }

      // 當只有 1 顆紅血球時，動態偵測經過的標籤並自動 highlight，離開時 dim
      if (state.rbcCount === 1 && singleRBCPoint) {
        let closestNode = null;
        let minDist = Infinity;

        NODES_DATA.forEach(node => {
          // 若為瓣膜，必須在瓣膜有開啟（state.showValves 為 true）時才能被 highlight
          if (node.isValve && !state.showValves) {
            return;
          }
          const dx = node.x - singleRBCPoint.x;
          const dy = node.y - singleRBCPoint.y;
          const dist = Math.hypot(dx, dy);
          const threshold = node.isValve ? 42 : 55;
          if (dist < threshold && dist < minDist) {
            minDist = dist;
            closestNode = node.id;
          }
        });

        if (state.approachingNodeId !== closestNode) {
          state.approachingNodeId = closestNode;
          updateLabelsVisual();
        }
      } else if (state.approachingNodeId !== null) {
        state.approachingNodeId = null;
        updateLabelsVisual();
      }
    }

    // =========================================================================
    // 8. Pan & Zoom 畫布縮放與重置
    // =========================================================================
    function applyPanZoomTransform() {
      const vp = document.getElementById('viewport-group');
      if (!vp) return;
      vp.setAttribute('transform', `translate(${state.panX.toFixed(1)}, ${state.panY.toFixed(1)}) scale(${state.zoom.toFixed(3)})`);
      document.getElementById('zoom-level-badge').textContent = `${Math.round(state.zoom * 100)}%`;
    }

    function zoomCanvas(factor, clientX = null, clientY = null) {
      const svg = document.getElementById('circulation-svg');
      const newZoom = Math.min(3.2, Math.max(0.6, state.zoom * factor));
      const actualFactor = newZoom / state.zoom;

      let pivotX = 550, pivotY = 430;
      if (clientX !== null && clientY !== null && svg) {
        const pt = svg.createSVGPoint();
        pt.x = clientX;
        pt.y = clientY;
        const ctm = svg.getScreenCTM();
        if (ctm) {
          const svgPt = pt.matrixTransform(ctm.inverse());
          pivotX = svgPt.x;
          pivotY = svgPt.y;
        }
      }

      state.panX = pivotX - (pivotX - state.panX) * actualFactor;
      state.panY = pivotY - (pivotY - state.panY) * actualFactor;
      state.zoom = newZoom;
      applyPanZoomTransform();
    }

    function resetPanZoom() {
      state.zoom = 1.25;
      // 550 * (1 - 1.25) = -137.5, 430 * (1 - 1.25) = -107.5
      state.panX = -137.5;
      state.panY = -107.5;
      applyPanZoomTransform();
    }

    function setupPanZoomHandlers() {
      const viewport = document.getElementById('svg-viewport');
      const svg = document.getElementById('circulation-svg');

      // 點擊空白畫布區域：取消標籤的 highlight 邊框
      viewport.addEventListener('click', (e) => {
        if (state.pointerMoved) return;
        if (!e.target.closest('.node-interactive')) {
          if (state.selectedNodeId !== null) {
            state.selectedNodeId = null;
            updateLabelsVisual();
            updateDetailBanner(null);
          }
        }
      });

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.12 : (1 / 1.12);
        zoomCanvas(factor, e.clientX, e.clientY);
      }, { passive: false });

      viewport.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        state.isPanning = true;
        state.pointerMoved = false;
        state.startPanX = e.clientX;
        state.startPanY = e.clientY;
        viewport.classList.add('canvas-grabbing');
      });

      window.addEventListener('pointermove', (e) => {
        if (!state.isPanning) return;
        const dx = e.clientX - state.startPanX;
        const dy = e.clientY - state.startPanY;
        if (Math.hypot(dx, dy) > 4) state.pointerMoved = true;

        const rect = svg.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          const scale = Math.max(1100 / rect.width, 860 / rect.height);
          state.panX += dx * scale;
          state.panY += dy * scale;
          state.startPanX = e.clientX;
          state.startPanY = e.clientY;
          applyPanZoomTransform();
        }
      });

      window.addEventListener('pointerup', () => {
        if (state.isPanning) {
          state.isPanning = false;
          viewport.classList.remove('canvas-grabbing');
        }
      });
    }

    function resetBoard() {
      pauseContinuousRBCFlow();
      stopJourney();
      resetPanZoom();
      toggleHeartLines(true);
      toggleVesselLines(true);
      setBloodColorMode('bw');
      setCircuitHighlight('none');
      // 瓣膜預設不顯示標籤與框線
      state.showValves = false;
      state.visibleNodes = new Set(NODES_DATA.filter(n => n.category !== 'valves').map(n => n.id));
      ['all', 'none', 'chambers', 'vessels'].forEach(m => {
        const btn = document.getElementById(`btn-filter-${m}`);
        if (btn) btn.className = 'px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-600 hover:bg-white';
      });
      const btnAll = document.getElementById('btn-filter-all');
      if (btnAll) btnAll.className = 'px-2.5 py-1 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow-sm border border-slate-300';
      updateValvesBtnStyle();
      changeRBCCount(0);
      changeRBCSpeed(2.5);
      changeJourneySpeed(2.5);
      const selRBC = document.getElementById('select-rbc-count');
      if (selRBC) selRBC.value = '0';
      selectNode('lv', true);
    }

    window.addEventListener('DOMContentLoaded', initBoard);
  </script>
</body>
