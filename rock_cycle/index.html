<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>內營力・外營力與三大岩石的形成｜岩石循環互動動畫</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="mini">
      <button class="tbtn" id="miniOpen" title="顯示說明與控制面板">☰</button>
      <button class="tbtn" id="miniPrev" title="上一步">◀</button>
      <span id="miniTitle"></span>
      <button class="tbtn" id="miniNext" title="下一步">▶</button>
    </div>
    <div class="tools">
      <button class="tbtn" id="zIn" title="放大">＋</button>
      <button class="tbtn" id="zOut" title="縮小">－</button>
      <button class="tbtn" id="zFit" title="重設視角">⤢</button>
      <button class="tbtn" id="lblBtn" title="全部標籤顯示/隱藏 (L)">🏷</button>
    </div>
  </main>

  <aside id="panel">
    <div class="phead">
      <h1>內營力・外營力與三大岩石<small>岩石循環互動動畫</small></h1>
      <button class="nbtn" id="hidePanel" title="隱藏面板 (P)">✕</button>
    </div>
    <div class="nav">
      <div class="navrow">
        <button class="nbtn" id="prev" title="上一步 (←)">⏮</button>
        <button class="nbtn primary" id="play" title="自動播放 (空白鍵)">▶ 自動播放</button>
        <button class="nbtn" id="replay" title="重播此步驟 (R)">↺</button>
        <button class="nbtn" id="next" title="下一步 (→)">⏭</button>
      </div>
      <div class="navrow"><div class="prog"><i id="progBar"></i></div><span id="stepNo"></span></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="pbody">
      <div>
        <span id="stBadge"></span>
        <h2 id="stTitle"></h2>
        <div id="stDesc"></div>
        <div id="tracerNow"></div>
      </div>
      <div class="sec" id="rockSec"><h3>相關岩石／物質</h3><div class="rocks" id="rocks"></div></div>
      <div class="sec"><h3>岩石循環圖（點選可跳到相關步驟）</h3>
        <svg id="cycle" viewBox="0 0 300 250"></svg>
        <div class="legend" style="justify-content:center;margin-top:4px">
          <span><i style="background:var(--internal)"></i>內營力</span>
          <span><i style="background:var(--external)"></i>外營力</span>
          <span>- - - 捷徑</span>
        </div>
      </div>
      <div class="sec"><h3>顯示控制</h3>
        <div class="toggles">
          <label class="tg"><input type="checkbox" id="tGeo" checked>地形構造標籤</label>
          <label class="tg"><input type="checkbox" id="tProc" checked>岩石與過程標籤</label>
          <label class="tg"><input type="checkbox" id="tForce" checked>營力箭頭</label>
          <label class="tg"><input type="checkbox" id="tCam" checked>自動運鏡</label>
        </div>
        <div class="speed">動畫速度<input type="range" id="speed" min="0.25" max="2.5" step="0.25" value="1"><span id="speedV">1×</span></div>
      </div>
      <div class="sec"><h3>圖例</h3>
        <div class="legend">
          <span><i style="background:var(--magma)"></i>岩漿</span>
          <span><i style="background:var(--igneous)"></i>火成岩</span>
          <span><i style="background:var(--sediment)"></i>沉積物</span>
          <span><i style="background:var(--sedimentary)"></i>沉積岩</span>
          <span><i style="background:var(--metamorphic)"></i>變質岩</span>
        </div>
      </div>
      <div class="sec help"><h3>操作說明</h3>
        單指拖曳平移・雙指捏合縮放（滑鼠滾輪縮放）・雙擊重設視角<br>
        鍵盤：← → 切換步驟、空白鍵 播放/暫停、R 重播、L 標籤、P 面板
      </div>
    </div>
  </aside>
</div>
<script src="data.js"></script>
<script src="scene.js"></script>
<script src="fx.js"></script>
<script src="ui.js"></script>
</body>
</html>
