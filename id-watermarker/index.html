<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>身分證隱私防護浮水印</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-background">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <main class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <span class="shield-icon">🛡️</span>
        <h1>身分證隱私防護浮水印</h1>
      </div>
      <p class="subtitle">在本地端為證件相片加上限制用途的浮水印文字，安全且不洩漏個人隱私。</p>
      <div class="privacy-badge">
        <span class="badge-icon">🔒</span>
      </div>
    </header>

    <div class="main-layout">
      <!-- 控制面板 -->
      <section class="panel control-panel">
        <div class="section-title">
          <h2>浮水印設定</h2>
        </div>

        <div class="control-group">
          <label for="watermark-text">浮水印文字</label>
          <textarea id="watermark-text" rows="2" placeholder="例如：僅供 XX 銀行申辦信用卡使用，影本塗改無效。">僅供某某業務申辦使用，他用無效。</textarea>
          <div class="quick-tags">
            <button type="button" class="quick-tag-btn" data-text="僅供某某業務申辦使用，他用無效。">預設</button>
            <button type="button" class="quick-tag-btn" data-text="僅供申請信用卡使用，影本塗改與他用無效。">信用卡</button>
            <button type="button" class="quick-tag-btn" data-text="僅供辦理電話號碼申辦使用，影本複印無效。">辦門號</button>
            <button type="button" class="quick-tag-btn" data-text="僅供辦理保險業務使用，他用無效。">辦保險</button>
          </div>
        </div>

        <div class="control-row">
          <div class="control-group half">
            <label for="layout-mode">排版模式</label>
            <select id="layout-mode">
              <option value="grid" selected>滿版網格 (防裁切)</option>
              <option value="center">單一置中</option>
            </select>
          </div>
          <div class="control-group half">
            <label for="font-family">字型</label>
            <select id="font-family">
              <option value="Noto Sans TC, sans-serif" selected>黑體 (Noto Sans)</option>
              <option value="Microsoft JhengHei, sans-serif">微軟正黑體</option>
              <option value="DFKai-SB, serif">標楷體</option>
            </select>
          </div>
        </div>

        <div class="control-row">
          <div class="control-group half">
            <label for="font-color">文字顏色</label>
            <div class="color-picker-wrapper">
              <input type="color" id="font-color" value="#ffffff">
              <span id="color-hex">#FFFFFF</span>
            </div>
          </div>
          <div class="control-group half">
            <label for="watermark-opacity">透明度 (<span id="opacity-val">0.3</span>)</label>
            <input type="range" id="watermark-opacity" min="0.05" max="0.9" step="0.05" value="0.3">
          </div>
        </div>

        <div class="control-row">
          <div class="control-group half">
            <label for="font-size">字型大小 (<span id="size-val">32</span>px)</label>
            <input type="range" id="font-size" min="12" max="100" step="1" value="32">
          </div>
          <div class="control-group half">
            <label for="rotation-angle">旋轉角度 (<span id="angle-val">-30</span>°)</label>
            <input type="range" id="rotation-angle" min="-90" max="90" step="5" value="-30">
          </div>
        </div>

        <div class="control-group" id="grid-gap-group">
          <label for="grid-gap">網格密度 / 間距 (<span id="gap-val">120</span>px)</label>
          <input type="range" id="grid-gap" min="50" max="400" step="10" value="120">
        </div>

        <div class="action-buttons">
          <button id="download-btn" class="btn btn-primary" disabled>
            <span class="btn-icon">💾</span> 下載浮水印圖片 (JPG)
          </button>
          <button id="clear-btn" class="btn btn-secondary" disabled>
            <span class="btn-icon">🗑️</span> 清除圖片
          </button>
        </div>
      </section>

      <!-- 預覽與拖曳區 -->
      <section class="panel preview-panel">
        <div id="dropzone" class="dropzone">
          <input type="file" id="file-input" accept="image/*" class="file-input">
          <div class="dropzone-content">
            <div class="upload-icon">📥</div>
            <h3>將證件照片拖曳至此處</h3>
            <p>或點擊此處選擇照片檔案</p>
            <span class="file-limits">支援 JPG, PNG, WebP 格式</span>
          </div>
        </div>

        <div id="preview-container" class="preview-container hidden">
          <div class="preview-header">
            <span class="preview-title">即時預覽</span>
            <span class="image-info" id="image-info">0 x 0 px</span>
          </div>
          <div class="canvas-wrapper">
            <canvas id="preview-canvas"></canvas>
          </div>
        </div>
      </section>
    </div>
  </main>



  <script src="app.js"></script>
</body>

</html>
