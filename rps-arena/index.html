<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>剪刀石頭布大亂鬥 | RPS Arena</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top HUD -->
    <header class="hud-header">
      <div class="brand">
        <span class="brand-badge">RPS ARENA</span>
        <h1>剪刀石頭布大亂鬥</h1>
      </div>

      <!-- Live Faction Dominance Bar -->
      <div class="dominance-panel" aria-label="即時戰況比例">
        <div class="faction-counts">
          <button class="faction-pill rock active-predict" data-predict="rock" title="點擊預測石頭獲勝">
            <span class="emoji">✊</span>
            <span class="label">石頭</span>
            <span class="count" id="count-rock">12</span>
          </button>
          <button class="faction-pill scissors" data-predict="scissors" title="點擊預測剪刀獲勝">
            <span class="emoji">✌️</span>
            <span class="label">剪刀</span>
            <span class="count" id="count-scissors">12</span>
          </button>
          <button class="faction-pill paper" data-predict="paper" title="點擊預測布獲勝">
            <span class="emoji">🖐️</span>
            <span class="label">布</span>
            <span class="count" id="count-paper">12</span>
          </button>
        </div>
        <div class="ratio-bar" role="progressbar" aria-label="勢力比例條">
          <div class="ratio-seg rock" id="bar-rock" style="width: 33.33%"></div>
          <div class="ratio-seg scissors" id="bar-scissors" style="width: 33.33%"></div>
          <div class="ratio-seg paper" id="bar-paper" style="width: 33.34%"></div>
        </div>
      </div>

      <!-- Stats & Audio -->
      <div class="hud-meta">
        <div class="stat-chip">
          <span class="stat-label">時間</span>
          <span class="stat-val" id="timer-val">00:00</span>
        </div>
        <div class="stat-chip">
          <span class="stat-label">連勝預測</span>
          <span class="stat-val" id="streak-val">0</span>
        </div>
        <button id="btn-sound" class="icon-btn" title="切換音效" aria-label="切換音效">
          <span id="sound-icon">🔊</span>
        </button>
      </div>
    </header>

    <!-- Main Arena Canvas -->
    <main class="arena-wrapper">
      <canvas id="arena-canvas"></canvas>

      <!-- Start / Ready Overlay -->
      <div id="start-overlay" class="overlay visible">
        <div class="modal-card">
          <div class="modal-icons">✊ ✌️ 🖐️</div>
          <h2>準備好開戰了嗎？</h2>
          <p class="modal-desc">
            三方軍團將從畫面角落出發，朝中央集結對戰！<br />
            碰撞後依規則<strong>將輸家同化為贏家</strong>，直到全場統一為止。
          </p>
          <div class="predict-box">
            <span class="predict-title">先預測本局最終霸主：</span>
            <div class="predict-options" id="start-predict-options">
              <button class="predict-btn selected" data-type="rock">✊ 石頭</button>
              <button class="predict-btn" data-type="scissors">✌️ 剪刀</button>
              <button class="predict-btn" data-type="paper">🖐️ 布</button>
            </div>
          </div>
          <button id="btn-start" class="primary-btn">開始對戰 (開啟音效)</button>
        </div>
      </div>

      <!-- Victory Overlay -->
      <div id="victory-overlay" class="overlay">
        <div class="modal-card victory-card">
          <div class="winner-badge" id="winner-emoji">✊</div>
          <h2 id="winner-title">石頭 稱霸全場！</h2>
          <p id="prediction-result" class="predict-result"></p>
          <div class="victory-stats">
            <div class="v-stat">
              <span>對戰時間</span>
              <strong id="v-time">00:00</strong>
            </div>
            <div class="v-stat">
              <span>同化次數</span>
              <strong id="v-conversions">0</strong>
            </div>
            <div class="v-stat">
              <span>最終數量</span>
              <strong id="v-total">36</strong>
            </div>
          </div>
          <button id="btn-play-again" class="primary-btn">再戰一局</button>
        </div>
      </div>
    </main>

    <!-- Bottom Control Dock -->
    <footer class="control-dock">
      <div class="dock-group">
        <button id="btn-pause" class="ctrl-btn">⏸ 暫停</button>
        <button id="btn-restart" class="ctrl-btn">🔄 重開</button>
        <button id="btn-speed" class="ctrl-btn" title="切換模擬速度">⚡ 1x</button>
      </div>

      <div class="dock-group interactive-tools">
        <span class="dock-label">場上點擊：</span>
        <button class="tool-btn active" data-tool="shockwave" title="點擊場地產生衝擊波彈開角色">💥 衝擊波</button>
        <button class="tool-btn" data-tool="rock" title="點擊場地空降石頭">✊ 空降</button>
        <button class="tool-btn" data-tool="scissors" title="點擊場地空降剪刀">✌️ 空降</button>
        <button class="tool-btn" data-tool="paper" title="點擊場地空降布">🖐️ 空降</button>
      </div>

      <div class="dock-group slider-group">
        <label for="count-slider">每隊數量: <strong id="slider-val">12</strong></label>
        <input type="range" id="count-slider" min="4" max="30" value="12" />
      </div>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
