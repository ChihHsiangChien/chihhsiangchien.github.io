<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>微血管、組織液與淋巴系統功能動態展示</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="title-group">
      <span class="badge">生物互動動態教學</span>
      <h1>微血管、組織液與淋巴系統動態模擬</h1>
    </div>

    <!-- 平板友善大尺寸雙分頁切換 (預設分頁 1 為特寫) -->
    <nav class="tab-switcher" role="tablist">
      <button class="main-tab-btn active" id="tabBtn1" data-tab="1" role="tab">
        <span>🔬</span>
        <span>分頁 1：組織間隙中的微淋巴管特寫 (微循環與盲端吸收)</span>
      </button>
      <button class="main-tab-btn" id="tabBtn2" data-tab="2" role="tab">
        <span>🌿</span>
        <span>分頁 2：淋巴系統全覽 (微淋巴管 ➔ 淋巴管 ➔ 淋巴結)</span>
      </button>
    </nav>
  </header>

  <main class="main-container">
    <!-- 左側：互動動態畫布 (純淨沉浸視野，控制全數集中於右側) -->
    <section class="canvas-panel">
      <canvas id="simCanvas" width="900" height="620"></canvas>

      <!-- 畫布底部圖例與操作提示 -->
      <div class="canvas-legend">
        <div class="legend-items">
          <span class="legend-item"><i class="dot dot-rbc"></i>紅血球 (留存血管)</span>
          <span class="legend-item"><i class="dot dot-plasma"></i>血漿/氧氣養分 (滲出進入細胞)</span>
          <span class="legend-item"><i class="dot dot-tissue-fluid"></i>組織液/代謝廢物 (進出細胞)</span>
          <span class="legend-item"><i class="dot dot-lymph"></i>淋巴液 (進入微淋巴管盲端)</span>
          <span class="legend-item"><i class="dot dot-macrophage"></i>巨噬細胞/淋巴球</span>
          <span class="legend-item"><i class="dot dot-germ"></i>病原體/細菌</span>
        </div>
        <span class="hint-pill" id="focusHintPill">👆 點擊右側構造按鈕可「複選呈現」（例如同時勾選小動脈與微血管，其他淡化）</span>
      </div>
    </section>

    <!-- 右側：統一控制面板 (分子觀察、構造複選、顯示開關、生理實驗) -->
    <aside class="side-panel">
      <!-- 1. 觀察對象與顯示控制卡 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">🔬 觀察對象與顯示控制</div>
        </div>

        <!-- 1a. 觀察分子 / 元素 (單選聚焦切換，右上角全選/重置) -->
        <div class="control-subgroup">
          <div class="subgroup-header-row">
            <span class="subgroup-label" id="lblMolGroup">💧 觀察分子切換 (單選聚焦)</span>
            <div class="btn-group-action">
              <button class="btn-text-action" id="btnSelectAllMol" title="同時顯示全部動態分子">全部</button>
              <button class="btn-text-action btn-reset" id="btnResetMol" title="重置為預設分子（紅血球）">重置</button>
            </div>
          </div>
          
          <!-- 分頁 1 專用：分子切換 (2x2 工整網格) -->
          <div class="mol-pill-grid" id="molFilterGroup1" role="tablist">
            <button class="mol-tab-btn" data-molmode="water" title="只看微血管壁滲出的水分與盲端微淋巴管吸收">
              <span class="mol-tab-dot" style="background:#38bdf8;"></span>
              <span>💧 水分滲出與吸收</span>
            </button>
            <button class="mol-tab-btn" data-molmode="nutrient" title="只看氧氣(O2)與葡萄糖等養分進入細胞">
              <span class="mol-tab-dot" style="background:#22d3ee;"></span>
              <span>🍏 氧氣與養分</span>
            </button>
            <button class="mol-tab-btn" data-molmode="waste" title="只看二氧化碳(CO2)與代謝廢物排出細胞">
              <span class="mol-tab-dot" style="background:#c084fc;"></span>
              <span>💨 CO₂ 與代謝廢物</span>
            </button>
            <button class="mol-tab-btn active" data-molmode="rbc" title="只看微血管內紅血球巡航流動(鮮紅➔暗紅)">
              <span class="mol-tab-dot" style="background:#ef4444;"></span>
              <span>🔴 紅血球 (單行血流)</span>
            </button>
          </div>

          <!-- 分頁 2 專用：全景元素切換 (2x2 工整網格) -->
          <div class="mol-pill-grid hidden" id="molFilterGroup2" role="tablist">
            <button class="mol-tab-btn" data-molmode2="plasma" title="只看血漿滲出與淋巴液回流">
              <span class="mol-tab-dot" style="background:#38bdf8;"></span>
              <span>💧 血漿與淋巴</span>
            </button>
            <button class="mol-tab-btn" data-molmode2="germ" title="只看細菌病原體入侵與吞噬">
              <span class="mol-tab-dot" style="background:#a855f7;"></span>
              <span>🦠 細菌病原體</span>
            </button>
            <button class="mol-tab-btn" data-molmode2="macrophage" title="只看淋巴結巨噬細胞防禦">
              <span class="mol-tab-dot" style="background:#0ea5e9;"></span>
              <span>🛡️ 巨噬細胞吞噬</span>
            </button>
            <button class="mol-tab-btn active" data-molmode2="rbc" title="只看血管內紅血球流動">
              <span class="mol-tab-dot" style="background:#ef4444;"></span>
              <span>🔴 紅血球</span>
            </button>
          </div>
        </div>

        <!-- 1b. 構造呈現開關 (支援多選/複選) -->
        <div class="control-subgroup">
          <div class="subgroup-header-row">
            <span class="subgroup-label">👁️ 構造呈現開關 (可複選)</span>
            <div class="btn-group-action">
              <button class="btn-text-action" id="btnSelectAllStruct" title="全部構造同時呈現">全部</button>
              <button class="btn-text-action btn-reset" id="btnResetStruct" title="重置為三大血管預設狀態（小動脈、微血管、小靜脈）">重置</button>
            </div>
          </div>

          <!-- 分頁 1 專用構造複選按鈕 (預設進入勾選小動脈、微血管網、小靜脈) -->
          <div class="struct-chip-grid" id="structFilterTab1">
            <button class="struct-chip-btn active" data-s1="arteriole" title="小動脈 (血液流入端)">
              <span class="chip-color-dot" style="background:#ef4444;"></span>
              <span class="chip-label">小動脈</span>
              <span class="chip-check">✓</span>
            </button>
            <button class="struct-chip-btn active" data-s1="capillaryBed" title="微血管網 (物質交換與血漿滲出)">
              <span class="chip-color-dot" style="background:#e11d48;"></span>
              <span class="chip-label">微血管網</span>
              <span class="chip-check">✓</span>
            </button>
            <button class="struct-chip-btn active" data-s1="venule" title="小靜脈 (血液回流端)">
              <span class="chip-color-dot" style="background:#0284c7;"></span>
              <span class="chip-label">小靜脈</span>
              <span class="chip-check">✓</span>
            </button>
            <button class="struct-chip-btn" data-s1="tissue" title="組織細胞與組織間隙">
              <span class="chip-color-dot" style="background:#ca8a04;"></span>
              <span class="chip-label">組織細胞</span>
              <span class="chip-check">✓</span>
            </button>
            <button class="struct-chip-btn" data-s1="lymphCapillary" title="微淋巴管 (盲端吸收組織液)">
              <span class="chip-color-dot" style="background:#84cc16;"></span>
              <span class="chip-label">微淋巴管</span>
              <span class="chip-check">✓</span>
            </button>
            <button class="struct-chip-btn" data-s1="lymphVessel" title="淋巴管 (匯集網)">
              <span class="chip-color-dot" style="background:#15803d;"></span>
              <span class="chip-label">淋巴管</span>
              <span class="chip-check">✓</span>
            </button>
          </div>

          <!-- 分頁 2 專用構造複選按鈕 -->
          <div class="struct-chip-grid hidden" id="structFilterTab2">
            <button class="struct-chip-btn active" data-s2="capillary" title="微血管">
              <span class="chip-color-dot" style="background:#ef4444;"></span>
              <span class="chip-label">微血管</span>
              <span class="chip-check">✓</span>
            </button>
            <button class="struct-chip-btn active" data-s2="tissueCells" title="組織細胞與水腫間隙">
              <span class="chip-color-dot" style="background:#ca8a04;"></span>
              <span class="chip-label">組織細胞</span>
              <span class="chip-check">✓</span>
            </button>
            <button class="struct-chip-btn active" data-s2="lymphCapillary" title="微淋巴管與盲端剖面窗">
              <span class="chip-color-dot" style="background:#84cc16;"></span>
              <span class="chip-label">微淋巴管</span>
              <span class="chip-check">✓</span>
            </button>
            <button class="struct-chip-btn active" data-s2="afferent" title="輸入淋巴管與瓣膜">
              <span class="chip-color-dot" style="background:#22c55e;"></span>
              <span class="chip-label">輸入管與瓣膜</span>
              <span class="chip-check">✓</span>
            </button>
            <button class="struct-chip-btn active" data-s2="lymphNode" title="淋巴結 (巨噬細胞吞噬)">
              <span class="chip-color-dot" style="background:#15803d;"></span>
              <span class="chip-label">淋巴結</span>
              <span class="chip-check">✓</span>
            </button>
            <button class="struct-chip-btn active" data-s2="efferent" title="輸出淋巴管">
              <span class="chip-color-dot" style="background:#166534;"></span>
              <span class="chip-label">輸出淋巴管</span>
              <span class="chip-check">✓</span>
            </button>
            <button class="struct-chip-btn active full-col" data-s2="nodeVessels" title="淋巴結動脈與靜脈">
              <span class="chip-color-dot" style="background:#0284c7;"></span>
              <span class="chip-label">淋巴結動靜脈</span>
              <span class="chip-check">✓</span>
            </button>
          </div>
        </div>

        <!-- 1c. 畫面顯示設定與動畫 Toggle (預設勾選聚焦淡化背景、流向箭頭) -->
        <div class="control-subgroup">
          <div class="subgroup-label">⚙️ 畫面標示與動畫開關</div>
          <div class="toggles-grid">
            <label class="chip-toggle" title="開啟後點選任一構造會淡化其他背景構造">
              <input type="checkbox" id="chkDimOthers" checked />
              <span>聚焦淡化背景</span>
            </label>
            <label class="chip-toggle">
              <input type="checkbox" id="chkLabels" />
              <span>構造標示</span>
            </label>
            <label class="chip-toggle">
              <input type="checkbox" id="chkArrows" checked />
              <span>流向箭頭</span>
            </label>
            <label class="chip-toggle">
              <input type="checkbox" id="chkPause" />
              <span>暫停動畫</span>
            </label>
          </div>
        </div>
      </div>

      <!-- 2. 生理互動操作實驗卡 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">🧪 生理互動操作實驗</div>
        </div>

        <div class="action-grid">
          <button class="action-btn btn-pump" id="btnPlasmaBurst">
            <span>💧</span> 加速血漿滲出
          </button>
          <button class="action-btn btn-squeeze" id="btnSqueezeLymph">
            <span>💪</span> 擠壓推進淋巴
          </button>
          <button class="action-btn btn-germ" id="btnInjectGerm">
            <span>🦠</span> 投放細菌 (看吞噬)
          </button>
          <button class="action-btn btn-edema" id="btnToggleEdema">
            <span>⚠️</span> 模擬淋巴阻塞水腫
          </button>
        </div>

        <div class="slider-row">
          <div class="slider-label-line">
            <span>微血管血漿滲出速率 (微血管血壓)</span>
            <span id="lblFiltration">正常 (1.0x)</span>
          </div>
          <input type="range" id="rngFiltration" min="0.4" max="2.6" step="0.2" value="1.0" />
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-val" style="color:#4ade80" id="statTissue">正常 (無水腫)</span>
            <span class="stat-name">組織間隙狀態</span>
          </div>
          <div class="stat-item">
            <span class="stat-val" style="color:#84cc16" id="statLymphFlow">單向順暢</span>
            <span class="stat-name">淋巴管回流</span>
          </div>
          <div class="stat-item">
            <span class="stat-val" style="color:#c084fc" id="statFiltered">0 隻</span>
            <span class="stat-name">淋巴結已清除細菌</span>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
