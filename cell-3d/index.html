<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="3D 細胞與胞器立體模型教學套件：高擬真動物細胞全景剖面、粒線體雙層膜、葉綠體葉綠餅、雙凹紅血球與細胞膜流體鑲嵌模型。">
  <title>3D 細胞與胞器立體模型 (Cell-3D Unified Suite)</title>
  <link rel="stylesheet" href="style.css">

  <!-- ES Module Shims polyfill for cross-browser importmap support -->
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app-container">
    <!-- 3D 渲染畫布容器 -->
    <div id="canvas-container"></div>

    <!-- 頂部導航與標題 -->
    <header class="top-header">
      <div class="brand-section">
        <a href="../index.html" class="back-home-btn" title="返回生物教學首頁">
          <span>←</span>
          <span>首頁</span>
        </a>
        <div class="app-title-group">
          <h1>3D 細胞與胞器立體模型</h1>
          <p>Cell-3D Unified Educational Suite</p>
        </div>
      </div>

      <!-- 頂部模型切換分頁列 (Navigation Contract) -->
      <nav class="nav-tab-container" role="tablist">
        <button class="tab-btn active" data-model="animalCell" role="tab" aria-selected="true">
          <span class="tab-icon">🔬</span>
          <span>動物細胞全景</span>
        </button>
        <button class="tab-btn" data-model="mitochondria" role="tab" aria-selected="false">
          <span class="tab-icon">⚡</span>
          <span>粒線體剖面</span>
        </button>
        <button class="tab-btn" data-model="chloroplast" role="tab" aria-selected="false">
          <span class="tab-icon">🌿</span>
          <span>葉綠體與基粒</span>
        </button>
        <button class="tab-btn" data-model="rbc" role="tab" aria-selected="false">
          <span class="tab-icon">🩸</span>
          <span>雙凹紅血球</span>
        </button>
        <button class="tab-btn" data-model="membrane" role="tab" aria-selected="false">
          <span class="tab-icon">🧱</span>
          <span>細胞膜流體鑲嵌</span>
        </button>
      </nav>
    </header>

    <!-- 懸浮科學解說卡片 (HUD Information Card) -->
    <aside id="info-card" class="info-card" aria-label="胞器構造詳細解說">
      <div class="card-header">
        <div class="card-title-wrap">
          <span class="badge" id="card-badge">真核細胞構造</span>
          <h2 id="card-title">動物細胞全景</h2>
          <div class="sub-en" id="card-sub-en">Animal Cell Overview</div>
        </div>
        <button class="card-toggle-btn" id="cardToggleBtn" title="縮放解說卡片" aria-label="收合資訊卡">
          <span>✕</span>
        </button>
      </div>

      <div class="card-body">
        <div class="info-section">
          <span class="info-label">📖 生理功能概述</span>
          <p class="info-text" id="card-summary"></p>
        </div>

        <div class="meta-grid">
          <div class="meta-item">
            <div class="meta-k">膜層構造分類</div>
            <div class="meta-v" id="card-membrane-type">--</div>
          </div>
          <div class="meta-item">
            <div class="meta-k">生物尺度尺寸</div>
            <div class="meta-v" id="card-dimensions">--</div>
          </div>
        </div>

        <div class="info-section">
          <span class="info-label">🔍 關鍵構造拆解（點擊標籤高亮 3D 模型）</span>
          <div class="structure-tags-wrap" id="structure-tags"></div>
        </div>

        <div class="info-section">
          <span class="info-label">🎓 國高中課綱核心重點</span>
          <ul class="curriculum-list" id="card-curriculum"></ul>
        </div>
      </div>
    </aside>

    <!-- 底部懸浮工具列 -->
    <div class="floating-toolbar" role="toolbar" aria-label="3D 視角控制工具">
      <button class="tool-btn" id="resetCameraBtn" title="重設攝影機至初始視角">
        <span class="btn-icon">⟲</span>
        <span class="btn-text">重設視角</span>
      </button>

      <button class="tool-btn active" id="autoRotateBtn" title="切換自動慢速自轉">
        <span class="btn-icon">🔄</span>
        <span class="btn-text">自動旋轉</span>
      </button>

      <button class="tool-btn active" id="cutawayBtn" title="切換立體剖面與完整外觀">
        <span class="btn-icon">🔪</span>
        <span class="btn-text">立體剖面</span>
      </button>

      <button class="tool-btn" id="zoomInBtn" title="放大視角">
        <span class="btn-icon">＋</span>
      </button>

      <button class="tool-btn" id="zoomOutBtn" title="縮小視角">
        <span class="btn-icon">－</span>
      </button>
    </div>

    <!-- 狀態通知吐司 -->
    <div id="toast-notification"></div>

    <!-- 3D 滑鼠懸停浮動標籤 -->
    <div id="hover-tooltip"></div>
  </div>

  <!-- 應用程式核心邏輯 Entry Point -->
  <script type="module" src="main.js"></script>
</body>
</html>
