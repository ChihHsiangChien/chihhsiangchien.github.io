<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>高爾頓板與常態分佈模擬 | Galton Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand">
        <span class="badge">STATISTICS</span>
        <h1>高爾頓板模擬器</h1>
      </div>

      <div class="stats-row">
        <div class="stat-chip"><span>已落定</span><strong id="val-settled">0 / 0</strong></div>
        <div class="stat-chip"><span>平均 μ</span><strong id="val-mean">—</strong></div>
        <div class="stat-chip"><span>標準差 σ</span><strong id="val-std">—</strong></div>
      </div>

      <div class="top-actions">
        <button id="btn-curve" class="icon-btn active" title="顯示理論分佈曲線">📈 理論曲線</button>
      </div>
    </header>

    <!-- Main Canvas -->
    <main class="board-wrap">
      <canvas id="galtonBoard"></canvas>
    </main>

    <!-- Bottom Controls Dock -->
    <footer class="controls-dock">
      <div class="ctrl-item">
        <label for="ballCount">球數: <strong id="lbl-balls">300</strong></label>
        <input type="range" id="ballCount" min="50" max="1500" step="50" value="300" />
      </div>

      <div class="ctrl-item">
        <label for="rowsSlider">釘層數: <strong id="lbl-rows">12</strong></label>
        <input type="range" id="rowsSlider" min="6" max="16" value="12" />
      </div>

      <div class="ctrl-item">
        <label for="biasSlider">右偏機率 p: <strong id="lbl-bias">0.50</strong></label>
        <input type="range" id="biasSlider" min="0.2" max="0.8" step="0.05" value="0.5" />
      </div>

      <div class="dock-btns">
        <button id="startSimulation" class="primary-btn">▶ 開始投放</button>
        <button id="btn-speed" class="secondary-btn">⚡ 1x</button>
        <button id="btn-reset" class="secondary-btn">🔄 清空</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
