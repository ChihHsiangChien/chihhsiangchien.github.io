<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>霧月山莊迷案：16-bit 生物偵探 RPG</title>
  <style>
    :root {
      --bg-void: #0a0c14;
      --ui-bg: #131828;
      --ui-bg-dark: #0b0e18;
      --ui-border: #e5c158;
      --ui-border-dim: #7c6028;
      --hp-green: #22c55e;
      --hp-red: #ef4444;
      --exp-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-gold: #fde047;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: radial-gradient(circle at center, #141b2d 0%, #07090f 100%);
      color: var(--text-main);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    /* 16:9 像素舞台置中容器 */
    #viewport-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
    }

    #stage-box {
      position: relative;
      width: min(100%, calc((100dvh - 16px) * 16 / 9));
      height: min(100%, calc((100vw - 16px) * 9 / 16));
      max-width: 100%;
      max-height: 100%;
      background: #000;
      border: 3px solid var(--ui-border);
      box-shadow:
        0 0 0 3px #0b0e18,
        0 0 32px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* 復古 16-bit 雙層邊框 */
    .px-box {
      background: rgba(15, 20, 36, 0.95);
      border: 2px solid var(--ui-border);
      box-shadow: inset 0 0 0 2px #0b0e18, 0 6px 18px rgba(0, 0, 0, 0.8);
    }

    /* 左上角：地區、任務目標、等級經驗條 */
    #hud-left {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      z-index: 20;
      padding: 8px 12px;
      max-width: min(440px, 56vw);
      pointer-events: none;
    }

    .hud-zone-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(14px, 1.9vw, 17px);
      font-weight: 800;
      color: var(--text-gold);
      letter-spacing: 0.04em;
    }

    .lv-pill {
      background: #7c2d12;
      border: 1px solid var(--ui-border);
      color: #fff;
      font-size: 12px;
      padding: 2px 8px;
    }

    .hud-quest {
      margin-top: 4px;
      font-size: clamp(13px, 1.7vw, 15px);
      color: #e2e8f0;
      line-height: 1.45;
    }

    .exp-track {
      margin-top: 6px;
      width: 160px;
      max-width: 100%;
      height: 6px;
      background: #090d16;
      border: 1px solid #475569;
    }

    .exp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      transition: width 0.3s ease;
    }

    /* 右上角快捷按鈕列 */
    #hud-right {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 40vw;
    }

    .px-btn {
      background: #1e293b;
      border: 2px solid var(--ui-border);
      color: #f8fafc;
      font-family: inherit;
      font-size: clamp(13px, 1.6vw, 15px);
      font-weight: 700;
      padding: 8px 12px;
      min-height: 40px;
      cursor: pointer;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.45);
    }

    .px-btn:hover {
      background: #334155;
      border-color: #fde047;
    }

    .px-btn.active {
      background: #7c2d12;
      border-color: #fde047;
    }

    /* 底部操作提示條（沒有對話時顯示） */
    #hint-bar {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(11, 14, 24, 0.88);
      border: 1.5px solid rgba(229, 193, 88, 0.65);
      padding: 6px 14px;
      font-size: 13px;
      color: #e2e8f0;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 經典 RPG 底部對話框 */
    #rpg-dialogue {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: min(860px, calc(100vw - 20px));
      z-index: 30;
      display: none;
      gap: 14px;
      padding: 14px 16px;
      cursor: pointer;
    }

    #rpg-dialogue.visible {
      display: flex;
    }

    .dlg-portrait-wrap {
      width: 74px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #dlg-portrait {
      width: 64px;
      height: 64px;
      background: #0b0e18;
      border: 2px solid var(--ui-border);
      image-rendering: pixelated;
    }

    .dlg-speaker {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-gold);
      text-align: center;
      background: #1e293b;
      border: 1px solid var(--ui-border-dim);
      padding: 2px 4px;
      width: 100%;
    }

    .dlg-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    #dlg-text {
      font-size: clamp(16px, 2.4vw, 20px);
      line-height: 1.65;
      color: #f8fafc;
      min-height: 62px;
      word-break: break-word;
    }

    .dlg-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-gold);
      margin-top: 8px;
    }

    .blink-arrow {
      animation: blink 0.75s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* 觸控 / iPad / 滑鼠虛擬十字鍵與 A/B 按鈕 */
    #touch-controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      display: none;
    }

    #touch-controls.show {
      display: block;
    }

    body.ui-busy #touch-controls {
      display: none !important;
    }

    .dpad {
      position: fixed;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 148px;
      height: 148px;
      pointer-events: auto;
      touch-action: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
    }

    .dpad-btn, .ab-btn {
      background: rgba(19, 24, 40, 0.82);
      border: 2.5px solid rgba(229, 193, 88, 0.85);
      color: #fde047;
      font-weight: 900;
      font-size: 20px;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 10px;
    }

    .dpad-btn:active, .dpad-btn.pressed, .ab-btn:active {
      background: rgba(124, 45, 18, 0.95);
      transform: scale(0.95);
    }

    .ab-group {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(28px, env(safe-area-inset-bottom));
      display: flex;
      gap: 14px;
      pointer-events: auto;
      touch-action: none;
    }

    .ab-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
    }

    /* 共用彈窗遮罩（水浴槽實驗台 / 背包 / 地圖 / 戰鬥 / 結算） */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 15, 0.84);
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal-card {
      width: min(640px, 95vw);
      max-height: 90dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px 20px;
    }

    .modal-title {
      font-size: clamp(16px, 2.2vw, 19px);
      font-weight: 900;
      color: var(--text-gold);
      border-bottom: 2px solid var(--ui-border-dim);
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* 溫控實驗台 */
    .lab-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 15.5px;
      line-height: 1.55;
    }

    input[type="range"] {
      width: 100%;
      height: 34px;
      accent-color: #fde047;
      cursor: pointer;
    }

    .temp-readout {
      font-family: monospace;
      font-size: 24px;
      font-weight: 900;
      color: #38bdf8;
      text-align: center;
      background: #090d16;
      border: 2px solid #334155;
      padding: 8px;
    }

    .ph-row {
      display: flex;
      gap: 8px;
    }

    .ph-opt {
      flex: 1;
      padding: 11px 8px;
      font-size: 15px;
      min-height: 44px;
      text-align: center;
      background: #1e293b;
      border: 2px solid #475569;
      color: #e2e8f0;
      font-weight: 700;
      cursor: pointer;
    }

    .ph-opt.selected {
      border-color: #fde047;
      background: #334155;
      color: #fde047;
    }

    .lab-feedback {
      min-height: 52px;
      padding: 10px 12px;
      background: #0b0e18;
      border: 1.5px solid #475569;
      font-size: 15px;
      line-height: 1.6;
    }

    /* RPG 回合制戰鬥介面 */
    .battle-arena {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .battle-status-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .combatant-card {
      background: #0b0e18;
      border: 2px solid #475569;
      padding: 10px 12px;
    }

    .combatant-name {
      font-size: 14.5px;
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .hp-bar-bg {
      height: 12px;
      background: #1e293b;
      border: 1px solid #64748b;
    }

    .hp-bar-fill {
      height: 100%;
      transition: width 0.35s ease;
    }

    .battle-stage-visual {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: linear-gradient(180deg, #121a2f 0%, #1d263d 100%);
      border: 2px solid var(--ui-border-dim);
      padding: 12px;
      min-height: 82px;
    }

    .battle-sprite-canvas {
      width: 60px;
      height: 60px;
      image-rendering: pixelated;
    }

    .battle-log {
      background: #0b0e18;
      border: 2px solid var(--ui-border-dim);
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.6;
      min-height: 62px;
      white-space: pre-line;
    }

    .battle-skills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .skill-btn {
      text-align: left;
      padding: 11px 12px;
      min-height: 54px;
      background: #1e293b;
      border: 2px solid var(--ui-border);
      color: #f8fafc;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .skill-btn:hover:not(:disabled) {
      background: #334155;
      border-color: #fde047;
    }

    .skill-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .skill-sub {
      display: block;
      font-size: 12.5px;
      color: #cbd5e1;
      font-weight: 400;
      margin-top: 3px;
    }

    /* 8cm 時間戳拉桿 */
    .timestamp-box {
      background: #161d31;
      border: 2px solid #fde047;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 15px;
    }

    .ink-tube-visual {
      height: 24px;
      background: #0b0e18;
      border: 2px solid #94a3b8;
      position: relative;
      overflow: hidden;
    }

    .ink-fill {
      height: 100%;
      background: linear-gradient(90deg, #be123c, #f43f5e);
      transition: width 0.15s ease;
    }

    /* 道具與證物清單 */
    .inv-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .inv-item {
      background: #0b0e18;
      border: 1.5px solid #475569;
      padding: 10px 12px;
      font-size: 14.5px;
      line-height: 1.55;
    }

    .inv-item.key {
      border-color: var(--ui-border);
    }

    .inv-item-title {
      font-weight: 800;
      color: var(--text-gold);
      font-size: 15.5px;
    }

    /* 跳出浮動經驗值提示 */
    #toast-wrap {
      position: fixed;
      top: max(74px, calc(env(safe-area-inset-top) + 64px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .rpg-toast {
      background: rgba(124, 45, 18, 0.96);
      border: 2px solid #fde047;
      color: #fde047;
      font-size: 14.5px;
      font-weight: 800;
      padding: 6px 16px;
      animation: toastPop 1.8s forwards ease-out;
    }

    @keyframes toastPop {
      0% { opacity: 0; transform: translateY(8px); }
      15% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; transform: translateY(-6px); }
      100% { opacity: 0; transform: translateY(-14px); }
    }

    @media (hover: none) and (pointer: coarse), (max-width: 900px) {
      #touch-controls { display: block; }
      #hint-bar { display: none; }
    }

    @media (max-width: 640px) {
      #hud-left { max-width: 55vw; padding: 6px 8px; }
      #hud-right { max-width: 42vw; gap: 5px; }
      .px-btn { padding: 6px 9px; font-size: 12.5px; min-height: 36px; }
      .battle-skills { grid-template-columns: 1fr; }
      .dlg-portrait-wrap { width: 58px; }
      #dlg-portrait { width: 52px; height: 52px; }
      .dpad { width: 132px; height: 132px; }
      .ab-btn { width: 58px; height: 58px; }
    }
  </style>
</head>
<body>

<div id="viewport-wrap">
  <div id="stage-box">
    <canvas id="game-canvas" width="320" height="180"></canvas>
  </div>

  <!-- 左上角 RPG HUD -->
  <div id="hud-left" class="px-box">
    <div class="hud-zone-row">
      <span id="hud-zone">霧月山莊主廳</span>
      <span class="lv-pill" id="hud-lv">LV.1</span>
    </div>
    <div class="hud-quest" id="hud-quest">調查主廳與實驗室，查明博士倒下的原因！</div>
    <div class="exp-track"><div class="exp-fill" id="hud-exp"></div></div>
  </div>

  <!-- 右上角工具列 -->
  <div id="hud-right">
    <button class="px-btn" id="btn-inv">🎒 證物道具</button>
    <button class="px-btn" id="btn-map">🗺️ 地圖</button>
    <button class="px-btn" id="btn-pad">🎮 虛擬手把</button>
    <button class="px-btn active" id="btn-bgm">🎵 配樂</button>
    <button class="px-btn active" id="btn-sfx">🔊 音效</button>
  </div>

  <div id="toast-wrap"></div>
  <div id="hint-bar">移動: WASD / 方向鍵 ｜ 調查互動: Space / Enter / Z ｜ 巴迪會自動嗅探異常點</div>

  <!-- 虛擬十字鍵與 AB 鍵（支援 iPad / 手機觸控） -->
  <div id="touch-controls">
    <div class="dpad">
      <div></div>
      <button class="dpad-btn" data-dir="up" aria-label="上">▲</button>
      <div></div>
      <button class="dpad-btn" data-dir="left" aria-label="左">◀</button>
      <div></div>
      <button class="dpad-btn" data-dir="right" aria-label="右">▶</button>
      <div></div>
      <button class="dpad-btn" data-dir="down" aria-label="下">▼</button>
      <div></div>
    </div>
    <div class="ab-group">
      <button class="ab-btn" id="btn-b" aria-label="證物道具">🎒</button>
      <button class="ab-btn" id="btn-a" aria-label="調查與對話">A</button>
    </div>
  </div>

  <!-- 底部 RPG 對話框 -->
  <div id="rpg-dialogue" class="px-box">
    <div class="dlg-portrait-wrap">
      <canvas id="dlg-portrait" width="32" height="32"></canvas>
      <div class="dlg-speaker" id="dlg-speaker">艾德華</div>
    </div>
    <div class="dlg-body">
      <div id="dlg-text"></div>
      <div class="dlg-footer">
        <span id="dlg-progress">1 / 1</span>
        <span class="blink-arrow" id="dlg-next">▼ 繼續</span>
      </div>
    </div>
  </div>

  <!-- 通用彈窗（背包 / 地圖 / 實驗台 / 戰鬥 / 結局） -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-card px-box" id="modal-card"></div>
  </div>
</div>

<script>
/* ============================================================================
   1. 8-bit Chiptune 配樂 & 音效引擎（純 Web Audio API，支援 iPad Safari 解鎖）
   ============================================================================ */
let sharedAudioCtx = null;
function ensureAudio() {
  if (!sharedAudioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) sharedAudioCtx = new AC();
  }
  if (sharedAudioCtx && sharedAudioCtx.state === "suspended") {
    sharedAudioCtx.resume().catch(() => {});
  }
  return sharedAudioCtx;
}

const SFX = {
  enabled: true,
  play(type) {
    if (!this.enabled) return;
    try {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      const playTone = (freq, dur, wave = "square", vol = 0.05, delay = 0, slide = null) => {
        if (freq <= 0) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, now + delay);
        if (slide && slide > 0) osc.frequency.exponentialRampToValueAtTime(slide, now + delay + dur);
        gain.gain.setValueAtTime(vol, now + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + delay);
        osc.stop(now + delay + dur + 0.01);
      };

      if (type === "blip") playTone(720, 0.032, "square", 0.02);
      else if (type === "step") playTone(145, 0.035, "triangle", 0.025, 0, 110);
      else if (type === "door") {
        playTone(392, 0.06, "square", 0.04, 0, 523.25);
        playTone(587.33, 0.09, "square", 0.04, 0.055, 783.99);
      } else if (type === "bark") {
        playTone(440, 0.055, "square", 0.045, 0, 620);
        playTone(480, 0.065, "square", 0.045, 0.09, 680);
      } else if (type === "select") playTone(520, 0.06, "square", 0.04, 0, 780);
      else if (type === "splash") playTone(320, 0.18, "triangle", 0.06, 0, 920);
      else if (type === "hit") playTone(180, 0.14, "sawtooth", 0.07, 0, 75);
      else if (type === "error") {
        playTone(220, 0.12, "sawtooth", 0.06, 0);
        playTone(165, 0.18, "sawtooth", 0.06, 0.11);
      } else if (type === "fanfare") {
        playTone(523.25, 0.09, "square", 0.05, 0);
        playTone(659.25, 0.09, "square", 0.05, 0.09);
        playTone(783.99, 0.09, "square", 0.05, 0.18);
        playTone(1046.5, 0.24, "square", 0.06, 0.27);
      } else if (type === "thunder") {
        playTone(110, 0.35, "sawtooth", 0.08, 0, 48);
      }
    } catch (_) {}
  }
};

  playNote(freq, durSec, wave, vol) {
    if (!freq || freq <= 0) return;
    try {
      const ctx = ensureAudio();
      if (!ctx || ctx.state !== "running") return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + durSec);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + durSec + 0.02);
    } catch (_) {}
  },
  tick() {
    if (!this.enabled || !this.unlocked) return;
    const track = this.tracks[this.currentTrack];
    if (!track) return;
    const stepDur = (60 / track.bpm) / 2;
    const idx = this.stepIdx % track.lead.length;
    this.playNote(track.lead[idx], stepDur * 0.85, "square", 0.018);
    this.playNote(track.bass[idx], stepDur * 0.9, "triangle", 0.026);
    this.stepIdx++;
  },
  startLoop() {
    this.stop();
    if (!this.enabled || !this.unlocked) return;
    const track = this.tracks[this.currentTrack];
    if (!track) return;
    const ms = Math.round(((60 / track.bpm) / 2) * 1000);
    this.tick();
    this.timer = setInterval(() => this.tick(), ms);
  },
  stop() {
    if (this.timer) {
      clearInterval(this.timer);
      this.timer = null;
    }
  },
  playTrack(name) {
    if (!this.tracks[name]) return;
    if (this.currentTrack === name && this.timer) return;
    this.currentTrack = name;
    this.stepIdx = 0;
    if (this.enabled && this.unlocked) this.startLoop();
  },
  playTrackForRoom(roomId) {
    if (state.flags && state.flags.caseSolved) {
      this.playTrack("victory");
    } else if (roomId === "greenhouse" || roomId === "forest") {
      this.playTrack("nature");
    } else {
      this.playTrack("mansion");
    }
  },
  unlock() {
    ensureAudio();
    if (!this.unlocked) {
      this.unlocked = true;
      if (this.enabled) this.startLoop();
    }
  },
  toggle() {
    this.enabled = !this.enabled;
    ensureAudio();
    this.unlocked = true;
    if (this.enabled) this.startLoop();
    else this.stop();
    return this.enabled;
  }
};

const spriteCache = {};
function getSpriteCanvas(key, grid, pal, scale = 1, flipX = false) {
  const cacheKey = `${key}_${scale}_${flipX ? "f" : "n"}`;
  if (spriteCache[cacheKey]) return spriteCache[cacheKey];
  const h = grid.length;
  const w = grid[0].length;
  const c = document.createElement("canvas");
  c.width = w * scale;
  c.height = h * scale;
  const cx = c.getContext("2d");
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = grid[y][x];
      if (ch !== "." && pal[ch]) {
        cx.fillStyle = pal[ch];
        const drawX = flipX ? (w - 1 - x) : x;
        cx.fillRect(drawX * scale, y * scale, scale, scale);
      }
    }
  }
  spriteCache[cacheKey] = c;
  return c;
}

function drawCharSprite(ctx, charId, px, py, scale = 1, bob = 0, dir = "down", stepFrame = 0) {
  const pal = PALETTES[charId] || PALETTES.edward;
  let grid;
  let gridKey = charId;
  const flipX = (dir === "left");

  if (charId === "buddy") {
    if (dir === "up") { grid = SPRITE_DOG_UP; gridKey += "_u"; }
    else if (dir === "left" || dir === "right") { grid = SPRITE_DOG_RIGHT; gridKey += "_r"; }
    else { grid = SPRITE_DOG; gridKey += "_d"; }
  } else if (charId === "edward") {
    if (dir === "up") {
      grid = stepFrame ? SPRITE_HUMAN_UP_WALK : SPRITE_HUMAN_UP;
      gridKey += stepFrame ? "_uw" : "_u";
    } else if (dir === "left" || dir === "right") {
      grid = stepFrame ? SPRITE_GLASSES_RIGHT_WALK : SPRITE_GLASSES_RIGHT;
      gridKey += stepFrame ? "_rw" : "_r";
    } else {
      grid = stepFrame ? SPRITE_GLASSES_DOWN_WALK : SPRITE_GLASSES_HUMAN;
      gridKey += stepFrame ? "_dw" : "_d";
    }
  } else {
    grid = charId === "drChen" ? SPRITE_GLASSES_HUMAN : SPRITE_HUMAN;
  }

  const spr = getSpriteCanvas(gridKey, grid, pal, scale, flipX);
  ctx.drawImage(spr, Math.round(px - spr.width / 2), Math.round(py - spr.height + bob));
}

function renderDialoguePortrait(charId) {
  const pc = document.getElementById("dlg-portrait");
  const pctx = pc.getContext("2d");
  pctx.imageSmoothingEnabled = false;
  pctx.clearRect(0, 0, 32, 32);
  pctx.fillStyle = "#161f33";
  pctx.fillRect(0, 0, 32, 32);
  drawCharSprite(pctx, charId, 16, 30, 2, 0);
}

}

function gainExp(amount) {
  state.exp += amount;
  showToast(`✨ 獲得 ${amount} EXP！`);
  while (state.exp >= state.nextExp) {
    state.exp -= state.nextExp;
    state.lv++;
    state.nextExp = Math.round(state.nextExp * 1.3);
    SFX.play("fanfare");
    showToast(`🎉 偵探等級提升至 LV.${state.lv}！`);
  }
  updateHud();
}

function addItem(item) {
  if (state.inventory.some((i) => i.id === item.id)) return false;
  state.inventory.push(item);
  SFX.play("fanfare");
  showToast(`🎒 獲得證物：${item.name}`);
  return true;
}

function getQuestText() {
  if (!state.flags.labSolved) return "任務 1：前往右側【生化實驗室】，調校恆溫水浴槽還原蛋白酶線索！";
  if (!state.flags.greenhouseSolved) return "任務 2：前往上方【玻璃溫室】，想辦法拯救遭濃食鹽水潑灑的盆栽！";
  if (!state.flags.snakeJarFound) return "任務 3：從左側開啟的門進入【後山林場】，讓巴迪嗅探樹洞異常氣味！";
  if (!state.flags.venomCured) return "緊急任務：博士中的是響尾蛇毒！立刻回主廳與【陳博士病床】互動搶救！";
  if (!state.flags.caseSolved) return "最終任務：證據齊全！在主廳向【綠川富商】發動真相對決！";
  return "全案破獲！可自由探索霧月山莊回顧各處生物線索。";
}

function updateHud() {
  document.getElementById("hud-zone").textContent = ROOMS[state.room].name;
  document.getElementById("hud-lv").textContent = `LV.${state.lv}`;
  document.getElementById("hud-quest").textContent = getQuestText();
  document.getElementById("hud-exp").style.width = `${Math.min(100, (state.exp / state.nextExp) * 100)}%`;
}

/* ============================================================================
   6. 對話系統（快速打字機 + 即時點擊全顯）
   ============================================================================ */
function syncUiBusyState() {
  const busy = state.dialogue.active || document.getElementById("modal-overlay").classList.contains("visible");
  document.body.classList.toggle("ui-busy", busy);
  if (busy) state.touchDir = null;
}

function startDialogue(lines, onDone = null) {
  state.dialogue.active = true;
  state.dialogue.queue = lines;
  state.dialogue.idx = 0;
  state.dialogue.onDone = onDone;
  document.getElementById("rpg-dialogue").classList.add("visible");
  syncUiBusyState();
  loadDialogueLine();
}

function loadDialogueLine() {
  const entry = state.dialogue.queue[state.dialogue.idx];
  const names = {
    edward: "艾德華", kiki: "小琪", butler: "老管家",
    midori: "綠川富商", shira: "白石助理", akai: "赤井學者",
    drChen: "陳博士", buddy: "搜救犬巴迪"
  };
  document.getElementById("dlg-speaker").textContent = entry.name || names[entry.speaker] || "系統";
  renderDialoguePortrait(entry.speaker || "edward");
  if (entry.speaker === "buddy") SFX.play("bark");
  document.getElementById("dlg-progress").textContent = `${state.dialogue.idx + 1} / ${state.dialogue.queue.length}`;
  state.dialogue.full = entry.text;
  state.dialogue.shown = "";
  state.dialogue.charIdx = 0;
  state.dialogue.typing = true;
  document.getElementById("dlg-text").textContent = "";
  document.getElementById("dlg-next").textContent = "快速顯示";
}

function advanceDialogue() {
  if (!state.dialogue.active) return;
  if (state.dialogue.typing) {
    state.dialogue.typing = false;
    state.dialogue.shown = state.dialogue.full;
    document.getElementById("dlg-text").textContent = state.dialogue.full;
    document.getElementById("dlg-next").textContent = "▼ 繼續";
    return;
  }
  SFX.play("select");
  if (state.dialogue.idx < state.dialogue.queue.length - 1) {
    state.dialogue.idx++;
    loadDialogueLine();
  } else {
    state.dialogue.active = false;
    document.getElementById("rpg-dialogue").classList.remove("visible");
    syncUiBusyState();
    const cb = state.dialogue.onDone;
    state.dialogue.onDone = null;
    if (cb) cb();
  }
}

// --- 小遊戲 1：生化實驗室水浴槽溫控調校 ---
function openWaterBathPuzzle() {
  let temp = 90;
  let ph = "acid";

  const render = () => {
    openModal(`
      <div class="modal-title">
        <span>🧪 實驗室恆溫水浴槽調校台</span>
        <button class="px-btn" id="close-lab-btn">✕</button>
      </div>
      <div class="lab-panel">
        <div>目標：調整水浴溫度與酸鹼值，重新活化瓶中殘留的<strong>「去漬蛋白酶」</strong>以洗去血漬、顯現兇手衣袖纖維！</div>
        <div class="temp-readout" id="lab-temp-disp">${temp}°C</div>
        <input type="range" id="lab-temp-slider" min="0" max="95" step="5" value="${temp}" />
        <div class="ph-row">
          <button class="ph-opt ${ph === "acid" ? "selected" : ""}" data-ph="acid">強酸環境</button>
          <button class="ph-opt ${ph === "neutral" ? "selected" : ""}" data-ph="neutral">中性溫和</button>
          <button class="ph-opt ${ph === "base" ? "selected" : ""}" data-ph="base">強鹼沸液</button>
        </div>
        <div class="lab-feedback" id="lab-feedback">目前設定為 90°C 高溫，酵素處於變性危險區！請拖曳滑桿並測試催化反應。</div>
        <button class="px-btn active" id="btn-test-enzyme" style="padding:9px;font-size:13px;">🔥 啟動酵素催化測試</button>
      </div>
    `);

    document.getElementById("close-lab-btn").onclick = closeModal;
    document.getElementById("lab-temp-slider").oninput = (e) => {
      temp = Number(e.target.value);
      document.getElementById("lab-temp-disp").textContent = `${temp}°C`;
    };
    document.querySelectorAll(".ph-opt").forEach((b) => {
      b.onclick = () => {
        ph = b.dataset.ph;
        document.querySelectorAll(".ph-opt").forEach((x) => x.classList.toggle("selected", x.dataset.ph === ph));
      };
    });
    document.getElementById("btn-test-enzyme").onclick = () => {
      const fb = document.getElementById("lab-feedback");
      if (temp >= 70) {
        SFX.play("error");
        fb.innerHTML = `💥 <strong>${temp}°C 過高！</strong>蛋白質酵素在高溫下結構破壞、<strong>永久失去活性</strong>，試管冒出一股焦煙！`;
      } else if (temp <= 15) {
        SFX.play("error");
        fb.innerHTML = `❄️ <strong>${temp}°C 過低！</strong>低溫使酵素活動力大幅下降，血漬完全沒有分解跡象（回溫仍可恢復）。`;
      } else if (ph !== "neutral") {
        SFX.play("error");
        fb.innerHTML = `⚠️ 溫度接近了，但「去漬蛋白酶」需要<strong>中性溫和</strong>環境才能發揮最佳活性，過酸或過鹼會抑制催化！`;
      } else {
        SFX.play("fanfare");
        state.flags.labSolved = true;
        addItem({ id: "cuff_fiber", key: true, name: "🧵 綠川深綠袖口纖維", desc: "於 37°C 中性環境活化去漬蛋白酶洗淨血漬後發現！證實有人曾在實驗室掙扎。" });
        gainExp(50);
        updateHud();
        closeModal();
        BGM.playTrackForRoom(state.room);
        startDialogue([
          { speaker: "shira", text: "「成功了！37°C 溫水搭配中性環境讓去漬蛋白酶發揮最高活性，布片上的血漬分解得一乾二淨！」" },
          { speaker: "edward", text: "「看這露出的纖維——是深綠色的西裝袖口線頭！看來還得去上方【玻璃溫室】追查兇手逃竄路線！」" }
        ]);

function teleportRoom(roomId, sx, sy) {
  SFX.play("door");
  state.room = roomId;
  state.player.x = sx;
  state.player.y = sy;
  state.buddy.x = sx - 0.8;
  state.buddy.y = sy + 0.4;
  state.buddy.trail = [];
  state.fadeAlpha = 1;
  BGM.playTrackForRoom(roomId);
  updateHud();
}

function isWalkable(tx, ty) {
  const col = Math.floor(tx);
  const row = Math.floor(ty);
  const room = ROOMS[state.room];

  // 門洞可走入觸發換場
  for (const d of room.doors) {
    if (d.col === col && d.row === row) return true;
  }
  if (col <= 0 || col >= MAP_W - 1 || row <= 0 || row >= MAP_H - 1) return false;

  for (const s of room.solids) {
    if (tx >= s.x && tx <= s.x + s.w && ty >= s.y && ty <= s.y + s.h) return false;
  }
  return true;
}

function findNearestInteractable() {
  const room = ROOMS[state.room];
  const candidates = [...room.npcs, ...room.props];
  let best = null;
  let bestDist = 1.65;
  for (const c of candidates) {
    const d = Math.hypot(c.x - state.player.x, c.y - state.player.y);
    if (d < bestDist) {
      bestDist = d;
      best = c;
    }
  }
  return best;
}

function triggerInteract() {
  if (document.getElementById("modal-overlay").classList.contains("visible")) return;
  if (state.dialogue.active) {
    advanceDialogue();
    return;
  }
  const target = findNearestInteractable();
  if (target && INTERACTIONS[target.interact]) {
    SFX.play("select");
    INTERACTIONS[target.interact]();
  }
}

   ============================================================================ */
const canvas = document.getElementById("game-canvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const tileCache = {};
function makeTile(key, drawFn) {
  if (tileCache[key]) return tileCache[key];
  const c = document.createElement("canvas");
  c.width = TILE;
  c.height = TILE;
  const tx = c.getContext("2d");
  tx.imageSmoothingEnabled = false;
  drawFn(tx);
  tileCache[key] = c;
  return c;
}

function buildTileCache() {
  // 主廳石磚牆（DQ 古堡風雙層錯位磚牆）
  makeTile("wall_hall", (t) => {
    t.fillStyle = "#3f2e24"; t.fillRect(0, 0, 16, 16);
    t.fillStyle = "#5c4333";
    t.fillRect(0, 1, 7, 5); t.fillRect(8, 1, 8, 5);
    t.fillRect(0, 8, 3, 5); t.fillRect(4, 8, 8, 5); t.fillRect(13, 8, 3, 5);
    t.fillStyle = "#785946";
    t.fillRect(0, 1, 7, 1); t.fillRect(8, 1, 8, 1);
    t.fillRect(4, 8, 8, 1);
    t.fillStyle = "#1f1510";
    t.fillRect(0, 6, 16, 2); t.fillRect(0, 14, 16, 2);
    t.fillRect(7, 1, 1, 5); t.fillRect(3, 8, 1, 5); t.fillRect(12, 8, 1, 5);
  });

  // 實驗室金屬石板牆
  makeTile("wall_lab", (t) => {
    t.fillStyle = "#2b394f"; t.fillRect(0, 0, 16, 16);
    t.fillStyle = "#3b4d6b"; t.fillRect(1, 1, 14, 12);
    t.fillStyle = "#52688c"; t.fillRect(1, 1, 14, 2);
    t.fillStyle = "#172030"; t.fillRect(0, 13, 16, 3);
    t.fillStyle = "#94a3b8";
    t.fillRect(3, 3, 1, 1); t.fillRect(12, 3, 1, 1);
    t.fillRect(3, 10, 1, 1); t.fillRect(12, 10, 1, 1);
  });

  // 玻璃溫室鐵框玻璃牆

function drawPixelTorch(px, py) {
  const f = Math.floor(state.time * 9) % 2;
  // 暖光暈
  ctx.fillStyle = f ? "rgba(251, 191, 36, 0.14)" : "rgba(249, 115, 22, 0.12)";
  ctx.fillRect(px - 8, py - 6, 20, 20);
  // 鐵架與木柄
  ctx.fillStyle = "#78350f"; ctx.fillRect(px + 1, py + 5, 2, 6);
  ctx.fillStyle = "#475569"; ctx.fillRect(px, py + 7, 4, 2);
  // 跳動火焰
  ctx.fillStyle = "#ef4444"; ctx.fillRect(px, py + 2, 4, 4);
  ctx.fillStyle = "#facc15"; ctx.fillRect(px + 1, py + (f ? 0 : 1), 2, 4);
  ctx.fillStyle = "#fffbeb"; ctx.fillRect(px + 1, py + 3, 2, 1);
}

function drawPixelDoorTile(d) {
  const px = d.col * TILE;
  const py = d.row * TILE + 2;
  const locked = d.reqFlag && !state.flags[d.reqFlag];
  const pulse = Math.sin(state.time * 4.5) > 0;

  // 石砌門框背景
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(px, py, TILE, TILE);
  // 石拱門柱與拱頂
  ctx.fillStyle = "#94a3b8";
  ctx.fillRect(px + 1, py + 1, 14, 2);
  ctx.fillRect(px + 1, py + 2, 2, 14);
  ctx.fillRect(px + 13, py + 2, 2, 14);
  // 深色通道 / 木門板
  ctx.fillStyle = locked ? "#451a03" : "#7c4a21";
  ctx.fillRect(px + 3, py + 3, 10, 12);
  // 木紋與鐵條橫帶
  ctx.fillStyle = locked ? "#290f02" : "#5c3415";
  ctx.fillRect(px + 7, py + 3, 2, 12);
  ctx.fillStyle = "#334155";
  ctx.fillRect(px + 3, py + 6, 10, 2);
  ctx.fillRect(px + 3, py + 11, 10, 2);
  // 金色門把或鎖頭
  if (locked) {
    ctx.fillStyle = "#ef4444"; ctx.fillRect(px + 6, py + 6, 4, 5);
    ctx.fillStyle = "#fde047"; ctx.fillRect(px + 7, py + 4, 2, 2);
  } else {
    ctx.fillStyle = "#fde047";
    ctx.fillRect(px + 10, py + 8, 2, 2);
    // 門檻發光地墊（引導視覺）
    let matX = px + 3, matY = py + 14;
    if (d.row === 0) { matX = px + 2; matY = py + TILE; }
    else if (d.row === MAP_H - 1) { matX = px + 2; matY = py - 5; }
    else if (d.col === 0) { matX = px + TILE; matY = py + 3; }
    else if (d.col === MAP_W - 1) { matX = px - 5; matY = py + 3; }
    ctx.fillStyle = pulse ? "rgba(250, 204, 21, 0.7)" : "rgba(250, 204, 21, 0.38)";
    if (d.row === 0 || d.row === MAP_H - 1) ctx.fillRect(matX, matY, 12, 3);
    else ctx.fillRect(matX, matY, 3, 10);
  }
}

function drawDoorSignposts() {
  const doors = ROOMS[state.room].doors;
  // 將同側相鄰兩格的雙開門合併為一個清楚的路標
  const seen = new Set();
  for (const d of doors) {
    const groupKey = `${d.to}_${d.row === 0 || d.row === MAP_H - 1 ? d.row : d.col}`;
    if (seen.has(groupKey)) continue;
    seen.add(groupKey);

    const locked = d.reqFlag && !state.flags[d.reqFlag];
    let text = d.label;
    let sx = d.col * TILE + 8;
    let sy = d.row * TILE + 10;

    if (d.row === 0) {
      text = `▲ ${d.label.replace("往", "")}`;
      sx = (d.col + 1) * TILE;
      sy = 24;
    } else if (d.row === MAP_H - 1) {
      text = `▼ ${d.label.replace("往", "")}`;
      sx = (d.col + 1) * TILE;
      sy = MAP_H * TILE - 11;
    } else if (d.col === 0) {
      text = locked ? "🔒 後山(未解鎖)" : `◀ ${d.label.replace("往", "")}`;
      sx = 42;
      sy = d.row * TILE - 2;
    } else if (d.col === MAP_W - 1) {
      text = `${d.label.replace("往", "")} ▶`;
      sx = MAP_W * TILE - 44;
      sy = d.row * TILE - 2;
    }

    ctx.font = "bold 7.5px sans-serif";
    const tw = ctx.measureText(text).width + 8;
    const bx = Math.round(sx - tw / 2);
    const by = Math.round(sy - 6);

    ctx.fillStyle = "rgba(10, 14, 26, 0.88)";
    ctx.fillRect(bx, by, tw, 11);
    ctx.strokeStyle = locked ? "#ef4444" : "#e5c158";
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, tw - 1, 10);

    ctx.fillStyle = locked ? "#fca5a5" : "#fde047";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, Math.round(sx), Math.round(sy));
  }
}

  const floorA = `floor_${theme}_a`;

  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      const px = c * TILE;
      const py = r * TILE + 2;
      const isBorder = (r === 0 || r === MAP_H - 1 || c === 0 || c === MAP_W - 1);
      if (isBorder) {
        ctx.drawImage(tileCache[wallKey], px, py);

let doorCooldown = 0;
let stepSfxTimer = 0;
let blipStep = 0;

function update(dt) {
  state.time += dt;
  if (state.fadeAlpha > 0) state.fadeAlpha = Math.max(0, state.fadeAlpha - dt * 3.2);
  if (state.lightningAlpha > 0) state.lightningAlpha = Math.max(0, state.lightningAlpha - dt * 2.5);
  if (doorCooldown > 0) doorCooldown -= dt;

  // 打字機更新（高速 + 復古文字音效）
  if (state.dialogue.active && state.dialogue.typing) {
    const prevN = Math.floor(state.dialogue.charIdx);
    state.dialogue.charIdx += dt * 115;
    const n = Math.floor(state.dialogue.charIdx);
    if (n > prevN) {
      blipStep++;
      if (blipStep % 3 === 1) SFX.play("blip");
    }
    if (n >= state.dialogue.full.length) {
      state.dialogue.typing = false;
      state.dialogue.shown = state.dialogue.full;
      document.getElementById("dlg-next").textContent = "▼ 繼續";
    } else {
      state.dialogue.shown = state.dialogue.full.slice(0, n);
    }
    document.getElementById("dlg-text").textContent = state.dialogue.shown;
  }

  // 對話或彈窗開啟時暫停移動
  const modalOpen = document.getElementById("modal-overlay").classList.contains("visible");
  if (state.dialogue.active || modalOpen) return;

  let dx = 0, dy = 0;
  if (state.keys["ArrowUp"] || state.keys["KeyW"] || state.touchDir === "up") dy -= 1;
  if (state.keys["ArrowDown"] || state.keys["KeyS"] || state.touchDir === "down") dy += 1;
  if (state.keys["ArrowLeft"] || state.keys["KeyA"] || state.touchDir === "left") dx -= 1;
  if (state.keys["ArrowRight"] || state.keys["KeyD"] || state.touchDir === "right") dx += 1;

  state.player.moving = (dx !== 0 || dy !== 0);
  if (state.player.moving) {
    if (Math.abs(dx) >= Math.abs(dy)) {
      state.player.dir = dx > 0 ? "right" : "left";
    } else {
      state.player.dir = dy > 0 ? "down" : "up";
    }

    const len = Math.hypot(dx, dy);
    const speed = 5.4 * dt;
    const nx = state.player.x + (dx / len) * speed;
    const ny = state.player.y + (dy / len) * speed;

    if (isWalkable(nx, state.player.y)) state.player.x = nx;
    if (isWalkable(state.player.x, ny)) state.player.y = ny;

    state.player.walkTick += dt * 10;
    stepSfxTimer -= dt;
    if (stepSfxTimer <= 0) {
      SFX.play("step");
      stepSfxTimer = 0.28;
    }

    // 巴迪跟隨軌跡與面向方向更新
    state.buddy.trail.push({ x: state.player.x, y: state.player.y });
    if (state.buddy.trail.length > 14) {
      const target = state.buddy.trail.shift();
      const bdx = target.x - state.buddy.x;
      const bdy = target.y - state.buddy.y;
      if (Math.hypot(bdx, bdy) > 0.02) {
        if (Math.abs(bdx) >= Math.abs(bdy)) {
          state.buddy.dir = bdx > 0 ? "right" : "left";
        } else {
          state.buddy.dir = bdy > 0 ? "down" : "up";
        }
      }
      state.buddy.x += bdx * 0.35;
      state.buddy.y += bdy * 0.35;
    }

    // 檢查是否踩到門洞
    if (doorCooldown <= 0) {
      const pCol = Math.floor(state.player.x);
      const pRow = Math.floor(state.player.y);
      for (const d of ROOMS[state.room].doors) {
        if (d.col === pCol && d.row === pRow) {
          if (d.reqFlag && !state.flags[d.reqFlag]) {
            doorCooldown = 0.8;
            startDialogue([{ speaker: "edward", text: "「通往後山林場的側門卡住了！先去上方【玻璃溫室】處理濃食鹽水危機找找線索！」" }]);
          } else {
            doorCooldown = 0.5;
            teleportRoom(d.to, d.spawnX, d.spawnY);
          }
          break;
        }
      }
    }
  }
}

function render() {
  ctx.clearRect(0, 0, 320, 180);
  const room = ROOMS[state.room];
  drawRoomTiles(room.theme);

  // 依 Y 座標排序繪製角色與落地陰影
  const stepFrame = state.player.moving ? (Math.floor(state.player.walkTick) % 2) : 0;
  const entities = [
    ...room.npcs.map((n) => ({ id: n.id, x: n.x * TILE, y: n.y * TILE + 2, bob: 0, dir: "down", step: 0 })),
    { id: "buddy", x: state.buddy.x * TILE, y: state.buddy.y * TILE + 2, bob: state.player.moving ? Math.sin(state.time * 14) * 1.2 : 0, dir: state.buddy.dir, step: 0 },
    { id: "edward", x: state.player.x * TILE, y: state.player.y * TILE + 2, bob: state.player.moving ? Math.abs(Math.sin(state.player.walkTick)) * -2 : 0, dir: state.player.dir, step: stepFrame }
  ];
  entities.sort((a, b) => a.y - b.y);
  for (const e of entities) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.38)";
    ctx.fillRect(Math.round(e.x - 5), Math.round(e.y - 2), 10, 3);
    drawCharSprite(ctx, e.id, e.x, e.y, 1, e.bob, e.dir, e.step);
  }

  // 繪製重要物件上的浮動標記與各門洞路標牌
  const nearest = findNearestInteractable();
  for (const obj of [...room.npcs, ...room.props]) {
    if (obj.tag || obj === nearest) {
      const pulse = Math.sin(state.time * 5) * 1.5;
      const sx = Math.round(obj.x * TILE);
      const sy = Math.round(obj.y * TILE - 18 + pulse);
      ctx.fillStyle = obj === nearest ? "#fde047" : "rgba(253, 224, 71, 0.78)";
      ctx.font = "bold 9px monospace";
      ctx.textAlign = "center";
      ctx.fillText(obj === nearest ? "[A]" : obj.tag, sx, sy);
    }
  }
  drawDoorSignposts();

  // 後山雨滴與閃電特效
  if (state.room === "forest") {
    ctx.fillStyle = "rgba(148, 163, 184, 0.45)";
    for (const r of state.rain) {
      r.x -= r.speed * 0.2 * 0.016;
      r.y += r.speed * 0.016;
      if (r.y > 180) { r.y = 0; r.x = Math.random() * 340; }
      ctx.fillRect(Math.round(r.x), Math.round(r.y), 1, 4);
    }
  }

  if (state.lightningAlpha > 0) {
    ctx.fillStyle = `rgba(255,255,255,${state.lightningAlpha})`;
    ctx.fillRect(0, 0, 320, 180);
  }
  if (state.fadeAlpha > 0) {
    ctx.fillStyle = `rgba(0,0,0,${state.fadeAlpha})`;
    ctx.fillRect(0, 0, 320, 180);
  }
}

let lastT = 0;
function loop(ts) {
  if (!lastT) lastT = ts;
  const dt = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============================================================================
   11. 事件綁定與開局導引
   ============================================================================ */
window.addEventListener("keydown", (e) => {
  state.keys[e.code] = true;
  if (e.code === "Space" || e.code === "Enter" || e.code === "KeyZ") {
    e.preventDefault();
    triggerInteract();
  } else if (e.code === "KeyI") openInventoryModal();
  else if (e.code === "KeyM") openMapModal();
});

window.addEventListener("keyup", (e) => {
  state.keys[e.code] = false;
});

document.getElementById("rpg-dialogue").addEventListener("click", advanceDialogue);
document.getElementById("btn-inv").addEventListener("click", openInventoryModal);
document.getElementById("btn-map").addEventListener("click", openMapModal);
document.getElementById("btn-pad").addEventListener("click", (e) => {
  const show = document.getElementById("touch-controls").classList.toggle("show");
  e.currentTarget.classList.toggle("active", show);
});
document.getElementById("btn-bgm").addEventListener("click", (e) => {
  const on = BGM.toggle();
  e.currentTarget.classList.toggle("active", on);
  e.currentTarget.textContent = on ? "🎵 配樂" : "🔇 靜音";
});
document.getElementById("btn-sfx").addEventListener("click", (e) => {
  SFX.enabled = !SFX.enabled;
  e.currentTarget.classList.toggle("active", SFX.enabled);
  e.currentTarget.textContent = SFX.enabled ? "🔊 音效" : "🔇 靜音";
  if (SFX.enabled) SFX.play("select");
});

// 首次點擊或按鍵自動解鎖 iPad / 瀏覽器背景音樂
["pointerdown", "touchstart", "keydown"].forEach((ev) => {
  window.addEventListener(ev, () => BGM.unlock(), { once: true, passive: true });
});

// 自動偵測 iPad / 手機觸控裝置（含 iPadOS 桌面版 Safari）
const isTouchDevice = navigator.maxTouchPoints > 0 || "ontouchstart" in window;
if (isTouchDevice) {
  document.getElementById("touch-controls").classList.add("show");
  document.getElementById("btn-pad").classList.add("active");
}

// 防止 iPad / iOS Safari 雙點放大或手勢縮放
let lastTouchEndTs = 0;
document.addEventListener("touchend", (e) => {
  if (e.target && e.target.type === "range") return;
  const now = Date.now();
  if (now - lastTouchEndTs <= 300) {
    e.preventDefault();
  }
  lastTouchEndTs = now;
}, { passive: false });

document.addEventListener("gesturestart", (e) => {
  e.preventDefault();
}, { passive: false });

document.querySelectorAll(".dpad-btn").forEach((btn) => {
  const dir = btn.dataset.dir;
  const start = (e) => {
    e.preventDefault();
    state.touchDir = dir;
    btn.classList.add("pressed");
  };
  const end = () => {
    btn.classList.remove("pressed");
    if (state.touchDir === dir) state.touchDir = null;
  };
  btn.addEventListener("pointerdown", start);
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointercancel", end);
  btn.addEventListener("pointerleave", end);
});

document.getElementById("btn-a").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  triggerInteract();
});
document.getElementById("btn-b").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  openInventoryModal();
});

// 初始化啟動
updateHud();
requestAnimationFrame(loop);
startDialogue([
  { speaker: "edward", text: "「午夜暴雨把霧月山莊變成了孤島密室！陳博士倒臥昏迷，但這不是考場——我們要親自走遍山莊、動手操作實驗器材與救人！」" },
  { speaker: "kiki", text: "「用 WASD 或方向鍵移動，靠近物件按 Space / Enter（或點 A 鍵）調查！先去右側【生化實驗室】看看那台異常的 90°C 水浴槽吧！」" }
]);
</script>
