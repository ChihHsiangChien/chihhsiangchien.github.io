<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>生物組成層次的 2048</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="game-container">
    <header class="hud-row">
      <div class="title-box">
        <h1>生物層次 2048</h1>
      </div>
      <div class="scores-box">
        <div class="score-pill"><span>分數</span><strong id="score">0</strong></div>
        <div class="score-pill"><span>最高</span><strong id="best-score">0</strong></div>
        <button id="btn-sound" class="hud-btn" aria-label="切換音效">🔊</button>
        <button id="btn-restart" class="hud-btn" title="重新開始">🔄</button>
      </div>
    </header>

    <div class="board-wrap">
      <div id="game-board"></div>
      <div id="overlay" class="overlay hidden">
        <h2 id="overlay-title">遊戲結束</h2>
        <p id="overlay-desc"></p>
        <button id="btn-overlay-action" class="primary-btn">再玩一局</button>
      </div>
    </div>

    <p class="hint-text">滑動或使用方向鍵合併：細胞 → 組織 → 器官 → 器官系統 → 個體 …</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
