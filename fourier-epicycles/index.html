<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>傅立葉級數圖案重繪 | Fourier Epicycles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand">
        <span class="badge">FOURIER DFT</span>
        <h1>傅立葉級數圖案重繪</h1>
      </div>

      <div class="top-actions">
        <label class="upload-btn">
          📁 上傳圖檔
          <input type="file" id="fileInput" accept="image/*" hidden />
        </label>
        <button id="btn-auto" class="icon-btn active" title="每轉完一圈自動增加級數項數">📈 漸進複雜</button>
        <button id="btn-pause" class="icon-btn">⏸ 暫停</button>
        <button id="btn-circles" class="icon-btn active" title="顯示旋轉圓與向量">🦾 旋轉圓</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-grid">
      <section class="canvas-card card">
        <div class="sample-bar">
          <span class="bar-label">內建範例：</span>
          <button class="sample-btn active" data-sample="heart">❤️ 愛心</button>
          <button class="sample-btn" data-sample="taiwan">🇹🇼 台灣本島</button>
          <button class="sample-btn" data-sample="note">🎵 音符</button>
          <button class="sample-btn" data-sample="star">⭐ 星星</button>
          <button class="sample-btn" data-sample="butterfly">🦋 蝴蝶</button>
          <span id="term-status" class="term-status">級數項數：3 / 240</span>
        </div>

        <div class="canvas-wrap" id="drop-zone">
          <canvas id="canvas"></canvas>
        </div>
      </section>

      <aside class="controls-card card">
        <div class="ctrl-group">
          <div class="ctrl-head">
            <label for="termsSlider">級數項數 (K)</label>
            <strong id="lbl-terms">3</strong>
          </div>
          <input type="range" id="termsSlider" min="1" max="240" value="3" />
        </div>

        <div class="ctrl-group">
          <div class="ctrl-head">
            <label for="speedSlider">繪製速度</label>
            <strong id="lbl-speed">1.0x</strong>
          </div>
          <input type="range" id="speedSlider" min="0.4" max="3.0" step="0.2" value="1.0" />
        </div>

        <div class="ctrl-group">
          <div class="ctrl-head">
            <label for="threshSlider">輪廓二值化門檻</label>
            <strong id="lbl-thresh">128</strong>
          </div>
          <input type="range" id="threshSlider" min="30" max="230" value="128" />
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="invertCheck" />
          <span>反轉前景／背景（深色圖請勾選）</span>
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="refCheck" checked />
          <span>顯示淡色目標輪廓參考</span>
        </label>

        <button id="btn-restart" class="primary-btn">🔄 從簡單級數重頭演進</button>

        <p class="info-note">
          💡 <strong>原理說明</strong>：上傳圖片後，系統會擷取外框輪廓並計算離散傅立葉轉換（DFT），依振幅大小排序。從少數幾個旋轉圓開始，逐步增加級數項數，圖案就會從簡單的橢圓越來越逼近原圖！
        </p>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
