            hudLocationBar.textContent = ANATOMY_LOCATIONS[locKey].breadcrumb;
            backTo3dBtn.style.display = 'flex';
            view3dCloseupBtn.style.display = 'flex';
        } else if (state.step === 3) {
            const locKey = 'ampulla_' + (state.selectedCanal || 'horiz');
            state.activeLocationId = locKey;
            hudLocationBar.textContent = ANATOMY_LOCATIONS[locKey].breadcrumb;
            backTo3dBtn.style.display = 'flex';
            view3dCloseupBtn.style.display = 'flex';
        } else if (state.step === 4) {
            hudLocationBar.textContent = '📍 目前檢視位置：耳石器囊斑 (Macula) vs. 半規管壺腹嵴與頂帽 (Crista & Cupula) 並列對照';
            backTo3dBtn.style.display = 'flex';
            view3dCloseupBtn.style.display = 'none';
        } else if (state.step === 5) {
            hudLocationBar.textContent = '📍 目前檢視位置：內耳前庭受器 ➔ 腦幹前庭神經核群、VOR 眼動反射與中樞傳導路徑';
            backTo3dBtn.style.display = 'flex';
            view3dCloseupBtn.style.display = 'none';
        }
    }

    // ==================== UI 更新與事件控制 ====================
    function updateStepUI(resetView = true) {
        const data = stepsData[state.step];
        hudBadge.textContent = data.badge;
        stepDescBox.innerHTML = `<h3>${data.title}</h3>${data.html}`;
        data.renderControls(stepControlsBox);
        updateLocationHUD();

        stepDots.forEach((dot, idx) => {
            dot.classList.toggle('active', idx === state.step);
        });
        prevStepBtn.disabled = (state.step === 0);
        nextStepBtn.disabled = (state.step === stepsData.length - 1);

        // 切換 3D (Step 0) 與 2D Canvas (Step 1~5)
        if (state.step === 0) {
            container3d.style.display = 'block';
            labels3dContainer.style.display = 'block';
            canvas2d.style.display = 'none';
            if (state.activeLocationId && state.activeLocationId !== 'overview') {
                show3DFocusCard(state.activeLocationId);
            } else {
                focusCard3d.style.display = 'none';
                hint3dBar.style.display = 'block';
            }
            update3DHighlight();
        } else {
            container3d.style.display = 'none';
            labels3dContainer.style.display = 'none';
            focusCard3d.style.display = 'none';
            hint3dBar.style.display = 'none';
            canvas2d.style.display = 'block';
        }

        if (resetView) {
            state.zoom = 1;
            state.panX = 0;
            state.panY = 0;
        }
        resizeViewport();
    }

    stepDots.forEach(dot => {
        dot.addEventListener('click', () => {
            state.step = parseInt(dot.dataset.step, 10);
            updateStepUI(true);
        });
    });

    prevStepBtn.addEventListener('click', () => {
        if (state.step > 0) {
            state.step--;
            updateStepUI(true);
        }
    });

    nextStepBtn.addEventListener('click', () => {
        if (state.step < stepsData.length - 1) {
            state.step++;
            updateStepUI(true);
        }
    });

    toggleLabelsChk.addEventListener('change', (e) => {
        state.showLabels = e.target.checked;
    });

    playPauseBtn.addEventListener('click', () => {
        state.isPlaying = !state.isPlaying;
        playPauseBtn.textContent = state.isPlaying ? '⏸ 暫停動畫' : '▶ 繼續動畫';
    });

    resetViewBtn.addEventListener('click', resetCameraAndPan);

    closePanelBtn.addEventListener('click', () => {
        appEl.classList.add('panel-hidden');
        resizeViewport();
    });

    openPanelBtn.addEventListener('click', () => {
        appEl.classList.remove('panel-hidden');
        resizeViewport();
    });

    // ==================== 動畫主迴圈 ====================
    let lastTimestamp = performance.now();
    function animate(now) {
        const dt = Math.min(0.05, (now - lastTimestamp) / 1000);
        lastTimestamp = now;

        if (state.isPlaying) {
            state.time += dt;
        }

        if (state.step === 0) {
            render3DScene(now);
        } else {
            if (state.step === 3) updateCanalPhysics(dt);
            render2DCanvas();
        }

        requestAnimationFrame(animate);
    }

    // 啟動初始化
    initThreeJS();
    updateStepUI(true);
    resizeViewport();
    requestAnimationFrame(animate);
})();
</script>
</body>
</html>
