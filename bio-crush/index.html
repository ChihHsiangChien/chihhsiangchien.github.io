<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>生物消消樂 | Bio Crush</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top HUD -->
    <header class="hud-bar">
      <div class="brand">
        <span class="badge">BIO CRUSH</span>
        <h1>生物消消樂</h1>
      </div>

      <div class="theme-switch" role="group" aria-label="主題切換">
        <button class="theme-btn active" data-theme="organs">🫀 器官細胞</button>
        <button class="theme-btn" data-theme="nature">🌿 動植物</button>
      </div>

      <div class="hud-actions">
        <button id="btn-hint" class="icon-btn" title="提示可消除位置">💡 提示</button>
        <button id="btn-track" class="icon-btn" title="切換背景音樂曲風">🎶 森林</button>
        <button id="btn-bgm" class="icon-btn" title="開關背景音樂" aria-label="開關背景音樂">🎵</button>
        <button id="btn-sound" class="icon-btn" title="開關音效" aria-label="切換音效">🔊</button>
        <button id="btn-restart" class="icon-btn" title="重新開始">🔄</button>
      </div>
    </header>

    <!-- Score & Level Progress -->
    <section class="status-strip">
      <div class="stat-pill">
        <span>關卡</span>
        <strong id="val-level">1</strong>
      </div>
      <div class="stat-pill">
        <span>剩餘步數</span>
        <strong id="val-moves">22</strong>
      </div>
      <div class="stat-pill score-pill">
        <div class="score-top">
          <span>分數 <strong id="val-score">0</strong> / <span id="val-target">1500</span></span>
          <span id="combo-badge" class="combo-badge hidden">COMBO ×2</span>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- 8x8 Match-3 Board -->
    <main class="board-stage">
      <div class="board-wrap">
        <div id="board" class="board" aria-label="生物消消樂棋盤"></div>
        <canvas id="fx-canvas" class="fx-canvas"></canvas>
      </div>
      <div id="toast" class="toast hidden"></div>

      <!-- Level Complete / Game Over Overlay -->
      <div id="overlay" class="overlay hidden">
        <div class="modal-card">
          <div id="modal-emoji" class="modal-emoji">🎉</div>
          <h2 id="modal-title">過關成功！</h2>
          <p id="modal-desc" class="modal-desc"></p>
          <button id="btn-modal-action" class="primary-btn">下一關</button>
        </div>
      </div>
    </main>

    <!-- Footer Legend -->
    <footer class="footer-tip">
      <span>滑動或點擊交換相鄰生物 · <strong>4 連線</strong>產生橫/縱脈衝⚡ · <strong>5 連線</strong>產生基因炸彈🧬</span>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
