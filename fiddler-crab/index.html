<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招潮蟹模擬遊戲</title>
    <link rel="stylesheet" href="style.css?v=1">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>招潮蟹模擬遊戲</h1>
            <p class="instruction">幫助招潮蟹覓食並躲避天敵！使用方向鍵或 WASD 移動（手機可滑動畫面或點擊虛擬鍵），靠近食物進食，看到天敵迅速躲回藍色洞穴。</p>
        </div>

        <div class="main-layout">
            <div class="game-viewport">
                <div id="canvas-container" style="width: 100%; height: 100%;"></div>
                <div id="loading-indicator"
                    style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ff88; font-size: 20px; text-align: center;">
                    <p>遊戲載入中...</p>
                </div>
                <div class="hud">
                    <div class="health-bar-container">
                        <span class="status-label">生命值</span>
                        <div class="health-bar">
                            <div id="health-fill" class="health-fill"></div>
                        </div>
                    </div>
                    <div class="status-info">
                        <span id="food-count">食物: 0</span>
                        <span id="danger-indicator">安全</span>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <div class="controls">
                    <p class="control-info">WASD / 方向鍵移動 | 觸控滑動 | 靠近食物進食 | 看到天敵快速躲回洞穴</p>

                    <!-- 虛擬方向鍵控制 -->
                    <div class="virtual-controls">
                        <button class="btn-arrow btn-up" data-direction="turn-up" aria-label="向上">▲</button>
                        <div class="btn-row">
                            <button class="btn-arrow btn-left" data-direction="left" aria-label="向左">◀</button>
                            <button class="btn-arrow btn-down" data-direction="turn-down" aria-label="向下">▼</button>
                            <button class="btn-arrow btn-right" data-direction="right" aria-label="向右">▶</button>
                        </div>
                    </div>

                    <button id="new-game-btn" class="btn-new-game">重新開始</button>
                </div>

                <div class="stats-panel">
                    <h2>遊戲信息</h2>
                    <div class="stats">
                        <div class="stat-item">
                            <label>生命值:</label>
                            <span id="stat-health">100</span>
                        </div>
                        <div class="stat-item">
                            <label>已進食:</label>
                            <span id="stat-food">0</span>
                        </div>
                        <div class="stat-item">
                            <label>存活時間:</label>
                            <span id="stat-time">0s</span>
                        </div>
                        <div class="stat-item">
                            <label>其他招潮蟹:</label>
                            <span id="stat-crabs">5</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 遊戲結束結算彈窗 (Settlement Modal) -->
        <div class="game-over-modal" id="game-over" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
            <div class="game-over-card">
                <div class="game-over-icon" id="game-over-icon">🦀</div>
                <h2 id="game-over-title">遊戲結束</h2>
                <div class="game-over-cause-badge" id="game-over-cause">天敵捕食</div>
                <p id="game-over-message" class="game-over-desc">你被白鷺鷥捕食了！</p>

                <div class="final-stats-grid">
                    <div class="final-stat-box">
                        <span class="stat-box-label">⏱️ 存活時間</span>
                        <span class="stat-box-val" id="final-time">0分00秒</span>
                    </div>
                    <div class="final-stat-box">
                        <span class="stat-box-label">🦀 採集食物</span>
                        <span class="stat-box-val" id="final-food">0 顆</span>
                    </div>
                    <div class="final-stat-box full-width">
                        <span class="stat-box-label">🏆 生存評級</span>
                        <span class="stat-box-val title-badge" id="final-title">泥灘迷途蟹</span>
                    </div>
                </div>

                <div class="game-over-tip" id="game-over-tip">
                    💡 提示：看見白鷺鷥靠近請立刻回到藍色洞穴躲避！
                </div>

                <button id="restart-btn" class="btn-restart">再玩一次</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="fiddler-crab.js?v=1"></script>
</body>

</html>
