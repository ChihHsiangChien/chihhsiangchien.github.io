<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>利薩茹曲線表 | Lissajous Curve Table</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <span class="badge">LISSAJOUS</span>
        <h1>利薩茹曲線表</h1>
      </div>

      <div id="cell-info" class="cell-info">點擊任一格查看頻率比</div>

      <div class="top-actions">
        <button id="btn-pause" class="icon-btn">⏸ 暫停</button>
        <button id="btn-guides" class="icon-btn active" title="顯示投影輔助線">✚ 輔助線</button>
        <button id="toggleLines" class="icon-btn active" title="顯示完整曲線">〰️ 曲線</button>
      </div>
    </header>

    <main class="stage-wrap">
      <div class="canvas-box">
        <canvas id="lissajousCanvas"></canvas>
      </div>
    </main>

    <footer class="controls-dock">
      <div class="ctrl-item">
        <label for="sizeSlider">格數：<strong id="lbl-size">8×8</strong></label>
        <input type="range" id="sizeSlider" min="4" max="10" value="8" />
      </div>

      <div class="ctrl-item">
        <label for="phaseSlider">相位差 δ：<strong id="lbl-phase">0°</strong></label>
        <input type="range" id="phaseSlider" min="0" max="180" step="5" value="0" />
      </div>

      <div class="ctrl-item">
        <label for="speedSlider">速度：<strong id="speedDisplay">1.0x</strong></label>
        <input type="range" id="speedSlider" min="0.2" max="4.0" step="0.2" value="1.0" />
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
