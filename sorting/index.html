<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科學概念排序挑戰</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- 左側關卡導航欄 (Sidebar) -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="brand-badge">LAB</div>
                <div class="brand-text">
                    <h1 class="logo">科學排序活動</h1>
                    <span class="subtitle">自然科學觀念挑戰</span>
                </div>
            </div>
            
            <div class="sidebar-menu-label">關卡章節</div>
            <nav id="toc" aria-label="關卡選擇">
                <button class="toc-btn" data-activity="science">
                    <span class="toc-idx">01</span>
                    <span class="toc-title">科學方法</span>
                    <span class="toc-indicator"></span>
                </button>
                <button class="toc-btn" data-activity="animal">
                    <span class="toc-idx">02</span>
                    <span class="toc-title">動物組成層次</span>
                    <span class="toc-indicator"></span>
                </button>
                <button class="toc-btn" data-activity="plant">
                    <span class="toc-idx">03</span>
                    <span class="toc-title">植物組成層次</span>
                    <span class="toc-indicator"></span>
                </button>
                <button class="toc-btn" data-activity="digestiveTube">
                    <span class="toc-idx">04</span>
                    <span class="toc-title">消化管路徑</span>
                    <span class="toc-indicator"></span>
                </button>                        
                <button class="toc-btn" data-activity="heart">
                    <span class="toc-idx">05</span>
                    <span class="toc-title">血液循環路徑</span>
                    <span class="toc-indicator"></span>
                </button>            
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-footer-controls">
                    <button id="sound-btn" class="footer-btn" title="切換音效">音效: 開</button>
                    <button id="shuffle-btn" class="footer-btn" title="重新打亂順序">重新打亂</button>
                </div>
            </div>
        </aside>

        <!-- 右側主要操作與卡片區 -->
        <main id="main-content">
            <!-- 頂部資訊與儀表板數據橫列 -->
            <header class="top-bar">
                <div class="title-section">
                    <div class="title-row">
                        <h2 id="activity-title">載入中...</h2>
                        <span id="activity-badge" class="badge">線性排序</span>
                    </div>
                    <p id="activity-desc" class="desc-text"></p>
                </div>

                <!-- 儀表數據盒 -->
                <div class="stats-group">
                    <div class="stat-card">
                        <span class="stat-label">時間</span>
                        <span id="timer-display" class="stat-value mono">00:00</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">移動</span>
                        <span id="moves-display" class="stat-value mono">0次</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">最佳</span>
                        <span id="best-display" class="stat-value mono">--:--</span>
                    </div>
                </div>
            </header>

            <!-- 操作方式引導線條條 -->
            <div class="instruction-bar">
                <span class="guide-tag">操作引導</span>
                <span class="guide-content">可拖曳左側握把、按上下按鈕微調，或直接點選任意兩張卡片互換。</span>
            </div>

            <!-- 卡片區域 (自適應中央空間，血液循環自動雙欄) -->
            <div id="sortable-list-wrapper">
                <ul id="sortable-list" aria-label="排序卡片清單"></ul>
            </div>

            <!-- 底部動作列與結果通知 -->
            <footer class="bottom-bar">
                <div class="action-buttons">
                    <button id="check-btn" class="btn primary-btn">
                        <span>檢核答案</span>
                    </button>
                    <button id="hint-btn" class="btn secondary-btn">
                        <span>提示</span>
                    </button>
                </div>

                <!-- 結果反饋橫幅 -->
                <div id="result-box" class="result-box hidden">
                    <span id="result-status-tag" class="result-tag"></span>
                    <span id="result-msg" class="result-text"></span>
                </div>
            </footer>
        </main>

        <!-- 通關彈窗 -->
        <div id="victory-modal" class="modal hidden" role="dialog" aria-modal="true">
            <div class="modal-content">
                <div class="modal-badge-ring">PASS</div>
                <h2>全對通關</h2>
                <p id="victory-summary">已完全掌握本單元的正確順序。</p>
                <div class="victory-stats">
                    <div class="v-stat">
                        <span class="label">本次耗時</span>
                        <span id="modal-time" class="val mono">00:00</span>
                    </div>
                    <div class="v-stat">
                        <span class="label">操作步數</span>
                        <span id="modal-moves" class="val mono">0次</span>
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="modal-retry-btn" class="btn secondary-btn">再試一次</button>
                    <button id="modal-next-btn" class="btn primary-btn">下一主題</button>
                </div>
            </div>
        </div>

        <!-- 慶祝畫布 -->
        <canvas id="confetti-canvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
