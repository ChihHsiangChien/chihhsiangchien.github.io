<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>乳化 Emulsion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>乳化</h1>
    </header>

    <section class="stage" aria-label="乳化示意動畫">
      <div class="status-bar" id="statusBar" aria-live="polite">
        <span class="step-badge" id="stepBadge">步驟 1 / 4</span>
        <span class="step-text" id="stepText">油水不相溶：密度較小的油浮在水面上</span>
      </div>

      <canvas id="scene" role="img" aria-label="一個容器，水在下、油在上；按鈕可加入乳化劑並攪拌，展示親水端與親油端包覆油滴形成微胞分散於水層。"></canvas>

      <div class="controls">
        <button id="actionBtn" class="primary">加入乳化劑</button>
        <button id="stirBtn" class="secondary">未加乳化劑直接搖晃</button>
        <button id="replayBtn" class="ghost" disabled>重置</button>
      </div>
    </section>

    <footer class="legend">
      <span class="chip oil">油 (非極性)</span>
      <span class="chip water">水 (極性)</span>
      <span class="chip emulsifier-head">乳化劑：親水端 (極性頭)</span>
      <span class="chip emulsifier-tail">乳化劑：親油端 (非極性尾)</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
