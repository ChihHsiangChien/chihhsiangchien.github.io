<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>脂質的乳化與分解（膽汁與胰液）</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="page-header">
      <h1>脂質的乳化與分解（膽汁 × 胰液）</h1>
      <p class="subtitle">比較「物理性乳化」與「化學性分解」的分子層次差異，並觀察缺少膽汁時對酵素分解的影響</p>
    </header>

    <section class="stage" aria-label="乳化與脂質分解示意動畫">
      <div class="status-bar" id="statusBar" aria-live="polite">
        <span class="step-badge" id="stepBadge">步驟 1 / 5</span>
        <span class="step-text" id="stepText">脂質（三酸甘油酯）不溶於水，聚集成大油層浮在消化液表面</span>
      </div>

      <div class="metrics-bar" id="metricsBar">
        <div class="metric-item">
          <span class="metric-label">接觸表面積</span>
          <strong class="metric-value" id="surfaceMetric">1×（大油滴）</strong>
        </div>
        <div class="metric-item">
          <span class="metric-label">變化類型</span>
          <strong class="metric-value" id="changeTypeMetric">尚未反應</strong>
        </div>
        <div class="metric-item metric-progress">
          <div class="metric-label-row">
            <span class="metric-label">脂質分解率（甘油＋脂肪酸）</span>
            <strong class="metric-value" id="digestPercent">0%</strong>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="digestFill"></div>
          </div>
        </div>
      </div>

      <canvas id="scene" role="img" aria-label="容器與分子放大鏡：展示膽汁乳化形成微胞，以及胰液將三酸甘油酯分解成甘油與脂肪酸的過程。"></canvas>

      <div class="controls">
        <button id="actionBtn" class="primary" type="button">1. 加入膽汁（乳化）</button>
        <button id="stirBtn" class="secondary" type="button">對照：未加膽汁直接搖晃</button>
        <button id="directLipaseBtn" class="warn-btn" type="button">對照：未乳化直接加胰液</button>
        <button id="replayBtn" class="ghost" type="button" disabled>重置</button>
      </div>
    </section>

    <footer class="legend">
      <span class="chip oil">脂質 / 三酸甘油酯</span>
      <span class="chip water">水 / 消化液</span>
      <span class="chip emulsifier-head">膽汁（膽鹽）：親水端</span>
      <span class="chip emulsifier-tail">膽汁（膽鹽）：親油端</span>
      <span class="chip lipase">胰液（胰脂酶酵素）</span>
      <span class="chip glycerol">產物：甘油</span>
      <span class="chip fatty-acid">產物：脂肪酸</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
