            </div>

            <div id="panelContent" class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let currentTab = 'ap'; // 'ap' | 'myelin' | 'synapse'
        let isPaused = false;
        let simSpeed = 1.0;

        // ============================================================================
        // 分頁 1：動作電位 (Action Potential) 狀態與模型
        // ============================================================================
        let apState = {
            vm: -70.0,            // 當前膜電位 (mV)
            phase: 'resting',     // 'resting' | 'subthreshold' | 'depolarizing' | 'repolarizing' | 'hyperpolarizing' | 'recovery'
            timer: 0,             // 動作電位時間進度 (0 ~ 100)
            gNa: 0.02,            // Na+ 相對電導 (0 ~ 1)
            gK: 0.08,             // K+ 相對電導 (0 ~ 1)
            mGate: 0.0,           // Na+ 通道活化閘門 (0=關, 1=開)
            hGate: 1.0,           // Na+ 通道不活化球閘門 (1=開/未堵住, 0=堵住不活化)
            nGate: 0.0,           // K+ 通道延遲整流閘門 (0=關, 1=開)
            pumpAngle: 0,         // 鈉鉀幫浦運轉相位
            ttxBlocked: false,    // 河豚毒 TTX 阻斷電壓閘門 Na+ 通道
            teaBlocked: false,    // 四乙基銨 TEA 阻斷電壓閘門 K+ 通道
            subPeak: -70,
            history: [],          // 示波器歷史軌跡 { vm, gNa, gK, phase }
            ions: []              // 跨膜運動離子粒子
        };

        // 初始化示波器歷史紀錄
        function initAPHistory() {
            apState.history = [];
            for (let i = 0; i < 260; i++) {
                apState.history.push({ vm: -70, gNa: 0.02, gK: 0.08 });
            }
            apState.ions = [];
            // 產生細胞外 Na+ 與細胞內 K+ 背景離子
            for (let i = 0; i < 28; i++) {
                apState.ions.push({
                    type: 'Na',
                    x: 90 + Math.random() * 880,
                    y: 75 + Math.random() * 95,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    inTransit: false
                });
                apState.ions.push({
                    type: 'K',
                    x: 90 + Math.random() * 880,
                    y: 295 + Math.random() * 95,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    inTransit: false
                });
            }
        }

        // 給予刺激
        function stimulateAP(level) {
            if (apState.ttxBlocked && (level === 'threshold' || level === 'supra')) {
                // TTX 阻斷下，即使強刺激也只能產生局部被動電位，無法開啟 Na+ 通道產生動作電位
                apState.phase = 'subthreshold';
                apState.subPeak = -52;
                apState.timer = 0;
                updatePhaseUI();
                return;
            }

            // 檢查是否處於絕對不反應期 (Absolute Refractory Period)
            if (apState.phase === 'depolarizing' || (apState.phase === 'repolarizing' && apState.hGate < 0.35)) {
                flashRefractoryWarning('⚠️ 處於【絕對不反應期】！Na⁺ 不活化球閘門 (h-gate) 封閉中，任何強度刺激皆無法再次激發！');
                return;
            }

            // 相對不反應期：只有超強刺激 (supra) 可激發，一般閾值刺激只能產生次閾值波動
            if (apState.phase === 'hyperpolarizing' && level === 'threshold') {
                flashRefractoryWarning('ℹ️ 處於【相對不反應期】(過極化 -80mV)，一般閾值刺激不足以跨過 -55mV，請改用「超強刺激」！');
                apState.phase = 'subthreshold';
                apState.subPeak = -59;
                apState.timer = 0;
                return;
            }

            if (level === 'sub1') {
                apState.phase = 'subthreshold';
                apState.subPeak = -62;
                apState.timer = 0;
            } else if (level === 'sub2') {
                apState.phase = 'subthreshold';
                apState.subPeak = -57;
                apState.timer = 0;
            } else if (level === 'threshold' || level === 'supra') {
                apState.phase = 'depolarizing';
                apState.timer = 0;
                // 發射跨膜 Na+ 內流粒子
                spawnChannelIons('Na_in', 14);
            }
            updatePhaseUI();
        }

        let warningMessage = '';
        let warningAlpha = 0;
        function flashRefractoryWarning(msg) {
            warningMessage = msg;
            warningAlpha = 1.0;
        }

        function spawnChannelIons(mode, count) {
            for (let i = 0; i < count; i++) {
                if (mode === 'Na_in') {
                    // 從兩個電壓閘門 Na+ 通道口 (x=380, x=540) 衝入胞內
                    const chX = (i % 2 === 0) ? 380 : 540;
                    apState.ions.push({
                        type: 'Na',
                        x: chX + (Math.random() - 0.5) * 14,
                        y: 155 - Math.random() * 45,
                        vx: (Math.random() - 0.5) * 1.6,
                        vy: 2.8 + Math.random() * 1.8,
                        inTransit: true,
                        life: 55
                    });
                } else if (mode === 'K_out') {
                    // 從電壓閘門 K+ 通道口 (x=720) 衝出胞外
                    const chX = 720;
                    apState.ions.push({
                        type: 'K',
                        x: chX + (Math.random() - 0.5) * 14,
                        y: 295 + Math.random() * 45,
                        vx: (Math.random() - 0.5) * 1.6,
                        vy: -(2.6 + Math.random() * 1.8),
                        inTransit: true,
                        life: 55
                    });
                }
            }
        }

        // 手動跳至特定動作電位階段（供教學逐步解析）
        function jumpToAPPhase(targetPhase) {
            isPaused = true;
            updatePauseBtn();
            if (targetPhase === 'resting') {
                apState.phase = 'resting';
                apState.vm = -70;
                apState.mGate = 0.0;
                apState.hGate = 1.0;
                apState.nGate = 0.0;
                apState.gNa = 0.02;
                apState.gK = 0.08;
            } else if (targetPhase === 'threshold') {
                apState.phase = 'depolarizing';
                apState.timer = 5;
                apState.vm = -55;
                apState.mGate = 0.45;
                apState.hGate = 0.95;
                apState.nGate = 0.05;
                apState.gNa = 0.35;
                apState.gK = 0.10;
            } else if (targetPhase === 'depolarizing') {
                apState.phase = 'depolarizing';
                apState.timer = 18;
                apState.vm = +28;
                apState.mGate = 1.0;
                apState.hGate = 0.55;
                apState.nGate = 0.25;
                apState.gNa = 0.95;
                apState.gK = 0.25;
                spawnChannelIons('Na_in', 10);
            } else if (targetPhase === 'repolarizing') {
                apState.phase = 'repolarizing';
                apState.timer = 42;
                apState.vm = -25;
                apState.mGate = 0.3;
                apState.hGate = 0.0; // 不活化球堵住！
                apState.nGate = 0.95;
                apState.gNa = 0.08;
                apState.gK = 0.92;
                spawnChannelIons('K_out', 10);
            } else if (targetPhase === 'hyperpolarizing') {
                apState.phase = 'hyperpolarizing';
                apState.timer = 72;
                apState.vm = -80;
                apState.mGate = 0.0;
                apState.hGate = 0.75;
                apState.nGate = 0.48;
                apState.gNa = 0.02;
                apState.gK = 0.45;
            }
            updatePhaseUI();
        }

        function updateAPSimulation() {
            if (warningAlpha > 0) warningAlpha -= 0.012;
            apState.pumpAngle += 0.05 * simSpeed;

            if (!isPaused) {
                const dt = 0.85 * simSpeed;
                apState.timer += dt;

                if (apState.phase === 'resting') {
                    apState.vm += (-70 - apState.vm) * 0.15;
                    apState.mGate = 0.0;
                    apState.hGate = 1.0;
                    apState.nGate = 0.0;
                    apState.gNa = 0.02;
                    apState.gK = 0.08;

                } else if (apState.phase === 'subthreshold') {
                    // 局部漸進電位：短暫上升但未達 -55mV 閾值，隨即指數衰減回 -70mV
                    if (apState.timer < 12) {
                        const t = apState.timer / 12;
                        apState.vm = -70 + (apState.subPeak - (-70)) * Math.sin(t * Math.PI * 0.5);
                        apState.mGate = 0.15 * Math.sin(t * Math.PI * 0.5);
                    } else if (apState.timer < 42) {
                        const t = (apState.timer - 12) / 30;
                        apState.vm = apState.subPeak + (-70 - apState.subPeak) * (1 - Math.exp(-3.5 * t));
                        apState.mGate = Math.max(0, 0.15 * (1 - t));
                    } else {
                        apState.phase = 'resting';
                        apState.vm = -70;
                        updatePhaseUI();
                    }
                    apState.gNa = 0.02 + apState.mGate * 0.12;
                    apState.gK = 0.08;

                } else if (apState.phase === 'depolarizing') {
                    // 急速去極化：mGate 迅速全開，Na+ 大量湧入，膜電位由 -70 ➔ -55 ➔ +30 mV
                    const t = Math.min(1, apState.timer / 24);
                    if (t < 0.28) {
                        // 爬升至閾值 -55mV
                        const subT = t / 0.28;
                        apState.vm = -70 + 15 * subT;
                        apState.mGate = 0.35 * subT;
                        apState.hGate = 1.0;
                    } else {
                        // 跨越閾值後正回饋爆發至 +30mV
                        const burstT = (t - 0.28) / 0.72;
                        apState.vm = -55 + 85 * Math.sin(burstT * Math.PI * 0.5);
                        apState.mGate = 0.35 + 0.65 * Math.sin(burstT * Math.PI * 0.5);
                        apState.hGate = 1.0 - 0.85 * Math.pow(burstT, 1.8);
                    }
                    apState.nGate = apState.teaBlocked ? 0.05 : 0.30 * Math.pow(t, 2);
                    apState.gNa = 0.02 + 0.94 * apState.mGate * Math.max(0.2, apState.hGate);
                    apState.gK = 0.08 + 0.25 * apState.nGate;

                    if (apState.timer >= 24) {
                        apState.phase = 'repolarizing';
                        if (!apState.teaBlocked) spawnChannelIons('K_out', 14);
                        updatePhaseUI();
                    }

                } else if (apState.phase === 'repolarizing') {
                    // 再極化：Na+ 通道不活化球 (h-gate=0) 堵死通道，K+ 通道 (n-gate=1) 大開，K+ 外流使電位降至 -70mV
                    const repolDuration = apState.teaBlocked ? 65 : 30; // TEA 阻斷 K+ 通道時再極化顯著延長
                    const t = Math.min(1, (apState.timer - 24) / repolDuration);
                    apState.mGate = Math.max(0, 1.0 - t * 1.4);
                    apState.hGate = 0.0; // 不活化球緊閉 (絕對不反應期)
                    apState.nGate = apState.teaBlocked ? 0.12 : Math.sin(t * Math.PI * 0.5) * 0.95;
                    apState.vm = 30 - 100 * Math.pow(t, 0.9);
                    apState.gNa = 0.02 + 0.15 * (1 - t);
                    apState.gK = apState.teaBlocked ? 0.14 : (0.30 + 0.66 * Math.sin(t * Math.PI * 0.65));

                    if (apState.timer >= 24 + repolDuration) {
                        apState.phase = apState.teaBlocked ? 'resting' : 'hyperpolarizing';
                        apState.timer = 54;
                        updatePhaseUI();
                    }

                } else if (apState.phase === 'hyperpolarizing') {
                    // 過極化 (After-hyperpolarization)：K+ 通道關閉緩慢，電位低於 -70mV 達 -80mV，隨後由 Na+/K+ 幫浦與漏通道恢復
                    const t = Math.min(1, (apState.timer - 54) / 36);
                    const dip = Math.sin(t * Math.PI);
                    apState.vm = -70 - 10.5 * dip;
                    apState.mGate = 0.0;
                    apState.hGate = Math.min(1.0, t * 1.25); // 不活化球解除阻塞 (進入相對不反應期)
                    apState.nGate = 0.85 * (1 - t);
                    apState.gNa = 0.02;
                    apState.gK = 0.08 + 0.55 * (1 - t);

                    if (apState.timer >= 90) {
                        apState.phase = 'resting';
                        apState.vm = -70;
                        updatePhaseUI();
                    }
                }

                // 推入示波器歷史紀錄
                apState.history.push({
                    vm: apState.vm,
                    gNa: apState.gNa,
                    gK: apState.gK
                });
                if (apState.history.length > 260) {
                    apState.history.shift();
                }
            }

            // 更新離子粒子運動
            for (let i = apState.ions.length - 1; i >= 0; i--) {
                const ion = apState.ions[i];
                ion.x += ion.vx * (isPaused ? 0 : simSpeed);
                ion.y += ion.vy * (isPaused ? 0 : simSpeed);

                if (ion.inTransit) {
                    if (!isPaused) ion.life -= 1;
                    if (ion.life <= 0) {
                        apState.ions.splice(i, 1);
                    }
                } else {
                    // 背景離子邊界反彈
                    if (ion.x < 85 || ion.x > 965) ion.vx *= -1;
                    if (ion.type === 'Na') {
                        if (ion.y < 68 || ion.y > 168) ion.vy *= -1;
                    } else {
                        if (ion.y < 292 || ion.y > 382) ion.vy *= -1;
                    }
                }
            }
        }

        // ============================================================================
        // 分頁 2：髓鞘與跳躍傳導 (Saltatory vs Continuous Conduction) 狀態與模型
        // ============================================================================
        let myelinState = {
            running: false,
            unmyelinatedPos: 0.0,     // 無髓鞘軸突連續傳導位置 (0 ~ 1)
            myelinatedPos: 0.0,       // 有髓鞘軸突跳躍傳導位置 (0 ~ 1)
            demyelinated: false,      // 是否開啟「脫髓鞘病變 (MS)」模擬
            unmyelinatedTimeMs: 0,
            myelinatedTimeMs: 0,
            sparks: []
        };

        function startMyelinRace() {
            myelinState.running = true;
            myelinState.unmyelinatedPos = 0.01;
            myelinState.myelinatedPos = 0.01;
            myelinState.unmyelinatedTimeMs = 0;
            myelinState.myelinatedTimeMs = 0;
        }

        function toggleDemyelination(checked) {
            myelinState.demyelinated = (checked !== undefined) ? checked : !myelinState.demyelinated;
            startMyelinRace();
            updateRightPanel();
        }

        function updateMyelinSimulation() {
            if (isPaused || !myelinState.running) return;

            // 1. 上軌：無髓鞘神經纖維 (Continuous Conduction，速度慢且均速)
            if (myelinState.unmyelinatedPos < 1.0) {
                myelinState.unmyelinatedPos = Math.min(1.0, myelinState.unmyelinatedPos + 0.0042 * simSpeed);
                myelinState.unmyelinatedTimeMs += 1.2 * simSpeed;
            }

            // 2. 下軌：有髓鞘神經纖維 (Saltatory Conduction)
            // 共有 5 個蘭氏結 (Nodes of Ranvier): 0.05, 0.27, 0.50, 0.73, 0.95
            // 在節間區 (Internode 髓鞘包覆段) 電場局部電流極快掠過；在蘭氏結處短暫開啟 Na+ 通道再生電位
            if (myelinState.myelinatedPos < 1.0) {
                const pos = myelinState.myelinatedPos;
                const nodes = [0.05, 0.27, 0.50, 0.73, 0.95];
                let nearNode = false;
                for (const n of nodes) {
                    if (Math.abs(pos - n) < 0.025) {
                        nearNode = true;
                        break;
                    }
                }

                // 若開啟「脫髓鞘病變 (Demyelination)」，第 2 與第 3 節間區 (0.29 ~ 0.70) 髓鞘受損漏電，傳導大幅減慢甚至阻滯
                if (myelinState.demyelinated && pos > 0.29 && pos < 0.72) {
                    myelinState.myelinatedPos = Math.min(1.0, pos + 0.0018 * simSpeed);
                } else if (nearNode) {
                    // 蘭氏結離子通道再生動作電位
                    myelinState.myelinatedPos = Math.min(1.0, pos + 0.012 * simSpeed);
                } else {
                    // 髓鞘節間區高速電緊張電流跳躍！
                    myelinState.myelinatedPos = Math.min(1.0, pos + 0.036 * simSpeed);
                }
                myelinState.myelinatedTimeMs += 1.2 * simSpeed;
            }
        }

        // ============================================================================
        // 分頁 3：突觸傳遞與電-化學-電轉換 (Synaptic Transmission & Summation)
        // ============================================================================
        let synapseState = {
            apProgress: -1,          // 突觸前軸突動作電位進度 (-1=未啟動, 0~1)
            caOpen: 0,               // 電壓閘門 Ca2+ 通道開啟程度
            caIons: [],              // 湧入突觸前末梢的 Ca2+ 離子
            vesicles: [              // 突觸囊泡
                { baseX: 290, baseY: 220, x: 290, y: 220, state: 'docked', fuseProgress: 0 },
                { baseX: 315, baseY: 280, x: 315, y: 280, state: 'docked', fuseProgress: 0 },
                { baseX: 295, baseY: 340, x: 295, y: 340, state: 'docked', fuseProgress: 0 }
            ],
            neurotransmitters: [],   // 釋放至突觸間隙的遞質分子
            mode: 'epsp',            // 'epsp' (興奮性 Na+ 內流) | 'ipsp' (抑制性 Cl- 內流)
            postVm: -70.0,           // 突觸後膜 / 軸丘膜電位 (mV)
            postAPProgress: -1,      // 突觸後軸丘達 -55mV 時觸發的新動作電位進度
            postHistory: []          // 突觸後膜電位軌跡
        };

        function initSynapseHistory() {
            synapseState.postHistory = [];
            for (let i = 0; i < 220; i++) {
                synapseState.postHistory.push(-70);
            }
        }

        function triggerSynapsePresynaptic(type) {
            if (type) synapseState.mode = type;
            synapseState.apProgress = 0.0;
            updateRightPanel();
        }

        // 直接在突觸後膜疊加單一 EPSP 或 IPSP（演示時間與空間加成 Summation）
        function addPostsynapticPotential(type) {
            synapseState.mode = type;
            // 釋放一波遞質分子
            for (let i = 0; i < 16; i++) {
                synapseState.neurotransmitters.push({
                    x: 375,
                    y: 200 + Math.random() * 160,
                    vx: 1.8 + Math.random() * 1.6,
                    vy: (Math.random() - 0.5) * 1.2,
                    type: type,
                    life: 70
                });
            }
            if (type === 'epsp') {
                synapseState.postVm = Math.min(30, synapseState.postVm + 8.5);
                if (synapseState.postVm >= -55 && synapseState.postAPProgress < 0) {
                    synapseState.postVm = 30;
                    synapseState.postAPProgress = 0.0;
                }
            } else {
                synapseState.postVm = Math.max(-85, synapseState.postVm - 7.5);
            }
            updateRightPanel();
        }

        function updateSynapseSimulation() {
            if (isPaused) return;

            // 1. 突觸前動作電位傳入
            if (synapseState.apProgress >= 0) {
                synapseState.apProgress += 0.025 * simSpeed;
                if (synapseState.apProgress >= 0.75 && synapseState.caOpen === 0) {
                    synapseState.caOpen = 1.0;
                    // 產生 Ca2+ 離子湧入突觸前末梢
                    for (let i = 0; i < 14; i++) {
                        synapseState.caIons.push({
                            x: 270 + Math.random() * 60,
                            y: i % 2 === 0 ? 155 : 405,
                            vx: (Math.random() - 0.5) * 1.2,
                            vy: i % 2 === 0 ? (1.8 + Math.random()) : -(1.8 + Math.random()),
                            life: 45
                        });
                    }
                    // 啟動囊泡向突觸前膜融合 (胞吐作用)
                    synapseState.vesicles.forEach(v => {
                        v.state = 'fusing';
                        v.fuseProgress = 0;
                    });
                }
                if (synapseState.apProgress >= 1.0) {
                    synapseState.apProgress = -1;
                }
            }

            if (synapseState.caOpen > 0) {
                synapseState.caOpen = Math.max(0, synapseState.caOpen - 0.015 * simSpeed);
            }

            // 2. Ca2+ 離子運動
            for (let i = synapseState.caIons.length - 1; i >= 0; i--) {
                const c = synapseState.caIons[i];
                c.x += c.vx * simSpeed;
                c.y += c.vy * simSpeed;
                c.life -= 1;
                if (c.life <= 0) synapseState.caIons.splice(i, 1);
            }

            // 3. 突觸囊泡胞吐與遞質釋放
            synapseState.vesicles.forEach(v => {
                if (v.state === 'fusing') {
                    v.fuseProgress += 0.035 * simSpeed;
                    v.x = v.baseX + Math.sin(v.fuseProgress * Math.PI) * 58;
                    if (Math.abs(v.fuseProgress - 0.5) < 0.02) {
                        // 囊泡融合瞬間釋放神經傳導物質至突觸間隙
                        for (let k = 0; k < 8; k++) {
                            synapseState.neurotransmitters.push({
                                x: 372,
                                y: v.y + (Math.random() - 0.5) * 24,
                                vx: 1.6 + Math.random() * 1.5,
                                vy: (Math.random() - 0.5) * 1.2,
                                type: synapseState.mode,
                                life: 65
                            });
                        }
                        // 改變突觸後膜電位
                        if (synapseState.mode === 'epsp') {
                            synapseState.postVm += 6.2;
                            if (synapseState.postVm >= -55 && synapseState.postAPProgress < 0) {
                                synapseState.postVm = 30;
                                synapseState.postAPProgress = 0.0;
                            }
                        } else {
                            synapseState.postVm = Math.max(-84, synapseState.postVm - 4.5);
                        }
                    }
                    if (v.fuseProgress >= 1.0) {
                        v.state = 'docked';
                        v.x = v.baseX;
                        v.fuseProgress = 0;
                    }
                }
            });

            // 4. 突觸間隙神經傳導物質擴散與受體結合
            for (let i = synapseState.neurotransmitters.length - 1; i >= 0; i--) {
                const nt = synapseState.neurotransmitters[i];
                if (nt.x < 462) {
                    nt.x += nt.vx * simSpeed;
                    nt.y += nt.vy * simSpeed;
                }
                nt.life -= 1;
                if (nt.life <= 0) synapseState.neurotransmitters.splice(i, 1);
            }

            // 5. 突觸後軸丘動作電位傳導與膜電位回歸
            if (synapseState.postAPProgress >= 0) {
                synapseState.postAPProgress += 0.025 * simSpeed;
                if (synapseState.postAPProgress < 0.35) {
                    synapseState.postVm = 30 - (synapseState.postAPProgress / 0.35) * 108;
                } else {
                    synapseState.postVm = -78 + ((synapseState.postAPProgress - 0.35) / 0.65) * 8;
                }
                if (synapseState.postAPProgress >= 1.0) {
                    synapseState.postAPProgress = -1;
                    synapseState.postVm = -70;
                }
            } else {
                // 被動衰減回 -70mV
                synapseState.postVm += (-70 - synapseState.postVm) * 0.035 * simSpeed;
            }

            synapseState.postHistory.push(synapseState.postVm);
            if (synapseState.postHistory.length > 220) {
                synapseState.postHistory.shift();
            }
        }

        // ============================================================================

        function drawVoltageGatedNaChannel(cx, cy, label) {
            ctx.save();
            const mOpen = apState.mGate; // 0=關閉, 1=全開
            const hOpen = apState.hGate; // 1=未堵住, 0=不活化球堵住通道內口
            const poreHalfW = 4 + mOpen * 12; // 通道孔徑隨活化閘門開啟而變寬

            // 左、右蛋白跨膜亞基
            ctx.fillStyle = '#0c4a6e';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.2;

            // 左亞基
            ctx.beginPath();
            ctx.roundRect(cx - 32, cy - 58, 32 - poreHalfW, 112, 10);
            ctx.fill();
            ctx.stroke();

            // 右亞基
            ctx.beginPath();
            ctx.roundRect(cx + poreHalfW, cy - 58, 32 - poreHalfW, 112, 10);
            ctx.fill();
            ctx.stroke();

            // 活化閘門 (m-gate, 位於通道中段)
            if (mOpen < 0.35) {
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(cx - poreHalfW, cy - 8);
                ctx.lineTo(cx + poreHalfW, cy - 8);
                ctx.stroke();

            // 不活化球鏈閘門 (h-gate Ball-and-Chain，位於胞內側)
            const ballX = cx - 18 + (1 - hOpen) * 18;
            const ballY = cy + 72 - (1 - hOpen) * 20;

            // 胜肽軟鏈
            ctx.strokeStyle = '#fb7185';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 22, cy + 54);
            ctx.quadraticCurveTo(cx - 28, cy + 70, ballX, ballY);

            // 不活化球體

            ctx.font = 'bold 7.5px Inter, sans-serif';

            ctx.fillStyle = '#e0f2fe';
            ctx.fillText(label, cx, cy - 72);
            ctx.font = 'bold 8.5px Inter, sans-serif';
            ctx.fillStyle = stateColor;
            ctx.fillText(stateText, cx, cy - 60);
            ctx.restore();
        }

        function drawVoltageGatedKChannel(cx, cy) {
            ctx.save();
            const nOpen = apState.nGate;
            const poreHalfW = 4 + nOpen * 12;

            ctx.fillStyle = '#78350f';
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2.2;

            // 左亞基
            ctx.beginPath();
            ctx.roundRect(cx - 32, cy - 58, 32 - poreHalfW, 112, 10);
            ctx.fill();
            ctx.stroke();

            // 右亞基
            ctx.beginPath();
            ctx.roundRect(cx + poreHalfW, cy - 58, 32 - poreHalfW, 112, 10);
            ctx.fill();
            ctx.stroke();

            // 延遲整流閘門 (n-gate)
            if (nOpen < 0.3) {
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(cx - poreHalfW, cy + 12);
                ctx.lineTo(cx + poreHalfW, cy + 12);
                ctx.stroke();
            }

            // 若 TEA 阻斷
            if (apState.teaBlocked) {
                ctx.fillStyle = '#9333ea';
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy + 56, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.font = 'bold 8px Inter, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText('TEA', cx, cy + 59);
            }

            let stateText = '關閉 (延遲開啟)';
            let stateColor = '#94a3b8';
            if (apState.teaBlocked) {
                stateText = '⛔ TEA 阻斷再極化';
                stateColor = '#c084fc';
            } else if (nOpen >= 0.3) {
                stateText = '⚡ 開啟！K⁺ 外流再極化';

            ctx.font = 'bold 9.5px Inter, sans-serif';
            ctx.fillStyle = '#fef08a';
            ctx.textAlign = 'center';
            ctx.fillText('電壓閘門 K⁺ 通道', cx, cy - 72);
            ctx.font = 'bold 8.5px Inter, sans-serif';
            ctx.fillStyle = stateColor;
            ctx.fillText(stateText, cx, cy - 60);

        function drawKLeakChannel(cx, cy) {

        function drawAPOscilloscope(x, y, w, h) {
            ctx.save();
            // 示波器外框
            ctx.fillStyle = 'rgba(9, 13, 24, 0.95)';
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 14);
            ctx.fill();
            ctx.stroke();

            const plotX = x + 65;
            const plotW = w - 230;
            const plotY = y + 22;
            const plotH = h - 44;

            // 電壓座標轉換函數 (-90mV ~ +45mV)
            const vmToY = (v) => plotY + plotH - ((v - (-90)) / (45 - (-90))) * plotH;

            // 繪製關鍵參考電壓水平線 (+30mV, 0mV, -55mV 閾值, -70mV 靜止, -80mV 過極化)
            const refLines = [
                { v: 30, label: '+30 mV (去極化峰值)', color: 'rgba(56, 189, 248, 0.35)' },
                { v: 0, label: '0 mV (電位反轉)', color: 'rgba(148, 163, 184, 0.2)' },
                { v: -55, label: '-55 mV (閾值 Threshold)', color: 'rgba(244, 63, 94, 0.55)', dashed: true },
                { v: -70, label: '-70 mV (靜止膜電位)', color: 'rgba(52, 211, 153, 0.35)' },
                { v: -80, label: '-80 mV (過極化)', color: 'rgba(251, 191, 36, 0.25)', dashed: true }
            ];

            refLines.forEach(ref => {
                const ry = vmToY(ref.v);
                ctx.strokeStyle = ref.color;
                ctx.lineWidth = 1.2;
                if (ref.dashed) ctx.setLineDash([5, 4]);
                else ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(plotX, ry);
                ctx.lineTo(plotX + plotW, ry);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.font = 'bold 9.5px JetBrains Mono, monospace';
                ctx.fillStyle = '#94a3b8';
                ctx.textAlign = 'right';
                ctx.fillText(`${ref.v} mV`, plotX - 8, ry + 3);
            });

            // 1. 繪製 gNa (藍虛線) 與 gK (黃虛線) 電導曲線
            ctx.save();
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            apState.history.forEach((pt, idx) => {
                const px = plotX + (idx / 259) * plotW;
                const py = plotY + plotH - pt.gNa * (plotH * 0.78);
                if (idx === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            });
            ctx.stroke();

            ctx.strokeStyle = 'rgba(251, 191, 36, 0.5)';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            apState.history.forEach((pt, idx) => {
                const px = plotX + (idx / 259) * plotW;
                const py = plotY + plotH - pt.gK * (plotH * 0.78);
                if (idx === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            });
            ctx.stroke();
            ctx.restore();

            // 2. 繪製膜電位 Vm 主曲線 (亮青白發光實線)
            ctx.save();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3.2;
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            apState.history.forEach((pt, idx) => {
                const px = plotX + (idx / 259) * plotW;
                const py = vmToY(pt.vm);
                if (idx === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            });
            ctx.stroke();

            // 最新光點
            const lastPt = apState.history[apState.history.length - 1];
            const lastY = vmToY(lastPt.vm);
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(plotX + plotW, lastY, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 右側即時儀表讀數區
            const meterX = plotX + plotW + 18;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(meterX, plotY, 140, plotH, 10);
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 10px Inter, sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'center';
            ctx.fillText('即時膜電位 (Vm)', meterX + 70, plotY + 24);

            ctx.font = 'bold 22px JetBrains Mono, monospace';
            ctx.fillStyle = apState.vm >= -55 ? '#38bdf8' : (apState.vm < -72 ? '#fbbf24' : '#34d399');
            ctx.fillText(`${apState.vm.toFixed(1)} mV`, meterX + 70, plotY + 52);

            // 圖例說明
            ctx.textAlign = 'left';
            ctx.font = 'bold 9.5px Inter, sans-serif';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('━ 膜電位 Vm (mV)', meterX + 12, plotY + 90);
            ctx.fillStyle = 'rgba(56, 189, 248, 0.8)';
            ctx.fillText('┅ Na⁺ 通道電導 (gNa)', meterX + 12, plotY + 112);
            ctx.fillStyle = '#fbbf24';
            ctx.fillText('┅ K⁺ 通道電導 (gK)', meterX + 12, plotY + 134);
            ctx.fillStyle = '#f43f5e';
            ctx.fillText('--- -55mV 激發閾值', meterX + 12, plotY + 156);

            // 階段拆解快速按鈕提詞
            ctx.font = '8.5px Inter, sans-serif';
            ctx.fillStyle = '#64748b';
            ctx.fillText('全有或全無律：跨越 -55mV', meterX + 12, plotY + 188);
            ctx.fillText('即爆發完整 +30mV 動作電位', meterX + 12, plotY + 202);

            ctx.restore();
        }

        // ============================================================================
        // 視覺繪製：分頁 2 (髓鞘、蘭氏結與跳躍傳導對決)
        // ============================================================================
        function drawMyelinTab() {
            const w = 1060;
            const startX = 110;
            const endX = 950;
            const axonLen = endX - startX;

            ctx.font = 'bold 13px Inter, sans-serif';
            ctx.fillStyle = '#fde047';
            ctx.textAlign = 'center';
            ctx.fillText('【 無髓鞘連續傳導 (Continuous) vs. 有髓鞘蘭氏結跳躍傳導 (Saltatory Conduction) 同屏競速 】', w / 2, 32);

            // ------------------------------------------------------------------------
            // 軌道 A：無髓鞘神經纖維 (Unmyelinated Axon, y=195)
            // ------------------------------------------------------------------------
            const yA = 195;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(60, 75, 940, 235, 16);
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 12px Inter, sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'left';
            ctx.fillText('🐢 軌道 A：無髓鞘神經纖維 (C 類慢痛纖維 · 連續傳導 Continuous Conduction · 約 0.5 ~ 2 m/s)', 85, 105);

            // 軸突管壁
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.roundRect(startX, yA - 22, axonLen, 44, 8);
            ctx.fill();
            ctx.stroke();

            // 整條軸突膜上密布的 Na+/K+ 通道小標記 (每 24px 一個，代表每處都必須逐步充放電)
            const curX_A = startX + myelinState.unmyelinatedPos * axonLen;
            for (let cx = startX + 18; cx < endX - 10; cx += 24) {
                const isDepol = Math.abs(cx - curX_A) < 28;
                const isRefractory = (cx < curX_A - 28 && cx > curX_A - 115);
                ctx.fillStyle = isDepol ? '#38bdf8' : (isRefractory ? '#f43f5e' : '#334155');
                ctx.fillRect(cx - 3, yA - 26, 6, 8);
                ctx.fillRect(cx - 3, yA + 18, 6, 8);
            }

            // 繪製連續傳導的動作電位波與後方「絕對不反應期尾跡」
            if (myelinState.unmyelinatedPos > 0) {
                // 後方絕對不反應期區段 (紅區：防止動作電位回頭逆傳！)
                const refStart = Math.max(startX, curX_A - 100);
                if (curX_A > startX + 10) {
                    ctx.fillStyle = 'rgba(244, 63, 94, 0.28)';
                    ctx.fillRect(refStart, yA - 20, curX_A - refStart - 15, 40);
                    ctx.font = 'bold 9px Inter, sans-serif';
                    ctx.fillStyle = '#fda4af';
                    ctx.textAlign = 'center';
                    ctx.fillText('🔒 不反應期 (防逆傳)', (refStart + curX_A - 15) / 2, yA + 4);
                }

                // 當前去極化亮區
                ctx.save();
                ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.arc(curX_A, yA, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 局部小電流環 (緊貼波前)
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.arc(curX_A + 16, yA - 22, 12, Math.PI, 0, false);
                ctx.arc(curX_A + 16, yA + 22, 12, 0, Math.PI, false);
                ctx.stroke();
            }

            ctx.font = '10px Inter, sans-serif';
            ctx.fillStyle = '#cbd5e1';
            ctx.textAlign = 'left';
            ctx.fillText('機制：無髓鞘絕緣，整段細胞膜皆須逐點開啟 Na⁺ 通道充放電，膜電容充電耗時且易漏電，傳導緩慢。', 85, 286);

            // 右上計時器
            ctx.font = 'bold 12px JetBrains Mono, monospace';
            ctx.fillStyle = myelinState.unmyelinatedPos >= 1.0 ? '#34d399' : '#38bdf8';
            ctx.textAlign = 'right';
            ctx.fillText(
                myelinState.unmyelinatedPos >= 1.0 ? `抵達終點！耗時 ${myelinState.unmyelinatedTimeMs.toFixed(0)} ms` : `傳導進度 ${(myelinState.unmyelinatedPos * 100).toFixed(0)}%`,
                975, 105
            );

            // ------------------------------------------------------------------------
            // 軌道 B：有髓鞘神經纖維 (Myelinated Axon — 蘭氏結跳躍傳導, y=495)
            // ------------------------------------------------------------------------
            const yB = 495;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
            ctx.strokeStyle = myelinState.demyelinated ? '#f43f5e' : '#f59e0b';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.roundRect(60, 345, 940, 315, 16);
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 12px Inter, sans-serif';
            ctx.fillStyle = myelinState.demyelinated ? '#fda4af' : '#fbbf24';
            ctx.textAlign = 'left';
            ctx.fillText(
                myelinState.demyelinated
                    ? '⚠️ 軌道 B：脫髓鞘病變模擬 (如多發性硬化症 MS · 節間髓鞘剝落導致電流外洩與傳導阻滯！)'
                    : '🚀 軌道 B：有髓鞘神經纖維 (Aα 運動/本體感覺纖維 · 蘭氏結跳躍傳導 Saltatory Conduction · 70 ~ 120 m/s)',
                85, 378
            );

            // 軸突主幹
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.roundRect(startX, yB - 20, axonLen, 40, 8);
            ctx.fill();
            ctx.stroke();

            // 5 個蘭氏結位置 (Nodes of Ranvier) 與 4 段許旺細胞髓鞘節間區 (Internodes)
            const nodeFractions = [0.05, 0.27, 0.50, 0.73, 0.95];
            const nodeXs = nodeFractions.map(f => startX + f * axonLen);
            const curX_B = startX + myelinState.myelinatedPos * axonLen;

            // 繪製 4 段髓鞘 (Internodes)
            for (let i = 0; i < 4; i++) {
                const mStart = nodeXs[i] + 16;
                const mEnd = nodeXs[i + 1] - 16;
                const mW = mEnd - mStart;
                const isDamaged = myelinState.demyelinated && (i === 1 || i === 2);

                if (isDamaged) {
                    // 脫髓鞘受損節段：虛線殘骸與電流外洩箭頭
                    ctx.strokeStyle = '#f43f5e';
                    ctx.lineWidth = 1.8;
                    ctx.setLineDash([4, 4]);
                    ctx.strokeRect(mStart, yB - 34, mW, 68);
                    ctx.setLineDash([]);

                    ctx.font = 'bold 9.5px Inter, sans-serif';
                    ctx.fillStyle = '#fda4af';
                    ctx.textAlign = 'center';
                    ctx.fillText('⚡ 髓鞘剝落 (電流外洩、缺乏 Na⁺ 通道)', mStart + mW / 2, yB - 42);
                } else {
                    // 正常多層脂質髓鞘包裹 (高電阻、低電容絕緣層)
                    const grad = ctx.createLinearGradient(0, yB - 38, 0, yB + 38);
                    grad.addColorStop(0, '#d97706');
                    grad.addColorStop(0.25, '#fbbf24');
                    grad.addColorStop(0.5, '#451a03');
                    grad.addColorStop(0.75, '#fbbf24');
                    grad.addColorStop(1, '#d97706');

                    ctx.fillStyle = grad;
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2;
                    // 上下髓鞘切面
                    ctx.beginPath();
                    ctx.roundRect(mStart, yB - 38, mW, 18, 6);
                    ctx.roundRect(mStart, yB + 20, mW, 18, 6);
                    ctx.fill();
                    ctx.stroke();

                    ctx.font = 'bold 9px Inter, sans-serif';
                    ctx.fillStyle = '#fef08a';
                    ctx.textAlign = 'center';
                    ctx.fillText(`許旺細胞髓鞘 #${i + 1} (絕緣節間區)`, mStart + mW / 2, yB - 45);
                }
            }

            // 繪製 5 個蘭氏結 (Nodes of Ranvier：高密度聚集電壓閘門 Na+ 通道)
            nodeXs.forEach((nx, idx) => {
                const isNodeActive = Math.abs(curX_B - nx) < 35;
                ctx.fillStyle = isNodeActive ? '#00f2fe' : '#0284c7';
                ctx.fillRect(nx - 10, yB - 26, 20, 8);
                ctx.fillRect(nx - 10, yB + 18, 20, 8);

                ctx.font = 'bold 9px Inter, sans-serif';
                ctx.fillStyle = isNodeActive ? '#ffffff' : '#38bdf8';
                ctx.textAlign = 'center';
                ctx.fillText(`蘭氏結 ${idx + 1}`, nx, yB + 54);

                if (isNodeActive) {
                    // 蘭氏結 Na+ 內流閃光
                    ctx.save();
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(nx, yB, 28, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            });

            // 繪製跳躍傳導的長距離跨節間電緊張電流弧線 (Saltatory Leap Arcs)
            for (let i = 0; i < 4; i++) {
                const n1 = nodeXs[i];
                const n2 = nodeXs[i + 1];
                if (curX_B >= n1 && curX_B <= n2 + 25) {
                    ctx.save();
                    const isDamaged = myelinState.demyelinated && (i === 1 || i === 2);
                    ctx.strokeStyle = isDamaged ? '#f43f5e' : '#38bdf8';
                    ctx.lineWidth = 2.8;
                    ctx.shadowColor = isDamaged ? '#f43f5e' : '#00f2fe';
                    ctx.shadowBlur = 12;
                    ctx.setLineDash([6, 4]);

                    // 上方跳躍電場弧線
                    ctx.beginPath();
                    ctx.moveTo(n1, yB - 24);
                    ctx.quadraticCurveTo((n1 + n2) / 2, yB - 88, n2, yB - 24);
                    ctx.stroke();

                    // 軸突內部高速局部正電荷流
                    ctx.setLineDash([]);
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(n1, yB);
                    ctx.lineTo(Math.min(curX_B, n2), yB);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // 當前前導波光點
            if (myelinState.myelinatedPos > 0) {
                ctx.save();
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 22;
                ctx.beginPath();
                ctx.arc(curX_B, yB, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(curX_B, yB, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.font = 'bold 12px JetBrains Mono, monospace';
            ctx.fillStyle = myelinState.myelinatedPos >= 1.0 ? '#34d399' : '#fbbf24';
            ctx.textAlign = 'right';
            ctx.fillText(
                myelinState.myelinatedPos >= 1.0 ? `🏆 抵達終點！耗時 ${myelinState.myelinatedTimeMs.toFixed(0)} ms` : `傳導進度 ${(myelinState.myelinatedPos * 100).toFixed(0)}%`,
                975, 378
            );

            ctx.font = '10px Inter, sans-serif';
            ctx.fillStyle = '#cbd5e1';
            ctx.textAlign = 'left';
            ctx.fillText('機制：髓鞘具高電阻、低電容特性，阻止節間區離子漏出；局部電流以電場速度在軸質內直衝下一蘭氏結，大幅節省時間與 ATP！', 85, 638);
        }

        // ============================================================================
        // 視覺繪製：分頁 3 (突觸傳遞：電訊號 ➔ 化學遞質 ➔ 電訊號 與 電位加成)
        // ============================================================================
        function drawSynapseTab() {
            const w = 1060;

            ctx.font = 'bold 13px Inter, sans-serif';
            ctx.fillStyle = '#fde047';
            ctx.textAlign = 'center';
            ctx.fillText('【 化學性突觸傳遞：動作電位 ➔ Ca²⁺ 內流 ➔ 突觸囊泡胞吐 ➔ 配體閘門通道 ➔ EPSP/IPSP 加成 】', w / 2, 28);

            // ------------------------------------------------------------------------
            // 1. 左側：突觸前軸突末梢膨大 (Presynaptic Axon Terminal / Bouton)
            // ------------------------------------------------------------------------
            ctx.save();
            ctx.fillStyle = 'rgba(14, 165, 233, 0.12)';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.8;
            ctx.beginPath();
            ctx.moveTo(70, 215);
            ctx.lineTo(220, 215);
            ctx.quadraticCurveTo(372, 130, 372, 280);
            ctx.quadraticCurveTo(372, 430, 220, 345);
            ctx.lineTo(70, 345);
            ctx.stroke();
            ctx.fill();

            ctx.font = 'bold 12px Inter, sans-serif';
            ctx.fillStyle = '#e0f2fe';
            ctx.textAlign = 'center';
            ctx.fillText('突觸前神經元 (軸突末梢突觸小體)', 225, 145);

            // 突觸前動作電位傳入光波
            if (synapseState.apProgress >= 0) {
                const apX = 75 + synapseState.apProgress * 285;
                ctx.save();
                ctx.fillStyle = 'rgba(56, 189, 248, 0.55)';
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(apX, 280, 24, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 電壓閘門型 Ca2+ 通道 (位於突觸前膜上下緣)
            const caGlow = synapseState.caOpen > 0;
            ctx.fillStyle = caGlow ? '#10b981' : '#064e3b';
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(280, 155, 42, 18, 5);
            ctx.roundRect(280, 388, 42, 18, 5);
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 9.5px Inter, sans-serif';
            ctx.fillStyle = '#6ee7b7';
            ctx.fillText('電壓閘門 Ca²⁺ 通道', 301, 147);
            ctx.fillText('電壓閘門 Ca²⁺ 通道', 301, 420);

            // Ca2+ 離子粒子
            synapseState.caIons.forEach(c => {
                ctx.fillStyle = '#34d399';
                ctx.beginPath();
                ctx.arc(c.x, c.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = 'bold 7px Inter, sans-serif';
                ctx.fillStyle = '#020617';
                ctx.fillText('Ca²⁺', c.x, c.y + 2.5);
            });

            // 突觸囊泡 (Synaptic Vesicles)
            synapseState.vesicles.forEach((v, idx) => {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.strokeStyle = synapseState.mode === 'epsp' ? '#34d399' : '#f43f5e';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.arc(v.x, v.y, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 囊泡內的遞質小點
                for (let a = 0; a < 6; a++) {
                    const ang = (a / 6) * Math.PI * 2;
                    ctx.fillStyle = synapseState.mode === 'epsp' ? '#34d399' : '#fb7185';
                    ctx.beginPath();
                    ctx.arc(v.x + Math.cos(ang) * 9, v.y + Math.sin(ang) * 9, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.font = 'bold 9.5px Inter, sans-serif';
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText('突觸囊泡 (內含神經傳導物質)', 200, 284);
            ctx.restore();

            // ------------------------------------------------------------------------
            // 2. 中央：突觸間隙 (Synaptic Cleft, x=372..465)
            // ------------------------------------------------------------------------
            ctx.font = 'bold 10.5px Inter, sans-serif';
            ctx.fillStyle = '#fde047';
            ctx.textAlign = 'center';
            ctx.fillText('突觸間隙', 418, 125);
            ctx.font = '8.5px Inter, sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('(20~40 nm 化學擴散)', 418, 138);

            // 突觸間隙中的神經傳導物質粒子
            synapseState.neurotransmitters.forEach(nt => {
                ctx.fillStyle = nt.type === 'epsp' ? '#34d399' : '#f43f5e';
                ctx.shadowColor = nt.type === 'epsp' ? '#34d399' : '#f43f5e';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(nt.x, nt.y, 4.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // ------------------------------------------------------------------------
            // 3. 右側：突觸後神經元樹突/胞體與軸丘 (Postsynaptic Neuron & Axon Hillock)
            // ------------------------------------------------------------------------
            ctx.save();
            const isFiring = synapseState.postAPProgress >= 0;
            ctx.fillStyle = isFiring ? 'rgba(56, 189, 248, 0.22)' : 'rgba(168, 85, 247, 0.12)';
            ctx.strokeStyle = isFiring ? '#38bdf8' : '#c084fc';
            ctx.lineWidth = 2.8;
            ctx.beginPath();
            ctx.moveTo(465, 165);
            ctx.quadraticCurveTo(465, 280, 465, 395);
            ctx.quadraticCurveTo(600, 415, 700, 325);
            ctx.lineTo(980, 325);
            ctx.lineTo(980, 235);
            ctx.lineTo(700, 235);
            ctx.quadraticCurveTo(600, 145, 465, 165);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 12px Inter, sans-serif';
            ctx.fillStyle = '#f3e8ff';
            ctx.textAlign = 'center';
            ctx.fillText('突觸後神經元 (樹突受體膜 ➔ 軸丘整合區)', 640, 145);

            // 突觸後膜上的化學(配體)閘門型離子通道受體 (3 組)
            [215, 280, 345].forEach(ry => {
                ctx.fillStyle = synapseState.mode === 'epsp' ? '#0369a1' : '#881337';
                ctx.strokeStyle = synapseState.mode === 'epsp' ? '#38bdf8' : '#fb7185';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(454, ry - 16, 24, 32, 6);
                ctx.fill();
                ctx.stroke();

                // 若有遞質抵達，顯示 Na+ (EPSP) 或 Cl- (IPSP) 湧入箭頭
                if (synapseState.neurotransmitters.length > 0) {
                    ctx.font = 'bold 9px Inter, sans-serif';
                    ctx.fillStyle = synapseState.mode === 'epsp' ? '#38bdf8' : '#fda4af';
                    ctx.textAlign = 'left';
                    ctx.fillText(synapseState.mode === 'epsp' ? '➔ Na⁺ 內流 (去極化 EPSP)' : '➔ Cl⁻ 內流 (過極化 IPSP)', 485, ry + 3);
                }
            });

            // 軸丘 (Axon Hillock, x=710) 整合觸發區標示
            ctx.strokeStyle = '#fde047';
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(710, 225);
            ctx.lineTo(710, 335);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.font = 'bold 10px Inter, sans-serif';
            ctx.fillStyle = '#fde047';
            ctx.textAlign = 'center';
            ctx.fillText('⚡ 軸丘 (Axon Hillock)', 710, 215);
            ctx.font = '8.5px Inter, sans-serif';
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText('總和達 -55mV 即爆發新動作電位', 710, 352);

            // 若軸丘達閾值，繪製往右傳導的新動作電位
            if (synapseState.postAPProgress >= 0) {
                const newApX = 710 + synapseState.postAPProgress * 260;
                ctx.save();
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 22;
                ctx.beginPath();
                ctx.arc(newApX, 280, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = 'bold 10px Inter, sans-serif';
                ctx.fillStyle = '#fef08a';
                ctx.fillText('🔥 突觸後動作電位成功觸發！', newApX, 248);
                ctx.restore();
            }
            ctx.restore();

            // ------------------------------------------------------------------------
            // 4. 下半部：突觸後軸丘膜電位加成示波器 (EPSP / IPSP Summation, y=455..690)
            // ------------------------------------------------------------------------
            const sx = 70, sy = 455, sw = 920, sh = 230;
            ctx.fillStyle = 'rgba(9, 13, 24, 0.95)';
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(sx, sy, sw, sh, 14);
            ctx.fill();
            ctx.stroke();

            const px0 = sx + 70, pw = sw - 240, py0 = sy + 20, ph = sh - 40;
            const vmToY = (v) => py0 + ph - ((v - (-90)) / (40 - (-90))) * ph;

            // 閾值線 -55mV 與 靜止線 -70mV
            const yThresh = vmToY(-55);
            const yRest = vmToY(-70);

            ctx.strokeStyle = 'rgba(244, 63, 94, 0.6)';
            ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.moveTo(px0, yThresh); ctx.lineTo(px0 + pw, yThresh); ctx.stroke();
            ctx.setLineDash([]);
            ctx.font = 'bold 9.5px JetBrains Mono, monospace';
            ctx.fillStyle = '#fda4af';
            ctx.textAlign = 'right';
            ctx.fillText('-55 mV 閾值', px0 - 6, yThresh + 3);

            ctx.strokeStyle = 'rgba(52, 211, 153, 0.35)';
            ctx.beginPath(); ctx.moveTo(px0, yRest); ctx.lineTo(px0 + pw, yRest); ctx.stroke();
            ctx.fillStyle = '#6ee7b7';
            ctx.fillText('-70 mV 靜止', px0 - 6, yRest + 3);

            // 繪製突觸後膜電位軌跡
            ctx.strokeStyle = '#c084fc';
            ctx.lineWidth = 3;
            ctx.beginPath();
            synapseState.postHistory.forEach((v, idx) => {
                const curX = px0 + (idx / 219) * pw;
                const curY = vmToY(v);
                if (idx === 0) ctx.moveTo(curX, curY);
                else ctx.lineTo(curX, curY);
            });
            ctx.stroke();

            // 右側軸丘電位表
            ctx.font = 'bold 11px Inter, sans-serif';
            ctx.fillStyle = '#cbd5e1';
            ctx.textAlign = 'center';
            ctx.fillText('軸丘總和電位', px0 + pw + 85, py0 + 40);
            ctx.font = 'bold 22px JetBrains Mono, monospace';
            ctx.fillStyle = synapseState.postVm >= -55 ? '#38bdf8' : (synapseState.postVm < -71 ? '#f43f5e' : '#c084fc');
            ctx.fillText(`${synapseState.postVm.toFixed(1)} mV`, px0 + pw + 85, py0 + 70);

            ctx.font = '9.5px Inter, sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('連按「疊加 EPSP」可演示', px0 + pw + 85, py0 + 115);
            ctx.fillText('時間加成跨過 -55mV 閾值！', px0 + pw + 85, py0 + 132);
        }

        // ============================================================================
        // 主繪圖迴圈與自适应縮放
        // ============================================================================
        function resizeCanvas() {
            const container = document.getElementById('canvasContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function drawLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const targetW = 1060;
            const targetH = 720;
            const scale = Math.min((canvas.width - 20) / targetW, (canvas.height - 20) / targetH, 1.15);
            const offX = (canvas.width - targetW * scale) / 2;
            const offY = (canvas.height - targetH * scale) / 2;

            ctx.save();
            ctx.translate(offX, offY);
            ctx.scale(scale, scale);

            if (currentTab === 'ap') {
                updateAPSimulation();
                drawAPTab();
            } else if (currentTab === 'myelin') {
                updateMyelinSimulation();
                drawMyelinTab();
            } else if (currentTab === 'synapse') {
                updateSynapseSimulation();
                drawSynapseTab();
            }

            ctx.restore();
            requestAnimationFrame(drawLoop);
        }

        // UI 面板與互動控制
        // ============================================================================

            currentTab = tab;
            isPaused = false;
            updatePauseBtn();

                document.getElementById('tabBtnAP').classList.add('active');
                hud.innerHTML = `動作電位與離子通道：觀察<strong>電壓閘門型 Na⁺ 通道 (m活化閘門 / h不活化球閘門)</strong>與<strong>K⁺ 通道</strong>如何協同產生去極化與再極化。`;
                primaryBtn.innerHTML = `<span>⚡ 觸發閾值刺激 (產生動作電位)</span>`;
            } else if (tab === 'myelin') {
                document.getElementById('tabBtnMyelin').classList.add('active');
                hud.innerHTML = `髓鞘與跳躍傳導：比較<strong>無髓鞘連續傳導</strong>與<strong>有髓鞘蘭氏結跳躍傳導</strong>的速度差異，並可模擬<strong>脫髓鞘病變 (MS)</strong>。`;

                startMyelinRace();

                document.getElementById('tabBtnSynapse').classList.add('active');
                hud.innerHTML = `化學性突觸傳遞：觀察<strong>電訊號 ➔ Ca²⁺ 內流 ➔ 突觸囊泡胞吐 ➔ 化學遞質擴散 ➔ 突觸後電位加成 (EPSP/IPSP)</strong>。`;
                primaryBtn.innerHTML = `<span>⚡ 激發突觸前動作電位傳入</span>`;
                triggerSynapsePresynaptic('epsp');
            }
            updateRightPanel();
        }

        function triggerPrimaryAction() {
            if (currentTab === 'ap') {
                isPaused = false;
                updatePauseBtn();
                stimulateAP('threshold');
            } else if (currentTab === 'myelin') {
                isPaused = false;
                updatePauseBtn();
                startMyelinRace();
            } else if (currentTab === 'synapse') {
                isPaused = false;
                updatePauseBtn();
                triggerSynapsePresynaptic(synapseState.mode);
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            updatePauseBtn();
        }

        function updatePauseBtn() {
            const btn = document.getElementById('pauseBtn');
            if (btn) btn.innerText = isPaused ? '▶ 繼續' : '⏸ 暫停';
        }

        function resetCurrentTab() {
            isPaused = false;
            updatePauseBtn();
            if (currentTab === 'ap') {
                apState.ttxBlocked = false;
                apState.teaBlocked = false;
                apState.phase = 'resting';
                apState.vm = -70;
                initAPHistory();
            } else if (currentTab === 'myelin') {
                myelinState.demyelinated = false;
                startMyelinRace();
            } else if (currentTab === 'synapse') {
                synapseState.postVm = -70;
                synapseState.postAPProgress = -1;
                synapseState.neurotransmitters = [];
                initSynapseHistory();

            updateRightPanel();

                            1. <strong class="text-amber-300">高電阻、低電容絕緣層</strong>：許旺細胞（周邊 PNS）或寡突膠質細胞（中樞 CNS）由多層脂雙層緊密纏繞軸突，防止局部電流外洩。<br>
                            2. <strong class="text-sky-300">蘭氏結 (Nodes of Ranvier) 跳躍再生</strong>：電壓閘門型 Na⁺ 通道高度集中在裸露的蘭氏結，局部電流在節間區以電場速度瞬間傳至下一結。<br>
                            3. <strong class="text-emerald-300">大幅節省 ATP</strong>：僅蘭氏結處有離子進出，鈉鉀幫浦耗能減少 90% 以上！
                        </p>
                        <button onclick="startMyelinRace()" class="w-full py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-bold shadow transition">
                            🚀 重新發射雙軌競速脈衝
                        </button>
                    </div>

                    <div class="bg-slate-950/90 p-3.5 rounded-2xl border border-rose-500/40 space-y-2">
                        <label class="flex items-center justify-between cursor-pointer">
                            <div>
                                <div class="font-bold text-rose-300">⚠️ 模擬「脫髓鞘病變 (Demyelination)」</div>
                                <div class="text-[10px] text-slate-400 mt-0.5">如多發性硬化症 (MS) 或格林-巴利症候群 (GBS)</div>
                            </div>
                            <input type="checkbox" ${myelinState.demyelinated ? 'checked' : ''} onchange="toggleDemyelination(this.checked)" class="w-4 h-4 accent-rose-500 rounded cursor-pointer">
                        </label>
                        <p class="text-[11px] text-slate-300 leading-relaxed pt-1 border-t border-slate-800">
                            當髓鞘遭自體免疫破壞剝落時，原本絕緣的節間區不僅<strong>嚴重漏電</strong>，且節間軸突膜<strong>缺乏足夠密度的電壓閘門 Na⁺ 通道</strong>，導致訊號傳導急劇減慢甚至發生<strong>傳導阻滯 (Conduction Block)</strong>！
                        </p>
                    </div>

                    <div class="bg-slate-950/80 p-3.5 rounded-2xl border border-slate-800 space-y-1.5">
                        <div class="font-bold text-sky-300">🔒 為什麼動作電位不會「往回跑」？</div>
                        <p class="text-[11px] text-slate-300 leading-relaxed">
                            觀察軌道 A 波峰後方的<strong class="text-rose-400">紅色不反應期尾跡</strong>：剛發生過動作電位的區段，其 Na⁺ 通道處於<strong>不活化狀態 (h-gate 封閉)</strong>，因此局部電流只能向前方待命區段擴散，確保神經衝動<strong>100% 單向傳導</strong>！
                        </p>
                    </div>
                `;

            } else if (currentTab === 'synapse') {
                title.innerText = '突觸傳遞與電-化學-電轉換';
                panel.innerHTML = `
                    <div class="bg-slate-950/90 p-3.5 rounded-2xl border border-emerald-500/40 space-y-2">
                        <span class="font-bold text-emerald-300 block">⚡ 1. 突觸前動作電位傳入示範：</span>
                        <div class="grid grid-cols-1 gap-1.5">
                            <button onclick="triggerSynapsePresynaptic('epsp')" class="p-2.5 rounded-xl bg-emerald-950/80 hover:bg-emerald-900 border ${synapseState.mode === 'epsp' ? 'border-emerald-400' : 'border-slate-800'} text-emerald-200 text-left font-bold transition">
                                <div>🟢 興奮性突觸傳遞 (Glutamate / ACh)</div>
                                <div class="text-[10px] text-slate-300 font-normal">開啟突觸後 Na⁺ 通道 ➔ 去極化產生 EPSP</div>
                            </button>
                            <button onclick="triggerSynapsePresynaptic('ipsp')" class="p-2.5 rounded-xl bg-rose-950/80 hover:bg-rose-900 border ${synapseState.mode === 'ipsp' ? 'border-rose-400' : 'border-slate-800'} text-rose-200 text-left font-bold transition">
                                <div>🔴 抑制性突觸傳遞 (GABA / Glycine)</div>
                                <div class="text-[10px] text-slate-300 font-normal">開啟突觸後 Cl⁻ 通道 ➔ 過極化產生 IPSP (抑制激發)</div>
                            </button>
                        </div>
                    </div>

                    <div class="bg-slate-950/90 p-3.5 rounded-2xl border border-purple-500/40 space-y-2">
                        <span class="font-bold text-purple-300 block">🧮 2. 軸丘電位加成實驗 (Summation)：</span>
                        <p class="text-[11px] text-slate-300">
                            單次 EPSP 僅讓膜電位上升約 +8mV，不足以跨過 -55mV 閾值。試著<strong>連續快速點擊「疊加 EPSP」</strong>觀察時間加成觸發新動作電位！
                        </p>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="addPostsynapticPotential('epsp')" class="py-2 px-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold shadow transition">
                                ➕ 疊加興奮 EPSP
                            </button>
                            <button onclick="addPostsynapticPotential('ipsp')" class="py-2 px-3 rounded-xl bg-rose-700 hover:bg-rose-600 text-white font-bold shadow transition">
                                ➖ 疊加抑制 IPSP
                            </button>
                        </div>
                    </div>

                    <div class="bg-slate-950/80 p-3.5 rounded-2xl border border-slate-800 space-y-1.5 text-[11px] text-slate-300 leading-relaxed">
                        <div class="font-bold text-amber-300">🔬 突觸傳遞五部曲：</div>
                        <div>① 動作電位抵達軸突末梢突觸小體</div>
                        <div>② 去極化開啟<strong>電壓閘門型 Ca²⁺ 通道</strong>，Ca²⁺ 湧入胞內</div>
                        <div>③ Ca²⁺ 促使<strong>突觸囊泡</strong>與突觸前膜融合（胞吐作用）</div>
                        <div>④ 神經傳導物質擴散穿越<strong>突觸間隙</strong>並結合受體</div>
                        <div>⑤ 開啟<strong>化學閘門型離子通道</strong>，於軸丘總和決定是否發射！</div>
                    </div>
                `;
            }
        }

        window.addEventListener('load', () => {
            resizeCanvas();
            initAPHistory();
            initSynapseHistory();

            const params = new URLSearchParams(window.location.search);
            const t = params.get('tab');
            if (t && ['ap', 'myelin', 'synapse'].includes(t)) {
                switchTab(t);
            } else {
                switchTab('ap');
            }

            window.addEventListener('resize', resizeCanvas);
            drawLoop();
        });
    </script>
</body>
</html>
